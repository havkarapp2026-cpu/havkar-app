<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR - Wallet</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f5f5f5;
    color:#333;
    padding-bottom:90px;
}

.header{
    background:linear-gradient(135deg,#689f38,#7cb342);
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn,
.icon-btn{
    border:0;
    color:white;
    cursor:pointer;
}

.back-btn{
    background:none;
    font-size:24px;
}

.header h1{
    font-size:21px;
}

.icon-btn{
    background:rgba(255,255,255,.2);
    width:40px;
    height:40px;
    border-radius:50%;
}

.balance-card{
    margin:20px;
    padding:25px;
    border-radius:20px;
    color:white;
    background:linear-gradient(135deg,#689f38,#7cb342);
    box-shadow:0 5px 20px rgba(104,159,56,.3);
}

.balance-label{
    font-size:14px;
    opacity:.9;
}

.balance-amount{
    font-size:40px;
    font-weight:800;
    margin:8px 0 22px;
}

.card-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.action-btn{
    border:0;
    border-radius:12px;
    padding:14px 5px;
    color:white;
    background:rgba(255,255,255,.2);
    cursor:pointer;
    font-weight:600;
}

.action-btn i{
    display:block;
    font-size:22px;
    margin-bottom:7px;
}

.section-title{
    padding:20px 20px 10px;
    font-size:19px;
    font-weight:700;
}

.list{
    padding:0 20px;
}

.item{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.circle{
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e8f5e9;
    color:#558b2f;
    font-size:22px;
}

.info{
    flex:1;
}

.name{
    font-weight:700;
    margin-bottom:4px;
}

.small{
    color:#999;
    font-size:13px;
}

.amount{
    text-align:right;
    font-weight:700;
}

.positive{
    color:#558b2f;
}

.negative{
    color:#d32f2f;
}

.loading,
.empty{
    background:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    color:#999;
}

.error{
    margin:15px 20px;
    padding:14px;
    background:#ffebee;
    color:#c62828;
    border-radius:12px;
    word-break:break-word;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:75px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -2px 10px rgba(0,0,0,.1);
    z-index:50;
}

.nav-item{
    color:#999;
    text-align:center;
    font-size:12px;
    cursor:pointer;
}

.nav-item i{
    display:block;
    font-size:21px;
    margin-bottom:5px;
}

.nav-item.active{
    color:#7cb342;
}

/* MODALS */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:20px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#eee;
    font-size:20px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    margin-bottom:15px;
}

.primary{
    width:100%;
    border:0;
    padding:14px;
    border-radius:11px;
    background:#7cb342;
    color:white;
    font-weight:700;
    font-size:16px;
}

.status{
    margin-top:12px;
    padding:10px;
    border-radius:9px;
    display:none;
}

.status.success{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.status.error{
    display:block;
    background:#ffebee;
    color:#c62828;
}

.user-id{
    background:#f4f8ef;
    padding:15px;
    border-radius:12px;
    word-break:break-all;
    font-size:13px;
    margin-bottom:15px;
}

.copy{
    border:0;
    background:#689f38;
    color:white;
    padding:9px 13px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="header">

    <div class="header-left">

        <button class="back-btn"
                onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i>
        </button>

        <h1>Wallet</h1>

    </div>

    <button class="icon-btn"
            onclick="refreshWallet()">
        <i class="fas fa-rotate"></i>
    </button>

</div>


<div id="pageError"></div>


<div class="balance-card">

    <div class="balance-label">
        Total Balance
    </div>

    <div class="balance-amount"
         id="totalBalance">
        €0.00
    </div>

    <div class="card-actions">

        <button class="action-btn"
                onclick="openSend()">
            <i class="fas fa-paper-plane"></i>
            Send
        </button>

        <button class="action-btn"
                onclick="openReceive()">
            <i class="fas fa-download"></i>
            Receive
        </button>

        <button class="action-btn"
                onclick="openExchange()">
            <i class="fas fa-exchange-alt"></i>
            Exchange
        </button>

    </div>

</div>


<div class="section-title">
    Cryptocurrencies
</div>

<div class="list"
     id="walletList">

    <div class="loading">
        Loading wallet...
    </div>

</div>


<div class="section-title">
    Recent Transactions
</div>

<div class="list"
     id="transactionList">

    <div class="loading">
        Loading transactions...
    </div>

</div>


<!-- SEND -->

<div class="modal"
     id="sendModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Send Money</h2>

            <button class="close"
                    onclick="closeModal('sendModal')">
                ×
            </button>

        </div>

        <label>
            Receiver User ID
        </label>

        <input id="receiverId"
               placeholder="Enter User ID">

        <label>
            Amount (€)
        </label>

        <input id="sendAmount"
               type="number"
               min="0.01"
               step="0.01"
               placeholder="0.00">

        <label>
            Note
        </label>

        <textarea id="sendNote"
                  rows="3"
                  placeholder="Optional note"></textarea>

        <button class="primary"
                id="sendButton"
                onclick="sendMoney()">
            Send Money
        </button>

        <div id="sendStatus"
             class="status">
        </div>

    </div>

</div>


<!-- RECEIVE -->

<div class="modal"
     id="receiveModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Receive Money</h2>

            <button class="close"
                    onclick="closeModal('receiveModal')">
                ×
            </button>

        </div>

        <p style="margin-bottom:10px;">
            Your HAVKAR User ID
        </p>

        <div class="user-id"
             id="myUserId">
            Loading...
        </div>

        <button class="copy"
                onclick="copyId()">
            <i class="fas fa-copy"></i>
            Copy ID
        </button>

    </div>

</div>


<!-- EXCHANGE -->

<div class="modal"
     id="exchangeModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Exchange</h2>

            <button class="close"
                    onclick="closeModal('exchangeModal')">
                ×
            </button>

        </div>

        <p style="line-height:1.6;color:#777;">
            Currency exchange is not activated yet.
        </p>

    </div>

</div>


<!-- NAV -->

<div class="bottom-nav">

    <div class="nav-item active">
        <i class="fas fa-wallet"></i>
        Wallet
    </div>

    <div class="nav-item"
         onclick="window.location.href='market.html'">
        <i class="fas fa-chart-line"></i>
        Market
    </div>

    <div class="nav-item"
         onclick="window.location.href='trade.html'">
        <i class="fas fa-exchange-alt"></i>
        Trade
    </div>

    <div class="nav-item"
         onclick="window.location.href='history.html'">
        <i class="fas fa-history"></i>
        History
    </div>

    <div class="nav-item"
         onclick="window.location.href='profile.html'">
        <i class="fas fa-user"></i>
        Profile
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================================
   SUPABASE
================================ */

const supabase = window.supabase.createClient(
    "https://iompzwaxuirvatiibrtb.supabase.com",
    "sb_publishable_oEKE1vl6EkWXdETgy9MjHw_DUTJLN4O"
);

let currentUser = null;


/* ================================
   USER
================================ */

async function getUser(){

    const result =
        await supabase.auth.getUser();

    if(result.error){

        console.error(result.error);

        return null;
    }

    return result.data.user || null;
}


/* ================================
   LOAD WALLET
================================ */

async function loadWallet(){

    const walletList =
        document.getElementById("walletList");

    walletList.innerHTML =
        '<div class="loading">Loading wallet...</div>';

    const user =
        await getUser();

    if(!user){

        currentUser = null;

        document.getElementById("totalBalance")
            .textContent = "€0.00";

        document.getElementById("myUserId")
            .textContent = "Not logged in";

        walletList.innerHTML =
            '<div class="empty">Please log in first.</div>';

        document.getElementById("transactionList")
            .innerHTML =
            '<div class="empty">Please log in first.</div>';

        return;
    }

    currentUser = user;

    document.getElementById("myUserId")
        .textContent = user.id;


    const {
        data,
        error
    } = await supabase
        .from("wallets")
        .select("*")
        .eq("user_id",user.id);


    if(error){

        console.error(
            "Wallet error:",
            error
        );

        walletList.innerHTML =
            `<div class="empty">
                Wallet error:<br><br>
                ${escapeHtml(error.message)}
             </div>`;

        showError(
            "Wallet database error: " +
            error.message
        );

        return;
    }


    const wallets =
        data || [];

    let total = 0;

    wallets.forEach(wallet => {

        const balance =
            Number(wallet.balance || 0);

        total += balance;

    });


    document.getElementById("totalBalance")
        .textContent =
        "€" +
        total.toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );


    renderWallets(wallets);

}


/* ================================
   RENDER
================================ */

function renderWallets(wallets){

    const list =
        document.getElementById("walletList");

    if(!wallets.length){

        list.innerHTML =
            '<div class="empty">No wallets found.</div>';

        return;
    }

    list.innerHTML = "";

    wallets.forEach(wallet => {

        const currency =
            String(
                wallet.currency ||
                wallet.symbol ||
                "EUR"
            ).toUpperCase();

        const balance =
            Number(wallet.balance || 0);

        let icon = "€";

        if(currency === "BTC"){
            icon = "₿";
        }

        if(currency === "ETH"){
            icon = "Ξ";
        }

        if(currency === "USDT"){
            icon = "₮";
        }


        const item =
            document.createElement("div");

        item.className = "item";

        item.innerHTML = `

            <div class="circle">
                ${escapeHtml(icon)}
            </div>

            <div class="info">

                <div class="name">
                    ${escapeHtml(currency)}
                </div>

                <div class="small">
                    HAVKAR Wallet
                </div>

            </div>

            <div class="amount">

                €${balance.toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits:2,
                        maximumFractionDigits:2
                    }
                )}

            </div>
        `;

        list.appendChild(item);

    });

}


/* ================================
   TRANSACTIONS
================================ */

async function loadTransactions(){

    const list =
        document.getElementById("transactionList");

    if(!currentUser){

        list.innerHTML =
            '<div class="empty">Please log in first.</div>';

        return;
    }

    list.innerHTML =
        '<div class="loading">Loading transactions...</div>';


    const {
        data,
        error
    } = await supabase
        .from("wallet_transfers")
        .select("*")
        .or(
            `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(20);


    if(error){

        console.error(
            "Transaction error:",
            error
        );

        list.innerHTML =
            `<div class="empty">
                Transaction error:<br><br>
                ${escapeHtml(error.message)}
             </div>`;

        return;
    }


    if(!data || !data.length){

        list.innerHTML =
            '<div class="empty">No transactions yet.</div>';

        return;
    }


    list.innerHTML = "";


    data.forEach(transaction => {

        const sent =
            transaction.sender_id === currentUser.id;

        const amount =
            Number(transaction.amount || 0);

        const item =
            document.createElement("div");

        item.className = "item";


        const date =
            transaction.created_at
            ? new Date(
                transaction.created_at
              ).toLocaleString()
            : "";


        item.innerHTML = `

            <div class="circle"
                 style="
                    background:${sent ? '#ffebee' : '#e8f5e9'};
                    color:${sent ? '#d32f2f' : '#558b2f'};
                 ">

                <i class="fas ${
                    sent
                    ? 'fa-arrow-up'
                    : 'fa-arrow-down'
                }"></i>

            </div>


            <div class="info">

                <div class="name">

                    ${
                        sent
                        ? 'Sent Money'
                        : 'Received Money'
                    }

                </div>

                <div class="small">

                    ${escapeHtml(date)}

                    ${
                        transaction.note
                        ? ' • ' +
                          escapeHtml(transaction.note)
                        : ''
                    }

                </div>

            </div>


            <div class="amount ${
                sent
                ? 'negative'
                : 'positive'
            }">

                ${sent ? '-' : '+'}
                €${amount.toFixed(2)}

            </div>

        `;

        list.appendChild(item);

    });

}


/* ================================
   SEND
================================ */

function openSend(){

    document.getElementById("sendModal")
        .style.display = "flex";

}


async function sendMoney(){

    if(!currentUser){

        showStatus(
            "sendStatus",
            "Please log in first.",
            "error"
        );

        return;
    }


    const receiverId =
        document.getElementById("receiverId")
            .value.trim();

    const amount =
        Number(
            document.getElementById("sendAmount")
                .value
        );

    const note =
        document.getElementById("sendNote")
            .value.trim();


    if(!receiverId){

        showStatus(
            "sendStatus",
            "Enter the receiver User ID.",
            "error"
        );

        return;
    }


    if(!Number.isFinite(amount) || amount <= 0){

        showStatus(
            "sendStatus",
            "Enter a valid amount.",
            "error"
        );

        return;
    }


    if(receiverId === currentUser.id){

        showStatus(
            "sendStatus",
            "You cannot send money to yourself.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById("sendButton");

    button.disabled = true;
    button.textContent = "Sending...";


    const {
        data,
        error
    } = await supabase.rpc(
        "transfer_money",
        {
            p_receiver_id:receiverId,
            p_amount:amount,
            p_note:note
        }
    );


    if(error){

        console.error(
            "Transfer error:",
            error
        );

        showStatus(
            "sendStatus",
            error.message,
            "error"
        );

        button.disabled = false;
        button.textContent = "Send Money";

        return;
    }


    console.log(
        "Transfer result:",
        data
    );


    showStatus(
        "sendStatus",
        "Money sent successfully.",
        "success"
    );


    document.getElementById("receiverId").value = "";
    document.getElementById("sendAmount").value = "";
    document.getElementById("sendNote").value = "";


    await loadWallet();
    await loadTransactions();


    button.disabled = false;
    button.textContent = "Send Money";

}


/* ================================
   RECEIVE
================================ */

function openReceive(){

    document.getElementById("receiveModal")
        .style.display = "flex";

}


/* ================================
   EXCHANGE
================================ */

function openExchange(){

    document.getElementById("exchangeModal")
        .style.display = "flex";

}


/* ================================
   CLOSE
================================ */

function closeModal(id){

    document.getElementById(id)
        .style.display = "none";

}


/* ================================
   COPY
================================ */

async function copyId(){

    if(!currentUser){

        alert("User ID is not available.");

        return;
    }

    try{

        await navigator.clipboard.writeText(
            currentUser.id
        );

        alert("User ID copied.");

    }
    catch(error){

        alert("Could not copy User ID.");

    }

}


/* ================================
   STATUS
================================ */

function showStatus(id,message,type){

    const element =
        document.getElementById(id);

    element.textContent =
        message;

    element.className =
        "status " + type;

}


/* ================================
   ERROR
================================ */

function showError(message){

    document.getElementById("pageError")
        .innerHTML =
        `<div class="error">
            ${escapeHtml(message)}
         </div>`;

}


/* ================================
   ESCAPE
================================ */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================================
   REFRESH
================================ */

async function refreshWallet(){

    document.getElementById("pageError")
        .innerHTML = "";

    await loadWallet();

    if(currentUser){

        await loadTransactions();

    }

}


/* ================================
   MODAL BACKGROUND
================================ */

document.querySelectorAll(".modal")
    .forEach(modal => {

        modal.addEventListener(
            "click",
            function(event){

                if(event.target === modal){

                    modal.style.display = "none";

                }

            }
        );

    });


/* ================================
   AUTH CHANGE
================================ */

supabase.auth.onAuthStateChange(
    function(event,session){

        if(session && session.user){

            currentUser =
                session.user;

        }
        else{

            currentUser = null;

        }

    }
);


/* ================================
   START
================================ */

async function startWallet(){

    await loadWallet();

    if(currentUser){

        await loadTransactions();

    }

}

startWallet();

</script>

</body>
</html>
