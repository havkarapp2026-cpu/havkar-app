<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="description" content="HAVKAR Buy & Sell marketplace">
<title>HAVKAR — Buy & Sell</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
    --green-950:#0b3d16;
    --green-900:#12551b;
    --green-800:#1b5e20;
    --green-700:#2e7d32;
    --green-600:#43a047;
    --green-500:#4caf50;
    --green-100:#e8f5e9;
    --bg:#f4f7f4;
    --surface:#fff;
    --text:#202522;
    --text-2:#4d554f;
    --muted:#7b827d;
    --border:#e0e5e1;
    --red:#b71c1c;
    --red-bg:#ffebee;
    --shadow:0 4px 18px rgba(0,0,0,.07);
    --shadow-lg:0 10px 30px rgba(0,0,0,.11);
    --header:68px;
    --bottom:76px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:linear-gradient(180deg,#f7faf7 0%,var(--bg) 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom) + 20px);
    -webkit-font-smoothing:antialiased;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
input:focus-visible{
    outline:3px solid rgba(76,175,80,.25);
    outline-offset:2px;
}

.header{
    position:sticky;
    top:0;
    z-index:200;
    min-height:var(--header);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px;
    color:#fff;
    background:linear-gradient(135deg,var(--green-900),var(--green-600));
    box-shadow:0 3px 16px rgba(0,0,0,.16);
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-left{
    min-width:0;
    gap:13px;
}

.header-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:1.2rem;
    font-weight:800;
}

.circle-button{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:#fff;
    background:rgba(255,255,255,.15);
    cursor:pointer;
    transition:.18s ease;
}

.circle-button:hover{
    background:rgba(255,255,255,.24);
}

.circle-button:active{
    transform:scale(.93);
}

.search-panel{
    position:sticky;
    top:var(--header);
    z-index:150;
    background:rgba(255,255,255,.97);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(0,0,0,.05);
}

.search-container{
    padding:14px 20px 10px;
}

.search-box{
    position:relative;
}

.search-icon{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    color:#8b918d;
    pointer-events:none;
}

.search-input{
    width:100%;
    height:51px;
    border:2px solid var(--border);
    border-radius:28px;
    padding:0 48px;
    background:#fff;
    color:var(--text);
    outline:none;
    transition:.2s ease;
}

.search-input:focus{
    border-color:var(--green-600);
    box-shadow:0 0 0 4px rgba(67,160,71,.1);
}

.clear-search{
    position:absolute;
    right:9px;
    top:50%;
    width:35px;
    height:35px;
    transform:translateY(-50%);
    display:none;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#eef1ee;
    color:#687069;
    cursor:pointer;
}

.clear-search.visible{
    display:flex;
}

.filters-wrapper{
    overflow:hidden;
    background:rgba(255,255,255,.97);
}

.filters{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:2px 20px 13px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-button{
    flex:0 0 auto;
    min-height:40px;
    padding:8px 17px;
    border:2px solid var(--border);
    border-radius:23px;
    background:#fff;
    color:var(--text);
    font-size:.88rem;
    font-weight:700;
    white-space:nowrap;
    cursor:pointer;
}

.filter-button.active{
    border-color:var(--green-600);
    background:linear-gradient(135deg,var(--green-600),var(--green-500));
    color:#fff;
    box-shadow:0 4px 12px rgba(67,160,71,.2);
}

.main{
    width:100%;
    max-width:1440px;
    margin:auto;
    padding:18px 20px 40px;
}

.results-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:16px;
}

.results-title{
    font-size:1.05rem;
    font-weight:800;
}

.results-count{
    color:var(--muted);
    font-size:.83rem;
    white-space:nowrap;
}

.ads-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
}

.ad-card{
    position:relative;
    min-width:0;
    overflow:hidden;
    background:#fff;
    border:1px solid rgba(0,0,0,.035);
    border-radius:18px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:.18s ease;
}

.ad-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-lg);
}

.ad-card:active{
    transform:scale(.985);
}

.ad-image{
    position:relative;
    width:100%;
    aspect-ratio:1/.88;
    overflow:hidden;
    background:linear-gradient(135deg,#e7ece8,#f8faf8);
}

.ad-image img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    opacity:0;
    transition:opacity .25s,transform .35s;
}

.ad-image img.loaded{
    opacity:1;
}

.ad-card:hover .ad-image img{
    transform:scale(1.025);
}

.image-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a1aaa3;
    font-size:2.3rem;
}

.image-loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8d968f;
    font-size:1.2rem;
}

.ad-image.has-image .image-placeholder{
    opacity:0;
}

.condition-badge{
    position:absolute;
    top:9px;
    left:9px;
    max-width:calc(100% - 18px);
    padding:5px 9px;
    border-radius:9px;
    background:rgba(0,0,0,.66);
    color:#fff;
    font-size:.66rem;
    font-weight:750;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.ad-info{
    padding:11px 12px 13px;
}

.ad-title{
    min-height:2.55em;
    margin-bottom:6px;
    display:-webkit-box;
    overflow:hidden;
    font-size:.92rem;
    font-weight:750;
    line-height:1.28;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
}

.ad-price{
    margin-bottom:7px;
    color:var(--green-800);
    font-size:1.06rem;
    font-weight:850;
}

.ad-location{
    display:flex;
    align-items:center;
    gap:5px;
    overflow:hidden;
    color:var(--text-2);
    font-size:.75rem;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.ad-location i{
    flex:0 0 auto;
    color:var(--green-600);
}

.ad-meta{
    margin-top:6px;
    overflow:hidden;
    color:#8b938d;
    font-size:.70rem;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.status{
    display:none;
    width:100%;
    padding:65px 20px;
    text-align:center;
}

.status.visible{
    display:block;
}

.status-icon{
    width:66px;
    height:66px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--green-100);
    color:var(--green-700);
    font-size:1.55rem;
}

.status.error .status-icon{
    background:var(--red-bg);
    color:var(--red);
}

.status-title{
    margin-bottom:8px;
    font-size:1.12rem;
    font-weight:800;
}

.status.error .status-title{
    color:var(--red);
}

.status-message{
    max-width:560px;
    margin:0 auto;
    color:var(--muted);
    font-size:.9rem;
    line-height:1.6;
    word-break:break-word;
}

.retry-button{
    margin-top:19px;
    padding:12px 22px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--green-700),var(--green-500));
    color:#fff;
    font-weight:750;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(46,125,50,.28);
}

.retry-button:active{
    transform:scale(.96);
}

.skeleton-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
}

.skeleton-card{
    overflow:hidden;
    border-radius:18px;
    background:#fff;
    box-shadow:var(--shadow);
}

.skeleton-image{
    width:100%;
    aspect-ratio:1/.88;
}

.skeleton-line{
    height:12px;
    margin:12px;
    border-radius:8px;
}

.skeleton-line.small{
    width:42%;
}

.skeleton-line.medium{
    width:72%;
}

.skeleton{
    background:linear-gradient(90deg,#ecefec 25%,#f7f9f7 38%,#ecefec 63%);
    background-size:400% 100%;
    animation:skeletonMove 1.35s ease infinite;
}

@keyframes skeletonMove{
    0%{background-position:100% 50%}
    100%{background-position:0 50%}
}

.fab{
    position:fixed;
    right:20px;
    bottom:calc(var(--bottom) + 18px + env(safe-area-inset-bottom));
    z-index:180;
    width:62px;
    height:62px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--green-900),var(--green-500));
    color:#fff;
    font-size:1.55rem;
    cursor:pointer;
    box-shadow:0 9px 28px rgba(27,94,32,.36);
}

.fab:active{
    transform:scale(.93);
}

.save-button{
    position:absolute;
    top:10px;
    right:10px;
    z-index:20;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,.96);
    color:#707770;
    box-shadow:0 4px 14px rgba(0,0,0,.16);
    cursor:pointer;
    transition:transform .16s ease,color .16s ease,background .16s ease;
}

.save-button:hover{
    transform:scale(1.05);
}

.save-button:active{
    transform:scale(.94);
}

.save-button.saved{
    color:#d32f2f;
    background:#fff;
}

.save-button i{
    font-size:1.1rem;
}

.save-button:focus-visible{
    outline:3px solid rgba(76,175,80,.35);
    outline-offset:2px;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:200;
    height:calc(var(--bottom) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;
    align-items:flex-start;
    justify-content:space-around;
    background:rgba(255,255,255,.98);
    backdrop-filter:blur(16px);
    box-shadow:0 -3px 16px rgba(0,0,0,.1);
}

.nav-item{
    flex:1;
    height:var(--bottom);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#929893;
    font-size:.70rem;
    font-weight:650;
    cursor:pointer;
    user-select:none;
}

.nav-item i{
    font-size:1.27rem;
}

.nav-item.active{
    color:var(--green-600);
}

.toast{
    position:fixed;
    left:50%;
    bottom:calc(var(--bottom) + 18px + env(safe-area-inset-bottom));
    z-index:1000;
    max-width:calc(100vw - 32px);
    padding:13px 18px;
    border-radius:13px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    color:#fff;
    background:#242824;
    font-size:.86rem;
    font-weight:650;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.22);
    transition:.2s ease;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(min-width:650px){
    .ads-grid,
    .skeleton-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:18px;
    }
}

@media(min-width:950px){
    .ads-grid,
    .skeleton-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
        gap:20px;
    }

    .main{
        padding-left:28px;
        padding-right:28px;
    }
}

@media(max-width:500px){
    .header{
        padding:10px 13px;
    }

    .header-title{
        font-size:1.13rem;
    }

    .circle-button{
        width:41px;
        height:41px;
    }

    .search-container{
        padding:12px 12px 9px;
    }

    .filters{
        padding-left:12px;
        padding-right:12px;
        padding-bottom:11px;
    }

    .main{
        padding:15px 12px 32px;
    }

    .ads-grid,
    .skeleton-grid{
        gap:10px;
    }

    .ad-info{
        padding:10px;
    }

    .ad-title{
        font-size:.87rem;
    }

    .ad-price{
        font-size:.98rem;
    }

    .ad-location{
        font-size:.71rem;
    }

    .fab{
        right:16px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        scroll-behavior:auto!important;
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-left">
        <button id="backButton" class="circle-button" type="button" aria-label="Go back">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="header-title">Buy &amp; Sell</h1>
    </div>

    <div class="header-right">
        <button id="notificationButton" class="circle-button" type="button" aria-label="Notifications">
            <i class="fas fa-bell"></i>
        </button>

        <button id="profileButton" class="circle-button" type="button" aria-label="Profile">
            <i class="fas fa-user"></i>
        </button>
    </div>
</header>

<section class="search-panel">
    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>

            <input
                id="searchInput"
                class="search-input"
                type="search"
                autocomplete="off"
                enterkeyhint="search"
                placeholder="Search products, services..."
                aria-label="Search products and services"
            >

            <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search">
                <i class="fas fa-xmark"></i>
            </button>
        </div>
    </div>

    <div class="filters-wrapper">
        <nav id="filters" class="filters" aria-label="Listing categories"></nav>
    </div>
</section>

<main class="main">
    <div class="results-bar">
        <div id="resultsTitle" class="results-title">Latest listings</div>
        <div id="resultsCount" class="results-count">Loading...</div>
    </div>

    <div id="skeletonGrid" class="skeleton-grid"></div>

    <section id="errorStatus" class="status error">
        <div class="status-icon">
            <i class="fas fa-circle-exclamation"></i>
        </div>

        <div class="status-title">Could not load listings</div>

        <div id="errorMessage" class="status-message">
            HAVKAR could not load the listings.
        </div>

        <button id="retryButton" class="retry-button" type="button">
            <i class="fas fa-rotate-right"></i>
            &nbsp; Try again
        </button>
    </section>

    <section id="emptyStatus" class="status">
        <div class="status-icon">
            <i class="fas fa-box-open"></i>
        </div>

        <div class="status-title">No listings found</div>

        <div class="status-message">
            There are no listings matching your search or category.
        </div>
    </section>

    <section id="adsGrid" class="ads-grid" aria-live="polite"></section>
</main>

<button id="addButton" class="fab" type="button" aria-label="Post a new ad">
    <i class="fas fa-plus"></i>
</button>

<nav class="bottom-nav">
    <div class="nav-item active" id="navHome" role="button" tabindex="0">
        <i class="fas fa-house"></i>
        <span>Home</span>
    </div>

    <div class="nav-item" id="navSearch" role="button" tabindex="0">
        <i class="fas fa-magnifying-glass"></i>
        <span>Search</span>
    </div>

    <div class="nav-item" id="navSaved" role="button" tabindex="0">
        <i class="fas fa-heart"></i>
        <span>Saved</span>
    </div>

    <div class="nav-item" id="navMessages" role="button" tabindex="0">
        <i class="fas fa-comment"></i>
        <span>Messages</span>
    </div>

    <div class="nav-item" id="navProfile" role="button" tabindex="0">
        <i class="fas fa-user"></i>
        <span>Profile</span>
    </div>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const SUPABASE_URL =
    "https://gispovnciifgikvgpzck.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq";

let supabaseClient = null;

const state = {
    ads: [],
    filteredAds: [],
    category: "All",
    search: "",
    loading: false,
    requestId: 0,
    imageObservers: [],
    imageCache: new Map(),
    savedOnly: false,
    savedIds: new Set(),
    currentUserId: null,
    authReady: false,
    savedLoading: false,
    savedOperation: false
};

const CATEGORIES = [
    "All",
    "Electronics",
    "Mobile Phones",
    "Phones & Tablets",
    "Computers",
    "TV & Audio",
    "Appliances",
    "Furniture",
    "Home & Garden",
    "Kitchen",
    "Restaurant Equipment",
    "Food & Catering",
    "Tools & Machinery",
    "Vehicles",
    "Cars",
    "Motorcycles",
    "Trucks & Commercial Vehicles",
    "Bicycles",
    "Clothing",
    "Services",
    "Other"
];

const $ = id => document.getElementById(id);

function initializeSupabase(){
    if(supabaseClient){
        return supabaseClient;
    }

    if(
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
    ){
        throw new Error(
            "Supabase library could not be loaded."
        );
    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth:{
                    persistSession:true,
                    autoRefreshToken:true,
                    detectSessionInUrl:true
                }
            }
        );

    return supabaseClient;
}

function escapeHtml(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function showToast(message){
    const toast = $("toast");

    if(!toast){
        return;
    }

    toast.textContent = String(message || "");
    toast.classList.add("show");

    window.clearTimeout(showToast.timer);

    showToast.timer =
        window.setTimeout(
            () => {
                toast.classList.remove("show");
            },
            2600
        );
}

function showStatus(type,message = ""){
    $("errorStatus").classList.remove("visible");
    $("emptyStatus").classList.remove("visible");

    if(type === "error"){
        $("errorMessage").textContent = message;
        $("errorStatus").classList.add("visible");
    }

    if(type === "empty"){
        $("emptyStatus").classList.add("visible");
    }
}

function hideStatuses(){
    $("errorStatus").classList.remove("visible");
    $("emptyStatus").classList.remove("visible");
}

function setLoading(loading){
    state.loading = loading;

    $("skeletonGrid").style.display =
        loading ? "grid" : "none";
}

function renderSkeletons(){
    $("skeletonGrid").innerHTML =
        Array.from(
            {length:6},
            () => `
                <div class="skeleton-card">
                    <div class="skeleton-image skeleton"></div>
                    <div class="skeleton-line medium skeleton"></div>
                    <div class="skeleton-line small skeleton"></div>
                </div>
            `
        ).join("");
}

function renderCategories(){
    $("filters").innerHTML =
        CATEGORIES
            .map(
                category => `
                    <button
                        type="button"
                        class="filter-button ${
                            category === state.category
                                ? "active"
                                : ""
                        }"
                        data-category="${escapeHtml(category)}"
                    >
                        ${escapeHtml(category)}
                    </button>
                `
            )
            .join("");

    $("filters")
        .querySelectorAll(".filter-button")
        .forEach(
            button => {
                button.addEventListener(
                    "click",
                    () => {
                        state.category =
                            button.dataset.category ||
                            "All";

                        state.savedOnly = false;

                        renderCategories();
                        applyFilters();
                    }
                );
            }
        );
}

function formatPrice(value){
    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return "Price on request";
    }

    const numeric = Number(value);

    if(Number.isFinite(numeric)){
        return new Intl.NumberFormat(
            "en-US",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        ).format(numeric) + " €";
    }

    return escapeHtml(String(value));
}

function formatDate(value){
    if(!value){
        return "";
    }

    const date = new Date(value);

    if(Number.isNaN(date.getTime())){
        return "";
    }

    return new Intl.DateTimeFormat(
        undefined,
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ).format(date);
}

async function resolveCurrentUser(){
    initializeSupabase();

    let userId = null;

    try{
        const sessionResult =
            await supabaseClient.auth.getSession();

        userId =
            sessionResult
                ?.data
                ?.session
                ?.user
                ?.id ||
            null;
    }catch(error){
        console.warn(
            "[HAVKAR] getSession failed:",
            error
        );
    }

    if(!userId){
        try{
            const userResult =
                await supabaseClient.auth.getUser();

            userId =
                userResult
                    ?.data
                    ?.user
                    ?.id ||
                null;
        }catch(error){
            console.warn(
                "[HAVKAR] getUser failed:",
                error
            );
        }
    }

    state.currentUserId =
        userId
            ? String(userId)
            : null;

    state.authReady = true;

    return state.currentUserId;
}

async function loadSavedIds(){
    initializeSupabase();

    state.savedLoading = true;

    if(!state.currentUserId){
        state.savedIds = new Set();
        state.savedLoading = false;
        return state.savedIds;
    }

    try{
        const result =
            await supabaseClient
                .from("ad_saves")
                .select("ad_id")
                .eq(
                    "user_id",
                    state.currentUserId
                );

        if(result.error){
            throw result.error;
        }

        const ids = new Set();

        if(Array.isArray(result.data)){
            result.data.forEach(
                row => {
                    if(
                        row?.ad_id !== null &&
                        row?.ad_id !== undefined &&
                        String(row.ad_id).trim()
                    ){
                        ids.add(
                            String(row.ad_id)
                        );
                    }
                }
            );
        }

        state.savedIds = ids;

        return state.savedIds;
    }finally{
        state.savedLoading = false;
    }
}

function isSaved(adId){
    return state.savedIds.has(
        String(adId)
    );
}

async function toggleSaved(adId,event){
    if(event){
        event.preventDefault();
        event.stopPropagation();
    }

    if(!adId){
        return;
    }

    if(state.savedOperation){
        return;
    }

    if(!state.currentUserId){
        showToast(
            "Please sign in to save listings."
        );

        window.setTimeout(
            () => {
                window.location.href =
                    "login.html";
            },
            850
        );

        return;
    }

    initializeSupabase();

    state.savedOperation = true;

    try{
        await loadSavedIds();

        const adKey =
            String(adId);

        if(state.savedIds.has(adKey)){
            const result =
                await supabaseClient
                    .from("ad_saves")
                    .delete()
                    .eq("ad_id",adId)
                    .eq(
                        "user_id",
                        state.currentUserId
                    );

            if(result.error){
                throw result.error;
            }

            state.savedIds.delete(adKey);

            showToast(
                "Removed from Saved"
            );
        }else{
            const result =
                await supabaseClient
                    .from("ad_saves")
                    .insert({
                        ad_id:adId,
                        user_id:state.currentUserId
                    });

            if(result.error){
                if(
                    String(
                        result.error.code ||
                        ""
                    ) === "23505"
                ){
                    await loadSavedIds();

                    if(!state.savedIds.has(adKey)){
                        throw result.error;
                    }
                }else{
                    throw result.error;
                }
            }else{
                state.savedIds.add(adKey);
            }

            showToast(
                "Saved listing"
            );
        }

        applyFilters();

    }catch(error){
        console.error(
            "[HAVKAR] Saved operation failed:",
            error
        );

        const code =
            String(
                error?.code ||
                ""
            );

        const message =
            String(
                error?.message ||
                ""
            ).toLowerCase();

        if(
            code === "42501" ||
            message.includes("permission") ||
            message.includes("policy") ||
            message.includes("row-level")
        ){
            showToast(
                "HAVKAR could not update Saved because of database permissions."
            );
        }else if(
            message.includes("failed to fetch") ||
            message.includes("network")
        ){
            showToast(
                "HAVKAR could not connect to Supabase."
            );
        }else if(
            message.includes("relation") &&
            message.includes("ad_saves")
        ){
            showToast(
                "The HAVKAR Saved database is not available."
            );
        }else{
            showToast(
                "Could not update Saved."
            );
        }
    }finally{
        state.savedOperation = false;
    }
}

function setupAuthListener(){
    initializeSupabase();

    supabaseClient
        .auth
        .onAuthStateChange(
            (event,session) => {
                if(event === "SIGNED_OUT"){
                    state.currentUserId = null;
                    state.savedIds = new Set();
                    state.savedOnly = false;

                    renderCategories();

                    if(state.ads.length){
                        applyFilters();
                    }

                    return;
                }

                if(session?.user?.id){
                    const nextUserId =
                        String(session.user.id);

                    if(
                        nextUserId !==
                        state.currentUserId
                    ){
                        state.currentUserId =
                            nextUserId;

                        loadSavedIds()
                            .then(
                                () => {
                                    if(state.savedOnly){
                                        applyFilters();
                                    }else{
                                        renderAds(
                                            state.filteredAds
                                        );
                                    }
                                }
                            )
                            .catch(
                                error => {
                                    console.error(
                                        "[HAVKAR] Saved refresh failed:",
                                        error
                                    );
                                }
                            );
                    }
                }
            }
        );
}

function getCategoryIcon(category){

        String(
            category || ""
        ).toLowerCase();

    if(
        text.includes("phone") ||
        text.includes("tablet")
    ){
        return "fa-mobile-screen";
    }

    if(text.includes("computer")){
        return "fa-laptop";
    }

    if(
        text.includes("vehicle") ||
        text.includes("car") ||
        text.includes("motor") ||
        text.includes("truck") ||
        text.includes("bicycle")
    ){
        return "fa-car";
    }

    if(text.includes("furniture")){
        return "fa-couch";
    }

    if(text.includes("kitchen")){
        return "fa-kitchen-set";
    }

    if(text.includes("restaurant")){
        return "fa-utensils";
    }

    if(text.includes("clothing")){
        return "fa-shirt";
    }

    if(text.includes("service")){
        return "fa-handshake";
    }

    if(text.includes("tool")){
        return "fa-screwdriver-wrench";
    }

    if(text.includes("food")){
        return "fa-basket-shopping";
    }

    if(text.includes("electronics")){

    }

}

function normalizePhotos(value){
    if(!value){
        return [];
    }

    if(Array.isArray(value)){
        return value.filter(
            item =>
                typeof item === "string" &&
                item.trim()
        );
    }

    if(typeof value === "string"){
        const trimmed =
            value.trim();

        if(!trimmed){
            return [];
        }

        try{
            const parsed =
                JSON.parse(trimmed);

            if(Array.isArray(parsed)){
                return parsed.filter(
                    item =>
                        typeof item === "string" &&
                        item.trim()
                );
            }
        }catch(_){}

        if(
            trimmed.startsWith("data:image/") ||
            trimmed.startsWith("http://") ||
            trimmed.startsWith("https://")
        ){
            return [trimmed];
        }
    }

    return [];
}

async function fetchListings(){
    initializeSupabase();

    const result =
        await Promise.race([
            supabaseClient
                .from("ads")
                .select(
                    "id,title,category,price,location,description,user_id,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                )
                .limit(50),

            new Promise(
                (_,reject) => {
                    window.setTimeout(
                        () => {
                            reject(
                                new Error(
                                    "The listings request timed out after 15 seconds."
                                )
                            );
                        },
                        15000
                    );
                }
            )
        ]);

    if(
        !result ||
        result.error
    ){
        throw (
            result?.error ||
            new Error(
                "Supabase returned no response."
            )
        );
    }

    return Array.isArray(result.data)
        ? result.data
        : [];
}

async function fetchPhotosForAd(adId){
    if(!adId){
        return [];
    }

    if(
        state.imageCache.has(
            String(adId)
        )
    ){
        return state.imageCache.get(
            String(adId)
        );
    }

    initializeSupabase();

    const result =
        await supabaseClient
            .from("ads")
            .select("photos")
            .eq("id",adId)
            .maybeSingle();

    if(result.error){
        console.warn(
            "[HAVKAR] Photo query failed:",
            result.error
        );

        return [];
    }

    const photos =
        normalizePhotos(
            result.data?.photos
        );

    state.imageCache.set(
        String(adId),
        photos
    );

    return photos;
}

function getErrorMessage(error){
    const message =
        String(
            error?.message ||
            error?.details ||
            error?.hint ||
            error ||
            ""
        ).trim();

    const status =
        Number(
            error?.status ||
            error?.statusCode ||
            0
        );

    if(
        status === 401 ||
        status === 403
    ){
        return "Supabase denied access to the listings. Check the public SELECT policy for the ads table.";
    }

    if(status === 404){
        return "The ads table could not be found in Supabase.";
    }

    if(
        /failed to fetch|network|fetch/i.test(
            message
        )
    ){
        return "HAVKAR could not establish a network connection with Supabase. Check the Supabase project and browser connection.";
    }

    if(
        /column .* does not exist/i.test(
            message
        )
    ){
        return "The ads table structure does not match the HAVKAR Buy & Sell page.";
    }

    if(
        /relation .* does not exist|table .* does not exist/i.test(
            message
        )
    ){
        return "The Supabase `ads` table could not be found.";
    }

    if(message){
        return (
            "Supabase error: " +
            message
        );
    }

    return "HAVKAR could not load the listings.";
}

function getSavedErrorMessage(error){
    const message =
        String(
            error?.message ||
            error?.details ||
            error?.hint ||
            error ||
            ""
        ).trim();

    const code =
        String(
            error?.code ||
            ""
        );

    if(code === "42501"){
        return "HAVKAR cannot read your Saved listings because of database permissions.";
    }

    if(
        /failed to fetch|network|fetch/i.test(
            message
        )
    ){
        return "HAVKAR could not connect to Supabase while loading Saved listings.";
    }

    if(
        /relation .*ad_saves|table .*ad_saves/i.test(
            message
        )
    ){
        return "The `ad_saves` table could not be found.";
    }

    if(message){
        return (
            "Saved error: " +
            message
        );
    }

    return "HAVKAR could not load Saved listings.";
}

function setupImageObserver(){
    state.imageObservers
        .forEach(
            observer =>
                observer.disconnect()
        );

    state.imageObservers = [];

    const images =
        $("adsGrid")
            .querySelectorAll(
                ".ad-image[data-image-id]"
            );

    if(!("IntersectionObserver" in window)){
        images.forEach(loadCardImage);
        return;
    }

    const observer =
        new IntersectionObserver(
            entries => {
                entries.forEach(
                    entry => {
                        if(!entry.isIntersecting){
                            return;
                        }

                        observer.unobserve(
                            entry.target
                        );

                        loadCardImage(
                            entry.target
                        );
                    }
                );
            },
            {
                rootMargin:"250px 0px"
            }
        );

    images.forEach(
        element =>
            observer.observe(element)
    );

    state.imageObservers.push(observer);
}

async function loadCardImage(container){
    if(
        !container ||
        container.dataset.loaded === "1"
    ){
        return;
    }

    container.dataset.loaded = "1";

    const adId =
        container.dataset.imageId;

    const image =
        container.querySelector("img");

    const loading =
        container.querySelector(
            ".image-loading"
        );

    try{
        const photos =
            await fetchPhotosForAd(adId);

        const firstPhoto =
            photos[0];

        if(firstPhoto){
            image.src = firstPhoto;

            image.addEventListener(
                "load",
                () => {
                    image.classList.add("loaded");
                    container.classList.add("has-image");

                    if(loading){
                        loading.style.display = "none";
                    }
                },
                {once:true}
            );

            image.addEventListener(
                "error",
                () => {
                    if(loading){
                        loading.style.display = "none";
                    }
                },
                {once:true}
            );
        }else{
            if(loading){
                loading.style.display = "none";
            }
        }
    }catch(error){
        console.warn(
            "[HAVKAR] Could not load ad image:",
            error
        );

        if(loading){
            loading.style.display = "none";
        }
    }
}

function renderAds(list){
    const grid = $("adsGrid");

    state.imageObservers
        .forEach(
            observer =>
                observer.disconnect()
        );

    state.imageObservers = [];

    grid.innerHTML =
        list
            .map(cardHtml)
            .join("");

    $("resultsCount").textContent =
        list.length === 1
            ? "1 listing"
            : `${list.length} listings`;

    if(!list.length){
        showStatus("empty");
    }else{
        hideStatuses();
    }

    grid.querySelectorAll(
        ".ad-card"
    ).forEach(
        card => {
            const open =
                () =>
                    openAd(
                        card.dataset.adId
                    );

            const saveButton =
                card.querySelector(
                    ".save-button"
                );

            if(saveButton){
                saveButton.addEventListener(
                    "click",
                    event => {
                        toggleSaved(
                            saveButton.dataset.saveId,
                            event
                        );
                    }
                );
            }

            card.addEventListener(
                "click",
                open
            );

            card.addEventListener(
                "keydown",
                event => {
                    if(
                        event.key === "Enter" ||
                        event.key === " "
                    ){
                        event.preventDefault();
                        open();
                    }
                }
            );
        }
    );

    setupImageObserver();

    if(
        window.HAVKAR_I18N &&
        typeof window.HAVKAR_I18N.refresh === "function"
    ){
        window.HAVKAR_I18N.refresh();
    }
}

function applyFilters(){
    const search =
        state.search
            .trim()
            .toLowerCase();

    const category =
        state.category;

    state.filteredAds =
        state.ads.filter(
            ad => {
                const categoryMatch =
                    category === "All" ||
                    String(
                        ad.category ||
                        ""
                    ).toLowerCase() ===
                    category.toLowerCase();

                if(!categoryMatch){
                    return false;
                }

                if(
                    state.savedOnly &&
                    !isSaved(ad.id)
                ){
                    return false;
                }

                if(!search){
                    return true;
                }

                const haystack = [
                    ad.title,
                    ad.category,
                    ad.location,
                    ad.description,
                    ad.price
                ]
                    .join(" ")
                    .toLowerCase();

                return haystack.includes(
                    search
                );
            }
        );

    $("resultsTitle").textContent =
        state.savedOnly
            ? "Saved listings"
            : (
                search ||
                category !== "All"
                    ? "Search results"
                    : "Latest listings"
            );

    renderAds(
        state.filteredAds
    );
}

async function loadListings(){
    const requestId =
        ++state.requestId;

    hideStatuses();

    $("adsGrid").innerHTML = "";

    renderSkeletons();

    setLoading(true);

    $("resultsCount").textContent =
        "Loading...";

    try{
        const ads =
            await fetchListings();

        if(
            requestId !==
            state.requestId
        ){
            return;
        }

        state.ads = ads;
        state.imageCache.clear();

        if(state.currentUserId){
            await loadSavedIds();
        }else{
            state.savedIds =
                new Set();
        }

        applyFilters();
    }catch(error){
        if(
            requestId !==
            state.requestId
        ){
            return;
        }

        console.error(
            "[HAVKAR] Listings load failed:",
            error
        );

        state.ads = [];
        state.filteredAds = [];

        $("adsGrid").innerHTML = "";
        $("resultsCount").textContent =
            "Unavailable";

        showStatus(
            "error",
            getErrorMessage(error)
        );
    }finally{
        if(
            requestId ===
            state.requestId
        ){
            setLoading(false);

            $("skeletonGrid").innerHTML = "";
            $("skeletonGrid").style.display =
                "none";
        }
    }
}

function setupSearch(){

        $("searchInput");

    const clear =
        $("clearSearch");

    input.addEventListener(
        "input",
        () => {
            state.search =
                input.value;

            state.savedOnly = false;

            clear.classList.toggle(
                "visible",
                Boolean(input.value)
            );

            applyFilters();

    clear.addEventListener(
        "click",

            input.value = "";
            state.search = "";

            clear.classList.remove(
                "visible"
            );

            applyFilters();
            input.focus();
        }
    );
}

function setupRetry(){
    $("retryButton")
        .addEventListener(
            "click",
            loadListings
        );
}

async function handleInitialHash(){
    const hash =
        String(
            window.location.hash ||
            ""
        ).toLowerCase();

    if(hash !== "#saved"){
        return;
    }

    await showSavedListings();

    try{
        window.history.replaceState(
            null,
            "",
            window.location.pathname +
            window.location.search
        );
    }catch(_){}
}

async function boot(){
    try{
        initializeSupabase();

        await resolveCurrentUser();

        renderCategories();
        setupNavigation();
        setupSearch();
        setupRetry();
        renderSkeletons();
        setupAuthListener();

        await loadListings();
        await handleInitialHash();

    }catch(error){
        console.error(
            "[HAVKAR] Application startup failed:",
            error
        );

        $("skeletonGrid").style.display =
            "none";

        $("resultsCount").textContent =
            "Unavailable";

        showStatus(
            "error",
            getErrorMessage(error)
        );
    }
}

document.addEventListener(
    "DOMContentLoaded",
    boot
);

</script>

<script src="havkar-i18n.js"></script>

</body>
</html>
