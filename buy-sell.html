<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description"
      content="HAVKAR Buy & Sell - Find products, services and local listings.">

<title>HAVKAR - Buy & Sell</title>

     EXTERNAL LIBRARIES
     ========================================================= -->

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<link rel="stylesheet"

      crossorigin="anonymous"
      referrerpolicy="no-referrer">

<style>

/* =========================================================
   DESIGN SYSTEM
   ========================================================= */

:root {

    --primary: #2e7d32;
    --primary-light: #43a047;
    --primary-dark: #1b5e20;

    --primary-soft: #e8f5e9;

    --background: #f5f7f5;
    --surface: #ffffff;

    --text: #202124;
    --muted: #70757a;
    --muted-light: #969b97;

    --border: #e0e4e0;

    --danger: #c62828;
    --danger-bg: #ffebee;

    --shadow-sm:
        0 2px 8px rgba(0,0,0,.06);

    --shadow-md:
        0 6px 20px rgba(0,0,0,.10);

    --radius: 16px;

    --header-height: 68px;
    --nav-height: 72px;

}


/* =========================================================
   RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: var(--background);

    color: var(--text);

    padding-bottom:
        calc(
            var(--nav-height)
            + env(safe-area-inset-bottom)
        );

    -webkit-font-smoothing: antialiased;

}

button,
input {

    font: inherit;

}

button {

    border: 0;

    -webkit-tap-highlight-color:
        transparent;

}

button:focus-visible,
input:focus-visible {

    outline:
        3px solid
        rgba(67,160,71,.25);

    outline-offset: 2px;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    position: sticky;

    top: 0;

    z-index: 100;

    min-height:
        var(--header-height);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        11px 16px;

    color: #fff;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    box-shadow:
        0 2px 12px
        rgba(0,0,0,.14);

}

.header-left {

    display: flex;

    align-items: center;

    gap: 13px;

    min-width: 0;

}

.back-button {

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    color: white;

    background:
        rgba(255,255,255,.15);

    cursor: pointer;

    transition:
        transform .15s ease,
        background .2s ease;

}

.back-button:hover {

    background:
        rgba(255,255,255,.23);

}

.back-button:active {

    transform:
        scale(.93);

}

.back-button i {

    font-size: 1.25rem;

}

.header-title {

    font-size: 1.25rem;

    font-weight: 750;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.header-actions {

    display: flex;

    align-items: center;

    gap: 9px;

}

.header-icon {

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    color: white;

    background:
        rgba(255,255,255,.15);

    cursor: pointer;

    transition:
        transform .15s ease,
        background .2s ease;

}

.header-icon:hover {

    background:
        rgba(255,255,255,.23);

}

.header-icon:active {

    transform:
        scale(.93);

}


/* =========================================================
   SEARCH AREA
   ========================================================= */

.search-area {

    position: sticky;

    top:
        var(--header-height);

    z-index: 90;

    padding:
        13px 14px 11px;

    background:
        rgba(255,255,255,.98);

    border-bottom:
        1px solid rgba(0,0,0,.05);

}

.search-wrapper {

    position: relative;

    width: 100%;

}

.search-icon {

    position: absolute;

    left: 17px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #858a86;

    pointer-events: none;

    z-index: 2;

}

.search-input {

    width: 100%;

    height: 52px;

    padding:
        0 50px 0 46px;

    border:
        2px solid
        var(--border);

    border-radius: 28px;

    background: #fff;

    color: var(--text);

    font-size: 1rem;

    outline: none;

    appearance: none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;

}

.search-input::placeholder {

    color: #8c918d;

}

.search-input:focus {

    border-color:
        var(--primary-light);

    box-shadow:
        0 0 0 4px
        rgba(67,160,71,.10);

}

.clear-search {

    position: absolute;

    right: 9px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 34px;
    height: 34px;

    display: none;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    color: #666;

    background: #f0f2f0;

    cursor: pointer;

}

.clear-search.show {

    display: flex;

}


/* =========================================================
   CATEGORY BAR
   ========================================================= */

.category-bar {

    display: flex;

    align-items: center;

    gap: 9px;

    width: 100%;

    padding:
        2px 14px 13px;

    background: white;

    overflow-x: auto;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

}

.category-bar::-webkit-scrollbar {

    display: none;

}

.category-button {

    flex:
        0 0 auto;

    min-height: 40px;

    padding:
        8px 17px;

    border:
        2px solid
        var(--border);

    border-radius: 22px;

    background: white;

    color: var(--text);

    font-size: .88rem;

    font-weight: 650;

    white-space: nowrap;

    cursor: pointer;

    transition:
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        transform .15s ease;

}

.category-button:hover {

    border-color:
        var(--primary-light);

}

.category-button:active {

    transform:
        scale(.97);

}

.category-button.active {

    color: white;

    background:
        var(--primary-light);

    border-color:
        var(--primary-light);

}


/* =========================================================
   MAIN
   ========================================================= */

.main {

    width: 100%;

    max-width: 1400px;

    margin:
        0 auto;

    padding:
        16px 14px 35px;

}

.results-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom:
        15px;

}

.results-title {

    font-size: 1rem;

    font-weight: 750;

}

.results-count {

    color: var(--muted);

    font-size: .8rem;

    white-space: nowrap;

}


/* =========================================================
   GRID
   ========================================================= */

.ads-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap: 11px;

}


/* =========================================================
   CARD
   ========================================================= */

.ad-card {

    min-width: 0;

    overflow: hidden;

    border-radius:
        var(--radius);

    background:
        var(--surface);

    box-shadow:
        var(--shadow-sm);

    cursor: pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;

}

.ad-card:hover {

    transform:
        translateY(-2px);

    box-shadow:
        var(--shadow-md);

}

.ad-card:active {

    transform:
        scale(.985);

}


/* =========================================================
   IMAGE
   ========================================================= */

.ad-image {

    position: relative;

    width: 100%;

    aspect-ratio:
        1 / .86;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #e8ece8,
            #f7f8f7
        );

}

.ad-image img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

}

.image-placeholder {

    color: #9ba09c;

    font-size: 2.4rem;

}

.ad-image.has-image
.image-placeholder {

    display: none;

}


/* =========================================================
   CARD INFO
   ========================================================= */

.ad-info {

    padding:
        10px;

}

.ad-title {

    min-height:
        2.45em;

    margin-bottom:
        5px;

    color:
        var(--text);

    font-size:
        .9rem;

    font-weight:
        720;

    line-height:
        1.3;

    display:
        -webkit-box;

    -webkit-line-clamp:
        2;

    -webkit-box-orient:
        vertical;

    overflow:
        hidden;

}

.ad-price {

    margin-bottom:
        5px;

    color:
        var(--primary-dark);

    font-size:
        1rem;

    font-weight:
        800;

}

.ad-location {

    display:
        flex;

    align-items:
        center;

    gap:
        5px;

    min-width:
        0;

    color:
        var(--muted);

    font-size:
        .75rem;

}

.ad-location i {

    flex:
        0 0 auto;

    color:
        var(--primary-light);

}

.ad-location span {

    min-width:
        0;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

}

.ad-category {

    margin-top:
        6px;

    color:
        var(--muted-light);

    font-size:
        .7rem;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

}


/* =========================================================
   STATUS
   ========================================================= */

.status {

    display:
        none;

    text-align:
        center;

    padding:
        45px 20px;

}

.status.show {

    display:
        block;

}

.status-icon {

    width:
        62px;

    height:
        62px;

    margin:
        0 auto 15px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        50%;

    background:
        var(--primary-soft);

    color:
        var(--primary);

    font-size:
        1.45rem;

}

.status.error
.status-icon {

    background:
        var(--danger-bg);

    color:
        var(--danger);

}

.status-title {

    margin-bottom:
        7px;

    color:
        var(--text);

    font-size:
        1.05rem;

    font-weight:
        750;

}

.status.error
.status-title {

    color:
        var(--danger);

}

.status-text {

    max-width:
        430px;

    margin:
        0 auto;

    color:
        var(--muted);

    font-size:
        .88rem;

    line-height:
        1.55;

}

.retry-button {

    margin-top:
        18px;

    padding:
        11px 20px;

    border-radius:
        12px;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-light)
        );

    font-weight:
        700;

    cursor:
        pointer;

    box-shadow:
        0 4px 12px
        rgba(46,125,50,.22);

}

.retry-button:active {

    transform:
        scale(.97);

}


/* =========================================================
   SKELETON
   ========================================================= */

.skeleton-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:
        11px;

}

.skeleton-card {

    overflow:
        hidden;

    border-radius:
        var(--radius);

    background:
        white;

    box-shadow:
        var(--shadow-sm);

}

.skeleton {

    background:
        linear-gradient(
            90deg,
            #eeeeee 25%,
            #f8f8f8 37%,
            #eeeeee 63%
        );

    background-size:
        400% 100%;

    animation:
        skeletonMove 1.25s ease infinite;

}

.skeleton-image {

    width:
        100%;

    aspect-ratio:
        1 / .86;

}

.skeleton-line {

    height:
        11px;

    margin:
        11px;

    border-radius:
        6px;

}

.skeleton-line.short {

    width:
        43%;

}

.skeleton-line.medium {

    width:
        70%;

}

@keyframes skeletonMove {

    0% {

        background-position:
            100% 50%;

    }

    100% {

        background-position:
            0 50%;

    }

}


/* =========================================================
   FAB
   ========================================================= */

.fab {

    position:
        fixed;

    right:
        16px;

    bottom:
        calc(
            var(--nav-height)
            + 18px
            + env(safe-area-inset-bottom)
        );

    z-index:
        95;

    width:
        60px;

    height:
        60px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        50%;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    font-size:
        1.55rem;

    cursor:
        pointer;

    box-shadow:
        0 7px 22px
        rgba(46,125,50,.38);

    transition:
        transform .18s ease;

}

.fab:active {

    transform:
        scale(.93);

}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav {

    position:
        fixed;

    left:
        0;

    right:
        0;

    bottom:
        0;

    z-index:
        100;

    height:
        calc(
            var(--nav-height)
            + env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    display:
        flex;

    align-items:
        flex-start;

    justify-content:
        space-around;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:
        0 -2px 12px
        rgba(0,0,0,.10);

}

.nav-item {

    flex:
        1;

    height:
        var(--nav-height);

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        5px;

    color:
        #929792;

    font-size:
        .72rem;

    font-weight:
        550;

    cursor:
        pointer;

}

.nav-item i {

    font-size:
        1.28rem;

}

.nav-item.active {

    color:
        var(--primary-light);

}

.nav-item:active {

    opacity:
        .7;

}


/* =========================================================
   TOAST
   ========================================================= */

.toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        calc(
            var(--nav-height)
            + 25px
            + env(safe-area-inset-bottom)
        );

    z-index:
        1000;

    max-width:
        calc(100vw - 30px);

    padding:
        12px 17px;

    border-radius:
        12px;

    transform:
        translateX(-50%);

    color:
        white;

    background:
        #242624;

    font-size:
        .86rem;

    font-weight:
        600;

    text-align:
        center;

    box-shadow:
        0 8px 28px
        rgba(0,0,0,.22);

    animation:
        toastIn .2s ease;

}

@keyframes toastIn {

    from {

        opacity:
            0;

        transform:
            translate(-50%, 8px);

    }

    to {

        opacity:
            1;

        transform:
            translate(-50%, 0);

    }

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (min-width: 650px) {

    .ads-grid,
    .skeleton-grid {

        grid-template-columns:
            repeat(
                3,
                minmax(0,1fr)
            );

        gap:
            17px;

    }

    .main {

        padding-left:
            20px;

        padding-right:
            20px;

    }

}

@media (min-width: 950px) {

    .ads-grid,
    .skeleton-grid {

        grid-template-columns:
            repeat(
                4,
                minmax(0,1fr)
            );

        gap:
            20px;

    }

}

@media (max-width: 500px) {

    .header {

        padding:
            10px 12px;

    }

    .header-title {

        font-size:
            1.16rem;

    }

    .search-area {

        top:
            64px;

    }

}

</style>

</head>

<!-- =========================================================
     HEADER

<header class="header">

    <div class="header-left">

        <button

let supabaseClient = null;


/* =========================================================
   LOAD SUPABASE SAFELY
   ========================================================= */

function loadSupabaseLibrary() {

    return new Promise(
        function(resolve, reject) {

            if (
                window.supabase &&
                typeof window.supabase.createClient ===
                    "function"
            ) {

                resolve();

                return;

            }


            const existing =
                document.querySelector(
                    'script[data-havkar-supabase]'
                );


            if (existing) {

                existing.addEventListener(
                    "load",
                    function() {

                        if (
                            window.supabase &&
                            typeof window.supabase.createClient ===
                                "function"
                        ) {

                            resolve();

                        }

                        else {

                            reject(
                                new Error(
                                    "Supabase library is unavailable."
                                )
                            );

                        }

                    },
                    {
                        once: true
                    }
                );


                existing.addEventListener(
                    "error",
                    function() {

                        reject(
                            new Error(
                                "Supabase library failed to load."
                            )
                        );

                    },
                    {
                        once: true
                    }
                );


                return;

            }


            const script =
                document.createElement(
                    "script"
                );


            script.src =
                "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

            script.async =
                true;

            script.dataset.havkarSupabase =
                "true";


            script.onload =
                function() {

                    if (
                        window.supabase &&
                        typeof window.supabase.createClient ===
                            "function"
                    ) {

                        resolve();

                    }

                    else {

                        reject(
                            new Error(
                                "Supabase library is unavailable."
                            )
                        );

                    }

                };


            script.onerror =
                function() {

                    reject(
                        new Error(
                            "Could not load Supabase."
                        )
                    );

                };


            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   INITIALIZE SUPABASE
   ========================================================= */

async function initializeSupabase() {

    if (
        state.supabaseReady &&
        supabaseClient
    ) {

        return true;

    }


    await loadSupabaseLibrary();


    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );


    state.supabaseReady =
        true;


    return true;

}

/* =========================================================
   SAFE STRING
   ========================================================= */

function safeString(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value).trim();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return safeString(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   PRICE
   ========================================================= */

function formatPrice(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "Price not specified";

    }


    const number =
        Number(value);


    if (
        !Number.isFinite(number)
    ) {

        return escapeHtml(value);

    }


    return new Intl.NumberFormat(
        "en-US",
        {
            style: "currency",
            currency: "EUR",
            maximumFractionDigits: 2
        }
    ).format(number);

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return new Intl.DateTimeFormat(
        "en-GB",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    ).format(date);

}


/* =========================================================
   PHOTO EXTRACTION
   ========================================================= */

function getFirstImage(ad) {

    if (!ad) {

        return null;

    }


    const photos =
        ad.photos;


    if (
        Array.isArray(photos)
    ) {

        for (
            const photo of photos
        ) {

            if (
                typeof photo === "string" &&
                photo.trim()
            ) {

                return photo.trim();

            }

        }

    }


    if (
        typeof photos === "string" &&
        photos.trim()
    ) {

        const value =
            photos.trim();


        try {

            const parsed =
                JSON.parse(value);


            if (
                Array.isArray(parsed)
            ) {

                for (
                    const photo of parsed
                ) {

                    if (
                        typeof photo === "string" &&
                        photo.trim()
                    ) {

                        return photo.trim();

                    }

                }

            }

        }

        catch (_) {

            if (
                value.startsWith(
                    "http://"
                ) ||
                value.startsWith(
                    "https://"
                )
            ) {

                return value;

            }

        }

    }


    const alternatives = [

        ad.image_url,

        ad.image,

        ad.photo_url,

        ad.thumbnail_url

    ];


    for (
        const value of alternatives
    ) {

        if (
            typeof value === "string" &&
            value.trim()
        ) {

            return value.trim();

        }

    }


    return null;

}

/* =========================================================
   SEARCH TEXT
   ========================================================= */

function getSearchText(ad) {

    return [

        ad.title,

        ad.description,

        ad.location,

        ad.category,

        ad.city,

        ad.region,

        ad.country

    ]

        .map(safeString)

        .join(" ")

        .toLowerCase();

}


/* =========================================================
   FILTER
   ========================================================= */

function applyFilters() {

    const search =
        state.search;


    state.filteredAds =
        state.ads.filter(
            function(ad) {

                const category =
                    safeString(
                        ad.category
                    ).toLowerCase();


                const categoryMatch =

                    state.category ===
                        "All" ||

                    category ===
                        state.category.toLowerCase();


                if (
                    !categoryMatch
                ) {

                    return false;

                }


                if (
                    !search
                ) {

                    return true;

                }


                return getSearchText(
                    ad
                ).includes(
                    search
                );

            }
        );


    updateResultsHeader();

    renderAds(
        state.filteredAds
    );

}


/* =========================================================
   RESULTS HEADER
   ========================================================= */

function updateResultsHeader() {

    const count =
        state.filteredAds.length;


    if (
        state.search
    ) {

        resultsTitle.textContent =
            "Search results";

    }

    else if (
        state.category !==
        "All"
    ) {

        resultsTitle.textContent =
            state.category;

    }

    else {

        resultsTitle.textContent =
            "Latest listings";

    }


    resultsCount.textContent =
        count +
        (
            count === 1
                ? " listing"
                : " listings"
        );

}

    if (!image) {

    }


    return `

        <div class="

            <img
                src="${escapeHtml(image)}"
                alt="${title}"
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer">

                image-placeholder

                <i class="
                    fas
                    fa-image
                "></i>

/* =========================================================
   CARD
   ========================================================= */

function createAdCard(ad) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "ad-card";


    card.setAttribute(
        "role",
        "button"
    );


    card.setAttribute(
        "tabindex",
        "0"
    );


    const id =
        safeString(
            ad.id
        );


    const title =
        safeString(
            ad.title
        ) ||
        "Untitled listing";


    const location =
        safeString(
            ad.location
        ) ||
        safeString(
            ad.city
        ) ||
        "Location not specified";


    const category =
        safeString(
            ad.category
        ) ||
        "Other";


    const date =
        formatDate(
            ad.created_at
        );


    card.innerHTML = `

        ${createImageMarkup(ad)}

        <div class="ad-info">

            <div class="ad-title">

                ${escapeHtml(title)}

            </div>

            <div class="ad-price">

                ${formatPrice(ad.price)}

            </div>

            <div class="ad-location">

                <i class="
                    fas
                    fa-location-dot
                "></i>

                <span>

                    ${escapeHtml(location)}

                </span>

            </div>

            <div class="ad-category">

                ${escapeHtml(category)}

                ${
                    date
                        ? " • " +
                          escapeHtml(date)
                        : ""
                }

            </div>

        </div>

    `;


    const image =
        card.querySelector(
            ".ad-image img"
        );


    if (image) {

        image.addEventListener(
            "error",
            function() {

                const container =
                    image.closest(
                        ".ad-image"
                    );


                if (!container) {

                    return;

                }


                container.classList.remove(
                    "has-image"
                );


                image.remove();

            },
            {
                once: true
            }
        );

    }


    function open() {

        if (!id) {

            showToast(
                "This listing has no valid ID."
            );

            return;

        }


        window.location.href =
            "product.html?id=" +
            encodeURIComponent(id);

    }


    card.addEventListener(
        "click",
        open
    );


    card.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                open();

            }

        }
    );


    return card;

}


/* =========================================================
   RENDER ADS
   ========================================================= */

function renderAds(ads) {

    adsGrid.innerHTML =
        "";


    skeletonGrid.style.display =
        "none";


    if (
        !ads ||
        ads.length === 0
    ) {

        showEmpty();

        return;

    hideStatuses();


    const fragment =
        document.createDocumentFragment();


    for (

        );

    }


    adsGrid.appendChild(
        fragment
    );

}


/* =========================================================
   ERROR MESSAGE
   ========================================================= */

function readableError(error) {

    if (
        !navigator.onLine
    ) {

        return (
            "Your device appears to be offline. " +
            "Check your internet connection and try again."
        );

    }


    const message =
        safeString(
            error &&
            error.message
        );


    const lower =
        message.toLowerCase();


    if (
        lower.includes(
            "failed to fetch"
        )
    ) {

        return (
            "HAVKAR could not connect to the listings server. " +
            "Please try again."
        );

    }


    if (
        lower.includes(
            "timeout"
        )
    ) {

        return (
            "The listings server took too long to respond."
        );

    }


    if (
        lower.includes(
            "permission"
        ) ||
        lower.includes(
            "row level security"
        )
    ) {

        return (
            "The listings database denied access to this request."
        );

    }


    if (
        lower.includes(
            "jwt"
        )
    ) {

        return (
            "The application authentication request was rejected."
        );

    }


    if (message) {

        return message;

    }


    return (
        "An unexpected error occurred while loading listings."
    );

}


/* =========================================================
   TIMEOUT
   ========================================================= */

function withTimeout(
    promise,
    milliseconds
) {

    let timer;


    const timeout =
        new Promise(
            function(_, reject) {

                timer =
                    setTimeout(
                        function() {

                            reject(
                                new Error(
                                    "Request timed out."
                                )
                            );

                        },
                        milliseconds
                    );

            }
        );


    return Promise.race(
        [
            promise,
            timeout
        ]
    )
    .finally(
        function() {

            clearTimeout(
                timer
            );

        }
    );

}


/* =========================================================
   DATABASE REQUEST
   ========================================================= */

async function requestAds() {

    if (!supabaseClient) {

        throw new Error(
            "Supabase is not initialized."
        );

    }


    /*
     * LIMIT IS IMPORTANT.
     *
     * We do not download the entire
     * ads table on every page load.
     */

    const result =
        await withTimeout(

            supabaseClient
                .from("ads")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )
                .limit(
                    ADS_LIMIT
                ),

            REQUEST_TIMEOUT

        );


    if (
        result.error
    ) {

        throw result.error;

    }


    return Array.isArray(
        result.data
    )
        ? result.data
        : [];

}


/* =========================================================
   LOAD ADS
   ========================================================= */

async function loadAds() {

    const currentRequest =
        ++state.requestNumber;


    state.loading =
        true;


    renderSkeletons();


    try {

        if (
            !navigator.onLine
        ) {

            throw new Error(
                "Your device is offline."
            );

        }


        await initializeSupabase();


        let lastError =
            null;


        for (
            let attempt = 1;
            attempt <= 2;
            attempt++
        ) {

            try {

                const data =
                    await requestAds();


                /*
                 * Ignore old requests.
                 */

                if (
                    currentRequest !==
                    state.requestNumber
                ) {

                    return;

                }


                state.ads =
                    data;


                state.loading =
                    false;


                applyFilters();


                return;

            }

            catch (error) {

                lastError =
                    error;


                console.warn(
                    "[HAVKAR] Ads request failed:",
                    attempt,
                    error
                );


                if (
                    attempt < 2
                ) {

                    await new Promise(
                        function(resolve) {

                            setTimeout(
                                resolve,
                                RETRY_DELAY
                            );

                        }
                    );

                }

            }

        }


        throw (
            lastError ||
            new Error(
                "Unable to load listings."
            )
        );

    }

    catch (error) {

        state.loading =
            false;


        console.error(
            "[HAVKAR] Listings error:",
            error
        );


        if (
            currentRequest !==
            state.requestNumber
        ) {

            return;

        }


        showError(
            readableError(error)
        );

    }

}

let toastTimer =

function showToast(message) {

    const old =
        document.querySelector(
            ".toast"
        );


    if (old) {

        old.remove();

    }


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast";


    toast.textContent =
        message;


    document.body.appendChild(
        toast
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.remove();

            },
            2800
        );

}
