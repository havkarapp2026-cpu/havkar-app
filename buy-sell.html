<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#2e7d32">

<meta name="description"
      content="HAVKAR Buy & Sell - Find products, services and local listings.">

<title>HAVKAR - Buy & Sell</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Font Awesome -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* =========================================================
   ROOT
   ========================================================= */

:root {
    --primary: #2e7d32;
    --primary-light: #43a047;
    --primary-dark: #1b5e20;
    --primary-soft: #e8f5e9;

    --background: #f5f7f5;
    --surface: #ffffff;

    --text: #202124;
    --muted: #70757a;
    --border: #e0e0e0;

    --danger: #c62828;
    --danger-bg: #ffebee;

    --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    --shadow-md: 0 5px 18px rgba(0,0,0,.10);

    --radius: 16px;

    --nav-height: 74px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: var(--background);
    color: var(--text);

    padding-bottom:
        calc(var(--nav-height) + env(safe-area-inset-bottom));

    -webkit-font-smoothing: antialiased;
}

button,
input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible {
    outline: 3px solid rgba(67,160,71,.25);
    outline-offset: 2px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;

    min-height: 68px;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        12px 20px;

    box-shadow:
        0 2px 12px rgba(0,0,0,.14);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 14px;

    min-width: 0;
}

.back-btn {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 50%;

    background: rgba(255,255,255,.14);
    color: white;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .15s ease;
}

.back-btn:hover {
    background: rgba(255,255,255,.22);
}

.back-btn:active {
    transform: scale(.94);
}

.back-btn i {
    font-size: 1.25rem;
}

.header h1 {
    font-size: 1.25rem;
    font-weight: 750;

    white-space: nowrap;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.icon-btn {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 50%;

    background: rgba(255,255,255,.16);
    color: white;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .15s ease;
}

.icon-btn:hover {
    background: rgba(255,255,255,.24);
}

.icon-btn:active {
    transform: scale(.94);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-section {
    position: sticky;
    top: 68px;
    z-index: 90;

    background: var(--surface);

    padding:
        14px 20px 12px;

    border-bottom:
        1px solid rgba(0,0,0,.05);
}

.search-wrapper {
    position: relative;
}

.search-icon {
    position: absolute;

    left: 17px;
    top: 50%;

    transform: translateY(-50%);

    color: #888;

    pointer-events: none;
}

.search-input {
    width: 100%;

    height: 50px;

    padding:
        0 48px 0 46px;

    border:
        2px solid var(--border);

    border-radius: 26px;

    background: #fff;

    color: var(--text);

    font-size: 1rem;

    outline: none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.search-input::placeholder {
    color: #8a8a8a;
}

.search-input:focus {
    border-color: var(--primary-light);

    box-shadow:
        0 0 0 4px rgba(67,160,71,.10);
}

.clear-search {
    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    width: 34px;
    height: 34px;

    border: 0;
    border-radius: 50%;

    background: #f1f3f1;

    color: #666;

    cursor: pointer;

    display: none;
}

.clear-search.show {
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   FILTERS
   ========================================================= */

.filters {
    background: var(--surface);

    display: flex;
    align-items: center;

    gap: 9px;

    padding:
        2px 20px 14px;

    overflow-x: auto;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter-btn {
    flex: 0 0 auto;

    min-height: 40px;

    padding:
        8px 17px;

    border:
        2px solid var(--border);

    border-radius: 22px;

    background: white;

    color: var(--text);

    font-size: .9rem;
    font-weight: 650;

    cursor: pointer;

    white-space: nowrap;

    transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease,
        transform .15s ease;
}

.filter-btn:hover {
    border-color: var(--primary-light);
}

.filter-btn:active {
    transform: scale(.97);
}

.filter-btn.active {
    background: var(--primary-light);
    border-color: var(--primary-light);
    color: white;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content {
    width: 100%;
    max-width: 1400px;

    margin: 0 auto;

    padding:
        18px 20px 40px;
}

.results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.results-title {
    font-size: 1rem;
    font-weight: 750;
}

.results-count {
    font-size: .82rem;
    color: var(--muted);
}


/* =========================================================
   ADS GRID
   ========================================================= */

.ads-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 14px;
}


/* =========================================================
   AD CARD
   ========================================================= */

.ad-card {
    position: relative;

    min-width: 0;

    background: var(--surface);

    border-radius: var(--radius);

    overflow: hidden;

    box-shadow: var(--shadow-sm);

    cursor: pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.ad-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
}

.ad-card:active {
    transform: scale(.985);
}


/* =========================================================
   AD IMAGE
   ========================================================= */

.ad-image {
    position: relative;

    width: 100%;

    aspect-ratio: 1 / .86;

    background:
        linear-gradient(
            135deg,
            #e8ece8,
            #f7f8f7
        );

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.ad-image-placeholder {
    color: #9aa09a;
    font-size: 2.6rem;
}

.ad-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    opacity: 0;

    transition: opacity .2s ease;
}

.ad-image img.loaded {
    opacity: 1;
}

.ad-image.no-image img {
    display: none;
}

.ad-condition {
    position: absolute;

    top: 9px;
    left: 9px;

    padding:
        5px 8px;

    border-radius: 8px;

    background:
        rgba(0,0,0,.62);

    color: white;

    font-size: .68rem;
    font-weight: 700;
}


/* =========================================================
   AD INFO
   ========================================================= */

.ad-info {
    padding: 12px;
}

.ad-title {
    color: var(--text);

    font-size: .94rem;
    font-weight: 720;

    line-height: 1.3;

    margin-bottom: 6px;

    display:
        -webkit-box;

    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;

    min-height: 2.45em;
}

.ad-price {
    color: var(--primary-dark);

    font-size: 1.08rem;
    font-weight: 800;

    margin-bottom: 6px;
}

.ad-location {
    display: flex;
    align-items: center;

    gap: 5px;

    color: var(--muted);

    font-size: .77rem;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.ad-location i {
    color: var(--primary-light);
    flex: 0 0 auto;
}

.ad-category {
    margin-top: 7px;

    color: #8a8f8a;

    font-size: .72rem;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   STATUS
   ========================================================= */

.status {
    width: 100%;

    display: none;

    text-align: center;

    padding:
        42px 20px;

    color: var(--muted);
}

.status.show {
    display: block;
}

.status-icon {
    width: 62px;
    height: 62px;

    margin:
        0 auto 15px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--primary-soft);

    color: var(--primary);

    font-size: 1.5rem;
}

.status-title {
    font-size: 1.05rem;
    font-weight: 750;

    margin-bottom: 7px;

    color: var(--text);
}

.status-text {
    max-width: 430px;

    margin: 0 auto;

    font-size: .88rem;
    line-height: 1.55;
}

.status.error .status-icon {
    background: var(--danger-bg);
    color: var(--danger);
}

.status.error .status-title {
    color: var(--danger);
}

.retry-btn {
    margin-top: 18px;

    border: 0;

    border-radius: 12px;

    padding:
        11px 20px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-light)
        );

    color: white;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(46,125,50,.22);
}

.retry-btn:active {
    transform: scale(.97);
}


/* =========================================================
   LOADING SKELETON
   ========================================================= */

.skeleton-card {
    background: white;

    border-radius: var(--radius);

    overflow: hidden;

    box-shadow: var(--shadow-sm);
}

.skeleton {
    background:
        linear-gradient(
            90deg,
            #eeeeee 25%,
            #f7f7f7 37%,
            #eeeeee 63%
        );

    background-size: 400% 100%;

    animation:
        skeleton-loading 1.4s ease infinite;
}

.skeleton-image {
    width: 100%;
    aspect-ratio: 1 / .86;
}

.skeleton-line {
    height: 12px;

    border-radius: 6px;

    margin:
        12px;
}

.skeleton-line.short {
    width: 45%;
}

.skeleton-line.medium {
    width: 70%;
}

@keyframes skeleton-loading {

    0% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0 50%;
    }

}


/* =========================================================
   FAB
   ========================================================= */

.fab-button {
    position: fixed;

    right: 20px;

    bottom:
        calc(
            var(--nav-height)
            + 18px
            + env(safe-area-inset-bottom)
        );

    z-index: 80;

    width: 60px;
    height: 60px;

    border: 0;
    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    color: white;

    font-size: 1.55rem;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 22px rgba(46,125,50,.38);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.fab-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 9px 26px rgba(46,125,50,.45);
}

.fab-button:active {
    transform: scale(.94);
}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 100;

    height:
        calc(
            var(--nav-height)
            + env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    background: rgba(255,255,255,.97);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    display: flex;
    align-items: flex-start;
    justify-content: space-around;

    box-shadow:
        0 -2px 12px rgba(0,0,0,.10);
}

.nav-item {
    flex: 1;

    height: var(--nav-height);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 5px;

    color: #929792;

    font-size: .72rem;
    font-weight: 550;

    cursor: pointer;

    transition:
        color .2s ease;
}

.nav-item i {
    font-size: 1.28rem;
}

.nav-item.active {
    color: var(--primary-light);
}

.nav-item:active {
    opacity: .72;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (min-width: 650px) {

    .ads-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 18px;
    }

}

@media (min-width: 950px) {

    .ads-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));

        gap: 20px;
    }

}

@media (max-width: 500px) {

    .header {
        padding:
            11px 14px;
    }

    .header h1 {
        font-size: 1.16rem;
    }

    .search-section {
        top: 64px;
        padding:
            12px 12px 10px;
    }

    .filters {
        padding:
            2px 12px 12px;
    }

    .content {
        padding:
            14px 12px 30px;
    }

    .ads-grid {
        gap: 11px;
    }

    .ad-info {
        padding: 10px;
    }

    .ad-title {
        font-size: .89rem;
    }

    .ad-price {
        font-size: 1rem;
    }

    .fab-button {
        right: 16px;
    }

}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            class="back-btn"
            type="button"
            aria-label="Back"
            onclick="goHome()">

            <i class="fas fa-arrow-left"></i>

        </button>

        <h1>Buy &amp; Sell</h1>

    </div>


    <div class="header-right">

        <button
            class="icon-btn"
            type="button"
            aria-label="Notifications"
            onclick="showInfo('Notifications are not connected yet.')">

            <i class="fas fa-bell"></i>

        </button>


        <button
            class="icon-btn"
            type="button"
            aria-label="Profile"
            onclick="goProfile()">

            <i class="fas fa-user"></i>

        </button>

    </div>

</header>


<!-- =========================================================
     SEARCH
     ========================================================= -->

<section class="search-section">

    <div class="search-wrapper">

        <i class="fas fa-search search-icon"></i>

        <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="Search products, services..."
            aria-label="Search products and services">

        <button
            id="clearSearch"
            class="clear-search"
            type="button"
            aria-label="Clear search">

            <i class="fas fa-times"></i>

        </button>

    </div>

</section>


<!-- =========================================================
     FILTERS
     ========================================================= -->

<nav
    id="filters"
    class="filters"
    aria-label="Categories">
</nav>


<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="content">

    <div class="results-header">

        <div
            id="resultsTitle"
            class="results-title">
            Latest listings
        </div>

        <div
            id="resultsCount"
            class="results-count">
            —
        </div>

    </div>


    <!-- Loading -->

    <div
        id="loadingStatus"
        class="status show">

        <div class="status-icon">

            <i class="fas fa-spinner fa-spin"></i>

        </div>

        <div class="status-title">
            Loading listings
        </div>

        <div class="status-text">
            Please wait while HAVKAR loads the latest listings.
        </div>

    </div>


    <!-- Error -->

    <div
        id="errorStatus"
        class="status error">

        <div class="status-icon">

            <i class="fas fa-cloud-exclamation"></i>

        </div>

        <div class="status-title">
            Could not load listings
        </div>

        <div
            id="errorText"
            class="status-text">
            Unable to connect to the listings service.
        </div>

        <button
            id="retryButton"
            class="retry-btn"
            type="button">

            <i class="fas fa-rotate-right"></i>
            Try again

        </button>

    </div>


    <!-- Empty -->

    <div
        id="emptyStatus"
        class="status">

        <div class="status-icon">

            <i class="fas fa-box-open"></i>

        </div>

        <div class="status-title">
            No listings found
        </div>

        <div class="status-text">
            There are no listings matching your search or category.
        </div>

    </div>


    <!-- Ads -->

    <div
        id="adsGrid"
        class="ads-grid">
    </div>

</main>


<!-- =========================================================
     ADD LISTING
     ========================================================= -->

<button
    class="fab-button"
    type="button"
    aria-label="Post an ad"
    onclick="goPostAd()">

    <i class="fas fa-plus"></i>

</button>


<!-- =========================================================
     BOTTOM NAV
     ========================================================= -->

<nav class="bottom-nav">

    <div
        class="nav-item active"
        role="button"
        tabindex="0"
        onclick="goHome()">

        <i class="fas fa-home"></i>

        <span>Home</span>

    </div>


    <div
        class="nav-item"
        role="button"
        tabindex="0"
        onclick="focusSearch()">

        <i class="fas fa-search"></i>

        <span>Search</span>

    </div>


    <div
        class="nav-item"
        role="button"
        tabindex="0"
        onclick="showInfo('Saved listings will be connected to your account.')">

        <i class="fas fa-heart"></i>

        <span>Saved</span>

    </div>


    <div
        class="nav-item"
        role="button"
        tabindex="0"
        onclick="showInfo('Messaging will be connected to your account.')">

        <i class="fas fa-comment"></i>

        <span>Messages</span>

    </div>


    <div
        class="nav-item"
        role="button"
        tabindex="0"
        onclick="goProfile()">

        <i class="fas fa-user"></i>

        <span>Profile</span>

    </div>

</nav>


<script>

/* =========================================================
   HAVKAR BUY & SELL
   Production-oriented client
   ========================================================= */


/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
    "https://gispovnciifgikvgpzck.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_h6RUZrukEovZn_N3XLDukw_Ui67UsWG";


/* =========================================================
   SUPABASE CLIENT
   ========================================================= */

let supabaseClient = null;


function initializeSupabase() {

    try {

        if (
            !window.supabase ||
            typeof window.supabase.createClient !== "function"
        ) {

            throw new Error(
                "Supabase library could not be loaded."
            );

        }


        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                }
            );


        return true;

    }

    catch (error) {

        console.error(
            "[HAVKAR] Supabase initialization failed:",
            error
        );

        return false;

    }

}


/* =========================================================
   CATEGORIES
   ========================================================= */

const CATEGORIES = [

    "All",

    "Electronics",
    "Phones & Tablets",
    "Computers",
    "TV & Audio",
    "Appliances",

    "Furniture",
    "Home & Garden",
    "Kitchen",

    "Restaurant Equipment",
    "Food & Catering",
    "Tools & Machinery",

    "Vehicles",
    "Cars",
    "Motorcycles",
    "Trucks & Commercial Vehicles",
    "Bicycles",

    "Real Estate",
    "Jobs & Services",

    "Clothing",
    "Shoes & Accessories",

    "Books",
    "Baby & Kids",

    "Sports & Fitness",
    "Beauty & Health",

    "Pets & Animals",
    "Agriculture",

    "Business & Commercial",

    "Second Hand",
    "Free Items",

    "Other"

];


/* =========================================================
   APPLICATION STATE
   ========================================================= */

const state = {

    ads: [],

    filteredAds: [],

    currentCategory: "All",

    search: "",

    loading: false,

    requestId: 0

};


/* =========================================================
   DOM
   ========================================================= */

const adsGrid =
    document.getElementById("adsGrid");

const filtersContainer =
    document.getElementById("filters");

const searchInput =
    document.getElementById("searchInput");

const clearSearch =
    document.getElementById("clearSearch");

const loadingStatus =
    document.getElementById("loadingStatus");

const errorStatus =
    document.getElementById("errorStatus");

const emptyStatus =
    document.getElementById("emptyStatus");

const errorText =
    document.getElementById("errorText");

const retryButton =
    document.getElementById("retryButton");

const resultsTitle =
    document.getElementById("resultsTitle");

const resultsCount =
    document.getElementById("resultsCount");


/* =========================================================
   NAVIGATION
   ========================================================= */

function goHome() {

    window.location.href =
        "index.html";

}


function goProfile() {

    window.location.href =
        "profile.html";

}


function goPostAd() {

    window.location.href =
        "post-ad.html";

}


function focusSearch() {

    searchInput.focus();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   SAFE HTML
   ========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   SAFE STRING
   ========================================================= */

function safeString(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value).trim();

}


/* =========================================================
   PRICE FORMAT
   ========================================================= */

function formatPrice(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "Price not specified";

    }


    const number =
        Number(value);


    if (!Number.isFinite(number)) {

        return escapeHtml(value);

    }


    return new Intl.NumberFormat(
        "en-US",
        {
            style: "currency",
            currency: "EUR",
            maximumFractionDigits: 2
        }
    ).format(number);

}


/* =========================================================
   IMAGE EXTRACTION
   ========================================================= */

function getFirstImage(ad) {

    if (!ad) {
        return null;
    }


    const photos =
        ad.photos;


    if (Array.isArray(photos)) {

        for (const photo of photos) {

            if (
                typeof photo === "string" &&
                photo.trim()
            ) {

                return photo.trim();

            }

        }

    }


    if (
        typeof photos === "string" &&
        photos.trim()
    ) {

        try {

            const parsed =
                JSON.parse(photos);

            if (Array.isArray(parsed)) {

                for (const photo of parsed) {

                    if (
                        typeof photo === "string" &&
                        photo.trim()
                    ) {

                        return photo.trim();

                    }

                }

            }

        }

        catch (_) {

            /*
             * Some databases may contain
             * a single URL string instead
             * of JSON.
             */

            if (
                photos.startsWith("http://") ||
                photos.startsWith("https://")
            ) {

                return photos.trim();

            }

        }

    }


    if (
        typeof ad.image_url === "string" &&
        ad.image_url.trim()
    ) {

        return ad.image_url.trim();

    }


    if (
        typeof ad.image === "string" &&
        ad.image.trim()
    ) {

        return ad.image.trim();

    }


    return null;

}


/* =========================================================
   DATE FORMAT
   ========================================================= */

function formatDate(value) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (Number.isNaN(date.getTime())) {
        return "";
    }


    return new Intl.DateTimeFormat(
        "en-GB",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    ).format(date);

}


/* =========================================================
   STATUS CONTROL
   ========================================================= */

function hideAllStatuses() {

    loadingStatus.classList.remove("show");
    errorStatus.classList.remove("show");
    emptyStatus.classList.remove("show");

}


function showLoading() {

    hideAllStatuses();

    loadingStatus.classList.add("show");

}


function showError(message) {

    hideAllStatuses();

    errorText.textContent =
        message ||
        "Unable to connect to the listings service.";

    errorStatus.classList.add("show");

}


function showEmpty() {

    hideAllStatuses();

    emptyStatus.classList.add("show");

}


function showSuccessContent() {

    hideAllStatuses();

}


/* =========================================================
   CATEGORY BUTTONS
   ========================================================= */

function createCategoryButtons() {

    filtersContainer.innerHTML = "";


    const fragment =
        document.createDocumentFragment();


    CATEGORIES.forEach(function(category) {

        const button =
            document.createElement("button");


        button.type =
            "button";


        button.className =
            "filter-btn";


        if (
            category ===
            state.currentCategory
        ) {

            button.classList.add("active");

        }


        button.dataset.category =
            category;


        button.textContent =
            category;


        button.addEventListener(
            "click",
            function() {

                setCategory(category);

            }
        );


        fragment.appendChild(button);

    });


    filtersContainer.appendChild(fragment);

}


/* =========================================================
   SET CATEGORY
   ========================================================= */

function setCategory(category) {

    state.currentCategory =
        category;


    document
        .querySelectorAll(".filter-btn")
        .forEach(function(button) {

            button.classList.toggle(
                "active",
                button.dataset.category ===
                    category
            );

        });


    applyFilters();

}


/* =========================================================
   SEARCH
   ========================================================= */

function setupSearch() {

    searchInput.addEventListener(
        "input",
        function() {

            state.search =
                safeString(
                    searchInput.value
                ).toLowerCase();


            clearSearch.classList.toggle(
                "show",
                Boolean(state.search)
            );


            applyFilters();

        }
    );


    clearSearch.addEventListener(
        "click",
        function() {

            searchInput.value =
                "";

            state.search =
                "";

            clearSearch.classList.remove(
                "show"
            );

            applyFilters();

            searchInput.focus();

        }
    );

}


/* =========================================================
   SEARCHABLE TEXT
   ========================================================= */

function getSearchableText(ad) {

    return [

        ad.title,
        ad.description,
        ad.location,
        ad.category,
        ad.city,
        ad.region,
        ad.country

    ]

        .map(safeString)
        .join(" ")
        .toLowerCase();

}


/* =========================================================
   CATEGORY MATCH
   ========================================================= */

function categoryMatches(ad) {

    if (
        state.currentCategory ===
        "All"
    ) {

        return true;

    }


    const category =
        safeString(ad.category);


    return (
        category.toLowerCase() ===
        state.currentCategory.toLowerCase()
    );

}


/* =========================================================
   APPLY FILTERS
   ========================================================= */

function applyFilters() {

    const search =
        state.search;


    state.filteredAds =
        state.ads.filter(
            function(ad) {

                if (
                    !categoryMatches(ad)
                ) {

                    return false;

                }


                if (!search) {

                    return true;

                }


                return getSearchableText(
                    ad
                ).includes(search);

            }
        );


    updateResultsHeader();

    renderAds(
        state.filteredAds
    );

}


/* =========================================================
   RESULTS HEADER
   ========================================================= */

function updateResultsHeader() {

    const count =
        state.filteredAds.length;


    if (state.search) {

        resultsTitle.textContent =
            "Search results";

    }

    else if (
        state.currentCategory !==
        "All"
    ) {

        resultsTitle.textContent =
            state.currentCategory;

    }

    else {

        resultsTitle.textContent =
            "Latest listings";

    }


    resultsCount.textContent =
        count +
        (
            count === 1
                ? " listing"
                : " listings"
        );

}


/* =========================================================
   IMAGE HTML
   ========================================================= */

function createImageHtml(ad) {

    const image =
        getFirstImage(ad);


    const title =
        escapeHtml(
            safeString(ad.title) ||
            "Listing"
        );


    if (!image) {

        return `

            <div class="ad-image no-image">

                <div class="ad-image-placeholder">

                    <i class="fas fa-box-open"></i>

                </div>

            </div>

        `;

    }


    return `

        <div class="ad-image">

            <img
                src="${escapeHtml(image)}"
                alt="${title}"
                loading="lazy"
                referrerpolicy="no-referrer">

            <div class="ad-image-placeholder">

                <i class="fas fa-image"></i>

            </div>

        </div>

    `;

}


/* =========================================================
   CREATE AD CARD
   ========================================================= */

function createAdCard(ad) {

    const card =
        document.createElement("article");


    card.className =
        "ad-card";


    card.setAttribute(
        "role",
        "button"
    );


    card.setAttribute(
        "tabindex",
        "0"
    );


    const id =
        safeString(ad.id);


    card.dataset.id =
        id;


    const title =
        safeString(ad.title) ||
        "Untitled listing";


    const location =
        safeString(ad.location) ||
        safeString(ad.city) ||
        "Location not specified";


    const category =
        safeString(ad.category) ||
        "Other";


    const image =
        getFirstImage(ad);


    const imageMarkup =
        createImageHtml(ad);


    const condition =
        safeString(ad.condition);


    const date =
        formatDate(ad.created_at);


    card.innerHTML = `

        ${imageMarkup}

        <div class="ad-info">

            <div class="ad-title">
                ${escapeHtml(title)}
            </div>

            <div class="ad-price">
                ${formatPrice(ad.price)}
            </div>

            <div class="ad-location">

                <i class="fas fa-location-dot"></i>

                <span>
                    ${escapeHtml(location)}
                </span>

            </div>

            <div class="ad-category">

                ${escapeHtml(category)}

                ${
                    date
                        ? " • " +
                          escapeHtml(date)
                        : ""
                }

            </div>

        </div>

    `;


    const img =
        card.querySelector(
            ".ad-image img"
        );


    if (img) {

        img.addEventListener(
            "load",
            function() {

                img.classList.add(
                    "loaded"
                );

            }
        );


        img.addEventListener(
            "error",
            function() {

                const imageBox =
                    card.querySelector(
                        ".ad-image"
                    );


                if (!imageBox) {
                    return;
                }


                imageBox.classList.add(
                    "no-image"
                );


                img.remove();


                const placeholder =
                    document.createElement(
                        "div"
                    );


                placeholder.className =
                    "ad-image-placeholder";


                placeholder.innerHTML =
                    '<i class="fas fa-image"></i>';


                imageBox.appendChild(
                    placeholder
                );

            }
        );

    }


    card.addEventListener(
        "click",
        function() {

            openProduct(id);

        }
    );


    card.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                openProduct(id);

            }

        }
    );


    return card;

}


/* =========================================================
   RENDER ADS
   ========================================================= */

function renderAds(ads) {

    adsGrid.innerHTML = "";


    if (
        !ads ||
        ads.length === 0
    ) {

        showEmpty();

        return;

    }


    showSuccessContent();


    const fragment =
        document.createDocumentFragment();


    ads.forEach(
        function(ad) {

            fragment.appendChild(
                createAdCard(ad)
            );

        }
    );


    adsGrid.appendChild(
        fragment
    );

}


/* =========================================================
   OPEN PRODUCT
   ========================================================= */

function openProduct(id) {

    if (!id) {

        showInfo(
            "This listing does not have a valid ID."
        );

        return;

    }


    window.location.href =
        "product.html?id=" +
        encodeURIComponent(id);

}


/* =========================================================
   SKELETON
   ========================================================= */

function renderSkeletons(count = 6) {

    adsGrid.innerHTML = "";


    hideAllStatuses();


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const card =
            document.createElement("div");


        card.className =
            "skeleton-card";


        card.innerHTML = `

            <div
                class="skeleton skeleton-image">
            </div>

            <div
                class="skeleton skeleton-line medium">
            </div>

            <div
                class="skeleton skeleton-line short">
            </div>

            <div
                class="skeleton skeleton-line short">
            </div>

        `;


        adsGrid.appendChild(card);

    }

}


/* =========================================================
   NETWORK ERROR DETECTION
   ========================================================= */

function getReadableError(error) {

    if (!navigator.onLine) {

        return (
            "Your device appears to be offline. " +
            "Check your internet connection and try again."
        );

    }


    const message =
        safeString(
            error?.message
        );


    if (
        message.toLowerCase()
            .includes("failed to fetch")
    ) {

        return (
            "HAVKAR could not establish a connection " +
            "with the listings server. " +
            "Please try again."
        );

    }


    if (
        message.toLowerCase()
            .includes("network")
    ) {

        return (
            "A network connection problem occurred " +
            "while loading the listings."
        );

    }


    if (
        message.toLowerCase()
            .includes("jwt")
    ) {

        return (
            "The application authentication response " +
            "was rejected by the server."
        );

    }


    if (
        message.toLowerCase()
            .includes("permission")
    ) {

        return (
            "The listings service denied access " +
            "to the ads data."
        );

    }


    if (message) {

        return message;

    }


    return (
        "An unexpected error occurred " +
        "while loading listings."
    );

}


/* =========================================================
   TIMEOUT HELPER
   ========================================================= */

function withTimeout(
    promise,
    timeoutMs
) {

    return Promise.race([

        promise,

        new Promise(
            function(_, reject) {

                setTimeout(
                    function() {

                        reject(
                            new Error(
                                "Request timed out."
                            )
                        );

                    },
                    timeoutMs
                );

            }
        )

    ]);

}


/* =========================================================
   LOAD ADS - ONE REQUEST
   ========================================================= */

async function fetchAdsOnce() {

    if (!supabaseClient) {

        throw new Error(
            "Supabase is not initialized."
        );

    }


    const result =
        await withTimeout(

            supabaseClient
                .from("ads")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                ),

            15000

        );


    if (result.error) {

        throw result.error;

    }


    return result.data || [];

}


/* =========================================================
   LOAD ADS - RETRY
   ========================================================= */

async function loadAds() {

    const requestId =
        ++state.requestId;


    state.loading =
        true;


    renderSkeletons();


    showLoading();


    try {

        if (!navigator.onLine) {

            throw new Error(
                "Your device is offline."
            );

        }


        if (!supabaseClient) {

            const initialized =
                initializeSupabase();


            if (!initialized) {

                throw new Error(
                    "The listings service could not be initialized."
                );

            }

        }


        let lastError =
            null;


        const attempts =
            2;


        for (
            let attempt = 1;
            attempt <= attempts;
            attempt++
        ) {

            try {

                const data =
                    await fetchAdsOnce();


                if (
                    requestId !==
                    state.requestId
                ) {

                    return;

                }


                state.ads =
                    Array.isArray(data)
                        ? data
                        : [];


                state.loading =
                    false;


                applyFilters();


                return;

            }

            catch (error) {

                lastError =
                    error;


                console.warn(
                    `[HAVKAR] Ads request failed. Attempt ${attempt}/${attempts}`,
                    error
                );


                if (
                    attempt <
                    attempts
                ) {

                    await new Promise(
                        function(resolve) {

                            setTimeout(
                                resolve,
                                900
                            );

                        }
                    );

                }

            }

        }


        throw lastError ||
            new Error(
                "Unable to load ads."
            );

    }

    catch (error) {

        state.loading =
            false;


        console.error(
            "[HAVKAR] Final ads loading error:",
            error
        );


        adsGrid.innerHTML =
            "";


        showError(
            getReadableError(error)
        );

    }

}


/* =========================================================
   RETRY
   ========================================================= */

retryButton.addEventListener(
    "click",
    function() {

        loadAds();

    }
);


/* =========================================================
   ONLINE / OFFLINE
   ========================================================= */

window.addEventListener(
    "online",
    function() {

        if (
            state.ads.length === 0
        ) {

            loadAds();

        }

    }
);


window.addEventListener(
    "offline",
    function() {

        if (
            state.loading
        ) {

            showError(
                "Your internet connection was lost. " +
                "Reconnect and try again."
            );

        }

    }
);


/* =========================================================
   INFO MESSAGE
   ========================================================= */

function showInfo(message) {

    const existing =
        document.getElementById(
            "havkarInfoToast"
        );


    if (existing) {

        existing.remove();

    }


    const toast =
        document.createElement(
            "div"
        );


    toast.id =
        "havkarInfoToast";


    toast.textContent =
        message;


    Object.assign(
        toast.style,
        {

            position: "fixed",

            left: "50%",

            bottom:
                "calc(90px + env(safe-area-inset-bottom))",

            transform:
                "translateX(-50%)",

            zIndex: "1000",

            maxWidth: "calc(100vw - 32px)",

            padding:
                "13px 18px",

            borderRadius:
                "12px",

            background:
                "#242624",

            color:
                "#fff",

            fontSize:
                "14px",

            fontWeight:
                "600",

            textAlign:
                "center",

            boxShadow:
                "0 8px 28px rgba(0,0,0,.22)"

        }
    );


    document.body.appendChild(
        toast
    );


    setTimeout(
        function() {

            toast.remove();

        },
        2800
    );

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

function initializePage() {

    createCategoryButtons();

    setupSearch();

    initializeSupabase();

    loadAds();

}


/* =========================================================
   START
   ========================================================= */

initializePage();

</script>
