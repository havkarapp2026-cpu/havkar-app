<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#2e7d32">

<meta name="description"
      content="HAVKAR Buy & Sell - Find products, services and local listings.">

<title>HAVKAR - Buy & Sell</title>


<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<!-- =========================================================
     FONT AWESOME
     ========================================================= -->

<link rel="preconnect"
      href="https://cdnjs.cloudflare.com">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

/* =========================================================
   DESIGN SYSTEM
   ========================================================= */

:root {

    --primary: #2e7d32;
    --primary-light: #43a047;
    --primary-dark: #1b5e20;
    --primary-soft: #e8f5e9;

    --background: #f5f7f5;
    --surface: #ffffff;

    --text: #202124;
    --muted: #70757a;
    --muted-light: #9aa09a;

    --border: #e0e0e0;

    --danger: #c62828;
    --danger-bg: #ffebee;

    --warning: #ef6c00;
    --warning-bg: #fff3e0;

    --success: #2e7d32;
    --success-bg: #e8f5e9;

    --shadow-sm:
        0 2px 8px rgba(0,0,0,.06);

    --shadow-md:
        0 6px 20px rgba(0,0,0,.10);

    --shadow-lg:
        0 12px 35px rgba(0,0,0,.14);

    --radius:
        16px;

    --nav-height:
        74px;

    --header-height:
        68px;

}


/* =========================================================
   RESET
   ========================================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    padding-bottom:
        calc(
            var(--nav-height)
            + env(safe-area-inset-bottom)
        );

    -webkit-font-smoothing:
        antialiased;

}


button,
input {

    font:
        inherit;

}


button {

    -webkit-tap-highlight-color:
        transparent;

}


button:focus-visible,
input:focus-visible {

    outline:
        3px solid rgba(67,160,71,.25);

    outline-offset:
        2px;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    position:
        sticky;

    top:
        0;

    z-index:
        100;

    min-height:
        var(--header-height);

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    color:
        white;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        11px 20px;

    box-shadow:
        0 2px 12px rgba(0,0,0,.14);

}


.header-left {

    display:
        flex;

    align-items:
        center;

    gap:
        14px;

    min-width:
        0;

}


.back-btn {

    width:
        42px;

    height:
        42px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        0;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.14);

    color:
        white;

    cursor:
        pointer;

    transition:
        transform .15s ease,
        background .2s ease;

}


.back-btn:hover {

    background:
        rgba(255,255,255,.22);

}


.back-btn:active {

    transform:
        scale(.93);

}


.back-btn i {

    font-size:
        1.25rem;

}


.header h1 {

    font-size:
        1.25rem;

    font-weight:
        750;

    white-space:
        nowrap;

}


.header-right {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

}


.icon-btn {

    width:
        42px;

    height:
        42px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        0;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.16);

    color:
        white;

    cursor:
        pointer;

    transition:
        transform .15s ease,
        background .2s ease;

}


.icon-btn:hover {

    background:
        rgba(255,255,255,.24);

}


.icon-btn:active {

    transform:
        scale(.93);

}


/* =========================================================
   SEARCH
   ========================================================= */

.search-section {

    position:
        sticky;

    top:
        var(--header-height);

    z-index:
        90;

    background:
        var(--surface);

    padding:
        13px 20px 11px;

    border-bottom:
        1px solid rgba(0,0,0,.05);

}


.search-wrapper {

    position:
        relative;

}


.search-icon {

    position:
        absolute;

    left:
        17px;

    top:
        50%;

    transform:
        translateY(-50%);

    color:
        #888;

    pointer-events:
        none;

}


.search-input {

    width:
        100%;

    height:
        50px;

    padding:
        0 48px 0 46px;

    border:
        2px solid var(--border);

    border-radius:
        26px;

    background:
        #fff;

    color:
        var(--text);

    font-size:
        1rem;

    outline:
        none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;

}


.search-input:focus {

    border-color:
        var(--primary-light);

    box-shadow:
        0 0 0 4px rgba(67,160,71,.10);

}


.search-input::placeholder {

    color:
        #8a8a8a;

}


.clear-search {

    position:
        absolute;

    right:
        9px;

    top:
        50%;

    transform:
        translateY(-50%);

    width:
        34px;

    height:
        34px;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    border:
        0;

    border-radius:
        50%;

    background:
        #f1f3f1;

    color:
        #666;

    cursor:
        pointer;

}


.clear-search.show {

    display:
        flex;

}


/* =========================================================
   FILTERS
   ========================================================= */

.filters {

    background:
        var(--surface);

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    padding:
        2px 20px 14px;

    overflow-x:
        auto;

    scrollbar-width:
        none;

    -webkit-overflow-scrolling:
        touch;

}


.filters::-webkit-scrollbar {

    display:
        none;

}


.filter-btn {

    flex:
        0 0 auto;

    min-height:
        40px;

    padding:
        8px 17px;

    border:
        2px solid var(--border);

    border-radius:
        22px;

    background:
        white;

    color:
        var(--text);

    font-size:
        .9rem;

    font-weight:
        650;

    cursor:
        pointer;

    white-space:
        nowrap;

    transition:
        background .18s ease,
        color .18s ease,
        border-color .18s ease,
        transform .15s ease;

}


.filter-btn:hover {

    border-color:
        var(--primary-light);

}


.filter-btn:active {

    transform:
        scale(.97);

}


.filter-btn.active {

    background:
        var(--primary-light);

    border-color:
        var(--primary-light);

    color:
        white;

}


/* =========================================================
   CONTENT
   ========================================================= */

.content {

    width:
        100%;

    max-width:
        1400px;

    margin:
        0 auto;

    padding:
        18px 20px 40px;

}


.results-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        15px;

}


.results-title {

    font-size:
        1rem;

    font-weight:
        750;

}


.results-count {

    font-size:
        .82rem;

    color:
        var(--muted);

}


/* =========================================================
   GRID
   ========================================================= */

.ads-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap:
        14px;

}


/* =========================================================
   CARD
   ========================================================= */

.ad-card {

    position:
        relative;

    min-width:
        0;

    background:
        var(--surface);

    border-radius:
        var(--radius);

    overflow:
        hidden;

    box-shadow:
        var(--shadow-sm);

    cursor:
        pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;

}


.ad-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        var(--shadow-md);

}


.ad-card:active {

    transform:
        scale(.985);

}


/* =========================================================
   IMAGE
   ========================================================= */

.ad-image {

    position:
        relative;

    width:
        100%;

    aspect-ratio:
        1 / .86;

    background:
        linear-gradient(
            135deg,
            #e8ece8,
            #f7f8f7
        );

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    overflow:
        hidden;

}


.ad-image-placeholder {

    color:
        var(--muted-light);

    font-size:
        2.5rem;

}


.ad-image img {

    width:
        100%;

    height:
        100%;

    display:
        block;

    object-fit:
        cover;

    opacity:
        0;

    transition:
        opacity .22s ease;

}


.ad-image img.loaded {

    opacity:
        1;

}


/* =========================================================
   IMAGE FAILURE
   ========================================================= */

.ad-image.no-image img {

    display:
        none;

}


/* =========================================================
   INFO
   ========================================================= */

.ad-info {

    padding:
        12px;

}


.ad-title {

    color:
        var(--text);

    font-size:
        .94rem;

    font-weight:
        720;

    line-height:
        1.3;

    margin-bottom:
        6px;

    display:
        -webkit-box;

    -webkit-line-clamp:
        2;

    -webkit-box-orient:
        vertical;

    overflow:
        hidden;

    min-height:
        2.45em;

}


.ad-price {

    color:
        var(--primary-dark);

    font-size:
        1.08rem;

    font-weight:
        800;

    margin-bottom:
        6px;

}


.ad-location {

    display:
        flex;

    align-items:
        center;

    gap:
        5px;

    color:
        var(--muted);

    font-size:
        .77rem;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

}


.ad-location i {

    color:
        var(--primary-light);

    flex:
        0 0 auto;

}


.ad-category {

    margin-top:
        7px;

    color:
        #8a8f8a;

    font-size:
        .72rem;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

}


/* =========================================================
   STATUS
   ========================================================= */

.status {

    width:
        100%;

    display:
        none;

    text-align:
        center;

    padding:
        42px 20px;

}


.status.show {

    display:
        block;

}


.status-icon {

    width:
        62px;

    height:
        62px;

    margin:
        0 auto 15px;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        var(--primary-soft);

    color:
        var(--primary);

    font-size:
        1.5rem;

}


.status-title {

    font-size:
        1.05rem;

    font-weight:
        750;

    margin-bottom:
        7px;

}


.status-text {

    max-width:
        460px;

    margin:
        0 auto;

    color:
        var(--muted);

    font-size:
        .88rem;

    line-height:
        1.55;

}


.status.error .status-icon {

    background:
        var(--danger-bg);

    color:
        var(--danger);

}


.status.error .status-title {

    color:
        var(--danger);

}


.status.warning .status-icon {

    background:
        var(--warning-bg);

    color:
        var(--warning);

}


.retry-btn {

    margin-top:
        18px;

    border:
        0;

    border-radius:
        12px;

    padding:
        11px 20px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-light)
        );

    color:
        white;

    font-weight:
        700;

    cursor:
        pointer;

    box-shadow:
        0 4px 12px rgba(46,125,50,.22);

}


.retry-btn:active {

    transform:
        scale(.97);

}


/* =========================================================
   SKELETON
   ========================================================= */

.skeleton-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:
        14px;

}


.skeleton-card {

    overflow:
        hidden;

    border-radius:
        var(--radius);

    background:
        white;

    box-shadow:
        var(--shadow-sm);

}


.skeleton {

    background:
        linear-gradient(
            90deg,
            #eeeeee 25%,
            #f8f8f8 37%,
            #eeeeee 63%
        );

    background-size:
        400% 100%;

    animation:
        skeleton-loading 1.35s ease infinite;

}


.skeleton-image {

    width:
        100%;

    aspect-ratio:
        1 / .86;

}


.skeleton-line {

    height:
        12px;

    border-radius:
        6px;

    margin:
        12px;

}


.skeleton-line.medium {

    width:
        70%;

}


.skeleton-line.short {

    width:
        45%;

}


@keyframes skeleton-loading {

    0% {
        background-position:
            100% 50%;
    }

    100% {
        background-position:
            0 50%;
    }

}


/* =========================================================
   FAB
   ========================================================= */

.fab-button {

    position:
        fixed;

    right:
        20px;

    bottom:
        calc(
            var(--nav-height)
            + 18px
            + env(safe-area-inset-bottom)
        );

    z-index:
        80;

    width:
        60px;

    height:
        60px;

    border:
        0;

    border-radius:
        50%;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    color:
        white;

    font-size:
        1.55rem;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    cursor:
        pointer;

    box-shadow:
        0 7px 22px rgba(46,125,50,.38);

    transition:
        transform .18s ease;

}


.fab-button:hover {

    transform:
        translateY(-2px);

}


.fab-button:active {

    transform:
        scale(.94);

}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {

    position:
        fixed;

    left:
        0;

    right:
        0;

    bottom:
        0;

    z-index:
        100;

    height:
        calc(
            var(--nav-height)
            + env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    display:
        flex;

    align-items:
        flex-start;

    justify-content:
        space-around;

    box-shadow:
        0 -2px 12px rgba(0,0,0,.10);

}


.nav-item {

    flex:
        1;

    height:
        var(--nav-height);

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        5px;

    color:
        #929792;

    font-size:
        .72rem;

    font-weight:
        550;

    cursor:
        pointer;

}


.nav-item i {

    font-size:
        1.28rem;

}


.nav-item.active {

    color:
        var(--primary-light);

}


.nav-item:active {

    opacity:
        .72;

}


/* =========================================================
   TOAST
   ========================================================= */

.toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        calc(
            var(--nav-height)
            + 16px
            + env(safe-area-inset-bottom)
        );

    transform:
        translate(-50%, 20px);

    z-index:
        1000;

    max-width:
        calc(100vw - 32px);

    padding:
        12px 17px;

    border-radius:
        12px;

    background:
        #242624;

    color:
        white;

    font-size:
        14px;

    font-weight:
        600;

    text-align:
        center;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity .2s ease,
        transform .2s ease;

}


.toast.show {

    opacity:
        1;

    transform:
        translate(-50%, 0);

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (min-width:650px) {

    .ads-grid,
    .skeleton-grid {

        grid-template-columns:
            repeat(3,minmax(0,1fr));

        gap:
            18px;

    }

}


@media (min-width:950px) {

    .ads-grid,
    .skeleton-grid {

        grid-template-columns:
            repeat(4,minmax(0,1fr));

        gap:
            20px;

    }

}


@media (max-width:500px) {

    .header {

        padding:
            10px 14px;

    }

    .header h1 {

        font-size:
            1.16rem;

    }

    .search-section {

        top:
            64px;

        padding:
            11px 12px 9px;

    }

    .filters {

        padding:
            2px 12px 12px;

    }

    .content {

        padding:
            14px 12px 30px;

    }

    .ads-grid,
    .skeleton-grid {

        gap:
            11px;

    }

    .ad-info {

        padding:
            10px;

    }

    .ad-title {

        font-size:
            .89rem;

    }

    .ad-price {

        font-size:
            1rem;

    }

    .fab-button {

        right:
            16px;

    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;

        transition-duration:
            .01ms !important;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-btn"
            type="button"
            aria-label="Back">

            <i class="fas fa-arrow-left"></i>

        </button>


        <h1>
            Buy &amp; Sell
        </h1>

    </div>


    <div class="header-right">

        <button
            class="icon-btn"
            type="button"
            aria-label="Notifications"
            id="notificationButton">

            <i class="fas fa-bell"></i>

        </button>


        <button
            class="icon-btn"
            type="button"
            aria-label="Profile"
            id="profileButton">

            <i class="fas fa-user"></i>

        </button>

    </div>

</header>


<!-- =========================================================
     SEARCH
     ========================================================= -->

<section class="search-section">

    <div class="search-wrapper">

        <i class="fas fa-search search-icon"></i>


        <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="Search products, services..."
            aria-label="Search products and services">


        <button
            id="clearSearch"
            class="clear-search"
            type="button"
            aria-label="Clear search">

            <i class="fas fa-times"></i>

        </button>

    </div>

</section>


<!-- =========================================================
     FILTERS
     ========================================================= -->

<nav
    id="filters"
    class="filters"
    aria-label="Categories">
</nav>


<!-- =========================================================
     CONTENT
     ========================================================= -->

<main class="content">


    <div class="results-header">

        <div
            id="resultsTitle"
            class="results-title">

            Latest listings

        </div>


        <div
            id="resultsCount"
            class="results-count">

            —

        </div>

    </div>


    <!-- =====================================================
         LOADING
         ===================================================== -->

    <div
        id="loadingStatus"
        class="status">

        <div class="status-icon">

            <i class="fas fa-spinner fa-spin"></i>

        </div>


        <div class="status-title">

            Loading listings

        </div>


        <div class="status-text">

            Please wait while HAVKAR loads the latest listings.

        </div>

    </div>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
        id="errorStatus"
        class="status error">

        <div class="status-icon">

            <i class="fas fa-triangle-exclamation"></i>

        </div>


        <div class="status-title">

            Could not load listings

        </div>


        <div
            id="errorText"
            class="status-text">

            Unable to connect to the listings service.

        </div>


        <button
            id="retryButton"
            class="retry-btn"
            type="button">

            <i class="fas fa-rotate-right"></i>

            Try again

        </button>

    </div>


    <!-- =====================================================
         EMPTY
         ===================================================== -->

    <div
        id="emptyStatus"
        class="status">

        <div class="status-icon">

            <i class="fas fa-box-open"></i>

        </div>


        <div class="status-title">

            No listings found

        </div>


        <div class="status-text">

            There are no listings matching your search or category.

        </div>

    </div>


    <!-- =====================================================
         SKELETON
         ===================================================== -->

    <div
        id="skeletonGrid"
        class="skeleton-grid">

    </div>


    <!-- =====================================================
         ADS
         ===================================================== -->

    <div
        id="adsGrid"
        class="ads-grid">

    </div>


</main>


<!-- =========================================================
     ADD LISTING
     ========================================================= -->

<button
    id="postAdButton"
    class="fab-button"
    type="button"
    aria-label="Post an ad">

    <i class="fas fa-plus"></i>

</button>

/* =========================================================
   SUPABASE
   ========================================================= */

let supabaseClient = null;


function initializeSupabase() {

    if (supabaseClient) {

        return true;

    }


    try {

        if (
            !window.supabase ||
            typeof window.supabase.createClient !==
                "function"
        ) {

            throw new Error(
                "Supabase library is unavailable."
            );

        }


        supabaseClient =
            window.supabase.createClient(
                CONFIG.SUPABASE_URL,
                CONFIG.SUPABASE_KEY,
                {

                    auth: {

                        persistSession:
                            true,

                        autoRefreshToken:
                            true,

                        detectSessionInUrl:
                            true

                    },

                    global: {

                        headers: {

                            "x-client-info":
                                "havkar-buy-sell"

                        }

                    }

                }
            );


        return true;

    }

    catch (error) {

        console.error(
            "[HAVKAR] Supabase initialization error:",
            error
        );

        return false;

    }

}

/* =========================================================
   SAFE STRING
   ========================================================= */

function safeString(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value).trim();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return safeString(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   PRICE
   ========================================================= */

function formatPrice(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "Price not specified";

    }


    const number =
        Number(value);


    if (!Number.isFinite(number)) {

        return escapeHtml(
            value
        );

    }


    return new Intl.NumberFormat(
        "en-US",
        {

            style:
                "currency",

            currency:
                "EUR",

            maximumFractionDigits:
                2

        }
    ).format(number);

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return new Intl.DateTimeFormat(
        "en-GB",
        {

            day:
                "numeric",

            month:
                "short",

            year:
                "numeric"

        }
    ).format(date);

}


/* =========================================================
   IMAGE EXTRACTION
   ========================================================= */

function getFirstImage(ad) {

    if (!ad) {

        return null;

    }


    const photos =
        ad.photos;


    /* Array */

    if (
        Array.isArray(photos)
    ) {

        for (
            const photo of photos
        ) {

            if (
                typeof photo ===
                    "string" &&
                photo.trim()
            ) {

                return photo.trim();

            }

        }

    }


    /* JSON string */

    if (
        typeof photos ===
            "string" &&
        photos.trim()
    ) {

        const raw =
            photos.trim();


        try {

            const parsed =
                JSON.parse(raw);


            if (
                Array.isArray(parsed)
            ) {

                for (
                    const photo of parsed
                ) {

                    if (
                        typeof photo ===
                            "string" &&
                        photo.trim()
                    ) {

                        return photo.trim();

                    }

                }

            }

        }

        catch (_) {

            if (
                /^https?:\/\//i.test(
                    raw
                )
            ) {

                return raw;

            }

        }

    }


    /* Alternative fields */

    const alternatives = [

        ad.image_url,
        ad.image,
        ad.thumbnail,
        ad.photo_url

    ];


    for (
        const value of alternatives
    ) {

        if (
            typeof value ===
                "string" &&
            value.trim()
        ) {

            return value.trim();

        }

    }


    return null;

}

/* =========================================================
   CATEGORY
   ========================================================= */

function setCategory(category) {

    state.currentCategory =
        category;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            function(button) {

                button.classList.toggle(
                    "active",
                    button.dataset.category ===
                        category
                );

            }
        );


    applyFilters();

}


/* =========================================================
   SEARCH
   ========================================================= */

function setupSearch() {

    DOM.searchInput.addEventListener(
        "input",
        function() {

            state.search =
                safeString(
                    DOM.searchInput.value
                ).toLowerCase();


            DOM.clearSearch.classList.toggle(
                "show",
                Boolean(state.search)
            );


            applyFilters();

        }
    );


    DOM.clearSearch.addEventListener(
        "click",
        function() {

            DOM.searchInput.value =
                "";

            state.search =
                "";

            DOM.clearSearch.classList.remove(
                "show"
            );


            applyFilters();

            DOM.searchInput.focus();

        }
    );

}


/* =========================================================
   SEARCH TEXT
   ========================================================= */

function getSearchableText(ad) {

    return [

        ad.title,
        ad.description,
        ad.location,
        ad.category,
        ad.city,
        ad.region,
        ad.country,
        ad.condition

    ]

        .map(safeString)

        .join(" ")

        .toLowerCase();

}


/* =========================================================
   CATEGORY MATCH
   ========================================================= */

function categoryMatches(ad) {

    if (
        state.currentCategory ===
        "All"
    ) {

        return true;

    }


    return safeString(
        ad.category
    ).toLowerCase() ===
        state.currentCategory.toLowerCase();

}


/* =========================================================
   FILTERS
   ========================================================= */

function applyFilters() {

    const search =
        state.search;


    state.filteredAds =
        state.ads.filter(
            function(ad) {

                if (
                    !categoryMatches(
                        ad
                    )
                ) {

                    return false;

                }


                if (!search) {

                    return true;

                }


                return getSearchableText(
                    ad
                ).includes(
                    search
                );

            }
        );


    updateResultsHeader();

    renderAds(
        state.filteredAds
    );

}


/* =========================================================
   HEADER
   ========================================================= */

function updateResultsHeader() {

    const count =
        state.filteredAds.length;


    if (state.search) {

        DOM.resultsTitle.textContent =
            "Search results";

    }

    else if (
        state.currentCategory !==
            "All"
    ) {

        DOM.resultsTitle.textContent =
            state.currentCategory;

    }

    else {

        DOM.resultsTitle.textContent =
            "Latest listings";

    }


    DOM.resultsCount.textContent =
        count +
        (
            count === 1
                ? " listing"
                : " listings"
        );

}


/* =========================================================
   IMAGE MARKUP
   ========================================================= */

function createImageMarkup(ad) {

    const image =
        getFirstImage(ad);


    const title =
        escapeHtml(
            safeString(
                ad.title
            ) ||
            "Listing"
        );


    if (!image) {

        return `

            <div class="ad-image no-image">

                <div class="ad-image-placeholder">

                    <i class="fas fa-box-open"></i>

                </div>

            </div>

        `;

    }


    return `

        <div class="ad-image">

            <img
                src="${escapeHtml(image)}"
                alt="${title}"
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer">

            <div class="ad-image-placeholder">

                <i class="fas fa-image"></i>

            </div>

        </div>

    `;

}


/* =========================================================
   AD CARD
   ========================================================= */

function createAdCard(ad) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "ad-card";


    card.setAttribute(
        "role",
        "button"
    );


    card.setAttribute(
        "tabindex",
        "0"
    );


    const id =
        safeString(
            ad.id
        );


    const title =
        safeString(
            ad.title
        ) ||
        "Untitled listing";


    const location =
        safeString(
            ad.location
        ) ||
        safeString(
            ad.city
        ) ||
        "Location not specified";


    const category =
        safeString(
            ad.category
        ) ||
        "Other";


    const date =
        formatDate(
            ad.created_at
        );


    card.dataset.id =
        id;


    card.innerHTML = `

        ${createImageMarkup(ad)}

        <div class="ad-info">

            <div class="ad-title">
                ${escapeHtml(title)}
            </div>

            <div class="ad-price">
                ${formatPrice(ad.price)}
            </div>

            <div class="ad-location">

                <i class="fas fa-location-dot"></i>

                <span>
                    ${escapeHtml(location)}
                </span>

            </div>

            <div class="ad-category">

                ${escapeHtml(category)}

                ${
                    date
                        ? " • " +
                          escapeHtml(date)
                        : ""
                }

            </div>

        </div>

    `;


    const image =
        card.querySelector(
            ".ad-image img"
        );


    if (image) {

        image.addEventListener(
            "load",
            function() {

                image.classList.add(
                    "loaded"
                );

            },
            {
                once:
                    true
            }
        );


        image.addEventListener(
            "error",
            function() {

                const box =
                    card.querySelector(
                        ".ad-image"
                    );


                if (!box) {

                    return;

                }


                box.classList.add(
                    "no-image"
                );


                image.remove();

            },
            {
                once:
                    true
            }
        );

    }


    card.addEventListener(
        "click",
        function() {

            openProduct(
                id
            );

        }
    );


    card.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                    "Enter" ||
                event.key ===
                    " "
            ) {

                event.preventDefault();

                openProduct(
                    id
                );

            }

        }
    );


    return card;

}


/* =========================================================
   RENDER ADS
   ========================================================= */

function renderAds(ads) {

    DOM.adsGrid.innerHTML =
        "";


    DOM.skeletonGrid.innerHTML =
        "";


    if (
        !ads ||
        ads.length === 0
    ) {

        if (
            state.ads.length ===
                0 &&
            !state.loading
        ) {

            showEmpty();

        }

        else if (
            state.ads.length >
                0
        ) {

            showEmpty();

        }


        return;

    }


    showContent();


    const fragment =
        document.createDocumentFragment();


    for (
        const ad of ads
    ) {

        fragment.appendChild(
            createAdCard(
                ad
            )
        );

    }


    DOM.adsGrid.appendChild(
        fragment
    );

}


/* =========================================================
   OPEN PRODUCT
   ========================================================= */

function openProduct(id) {

    if (!id) {

        showInfo(
            "This listing does not have a valid ID."
        );

        return;

    }


    window.location.href =
        "product.html?id=" +
        encodeURIComponent(
            id
        );

}


/* =========================================================
   TIMEOUT
   ========================================================= */

function createTimeoutPromise(
    milliseconds
) {

    return new Promise(
        function(_, reject) {

            setTimeout(
                function() {

                    reject(
                        new Error(
                            "REQUEST_TIMEOUT"
                        )
                    );

                },
                milliseconds
            );

        }
    );

}


/* =========================================================
   FETCH ADS
   ========================================================= */

async function fetchAdsOnce() {

    if (!supabaseClient) {

        throw new Error(
            "SUPABASE_NOT_INITIALIZED"
        );

    }


    /*
     * The request intentionally has a limit.
     *
     * The old implementation requested
     * the complete ads table with no limit.
     *
     * That becomes increasingly expensive
     * as HAVKAR grows.
     */

    const query =
        supabaseClient
            .from(
                CONFIG.ADS_TABLE
            )
            .select("*")
            .order(
                "created_at",
                {
                    ascending:
                        false
                }
            )
            .limit(
                CONFIG.MAX_LISTINGS
            );


    /*
     * Supabase/PostgREST supports
     * abortSignal on the request builder.
     */

    if (
        typeof query.abortSignal ===
            "function"
    ) {

        const controller =
            new AbortController();


        state.controller =
            controller;


        query.abortSignal(
            controller.signal
        );


        const timeout =
            setTimeout(
                function() {

                    controller.abort();

                },
                CONFIG.REQUEST_TIMEOUT
            );


        try {

            const result =
                await query;


            clearTimeout(
                timeout
            );


            return result;

        }

        catch (error) {

            clearTimeout(
                timeout
            );

            throw error;

        }

        finally {

            if (
                state.controller ===
                    controller
            ) {

                state.controller =
                    null;

            }

        }

    }


    /*
     * Compatibility fallback.
     */

    return await Promise.race([

        query,

        createTimeoutPromise(
            CONFIG.REQUEST_TIMEOUT
        )

    ]);

}


/* =========================================================
   ERROR CLASSIFICATION
   ========================================================= */

function classifyError(error) {

    const raw =
        safeString(
            error?.message
        );


    const lower =
        raw.toLowerCase();


    if (
        error?.name ===
            "AbortError" ||
        raw ===
            "REQUEST_TIMEOUT"
    ) {

        return {

            type:
                "timeout",

            message:
                "The listings server took too long to respond. Please try again."

        };

    }


    if (
        !navigator.onLine
    ) {

        return {

            type:
                "offline",

            message:
                "Your device is offline. Check your internet connection."

        };

    }


    if (
        lower.includes(
            "failed to fetch"
        ) ||
        lower.includes(
            "networkerror"
        ) ||
        lower.includes(
            "network error"
        ) ||
        lower.includes(
            "load failed"
        )
    ) {

        return {

            type:
                "network",

            message:
                "HAVKAR could not connect to the listings server."

        };

    }


    if (
        lower.includes(
            "permission"
        ) ||
        lower.includes(
            "row-level security"
        ) ||
        error?.code ===
            "42501"
    ) {

        return {

            type:
                "permission",

            message:
                "The listings database denied access to this data."

        };

    }


    if (
        error?.status ===
            401 ||
        error?.status ===
            403
    ) {

        return {

            type:
                "permission",

            message:
                "The listings service rejected the request."

        };

    }


    if (
        error?.status >=
            500
    ) {

        return {

            type:
                "server",

            message:
                "The listings server is temporarily unavailable."

        };

    }


    if (
        error?.code
    ) {

        return {

            type:
                "database",

            message:
                "The listings database returned an error (" +
                error.code +
                ")."

        };

    }


    return {

        type:
            "unknown",

        message:
            raw ||
            "An unexpected error occurred while loading listings."

    };

}


/* =========================================================
   CACHE
   ========================================================= */

function saveCache(
    ads
) {

    try {

        const payload = {

            timestamp:
                Date.now(),

            ads:
                ads

        };


        sessionStorage.setItem(
            CONFIG.CACHE_KEY,
            JSON.stringify(
                payload
            )
        );

    }

    catch (error) {

        console.warn(
            "[HAVKAR] Cache write failed:",
            error
        );

    }

}


/* =========================================================
   CACHE READ
   ========================================================= */

function readCache() {

    try {

        const raw =
            sessionStorage.getItem(
                CONFIG.CACHE_KEY
            );


        if (!raw) {

            return null;

        }


        const parsed =
            JSON.parse(
                raw
            );


        if (
            !parsed ||
            !Array.isArray(
                parsed.ads
            )
        ) {

            return null;

        }


        const age =
            Date.now() -
            Number(
                parsed.timestamp
            );


        if (
            age >
            CONFIG.CACHE_TTL
        ) {

            return null;

        }


        return parsed.ads;

    }

    catch (error) {

        console.warn(
            "[HAVKAR] Cache read failed:",
            error
        );

        return null;

    }

}


/* =========================================================
   APPLY DATA
   ========================================================= */

function applyLoadedData(
    data,
    fromCache = false
) {

    state.ads =
        Array.isArray(
            data
        )
            ? data
            : [];


    if (!fromCache) {

        state.lastSuccessfulLoad =
            Date.now();

        saveCache(
            state.ads
        );

    }


    applyFilters();

}


/* =========================================================
   LOAD ADS
   ========================================================= */

async function loadAds(
    options = {}
) {

    const {

        force =
            false,

        silent =
            false

    } = options;


    /*
     * Do not allow multiple simultaneous
     * database requests.
     */

    if (
        state.loading
    ) {

        return;

    }


    /*
     * Fast cache path.
     */

    if (!force) {

        const cached =
            readCache();


        if (
            cached &&
            cached.length
        ) {

            applyLoadedData(
                cached,
                true
            );


            /*
             * The cached data is displayed
             * immediately.
             *
             * Fresh data is then requested
             * in the background.
             */

        }

    }


    const requestId =
        ++state.requestId;


    state.loading =
        true;


    if (
        !state.ads.length
    ) {

        renderSkeletons(
            6
        );

        showLoading();

    }


    if (
        !navigator.onLine
    ) {

        state.loading =
            false;


        if (
            state.ads.length
        ) {

            showInfo(
                "Showing saved listings. Internet connection is unavailable."
            );

        }

        else {

            showError(
                "Your device is offline. Reconnect and try again."
            );

        }


        return;

    }


    if (
        !initializeSupabase()
    ) {

        state.loading =
            false;


        showError(
            "The listings service could not be initialized."
        );


        return;

    }


    let lastError =
        null;


    /*
     * Only one retry.
     *
     * This avoids the old behaviour where
     * a slow request could keep the page
     * blocked for a very long time.
     */

    for (
        let attempt = 1;
        attempt <= 2;
        attempt++
    ) {

        try {

            const result =
                await fetchAdsOnce();


            if (
                requestId !==
                    state.requestId
            ) {

                return;

            }


            if (
                result?.error
            ) {

                throw result.error;

            }


            const data =
                Array.isArray(
                    result?.data
                )
                    ? result.data
                    : [];


            state.loading =
                false;


            applyLoadedData(
                data,
                false
            );


            return;

        }

        catch (error) {

            lastError =
                error;


            console.warn(
                `[HAVKAR] Listings request failed (${attempt}/2):`,
                error
            );


            const info =
                classifyError(
                    error
                );


            /*
             * Do not retry permission/database
             * errors. Retrying cannot fix them.
             */

            if (
                info.type ===
                    "permission" ||
                info.type ===
                    "database"
            ) {

                break;

            }


            if (
                attempt <
                    2
            ) {

                await new Promise(
                    function(resolve) {

                        setTimeout(
                            resolve,
                            CONFIG.RETRY_DELAY
                        );

                    }
                );

            }

        }

    }


    state.loading =
        false;


    if (
        requestId !==
            state.requestId
    ) {

        return;

    }


    /*
     * If we already have usable cached
     * or previous data, keep showing it.
     */

    if (
        state.ads.length
    ) {

        applyFilters();


        showInfo(
            "Could not refresh listings. Showing the latest available data."
        );


        return;

    }


    DOM.adsGrid.innerHTML =
        "";


    DOM.skeletonGrid.innerHTML =
        "";


    const info =
        classifyError(
            lastError
        );


    showError(
        info.message
    );

}


/* =========================================================
   RETRY
   ========================================================= */

DOM.retryButton.addEventListener(
    "click",
    function() {

        loadAds({
            force:
                true
        });

    }
);


/* =========================================================
   ONLINE
   ========================================================= */

window.addEventListener(
    "online",
    function() {

        showInfo(
            "Connection restored. Refreshing listings..."
        );


        loadAds({
            force:
                true
        );

    }
);


/* =========================================================
   OFFLINE
   ========================================================= */

window.addEventListener(
    "offline",
    function() {

        if (
            state.loading
        ) {

            if (
                state.ads.length
            ) {

                showInfo(
                    "Internet connection lost. Showing available listings."
                );

            }

            else {

                showError(
                    "Your internet connection was lost."
                );

            }

        }

    }
);
