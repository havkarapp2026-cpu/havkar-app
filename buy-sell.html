<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#1b5e20">

<meta name="description"
      content="HAVKAR Buy & Sell — a fast local marketplace for products, services and listings.">

<title>HAVKAR — Buy & Sell</title>

<!-- =========================================================
     EXTERNAL LIBRARIES
     ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<link
    rel="preconnect"
    href="https://cdnjs.cloudflare.com">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* =========================================================
   HAVKAR BUY & SELL
   Professional single-file marketplace page
   ========================================================= */

:root {
    --green-950: #0b3d16;
    --green-900: #12551b;
    --green-800: #1b5e20;
    --green-700: #2e7d32;
    --green-600: #43a047;
    --green-500: #4caf50;
    --green-100: #e8f5e9;
    --green-50: #f3faf3;

    --red-700: #b71c1c;
    --red-100: #ffebee;

    --orange-600: #ef6c00;

    --bg: #f4f7f4;
    --surface: #ffffff;
    --surface-2: #fafcfa;

    --text: #202522;
    --text-2: #4d554f;
    --muted: #7b827d;

    --border: #e0e5e1;
    --border-strong: #d1d8d2;

    --shadow-1:
        0 2px 10px rgba(0,0,0,.06);

    --shadow-2:
        0 8px 30px rgba(0,0,0,.10);

    --shadow-green:
        0 8px 24px rgba(46,125,50,.28);

    --radius: 18px;

    --header-height: 68px;
    --bottom-height: 76px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    background:
        linear-gradient(
            180deg,
            #f7faf7 0%,
            var(--bg) 100%
        );

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    padding-bottom:
        calc(
            var(--bottom-height)
            + env(safe-area-inset-bottom)
            + 20px
        );

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible {
    outline:
        3px solid rgba(76,175,80,.28);

    outline-offset: 2px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 200;

    min-height: var(--header-height);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        10px 18px;

    color: #fff;

    background:
        linear-gradient(
            135deg,
            var(--green-900),
            var(--green-600)
        );

    box-shadow:
        0 3px 16px rgba(0,0,0,.16);
}

.header-left {
    min-width: 0;

    display: flex;
    align-items: center;

    gap: 13px;
}

.header-title {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 1.22rem;
    font-weight: 800;
}

.header-right {
    display: flex;
    align-items: center;

    gap: 9px;
}

.circle-button {
    width: 43px;
    height: 43px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 50%;

    color: #fff;

    background:
        rgba(255,255,255,.15);

    cursor: pointer;

    transition:
        transform .15s ease,
        background .2s ease;
}

.circle-button:hover {
    background:
        rgba(255,255,255,.24);
}

.circle-button:active {
    transform: scale(.93);
}

.circle-button i {
    font-size: 1.08rem;
}


/* =========================================================
   SEARCH AREA
   ========================================================= */

.search-panel {
    position: sticky;

    top: var(--header-height);

    z-index: 150;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    border-bottom:
        1px solid rgba(0,0,0,.05);
}

.search-container {
    padding:
        14px 20px 10px;
}

.search-box {
    position: relative;
}

.search-icon {
    position: absolute;

    left: 17px;
    top: 50%;

    transform:
        translateY(-50%);

    color:
        #8b918d;

    pointer-events: none;
}

.search-input {
    width: 100%;
    height: 51px;

    border:
        2px solid var(--border);

    border-radius: 28px;

    padding:
        0 48px;

    background:
        var(--surface);

    color:
        var(--text);

    font-size:
        1rem;

    outline: none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.search-input::placeholder {
    color:
        #8a908b;
}

.search-input:focus {
    border-color:
        var(--green-600);

    box-shadow:
        0 0 0 4px
        rgba(67,160,71,.10);
}

.clear-search {
    position: absolute;

    right: 9px;
    top: 50%;

    width: 35px;
    height: 35px;

    transform:
        translateY(-50%);

    display: none;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 50%;

    background:
        #eef1ee;

    color:
        #687069;

    cursor: pointer;
}

.clear-search.visible {
    display: flex;
}


/* =========================================================
   CATEGORY FILTERS
   ========================================================= */

.filters-wrapper {
    overflow: hidden;

    background:
        rgba(255,255,255,.97);
}

.filters {
    display: flex;

    gap: 9px;

    overflow-x: auto;

    padding:
        2px 20px 13px;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter-button {
    flex:
        0 0 auto;

    min-height:
        40px;

    padding:
        8px 17px;

    border:
        2px solid var(--border);

    border-radius:
        23px;

    background:
        #fff;

    color:
        var(--text);

    font-size:
        .88rem;

    font-weight:
        700;

    white-space:
        nowrap;

    cursor:
        pointer;

    transition:
        all .18s ease;
}

.filter-button:hover {
    border-color:
        var(--green-500);
}

.filter-button:active {
    transform:
        scale(.97);
}

.filter-button.active {
    border-color:
        var(--green-600);

    background:
        linear-gradient(
            135deg,
            var(--green-600),
            var(--green-500)
        );

    color:
        #fff;

    box-shadow:
        0 4px 12px
        rgba(67,160,71,.20);
}


/* =========================================================
   MAIN
   ========================================================= */

.main {
    width: 100%;

    max-width:
        1440px;

    margin:
        0 auto;

    padding:
        18px 20px 40px;
}

.results-bar {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom:
        16px;
}

.results-title {
    font-size:
        1.05rem;

    font-weight:
        800;
}

.results-count {
    color:
        var(--muted);

    font-size:
        .83rem;

    white-space:
        nowrap;
}


/* =========================================================
   GRID
   ========================================================= */

.ads-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        13px;
}


/* =========================================================
   CARD
   ========================================================= */

.ad-card {
    position: relative;

    min-width: 0;

    overflow: hidden;

    background:
        var(--surface);

    border:
        1px solid rgba(0,0,0,.035);

    border-radius:
        var(--radius);

    box-shadow:
        var(--shadow-1);

    cursor:
        pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.ad-card:hover {
    transform:
        translateY(-3px);

    box-shadow:
        var(--shadow-2);
}

.ad-card:active {
    transform:
        scale(.985);
}


/* =========================================================
   IMAGE
   ========================================================= */

.ad-image {
    position: relative;

    width: 100%;

    aspect-ratio:
        1 / .88;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #e7ece8,
            #f8faf8
        );
}

.ad-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    opacity: 0;

    transition:
        opacity .25s ease,
        transform .35s ease;
}

.ad-card:hover
.ad-image img {
    transform:
        scale(1.025);
}

.ad-image img.loaded {
    opacity: 1;
}

.image-placeholder {
    position: absolute;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color:
        #a1aaa3;

    font-size:
        2.35rem;
}

.ad-image.has-image
.image-placeholder {
    opacity: 0;
}

.condition-badge {
    position: absolute;

    top: 9px;
    left: 9px;

    max-width:
        calc(100% - 18px);

    padding:
        5px 9px;

    border-radius:
        9px;

    background:
        rgba(0,0,0,.66);

    color:
        #fff;

    font-size:
        .66rem;

    font-weight:
        750;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}


/* =========================================================
   CARD INFORMATION
   ========================================================= */

.ad-info {
    padding:
        11px 12px 13px;
}

.ad-title {
    min-height:
        2.55em;

    margin-bottom:
        6px;

    display:
        -webkit-box;

    overflow:
        hidden;

    color:
        var(--text);

    font-size:
        .92rem;

    font-weight:
        750;

    line-height:
        1.28;

    -webkit-line-clamp:
        2;

    -webkit-box-orient:
        vertical;
}

.ad-price {
    margin-bottom:
        7px;

    color:
        var(--green-800);

    font-size:
        1.06rem;

    font-weight:
        850;
}

.ad-location {
    display:
        flex;

    align-items:
        center;

    gap:
        5px;

    overflow:
        hidden;

    color:
        var(--text-2);

    font-size:
        .75rem;

    white-space:
        nowrap;

    text-overflow:
        ellipsis;
}

.ad-location i {
    flex:
        0 0 auto;

    color:
        var(--green-600);
}

.ad-meta {
    margin-top:
        6px;

    overflow:
        hidden;

    color:
        #8b938d;

    font-size:
        .70rem;

    white-space:
        nowrap;

    text-overflow:
        ellipsis;
}


/* =========================================================
   STATUS
   ========================================================= */

.status {
    display:
        none;

    width:
        100%;

    padding:
        65px 20px;

    text-align:
        center;
}

.status.visible {
    display:
        block;
}

.status-icon {
    width:
        66px;

    height:
        66px;

    margin:
        0 auto 16px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        50%;

    background:
        var(--green-100);

    color:
        var(--green-700);

    font-size:
        1.55rem;
}

.status.error .status-icon {
    background:
        var(--red-100);

    color:
        var(--red-700);
}

.status-title {
    margin-bottom:
        8px;

    color:
        var(--text);

    font-size:
        1.12rem;

    font-weight:
        800;
}

.status.error .status-title {
    color:
        var(--red-700);
}

.status-message {
    max-width:
        520px;

    margin:
        0 auto;

    color:
        var(--muted);

    font-size:
        .9rem;

    line-height:
        1.6;

    word-break:
        break-word;
}


/* =========================================================
   RETRY
   ========================================================= */

.retry-button {
    margin-top:
        19px;

    padding:
        12px 22px;

    border:
        0;

    border-radius:
        13px;

    background:
        linear-gradient(
            135deg,
            var(--green-700),
            var(--green-500)
        );

    color:
        #fff;

    font-weight:
        750;

    cursor:
        pointer;

    box-shadow:
        var(--shadow-green);

    transition:
        transform .15s ease;
}

.retry-button:active {
    transform:
        scale(.96);
}


/* =========================================================
   SKELETON
   ========================================================= */

.skeleton-grid {
    display:
        grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        13px;
}

.skeleton-card {
    overflow:
        hidden;

    border-radius:
        var(--radius);

    background:
        #fff;

    box-shadow:
        var(--shadow-1);
}

.skeleton-image {
    width:
        100%;

    aspect-ratio:
        1 / .88;
}

.skeleton-line {
    height:
        12px;

    margin:
        12px;

    border-radius:
        8px;
}

.skeleton-line.small {
    width:
        42%;
}

.skeleton-line.medium {
    width:
        72%;
}

.skeleton {
    background:
        linear-gradient(
            90deg,
            #ecefec 25%,
            #f7f9f7 38%,
            #ecefec 63%
        );

    background-size:
        400% 100%;

    animation:
        skeletonMove 1.35s ease infinite;
}

@keyframes skeletonMove {

    0% {
        background-position:
            100% 50%;
    }

    100% {
        background-position:
            0 50%;
    }

}


/* =========================================================
   FAB
   ========================================================= */

.fab {
    position:
        fixed;

    right:
        20px;

    bottom:
        calc(
            var(--bottom-height)
            + 18px
            + env(safe-area-inset-bottom)
        );

    z-index:
        180;

    width:
        62px;

    height:
        62px;

    border:
        0;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        linear-gradient(
            135deg,
            var(--green-900),
            var(--green-500)
        );

    color:
        #fff;

    font-size:
        1.55rem;

    cursor:
        pointer;

    box-shadow:
        0 9px 28px
        rgba(27,94,32,.36);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.fab:hover {
    transform:
        translateY(-3px);

    box-shadow:
        0 12px 32px
        rgba(27,94,32,.43);
}

.fab:active {
    transform:
        scale(.93);
}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav {
    position:
        fixed;

    left:
        0;

    right:
        0;

    bottom:
        0;

    z-index:
        200;

    height:
        calc(
            var(--bottom-height)
            + env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    display:
        flex;

    align-items:
        flex-start;

    justify-content:
        space-around;

    background:
        rgba(255,255,255,.98);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    box-shadow:
        0 -3px 16px
        rgba(0,0,0,.10);
}

.nav-item {
    flex:
        1;

    height:
        var(--bottom-height);

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        5px;

    color:
        #929893;

    font-size:
        .70rem;

    font-weight:
        650;

    cursor:
        pointer;

    user-select:
        none;

    transition:
        color .18s ease;
}

.nav-item i {
    font-size:
        1.27rem;
}

.nav-item.active {
    color:
        var(--green-600);
}

.nav-item:active {
    opacity:
        .70;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position:
        fixed;

    left:
        50%;

    bottom:
        calc(
            var(--bottom-height)
            + 18px
            + env(safe-area-inset-bottom)
        );

    z-index:
        1000;

    width:
        max-content;

    max-width:
        calc(100vw - 32px);

    padding:
        13px 18px;

    border-radius:
        13px;

    transform:
        translate(-50%, 20px);

    opacity:
        0;

    pointer-events:
        none;

    color:
        #fff;

    background:
        #242824;

    font-size:
        .86rem;

    font-weight:
        650;

    text-align:
        center;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.22);

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.toast.show {
    opacity:
        1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (min-width: 650px) {

    .ads-grid,
    .skeleton-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap:
            18px;
    }

}

@media (min-width: 950px) {

    .ads-grid,
    .skeleton-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));

        gap:
            20px;
    }

    .main {
        padding-left:
            28px;

        padding-right:
            28px;
    }

}

@media (max-width: 500px) {

    .header {
        padding:
            10px 13px;
    }

    .header-title {
        font-size:
            1.13rem;
    }

    .circle-button {
        width:
            41px;

        height:
            41px;
    }

    .search-container {
        padding:
            12px 12px 9px;
    }

    .filters {
        padding-left:
            12px;

        padding-right:
            12px;

        padding-bottom:
            11px;
    }

    .main {
        padding:
            15px 12px 32px;
    }

    .ads-grid,
    .skeleton-grid {
        gap:
            10px;
    }

    .ad-info {
        padding:
            10px;
    }

    .ad-title {
        font-size:
            .87rem;
    }

    .ad-price {
        font-size:
            .98rem;
    }

    .ad-location {
        font-size:
            .71rem;
    }

    .fab {
        right:
            16px;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        scroll-behavior:
            auto !important;

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }

}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="circle-button"
            type="button"
            aria-label="Go back">

            <i class="fas fa-arrow-left"></i>

        </button>

        <h1 class="header-title">
            Buy &amp; Sell
        </h1>

    </div>


    <div class="header-right">

        <button
            id="notificationButton"
            class="circle-button"
            type="button"
            aria-label="Notifications">

            <i class="fas fa-bell"></i>

        </button>


        <button
            id="profileButton"
            class="circle-button"
            type="button"
            aria-label="Profile">

            <i class="fas fa-user"></i>

        </button>

    </div>

</header>


<!-- =========================================================
     SEARCH + FILTERS
     ========================================================= -->

<section class="search-panel">

    <div class="search-container">

        <div class="search-box">

            <i class="fas fa-search search-icon"></i>

            <input
                id="searchInput"
                class="search-input"
                type="search"
                autocomplete="off"
                enterkeyhint="search"
                placeholder="Search products, services..."
                aria-label="Search products and services">

            <button
                id="clearSearch"
                class="clear-search"
                type="button"
                aria-label="Clear search">

                <i class="fas fa-xmark"></i>

            </button>

        </div>

    </div>


    <div class="filters-wrapper">

        <nav
            id="filters"
            class="filters"
            aria-label="Listing categories">
        </nav>

    </div>

</section>


<!-- =========================================================
     MAIN
     ========================================================= -->

<main class="main">

    <div class="results-bar">

        <div
            id="resultsTitle"
            class="results-title">

            Latest listings

        </div>


        <div
            id="resultsCount"
            class="results-count">

            Loading...

        </div>

    </div>


    <!-- =====================================================
         SKELETON
         ===================================================== -->

    <div
        id="skeletonGrid"
        class="skeleton-grid">

    </div>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <section
        id="errorStatus"
        class="status error">

        <div class="status-icon">

            <i class="fas fa-circle-exclamation"></i>

        </div>

        <div class="status-title">
            Could not load listings
        </div>

        <div
            id="errorMessage"
            class="status-message">

            HAVKAR could not load the listings.

        </div>

        <button
            id="retryButton"
            class="retry-button"
            type="button">

            <i class="fas fa-rotate-right"></i>
            &nbsp; Try again

        </button>

    </section>


    <!-- =====================================================
         EMPTY
         ===================================================== -->

    <section
        id="emptyStatus"
        class="status">

        <div class="status-icon">

            <i class="fas fa-box-open"></i>

        </div>

        <div class="status-title">
            No listings found
        </div>

        <div class="status-message">

/* =========================================================
   NATIVE PROMISE CONVERSION
   IMPORTANT:
   Prevents "promise.finally is not a function"
   ========================================================= */

function toNativePromise(value) {

    return Promise.resolve(value);

}


/* =========================================================
   TIMEOUT
   IMPORTANT:
   Never calls .finally() on Supabase Query Builder.
   ========================================================= */

function withTimeout(
    operation,
    milliseconds = 15000
) {

    const nativePromise =
        toNativePromise(operation);


    let timer = null;


    const timeoutPromise =
        new Promise(
            function(_, reject) {

                timer =
                    window.setTimeout(
                        function() {

                            reject(
                                new Error(
                                    "The listings request timed out."
                                )
                            );

                        },
                        milliseconds
                    );

            }
        );


    return Promise.race([
        nativePromise,
        timeoutPromise
    ]).then(
        function(result) {

            if (timer !== null) {

                window.clearTimeout(timer);

            }

            return result;

        },
        function(error) {

            if (timer !== null) {

                window.clearTimeout(timer);

            }

            throw error;

        }
    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   SAFE STRING
   ========================================================= */

function safeString(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value).trim();

}


/* =========================================================
   NORMALIZE CATEGORY
   ========================================================= */

function normalizeCategory(value) {

    return safeString(value)
        .toLowerCase()
        .replace(/\s+/g, " ");

}


/* =========================================================
   PRICE
   ========================================================= */

function formatPrice(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "Price not specified";

    }


    const number =
        Number(value);


    if (
        !Number.isFinite(number)
    ) {

        return escapeHtml(value);

    }


    return new Intl.NumberFormat(
        "en-US",
        {
            style: "currency",
            currency: "EUR",
            maximumFractionDigits: 2
        }
    ).format(number);

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return new Intl.DateTimeFormat(
        "en-GB",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    ).format(date);

}


/* =========================================================
   IMAGE EXTRACTION
   ========================================================= */

function getFirstImage(ad) {

    if (!ad) {

        return null;

    }


    const photos =
        ad.photos;


    /* Array */

    if (
        Array.isArray(photos)
    ) {

        for (
            const photo of photos
        ) {

            if (
                typeof photo === "string" &&
                /^https?:\/\//i.test(
                    photo.trim()
                )
            ) {

                return photo.trim();

            }

        }

    }


    /* JSON string */

    if (
        typeof photos === "string" &&
        photos.trim()
    ) {

        try {

            const parsed =
                JSON.parse(
                    photos
                );


            if (
                Array.isArray(parsed)
            ) {

                for (
                    const photo of parsed
                ) {

                    if (
                        typeof photo === "string" &&
                        photo.trim()
                    ) {

                        /*
                         * Supports both URLs and
                         * existing stored image data.
                         */
                        return photo.trim();

                    }

                }

            }

        }

        catch (_) {

            /*
             * Some older records may contain
             * one direct URL.
             */

            if (
                /^https?:\/\//i.test(
                    photos.trim()
                )
            ) {

                return photos.trim();

            }

        }

    }


    /* image_url */

    if (
        typeof ad.image_url === "string" &&
        ad.image_url.trim()
    ) {

        return ad.image_url.trim();

    }


    /* image */

    if (
        typeof ad.image === "string" &&
        ad.image.trim()
    ) {

        return ad.image.trim();

    }


    return null;

}


/* =========================================================
   LOCATION

function getLocation(ad) {

/* =========================================================

function getSearchableText(ad) {

function setupSearch() {

/* =========================================================
   FILTER
   ========================================================= */

function applyFilters() {

    const query =
        state.search;


    state.filteredAds =
        state.ads.filter(
            function(ad) {

                if (
                    !categoryMatches(ad)
                ) {

                    return false;

                }


                if (!query) {

                    return true;

                }


                return getSearchableText(
                    ad
                ).includes(query);

            }
        );


    updateResultsHeader();

    renderAds(
        state.filteredAds
    );

}


/* =========================================================

function updateResultsHeader() {

        state.filteredAds.length;


    if (state.search) {

    }

    else if (
        state.category !== "All"

        resultsTitle.textContent =

    }

    else {

        resultsTitle.textContent =
            "Latest listings";

    }


    resultsCount.textContent =

            count === 1

                : "listings"
        }`;

}


/* =========================================================
   IMAGE MARKUP

function createImageMarkup(ad) {

    const image =
        getFirstImage(ad);


    const title =

    return `

            <img
                src="${escapeHtml(image)}"

                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer">

            <div class="image-placeholder">

                <i class="fas fa-image"></i>

            </div>

}


/* =========================================================
   CREATE CARD
   ========================================================= */

function createAdCard(ad) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "ad-card";


    card.setAttribute(
        "role",
        "button"
    );


    card.setAttribute(
        "tabindex",
        "0"
    );


    const id =
        safeString(ad.id);


    const title =
        safeString(ad.title) ||
        "Untitled listing";


    const category =
        safeString(ad.category) ||
        "Other";


    const location =
        getLocation(ad);


    const condition =
        safeString(ad.condition);


    const date =
        formatDate(
            ad.created_at
        );


    const image =
        getFirstImage(ad);


    card.dataset.id =
        id;


    card.innerHTML = `

        ${createImageMarkup(ad)}

        ${
            condition
                ? `
                    <div class="condition-badge">
                        ${escapeHtml(condition)}
                    </div>
                  `
                : ""
        }

        <div class="ad-info">

            <div class="ad-title">
                ${escapeHtml(title)}
            </div>

            <div class="ad-price">
                ${formatPrice(ad.price)}
            </div>

            <div class="ad-location">

                <i class="fas fa-location-dot"></i>

                <span>
                    ${escapeHtml(location)}
                </span>

            </div>

            <div class="ad-meta">

                ${escapeHtml(category)}

                ${
                    date
                        ? " • " +
                          escapeHtml(date)
                        : ""
                }

            </div>

        </div>

    `;


    const img =
        card.querySelector(
            "img"
        );


    if (img) {

        img.addEventListener(
            "load",
            function() {

                img.classList.add(
                    "loaded"
                );

            },
            {
                once: true
            }
        );


        img.addEventListener(
            "error",
            function() {

                const imageBox =
                    card.querySelector(
                        ".ad-image"
                    );


                if (!imageBox) {

                    return;

                }


                imageBox.classList.remove(
                    "has-image"
                );


                img.remove();

            },
            {
                once: true
            }
        );


        /*
         * Handles cached images where
         * load can already be complete.
         */
        if (
            img.complete &&
            img.naturalWidth > 0
        ) {

            img.classList.add(
                "loaded"
            );

        }

    }


    card.addEventListener(
        "click",
        function() {

            openProduct(
                id
            );

        }
    );


    card.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                openProduct(
                    id
                );

            }

        }
    );


    return card;

}

    adsGrid.innerHTML =

    if (
        !Array.isArray(ads) ||

        return;

/* =========================================================
   FETCH ADS
   ========================================================= */

async function fetchAds() {

    if (
        !initializeSupabase()
    ) {

        throw new Error(
            "Supabase could not be initialized."
        );

    }


    /*
     * CRITICAL:
     * Convert the Supabase thenable into a
     * native Promise before Promise.race.
     *
     * This avoids:
     * "promise.finally is not a function"
     */

    const query =
        supabaseClient
            .from("ads")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    const result =
        await withTimeout(
            query,
            15000
        );


    if (
        !result
    ) {

        throw new Error(
            "The listings server returned no response."
        );

    }


    if (
        result.error
    ) {

        console.error(
            "[HAVKAR] Supabase error:",
            result.error
        );

        throw result.error;

    }


    if (
        !Array.isArray(
            result.data
        )
    ) {

        return [];

    }


    return result.data;

}


/* =========================================================
   READABLE ERROR
   ========================================================= */

function readableError(error) {

    if (
        !navigator.onLine
    ) {

        return (
            "Your device is offline. " +
            "Please reconnect to the internet."
        );

    }


    const message =
        safeString(
            error?.message
        );


    const lower =
        message.toLowerCase();


    if (
        lower.includes(
            "finally is not a function"
        )
    ) {

        return (
            "HAVKAR detected an incompatible Promise " +
            "response from the database client. " +
            "The request handler has been protected."
        );

    }


    if (
        lower.includes(
            "timed out"
        )
    ) {

        return (
            "Supabase did not respond within 15 seconds. " +
            "Please try again."
        );

    }


    if (
        lower.includes(
            "failed to fetch"
        ) ||
        lower.includes(
            "network"
        )
    ) {

        return (
            "HAVKAR could not establish a network " +
            "connection with Supabase."
        );

    }


    if (
        lower.includes(
            "jwt"
        ) ||
        lower.includes(
            "token"
        )
    ) {

        return (
            "The Supabase authentication response was rejected."
        );

    }


    if (
        lower.includes(
            "permission"
        ) ||
        lower.includes(
            "row-level security"
        ) ||
        lower.includes(
            "rls"
        )
    ) {

        return (
            "Supabase denied access to the ads table. " +
            "Please check the ads table permissions."
        );

    }


    if (
        lower.includes(
            "relation"
        ) &&
        lower.includes(
            "does not exist"
        )
    ) {

        return (
            "The Supabase 'ads' table could not be found."
        );

    }


    if (message) {

        return message;

    }


    return (
        "An unexpected error occurred while loading listings."
    );

}


/* =========================================================
   LOAD ADS
   ========================================================= */

async function loadAds() {

    const requestId =
        ++state.requestNumber;


    state.loading =
        true;


    adsGrid.innerHTML =
        "";


    hideStatuses();


    showSkeleton();


    resultsCount.textContent =
        "Loading...";


    try {

        const data =
            await fetchAds();


        /*
         * Ignore old requests.
         */

        if (
            requestId !==
            state.requestNumber
        ) {

            return;

        }


        state.ads =
            Array.isArray(data)
                ? data
                : [];


        state.loading =
            false;


        hideSkeleton();


        applyFilters();


    }

    catch (error) {

        if (
            requestId !==
            state.requestNumber
        ) {

            return;

        }


        state.loading =
            false;


        hideSkeleton();


        adsGrid.innerHTML =
            "";


        resultsCount.textContent =
            "Unavailable";


        console.error(
            "[HAVKAR] Load listings failed:",
            error
        );


        showError(
            readableError(error)
        );

    }

}

);


window.addEventListener(
    "offline",
    function() {

        if (
            state.loading
        ) {

            state.loading =
                false;


            hideSkeleton();


            showError(
                "Your internet connection was lost. " +
                "Reconnect and try again."
            );

        }

        else {

            showToast(
                "You are currently offline."
            );

        }

    }
);


/* =========================================================
   NAVIGATION EVENTS
   ========================================================= */

$("backButton")
    .addEventListener(
        "click",
        function() {

            /*
             * If there is usable browser history,
             * use it. Otherwise return to home.
             */

            if (
                window.history.length > 1
            ) {

                window.history.back();

            }

            else {

                goHome();

            }

        }
    );


$("profileButton")
    .addEventListener(
        "click",
        goProfile
    );


$("notificationButton")
    .addEventListener(
        "click",
        function() {

            showToast(
                "Notifications will be connected to your account."
            );

        }
    );


$("addButton")
    .addEventListener(
        "click",
        goPostAd
    );


$("navHome")
    .addEventListener(
        "click",
        goHome
    );


$("navSearch")
    .addEventListener(
        "click",
        function() {

            searchInput.focus();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }
    );


$("navSaved")
    .addEventListener(
        "click",
        function() {

            showToast(
                "Saved listings will be connected to your account."
            );

        }
    );


$("navMessages")
    .addEventListener(
        "click",
        function() {

            showToast(
                "Messaging will be connected to your account."
            );

        }
    );


$("navProfile")
    .addEventListener(
        "click",
        goProfile
    );


retryButton
    .addEventListener(
        "click",
        loadAds
    );


/* =========================================================
   KEYBOARD NAVIGATION
   ========================================================= */

document
    .querySelectorAll(
        ".nav-item"
    )
    .forEach(
        function(item) {

            item.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        event.preventDefault();

                        item.click();

                    }

                }
            );

        }
    );


/* =========================================================
   VISIBILITY REFRESH
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible" &&
            !state.loading &&
            state.ads.length === 0
        ) {

            loadAds();

        }

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

function initializePage() {

    renderCategories();

    setupSearch();

    initializeSupabase();

    loadAds();

}


/* =========================================================
   START
   ========================================================= */

initializePage();

</script>

</body>
    </html>
