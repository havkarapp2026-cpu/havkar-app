<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#1b5e20">
<meta name="description" content="HAVKAR Buy & Sell marketplace">

<title>HAVKAR — Buy & Sell</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

:root{
    --green-950:#0b3d16;
    --green-900:#12551b;
    --green-800:#1b5e20;
    --green-700:#2e7d32;
    --green-600:#43a047;
    --green-500:#4caf50;
    --green-100:#e8f5e9;

    --bg:#f4f7f4;
    --surface:#ffffff;
    --text:#202522;
    --text-2:#4d554f;
    --muted:#7b827d;
    --border:#e0e5e1;

    --red:#b71c1c;
    --red-bg:#ffebee;

    --shadow:0 4px 18px rgba(0,0,0,.07);
    --shadow-lg:0 10px 30px rgba(0,0,0,.12);

    --header:68px;
    --bottom:76px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:linear-gradient(
        180deg,
        #f7faf7 0%,
        var(--bg) 100%
    );
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    padding-bottom:
        calc(
            var(--bottom)
            + env(safe-area-inset-bottom)
            + 20px
        );

    -webkit-font-smoothing:antialiased;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
input:focus-visible{
    outline:3px solid rgba(76,175,80,.25);
    outline-offset:2px;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:200;

    min-height:var(--header);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 18px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--green-900),
            var(--green-600)
        );

    box-shadow:
        0 3px 16px rgba(0,0,0,.16);
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-left{
    min-width:0;
    gap:13px;
}

.header-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    font-size:1.2rem;
    font-weight:800;
}

.circle-button{
    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#fff;
    background:rgba(255,255,255,.15);

    cursor:pointer;

    transition:
        background .18s ease,
        transform .18s ease;
}

.circle-button:hover{
    background:rgba(255,255,255,.24);
}

.circle-button:active{
    transform:scale(.93);
}

/* =========================================================
   SEARCH
========================================================= */

.search-panel{
    position:sticky;
    top:var(--header);
    z-index:150;

    background:rgba(255,255,255,.97);

    backdrop-filter:blur(16px);

    border-bottom:
        1px solid rgba(0,0,0,.05);
}

.search-container{
    padding:14px 20px 10px;
}

.search-box{
    position:relative;
}

.search-icon{
    position:absolute;

    left:17px;
    top:50%;

    transform:translateY(-50%);

    color:#8b918d;

    pointer-events:none;
}

.search-input{
    width:100%;
    height:51px;

    border:
        2px solid var(--border);

    border-radius:28px;

    padding:
        0 48px;

    background:#fff;
    color:var(--text);

    outline:none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.search-input:focus{
    border-color:var(--green-600);

    box-shadow:
        0 0 0 4px rgba(67,160,71,.10);
}

.clear-search{
    position:absolute;

    right:9px;
    top:50%;

    width:35px;
    height:35px;

    transform:translateY(-50%);

    display:none;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#eef1ee;
    color:#687069;

    cursor:pointer;
}

.clear-search.visible{
    display:flex;
}

/* =========================================================
   FILTERS
========================================================= */

.filters-wrapper{
    overflow:hidden;
    background:rgba(255,255,255,.97);
}

.filters{
    display:flex;

    gap:9px;

    overflow-x:auto;

    padding:
        2px 20px 13px;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-button{
    flex:0 0 auto;

    min-height:40px;

    padding:
        8px 17px;

    border:
        2px solid var(--border);

    border-radius:23px;

    background:#fff;
    color:var(--text);

    font-size:.86rem;
    font-weight:700;

    white-space:nowrap;

    cursor:pointer;

    transition:
        background .18s ease,
        border-color .18s ease,
        color .18s ease;
}

.filter-button.active{
    border-color:var(--green-600);

    background:
        linear-gradient(
            135deg,
            var(--green-600),
            var(--green-500)
        );

    color:#fff;

    box-shadow:
        0 4px 12px rgba(67,160,71,.20);
}

/* =========================================================
   MAIN
========================================================= */

.main{
    width:100%;
    max-width:1440px;

    margin:auto;

    padding:
        18px 20px 40px;
}

.results-bar{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:16px;
}

.results-title{
    font-size:1.05rem;
    font-weight:800;
}

.results-count{
    color:var(--muted);
    font-size:.83rem;
    white-space:nowrap;
}

/* =========================================================
   GRID
========================================================= */

.ads-grid{
    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:13px;
}

/* =========================================================
   CARD
========================================================= */

.ad-card{
    position:relative;

    min-width:0;

    overflow:hidden;

    background:#fff;

    border:
        1px solid rgba(0,0,0,.035);

    border-radius:18px;

    box-shadow:var(--shadow);

    cursor:pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.ad-card:hover{
    transform:translateY(-3px);

    box-shadow:var(--shadow-lg);
}

.ad-card:active{
    transform:scale(.985);
}

.ad-image{
    position:relative;

    width:100%;

    aspect-ratio:1/.88;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #e7ece8,
            #f8faf8
        );
}

.ad-image img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    opacity:0;

    transition:
        opacity .25s ease,
        transform .35s ease;
}

.ad-image img.loaded{
    opacity:1;
}

.ad-card:hover
.ad-image img.loaded{
    transform:scale(1.025);
}

.image-placeholder{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#a1aaa3;

    font-size:2.3rem;

    transition:
        opacity .2s ease;
}

.ad-image.has-image
.image-placeholder{
    opacity:0;
}

.image-loading{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#8d968f;

    font-size:1.2rem;
}

.condition-badge{
    position:absolute;

    top:9px;
    left:9px;

    max-width:
        calc(100% - 18px);

    padding:
        5px 9px;

    border-radius:9px;

    background:
        rgba(0,0,0,.66);

    color:#fff;

    font-size:.66rem;
    font-weight:750;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;
}

.ad-info{
    padding:
        11px 12px 13px;
}

.ad-title{
    min-height:2.55em;

    margin-bottom:6px;

    display:-webkit-box;

    overflow:hidden;

    font-size:.92rem;
    font-weight:750;
    line-height:1.28;

    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
}

.ad-price{
    margin-bottom:7px;

    color:var(--green-800);

    font-size:1.06rem;
    font-weight:850;
}

.ad-location{
    display:flex;

    align-items:center;

    gap:5px;

    overflow:hidden;

    color:var(--text-2);

    font-size:.75rem;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.ad-location i{
    flex:0 0 auto;
    color:var(--green-600);
}

.ad-meta{
    margin-top:6px;

    overflow:hidden;

    color:#8b938d;

    font-size:.70rem;

    white-space:nowrap;

    text-overflow:ellipsis;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    display:none;

    width:100%;

    padding:
        65px 20px;

    text-align:center;
}

.status.visible{
    display:block;
}

.status-icon{
    width:66px;
    height:66px;

    margin:
        0 auto 16px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--green-100);

    color:var(--green-700);

    font-size:1.55rem;
}

.status.error
.status-icon{
    background:var(--red-bg);
    color:var(--red);
}

.status-title{
    margin-bottom:8px;

    font-size:1.12rem;
    font-weight:800;
}

.status.error
.status-title{
    color:var(--red);
}

.status-message{
    max-width:620px;

    margin:0 auto;

    color:var(--muted);

    font-size:.90rem;

    line-height:1.6;

    word-break:break-word;
}

.status-detail{
    max-width:720px;

    margin:
        14px auto 0;

    padding:
        11px 13px;

    border:
        1px solid #ead0d0;

    border-radius:10px;

    background:#fff8f8;

    color:#7a3b3b;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

    font-size:.72rem;

    line-height:1.5;

    text-align:left;

    overflow-wrap:anywhere;
}

.retry-button{
    margin-top:19px;

    padding:
        12px 22px;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--green-700),
            var(--green-500)
        );

    color:#fff;

    font-weight:750;

    cursor:pointer;

    box-shadow:
        0 8px 24px rgba(46,125,50,.28);
}

.retry-button:active{
    transform:scale(.96);
}

/* =========================================================
   SKELETON
========================================================= */

.skeleton-grid{
    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:13px;
}

.skeleton-card{
    overflow:hidden;

    border-radius:18px;

    background:#fff;

    box-shadow:var(--shadow);
}

.skeleton-image{
    width:100%;

    aspect-ratio:1/.88;
}

.skeleton-line{
    height:12px;

    margin:12px;

    border-radius:8px;
}

.skeleton-line.small{
    width:42%;
}

.skeleton-line.medium{
    width:72%;
}

.skeleton{
    background:
        linear-gradient(
            90deg,
            #ecefec 25%,
            #f7f9f7 38%,
            #ecefec 63%
        );

    background-size:400% 100%;

    animation:
        skeletonMove 1.35s ease infinite;
}

@keyframes skeletonMove{
    0%{
        background-position:100% 50%;
    }

    100%{
        background-position:0 50%;
    }
}

/* =========================================================
   FAB
========================================================= */

.fab{
    position:fixed;

    right:20px;

    bottom:
        calc(
            var(--bottom)
            + 18px
            + env(safe-area-inset-bottom)
        );

    z-index:180;

    width:62px;
    height:62px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            var(--green-900),
            var(--green-500)
        );

    color:#fff;

    font-size:1.55rem;

    cursor:pointer;

    box-shadow:
        0 9px 28px rgba(27,94,32,.36);
}

.fab:active{
    transform:scale(.93);
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:200;

    height:
        calc(
            var(--bottom)
            + env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    display:flex;

    align-items:flex-start;
    justify-content:space-around;

    background:
        rgba(255,255,255,.98);

    backdrop-filter:blur(16px);

    box-shadow:
        0 -3px 16px rgba(0,0,0,.10);
}

.nav-item{
    flex:1;

    height:var(--bottom);

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    color:#929893;

    font-size:.70rem;
    font-weight:650;

    cursor:pointer;

    user-select:none;
}

.nav-item i{
    font-size:1.27rem;
}

.nav-item.active{
    color:var(--green-600);
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;

    bottom:
        calc(
            var(--bottom)
            + 18px
            + env(safe-area-inset-bottom)
        );

    z-index:1000;

    max-width:
        calc(100vw - 32px);

    padding:
        13px 18px;

    border-radius:13px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    color:#fff;

    background:#242824;

    font-size:.86rem;
    font-weight:650;

    text-align:center;

    box-shadow:
        0 8px 30px rgba(0,0,0,.22);

    transition:.2s ease;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(min-width:650px){

    .ads-grid,
    .skeleton-grid{
        grid-template-columns:
            repeat(
                3,
                minmax(0,1fr)
            );

        gap:18px;
    }
}

@media(min-width:950px){

    .ads-grid,
    .skeleton-grid{
        grid-template-columns:
            repeat(
                4,
                minmax(0,1fr)
            );

        gap:20px;
    }

    .main{
        padding-left:28px;
        padding-right:28px;
    }
}

@media(max-width:500px){

    .header{
        padding:10px 13px;
    }

    .header-title{
        font-size:1.13rem;
    }

    .circle-button{
        width:41px;
        height:41px;
    }

    .search-container{
        padding:
            12px 12px 9px;
    }

    .filters{
        padding-left:12px;
        padding-right:12px;
        padding-bottom:11px;
    }

    .main{
        padding:
            15px 12px 32px;
    }

    .ads-grid,
    .skeleton-grid{
        gap:10px;
    }

    .ad-info{
        padding:10px;
    }

    .ad-title{
        font-size:.87rem;
    }

    .ad-price{
        font-size:.98rem;
    }

    .ad-location{
        font-size:.71rem;
    }

    .fab{
        right:16px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        scroll-behavior:auto!important;

        animation-duration:.01ms!important;

        animation-iteration-count:1!important;

        transition-duration:.01ms!important;
    }
}

</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="circle-button"
            type="button"
            aria-label="Go back"
        >
            <i class="fas fa-arrow-left"></i>
        </button>

        <h1 class="header-title">
            Buy &amp; Sell
        </h1>

    </div>

    <div class="header-right">

        <button
            id="notificationButton"
            class="circle-button"
            type="button"
            aria-label="Notifications"
        >
            <i class="fas fa-bell"></i>
        </button>

        <button
            id="profileButton"
            class="circle-button"
            type="button"
            aria-label="Profile"
        >
            <i class="fas fa-user"></i>
        </button>

    </div>

</header>


<!-- =========================================================
     SEARCH
========================================================= -->

<section class="search-panel">

    <div class="search-container">

        <div class="search-box">

            <i class="fas fa-search search-icon"></i>

            <input
                id="searchInput"
                class="search-input"
                type="search"
                autocomplete="off"
                enterkeyhint="search"
                placeholder="Search products, services..."
                aria-label="Search products and services"
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button"
                aria-label="Clear search"
            >
                <i class="fas fa-xmark"></i>
            </button>

        </div>

    </div>


    <div class="filters-wrapper">

        <nav
            id="filters"
            class="filters"
            aria-label="Listing categories"
        ></nav>

    </div>

</section>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">

    <div class="results-bar">

        <div
            id="resultsTitle"
            class="results-title"
        >
            Latest listings
        </div>

        <div
            id="resultsCount"
            class="results-count"
        >
            Loading...
        </div>

    </div>


    <div
        id="skeletonGrid"
        class="skeleton-grid"
    ></div>


    <!-- ERROR -->

    <section
        id="errorStatus"
        class="status error"
    >

        <div class="status-icon">
            <i class="fas fa-circle-exclamation"></i>
        </div>

        <div class="status-title">
            Could not load listings
        </div>

        <div
            id="errorMessage"
            class="status-message"
        >
            HAVKAR could not load the listings.
        </div>

        <div
            id="errorDetail"
            class="status-detail"
            style="display:none"
        ></div>

        <button
            id="retryButton"
            class="retry-button"
            type="button"
        >
            <i class="fas fa-rotate-right"></i>
            &nbsp;
            Try again
        </button>

    </section>


    <!-- EMPTY -->

    <section
        id="emptyStatus"
        class="status"
    >

        <div class="status-icon">
            <i class="fas fa-box-open"></i>
        </div>

        <div class="status-title">
            No listings found
        </div>

        <div class="status-message">
            There are no listings matching your search or category.
        </div>

    </section>


    <!-- LISTINGS -->

    <section
        id="adsGrid"
        class="ads-grid"
        aria-live="polite"
    ></section>

</main>


<!-- =========================================================
     ADD BUTTON
========================================================= -->

<button
    id="addButton"
    class="fab"
    type="button"
    aria-label="Post a new ad"
>
    <i class="fas fa-plus"></i>
</button>


<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<nav class="bottom-nav">

    <div
        class="nav-item active"
        id="navHome"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-house"></i>
        <span>Home</span>
    </div>

    <div
        class="nav-item"
        id="navSearch"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-magnifying-glass"></i>
        <span>Search</span>
    </div>

    <div
        class="nav-item"
        id="navSaved"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-heart"></i>
        <span>Saved</span>
    </div>

    <div
        class="nav-item"
        id="navMessages"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-comment"></i>
        <span>Messages</span>
    </div>

    <div
        class="nav-item"
        id="navProfile"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-user"></i>
        <span>Profile</span>
    </div>

</nav>


<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>


<script>

const $ = id =>

/* =========================================================
   INITIALIZE SUPABASE CLIENT
========================================================= */

function initializeSupabase(){

    if(supabaseClient){
        return supabaseClient;
    }

    if(
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
    ){
        throw new Error(
            "Supabase JavaScript library could not be loaded."
        );
    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth:{
                    persistSession:true,
                    autoRefreshToken:true,
                    detectSessionInUrl:true
                }
            }
        );

    return supabaseClient;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        $("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    window.clearTimeout(
        showToast.timer
    );

    showToast.timer =
        window.setTimeout(
            () => {
                toast.classList.remove("show");
            },
            2800
        );
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    type,
    message = "",
    detail = ""
){

    $("errorStatus")
        .classList
        .remove("visible");

    $("emptyStatus")
        .classList
        .remove("visible");

    const detailBox =
        $("errorDetail");

    detailBox.style.display =
        "none";

    detailBox.textContent =
        "";

    if(type === "error"){

        $("errorMessage")
            .textContent =
            message;

        if(detail){

            detailBox.textContent =
                detail;

            detailBox.style.display =
                "block";
        }

        $("errorStatus")
            .classList
            .add("visible");

        return;
    }

    if(type === "empty"){

        $("emptyStatus")
            .classList
            .add("visible");
    }
}


function hideStatuses(){

    $("errorStatus")
        .classList
        .remove("visible");

    $("emptyStatus")

}

/* =========================================================
   PRICE
========================================================= */

function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return "Price on request";
    }

    const numeric =
        Number(value);

    if(
        Number.isFinite(numeric)
    ){

        return new Intl.NumberFormat(
            "en-US",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        ).format(numeric) + " €";
    }

    return escapeHtml(
        String(value)
    );
}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value){
        return "";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "";
    }

    return new Intl.DateTimeFormat(
        undefined,
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ).format(date);
}

/* =========================================================
   NORMALIZE PHOTOS
========================================================= */

function normalizePhotos(value){

    if(!value){
        return [];
    }


    if(Array.isArray(value)){

        return value.filter(
            item =>
                typeof item === "string" &&
                item.trim()
        );
    }


    if(typeof value === "string"){

        try{

            const parsed =
                JSON.parse(value);

            if(Array.isArray(parsed)){

                return parsed.filter(
                    item =>
                        typeof item === "string" &&
                        item.trim()
                );
            }

        }catch(_){}


        if(
            value.startsWith("data:image/") ||
            value.startsWith("http://") ||
            value.startsWith("https://")
        ){
            return [value];
        }

    }


    return [];
}


/* =========================================================
   GET AUTH TOKEN
========================================================= */

async function getAccessToken(){

    try{

        const client =
            initializeSupabase();

        const result =
            await client.auth.getSession();

        const session =
            result?.data?.session;

        if(
            session &&
            session.access_token
        ){
            return session.access_token;
        }

    }catch(error){

        console.warn(
            "[HAVKAR] Could not read Supabase session:",
            error
        );
    }


    return SUPABASE_PUBLISHABLE_KEY;
}


/* =========================================================
   REST REQUEST
========================================================= */

async function supabaseRestRequest(
    path,
    options = {}
){

    const token =
        await getAccessToken();


    const headers = {

        "apikey":
            SUPABASE_PUBLISHABLE_KEY,

        "Authorization":
            "Bearer " + token,

        "Accept":
            "application/json"

    };


    if(options.headers){

        Object.assign(
            headers,
            options.headers
        );
    }


    let response;


    try{

        response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/" +
                path,
                {
                    method:
                        options.method || "GET",

                    headers,

                    cache:"no-store"
                }
            );

    }catch(error){

        const networkError =
            new Error(
                "Network request to Supabase failed."
            );

        networkError.originalError =
            error;

        networkError.isNetworkError =
            true;

        throw networkError;
    }


    const rawText =
        await response.text();


    let body =
        null;


    if(rawText){

        try{
            body =
                JSON.parse(rawText);
        }catch(_){
            body =
                rawText;
        }

    }


    if(!response.ok){

        const error =
            new Error(
                typeof body === "string"
                ? body
                : (
                    body?.message ||
                    body?.error_description ||
                    body?.hint ||
                    "Supabase request failed."
                )
            );

        error.status =
            response.status;

        error.statusText =
            response.statusText;

        error.details =
            body?.details || "";

        error.hint =
            body?.hint || "";

        error.code =
            body?.code || "";

        error.responseBody =
            rawText;

        throw error;
    }


    return body;
}


/* =========================================================
   FETCH LISTINGS
========================================================= */

async function fetchListings(){

    initializeSupabase();


    /*
       IMPORTANT:

       We only request fields that are actually written
       by post-ad.html.

       created_at is intentionally NOT required here.
       photos are intentionally NOT downloaded here.
    */

    const selectFields =
        [
            "id",
            "title",
            "category",
            "price",
            "location",
            "description",
            "user_id"
        ].join(",");


    const query =
        "ads" +
        "?select=" +
        encodeURIComponent(selectFields) +
        "&limit=50";


    const data =
        await supabaseRestRequest(
            query
        );


    if(!Array.isArray(data)){

        throw new Error(
            "Supabase returned an invalid listings response."
        );
    }


    return data;
}


/* =========================================================
   FETCH PHOTOS FOR ONE AD
========================================================= */

async function fetchPhotosForAd(
    adId
){

    if(!adId){
        return [];
    }


    const cacheKey =
        String(adId);


    if(
        state.imageCache.has(
            cacheKey
        )
    ){

        return state.imageCache.get(
            cacheKey
        );
    }


    try{

        const query =
            "ads" +
            "?select=photos" +
            "&id=eq." +
            encodeURIComponent(
                String(adId)
            ) +
            "&limit=1";


        const data =
            await supabaseRestRequest(
                query
            );


        const row =
            Array.isArray(data)
            ? data[0]
            : null;


        const photos =
            normalizePhotos(
                row?.photos
            );


        state.imageCache.set(
            cacheKey,
            photos
        );


        return photos;

    }catch(error){

        console.warn(
            "[HAVKAR] Photo request failed:",
            error
        );

        state.imageCache.set(
            cacheKey,
            []
        );

        return [];
    }
}


/* =========================================================
   ERROR MESSAGE
========================================================= */

function getErrorInfo(error){

    if(
        error?.isNetworkError
    ){

        return {

            message:
                "HAVKAR could not connect to the Supabase API.",

            detail:
                "The browser could not complete the request to " +
                SUPABASE_URL +
                ". Check the Supabase project/API status or browser network connection."

        };
    }


    const status =
        Number(
            error?.status ||
            error?.statusCode ||
            0
        );


    const message =
        String(
            error?.message ||
            ""
        ).trim();


    const details =
        String(
            error?.details ||
            ""
        ).trim();


    const hint =
        String(
            error?.hint ||
            ""
        ).trim();


    const code =
        String(
            error?.code ||
            ""
        ).trim();


    if(
        status === 401
    ){

        return {

            message:
                "Supabase rejected the request (401).",

            detail:
                "The public Supabase key or authentication token was rejected." +
                (message
                    ? " " + message
                    : "")

        };
    }


    if(
        status === 403
    ){

        return {

            message:
                "Supabase denied access to the ads table (403).",

            detail:
                "The Buy & Sell page reached Supabase, but the current Row Level Security policy does not allow SELECT on the ads table." +
                (message
                    ? " " + message
                    : "")

        };
    }


    if(
        status === 404
    ){

        return {

            message:
                "The Supabase ads API endpoint was not found (404).",

            detail:
                message ||
                "Check that the ads table exists in the public schema."

        };
    }


    if(
        /column .* does not exist/i.test(
            message
        )
    ){

        return {

            message:
                "The ads table structure does not match the Buy & Sell page.",

            detail:
                message

        };
    }


    if(
        /relation .* does not exist/i.test(
            message
        ) ||
        /table .* does not exist/i.test(
            message
        )
    ){

        return {

            message:
                "The Supabase ads table was not found.",

            detail:
                message

        };
    }


    if(
        message ||
        details ||
        hint
    ){

        const parts = [];

        if(code){
            parts.push(
                "code=" + code
            );
        }

        if(status){
            parts.push(
                "HTTP=" + status
            );
        }

        if(message){
            parts.push(
                message
            );
        }

        if(details){
            parts.push(
                "details: " + details
            );
        }

        if(hint){
            parts.push(
                "hint: " + hint
            );
        }


        return {

            message:
                "Supabase could not load the listings.",

            detail:
                parts.join(" | ")

        };
    }


    return {

        message:
            "HAVKAR could not load the listings.",

        detail:
            "No additional error information was returned."

    };
}

/* =========================================================
   LOAD CARD IMAGE
========================================================= */

async function loadCardImage(
    container
){

    if(
        !container ||
        container.dataset.loaded === "1"
    ){
        return;
    }


    container.dataset.loaded =
        "1";


    const adId =
        container.dataset.imageId;


    const image =
        container.querySelector(
            "img"
        );


    const loading =
        container.querySelector(
            ".image-loading"
        );


    if(!adId){

        if(loading){
            loading.style.display =
                "none";
        }

        return;
    }


    try{

        const photos =
            await fetchPhotosForAd(
                adId
            );


        const firstPhoto =
            photos[0];


        if(firstPhoto){

            image.src =
                firstPhoto;


            image.addEventListener(
                "load",
                () => {

                    image.classList.add(
                        "loaded"
                    );

                    container.classList.add(
                        "has-image"
                    );

                    if(loading){
                        loading.style.display =
                            "none";
                    }

                },
                {
                    once:true
                }
            );


            image.addEventListener(
                "error",
                () => {

                    if(loading){
                        loading.style.display =
                            "none";
                    }

                },
                {
                    once:true
                }
            );

        }else{

            if(loading){
                loading.style.display =
                    "none";
            }

        }

    }catch(error){

        console.warn(
            "[HAVKAR] Could not load image:",
            error
        );

        if(loading){
            loading.style.display =
                "none";
        }
    }
}


/* =========================================================
   IMAGE OBSERVER
========================================================= */

function setupImageObserver(){

    state.imageObservers
        .forEach(
            observer =>
                observer.disconnect()
        );


    state.imageObservers =
        [];


    const images =
        $("adsGrid")
            .querySelectorAll(
                ".ad-image[data-image-id]"
            );


    if(
        !("IntersectionObserver" in window)
    ){

        images.forEach(
            loadCardImage
        );

        return;
    }


    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(
                    entry => {

                        if(
                            !entry.isIntersecting
                        ){
                            return;
                        }


                        observer.unobserve(
                            entry.target
                        );


                        loadCardImage(
                            entry.target
                        );

                    }
                );

            },
            {
                rootMargin:
                    "300px 0px"
            }
        );


    images.forEach(
        element =>
            observer.observe(
                element
            )
    );


    state.imageObservers.push(
        observer
    );
}


/* =========================================================
   OPEN AD
========================================================= */

function openAd(
    id
){

    if(!id){

        showToast(
            "This listing does not have a valid ID."
        );

        return;
    }


    window.location.href =
        "ad-details.html?id=" +
        encodeURIComponent(

        );
}


/* =========================================================
   RENDER ADS
========================================================= */

function renderAds(
    list
){

    const grid =
        $("adsGrid");


    state.imageObservers
        .forEach(
            observer =>
                observer.disconnect()
        );


    state.imageObservers =
        [];


    grid.innerHTML =
        list
            .map(
                (ad,index) =>
                    cardHtml(
                        ad,
                        index
                    )
            )
            .join("");


    $("resultsCount")
        .textContent =
        list.length === 1
        ? "1 listing"
        : `${list.length} listings`;


    if(!list.length){

        showStatus(
            "empty"
        );

    }else{

        hideStatuses();

    }


    grid
        .querySelectorAll(
            ".ad-card"
        )
        .forEach(
            card => {

                const open =
                    () =>
                        openAd(
                            card.dataset.adId
                        );


                card.addEventListener(
                    "click",
                    open
                );


                card.addEventListener(
                    "keydown",
                    event => {

                        if(
                            event.key === "Enter" ||
                            event.key === " "
                        ){

                            event.preventDefault();

                            open();

                        }

                    }
                );

            }
        );


    setupImageObserver();
}


/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

    const search =
        state.search
            .trim()
            .toLowerCase();


    const category =
        state.category;


    state.filteredAds =
        state.ads.filter(
            ad => {

                const adCategory =
                    String(
                        ad.category ||
                        ""
                    ).trim();


                const categoryMatch =
                    category === "All" ||
                    adCategory.toLowerCase() ===
                    category.toLowerCase();


                if(!categoryMatch){
                    return false;
                }


                if(!search){
                    return true;
                }


                const haystack = [

                    ad.title,

                    ad.category,

                    ad.location,

                    ad.description,

                    ad.price

                ]
                .join(" ")
                .toLowerCase();


                return haystack.includes(
                    search
                );

            }
        );


    $("resultsTitle")
        .textContent =
        search ||
        category !== "All"
        ? "Search results"
        : "Latest listings";


    renderAds(
        state.filteredAds
    );
}


/* =========================================================
   LOAD LISTINGS
========================================================= */

async function loadListings(){

    const requestId =
        ++state.requestId;


    hideStatuses();


    $("adsGrid")
        .innerHTML =
        "";


    renderSkeletons();


    setLoading(
        true
    );


    $("resultsCount")
        .textContent =
        "Loading...";


    try{

        const ads =
            await fetchListings();


        if(
            requestId !==
            state.requestId
        ){
            return;
        }


        state.ads =
            ads;


        state.imageCache.clear();


        /*
           We do not rely on created_at.

           If the backend includes it in a future schema,
           it can be used later. For now the page remains
           compatible with the fields actually written by
           post-ad.html.
        */


        applyFilters();


    }catch(error){

        if(
            requestId !==
            state.requestId
        ){
            return;
        }


        console.error(
            "[HAVKAR] Listings load failed:",
            error
        );


        state.ads =
            [];

        state.filteredAds =
            [];


        $("adsGrid")
            .innerHTML =
            "";


        $("resultsCount")
            .textContent =
            "Unavailable";


        const errorInfo =
            getErrorInfo(
                error
            );


        showStatus(
            "error",
            errorInfo.message,
            errorInfo.detail
        );


    }finally{

        if(
            requestId ===
            state.requestId
        ){

            setLoading(
                false
            );


            $("skeletonGrid")
                .innerHTML =
                "";


            $("skeletonGrid")
                .style.display =
                "none";
        }
    }
}

                $("searchInput")
                    .focus();

                window.scrollTo(
                    {
                        top:0,
                        behavior:"smooth"
                    }
                );

            }
        );


    $("navSaved")
        .addEventListener(
            "click",
            () => {

                showToast(
                    "Saved listings will appear here."
                );

            }
        );


    $("navMessages")
        .addEventListener(
            "click",
            goMessages
        );


    $("navProfile")
        .addEventListener(
            "click",
            goProfile
        );


    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(
            item => {

                item.addEventListener(
                    "keydown",
                    event => {

                        if(
                            event.key === "Enter" ||
                            event.key === " "
                        ){

                            event.preventDefault();

                            item.click();

                        }

                    }
                );

            }
        );
}


/* =========================================================
   SEARCH
========================================================= */

function setupSearch(){

    const input =
        $("searchInput");


    const clear =
        $("clearSearch");


    input.addEventListener(
        "input",
        () => {

            state.search =
                input.value;


            clear.classList.toggle(
                "visible",
                Boolean(
                    input.value
                )
            );


            applyFilters();

        }
    );


    clear.addEventListener(
        "click",
        () => {

            input.value =
                "";

            state.search =
                "";

            clear.classList.remove(
                "visible"
            );


            applyFilters();


            input.focus();

        }
    );
}


/* =========================================================
   RETRY
========================================================= */

function setupRetry(){

    $("retryButton")
        .addEventListener(
            "click",
            loadListings
        );
}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

    try{

        initializeSupabase();

        renderCategories();

        setupNavigation();

        setupSearch();

        setupRetry();

        renderSkeletons();

        await loadListings();

    }catch(error){

        console.error(
            "[HAVKAR] Application startup failed:",
            error
        );


        $("skeletonGrid")
            .style.display =
            "none";


        $("resultsCount")
            .textContent =
            "Unavailable";


        const errorInfo =
            getErrorInfo(
                error
            );


        showStatus(
            "error",
            errorInfo.message,
            errorInfo.detail
        );

    }
}


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    boot
);

</script>

</body>
</html>
