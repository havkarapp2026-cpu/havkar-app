<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#2e7d32"
>

<meta
    name="description"
    content="HAVKAR Buy & Sell - Fast local marketplace for products, services and listings."
>

<title>HAVKAR - Buy & Sell</title>

<link
    rel="preconnect"
    href="https://cdnjs.cloudflare.com"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
>

<style>

/* =========================================================
   HAVKAR BUY & SELL
   Professional single-page marketplace client
   ========================================================= */


/* =========================================================
   ROOT
   ========================================================= */

:root {

    --primary: #2e7d32;
    --primary-light: #43a047;
    --primary-dark: #1b5e20;
    --primary-soft: #e8f5e9;

    --background: #f5f7f5;
    --surface: #ffffff;

    --text: #202124;
    --muted: #70757a;
    --border: #e0e4e0;

    --danger: #c62828;
    --danger-soft: #ffebee;

    --warning: #ef6c00;
    --warning-soft: #fff3e0;

    --shadow-sm:
        0 2px 8px rgba(0,0,0,.055);

    --shadow-md:
        0 7px 22px rgba(0,0,0,.10);

    --radius: 16px;

    --header-height: 68px;
    --nav-height: 74px;

}


/* =========================================================
   RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    padding-bottom:
        calc(
            var(--nav-height)
            + env(safe-area-inset-bottom)
        );

    -webkit-font-smoothing: antialiased;

}

button,
input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible {

    outline:
        3px solid rgba(67,160,71,.24);

    outline-offset:
        2px;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    position:
        sticky;

    top:
        0;

    z-index:
        1000;

    min-height:
        var(--header-height);

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        11px 18px;

    color:
        #fff;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    box-shadow:
        0 2px 12px rgba(0,0,0,.14);

}

.header-left {

    min-width:
        0;

    display:
        flex;

    align-items:
        center;

    gap:
        13px;

}

.header-right {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

}

.back-btn,
.header-icon-btn {

    width:
        42px;

    height:
        42px;

    flex:
        0 0 42px;

    border:
        0;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #fff;

    background:
        rgba(255,255,255,.15);

    cursor:
        pointer;

    transition:
        transform .15s ease,
        background .2s ease;

}

.back-btn:hover,
.header-icon-btn:hover {

    background:
        rgba(255,255,255,.23);

}

.back-btn:active,
.header-icon-btn:active {

    transform:
        scale(.93);

}

.back-btn i {
    font-size: 1.28rem;
}

.header-icon-btn i {
    font-size: 1.05rem;
}

.header h1 {

    min-width:
        0;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

    font-size:
        1.24rem;

    font-weight:
        750;

}


/* =========================================================
   SEARCH AREA
   ========================================================= */

.search-section {

    position:
        sticky;

    top:
        var(--header-height);

    z-index:
        900;

    background:
        var(--surface);

    padding:
        13px 18px 11px;

    border-bottom:
        1px solid rgba(0,0,0,.045);

}

.search-wrapper {

    position:
        relative;

    width:
        100%;

}

.search-icon {

    position:
        absolute;

    left:
        17px;

    top:
        50%;

    transform:
        translateY(-50%);

    color:
        #858a85;

    pointer-events:
        none;

    font-size:
        1.05rem;

}

.search-input {

    width:
        100%;

    height:
        50px;

    padding:
        0 48px;

    border:
        2px solid var(--border);

    border-radius:
        27px;

    background:
        #fff;

    color:
        var(--text);

    font-size:
        1rem;

    outline:
        none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;

}

.search-input::placeholder {
    color: #8a8f8a;
}

.search-input:focus {

    border-color:
        var(--primary-light);

    box-shadow:
        0 0 0 4px rgba(67,160,71,.10);

}

.clear-search {

    position:
        absolute;

    right:
        9px;

    top:
        50%;

    transform:
        translateY(-50%);

    width:
        34px;

    height:
        34px;

    border:
        0;

    border-radius:
        50%;

    background:
        #f0f2f0;

    color:
        #666;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    cursor:
        pointer;

}

.clear-search.show {
    display: flex;
}


/* =========================================================
   CATEGORY BAR
   ========================================================= */

.filters {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    padding:
        2px 18px 13px;

    overflow-x:
        auto;

    background:
        var(--surface);

    border-bottom:
        1px solid rgba(0,0,0,.045);

    scrollbar-width:
        none;

    -webkit-overflow-scrolling:
        touch;

}

.filters::-webkit-scrollbar {
    display: none;
}

.filter-btn {

    flex:
        0 0 auto;

    min-height:
        40px;

    padding:
        8px 17px;

    border:
        2px solid var(--border);

    border-radius:
        22px;

    background:
        #fff;

    color:
        var(--text);

    font-size:
        .89rem;

    font-weight:
        650;

    white-space:
        nowrap;

    cursor:
        pointer;

    transition:
        all .18s ease;

}

.filter-btn:hover {
    border-color: var(--primary-light);
}

.filter-btn:active {
    transform: scale(.97);
}

.filter-btn.active {

    color:
        #fff;

    border-color:
        var(--primary-light);

    background:
        var(--primary-light);

}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.content {

    width:
        100%;

    max-width:
        1440px;

    margin:
        0 auto;

    padding:
        17px 18px 42px;

}

.results-header {

    min-height:
        25px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        14px;

}

.results-title {

    font-size:
        1rem;

    font-weight:
        750;

}

.results-count {

    color:
        var(--muted);

    font-size:
        .80rem;

}


/* =========================================================
   GRID
   ========================================================= */

.ads-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:
        13px;

}


/* =========================================================
   CARD
   ========================================================= */

.ad-card {

    min-width:
        0;

    overflow:
        hidden;

    background:
        var(--surface);

    border-radius:
        var(--radius);

    box-shadow:
        var(--shadow-sm);

    cursor:
        pointer;

    transition:
        transform .16s ease,
        box-shadow .16s ease;

}

.ad-card:hover {

    transform:
        translateY(-2px);

    box-shadow:
        var(--shadow-md);

}

.ad-card:active {
    transform: scale(.985);
}


/* =========================================================
   IMAGE
   ========================================================= */

.ad-image {

    position:
        relative;

    width:
        100%;

    aspect-ratio:
        1 / .86;

    overflow:
        hidden;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        linear-gradient(
            135deg,
            #e7ebe7,
            #f7f8f7
        );

}

.ad-image img {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    display:
        block;

    opacity:
        0;

    transition:
        opacity .22s ease;

}

.ad-image img.loaded {
    opacity: 1;
}

.ad-image-placeholder {

    position:
        relative;

    z-index:
        1;

    color:
        #9aa19a;

    font-size:
        2.5rem;

}

.ad-image.has-image
.ad-image-placeholder {

    display:
        none;

}

.ad-condition {

    position:
        absolute;

    z-index:
        3;

    top:
        9px;

    left:
        9px;

    padding:
        5px 8px;

    border-radius:
        8px;

    color:
        #fff;

    background:
        rgba(0,0,0,.62);

    font-size:
        .66rem;

    font-weight:
        700;

}


/* =========================================================
   CARD INFO
   ========================================================= */

.ad-info {

    padding:
        10px;

}

.ad-title {

    min-height:
        2.45em;

    margin-bottom:
        5px;

    display:
        -webkit-box;

    -webkit-box-orient:
        vertical;

    -webkit-line-clamp:
        2;

    overflow:
        hidden;

    color:
        var(--text);

    font-size:
        .91rem;

    font-weight:
        720;

    line-height:
        1.3;

}

.ad-price {

    margin-bottom:
        5px;

    color:
        var(--primary-dark);

    font-size:
        1.04rem;

    font-weight:
        800;

}

.ad-location {

    display:
        flex;

    align-items:
        center;

    gap:
        5px;

    min-width:
        0;

    color:
        var(--muted);

    font-size:
        .75rem;

}

.ad-location i {

    flex:
        0 0 auto;

    color:
        var(--primary-light);

}

.ad-location span {

    min-width:
        0;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

}

.ad-category {

    margin-top:
        6px;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

    color:
        #8b908b;

    font-size:
        .69rem;

}


/* =========================================================
   STATUS
   ========================================================= */

.status {

    display:
        none;

    width:
        100%;

    padding:
        45px 18px;

    text-align:
        center;

}

.status.show {
    display: block;
}

.status-icon {

    width:
        64px;

    height:
        64px;

    margin:
        0 auto 15px;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        var(--primary-soft);

    color:
        var(--primary);

    font-size:
        1.45rem;

}

.status-title {

    margin-bottom:
        7px;

    color:
        var(--text);

    font-size:
        1.04rem;

    font-weight:
        750;

}

.status-text {

    max-width:
        480px;

    margin:
        0 auto;

    color:
        var(--muted);

    font-size:
        .87rem;

    line-height:
        1.55;

}

.status.error
.status-icon {

    background:
        var(--danger-soft);

    color:
        var(--danger);

}

.status.error
.status-title {

    color:
        var(--danger);

}

.retry-btn {

    margin-top:
        18px;

    padding:
        11px 20px;

    border:
        0;

    border-radius:
        12px;

    color:
        #fff;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-light)
        );

    font-weight:
        700;

    cursor:
        pointer;

    box-shadow:
        0 5px 14px rgba(46,125,50,.23);

}

.retry-btn:active {
    transform: scale(.97);
}


/* =========================================================
   SKELETON
   ========================================================= */

.skeleton-card {

    overflow:
        hidden;

    border-radius:
        var(--radius);

    background:
        #fff;

    box-shadow:
        var(--shadow-sm);

}

.skeleton {

    background:
        linear-gradient(
            90deg,
            #eeeeee 25%,
            #f8f8f8 38%,
            #eeeeee 63%
        );

    background-size:
        400% 100%;

    animation:
        skeletonMove 1.35s ease infinite;

}

.skeleton-image {

    width:
        100%;

    aspect-ratio:
        1 / .86;

}

.skeleton-line {

    height:
        11px;

    margin:
        11px;

    border-radius:
        6px;

}

.skeleton-line.medium {
    width: 68%;
}

.skeleton-line.short {
    width: 43%;
}

@keyframes skeletonMove {

    0% {
        background-position:
            100% 50%;
    }

    100% {
        background-position:
            0 50%;
    }

}


/* =========================================================
   FAB
   ========================================================= */

.fab-button {

    position:
        fixed;

    right:
        18px;

    bottom:
        calc(
            var(--nav-height)
            + 17px
            + env(safe-area-inset-bottom)
        );

    z-index:
        1100;

    width:
        60px;

    height:
        60px;

    border:
        0;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #fff;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    font-size:
        1.55rem;

    cursor:
        pointer;

    box-shadow:
        0 7px 23px rgba(46,125,50,.38);

    transition:
        transform .18s ease;

}

.fab-button:hover {
    transform: translateY(-2px);
}

.fab-button:active {
    transform: scale(.93);
}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {

    position:
        fixed;

    left:
        0;

    right:
        0;

    bottom:
        0;

    z-index:
        1000;

    height:
        calc(
            var(--nav-height)
            + env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    display:
        flex;

    align-items:
        flex-start;

    justify-content:
        space-around;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:
        0 -2px 12px rgba(0,0,0,.10);

}

.nav-item {

    flex:
        1;

    height:
        var(--nav-height);

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        5px;

    color:
        #929792;

    font-size:
        .71rem;

    font-weight:
        550;

    cursor:
        pointer;

    transition:
        color .18s ease;

}

.nav-item i {
    font-size: 1.27rem;
}

.nav-item.active {
    color: var(--primary-light);
}

.nav-item:active {
    opacity: .70;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        calc(
            var(--nav-height)
            + 20px
            + env(safe-area-inset-bottom)
        );

    z-index:
        3000;

    max-width:
        calc(100vw - 32px);

    padding:
        12px 17px;

    transform:
        translateX(-50%);

    border-radius:
        12px;

    color:
        #fff;

    background:
        #242624;

    font-size:
        14px;

    font-weight:
        600;

    text-align:
        center;

    box-shadow:
        0 8px 28px rgba(0,0,0,.23);

    animation:
        toastIn .18s ease;

}

@keyframes toastIn {

    from {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(8px);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0);
    }

}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 650px) {

    .ads-grid {

        grid-template-columns:
            repeat(
                3,
                minmax(0,1fr)
            );

        gap:
            17px;

    }

}


/* =========================================================
   LARGE DESKTOP
   ========================================================= */

@media (min-width: 950px) {

    .ads-grid {

        grid-template-columns:
            repeat(
                4,
                minmax(0,1fr)
            );

        gap:
            20px;

    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 500px) {

    :root {
        --header-height: 64px;
    }

    .header {
        padding:
            10px 13px;
    }

    .header h1 {
        font-size:
            1.16rem;
    }

    .search-section {

        top:
            var(--header-height);

        padding:
            11px 12px 10px;

    }

    .filters {

        padding:
            2px 12px 11px;

    }

    .content {

        padding:
            14px 12px 32px;

    }

    .ads-grid {
        gap: 11px;
    }

    .ad-info {
        padding: 9px;
    }

    .ad-title {
        font-size: .88rem;
    }

    .ad-price {
        font-size: .99rem;
    }

    .ad-location {
        font-size: .73rem;
    }

    .fab-button {
        right: 15px;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        scroll-behavior:
            auto !important;

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-btn"
            type="button"
            aria-label="Back">

            <i class="fas fa-arrow-left"></i>

        </button>

        <h1>Buy &amp; Sell</h1>

    </div>


    <div class="header-right">

        <button
            id="notificationButton"
            class="header-icon-btn"
            type="button"
            aria-label="Notifications">

            <i class="fas fa-bell"></i>

        </button>


        <button
            id="profileButton"
            class="header-icon-btn"
            type="button"
            aria-label="Profile">

            <i class="fas fa-user"></i>

        </button>

    </div>

</header>


<!-- =========================================================
     SEARCH
     ========================================================= -->

<section class="search-section">

    <div class="search-wrapper">

        <i
            class="fas fa-search search-icon"
            aria-hidden="true">
        </i>


        <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="Search products, services..."
            aria-label="Search products and services"
        >


        <button
            id="clearSearch"
            class="clear-search"
            type="button"
            aria-label="Clear search">

            <i class="fas fa-times"></i>

        </button>

    </div>

</section>


<!-- =========================================================
     CATEGORIES
     ========================================================= -->

<nav
    id="filters"
    class="filters"
    aria-label="Listing categories">
</nav>


<!-- =========================================================
     MAIN
     ========================================================= -->

<main class="content">


    <div class="results-header">

        <div
            id="resultsTitle"
            class="results-title">

            Latest listings

        </div>


        <div
            id="resultsCount"
            class="results-count">

            —

        </div>

    </div>


    <!-- =====================================================
         LOADING
         ===================================================== -->

    <div
        id="loadingStatus"
        class="status">

        <div class="status-icon">

            <i class="fas fa-spinner fa-spin"></i>

        </div>

        <div class="status-title">
            Loading listings
        </div>

        <div class="status-text">
            HAVKAR is loading the latest listings.
        </div>

    </div>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
        id="errorStatus"
        class="status error">

        <div class="status-icon">

            <i class="fas fa-circle-exclamation"></i>

        </div>

        <div class="status-title">
            Could not load listings
        </div>

        <div
            id="errorText"
            class="status-text">

            Unable to connect to the listings service.

        </div>


        <button
            id="retryButton"
            class="retry-btn"
            type="button">

            <i class="fas fa-rotate-right"></i>

            Try again

        </button>

    </div>


    <!-- =====================================================
         EMPTY
         ===================================================== -->

    <div
        id="emptyStatus"
        class="status">

        <div class="status-icon">

            <i class="fas fa-box-open"></i>

        </div>

        <div class="status-title">
            No listings found
        </div>

        <div class="status-text">
            There are no listings matching your search or category.
        </div>

    </div>


    <!-- =====================================================
         SKELETON
         ===================================================== -->

    <div
        id="skeletonGrid"
        class="ads-grid"
        style="display:none;">

    </div>


    <!-- =====================================================
         ADS
         ===================================================== -->

    <div
        id="adsGrid"
        class="ads-grid">

    </div>

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   SAFE STRING
   ========================================================= */

function safeString(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value).trim();

}


/* =========================================================
   PRICE
   ========================================================= */

function formatPrice(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "Price not specified";

    }


    const number =
        Number(value);


    if (!Number.isFinite(number)) {

        return escapeHtml(
            safeString(value)
        );

    }


    return new Intl.NumberFormat(
        "en-US",
        {
            style: "currency",
            currency: "EUR",
            maximumFractionDigits: 2
        }
    ).format(number);

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return new Intl.DateTimeFormat(
        "en-GB",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    ).format(date);

}


/* =========================================================
   IMAGE EXTRACTION
   ========================================================= */

function getFirstImage(ad) {

    if (!ad) {
        return null;
    }


    const photos =
        ad.photos;


    if (Array.isArray(photos)) {

        for (
            const photo of photos
        ) {

            if (
                typeof photo === "string" &&
                photo.trim()
            ) {

                return photo.trim();

            }

        }

    }


    if (
        typeof photos === "string" &&
        photos.trim()
    ) {

        const value =
            photos.trim();


        try {

            const parsed =
                JSON.parse(value);


            if (Array.isArray(parsed)) {

                for (
                    const photo of parsed
                ) {

                    if (
                        typeof photo === "string" &&
                        photo.trim()
                    ) {

                        return photo.trim();

                    }

                }

            }

        }

        catch (_) {

            if (
                value.startsWith("https://") ||
                value.startsWith("http://")
            ) {

                return value;

            }

        }

    }


    const fallbackFields = [

        "image_url",
        "image",
        "thumbnail_url",
        "thumbnail"

    ];


    for (
        const field of fallbackFields
    ) {

        if (
            typeof ad[field] === "string" &&
            ad[field].trim()
        ) {

            return ad[field].trim();

        }

    }


    return null;

}


/* =========================================================
   ERROR MESSAGE
   ========================================================= */

function readableError(error) {

    if (
        !navigator.onLine
    ) {

        return (
            "Your device is offline. " +
            "Please check your internet connection."
        );

    }


    const message =
        safeString(
            error &&
            error.message
        );


    const lower =
        message.toLowerCase();


    if (
        lower.includes("abort") ||
        lower.includes("timed out")
    ) {

        return (
            "The listings server took too long to respond. " +
            "Please try again."
        );

    }


    if (
        lower.includes("401")
    ) {

        return (
            "The listings server rejected the application key."
        );

    }


    if (
        lower.includes("403")
    ) {

        return (
            "The listings table denied public access. " +
            "The Supabase Row Level Security policy needs to allow reading listings."
        );

    }


    if (
        lower.includes("404")
    ) {

        return (
            "The listings endpoint or ads table could not be found."
        );

    }


    if (
        lower.includes("42501")
    ) {

        return (
            "Supabase denied access to the ads table. " +
            "Check the SELECT policy for the ads table."
        );

    }


    if (
        lower.includes("failed to fetch") ||
        lower.includes("networkerror")
    ) {

        return (
            "HAVKAR could not reach the listings server. " +
            "The problem is between the browser and Supabase."
        );

    }


    if (message) {

        return message;

    }


    return (
        "An unexpected error occurred while loading listings."
    );

}

/* =========================================================
   SEARCH TEXT
   ========================================================= */

function searchableText(ad) {

    return [

        ad.title,
        ad.description,
        ad.location,
        ad.category,
        ad.city,
        ad.region,
        ad.country

    ]

        .map(safeString)

        .join(" ")

        .toLowerCase();

}


/* =========================================================
   CATEGORY MATCH
   ========================================================= */

function categoryMatches(ad) {

    if (
        state.category ===
        "All"
    ) {

        return true;

    }


    return (
        safeString(ad.category)
            .toLowerCase() ===
        state.category.toLowerCase()
    );

}


/* =========================================================
   FILTER ENGINE
   ========================================================= */

function applyFilters() {

    const search =
        state.search;


    state.filteredAds =
        state.ads.filter(
            function(ad) {

                if (
                    !categoryMatches(ad)
                ) {

                    return false;

                }


                if (!search) {

                    return true;

                }


                return searchableText(
                    ad
                ).includes(
                    search
                );

            }
        );


    updateResultsHeader();

    renderAds(
        state.filteredAds
    );

}


/* =========================================================
   RESULTS HEADER
   ========================================================= */

function updateResultsHeader() {

    const count =
        state.filteredAds.length;


    if (state.search) {

        resultsTitle.textContent =
            "Search results";

    }

    else if (
        state.category !==
        "All"
    ) {

        resultsTitle.textContent =
            state.category;

    }

    else {

        resultsTitle.textContent =
            "Latest listings";

    }


    resultsCount.textContent =
        count +
        (
            count === 1
                ? " listing"
                : " listings"
        );

}

/* =========================================================
   AD CARD
   ========================================================= */

function createAdCard(ad) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "ad-card";


    card.setAttribute(
        "role",
        "button"
    );


    card.setAttribute(
        "tabindex",
        "0"
    );


    const id =
        safeString(ad.id);


    card.dataset.id =
        id;


    const title =
        safeString(ad.title) ||
        "Untitled listing";


    const location =
        safeString(ad.location) ||
        safeString(ad.city) ||
        "Location not specified";


    const category =
        safeString(ad.category) ||
        "Other";


    const condition =
        safeString(ad.condition);


    const date =
        formatDate(
            ad.created_at
        );


    card.innerHTML = `

        ${createImageMarkup(ad)}

        <div class="ad-info">

            <div class="ad-title">

                ${escapeHtml(title)}

            </div>

            <div class="ad-price">

                ${formatPrice(ad.price)}

            </div>

            <div class="ad-location">

                <i
                    class="fas fa-location-dot">
                </i>

                <span>
                    ${escapeHtml(location)}
                </span>

            </div>

            <div class="ad-category">

                ${escapeHtml(category)}

                ${
                    date
                        ? " • " +
                          escapeHtml(date)
                        : ""
                }

            </div>

        </div>

    `;


    if (condition) {

        const imageBox =
            card.querySelector(
                ".ad-image"
            );


        if (imageBox) {

            const badge =
                document.createElement(
                    "div"
                );


            badge.className =
                "ad-condition";


            badge.textContent =
                condition;


            imageBox.appendChild(
                badge
            );

        }

    }


    const img =
        card.querySelector(
            ".ad-image img"
        );


    if (img) {

        img.addEventListener(
            "load",
            function() {

                img.classList.add(
                    "loaded"
                );


                const placeholder =
                    card.querySelector(
                        ".ad-image-placeholder"
                    );


                if (placeholder) {

                    placeholder.style.display =
                        "none";

                }

            },
            {
                once: true
            }
        );


        img.addEventListener(
            "error",
            function() {

                img.remove();


                const box =
                    card.querySelector(
                        ".ad-image"
                    );


                if (!box) {
                    return;
                }


                box.classList.remove(
                    "has-image"
                );


                const placeholder =
                    box.querySelector(
                        ".ad-image-placeholder"
                    );


                if (placeholder) {

                    placeholder.style.display =
                        "flex";

                }

            },
            {
                once: true
            }
        );

    }


    function open() {

        openProduct(id);

    }


    card.addEventListener(
        "click",
        open
    );


    card.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                open();

            }

        }
    );


    return card;

}

/* =========================================================
   FETCH ADS
   ========================================================= */

async function fetchAdsOnce(signal) {

    const query =
        new URLSearchParams({

            select: "*",

            order: "created_at.desc",

            limit:
                String(
                    CONFIG.pageSize
                )

        });


    const url =
        ADS_ENDPOINT +
        "?" +
        query.toString();


    const response =
        await fetch(
            url,
            {
                method: "GET",

                headers: {

                    "apikey":
                        SUPABASE_PUBLISHABLE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_PUBLISHABLE_KEY,

                    "Accept":
                        "application/json"

                },

                cache:
                    "no-store",

                signal:
                    signal

            }
        );


    if (!response.ok) {

        let serverMessage =
            "";


        try {

            serverMessage =
                await response.text();

        }

        catch (_) {

            serverMessage =
                "";

        }


        throw new Error(

            "Supabase HTTP " +
            response.status +
            (
                serverMessage
                    ? " — " +
                      serverMessage
                    : ""
            )

        );

    }


    const data =
        await response.json();


    if (!Array.isArray(data)) {

        throw new Error(
            "The listings server returned invalid data."
        );

    }


    return data;

}


/* =========================================================
   TIMEOUT
   ========================================================= */

function createTimeoutController(
    milliseconds
) {

    const controller =
        new AbortController();


    const timer =
        setTimeout(
            function() {

                controller.abort();

            },
            milliseconds
        );


    return {

        controller:
            controller,

        clear:
            function() {

                clearTimeout(
                    timer
                );

            }

    };

}


/* =========================================================
   DELAY
   ========================================================= */

function delay(milliseconds) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}


/* =========================================================
   LOAD ADS
   ========================================================= */

async function loadAds() {

    const requestNumber =
        ++state.requestNumber;


    if (state.controller) {

        state.controller.abort();

    }


    state.loading =
        true;


    showLoading();

    renderSkeletons(6);


    let lastError =
        null;


    try {

        if (
            !navigator.onLine
        ) {

            throw new Error(
                "Your device is offline."
            );

        }


        for (
            let attempt = 1;
            attempt <= CONFIG.maxAttempts;
            attempt++
        ) {

            let timeout =
                null;


            try {

                timeout =
                    createTimeoutController(
                        CONFIG.requestTimeout
                    );


                state.controller =
                    timeout.controller;


                const data =
                    await fetchAdsOnce(
                        timeout.controller.signal
                    );


                if (
                    requestNumber !==
                    state.requestNumber
                ) {

                    return;

                }


                state.ads =
                    data;


                state.loading =
                    false;


                state.lastSuccessfulLoad =
                    Date.now();


                hideSkeletons();


                applyFilters();


                return;

            }

            catch (error) {

                lastError =
                    error;


                console.warn(
                    "[HAVKAR] Listings request failed:",
                    error
                );


                if (
                    error &&
                    error.name ===
                        "AbortError"
                ) {

                    lastError =
                        new Error(
                            "Listings request timed out."
                        );

                }


                if (
                    attempt <
                    CONFIG.maxAttempts
                ) {

                    await delay(
                        CONFIG.retryDelay
                    );

                }

            }

            finally {

                if (timeout) {

                    timeout.clear();

                }

            }

        }


        throw (
            lastError ||
            new Error(
                "Unable to load listings."
            )
        );

    }

    catch (error) {

        if (
            requestNumber !==
            state.requestNumber
        ) {

            return;

        }


        state.loading =
            false;


        state.controller =
            null;


        hideSkeletons();


        adsGrid.innerHTML =
            "";


        showError(
            readableError(
                error
            )
        );


        console.error(
            "[HAVKAR] Final listings error:",
            error
        );

    }

    finally {

        if (
            requestNumber ===
            state.requestNumber
        ) {

            state.loading =
                false;

        }

    }

}


/* =========================================================
   RETRY
   ========================================================= */

retryButton.addEventListener(
    "click",
    function() {

        loadAds();

    }
);


/* =========================================================
   ONLINE EVENT
   ========================================================= */

window.addEventListener(
    "online",
    function() {

        if (
            state.ads.length === 0
        ) {

            loadAds();

        }

    }
);


/* =========================================================
   OFFLINE EVENT
   ========================================================= */

window.addEventListener(
    "offline",
    function() {

        if (
            state.loading
        ) {

            if (state.controller) {

                state.controller.abort();

            }


            showError(
                "Internet connection was lost. " +
                "Reconnect and press Try again."
            );

        }

    }
);


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer =
    null;


function showToast(message) {

    const old =
        document.querySelector(
            ".toast"
        );


    if (old) {
        old.remove();
    }


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast";


    toast.textContent =
        safeString(message);


    document.body.appendChild(
        toast
    );


    if (toastTimer) {

        clearTimeout(
            toastTimer
        );

    }


    toastTimer =
        setTimeout(
            function() {

                toast.remove();

            },
            2800
        );

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

function initializePage() {

    createCategories();

    updateResultsHeader();

    loadAds();

}


/* =========================================================
   START
   ========================================================= */

initializePage();

</script>
