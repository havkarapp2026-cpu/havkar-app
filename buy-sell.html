<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#2e7d32"
>

<meta
    name="description"
    content="HAVKAR Buy & Sell - Fast local marketplace for products and services."
>

<title>HAVKAR - Buy & Sell</title>


<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =========================================================
     FONT AWESOME
     ========================================================= -->

<link
    rel="preconnect"
    href="https://cdnjs.cloudflare.com"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

/* =========================================================
   ROOT
   ========================================================= */

:root {

    --primary: #2e7d32;
    --primary-light: #43a047;
    --primary-dark: #1b5e20;

    --primary-soft: #e8f5e9;

    --background: #f5f7f5;
    --surface: #ffffff;

    --text: #202124;
    --muted: #70757a;

    --border: #e0e0e0;

    --danger: #c62828;
    --danger-bg: #ffebee;

    --warning: #ef6c00;
    --warning-bg: #fff3e0;

    --shadow-sm:
        0 2px 8px rgba(0,0,0,.06);

    --shadow-md:
        0 6px 20px rgba(0,0,0,.10);

    --radius: 16px;

    --nav-height: 74px;

}


/* =========================================================
   RESET
   ========================================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    padding-bottom:
        calc(
            var(--nav-height)
            + env(safe-area-inset-bottom)
        );

    -webkit-font-smoothing:
        antialiased;

}


button,
input {

    font: inherit;

}


button {

    -webkit-tap-highlight-color:
        transparent;

}


button:focus-visible,
input:focus-visible {

    outline:
        3px solid
        rgba(67,160,71,.25);

    outline-offset:
        2px;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    position: sticky;

    top: 0;

    z-index: 100;

    min-height: 68px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        12px 20px;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    box-shadow:
        0 2px 12px rgba(0,0,0,.14);

}


.header-left {

    display: flex;

    align-items: center;

    gap: 14px;

    min-width: 0;

}


.back-btn {

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,.15);

    color:
        white;

    cursor:
        pointer;

    transition:
        transform .15s ease,
        background .2s ease;

}


.back-btn:hover {

    background:
        rgba(255,255,255,.23);

}


.back-btn:active {

    transform:
        scale(.94);

}


.back-btn i {

    font-size:
        1.25rem;

}


.header h1 {

    font-size:
        1.25rem;

    font-weight:
        750;

    white-space:
        nowrap;

}


.header-right {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

}


.icon-btn {

    width: 42px;
    height: 42px;

    display:
        flex;

    align-items:
        center;
    justify-content:
        center;

    border:
        0;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.15);

    color:
        white;

    cursor:
        pointer;

    transition:
        transform .15s ease,
        background .2s ease;

}


.icon-btn:hover {

    background:
        rgba(255,255,255,.23);

}


.icon-btn:active {

    transform:
        scale(.94);

}


/* =========================================================
   SEARCH
   ========================================================= */

.search-section {

    position:
        sticky;

    top:
        68px;

    z-index:
        90;

    background:
        var(--surface);

    padding:
        14px 20px 12px;

    border-bottom:
        1px solid rgba(0,0,0,.05);

}


.search-wrapper {

    position:
        relative;

}


.search-icon {

    position:
        absolute;

    left:
        17px;

    top:
        50%;

    transform:
        translateY(-50%);

    color:
        #888;

    pointer-events:
        none;

}


.search-input {

    width:
        100%;

    height:
        50px;

    padding:
        0 48px 0 46px;

    border:
        2px solid var(--border);

    border-radius:
        26px;

    background:
        white;

    color:
        var(--text);

    font-size:
        1rem;

    outline:
        none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;

}


.search-input:focus {

    border-color:
        var(--primary-light);

    box-shadow:
        0 0 0 4px
        rgba(67,160,71,.10);

}


.search-input::placeholder {

    color:
        #8a8a8a;

}


.clear-search {

    position:
        absolute;

    right:
        10px;

    top:
        50%;

    transform:
        translateY(-50%);

    width:
        34px;

    height:
        34px;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    border:
        0;

    border-radius:
        50%;

    background:
        #f1f3f1;

    color:
        #666;

    cursor:
        pointer;

}


.clear-search.show {

    display:
        flex;

}


/* =========================================================
   FILTERS
   ========================================================= */

.filters {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    overflow-x:
        auto;

    padding:
        2px 20px 14px;

    background:
        white;

    scrollbar-width:
        none;

    -webkit-overflow-scrolling:
        touch;

}


.filters::-webkit-scrollbar {

    display:
        none;

}


.filter-btn {

    flex:
        0 0 auto;

    min-height:
        40px;

    padding:
        8px 17px;

    border:
        2px solid var(--border);

    border-radius:
        22px;

    background:
        white;

    color:
        var(--text);

    font-size:
        .9rem;

    font-weight:
        650;

    white-space:
        nowrap;

    cursor:
        pointer;

    transition:
        all .18s ease;

}


.filter-btn:hover {

    border-color:
        var(--primary-light);

}


.filter-btn:active {

    transform:
        scale(.97);

}


.filter-btn.active {

    color:
        white;

    background:
        var(--primary-light);

    border-color:
        var(--primary-light);

}


/* =========================================================
   CONTENT
   ========================================================= */

.content {

    width:
        100%;

    max-width:
        1400px;

    margin:
        0 auto;

    padding:
        18px 20px 40px;

}


.results-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        15px;

}


.results-title {

    font-size:
        1rem;

    font-weight:
        750;

}


.results-count {

    font-size:
        .82rem;

    color:
        var(--muted);

}


/* =========================================================
   ADS GRID
   ========================================================= */

.ads-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:
        14px;

}


/* =========================================================
   CARD
   ========================================================= */

.ad-card {

    min-width:
        0;

    overflow:
        hidden;

    background:
        white;

    border-radius:
        var(--radius);

    box-shadow:
        var(--shadow-sm);

    cursor:
        pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;

}


.ad-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        var(--shadow-md);

}


.ad-card:active {

    transform:
        scale(.985);

}


/* =========================================================
   IMAGE
   ========================================================= */

.ad-image {

    position:
        relative;

    width:
        100%;

    aspect-ratio:
        1 / .86;

    overflow:
        hidden;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        linear-gradient(
            135deg,
            #e8ece8,
            #f7f8f7
        );

}


.ad-image img {

    width:
        100%;

    height:
        100%;

    display:
        block;

    object-fit:
        cover;

    opacity:
        0;

    transition:
        opacity .2s ease;

}


.ad-image img.loaded {

    opacity:
        1;

}


.image-placeholder {

    position:
        absolute;

    inset:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #9aa09a;

    font-size:
        2.5rem;

    pointer-events:
        none;

}


.ad-image.has-image
.image-placeholder {

    display:
        none;

}


/* =========================================================
   INFO
   ========================================================= */

.ad-info {

    padding:
        12px;

}


.ad-title {

    min-height:
        2.45em;

    margin-bottom:
        6px;

    display:
        -webkit-box;

    -webkit-box-orient:
        vertical;

    -webkit-line-clamp:
        2;

    overflow:
        hidden;

    color:
        var(--text);

    font-size:
        .94rem;

    font-weight:
        720;

    line-height:
        1.3;

}


.ad-price {

    margin-bottom:
        6px;

    color:
        var(--primary-dark);

    font-size:
        1.08rem;

    font-weight:
        800;

}


.ad-location {

    display:
        flex;

    align-items:
        center;

    gap:
        5px;

    overflow:
        hidden;

    color:
        var(--muted);

    font-size:
        .77rem;

    white-space:
        nowrap;

    text-overflow:
        ellipsis;

}


.ad-location i {

    flex:
        0 0 auto;

    color:
        var(--primary-light);

}


.ad-category {

    margin-top:
        7px;

    overflow:
        hidden;

    color:
        #8a8f8a;

    font-size:
        .72rem;

    white-space:
        nowrap;

    text-overflow:
        ellipsis;

}


/* =========================================================
   LOADING
   ========================================================= */

.status {

    width:
        100%;

    display:
        none;

    padding:
        42px 20px;

    text-align:
        center;

}


.status.show {

    display:
        block;

}


.status-icon {

    width:
        62px;

    height:
        62px;

    margin:
        0 auto 15px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        50%;

    background:
        var(--primary-soft);

    color:
        var(--primary);

    font-size:
        1.5rem;

}


.status-title {

    margin-bottom:
        7px;

    color:
        var(--text);

    font-size:
        1.05rem;

    font-weight:
        750;

}


.status-text {

    max-width:
        500px;

    margin:
        0 auto;

    color:
        var(--muted);

    font-size:
        .88rem;

    line-height:
        1.55;

}


.status.error
.status-icon {

    background:
        var(--danger-bg);

    color:
        var(--danger);

}


.status.error
.status-title {

    color:
        var(--danger);

}


/* =========================================================
   RETRY
   ========================================================= */

.retry-btn {

    margin-top:
        18px;

    padding:
        11px 20px;

    border:
        0;

    border-radius:
        12px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-light)
        );

    color:
        white;

    font-weight:
        700;

    cursor:
        pointer;

    box-shadow:
        0 4px 12px
        rgba(46,125,50,.22);

}


.retry-btn:active {

    transform:
        scale(.97);

}


/* =========================================================
   SKELETON
   ========================================================= */

.skeleton-card {

    overflow:
        hidden;

    background:
        white;

    border-radius:
        var(--radius);

    box-shadow:
        var(--shadow-sm);

}


.skeleton {

    background:
        linear-gradient(
            90deg,
            #eeeeee 25%,
            #f7f7f7 37%,
            #eeeeee 63%
        );

    background-size:
        400% 100%;

    animation:
        skeletonLoading 1.35s ease infinite;

}


.skeleton-image {

    width:
        100%;

    aspect-ratio:
        1 / .86;

}


.skeleton-line {

    height:
        12px;

    margin:
        12px;

    border-radius:
        6px;

}


.skeleton-line.medium {

    width:
        70%;

}


.skeleton-line.short {

    width:
        45%;

}


@keyframes skeletonLoading {

    0% {

        background-position:
            100% 50%;

    }

    100% {

        background-position:
            0 50%;

    }

}


/* =========================================================
   FAB
   ========================================================= */

.fab-button {

    position:
        fixed;

    right:
        20px;

    bottom:
        calc(
            var(--nav-height)
            + 18px
            + env(safe-area-inset-bottom)
        );

    z-index:
        80;

    width:
        60px;

    height:
        60px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        0;

    border-radius:
        50%;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary-light)
        );

    color:
        white;

    font-size:
        1.55rem;

    cursor:
        pointer;

    box-shadow:
        0 7px 22px
        rgba(46,125,50,.38);

}


.fab-button:active {

    transform:
        scale(.94);

}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {

    position:
        fixed;

    left:
        0;

    right:
        0;

    bottom:
        0;

    z-index:
        100;

    height:
        calc(
            var(--nav-height)
            + env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    display:
        flex;

    align-items:
        flex-start;

    justify-content:
        space-around;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:
        0 -2px 12px
        rgba(0,0,0,.10);

}


.nav-item {

    flex:
        1;

    height:
        var(--nav-height);

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        5px;

    color:
        #929792;

    font-size:
        .72rem;

    font-weight:
        550;

    cursor:
        pointer;

}


.nav-item i {

    font-size:
        1.28rem;

}


.nav-item.active {

    color:
        var(--primary-light);

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 500px) {

    .header {

        padding:
            11px 14px;

    }


    .header h1 {

        font-size:
            1.16rem;

    }


    .search-section {

        top:
            64px;

        padding:
            12px 12px 10px;

    }


    .filters {

        padding:
            2px 12px 12px;

    }


    .content {

        padding:
            14px 12px 30px;

    }


    .ads-grid {

        gap:
            11px;

    }


    .ad-info {

        padding:
            10px;

    }


    .ad-title {

        font-size:
            .89rem;

    }


    .ad-price {

        font-size:
            1rem;

    }


    .fab-button {

        right:
            16px;

    }

}


@media (min-width: 650px) {

    .ads-grid {

        grid-template-columns:
            repeat(3,minmax(0,1fr));

        gap:
            18px;

    }

}


@media (min-width: 950px) {

    .ads-grid {

        grid-template-columns:
            repeat(4,minmax(0,1fr));

        gap:
            20px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            class="back-btn"
            type="button"
            aria-label="Back"
            onclick="goHome()"
        >

            <i class="fas fa-arrow-left"></i>

        </button>


        <h1>
            Buy &amp; Sell
        </h1>

    </div>


    <div class="header-right">

        <button
            class="icon-btn"
            type="button"
            aria-label="Notifications"
            onclick="showInfo('Notifications are not connected yet.')"
        >

            <i class="fas fa-bell"></i>

        </button>


        <button
            class="icon-btn"
            type="button"
            aria-label="Profile"
            onclick="goProfile()"
        >

            <i class="fas fa-user"></i>

        </button>

    </div>

</header>


<!-- =========================================================
     SEARCH
     ========================================================= -->

<section class="search-section">

    <div class="search-wrapper">

        <i
            class="fas fa-search search-icon"
        ></i>


        <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="Search products, services..."
            aria-label="Search products and services"
        >


        <button
            id="clearSearch"
            class="clear-search"
            type="button"
            aria-label="Clear search"
        >

            <i class="fas fa-times"></i>

        </button>

    </div>

</section>


<!-- =========================================================
     FILTERS
     ========================================================= -->

<nav
    id="filters"
    class="filters"
    aria-label="Categories"
>
</nav>


<!-- =========================================================
     MAIN
     ========================================================= -->

<main class="content">


    <div class="results-header">

        <div
            id="resultsTitle"
            class="results-title"
        >
            Latest listings
        </div>


        <div
            id="resultsCount"
            class="results-count"
        >
            —
        </div>

    </div>


    <!-- LOADING -->

    <div
        id="loadingStatus"
        class="status show"
    >

        <div class="status-icon">

            <i class="fas fa-spinner fa-spin"></i>

        </div>


        <div class="status-title">
            Loading listings
        </div>


        <div class="status-text">
            Please wait while HAVKAR loads the latest listings.
        </div>

    </div>


    <!-- ERROR -->

    <div
        id="errorStatus"
        class="status error"
    >

        <div class="status-icon">

            <i class="fas fa-circle-exclamation"></i>

        </div>


        <div class="status-title">
            Could not load listings
        </div>


        <div
            id="errorText"
            class="status-text"
        >
            Unable to connect to the listings service.
        </div>


        <button
            id="retryButton"
            class="retry-btn"
            type="button"
        >

            <i class="fas fa-rotate-right"></i>

            Try again

        </button>

    </div>


    <!-- EMPTY -->

    <div
        id="emptyStatus"
        class="status"
    >

        <div class="status-icon">

            <i class="fas fa-box-open"></i>

        </div>


        <div class="status-title">
            No listings found
        </div>


        <div class="status-text">
            There are no listings matching your search or category.
        </div>

    </div>


    <!-- ADS -->

    <div
        id="adsGrid"
        class="ads-grid"
    >
    </div>

</main>


<!-- =========================================================
     ADD
     ========================================================= -->

<button
    class="fab-button"
    type="button"
    aria-label="Post a new ad"
    onclick="goPostAd()"
>

    <i class="fas fa-plus"></i>

</button>


<!-- =========================================================
     BOTTOM NAV
     ========================================================= -->

<nav class="bottom-nav">

    <div
        class="nav-item active"
        role="button"
        tabindex="0"
        onclick="goHome()"
    >

        <i class="fas fa-home"></i>

        <span>
            Home
        </span>

    </div>


    <div
        class="nav-item"
        role="button"
        tabindex="0"
        onclick="focusSearch()"
    >

        <i class="fas fa-search"></i>

        <span>
            Search
        </span>

    </div>


    <div
        class="nav-item"
        role="button"
        tabindex="0"
        onclick="showInfo('Saved listings will be connected to your account.')"
    >

        <i class="fas fa-heart"></i>

        <span>
            Saved
        </span>

    </div>


    <div
        class="nav-item"
        role="button"
        tabindex="0"
        onclick="showInfo('Messaging will be connected to your account.')"
    >

        <i class="fas fa-comment"></i>

        <span>
            Messages
        </span>

    </div>


    <div
        class="nav-item"
        role="button"
        tabindex="0"
        onclick="goProfile()"
    >

        <i class="fas fa-user"></i>

        <span>
            Profile
        </span>

    </div>

</nav>


<script>

/* =========================================================
   HAVKAR BUY & SELL
   Optimized Listings Engine
   ========================================================= */


/* =========================================================
   SUPABASE CONFIG
   IMPORTANT:
   Same publishable key used by post-ad.html
   ========================================================= */

const SUPABASE_URL =
    "https://gispovnciifgikvgpzck.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq";


/* =========================================================
   CONSTANTS
   ========================================================= */

const ADS_PAGE_SIZE = 60;

const REQUEST_TIMEOUT_MS = 12000;

const IMAGE_REQUEST_TIMEOUT_MS = 10000;

const MAX_VISIBLE_IMAGE_LOADS = 8;


/* =========================================================

/* =========================================================
   SUPABASE CLIENT
   ========================================================= */

let supabaseClient = null;


function initializeSupabase() {

    if (
        supabaseClient
    ) {

        return true;

    }


    try {

        if (
            !window.supabase ||
            typeof window.supabase.createClient !== "function"
        ) {

            throw new Error(
                "Supabase library did not load."
            );

        }


        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY,
                {

                    auth: {

                        persistSession:
                            true,

                        autoRefreshToken:
                            true,

                        detectSessionInUrl:
                            true

                    }

                }
            );


        return true;

    }

    catch (error) {

        console.error(
            "[HAVKAR] Supabase initialization:",
            error
        );

        return false;

    }

}

/* =========================================================
   SAFE STRING
   ========================================================= */

function safeString(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value).trim();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return safeString(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   PRICE
   ========================================================= */

function formatPrice(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "Price not specified";

    }


    const number =
        Number(value);


    if (
        !Number.isFinite(number)
    ) {

        return escapeHtml(
            value
        );

    }


    return new Intl.NumberFormat(
        "en-US",
        {

            style:
                "currency",

            currency:
                "EUR",

            maximumFractionDigits:
                2

        }
    ).format(number);

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return new Intl.DateTimeFormat(
        "en-GB",
        {

            day:
                "numeric",

            month:
                "short",

            year:
                "numeric"

        }
    ).format(date);

}


/* =========================================================
   TIMEOUT
   ========================================================= */

function withTimeout(
    promise,
    milliseconds
) {

    let timer = null;


    const timeout =
        new Promise(
            function(_, reject) {

                timer =
                    setTimeout(
                        function() {

                            reject(
                                new Error(
                                    "Request timed out."
                                )
                            );

                        },
                        milliseconds
                    );

            }
        );


    return Promise.race([

        promise

            .finally(
                function() {

                    if (timer) {

                        clearTimeout(
                            timer
                        );

                    }

                }
            ),

        timeout

    ]);

}

/* =========================================================
   ERROR MESSAGE
   ========================================================= */

function readableError(error) {

    if (
        !navigator.onLine
    ) {

        return (
            "Your device is offline. " +
            "Please check your internet connection."
        );

    }


    const message =
        safeString(
            error &&
            error.message
        );


    const lower =
        message.toLowerCase();


    if (
        lower.includes(
            "failed to fetch"
        )
    ) {

        return (
            "HAVKAR could not reach Supabase. " +
            "The browser-to-database connection failed."
        );

    }


    if (
        lower.includes(
            "timed out"
        )
    ) {

        return (
            "The listings server took too long to respond."
        );

    }


    if (
        lower.includes(
            "permission"
        ) ||
        lower.includes(
            "row-level security"
        ) ||
        lower.includes(
            "rls"
        )
    ) {

        return (
            "Supabase denied access to the listings."
        );

    }


    if (
        lower.includes(
            "relation"
        ) &&
        lower.includes(
            "does not exist"
        )
    ) {

        return (
            "The ads table could not be found in Supabase."
        );

    }


    if (message) {

        return message;

    }


    return (
        "An unexpected error occurred while loading listings."
    );

}

/* =========================================================
   SEARCH TEXT
   ========================================================= */

function searchableText(ad) {

    return [

        ad.title,
        ad.description,
        ad.location,
        ad.category,
        ad.city,
        ad.region,
        ad.country

    ]

        .map(
            safeString
        )

        .join(" ")

        .toLowerCase();

}


/* =========================================================
   CATEGORY MATCH
   ========================================================= */

function categoryMatches(ad) {

    if (
        state.currentCategory ===
        "All"
    ) {

        return true;

    }


    return (
        safeString(
            ad.category
        ).toLowerCase()
        ===
        state.currentCategory.toLowerCase()
    );

}


/* =========================================================
   APPLY FILTERS
   ========================================================= */

function applyFilters() {

    const search =
        state.search;


    state.filteredAds =
        state.ads.filter(
            function(ad) {

                if (
                    !categoryMatches(
                        ad
                    )
                ) {

                    return false;

                }


                if (!search) {

                    return true;

                }


                return searchableText(
                    ad
                ).includes(
                    search
                );

            }
        );


    updateResultsHeader();

    renderAds(
        state.filteredAds
    );

}


/* =========================================================
   HEADER
   ========================================================= */

function updateResultsHeader() {

    const count =
        state.filteredAds.length;


    if (state.search) {

        resultsTitle.textContent =
            "Search results";

    }

    else if (
        state.currentCategory !==
        "All"
    ) {

        resultsTitle.textContent =
            state.currentCategory;

    }

    else {

        resultsTitle.textContent =
            "Latest listings";

    }


    resultsCount.textContent =
        count +
        (
            count === 1
                ? " listing"
                : " listings"
        );

}


/* =========================================================
   PHOTO PARSER
   ========================================================= */

function parsePhotos(value) {

    if (
        Array.isArray(value)
    ) {

        return value
            .filter(
                function(item) {

                    return (
                        typeof item ===
                        "string" &&
                        item.trim()
                    );

                }
            )
            .map(
                function(item) {

                    return item.trim();

                }
            );

    }


    if (
        typeof value !==
        "string"
    ) {

        return [];

    }


    const text =
        value.trim();


    if (!text) {

        return [];

    }


    if (
        text.startsWith(
            "http://"
        ) ||
        text.startsWith(
            "https://"
        ) ||
        text.startsWith(
            "data:image/"
        )
    ) {

        return [
            text
        ];

    }


    try {

        const parsed =
            JSON.parse(
                text
            );


        if (
            Array.isArray(parsed)
        ) {

            return parsed
                .filter(
                    function(item) {

                        return (
                            typeof item ===
                            "string" &&
                            item.trim()
                        );

                    }
                )
                .map(
                    function(item) {

                        return item.trim();

                    }
                );

        }

    }

    catch (_) {

        return [];

    }


    return [];

}

    info.appendChild(
        price
    );


    info.appendChild(

    );

    );

    );


    card.appendChild(
        info
    );


    card.addEventListener(

            ) {

/* =========================================================
   IMAGE QUEUE
   ========================================================= */

function queueImageLoad(
    card,
    id
) {

    if (
        !id
    ) {

        return;

    }


    state.imageQueue.push({

        card:
            card,

        id:
            id

    });


    processImageQueue();

}


/* =========================================================
   PROCESS IMAGE QUEUE
   ========================================================= */

function processImageQueue() {

    while (

        state.activeImageLoads
            <
        MAX_VISIBLE_IMAGE_LOADS

        &&

        state.imageQueue.length
            >
        0

    ) {

        const item =
            state.imageQueue.shift();


        if (
            !document.body.contains(
                item.card
            )
        ) {

            continue;

        }


        state.activeImageLoads++;


        loadAdImage(
            item.card,
            item.id
        )
        .finally(
            function() {

                state.activeImageLoads--;

                processImageQueue();

            }
        );

    }

}


/* =========================================================
   LOAD ONE AD IMAGE
   ========================================================= */

async function loadAdImage(
    card,
    id
) {

    if (
        !supabaseClient ||
        !id
    ) {

        return;

    }


    try {

        const result =
            await withTimeout(

                supabaseClient

                    .from("ads")

                    .select(
                        "photos"
                    )

                    .eq(
                        "id",
                        id
                    )

                    .maybeSingle(),

                IMAGE_REQUEST_TIMEOUT_MS

            );


        if (
            result.error
        ) {

            console.warn(
                "[HAVKAR] Image request failed:",
                result.error
            );

            return;

        }


        const photos =
            parsePhotos(
                result.data &&
                result.data.photos
            );


        if (
            photos.length === 0
        ) {

            return;

        }


        const image =
            photos[0];


        const imageBox =
            card.querySelector(
                ".ad-image"
            );


        if (
            !imageBox
        ) {

            return;

        }


        const img =
            document.createElement(
                "img"
            );


        img.alt =
            safeString(
                card.querySelector(
                    ".ad-title"
                )?.textContent
            ) ||
            "Listing";


        img.loading =
            "lazy";


        img.decoding =
            "async";


        img.referrerPolicy =
            "no-referrer";


        img.onload =
            function() {

                img.classList.add(
                    "loaded"
                );


                imageBox.classList.add(
                    "has-image"
                );

            };


        img.onerror =
            function() {

                img.remove();

            };


        imageBox.appendChild(
            img
        );


        img.src =
            image;

    }

    catch (error) {

        console.warn(
            "[HAVKAR] Image loading error:",
            error
        );

    }

}


/* =========================================================
   RENDER
   ========================================================= */

function renderAds(ads) {

    adsGrid.innerHTML =
        "";


    state.imageQueue =
        [];


    state.activeImageLoads =
        0;


    if (
        !ads ||
        ads.length === 0
    ) {

        showEmpty();

        return;

    }


    showContent();


    const fragment =
        document.createDocumentFragment();


    ads.forEach(
        function(ad) {

            fragment.appendChild(
                createAdCard(
                    ad
                )
            );

        }
    );


    adsGrid.appendChild(
        fragment
    );


    /*
     * Start a limited number of image requests.
     */

    processImageQueue();

}


/* =========================================================
   OPEN PRODUCT
   ========================================================= */

function openProduct(id) {

    if (
        !id
    ) {

        showInfo(
            "This listing does not have a valid ID."
        );

        return;

    }


    window.location.href =
        "product.html?id=" +
        encodeURIComponent(
            id
        );

}


/* =========================================================
   SKELETONS
   ========================================================= */

function renderSkeletons(
    count = 6
) {

    adsGrid.innerHTML =
        "";


    hideStatuses();


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "skeleton-card";


        card.innerHTML = `

            <div
                class="skeleton skeleton-image">
            </div>

            <div
                class="skeleton skeleton-line medium">
            </div>

            <div
                class="skeleton skeleton-line short">
            </div>

            <div
                class="skeleton skeleton-line short">
            </div>

        `;


        adsGrid.appendChild(
            card
        );

    }

}


/* =========================================================
   FETCH ADS
   =========================================================
   
   CRITICAL OPTIMIZATION:
   
   We deliberately DO NOT select photos here.
   
   Old version:
       select("*")
   
   New version:
       only lightweight listing fields
   
   Photos are loaded separately.
   ========================================================= */

async function fetchAds() {

    if (
        !supabaseClient
    ) {

        throw new Error(
            "Supabase is not initialized."
        );

    }


    const result =
        await withTimeout(

            supabaseClient

                .from("ads")

                .select(
                    [
                        "id",
                        "title",
                        "category",
                        "price",
                        "location",
                        "description",
                        "city",
                        "region",
                        "country",
                        "created_at"
                    ].join(",")
                )

                .order(
                    "created_at",
                    {
                        ascending:
                            false
                    }
                )

                .limit(
                    ADS_PAGE_SIZE
                ),

            REQUEST_TIMEOUT_MS

        );


    if (
        result.error
    ) {

        throw result.error;

    }


    return (
        Array.isArray(
            result.data
        )
            ? result.data
            : []
    );

}


/* =========================================================
   LOAD ADS
   ========================================================= */

async function loadAds() {

    const requestId =
        ++state.requestId;


    state.loading =
        true;


    renderSkeletons();


    showLoading();


    try {

        if (
            !navigator.onLine
        ) {

            throw new Error(
                "Your device is offline."
            );

        }


        if (
            !initializeSupabase()
        ) {

            throw new Error(
                "Supabase could not be initialized."
            );

        }


        const data =
            await fetchAds();


        if (
            requestId !==
            state.requestId
        ) {

            return;

        }


        state.ads =
            data;


        state.loading =
            false;


        applyFilters();

    }

    catch (error) {

        if (
            requestId !==
            state.requestId
        ) {

            return;

        }


        state.loading =
            false;


        console.error(
            "[HAVKAR] Listings error:",
            error
        );


        adsGrid.innerHTML =
            "";


        showError(
            readableError(
                error
            )
        );

    }

}

            color:
                "#fff",

            fontSize:
                "14px",

            fontWeight:
                "600",

            textAlign:
                "center",

            boxShadow:
                "0 8px 28px rgba(0,0,0,.22)"

        }
    );


    document.body.appendChild(
        toast
    );


    setTimeout(
        function() {

            if (
                toast.parentNode
            ) {

                toast.remove();

            }

        },
        2800
    );

}

function initializePage() {

    createCategoryButtons();

    setupSearch();

    initializeSupabase();

    loadAds();

}
