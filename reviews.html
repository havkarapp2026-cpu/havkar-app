<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="HAVKAR Reviews. Verified reviews appear after completed HAVKAR services.">
<meta name="theme-color" content="#689f38">
<title>HAVKAR - Reviews</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
--primary:#689f38;
--primary-light:#7cb342;
--primary-dark:#558b2f;
--primary-soft:#e8f5e9;
--text:#303030;
--text-light:#666;
--muted:#999;
--background:#f5f5f5;
--white:#fff;
--border:#e2e2e2;
--gold:#ffd700;
--danger:#d32f2f;
--shadow:0 3px 14px rgba(0,0,0,.07);
--radius:16px}

*{
margin:0;
padding:0;
box-sizing:border-box}
html{
scroll-behavior:smooth}
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:var(--background);
color:var(--text);
min-height:100vh;
padding-bottom:82px}
button,input,textarea,select{
font:inherit}
button{
-webkit-tap-highlight-color:transparent}

.header{
position:sticky;
top:0;
z-index:100;
background:linear-gradient(135deg,var(--primary),var(--primary-light));
color:#fff;
padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 2px 12px rgba(0,0,0,.12)}

.header-left{
display:flex;
align-items:center;
gap:14px}
.back-btn,.header-action{
width:42px;
height:42px;
border:0;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
color:#fff;
background:rgba(255,255,255,.18)}
.back-btn{
background:transparent;
font-size:1.45rem}
.header h1{
font-size:1.3rem;
font-weight:750}
.page{
width:100%;
max-width:780px;
margin:0 auto}

.rating-summary{
background:#fff;
margin:18px;
padding:24px 20px;
border-radius:var(--radius);
box-shadow:var(--shadow);
text-align:center}
.average-rating{
font-size:3.15rem;
line-height:1;
font-weight:800;
color:var(--primary-dark);
margin-bottom:10px}
.stars{
font-size:1.55rem;
letter-spacing:2px;
color:var(--gold);
margin-bottom:9px}
.total-reviews{
color:var(--text-light);
font-size:.9rem}
.rating-bars{
margin-top:21px}
.rating-bar{
display:flex;
align-items:center;
gap:9px;
margin-bottom:9px}
.bar-label{
width:62px;
flex-shrink:0;
text-align:left;
color:var(--text-light);
font-size:.84rem}
.bar-container{
flex:1;
height:8px;
background:#eee;
border-radius:20px;
overflow:hidden}
.bar-fill{
height:100%;
background:linear-gradient(135deg,var(--primary),var(--primary-light));
border-radius:20px;
transition:width .4s ease}
.bar-count{
width:42px;
flex-shrink:0;
text-align:right;
color:var(--text-light);
font-size:.84rem}

.tabs{
display:flex;
gap:10px;
padding:2px 18px 4px}
.tab{
flex:1;
border:0;
padding:11px 8px;
border-radius:13px;
background:#eee;
color:#333;
font-weight:700;
cursor:pointer}
.tab.active{
background:linear-gradient(135deg,var(--primary),var(--primary-light));
color:#fff}
.content{
padding:13px 18px 100px}
.results-info{
display:flex;
align-items:center;
justify-content:space-between;
margin:0 2px 11px;
color:var(--muted);
font-size:.82rem}

.review-card{
background:#fff;
border-radius:var(--radius);
padding:18px;
margin-bottom:14px;
box-shadow:var(--shadow)}
.review-header{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
margin-bottom:13px}
.reviewer-info{
display:flex;
align-items:center;
gap:11px;
min-width:0}
.reviewer-avatar{
width:46px;
height:46px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:linear-gradient(135deg,#e8f5e9,#c5e1a5);
font-size:1.1rem;
font-weight:800;
color:var(--primary-dark);
overflow:hidden}
.reviewer-avatar img{
width:100%;
height:100%;
object-fit:cover}
.reviewer-name{
font-size:.98rem;
font-weight:750;
margin-bottom:3px}
.review-date{
color:var(--muted);
font-size:.75rem}
.review-rating{
flex-shrink:0;
color:var(--gold);
font-size:.9rem;
letter-spacing:1px}
.review-text{
color:var(--text-light);
font-size:.91rem;
line-height:1.62;
margin-bottom:13px;
white-space:pre-wrap;
overflow-wrap:anywhere}
.review-meta{
display:flex;
gap:16px;
padding-top:12px;
border-top:1px solid #eee}
.meta-btn{
display:flex;
align-items:center;
gap:5px;
border:0;
background:transparent;
color:#666;
font-size:.84rem;
cursor:pointer;
padding:2px 0}
.meta-btn i{
color:var(--primary-light)}
.meta-btn.liked{
color:var(--primary-dark);
font-weight:700}
.user-review-badge{
display:inline-flex;
align-items:center;
gap:5px;
margin-top:5px;
padding:3px 8px;
border-radius:20px;
background:var(--primary-soft);
color:var(--primary-dark);
font-size:.68rem;
font-weight:700}

.reply-list{
margin-top:12px;
padding-left:14px;
border-left:3px solid var(--primary-soft)}
.reply-item{
padding:9px 0;
border-bottom:1px solid #f0f0f0}
.reply-item:last-child{
border-bottom:0}
.reply-author{
font-size:.78rem;
font-weight:750;
color:var(--primary-dark)}
.reply-date{
font-size:.68rem;
color:var(--muted);
margin-left:6px}
.reply-text{
font-size:.84rem;
color:var(--text-light);
margin-top:4px;
white-space:pre-wrap;
overflow-wrap:anywhere}

.empty-state{
background:#fff;
border-radius:var(--radius);
padding:40px 20px;
text-align:center;
box-shadow:var(--shadow)}
.empty-state i{
display:block;
font-size:2.4rem;
color:#c7c7c7;
margin-bottom:12px}
.empty-state h3{
font-size:1rem;
margin-bottom:6px}
.empty-state p{
color:var(--muted);
font-size:.85rem}
.empty-state.launch-reviews{
margin-top:18px}
.empty-state.launch-reviews i{
color:var(--primary)}
.empty-state.launch-reviews h3{
font-size:1.05rem;
color:var(--text)}
.empty-state.launch-reviews p{
color:var(--text-light);
font-size:.92rem;
line-height:1.55}

.fab-button{
position:fixed;
right:20px;
bottom:88px;
z-index:90;
width:59px;
height:59px;
border:0;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,var(--primary),var(--primary-light));
color:#fff;
font-size:1.5rem;
box-shadow:0 6px 20px rgba(104,159,56,.38);
cursor:pointer}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:100;
height:76px;
padding:8px 8px calc(8px + env(safe-area-inset-bottom));
background:#fff;
display:flex;
justify-content:space-around;
box-shadow:0 -3px 15px rgba(0,0,0,.09)}
.nav-item{
min-width:70px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
color:#999;
font-size:.72rem;
font-weight:600;
text-decoration:none}
.nav-item i{
font-size:1.25rem}
.nav-item.active{
color:var(--primary-light)}

.modal-overlay{
position:fixed;
inset:0;
z-index:500;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.48)}
.modal-overlay.show{
display:flex}
.modal{
width:100%;
max-width:780px;
max-height:92vh;
overflow-y:auto;
background:#fff;
border-radius:22px 22px 0 0;
animation:modalUp .22s ease}
@keyframes modalUp{
from{
transform:translateY(100%);
opacity:0}
to{
transform:translateY(0);
opacity:1}
}
.modal-header{
position:sticky;
top:0;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between;
padding:18px 20px;
background:#fff;
border-bottom:1px solid #eee}
.modal-title{
font-size:1.15rem;
font-weight:750}
.modal-close{
width:40px;
height:40px;
border:0;
border-radius:50%;
background:#f2f2f2;
color:#666;
cursor:pointer}
.modal-body{
padding:20px}

.star-selector{
display:flex;
justify-content:center;
gap:7px;
margin:8px 0 21px}
.star-button{
width:44px;
height:44px;
border:0;
background:transparent;
color:#d5d5d5;
font-size:1.8rem;
cursor:pointer}
.star-button.selected{
color:var(--gold)}
.rating-label{
text-align:center;
color:var(--muted);
font-size:.83rem;
margin-top:-13px;
margin-bottom:18px}
.input-group{
margin-bottom:16px}
.input-label{
display:block;
margin-bottom:7px;
color:#555;
font-size:.87rem;
font-weight:650}
.input-field{
width:100%;
border:2px solid var(--border);
border-radius:12px;
padding:13px 14px;
background:#fff;
color:var(--text);
outline:none}
.input-field:focus{
border-color:var(--primary-light);
box-shadow:0 0 0 3px rgba(124,179,66,.12)}
textarea.input-field{
min-height:120px;
resize:vertical}
.submit-btn{
width:100%;
border:0;
border-radius:12px;
padding:14px;
background:linear-gradient(135deg,var(--primary),var(--primary-light));
color:#fff;
font-weight:750;
cursor:pointer}
.submit-btn:disabled{
opacity:.55;
cursor:not-allowed}

.reply-box{
margin-top:13px;
padding-top:13px;
border-top:1px solid #eee;
display:none}
.reply-box.show{
display:block}
.reply-row{
display:flex;
gap:8px}
.reply-input{
flex:1;
min-width:0;
border:1px solid var(--border);
border-radius:10px;
padding:10px 11px;
outline:none}
.reply-send{
width:42px;
height:42px;
flex-shrink:0;
border:0;
border-radius:10px;
background:var(--primary);
color:#fff;
cursor:pointer}

.toast{
position:fixed;
left:18px;
right:18px;
bottom:93px;
z-index:800;
max-width:600px;
margin:auto;
padding:13px 16px;
border-radius:12px;
background:#333;
color:#fff;
text-align:center;
font-size:.86rem;
font-weight:650;
opacity:0;
transform:translateY(18px);
pointer-events:none;
transition:.25s ease}
.toast.show{
opacity:1;
transform:translateY(0)}
.toast.success{
background:var(--primary-dark)}
.toast.error{
background:var(--danger)}

.loading{
padding:30px;
text-align:center;
color:var(--muted)}

@media(min-width:700px){
.modal-overlay{
align-items:center;
padding:20px}
.modal{
border-radius:20px;
max-height:90vh}
.fab-button{
right:30px}
}
@media(max-width:500px){
.rating-summary{
margin:15px;
padding:22px 15px}
.tabs,.content{
padding-left:15px;
padding-right:15px}
.review-rating{
font-size:.78rem}
.review-header{
gap:7px}
}

</style>
</head>
<body>
<header class="header">
<div class="header-left">
<button class="back-btn" type="button" aria-label="Go back" onclick="goHome()">
<i class="fas fa-arrow-left">
</i>
</button>
<h1>Reviews</h1>
</div>
</header>
<main class="page">
<section class="content">
<div class="empty-state launch-reviews">
<i class="fas fa-star" aria-hidden="true"></i>
<h3>Verified reviews</h3>
<p>Verified reviews will appear here after completed HAVKAR services.</p>
</div>
</section>
</main>
<nav class="bottom-nav">
<a class="nav-item" href="index.html">
<i class="fas fa-home">
</i>
<span>Home</span>
</a>
<a class="nav-item active" href="reviews.html">
<i class="fas fa-star">
</i>
<span>Reviews</span>
</a>
<a class="nav-item" href="saved.html">
<i class="fas fa-bookmark">
</i>
<span>Saved</span>
</a>
<a class="nav-item" href="profile.html">
<i class="fas fa-user">
</i>
<span>Profile</span>
</a>
</nav>
<script>
"use strict";

function goHome(){
location.href="index.html"}
</script>
<script src="havkar-i18n.js"></script>
</body>
</html>
