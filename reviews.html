<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="HAVKAR Reviews - Read and write reviews."
    >

    <meta
        name="theme-color"
        content="#689f38"
    >

    <title>HAVKAR - Reviews</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        :root {
            --primary: #689f38;
            --primary-light: #7cb342;
            --primary-dark: #558b2f;
            --primary-soft: #e8f5e9;

            --text: #303030;
            --text-light: #666;
            --muted: #999;

            --background: #f5f5f5;
            --white: #ffffff;
            --border: #e2e2e2;

            --gold: #ffd700;

            --danger: #d32f2f;
            --danger-soft: #ffebee;

            --shadow:
                0 3px 14px rgba(0, 0, 0, 0.07);

            --radius: 16px;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);

            min-height: 100vh;

            padding-bottom: 82px;
        }


        button,
        input,
        textarea,
        select {
            font: inherit;
        }


        button {
            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================
           HEADER
        ========================================== */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-light)
                );

            color: white;

            padding:
                calc(14px + env(safe-area-inset-top))
                18px
                14px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.12);
        }


        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }


        .back-btn,
        .header-action {
            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            color: white;
            background: rgba(255,255,255,0.18);

            transition: 0.2s ease;
        }


        .back-btn {
            background: transparent;
            font-size: 1.45rem;
        }


        .back-btn:hover,
        .header-action:hover {
            background: rgba(255,255,255,0.28);
        }


        .header h1 {
            font-size: 1.3rem;
            font-weight: 750;
        }


        /* =========================================
           MAIN
        ========================================== */

        .page {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
        }


        /* =========================================
           RATING SUMMARY
        ========================================== */

        .rating-summary {
            background: var(--white);

            margin: 18px;

            padding: 24px 20px;

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            text-align: center;
        }


        .average-rating {
            font-size: 3.15rem;
            line-height: 1;

            font-weight: 800;

            color: var(--primary-dark);

            margin-bottom: 10px;
        }


        .stars {
            font-size: 1.55rem;
            letter-spacing: 2px;

            color: var(--gold);

            margin-bottom: 9px;
        }


        .total-reviews {
            color: var(--text-light);
            font-size: 0.9rem;
        }


        .rating-bars {
            margin-top: 21px;
        }


        .rating-bar {
            display: flex;
            align-items: center;

            gap: 9px;

            margin-bottom: 9px;
        }


        .bar-label {
            width: 62px;

            flex-shrink: 0;

            text-align: left;

            color: var(--text-light);

            font-size: 0.84rem;
        }


        .bar-container {
            flex: 1;

            height: 8px;

            background: #eeeeee;

            border-radius: 20px;

            overflow: hidden;
        }


        .bar-fill {
            height: 100%;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-light)
                );

            border-radius: 20px;

            transition: width 0.4s ease;
        }


        .bar-count {
            width: 42px;

            flex-shrink: 0;

            text-align: right;

            color: var(--text-light);

            font-size: 0.84rem;
        }


        /* =========================================
           TABS
        ========================================== */

        .tabs {
            display: flex;

            gap: 10px;

            padding:
                2px
                18px
                4px;
        }


        .tab {
            flex: 1;

            border: 0;

            padding: 11px 8px;

            border-radius: 13px;

            background: #eeeeee;

            color: #333;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .tab.active {
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-light)
                );

            color: white;
        }


        .tab:active {
            transform: scale(0.98);
        }


        /* =========================================
           CONTENT
        ========================================== */

        .content {
            padding:
                13px
                18px
                100px;
        }


        .results-info {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin:
                0
                2px
                11px;

            color: var(--muted);

            font-size: 0.82rem;
        }


        /* =========================================
           REVIEW CARD
        ========================================== */

        .review-card {
            background: white;

            border-radius: var(--radius);

            padding: 18px;

            margin-bottom: 14px;

            box-shadow: var(--shadow);
        }


        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 12px;

            margin-bottom: 13px;
        }


        .reviewer-info {
            display: flex;
            align-items: center;

            gap: 11px;

            min-width: 0;
        }


        .reviewer-avatar {
            width: 46px;
            height: 46px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #c5e1a5
                );

            font-size: 1.45rem;
        }


        .reviewer-name {
            font-size: 0.98rem;
            font-weight: 750;

            color: var(--text);

            margin-bottom: 3px;
        }


        .review-date {
            color: var(--muted);
            font-size: 0.75rem;
        }


        .review-rating {
            flex-shrink: 0;

            color: var(--gold);

            font-size: 0.9rem;

            letter-spacing: 1px;
        }


        .review-text {
            color: var(--text-light);

            font-size: 0.91rem;

            line-height: 1.62;

            margin-bottom: 13px;
        }


        .review-meta {
            display: flex;

            gap: 16px;

            padding-top: 12px;

            border-top:
                1px solid #eeeeee;
        }


        .meta-btn {
            display: flex;
            align-items: center;

            gap: 5px;

            border: 0;

            background: transparent;

            color: #666;

            font-size: 0.84rem;

            cursor: pointer;

            padding: 2px 0;
        }


        .meta-btn i {
            color: var(--primary-light);
        }


        .meta-btn.liked {
            color: var(--primary-dark);
            font-weight: 700;
        }


        /* =========================================
           USER REVIEW BADGE
        ========================================== */

        .user-review-badge {
            display: inline-flex;
            align-items: center;

            gap: 5px;

            margin-top: 5px;

            padding: 3px 8px;

            border-radius: 20px;

            background: var(--primary-soft);

            color: var(--primary-dark);

            font-size: 0.68rem;
            font-weight: 700;
        }


        /* =========================================
           EMPTY STATE
        ========================================== */

        .empty-state {
            background: white;

            border-radius: var(--radius);

            padding: 40px 20px;

            text-align: center;

            box-shadow: var(--shadow);
        }


        .empty-state i {
            display: block;

            font-size: 2.4rem;

            color: #c7c7c7;

            margin-bottom: 12px;
        }


        .empty-state h3 {
            font-size: 1rem;
            margin-bottom: 6px;
        }


        .empty-state p {
            color: var(--muted);
            font-size: 0.85rem;
        }


        /* =========================================
           FLOATING BUTTON
        ========================================== */

        .fab-button {
            position: fixed;

            right: 20px;
            bottom: 88px;

            z-index: 90;

            width: 59px;
            height: 59px;

            border: 0;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-light)
                );

            color: white;

            font-size: 1.5rem;

            box-shadow:
                0 6px 20px rgba(104,159,56,0.38);

            cursor: pointer;

            transition: transform 0.2s ease;
        }


        .fab-button:active {
            transform: scale(0.92);
        }


        /* =========================================
           BOTTOM NAV
        ========================================== */

        .bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 100;

            height: 76px;

            padding:
                8px
                8px
                calc(8px + env(safe-area-inset-bottom));

            background: white;

            display: flex;
            justify-content: space-around;

            box-shadow:
                0 -3px 15px rgba(0,0,0,0.09);
        }


        .nav-item {
            min-width: 70px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 4px;

            color: #999;

            font-size: 0.72rem;
            font-weight: 600;

            text-decoration: none;
        }


        .nav-item i {
            font-size: 1.25rem;
        }


        .nav-item.active {
            color: var(--primary-light);
        }


        /* =========================================
           MODAL
        ========================================== */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 500;

            display: none;

            align-items: flex-end;
            justify-content: center;

            background:
                rgba(0,0,0,0.48);
        }


        .modal-overlay.show {
            display: flex;
        }


        .modal {
            width: 100%;
            max-width: 780px;

            max-height: 92vh;

            overflow-y: auto;

            background: white;

            border-radius:
                22px
                22px
                0
                0;

            animation:
                modalUp 0.22s ease;
        }


        @keyframes modalUp {

            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }

        }


        .modal-header {
            position: sticky;

            top: 0;

            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            background: white;

            border-bottom:
                1px solid #eeeeee;
        }


        .modal-title {
            font-size: 1.15rem;
            font-weight: 750;
        }


        .modal-close {
            width: 40px;
            height: 40px;

            border: 0;
            border-radius: 50%;

            background: #f2f2f2;

            color: #666;

            cursor: pointer;
        }


        .modal-body {
            padding: 20px;
        }


        /* =========================================
           STAR SELECTOR
        ========================================== */

        .star-selector {
            display: flex;

            justify-content: center;

            gap: 7px;

            margin:
                8px
                0
                21px;
        }


        .star-button {
            width: 44px;
            height: 44px;

            border: 0;

            background: transparent;

            color: #d5d5d5;

            font-size: 1.8rem;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                color 0.15s ease;
        }


        .star-button.selected {
            color: var(--gold);
        }


        .star-button:active {
            transform: scale(0.9);
        }


        .rating-label {
            text-align: center;

            color: var(--muted);

            font-size: 0.83rem;

            margin-top: -13px;

            margin-bottom: 18px;
        }


        /* =========================================
           FORM
        ========================================== */

        .input-group {
            margin-bottom: 16px;
        }


        .input-label {
            display: block;

            margin-bottom: 7px;

            color: #555;

            font-size: 0.87rem;
            font-weight: 650;
        }


        .input-field {
            width: 100%;

            border:
                2px solid var(--border);

            border-radius: 12px;

            padding: 13px 14px;

            background: white;

            color: var(--text);

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .input-field:focus {
            border-color: var(--primary-light);

            box-shadow:
                0 0 0 3px
                rgba(124,179,66,0.12);
        }


        textarea.input-field {
            min-height: 120px;

            resize: vertical;
        }


        .submit-btn {
            width: 100%;

            border: 0;

            border-radius: 12px;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-light)
                );

            color: white;

            font-weight: 750;

            cursor: pointer;
        }


        .submit-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }


        /* =========================================
           REPLY BOX
        ========================================== */

        .reply-box {
            margin-top: 13px;

            padding-top: 13px;

            border-top:
                1px solid #eeeeee;

            display: none;
        }


        .reply-box.show {
            display: block;
        }


        .reply-row {
            display: flex;
            gap: 8px;
        }


        .reply-input {
            flex: 1;

            min-width: 0;

            border:
                1px solid var(--border);

            border-radius: 10px;

            padding: 10px 11px;

            outline: none;
        }


        .reply-input:focus {
            border-color: var(--primary-light);
        }


        .reply-send {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: 0;
            border-radius: 10px;

            background: var(--primary);

            color: white;

            cursor: pointer;
        }


        /* =========================================
           TOAST
        ========================================== */

        .toast {
            position: fixed;

            left: 18px;
            right: 18px;
            bottom: 93px;

            z-index: 800;

            max-width: 600px;

            margin: auto;

            padding: 13px 16px;

            border-radius: 12px;

            background: #333;

            color: white;

            text-align: center;

            font-size: 0.86rem;
            font-weight: 650;

            opacity: 0;

            transform:
                translateY(18px);

            pointer-events: none;

            transition: 0.25s ease;
        }


        .toast.show {
            opacity: 1;

            transform:
                translateY(0);
        }


        .toast.success {
            background:
                var(--primary-dark);
        }


        .toast.error {
            background:
                var(--danger);
        }


        /* =========================================
           DESKTOP
        ========================================== */

        @media (min-width: 700px) {

            .modal-overlay {
                align-items: center;
                padding: 20px;
            }


            .modal {
                border-radius: 20px;
                max-height: 90vh;
            }


            .fab-button {
                right: 30px;
            }

        }


        @media (max-width: 500px) {

            .rating-summary {
                margin: 15px;
                padding: 22px 15px;
            }


            .tabs {
                padding-left: 15px;
                padding-right: 15px;
            }


            .content {
                padding-left: 15px;
                padding-right: 15px;
            }


            .review-rating {
                font-size: 0.78rem;
            }


            .review-header {
                gap: 7px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="header-left">

            <button
                class="back-btn"
                type="button"
                aria-label="Go back"
                onclick="goHome()"
            >
                <i class="fas fa-arrow-left"></i>
            </button>

            <h1>
                Reviews
            </h1>

        </div>


        <button
            class="header-action"
            type="button"
            aria-label="Filter reviews"
            onclick="toggleFilter()"
        >
            <i class="fas fa-filter"></i>
        </button>

    </header>


    <main class="page">


        <!-- =========================================
             RATING SUMMARY
        ========================================== -->

        <section class="rating-summary">

            <div
                id="averageRating"
                class="average-rating"
            >
                4.8
            </div>


            <div class="stars">
                ★★★★★
            </div>


            <div
                id="totalReviews"
                class="total-reviews"
            >
                Based on 1,247 reviews
            </div>


            <div class="rating-bars">

                <div class="rating-bar">

                    <div class="bar-label">
                        5 stars
                    </div>

                    <div class="bar-container">

                        <div
                            id="bar5"
                            class="bar-fill"
                            style="width:85%;"
                        ></div>

                    </div>

                    <div
                        id="count5"
                        class="bar-count"
                    >
                        1,060
                    </div>

                </div>


                <div class="rating-bar">

                    <div class="bar-label">
                        4 stars
                    </div>

                    <div class="bar-container">

                        <div
                            id="bar4"
                            class="bar-fill"
                            style="width:10%;"
                        ></div>

                    </div>

                    <div
                        id="count4"
                        class="bar-count"
                    >
                        125
                    </div>

                </div>


                <div class="rating-bar">

                    <div class="bar-label">
                        3 stars
                    </div>

                    <div class="bar-container">

                        <div
                            id="bar3"
                            class="bar-fill"
                            style="width:3%;"
                        ></div>

                    </div>

                    <div
                        id="count3"
                        class="bar-count"
                    >
                        37
                    </div>

                </div>


                <div class="rating-bar">

                    <div class="bar-label">
                        2 stars
                    </div>

                    <div class="bar-container">

                        <div
                            id="bar2"
                            class="bar-fill"
                            style="width:1%;"
                        ></div>

                    </div>

                    <div
                        id="count2"
                        class="bar-count"
                    >
                        12
                    </div>

                </div>


                <div class="rating-bar">

                    <div class="bar-label">
                        1 star
                    </div>

                    <div class="bar-container">

                        <div
                            id="bar1"
                            class="bar-fill"
                            style="width:1%;"
                        ></div>

                    </div>

                    <div
                        id="count1"
                        class="bar-count"
                    >
                        13
                    </div>

                </div>

            </div>

        </section>


        <!-- =========================================
             FILTER TABS
        ========================================== -->

        <div class="tabs">

            <button
                class="tab active"
                data-filter="all"
                onclick="setFilter('all')"
            >
                All
            </button>


            <button
                class="tab"
                data-filter="five"
                onclick="setFilter('five')"
            >
                5 Stars
            </button>


            <button
                class="tab"
                data-filter="recent"
                onclick="setFilter('recent')"
            >
                Recent
            </button>

        </div>


        <!-- =========================================
             REVIEWS
        ========================================== -->

        <section class="content">

            <div class="results-info">

                <span id="resultsCount">
                    Reviews
                </span>

                <span id="currentFilter">
                    All reviews
                </span>

            </div>


            <div id="reviewsList">

                <!-- Reviews inserted by JavaScript -->

            </div>

        </section>

    </main>


    <!-- =========================================
         WRITE REVIEW BUTTON
    ========================================== -->

    <button
        class="fab-button"
        type="button"
        aria-label="Write a review"
        onclick="openReviewModal()"
    >
        <i class="fas fa-pen"></i>
    </button>


    <!-- =========================================
         BOTTOM NAV
    ========================================== -->

    <nav class="bottom-nav">

        <a
            class="nav-item"
            href="index.html"
        >
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>


        <a
            class="nav-item active"
            href="reviews.html"
        >
            <i class="fas fa-star"></i>
            <span>Reviews</span>
        </a>


        <a
            class="nav-item"
            href="saved.html"
        >
            <i class="fas fa-bookmark"></i>
            <span>Saved</span>
        </a>


        <a
            class="nav-item"
            href="profile.html"
        >
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>

    </nav>


    <!-- =========================================
         WRITE REVIEW MODAL
    ========================================== -->

    <div
        id="reviewModal"
        class="modal-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="reviewModalTitle"
        onclick="closeModalOutside(event)"
    >

        <div class="modal">


            <div class="modal-header">

                <h2
                    id="reviewModalTitle"
                    class="modal-title"
                >
                    Write a Review
                </h2>


                <button
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                    onclick="closeReviewModal()"
                >
                    <i class="fas fa-times"></i>
                </button>

            </div>


            <div class="modal-body">

                <form id="reviewForm">


                    <!-- NAME -->

                    <div class="input-group">

                        <label
                            class="input-label"
                            for="reviewerName"
                        >
                            Your Name *
                        </label>

                        <input
                            id="reviewerName"
                            class="input-field"
                            type="text"
                            placeholder="Enter your name"
                            autocomplete="name"
                            maxlength="60"
                            required
                        >

                    </div>


                    <!-- RATING -->

                    <div class="input-group">

                        <label class="input-label">
                            Your Rating *
                        </label>


                        <div
                            id="starSelector"
                            class="star-selector"
                        >

                            <button
                                class="star-button"
                                type="button"
                                data-rating="1"
                                aria-label="1 star"
                                onclick="selectRating(1)"
                            >
                                ★
                            </button>


                            <button
                                class="star-button"
                                type="button"
                                data-rating="2"
                                aria-label="2 stars"
                                onclick="selectRating(2)"
                            >
                                ★
                            </button>


                            <button
                                class="star-button"
                                type="button"
                                data-rating="3"
                                aria-label="3 stars"
                                onclick="selectRating(3)"
                            >
                                ★
                            </button>


                            <button
                                class="star-button"
                                type="button"
                                data-rating="4"
                                aria-label="4 stars"
                                onclick="selectRating(4)"
                            >
                                ★
                            </button>


                            <button
                                class="star-button"
                                type="button"
                                data-rating="5"
                                aria-label="5 stars"
                                onclick="selectRating(5)"
                            >
                                ★
                            </button>

                        </div>


                        <div
                            id="ratingLabel"
                            class="rating-label"
                        >
                            Select your rating
                        </div>

                    </div>


                    <!-- REVIEW TEXT -->

                    <div class="input-group">

                        <label
                            class="input-label"
                            for="reviewText"
                        >
                            Your Review *
                        </label>

                        <textarea
                            id="reviewText"
                            class="input-field"
                            placeholder="Share your experience..."
                            maxlength="1000"
                            required
                        ></textarea>

                    </div>


                    <button
                        id="submitReviewBtn"
                        class="submit-btn"
                        type="submit"
                        disabled
                    >
                        <i class="fas fa-paper-plane"></i>
                        &nbsp;
                        Publish Review
                    </button>

                </form>

            </div>

        </div>

    </div>


    <!-- =========================================
         TOAST
    ========================================== -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


    <script>

        "use strict";


        /* =========================================
           STORAGE
        ========================================== */

        const STORAGE_KEY =
            "havkar_user_reviews";


        const LIKES_KEY =
            "havkar_review_likes";


        /* =========================================
           INITIAL REVIEWS
        ========================================== */

        const defaultReviews = [

            {
                id: "default-1",

                name: "Marco Rossi",

                date: "2 days ago",

                rating: 5,

                text:
                    "Excellent service! Very professional and reliable. The delivery was fast and the communication was perfect. Highly recommend!",

                helpful: 45,

                avatar: "👤",

                createdAt:
                    Date.now() - 2 * 86400000
            },


            {
                id: "default-2",

                name: "Sara Ferrari",

                date: "5 days ago",

                rating: 5,

                text:
                    "Great platform! Found exactly what I was looking for. The seller was responsive and honest. Will definitely use again.",

                helpful: 32,

                avatar: "👩",

                createdAt:
                    Date.now() - 5 * 86400000
            },


            {
                id: "default-3",

                name: "Giuseppe Bianchi",

                date: "1 week ago",

                rating: 4,

                text:
                    "Good experience overall. The service was as expected. Minor delay but nothing major. Would recommend to others.",

                helpful: 28,

                avatar: "👨",

                createdAt:
                    Date.now() - 7 * 86400000
            },


            {
                id: "default-4",

                name: "Maria Romano",

                date: "2 weeks ago",

                rating: 5,

                text:
                    "Amazing! Best service I've used in Italy. Everything was smooth from start to finish. The app is easy to use and very helpful.",

                helpful: 67,

                avatar: "👩",

                createdAt:
                    Date.now() - 14 * 86400000
            }

        ];


        let reviews = [];


        let currentFilter = "all";


        let selectedRating = 0;


        let toastTimer = null;


        /* =========================================
           LOAD STORAGE
        ========================================== */

        function loadReviews() {

            try {

                const stored =
                    localStorage.getItem(
                        STORAGE_KEY
                    );


                const userReviews =
                    stored
                        ? JSON.parse(stored)
                        : [];


                reviews = [
                    ...userReviews,
                    ...defaultReviews
                ];

            } catch (error) {

                console.error(
                    "HAVKAR reviews loading error:",
                    error
                );

                reviews = [
                    ...defaultReviews
                ];

            }

        }


        /* =========================================
           SAVE USER REVIEWS
        ========================================== */

        function saveUserReviews() {

            try {

                const userReviews =
                    reviews.filter(
                        review =>
                            String(
                                review.id
                            ).startsWith("user-")
                    );


                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        userReviews
                    )
                );


            } catch (error) {

                console.error(
                    "HAVKAR review save error:",
                    error
                );

            }

        }


        /* =========================================
           LIKES
        ========================================== */

        function loadLikes() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        LIKES_KEY
                    ) || "{}"
                );

            } catch {

                return {};

            }

        }


        function saveLikes(likes) {

            try {

                localStorage.setItem(
                    LIKES_KEY,
                    JSON.stringify(likes)
                );

            } catch (error) {

                console.error(
                    "HAVKAR likes save error:",
                    error
                );

            }

        }


        /* =========================================
           HOME
        ========================================== */

        function goHome() {

            window.location.href =
                "index.html";

        }


        /* =========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        /* =========================================
           STARS
        ========================================== */

        function renderStars(rating) {

            const full =
                "★".repeat(rating);


            const empty =
                "☆".repeat(
                    5 - rating
                );


            return full + empty;

        }


        /* =========================================
           DATE
        ========================================== */

        function getRelativeDate(date) {

            const now =
                Date.now();


            const time =
                new Date(date).getTime();


            const diff =
                Math.max(
                    0,
                    now - time
                );


            const minutes =
                Math.floor(
                    diff / 60000
                );


            const hours =
                Math.floor(
                    diff / 3600000
                );


            const days =
                Math.floor(
                    diff / 86400000
                );


            if (minutes < 1) {

                return "Just now";

            }


            if (minutes < 60) {

                return (
                    minutes +
                    (
                        minutes === 1
                            ? " minute ago"
                            : " minutes ago"
                    )
                );

            }


            if (hours < 24) {

                return (
                    hours +
                    (
                        hours === 1
                            ? " hour ago"
                            : " hours ago"
                    )
                );

            }


            if (days < 7) {

                return (
                    days +
                    (
                        days === 1
                            ? " day ago"
                            : " days ago"
                    )
                );

            }


            if (days < 30) {

                const weeks =
                    Math.floor(
                        days / 7
                    );


                return (
                    weeks +
                    (
                        weeks === 1
                            ? " week ago"
                            : " weeks ago"
                    )
                );

            }


            return new Date(
                date
            ).toLocaleDateString(
                undefined,
                {
                    year: "numeric",
                    month: "short",
                    day: "numeric"
                }
            );

        }


        /* =========================================
           FILTER
        ========================================== */

        function setFilter(filter) {

            currentFilter =
                filter;


            document
                .querySelectorAll(".tab")
                .forEach(tab => {

                    tab.classList.toggle(
                        "active",
                        tab.dataset.filter === filter
                    );

                });


            renderReviews();

        }


        function toggleFilter() {

            if (
                currentFilter === "all"
            ) {

                setFilter("five");

                showToast(
                    "Showing 5-star reviews."
                );

                return;
            }


            if (
                currentFilter === "five"
            ) {

                setFilter("recent");

                showToast(
                    "Showing recent reviews."
                );

                return;
            }


            setFilter("all");

            showToast(
                "Showing all reviews."
            );

        }


        /* =========================================
           FILTERED REVIEWS
        ========================================== */

        function getFilteredReviews() {

            let result =
                [...reviews];


            if (
                currentFilter === "five"
            ) {

                result =
                    result.filter(
                        review =>
                            Number(
                                review.rating
                            ) === 5
                    );

            }


            if (
                currentFilter === "recent"
            ) {

                result.sort(
                    (
                        a,
                        b
                    ) =>
                        new Date(
                            b.createdAt
                        ) -
                        new Date(
                            a.createdAt
                        )
                );

            }


            return result;

        }


        /* =========================================
           RENDER REVIEWS
        ========================================== */

        function renderReviews() {

            const container =
                document.getElementById(
                    "reviewsList"
                );


            const filtered =
                getFilteredReviews();


            document.getElementById(
                "resultsCount"
            ).textContent =
                filtered.length +
                (
                    filtered.length === 1
                        ? " review"
                        : " reviews"
                );


            document.getElementById(
                "currentFilter"
            ).textContent =
                currentFilter === "all"
                    ? "All reviews"
                    : currentFilter === "five"
                        ? "5-star reviews"
                        : "Most recent";


            if (!filtered.length) {

                container.innerHTML = `

                    <div class="empty-state">

                        <i class="far fa-comment-dots"></i>

                        <h3>
                            No reviews found
                        </h3>

                        <p>
                            There are no reviews in this filter yet.
                        </p>

                    </div>

                `;

                return;

            }


            const likes =
                loadLikes();


            container.innerHTML =
                filtered
                    .map(
                        review =>
                            createReviewHTML(
                                review,
                                likes
                            )
                    )
                    .join("");

        }


        /* =========================================
           CREATE REVIEW HTML
        ========================================== */

        function createReviewHTML(
            review,
            likes
        ) {

            const liked =
                Boolean(
                    likes[review.id]
                );


            const isUserReview =
                String(
                    review.id
                ).startsWith(
                    "user-"
                );


            return `

                <article
                    class="review-card"
                    id="review-${escapeHTML(review.id)}"
                >

                    <div class="review-header">

                        <div class="reviewer-info">

                            <div class="reviewer-avatar">
                                ${escapeHTML(
                                    review.avatar || "👤"
                                )}
                            </div>

                            <div>

                                <div class="reviewer-name">
                                    ${escapeHTML(
                                        review.name
                                    )}
                                </div>

                                <div class="review-date">
                                    ${escapeHTML(
                                        review.date ||
                                        getRelativeDate(
                                            review.createdAt
                                        )
                                    )}
                                </div>

                                ${
                                    isUserReview
                                        ? `
                                            <div class="user-review-badge">
                                                <i class="fas fa-check-circle"></i>
                                                Your review
                                            </div>
                                          `
                                        : ""
                                }

                            </div>

                        </div>


                        <div
                            class="review-rating"
                            aria-label="${review.rating} out of 5 stars"
                        >
                            ${renderStars(
                                Number(
                                    review.rating
                                )
                            )}
                        </div>

                    </div>


                    <div class="review-text">
                        ${escapeHTML(
                            review.text
                        )}
                    </div>


                    <div class="review-meta">

                        <button
                            class="meta-btn ${liked ? "liked" : ""}"
                            type="button"
                            onclick="toggleHelpful('${escapeHTML(review.id)}')"
                        >

                            <i class="${
                                liked
                                    ? "fas"
                                    : "far"
                            } fa-thumbs-up"></i>

                            Helpful (
                            <span>
                                ${Number(
                                    review.helpful || 0
                                )}
                            </span>
                            )

                        </button>


                        <button
                            class="meta-btn"
                            type="button"
                            onclick="toggleReply('${escapeHTML(review.id)}')"
                        >

                            <i class="fas fa-reply"></i>

                            Reply

                        </button>

                    </div>


                    <div
                        id="reply-${escapeHTML(review.id)}"
                        class="reply-box"
                    >

                        <div class="reply-row">

                            <input
                                id="reply-input-${escapeHTML(review.id)}"
                                class="reply-input"
                                type="text"
                                maxlength="300"
                                placeholder="Write a reply..."
                            >

                            <button
                                class="reply-send"
                                type="button"
                                aria-label="Send reply"
                                onclick="sendReply('${escapeHTML(review.id)}')"
                            >
                                <i class="fas fa-paper-plane"></i>
                            </button>

                        </div>

                    </div>

                </article>

            `;

        }


        /* =========================================
           HELPFUL
        ========================================== */

        function toggleHelpful(id) {

            const likes =
                loadLikes();


            const review =
                reviews.find(
                    item =>
                        String(
                            item.id
                        ) === String(id)
                );


            if (!review) return;


            if (likes[id]) {

                review.helpful =
                    Math.max(
                        0,
                        Number(
                            review.helpful || 0
                        ) - 1
                    );


                delete likes[id];


                showToast(
                    "Removed from Helpful."
                );

            } else {

                review.helpful =
                    Number(
                        review.helpful || 0
                    ) + 1;


                likes[id] = true;


                showToast(
                    "Marked as Helpful."
                );

            }


            saveLikes(likes);

            saveUserReviews();

            renderReviews();

        }


        /* =========================================
           REPLY
        ========================================== */

        function toggleReply(id) {

            const box =
                document.getElementById(
                    "reply-" + id
                );


            if (!box) return;


            box.classList.toggle(
                "show"
            );


            if (
                box.classList.contains(
                    "show"
                )
            ) {

                const input =
                    document.getElementById(
                        "reply-input-" + id
                    );


                if (input) {

                    setTimeout(
                        () => input.focus(),
                        100
                    );

                }

            }

        }


        function sendReply(id) {

            const input =
                document.getElementById(
                    "reply-input-" + id
                );


            if (!input) return;


            const text =
                input.value.trim();


            if (!text) {

                showToast(
                    "Please write a reply first.",
                    "error"
                );

                return;

            }


            input.value = "";


            const box =
                document.getElementById(
                    "reply-" + id
                );


            if (box) {

                box.classList.remove(
                    "show"
                );

            }


            showToast(
                "Reply submitted successfully."
            );

        }


        /* =========================================
           REVIEW MODAL
        ========================================== */

        const reviewModal =
            document.getElementById(
                "reviewModal"
            );


        function openReviewModal() {

            reviewModal.classList.add(
                "show"
            );


            document.body.style.overflow =
                "hidden";


            setTimeout(
                () => {

                    document
                        .getElementById(
                            "reviewerName"
                        )
                        .focus();

                },
                150
            );

        }


        function closeReviewModal() {

            reviewModal.classList.remove(
                "show"
            );


            document.body.style.overflow =
                "";

        }


        function closeModalOutside(event) {

            if (
                event.target ===
                reviewModal
            ) {

                closeReviewModal();

            }

        }


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape" &&
                    reviewModal.classList.contains(
                        "show"
                    )
                ) {

                    closeReviewModal();

                }

            }
        );


        /* =========================================
           STAR SELECTION
        ========================================== */

        function selectRating(rating) {

            selectedRating =
                Number(rating);


            document
                .querySelectorAll(
                    ".star-button"
                )
                .forEach(button => {

                    const value =
                        Number(
                            button.dataset.rating
                        );


                    button.classList.toggle(
                        "selected",
                        value <= selectedRating
                    );

                });


            const labels = {

                1: "Very poor",

                2: "Poor",

                3: "Average",

                4: "Good",

                5: "Excellent"

            };


            document.getElementById(
                "ratingLabel"
            ).textContent =
                labels[
                    selectedRating
                ];


            validateReviewForm();

        }


        /* =========================================
           FORM VALIDATION
        ========================================== */

        function validateReviewForm() {

            const name =
                document
                    .getElementById(
                        "reviewerName"
                    )
                    .value
                    .trim();


            const text =
                document
                    .getElementById(
                        "reviewText"
                    )
                    .value
                    .trim();


            const button =
                document.getElementById(
                    "submitReviewBtn"
                );


            button.disabled =
                !(
                    name.length >= 2 &&
                    text.length >= 5 &&
                    selectedRating >= 1
                );

        }


        document
            .getElementById(
                "reviewerName"
            )
            .addEventListener(
                "input",
                validateReviewForm
            );


        document
            .getElementById(
                "reviewText"
            )
            .addEventListener(
                "input",
                validateReviewForm
            );


        /* =========================================
           SUBMIT REVIEW
        ========================================== */

        document
            .getElementById(
                "reviewForm"
            )
            .addEventListener(
                "submit",
                event => {

                    event.preventDefault();


                    const name =
                        document
                            .getElementById(
                                "reviewerName"
                            )
                            .value
                            .trim();


                    const text =
                        document
                            .getElementById(
                                "reviewText"
                            )
                            .value
                            .trim();


                    if (
                        name.length < 2 ||
                        text.length < 5 ||
                        selectedRating < 1
                    ) {

                        showToast(
                            "Please complete your name, rating and review.",
                            "error"
                        );

                        return;

                    }


                    const newReview = {

                        id:
                            "user-" +
                            Date.now(),

                        name,

                        rating:
                            selectedRating,

                        text,

                        helpful: 0,

                        avatar: "👤",

                        createdAt:
                            new Date().toISOString(),

                        date:
                            "Just now"

                    };


                    reviews.unshift(
                        newReview
                    );


                    saveUserReviews();


                    closeReviewModal();


                    document
                        .getElementById(
                            "reviewForm"
                        )
                        .reset();


                    selectedRating = 0;


                    document
                        .querySelectorAll(
                            ".star-button"
                        )
                        .forEach(
                            button =>
                                button.classList.remove(
                                    "selected"
                                )
                        );


                    document.getElementById(
                        "ratingLabel"
                    ).textContent =
                        "Select your rating";


                    document.getElementById(
                        "submitReviewBtn"
                    ).disabled = true;


                    currentFilter =
                        "all";


                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            tab =>
                                tab.classList.toggle(
                                    "active",
                                    tab.dataset.filter ===
                                    "all"
                                )
                        );


                    updateRatingSummary();


                    renderReviews();


                    showToast(
                        "Your review has been published successfully."
                    );


                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }
            );


        /* =========================================
           RATING SUMMARY
        ========================================== */

        function updateRatingSummary() {

            /*
             * The four built-in reviews are examples.
             * User reviews are added to the local display.
             * The original public summary remains the
             * baseline until a real backend supplies
             * authoritative platform-wide statistics.
             */

            const userReviews =
                reviews.filter(
                    review =>
                        String(
                            review.id
                        ).startsWith(
                            "user-"
                        )
                );


            if (!userReviews.length) {

                return;

            }


            const baselineCounts = {

                5: 1060,

                4: 125,

                3: 37,

                2: 12,

                1: 13

            };


            userReviews.forEach(
                review => {

                    const rating =
                        Number(
                            review.rating
                        );


                    if (
                        baselineCounts[
                            rating
                        ] !== undefined
                    ) {

                        baselineCounts[
                            rating
                        ]++;

                    }

                }
            );


            const total =
                Object.values(
                    baselineCounts
                ).reduce(
                    (
                        sum,
                        value
                    ) =>
                        sum + value,
                    0
                );


            const weighted =
                Object.entries(
                    baselineCounts
                ).reduce(
                    (
                        sum,
                        [
                            rating,
                            count
                        ]
                    ) =>
                        sum +
                        Number(rating) *
                        count,
                    0
                );


            const average =
                (
                    weighted /
                    total
                ).toFixed(1);


            document.getElementById(
                "averageRating"
            ).textContent =
                average;


            document.getElementById(
                "totalReviews"
            ).textContent =
                "Based on " +
                total.toLocaleString() +
                " reviews";


            [5,4,3,2,1].forEach(
                rating => {

                    const count =
                        baselineCounts[
                            rating
                        ];


                    const percentage =
                        (
                            count /
                            total
                        ) *
                        100;


                    document.getElementById(
                        "count" + rating
                    ).textContent =
                        count.toLocaleString();


                    document.getElementById(
                        "bar" + rating
                    ).style.width =
                        Math.max(
                            1,
                            percentage
                        ) + "%";

                }
            );

        }


        /* =========================================
           TOAST
        ========================================== */

        function showToast(
            message,
            type = "success"
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            clearTimeout(
                toastTimer
            );


            toast.textContent =
                message;


            toast.className =
                "toast show " +
                type;


            toastTimer =
                setTimeout(
                    () => {

                        toast.className =
                            "toast";

                    },
                    3200
                );

        }


        /* =========================================
           INITIALIZATION
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                loadReviews();

                renderReviews();

                updateRatingSummary();

            }
        );

    </script>

</body>
