<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7cb342">

<title>HAVKAR - Transport</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =========================================================
   HAVKAR TRANSPORT
   Flight • Train • Bus • Taxi • Transfer
   Demo-ready architecture
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --green:#7cb342;
    --green-dark:#558b2f;
    --green-light:#eef7e8;
    --bg:#f5f6f5;
    --white:#ffffff;
    --text:#252525;
    --muted:#777;
    --border:#e2e2e2;
    --warning-bg:#fff8e1;
    --warning-border:#f0d98a;
    --warning-text:#765c00;
    --shadow:0 4px 18px rgba(0,0,0,.07);
    --danger:#e53935;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:88px;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    color:#fff;
    background:linear-gradient(135deg,#689f38,#7cb342);
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.header-left{
    display:flex;
    align-items:center;
    gap:13px;
    min-width:0;
}

.header-title{
    font-size:22px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-right{
    display:flex;
    gap:9px;
    flex:none;
}

.back-button,
.header-button{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:rgba(255,255,255,.18);
    cursor:pointer;
    font-size:18px;
}

/* =========================================================
   DEMO NOTICE
========================================================= */

.demo-notice{
    margin:14px 16px 0;
    padding:14px 15px;
    border-radius:15px;
    background:var(--warning-bg);
    border:1px solid var(--warning-border);
    color:var(--warning-text);
    display:flex;
    align-items:flex-start;
    gap:11px;
    font-size:13px;
    line-height:1.45;
}

.demo-notice i{
    margin-top:2px;
    font-size:18px;
    color:#d49b00;
}

.demo-notice strong{
    font-size:14px;
}

/* =========================================================
   TRANSPORT TABS
========================================================= */

.transport-tabs{
    margin:14px 16px 0;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    padding:5px;
    background:#fff;
    border-radius:16px;
    box-shadow:var(--shadow);
}

.transport-tab{
    min-width:0;
    min-height:58px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#666;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:11px;
    font-weight:750;
}

.transport-tab i{
    font-size:18px;
}

.transport-tab.active{
    color:#fff;
    background:linear-gradient(135deg,#689f38,#7cb342);
}

/* =========================================================
   SEARCH CARD
========================================================= */

.search-section{
    margin:14px 16px 0;
    padding:17px;
    background:#fff;
    border-radius:18px;
    box-shadow:var(--shadow);
}

.search-heading{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:14px;
    color:var(--green-dark);
    font-size:16px;
    font-weight:800;
}

.search-heading i{
    font-size:18px;
}

.search-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
}

.input-wrap{
    position:relative;
}

.input-wrap i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--green);
    pointer-events:none;
    z-index:1;
}

.search-input,
.select-input{
    width:100%;
    height:54px;
    border:2px solid var(--border);
    border-radius:13px;
    background:#fff;
    outline:none;
    font-size:15px;
    color:#333;
}

.search-input{
    padding:0 12px 0 40px;
}

.select-input{
    padding:0 12px;
}

.search-input:focus,
.select-input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(124,179,66,.12);
}

.swap-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 10px;
}

.swap-button{
    width:42px;
    height:42px;
    border:1px solid #ddd;
    border-radius:50%;
    background:#fff;
    color:var(--green-dark);
    cursor:pointer;
    font-size:17px;
}

.filter-button{
    border:0;
    background:none;
    color:var(--green-dark);
    font-weight:750;
    cursor:pointer;
    font-size:14px;
}

.extra-filters{
    display:none;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:11px;
}

.extra-filters.show{
    display:grid;
}

.select-wrap label{
    display:block;
    margin:0 0 5px 3px;
    font-size:12px;
    color:var(--muted);
}

.search-button{
    width:100%;
    height:54px;
    margin-top:3px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#689f38,#7cb342);
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(124,179,66,.22);
}

.search-button:active{
    transform:scale(.99);
}

/* =========================================================
   TRANSFER EXTRA FIELD
========================================================= */

.transfer-extra{
    display:none;
    margin-bottom:10px;
}

.transfer-extra.show{
    display:block;
}

.full-input{
    width:100%;
}

/* =========================================================
   CONTENT
========================================================= */

.content{
    padding:3px 16px 95px;
}

.results-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:20px 2px 13px;
}

.results-title{
    font-size:20px;
    font-weight:800;
}

.result-count{
    color:var(--muted);
    font-size:13px;
    white-space:nowrap;
}

/* =========================================================
   TICKET CARD
========================================================= */

.ticket-card{
    background:#fff;
    border-radius:18px;
    padding:17px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
    border:1px solid rgba(0,0,0,.025);
}

.ticket-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:17px;
}

.provider{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
}

.provider-logo{
    width:47px;
    height:47px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:var(--green-light);
    color:var(--green-dark);
    font-size:20px;
}

.provider-name{
    font-size:15px;
    font-weight:800;
}

.provider-code{
    margin-top:3px;
    color:#888;
    font-size:12px;
}

.price-box{
    text-align:right;
    flex:none;
}

.price{
    color:var(--green-dark);
    font-size:22px;
    font-weight:850;
}

.price-label{
    color:#888;
    font-size:11px;
    margin-top:2px;
}

/* =========================================================
   ROUTE
========================================================= */

.route{
    display:grid;
    grid-template-columns:1fr 65px 1fr;
    align-items:center;
    gap:5px;
    margin-bottom:13px;
}

.location{
    min-width:0;
}

.location.right{
    text-align:right;
}

.city{
    font-size:20px;
    font-weight:850;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.time{
    margin-top:3px;
    color:#666;
    font-size:13px;
}

.station{
    margin-top:3px;
    color:#999;
    font-size:11px;
}

.route-center{
    text-align:center;
    color:var(--green);
}

.route-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.route-line::before,
.route-line::after{
    content:"";
    width:18px;
    height:1px;
    background:#ddd;
}

.route-duration{
    margin-top:5px;
    color:#777;
    font-size:11px;
}

/* =========================================================
   INFO
========================================================= */

.ticket-info{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    padding:11px 0;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
}

.info-item{
    display:flex;
    align-items:center;
    gap:5px;
    color:#666;
    font-size:12px;
}

.info-item i{
    color:var(--green);
}

/* =========================================================
   DEMO BUTTON
========================================================= */

.demo-disabled{
    width:100%;
    min-height:48px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#eee;
    color:#888;
    font-size:14px;
    font-weight:750;
    cursor:not-allowed;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty-state{
    background:#fff;
    border-radius:18px;
    padding:48px 18px;
    text-align:center;
    box-shadow:var(--shadow);
}

.empty-icon{
    width:68px;
    height:68px;
    margin:0 auto 14px;
    border-radius:50%;
    background:#f0f0f0;
    color:#aaa;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.empty-state h3{
    margin-bottom:7px;
    color:#666;
    font-size:18px;
}

.empty-state p{
    color:#999;
    font-size:13px;
    line-height:1.5;
}

.loading{
    background:#fff;
    border-radius:18px;
    padding:45px 20px;
    text-align:center;
    box-shadow:var(--shadow);
    color:#777;
}

.loading i{
    color:var(--green);
    font-size:25px;
    margin-bottom:10px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    z-index:3000;
    max-width:90%;
    background:#333;
    color:#fff;
    padding:11px 17px;
    border-radius:11px;
    font-size:13px;
    text-align:center;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:#fff;
    box-shadow:0 -3px 13px rgba(0,0,0,.09);
    z-index:2000;
}

.nav-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#999;
    font-size:11px;
    cursor:pointer;
}

.nav-item i{
    font-size:20px;
}

.nav-item.active{
    color:var(--green);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    .header{
        padding:13px 15px;
    }

    .header-title{
        font-size:20px;
    }

    .transport-tabs{
        gap:3px;
        padding:4px;
    }

    .transport-tab{
        min-height:56px;
        font-size:10px;
    }

    .transport-tab i{
        font-size:17px;
    }

    .search-section{
        padding:15px;
    }

    .search-row{
        gap:8px;
    }

    .search-input{
        height:52px;
        font-size:14px;
    }

    .city{
        font-size:18px;
    }

    .route{
        grid-template-columns:1fr 54px 1fr;
    }

}

@media(max-width:420px){

    .transport-tab{
        min-height:52px;
    }

    .transport-tab i{
        font-size:15px;
    }

    .transport-tab{
        font-size:9px;
    }

    .ticket-card{
        padding:14px;
    }

    .price{
        font-size:19px;
    }

    .provider-name{
        font-size:14px;
    }

}

@media(max-width:360px){

    .transport-tabs{
        grid-template-columns:repeat(5,1fr);
    }

    .transport-tab{
        font-size:8px;
    }

    .transport-tab i{
        font-size:14px;
    }

    .search-row{
        grid-template-columns:1fr;
    }

    .route{
        grid-template-columns:1fr 45px 1fr;
    }

}

/* =========================================================
   ACCESSIBILITY
========================================================= */

button,
input,
select{
    -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible{
    outline:3px solid rgba(124,179,66,.25);
    outline-offset:2px;
}

</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-button"
            type="button"
            aria-label="Back"
        >
            <i class="fas fa-arrow-left"></i>
        </button>

        <h1
            id="pageTitle"
            class="header-title"
        >
            Transport
        </h1>

    </div>

    <div class="header-right">

        <button
            id="notificationButton"
            class="header-button"
            type="button"
            aria-label="Notifications"
        >
            <i class="fas fa-bell"></i>
        </button>

        <button
            id="profileButton"
            class="header-button"
            type="button"
            aria-label="Profile"
        >
            <i class="fas fa-user"></i>
        </button>

    </div>

</header>


<!-- =========================================================
     DEMO NOTICE
========================================================= -->

<div class="demo-notice">

    <i class="fas fa-flask"></i>

    <div>

        <strong>HAVKAR Transport Demo</strong><br>

        Flight, train, bus, taxi and transfer services
        are currently using demo data.
        Real prices, availability and booking will be
        connected through partner APIs.

    </div>

</div>


<!-- =========================================================
     TRANSPORT TABS
========================================================= -->

<div class="transport-tabs">

    <button
        class="transport-tab active"
        data-type="flight"
        type="button"
    >
        <i class="fas fa-plane"></i>
        <span>Flight</span>
    </button>

    <button
        class="transport-tab"
        data-type="train"
        type="button"
    >
        <i class="fas fa-train"></i>
        <span>Train</span>
    </button>

    <button
        class="transport-tab"
        data-type="bus"
        type="button"
    >
        <i class="fas fa-bus"></i>
        <span>Bus</span>
    </button>

    <button
        class="transport-tab"
        data-type="taxi"
        type="button"
    >
        <i class="fas fa-taxi"></i>
        <span>Taxi</span>
    </button>

    <button
        class="transport-tab"
        data-type="transfer"
        type="button"
    >
        <i class="fas fa-van-shuttle"></i>
        <span>Transfer</span>
    </button>

</div>


<!-- =========================================================
     SEARCH
========================================================= -->

<section class="search-section">

    <div class="search-heading">

        <i id="searchTypeIcon" class="fas fa-plane"></i>

        <span id="searchHeadingText">
            Search Flights
        </span>

    </div>


    <div class="search-row">

        <div class="input-wrap">

            <i class="fas fa-location-dot"></i>

            <input
                id="fromInput"
                class="search-input"
                type="text"
                value="Rome"
                placeholder="From"
                autocomplete="off"
            >

        </div>


        <div class="input-wrap">

            <i class="fas fa-location-dot"></i>

            <input
                id="toInput"
                class="search-input"
                type="text"
                value="Milan"
                placeholder="To"
                autocomplete="off"
            >

        </div>

    </div>


    <div class="swap-row">

        <button
            id="swapButton"
            class="swap-button"
            type="button"
            aria-label="Swap locations"
        >
            <i class="fas fa-right-left"></i>
        </button>


        <button
            id="filterButton"
            class="filter-button"
            type="button"
        >
            <i class="fas fa-sliders"></i>
            Filters
        </button>

    </div>


    <div class="search-row">

        <div class="input-wrap">

            <i class="fas fa-calendar"></i>

            <input
                id="dateInput"
                class="search-input"
                type="date"
                aria-label="Date"
            >

        </div>


        <div class="input-wrap">

            <i class="fas fa-user"></i>

            <input
                id="passengersInput"
                class="search-input"
                type="number"
                min="1"
                max="9"
                value="1"
                inputmode="numeric"
                aria-label="Passengers"
            >

        </div>

    </div>


    <!-- =====================================================
         TRANSFER EXTRA
    ===================================================== -->

    <div
        id="transferExtra"
        class="transfer-extra"
    >

        <div class="input-wrap">

            <i class="fas fa-clock"></i>

            <input
                id="timeInput"
                class="search-input full-input"
                type="time"
                aria-label="Pickup time"
            >

        </div>

    </div>


    <!-- =====================================================
         FILTERS
    ===================================================== -->

    <div
        id="extraFilters"
        class="extra-filters"
    >

        <div class="select-wrap">

            <label for="stopsSelect">
                Stops
            </label>

            <select
                id="stopsSelect"
                class="select-input"
            >

                <option value="any">
                    Any
                </option>

                <option value="direct">
                    Direct only
                </option>

                <option value="one">
                    Up to 1 stop
                </option>

            </select>

        </div>


        <div class="select-wrap">

            <label for="sortSelect">
                Sort by
            </label>

            <select
                id="sortSelect"
                class="select-input"
            >

                <option value="recommended">
                    Recommended
                </option>

                <option value="price">
                    Lowest price
                </option>

                <option value="duration">
                    Shortest trip
                </option>

                <option value="departure">
                    Earliest departure
                </option>

            </select>

        </div>

    </div>


    <button
        id="searchButton"
        class="search-button"
        type="button"
    >

        <i class="fas fa-search"></i>

        <span id="searchButtonText">
            Search Flights
        </span>

    </button>

</section>


<!-- =========================================================
     RESULTS
========================================================= -->

<main class="content">

    <div class="results-header">

        <div
            id="resultsTitle"
            class="results-title"
        >
            Available Demo Flights
        </div>

        <div
            id="resultCount"
            class="result-count"
        >
            0 results
        </div>

    </div>


    <div id="resultsContainer"></div>

</main>


<!-- =========================================================
     BOTTOM NAVIGATION
========================================================= -->

<nav class="bottom-nav">

    <div
        id="homeNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-home"></i>
        <span>Home</span>
    </div>


    <div
        id="searchNav"
        class="nav-item active"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-search"></i>
        <span>Search</span>
    </div>


    <div
        id="ticketsNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-ticket"></i>
        <span>Tickets</span>
    </div>


    <div
        id="alertsNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-bell"></i>
        <span>Alerts</span>
    </div>


    <div
        id="profileNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-user"></i>
        <span>Profile</span>
    </div>

</nav>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>


<script>

"use strict";

/* =========================================================
   HAVKAR TRANSPORT ENGINE
========================================================= */


/* =========================================================
   STATE
========================================================= */

let currentType = "flight";

let currentResults = [];

let toastTimer = null;

let searchTimer = null;


/* =========================================================
   TRANSPORT CONFIGURATION
========================================================= */

const transportConfig = {

    flight:{
        title:"Flight Tickets",
        searchTitle:"Search Flights",
        button:"Search Flights",
        results:"Available Demo Flights",
        icon:"fa-plane",
        station:"Airport"
    },

    train:{
        title:"Train Tickets",
        searchTitle:"Search Trains",
        button:"Search Trains",
        results:"Available Demo Trains",
        icon:"fa-train",
        station:"Station"
    },

    bus:{
        title:"Bus Tickets",
        searchTitle:"Search Buses",
        button:"Search Buses",
        results:"Available Demo Buses",
        icon:"fa-bus",
        station:"Bus Station"
    },

    taxi:{
        title:"Taxi",
        searchTitle:"Find a Taxi",
        button:"Search Taxis",
        results:"Available Demo Taxis",
        icon:"fa-taxi",
        station:"Pickup"
    },

    transfer:{
        title:"Transfer",
        searchTitle:"Airport / City Transfer",

/* =========================================================
   DOM HELPER
========================================================= */

function $(id){

    return document.getElementById(id);

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    return String(value || "")
        .trim()
        .toLowerCase();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   TIME TO MINUTES
========================================================= */

function timeToMinutes(time){

    const match =
        String(time || "").match(
            /(\d+):(\d+)\s*(AM|PM)/i
        );

    if(!match){
        return 0;
    }

    let hour =
        Number(match[1]);

    const minute =
        Number(match[2]);

    const period =
        match[3].toUpperCase();

    if(
        period === "PM" &&
        hour !== 12
    ){
        hour += 12;
    }

    if(
        period === "AM" &&
        hour === 12
    ){
        hour = 0;
    }

    return hour * 60 + minute;

}


/* =========================================================
   SET TODAY
========================================================= */

function setToday(){

    const input =
        $("dateInput");

    if(!input){
        return;
    }

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            today.getDate()
        ).padStart(2,"0");

    input.value =
        `${year}-${month}-${day}`;

}


/* =========================================================
   GET CURRENT DATA
========================================================= */

function getCurrentData(){

    return (
        transportData[currentType] ||
        []
    );

}


/* =========================================================
   ROUTE MATCH
========================================================= */

function routeMatches(){

    const from =
        normalize(
            $("fromInput")?.value
        );

    const to =
        normalize(
            $("toInput")?.value
        );

    if(!from || !to){
        return false;
    }

    /*
       Demo routes intentionally remain limited.
       Real API will replace this function later.
    */

    if(currentType === "transfer"){

        return (
            from.includes("rome") &&
            (
                to.includes("rome") ||
                to.includes("city")
            )
        );

    }

    return (
        from === "rome" &&
        to === "milan"
    );

}


/* =========================================================
   FILTER + SORT
========================================================= */

function getFilteredResults(){

    if(!routeMatches()){
        return [];
    }

    let results =
        getCurrentData().map(
            item => ({
                ...item
            })
        );


    /* STOPS */

    const stopFilter =
        $("stopsSelect")?.value ||
        "any";


    if(
        stopFilter === "direct"
    ){

        results =
            results.filter(
                item =>
                    item.stops === 0
            );

    }


    if(
        stopFilter === "one"
    ){

        results =
            results.filter(
                item =>
                    item.stops <= 1
            );

    }


    /* SORT */

    const sort =
        $("sortSelect")?.value ||
        "recommended";


    if(sort === "price"){

        results.sort(
            (a,b) =>
                a.price - b.price
        );

    }

    else if(
        sort === "duration"
    ){

        results.sort(
            (a,b) =>
                a.durationMinutes -
                b.durationMinutes
        );

    }

    else if(
        sort === "departure"
    ){

        results.sort(
            (a,b) =>
                timeToMinutes(
                    a.fromTime
                ) -
                timeToMinutes(
                    b.fromTime
                )
        );

    }

    else{

        results.sort(
            (a,b) => {

                const scoreA =
                    a.price +
                    (
                        a.durationMinutes *
                        0.08
                    ) +
                    (
                        a.stops *
                        15
                    );

                const scoreB =
                    b.price +
                    (
                        b.durationMinutes *
                        0.08
                    ) +
                    (
                        b.stops *
                        15
                    );

                return scoreA - scoreB;

            }
        );

    }


    return results;

}


/* =========================================================
   SEARCH
========================================================= */

function performSearch(){

    clearTimeout(searchTimer);

    const container =
        $("resultsContainer");

    if(!container){
        return;
    }


    container.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Searching demo ${escapeHtml(
                    currentType
                )} services...
            </div>

        </div>

    `;


    searchTimer =
        setTimeout(() => {

            currentResults =
                getFilteredResults();

            renderResults();

        },220);

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults(){

    const container =
        $("resultsContainer");

    const count =
        $("resultCount");

    if(!container){
        return;
    }


    if(count){

        count.textContent =
            currentResults.length +
            " demo results";

    }


    if(
        currentResults.length === 0
    ){

        const from =
            $("fromInput")?.value ||
            "";

        const to =
            $("toInput")?.value ||
            "";


        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">

                    <i class="fas ${
                        routeMatches()
                            ? "fa-search"
                            : "fa-location-dot"
                    }"></i>

                </div>

                <h3>
                    ${
                        routeMatches()
                            ? "No demo results"
                            : "Enter a supported route"
                    }
                </h3>

                <p>
                    ${
                        routeMatches()
                            ? "There are currently no demo services for this search."
                            : `Demo ${
                                currentType
                            } currently supports the prepared test routes.`
                    }
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        currentResults
            .map(
                item =>
                    createTransportCard(item)
            )
            .join("");

}

/* =========================================================
   CHANGE TRANSPORT TYPE
========================================================= */

function setTransportType(type){

    if(
        !transportConfig[type]
    ){
        return;
    }


    currentType =
        type;


    const config =
        transportConfig[type];


    /* ACTIVE TAB */

    document
        .querySelectorAll(
            ".transport-tab"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.type === type
                );

            }
        );


    /* HEADER */

    $("pageTitle").textContent =
        config.title;


    /* SEARCH */

    $("searchTypeIcon").className =
        `fas ${config.icon}`;

    $("searchHeadingText").textContent =
        config.searchTitle;

    $("searchButtonText").textContent =
        config.button;

    $("resultsTitle").textContent =
        config.results;


    /* TRANSFER TIME */

    const transferExtra =
        $("transferExtra");

    if(transferExtra){

        transferExtra.classList.toggle(
            "show",
            type === "transfer"
        );

    }


    /* FILTERS */

    const filterButton =
        $("filterButton");

    if(filterButton){

        filterButton.style.display =
            (
                type === "taxi" ||
                type === "transfer"
            )
                ? "none"
                : "block";

    }


    const extraFilters =
        $("extraFilters");

    if(
        type === "taxi" ||
        type === "transfer"
    ){

        if(extraFilters){

            extraFilters.classList.remove(
                "show"
            );

        }

    }


    /* DEFAULT ROUTE */

    if(type === "transfer"){

        $("fromInput").value =
            "Rome Airport";

        $("toInput").value =
            "Rome City";

    }

    else{

        $("fromInput").value =
            "Rome";

        $("toInput").value =
            "Milan";

    }


    currentResults =
        [];

    performSearch();

}


/* =========================================================
   SWAP
========================================================= */

function swapLocations(){

    const from =
        $("fromInput");

    const to =
        $("toInput");


    if(!from || !to){
        return;
    }


    const temporary =
        from.value;

    from.value =
        to.value;

    to.value =
        temporary;


    performSearch();

}


/* =========================================================
   FILTERS
========================================================= */

function toggleFilters(){

    const filters =
        $("extraFilters");

    if(!filters){
        return;
    }

    filters.classList.toggle(
        "show"
    );

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        $("toast");

    if(!toast){
        return;
    }


    toast.textContent =
        String(message);


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2300);

}


/* =========================================================
   SAFE EVENT
========================================================= */

function on(
    elementId,
    eventName,
    handler
){

    const element =
        $(elementId);

    if(!element){
        return;
    }

    element.addEventListener(
        eventName,
        handler
    );

}


/* =========================================================
   ENTER SEARCH
========================================================= */

function setupEnterSearch(
    elementId
){

    const element =
        $(elementId);

    if(!element){
        return;
    }


    element.addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){

                event.preventDefault();

                performSearch();

            }

        }
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

function initializeHAVKAR(){

    console.log(
        "HAVKAR Transport initializing..."
    );


    setToday();


    /* TRANSPORT TABS */

    document
        .querySelectorAll(
            ".transport-tab"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        setTransportType(
                            button.dataset.type
                        );

                    }
                );

            }
        );


    /* SEARCH */

    on(
        "searchButton",
        "click",
        performSearch
    );


    /* SWAP */

    on(
        "swapButton",
        "click",
        swapLocations
    );


    /* FILTER */

    on(
        "filterButton",
        "click",
        toggleFilters
    );


    /* FILTER CHANGES */

    on(
        "stopsSelect",
        "change",
        performSearch
    );

    on(
        "sortSelect",
        "change",
        performSearch
    );


    /* DATE */

    on(
        "dateInput",
        "change",
        performSearch
    );


    /* PASSENGERS */

    on(
        "passengersInput",
        "change",
        () => {

            const input =
                $("passengersInput");

            if(!input){
                return;
            }


            let value =
                Number(
                    input.value
                );


            if(
                !Number.isFinite(value) ||
                value < 1
            ){

                value = 1;

            }


            if(value > 9){

                value = 9;

            }


            input.value =
                value;

        }
    );


    /* ENTER */

    setupEnterSearch(
        "fromInput"
    );

    setupEnterSearch(
        "toInput"
    );


    /* HEADER */

    on(
        "backButton",
        "click",
        goHome
    );


    on(
        "notificationButton",
        "click",
        () =>
            showToast(
                "Notifications"
            )
    );


    on(
        "profileButton",
        "click",
        () =>
            showToast(
                "Profile"
            )
    );


    /* BOTTOM NAV */

    on(
        "homeNav",
        "click",
        goHome
    );


    on(
        "searchNav",
        "click",
        () => {

            const section =
                document.querySelector(
                    ".search-section"
                );

            if(section){

                section.scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });

            }

        }
    );


    on(
        "ticketsNav",
        "click",
        () =>
            showToast(
                "Ticket history will be connected later."
            )
    );


    on(
        "alertsNav",
        "click",
        () =>
            showToast(
                "Alerts"
            )
    );


    on(
        "profileNav",
        "click",
        () =>
            showToast(
                "Profile"
            )
    );


    /* FIRST SEARCH */

    setTransportType(
        "flight"
    );


    console.log(
        "HAVKAR Transport initialized successfully."
    );

}


/* =========================================================

if(

    document.addEventListener(

}
else{
