<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7cb342">

<title>HAVKAR - Tickets</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --green:#7cb342;
    --green-dark:#558b2f;
    --green-light:#eef7e8;
    --bg:#f5f6f5;
    --white:#fff;
    --text:#252525;
    --muted:#777;
    --border:#e2e2e2;
    --warning-bg:#fff8e1;
    --warning-border:#f0d98a;
    --warning-text:#765c00;
    --shadow:0 4px 18px rgba(0,0,0,.07);
    --danger:#e53935;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    padding-bottom:88px;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

button,
input,
select{
    font:inherit;
    -webkit-tap-highlight-color:transparent;
}

button{
    cursor:pointer;
}

.header{
    min-height:76px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#fff;
    background:linear-gradient(135deg,#689f38,#7cb342);
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.header-left{
    min-width:0;
    display:flex;
    align-items:center;
    gap:13px;
}

.header-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:22px;
    font-weight:800;
}

.header-right{
    display:flex;
    gap:9px;
}

.header-button,
.back-button{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:rgba(255,255,255,.18);
    font-size:18px;
}

.demo-notice{
    margin:14px 16px 0;
    padding:14px 15px;
    display:flex;
    align-items:flex-start;
    gap:11px;
    border:1px solid var(--warning-border);
    border-radius:15px;
    background:var(--warning-bg);
    color:var(--warning-text);
    font-size:13px;
    line-height:1.45;
}

.demo-notice i{
    margin-top:2px;
    color:#d49b00;
    font-size:18px;
}

.demo-notice strong{
    font-size:14px;
}

.ticket-types{
    margin:14px 16px 0;
    padding:5px;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
    border-radius:16px;
    background:#fff;
    box-shadow:var(--shadow);
}

.ticket-type{
    min-width:0;
    min-height:62px;
    padding:5px 2px;
    border:0;
    border-radius:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#666;
    background:transparent;
    font-size:10px;
    font-weight:750;
}

.ticket-type i{
    font-size:18px;
}

.ticket-type.active{
    color:#fff;
    background:linear-gradient(135deg,#689f38,#7cb342);
}

.search-section{
    margin:14px 16px 0;
    padding:17px;
    border-radius:18px;
    background:#fff;
    box-shadow:var(--shadow);
}

.search-heading{
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--green-dark);
    font-size:16px;
    font-weight:800;
}

.search-heading i{
    font-size:18px;
}

.search-row{
    margin-bottom:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.input-wrap{
    position:relative;
}

.input-wrap > i{
    position:absolute;
    left:14px;
    top:50%;
    z-index:1;
    transform:translateY(-50%);
    color:var(--green);
    pointer-events:none;
}

.search-input,
.select-input{
    width:100%;
    height:54px;
    border:2px solid var(--border);
    border-radius:13px;
    outline:none;
    background:#fff;
    color:#333;
    font-size:15px;
}

.search-input{
    padding:0 12px 0 40px;
}

.select-input{
    padding:0 12px;
}

.search-input:focus,
.select-input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(124,179,66,.12);
}

.swap-row{
    margin:0 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.swap-button{
    width:42px;
    height:42px;
    border:1px solid #ddd;
    border-radius:50%;
    background:#fff;
    color:var(--green-dark);
    font-size:17px;
}

.filter-button{
    border:0;
    background:none;
    color:var(--green-dark);
    font-size:14px;
    font-weight:750;
}

.extra-filters{
    display:none;
    margin-bottom:11px;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.extra-filters.show{
    display:grid;
}

.select-wrap label{
    display:block;
    margin:0 0 5px 3px;
    color:var(--muted);
    font-size:12px;
}

.search-button{
    width:100%;
    height:54px;
    margin-top:3px;
    border:0;
    border-radius:13px;
    color:#fff;
    background:linear-gradient(135deg,#689f38,#7cb342);
    box-shadow:0 4px 12px rgba(124,179,66,.22);
    font-size:16px;
    font-weight:800;
}

.content{
    padding:3px 16px 95px;
}

.results-header{
    margin:20px 2px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.results-title{
    font-size:20px;
    font-weight:800;
}

.result-count{
    color:var(--muted);
    font-size:13px;
    white-space:nowrap;
}

.ticket-card{
    margin-bottom:14px;
    padding:17px;
    border:1px solid rgba(0,0,0,.025);
    border-radius:18px;
    background:#fff;
    box-shadow:var(--shadow);
}

.ticket-top{
    margin-bottom:17px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.provider{
    min-width:0;
    display:flex;
    align-items:center;
    gap:11px;
}

.provider-logo{
    width:47px;
    height:47px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:var(--green-light);
    color:var(--green-dark);
    font-size:20px;
}

.provider-name{
    font-size:15px;
    font-weight:800;
}

.provider-code{
    margin-top:3px;
    color:#888;
    font-size:12px;
}

.price-box{
    flex:none;
    text-align:right;
}

.price{
    color:var(--green-dark);
    font-size:22px;
    font-weight:850;
}

.price-label{
    margin-top:2px;
    color:#888;
    font-size:11px;
}

.route{
    margin-bottom:13px;
    display:grid;
    grid-template-columns:1fr 65px 1fr;
    align-items:center;
    gap:5px;
}

.location{
    min-width:0;
}

.location.right{
    text-align:right;
}

.city{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:20px;
    font-weight:850;
}

.time{
    margin-top:3px;
    color:#666;
    font-size:13px;
}

.station{
    margin-top:3px;
    color:#999;
    font-size:11px;
}

.route-center{
    text-align:center;
    color:var(--green);
}

.route-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.route-line::before,
.route-line::after{
    content:"";
    width:18px;
    height:1px;
    background:#ddd;
}

.route-duration{
    margin-top:5px;
    color:#777;
    font-size:11px;
}

.ticket-info{
    padding:11px 0;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
}

.info-item{
    display:flex;
    align-items:center;
    gap:5px;
    color:#666;
    font-size:12px;
}

.info-item i{
    color:var(--green);
}

.demo-disabled{
    width:100%;
    min-height:48px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:#888;
    background:#eee;
    font-size:14px;
    font-weight:750;
}

.empty-state,
.loading{
    padding:48px 18px;
    border-radius:18px;
    background:#fff;
    box-shadow:var(--shadow);
    text-align:center;
}

.empty-icon{
    width:68px;
    height:68px;
    margin:0 auto 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#f0f0f0;
    color:#aaa;
    font-size:28px;
}

.empty-state h3{
    margin-bottom:7px;
    color:#666;
    font-size:18px;
}

.empty-state p{
    color:#999;
    font-size:13px;
    line-height:1.5;
}

.loading{
    padding:45px 20px;
    color:#777;
}

.loading i{
    margin-bottom:10px;
    color:var(--green);
    font-size:25px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    z-index:3000;
    max-width:90%;
    padding:11px 17px;
    border-radius:11px;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    color:#fff;
    background:#333;
    font-size:13px;
    text-align:center;
    transition:.25s;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:2000;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:#fff;
    box-shadow:0 -3px 13px rgba(0,0,0,.09);
}

.nav-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#999;
    font-size:11px;
    cursor:pointer;
}

.nav-item i{
    font-size:20px;
}

.nav-item.active{
    color:var(--green);
}

button:focus-visible,
input:focus-visible,
select:focus-visible{
    outline:3px solid rgba(124,179,66,.25);
    outline-offset:2px;
}

@media(max-width:600px){

    .header{
        padding:13px 15px;
    }

    .header-title{
        font-size:20px;
    }

    .ticket-types{
        gap:3px;
        padding:4px;
    }

    .ticket-type{
        min-height:57px;
        font-size:9px;
    }

    .ticket-type i{
        font-size:17px;
    }

    .search-section{
        padding:15px;
    }

    .search-row{
        gap:8px;
    }

    .city{
        font-size:18px;
    }

    .route{
        grid-template-columns:1fr 54px 1fr;
    }
}

@media(max-width:420px){

    .ticket-type{
        min-height:53px;
        font-size:8px;
    }

    .ticket-type i{
        font-size:15px;
    }

    .ticket-card{
        padding:14px;
    }

    .price{
        font-size:19px;
    }

    .provider-name{
        font-size:14px;
    }
}

@media(max-width:360px){

    .ticket-types{
        grid-template-columns:repeat(3,1fr);
        row-gap:4px;
    }

    .ticket-type{
        font-size:9px;
    }

    .search-row{
        grid-template-columns:1fr;
    }

    .route{
        grid-template-columns:1fr 45px 1fr;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-button"
            type="button"
            aria-label="Back"
        >
            <i class="fas fa-arrow-left"></i>
        </button>

        <h1
            id="pageTitle"
            class="header-title"
        >
            Tickets
        </h1>

    </div>

    <div class="header-right">

        <button
            id="notificationButton"
            class="header-button"
            type="button"
            aria-label="Notifications"
        >
            <i class="fas fa-bell"></i>
        </button>

        <button
            id="profileButton"
            class="header-button"
            type="button"
            aria-label="Profile"
        >
            <i class="fas fa-user"></i>
        </button>

    </div>

</header>

<div class="demo-notice">

    <i class="fas fa-flask"></i>

    <div>
        <strong>HAVKAR Tickets</strong><br>
        Search and booking infrastructure is being prepared.
        Current results are demo data only.
        Real availability, prices and booking will be connected
        through approved travel partner APIs.
    </div>

</div>

<div class="ticket-types">

    <button
        class="ticket-type active"
        data-type="flight"
        type="button"
    >
        <i class="fas fa-plane"></i>
        <span>Flight</span>
    </button>

    <button
        class="ticket-type"
        data-type="train"
        type="button"
    >
        <i class="fas fa-train"></i>
        <span>Train</span>
    </button>

    <button
        class="ticket-type"
        data-type="bus"
        type="button"
    >
        <i class="fas fa-bus"></i>
        <span>Bus</span>
    </button>

    <button
        class="ticket-type"
        data-type="ferry"
        type="button"
    >
        <i class="fas fa-ship"></i>
        <span>Ferry</span>
    </button>

    <button
        class="ticket-type"
        data-type="taxi"
        type="button"
    >
        <i class="fas fa-taxi"></i>
        <span>Taxi</span>
    </button>

    <button
        class="ticket-type"
        data-type="transfer"
        type="button"
    >
        <i class="fas fa-van-shuttle"></i>
        <span>Transfer</span>
    </button>

</div>

<section class="search-section">

    <div class="search-heading">

        <i
            id="searchTypeIcon"
            class="fas fa-plane"
        ></i>

        <span id="searchHeadingText">
            Search Flights
        </span>

    </div>

    <div class="search-row">

        <div class="input-wrap">

            <i class="fas fa-location-dot"></i>

            <input
                id="fromInput"
                class="search-input"
                type="text"
                value="Rome"
                placeholder="From"
                autocomplete="off"
            >

        </div>

        <div class="input-wrap">

            <i class="fas fa-location-dot"></i>

            <input
                id="toInput"
                class="search-input"
                type="text"
                value="Milan"
                placeholder="To"
                autocomplete="off"
            >

        </div>

    </div>

    <div class="swap-row">

        <button
            id="swapButton"
            class="swap-button"
            type="button"
            aria-label="Swap locations"
        >
            <i class="fas fa-right-left"></i>
        </button>

        <button
            id="filterButton"
            class="filter-button"
            type="button"
        >
            <i class="fas fa-sliders"></i>
            Filters
        </button>

    </div>

    <div class="search-row">

        <div class="input-wrap">

            <i class="fas fa-calendar"></i>

            <input
                id="dateInput"
                class="search-input"
                type="date"
                aria-label="Travel date"
            >

        </div>

        <div class="input-wrap">

            <i class="fas fa-user"></i>

            <input
                id="passengersInput"
                class="search-input"
                type="number"
                min="1"
                max="9"
                value="1"
                inputmode="numeric"
                aria-label="Passengers"
            >

        </div>

    </div>

    <div
        id="transferExtra"
        style="display:none;margin-bottom:10px;"
    >

        <div class="input-wrap">

            <i class="fas fa-clock"></i>

            <input
                id="timeInput"
                class="search-input"
                type="time"
                aria-label="Pickup time"
            >

        </div>

    </div>

    <div
        id="extraFilters"
        class="extra-filters"
    >

        <div class="select-wrap">

            <label for="stopsSelect">
                Stops
            </label>

            <select
                id="stopsSelect"
                class="select-input"
            >

                <option value="any">Any</option>
                <option value="direct">Direct only</option>
                <option value="one">Up to 1 stop</option>

            </select>

        </div>

        <div class="select-wrap">

            <label for="sortSelect">
                Sort by
            </label>

            <select
                id="sortSelect"
                class="select-input"
            >

                <option value="recommended">Recommended</option>
                <option value="price">Lowest price</option>
                <option value="duration">Shortest trip</option>
                <option value="departure">Earliest departure</option>

            </select>

        </div>

    </div>

    <button
        id="searchButton"
        class="search-button"
        type="button"
    >

        <i class="fas fa-search"></i>

        <span id="searchButtonText">
            Search Flights
        </span>

    </button>

</section>

<main class="content">

    <div class="results-header">

        <div
            id="resultsTitle"
            class="results-title"
        >
            Available Demo Flights
        </div>

        <div
            id="resultCount"
            class="result-count"
        >
            0 results
        </div>

    </div>

    <div id="resultsContainer"></div>

</main>

<nav class="bottom-nav">

    <div
        id="homeNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-home"></i>
        <span>Home</span>
    </div>

    <div
        id="searchNav"
        class="nav-item active"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-search"></i>
        <span>Search</span>
    </div>

    <div
        id="ticketsNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-ticket"></i>
        <span>Tickets</span>
    </div>

    <div
        id="alertsNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-bell"></i>
        <span>Alerts</span>
    </div>

    <div
        id="profileNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-user"></i>
        <span>Profile</span>
    </div>

</nav>

<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>

function $(id){
    return document.getElementById(id);
}

function normalize(value){
    return String(value || "")
        .trim()
        .toLowerCase();
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function timeToMinutes(time){

    const match =
        String(time || "").match(
            /(\d+):(\d+)\s*(AM|PM)/i
        );

    if(!match){
        return 0;
    }

    let hour = Number(match[1]);
    const minute = Number(match[2]);
    const period = match[3].toUpperCase();

    if(period === "PM" && hour !== 12){
        hour += 12;
    }

    if(period === "AM" && hour === 12){
        hour = 0;
    }

    return hour * 60 + minute;
}

function setToday(){

    const input = $("dateInput");

    if(!input){
        return;
    }

    const today = new Date();

    const year = today.getFullYear();

    const month =
        String(today.getMonth() + 1)
            .padStart(2,"0");

    const day =
        String(today.getDate())
            .padStart(2,"0");

    input.value =
        `${year}-${month}-${day}`;
}

function getCurrentData(){

    return ticketData[currentType] || [];

}

function routeMatches(){

    const from =
        normalize($("fromInput")?.value);

    const to =
        normalize($("toInput")?.value);

    if(!from || !to){
        return false;
    }

    if(currentType === "transfer"){

        return (
            from.includes("rome") &&
            (
                to.includes("rome") ||
                to.includes("city")
            )
        );
    }

    if(currentType === "ferry"){

        return (
            (
                from.includes("naples") &&
                (
                    to.includes("palermo") ||
                    to.includes("capri")
                )
            ) ||
            (
                to.includes("naples") &&
                (
                    from.includes("palermo") ||
                    from.includes("capri")
                )
            )
        );
    }

    return (
        from === "rome" &&
        to === "milan"
    );
}

function getFilteredResults(){

    if(!routeMatches()){
        return [];
    }

    let results =
        getCurrentData().map(item => ({
            ...item
        }));

    const stopFilter =
        $("stopsSelect")?.value || "any";

    if(stopFilter === "direct"){

        results =
            results.filter(
                item => item.stops === 0
            );
    }

    if(stopFilter === "one"){

        results =
            results.filter(
                item => item.stops <= 1
            );
    }

    const sort =
        $("sortSelect")?.value ||
        "recommended";

    if(sort === "price"){

        results.sort(
            (a,b) => a.price - b.price
        );

    }else if(sort === "duration"){

        results.sort(
            (a,b) =>
                a.durationMinutes -
                b.durationMinutes
        );

    }else if(sort === "departure"){

        results.sort(
            (a,b) =>
                timeToMinutes(a.fromTime) -
                timeToMinutes(b.fromTime)
        );

    }else{

        results.sort((a,b) => {

            const scoreA =
                a.price +
                a.durationMinutes * 0.08 +
                a.stops * 15;

            const scoreB =
                b.price +
                b.durationMinutes * 0.08 +
                b.stops * 15;

            return scoreA - scoreB;
        });
    }

    return results;
}

function performSearch(){

    clearTimeout(searchTimer);

    const container =
        $("resultsContainer");

    if(!container){
        return;
    }

    container.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Searching demo ${escapeHtml(currentType)} services...
            </div>

        </div>
    `;

    searchTimer =
        setTimeout(() => {

            currentResults =
                getFilteredResults();

            renderResults();

        },220);
}

function renderResults(){

    const container =
        $("resultsContainer");

    const count =
        $("resultCount");

    if(!container){
        return;
    }

    if(count){

        count.textContent =
            `${currentResults.length} demo results`;
    }

    if(currentResults.length === 0){

        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">

                    <i class="fas ${
                        routeMatches()
                            ? "fa-search"
                            : "fa-location-dot"
                    }"></i>

                </div>

                <h3>
                    ${
                        routeMatches()
                            ? "No demo results"
                            : "Enter a supported demo route"
                    }
                </h3>

                <p>
                    ${
                        routeMatches()
                            ? "There are currently no prepared demo services for this search."
                            : getRouteHelpText()
                    }
                </p>

            </div>
        `;

        return;
    }

    container.innerHTML =
        currentResults
            .map(item => createTicketCard(item))
            .join("");
}

function getRouteHelpText(){

    if(currentType === "ferry"){

        return "Demo Ferry routes: Naples → Palermo, Naples → Capri, or the reverse.";

    }

    if(currentType === "transfer"){

        return "Demo Transfer route: Rome Airport → Rome City.";

    }

    return "Demo routes currently use Rome → Milan. Real partner API routes will replace these demo routes later.";
}

function setTicketType(type){

    if(!ticketConfig[type]){
        return;
    }

    currentType = type;

    const config =
        ticketConfig[type];

    document
        .querySelectorAll(".ticket-type")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.type === type
            );

        });

    $("pageTitle").textContent =
        config.title;

    $("searchTypeIcon").className =
        `fas ${config.icon}`;

    $("searchHeadingText").textContent =
        config.searchTitle;

    $("searchButtonText").textContent =
        config.button;

    $("resultsTitle").textContent =
        config.results;

    const transferExtra =
        $("transferExtra");

    if(transferExtra){

        transferExtra.style.display =
            type === "transfer"
                ? "block"
                : "none";
    }

    const filterButton =
        $("filterButton");

    if(filterButton){

        filterButton.style.display =
            (
                type === "taxi" ||
                type === "transfer"
            )
                ? "none"
                : "block";
    }

    if(
        type === "taxi" ||
        type === "transfer"
    ){

        $("extraFilters")
            ?.classList.remove("show");
    }

    if(type === "ferry"){

        $("fromInput").value =
            "Naples";

        $("toInput").value =
            "Palermo";

    }else if(type === "transfer"){

        $("fromInput").value =
            "Rome Airport";

        $("toInput").value =
            "Rome City";

    }else{

        $("fromInput").value =
            "Rome";

        $("toInput").value =
            "Milan";
    }

    currentResults = [];

    performSearch();
}

function swapLocations(){

    const from =
        $("fromInput");

    const to =
        $("toInput");

    if(!from || !to){
        return;
    }

    const temporary =
        from.value;

    from.value =
        to.value;

    to.value =
        temporary;

    performSearch();
}

function toggleFilters(){

    const filters =
        $("extraFilters");

    if(!filters){
        return;
    }

    filters.classList.toggle("show");
}

function showToast(message){

    const toast =
        $("toast");

    if(!toast){
        return;
    }

    toast.textContent =
        String(message);

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },2300);
}

function goHome(){
    window.location.href = "index.html";
}

function goProfile(){
    window.location.href = "profile.html";
}

function goNotifications(){
    window.location.href = "notifications.html";
}

function goTickets(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function setupEnterSearch(elementId){

    const element =
        $(elementId);

    if(!element){
        return;
    }

    element.addEventListener(
        "keydown",
        event => {

            if(event.key === "Enter"){

                event.preventDefault();

                performSearch();
            }
        }
    );
}

function initializeHAVKAR(){

    setToday();

    document
        .querySelectorAll(".ticket-type")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    setTicketType(
                        button.dataset.type
                    );

                }
            );

        });

    $("searchButton")
        ?.addEventListener(
            "click",
            performSearch
        );

    $("swapButton")
        ?.addEventListener(
            "click",
            swapLocations
        );

    $("filterButton")
        ?.addEventListener(
            "click",
            toggleFilters
        );

    $("stopsSelect")
        ?.addEventListener(
            "change",
            performSearch
        );

    $("sortSelect")
        ?.addEventListener(
            "change",
            performSearch
        );

    $("dateInput")
        ?.addEventListener(
            "change",
            performSearch
        );

    $("passengersInput")
        ?.addEventListener(
            "change",
            () => {

                const input =
                    $("passengersInput");

                if(!input){
                    return;
                }

                let value =
                    Number(input.value);

                if(
                    !Number.isFinite(value) ||
                    value < 1
                ){
                    value = 1;
                }

                if(value > 9){
                    value = 9;
                }

                input.value = value;
            }
        );

    setupEnterSearch("fromInput");
    setupEnterSearch("toInput");

    $("backButton")
        ?.addEventListener(
            "click",
            goHome
        );

    $("notificationButton")
        ?.addEventListener(
            "click",
            goNotifications
        );

    $("profileButton")
        ?.addEventListener(
            "click",
            goProfile
        );

    $("homeNav")
        ?.addEventListener(
            "click",
            goHome
        );

    $("searchNav")
        ?.addEventListener(
            "click",
            () => {

                document
                    .querySelector(".search-section")
                    ?.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });
            }
        );

    $("ticketsNav")
        ?.addEventListener(
            "click",
            goTickets
        );

    $("alertsNav")
        ?.addEventListener(
            "click",
            goNotifications
        );

    $("profileNav")
        ?.addEventListener(
            "click",
            goProfile
        );

    setTicketType("flight");
}

if(document.readyState === "loading"){

    document.addEventListener(
        "DOMContentLoaded",
        initializeHAVKAR,
        {once:true}
    );

}else{

    initializeHAVKAR();
