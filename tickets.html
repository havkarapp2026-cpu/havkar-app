/* =========================================================

========================================================= */

function $(id) {
    return document.getElementById(id);
}


/* =========================================================
   HELPERS
========================================================= */

function getTypeName(type) {

    if (type === "flight") return "Flights";
    if (type === "train") return "Trains";
    return "Buses";
}


function normalize(value) {

    return String(value || "")
        .trim()
        .toLowerCase();

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function timeToMinutes(time) {

    const match = String(time || "").match(
        /(\d+):(\d+)\s*(AM|PM)/i
    );

    if (!match) return 0;

    let hour = Number(match[1]);
    const minute = Number(match[2]);
    const period = match[3].toUpperCase();

    if (period === "PM" && hour !== 12) {
        hour += 12;
    }

    if (period === "AM" && hour === 12) {
        hour = 0;
    }

    return hour * 60 + minute;

}


/* =========================================================
   TODAY
========================================================= */

function setToday() {

    const dateInput = $("dateInput");

    if (!dateInput) return;

    const today = new Date();

    const year = today.getFullYear();

    const month = String(
        today.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        today.getDate()
    ).padStart(2, "0");

    dateInput.value =
        `${year}-${month}-${day}`;

}


/* =========================================================
   TYPE CHANGE
========================================================= */

function changeType(type) {

    if (!ticketData[type]) return;

    currentType = type;

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.type === type
            );

        });

    const name = getTypeName(type);

    if ($("pageTitle")) {
        $("pageTitle").textContent =
            name + " Tickets";
    }

    if ($("resultsTitle")) {
        $("resultsTitle").textContent =
            "Available " + name;
    }

    if ($("searchButtonText")) {
        $("searchButtonText").textContent =
            "Search " + name;
    }

    searchTickets(false);

}


/* =========================================================
   SEARCH
========================================================= */

function searchTickets(showMessage = true) {

    const fromInput = $("fromInput");
    const toInput = $("toInput");
    const dateInput = $("dateInput");
    const passengersInput = $("passengersInput");

    if (
        !fromInput ||
        !toInput ||
        !dateInput ||
        !passengersInput
    ) {
        console.error(
            "HAVKAR: Search elements not found."
        );
        return;
    }

    const from = normalize(
        fromInput.value
    );

    const to = normalize(
        toInput.value
    );

    const date = dateInput.value;

    let passengers =
        Number(passengersInput.value);

    if (!passengers || passengers < 1) {
        passengers = 1;
    }

    if (passengers > 9) {
        passengers = 9;
    }

    passengersInput.value = passengers;


    /* -----------------------------------------
       VALIDATION
    ----------------------------------------- */

    if (!from || !to) {

        currentResults = [];

        if ($("resultCount")) {
            $("resultCount").textContent =
                "0 results";
        }

        if ($("resultsContainer")) {
            $("resultsContainer").innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        <i class="fas fa-location-dot"></i>
                    </div>

                    <h3>Enter your route</h3>

                    <p>
                        Please enter both origin
                        and destination.
                    </p>

                </div>

            `;
        }

        return;
    }


    /* -----------------------------------------
       CANCEL PREVIOUS SEARCH
    ----------------------------------------- */

    clearTimeout(searchTimer);


    /* -----------------------------------------
       LOADING
    ----------------------------------------- */

    if ($("resultsContainer")) {

        $("resultsContainer").innerHTML = `

            <div class="loading"
                 style="
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    padding:40px;
                    gap:10px;
                 ">

                <i
                    class="fas fa-spinner fa-spin"
                    style="
                        color:#7cb342;
                        font-size:22px;
                    ">
                </i>

                <span>
                    Searching...
                </span>

            </div>

        `;
    }


    /* -----------------------------------------
       SEARCH
    ----------------------------------------- */

    searchTimer = setTimeout(() => {

        let results =
            (ticketData[currentType] || [])
                .filter(ticket => {

                    const ticketFrom =
                        normalize(ticket.from);

                    const ticketTo =
                        normalize(ticket.to);

                    return (
                        ticketFrom === from &&
                        ticketTo === to
                    );

                });


        /* -----------------------------------------
           STOPS FILTER
        ----------------------------------------- */

        const stopsSelect =
            $("stopsSelect");

        const stopFilter =
            stopsSelect
                ? stopsSelect.value
                : "all";


        if (stopFilter === "direct") {

            results =
                results.filter(
                    ticket =>
                        ticket.stops === 0
                );

        }


        if (stopFilter === "one") {

            results =
                results.filter(
                    ticket =>
                        ticket.stops <= 1
                );

        }


        /* -----------------------------------------
           SORT
        ----------------------------------------- */

        const sortSelect =
            $("sortSelect");

        const sort =
            sortSelect
                ? sortSelect.value
                : "recommended";


        if (sort === "price") {

            results.sort(
                (a, b) =>
                    a.price - b.price
            );

        }

        else if (sort === "duration") {

            results.sort(
                (a, b) =>
                    a.durationMinutes -
                    b.durationMinutes
            );

        }

        else if (sort === "departure") {

            results.sort(
                (a, b) =>
                    timeToMinutes(a.fromTime) -
                    timeToMinutes(b.fromTime)
            );

        }

        else {

            /* Recommended */

            results.sort((a, b) => {

                const scoreA =
                    a.price +
                    (a.durationMinutes * 0.08) +
                    (a.stops * 15);

                const scoreB =
                    b.price +
                    (b.durationMinutes * 0.08) +
                    (b.stops * 15);

                return scoreA - scoreB;

            });

        }


        /* -----------------------------------------
           STORE RESULTS
        ----------------------------------------- */

        currentResults =
            results.map(ticket => ({
                ...ticket,
                selectedDate: date
            }));


        /* -----------------------------------------
           RENDER
        ----------------------------------------- */

        renderResults();


        /* -----------------------------------------
           MESSAGE
        ----------------------------------------- */

        if (showMessage) {

            if (currentResults.length > 0) {

                showToast(
                    currentResults.length +
                    " " +
                    getTypeName(currentType)
                        .toLowerCase() +
                    " found"
                );

            }

            else {

                showToast(
                    "No tickets found"
                );

            }

        }

    }, 300);

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults() {

    const resultCount =
        $("resultCount");

    if (!container) return;

    if (resultCount) {

        resultCount.textContent =
            currentResults.length +

    }


    if (currentResults.length === 0) {

        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    <i class="fas fa-ticket"></i>
                </div>

                <h3>No results found</h3>

                <p>
                    Try another route,
                    date or filter.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        currentResults
            .map(
                (ticket, index) =>
                    createTicketCard(
                        ticket,
                        index
                    )
            )
            .join("");

}

/* =========================================================
   BOOKING
========================================================= */

function openBooking(index) {

    selectedTicket =
        currentResults[index];


    if (!selectedTicket) {

        showToast(
            "Ticket not found."
        );

        return;
    }


    const fields = {

        summaryProvider:
            selectedTicket.provider,

        summaryCode:
            selectedTicket.code,

        summaryPrice:
            "€" +
            Number(
                selectedTicket.price
            ).toFixed(2),

        summaryFrom:
            selectedTicket.from,

        summaryTo:
            selectedTicket.to,

        summaryFromTime:
            selectedTicket.fromTime,

        summaryToTime:
            selectedTicket.toTime

    };


    Object.keys(fields)
        .forEach(id => {

            if ($(id)) {

                $(id).textContent =
                    fields[id];

            }

        });


    updateTotal();


    if ($("bookingModal")) {

        $("bookingModal")
            .classList
            .add("show");

    }

}


/* =========================================================
   TOTAL
========================================================= */

function updateTotal() {

    if (!selectedTicket) return;

    const passengersInput =
        $("passengersInput");

    const totalPrice =
        $("totalPrice");

    if (!passengersInput || !totalPrice) {
        return;
    }


    let passengers =
        Number(
            passengersInput.value
        );


    if (!passengers || passengers < 1) {
        passengers = 1;
    }

    if (passengers > 9) {
        passengers = 9;
    }


    passengersInput.value =
        passengers;


    totalPrice.textContent =
        "€" +
        (
            selectedTicket.price *
            passengers
        ).toFixed(2);

}


/* =========================================================
   CLOSE BOOKING
========================================================= */

function closeBooking() {

    if ($("bookingModal")) {

        $("bookingModal")
            .classList
            .remove("show");

    }

}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function getSavedTickets() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {
            return [];
        }


        const tickets =
            JSON.parse(saved);


        return Array.isArray(tickets)
            ? tickets
            : [];

    }

    catch (error) {

        console.error(
            "HAVKAR storage error:",
            error
        );

        return [];

    }

}


/* =========================================================
   BOOKING CODE
========================================================= */

function generateBookingCode() {

    const random =
        Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();


    return "HAV-" + random;

}


/* =========================================================
   CONFIRM BOOKING
========================================================= */

function confirmBooking(event) {

    if (event) {
        event.preventDefault();
    }


    if (!selectedTicket) {

        showToast(
            "No ticket selected."
        );

        return;
    }


    const passengersInput =
        $("passengersInput");


    const passengers =
        Math.max(
            1,
            Math.min(
                9,
                Number(
                    passengersInput
                        ? passengersInput.value
                        : 1
                ) || 1
            )
        );


    const bookingCode =
        generateBookingCode();


    const valueOf = id => {

        const element = $(id);

        return element
            ? element.value.trim()
            : "";

    };


    const booking = {

        id: Date.now(),

        bookingCode:

            bookingCode,

        bookedAt:

            new Date()
                .toISOString(),

        type:

            selectedTicket.type,

        typeName:

            getTypeName(
                selectedTicket.type
            ),

        provider:

            selectedTicket.provider,

        code:

            selectedTicket.code,

        from:

            selectedTicket.from,

        to:

            selectedTicket.to,

        fromTime:

            selectedTicket.fromTime,

        toTime:

            selectedTicket.toTime,

        duration:

            selectedTicket.duration,

        price:

            selectedTicket.price,

        passengers:

            passengers,

        total:

            selectedTicket.price *
            passengers,

        firstName:

            valueOf("firstName"),

        lastName:

            valueOf("lastName"),

        email:

            valueOf("email"),

        phone:

            valueOf("phone"),

        document:

            valueOf("document"),

        travelDate:

            $("dateInput")
                ? $("dateInput").value
                : ""

    };


    const tickets =
        getSavedTickets();


    tickets.unshift(
        booking
    );


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(tickets)
        );

    }

    catch (error) {

        console.error(
            "HAVKAR save error:",
            error
        );

        showToast(
            "Unable to save ticket."
        );

        return;

    }


    closeBooking();


    if ($("successBookingCode")) {

        $("successBookingCode")
            .textContent =
            bookingCode;

    }


    if ($("successModal")) {

        $("successModal")
            .classList
            .add("show");

    }


    if ($("bookingForm")) {

        $("bookingForm").reset();

    }


    if (passengersInput) {

        passengersInput.value =
            passengers;

    }


    selectedTicket = null;

}

========================================================= */

    const tickets =
        getSavedTickets();


    if ($("pageTitle")) {

            .textContent =

    if ($("resultsTitle")) {

        $("resultsTitle")

    if ($("resultCount")) {

        $("resultCount")
            .textContent =
            tickets.length +
            " saved";

    }


    document
        .querySelectorAll(".tab")
        .forEach(tab =>
            tab.classList.remove(
                "active"
            )
        );


    if (tickets.length === 0) {

        if ($("resultsContainer")) {

            $("resultsContainer")
                .innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">

                            <i class="fas fa-ticket"></i>

                        <p>
                            Your confirmed bookings
                            will appear here.
                        </p>

                    </div>

        }

        return;
    }


    if ($("resultsContainer")) {

        $("resultsContainer")
            .innerHTML =

            tickets
                .map(ticket =>
                    createMyTicket(ticket)
                )
                .join("");

    }

}

                    <strong>

                        ${escapeHtml(
                            ticket.bookingCode
                        )}

                    </strong>

                </div>


                <div class="detail">

                    Passengers

                    <strong>

                        ${Number(
                            ticket.passengers || 1
                        )}

                    </strong>

                </div>


                <div class="detail">

                    Passenger

                    <strong>

                        ${escapeHtml(
                            ticket.firstName
                        )}

                        ${escapeHtml(
                            ticket.lastName
                        )}

                    </strong>

                </div>


                <div class="detail">

                    Duration

                    <strong>

                        ${escapeHtml(
                            ticket.duration
                        )}

                    </strong>

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   DELETE TICKET
========================================================= */

function deleteTicket(id) {

    if (!confirm(
        "Delete this ticket?"
    )) {
        return;
    }


    const tickets =
        getSavedTickets()
            .filter(
                ticket =>
                    String(ticket.id) !==
                    String(id)
            );


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(tickets)
        );

    }

    catch (error) {

        console.error(
            "HAVKAR delete error:",
            error
        );

        showToast(
            "Unable to delete ticket."
        );

        return;

    }


    showToast(
        "Ticket deleted."
    );


    showMyTickets();

}


/* =========================================================
   SUCCESS MODAL
========================================================= */

function closeSuccess() {

    if ($("successModal")) {

        $("successModal")
            .classList
            .remove("show");

    }

}


/* =========================================================
   SWAP LOCATIONS
========================================================= */

function swapLocations() {

    const from = $("fromInput");
    const to = $("toInput");

    if (!from || !to) {
        return;
    }


    const temporary =
        from.value;


    from.value =
        to.value;


    to.value =
        temporary;


    searchTickets(false);

}


/* =========================================================
   FILTERS
========================================================= */

function toggleFilters() {

    const filters =
        $("extraFilters");

    if (!filters) {
        return;
    }


    filters.classList.toggle(
        "show"
    );

}


/* =========================================================
   BOTTOM SEARCH
========================================================= */

function focusSearch() {

    const section =
        $("searchSection");

    if (section) {

        section.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    setTimeout(() => {

        const from =
            $("fromInput");

        if (from) {
            from.focus();
        }

    }, 350);

}


/* =========================================================
   HOME
========================================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        $("toast");

    if (!toast) {
        return;
    }


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        }, 2500);

}


/* =========================================================
   SAFE EVENT LISTENER
========================================================= */

function on(id, event, handler) {

    const element = $(id);

    if (!element) {
        console.warn(
            "HAVKAR: Element not found ->",
            id
        );
        return;
    }


    element.addEventListener(
        event,
        handler
    );

}


/* =========================================================
   INITIALIZATION
   IMPORTANT:
   EVERYTHING STARTS AFTER DOM IS READY
========================================================= */

function initializeHAVKARTickets() {

    /* -----------------------------------------
       TODAY
    ----------------------------------------- */

    setToday();


    /* -----------------------------------------
       PASSENGERS
    ----------------------------------------- */

    on(
        "passengersInput",
        "input",
        updateTotal
    );

    on(
        "passengersInput",
        "change",
        updateTotal
    );


    /* -----------------------------------------
       FILTERS
    ----------------------------------------- */

    on(
        "stopsSelect",
        "change",
        () => searchTickets(false)
    );


    on(
        "sortSelect",
        "change",
        () => searchTickets(false)
    );


    /* -----------------------------------------
       ENTER SEARCH
    ----------------------------------------- */

    on(
        "fromInput",
        "keydown",
        event => {

            if (event.key === "Enter") {

                event.preventDefault();

                searchTickets(true);

            }

        }
    );


    on(
        "toInput",
        "keydown",
        event => {

            if (event.key === "Enter") {

                event.preventDefault();

                searchTickets(true);

            }

        }
    );


    /* -----------------------------------------
       DATE
    ----------------------------------------- */

    on(
        "dateInput",
        "change",
        () => searchTickets(false)
    );


    /* -----------------------------------------
       MAIN SEARCH BUTTON
    ----------------------------------------- */

    on(
        "searchBtn",
        "click",
        () => searchTickets(true)
    );


    /* -----------------------------------------
       TABS
    ----------------------------------------- */

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.addEventListener(
                "click",
                () => {

                    changeType(
                        tab.dataset.type
                    );

                }
            );

        });


    /* -----------------------------------------
       HEADER
    ----------------------------------------- */

    on(
        "backBtn",
        "click",
        goHome
    );


    on(
        "notificationBtn",
        "click",
        () =>
            showToast(
                "Notifications"
            )
    );


    on(
        "profileBtn",
        "click",
        () =>
            showToast(
                "Profile"
            )
    );


    /* -----------------------------------------
       SWAP
    ----------------------------------------- */

    on(
        "swapBtn",
        "click",
        swapLocations
    );


    /* -----------------------------------------
       FILTER TOGGLE
    ----------------------------------------- */

    on(
        "filterToggle",
        "click",
        toggleFilters
    );


    /* -----------------------------------------
       BOTTOM NAVIGATION
    ----------------------------------------- */

    on(
        "homeNav",
        "click",
        goHome
    );


    on(
        "searchNav",
        "click",
        focusSearch
    );


    on(
        "ticketsNav",
        "click",
        showMyTickets
    );


    on(
        "alertsNav",
        "click",
        () =>
            showToast(
                "Alerts"
            )
    );


    on(
        "profileNav",
        "click",
        () =>
            showToast(
                "Profile"
            )
    );


    /* -----------------------------------------
       BOOKING FORM
    ----------------------------------------- */

    on(
        "bookingForm",
        "submit",
        confirmBooking
    );


    on(
        "closeBooking",
        "click",
        closeBooking
    );


    on(
        "closeSuccess",
        "click",
        closeSuccess
    );


    on(
        "viewTicketsBtn",
        "click",
        () => {

            closeSuccess();

            showMyTickets();

        }
    );


    /* -----------------------------------------
       MODAL BACKDROP
    ----------------------------------------- */

    on(
        "bookingModal",
        "click",
        event => {

            if (
                event.target ===
                event.currentTarget
            ) {

                closeBooking();

            }

        }
    );


    on(
        "successModal",
        "click",
        event => {

            if (
                event.target ===
                event.currentTarget
            ) {

                closeSuccess();

            }

        }
    );


    /* -----------------------------------------
       ESC KEY
    ----------------------------------------- */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                closeBooking();

                closeSuccess();

            }

        }
    );


    /* -----------------------------------------
       FIRST SEARCH
    ----------------------------------------- */

    searchTickets(false);

}


/* =========================================================
   START ONLY WHEN DOM IS READY
========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initializeHAVKARTickets,
        {
            once: true
        }
    );

}

else {

    initializeHAVKARTickets();

}

</script>
