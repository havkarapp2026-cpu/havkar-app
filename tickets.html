/* =========================================================
   HELPERS
========================================================= */

function getTypeName(type){

    if(type === "flight") return "Flights";

    if(type === "train") return "Trains";

    return "Buses";
}


function normalize(value){

    return String(value || "")
        .trim()
        .toLowerCase();

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function timeToMinutes(time){

    const match =
        String(time).match(
            /(\d+):(\d+)\s*(AM|PM)/i
        );

    if(!match) return 0;

    let hour = Number(match[1]);

    const minute = Number(match[2]);

    const period = match[3].toUpperCase();

    if(period === "PM" && hour !== 12){

        hour += 12;

    }

    if(period === "AM" && hour === 12){

        hour = 0;

    }

    return hour * 60 + minute;

}

/* =========================================================
   REAL SEARCH
========================================================= */

function searchTickets(showMessage = true){

    const fromInput =
        document.getElementById("fromInput");

    const toInput =
        document.getElementById("toInput");

    const dateInput =
        document.getElementById("dateInput");

    const passengersInput =
        document.getElementById("passengersInput");


    const from =
        normalize(fromInput.value);

    const to =
        normalize(toInput.value);

    const date =
        dateInput.value;


    let passengers =
        Number(passengersInput.value);


    if(!passengers || passengers < 1){

        passengers = 1;

    }


    if(passengers > 9){

        passengers = 9;

    }


    passengersInput.value = passengers;


    /* -----------------------------------------
       VALIDATION
    ----------------------------------------- */

    if(!from || !to){

        currentResults = [];

        document.getElementById("resultCount")
            .textContent = "0 results";


        document.getElementById("resultsContainer")
            .innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        <i class="fas fa-location-dot"></i>
                    </div>

                    <h3>Enter your route</h3>

                    <p>
                        Please enter both origin and destination.
                    </p>

                </div>

            `;

        return;

    }


    /* -----------------------------------------
       SHOW LOADING
    ----------------------------------------- */

    document.getElementById("resultsContainer")
        .innerHTML = `

            <div class="loading"
                 style="
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    padding:40px;
                    gap:10px;
                 ">

                <i
                    class="fas fa-spinner fa-spin"
                    style="
                        color:#7cb342;
                        font-size:22px;
                    ">
                </i>

                <span>
                    Searching...
                </span>

            </div>

        `;


    /* -----------------------------------------
       SEARCH DELAY
       Makes UI feel realistic
    ----------------------------------------- */

    setTimeout(() => {

        let results =
            ticketData[currentType].filter(ticket => {

                const ticketFrom =
                    normalize(ticket.from);

                const ticketTo =
                    normalize(ticket.to);


                return (
                    ticketFrom === from &&
                    ticketTo === to
                );

            });


        /* -----------------------------------------
           STOPS FILTER
        ----------------------------------------- */

        const stopFilter =
            document.getElementById("stopsSelect")
                .value;


        if(stopFilter === "direct"){

            results =
                results.filter(
                    ticket => ticket.stops === 0
                );

        }


        if(stopFilter === "one"){

            results =
                results.filter(
                    ticket => ticket.stops <= 1
                );

        }


        /* -----------------------------------------
           SORT
        ----------------------------------------- */

        const sort =
            document.getElementById("sortSelect")
                .value;


        if(sort === "price"){

            results.sort(
                (a,b) => a.price - b.price
            );

        }


        else if(sort === "duration"){

            results.sort(
                (a,b) =>
                    a.durationMinutes -
                    b.durationMinutes
            );

        }


        else if(sort === "departure"){

            results.sort(
                (a,b) =>
                    timeToMinutes(a.fromTime) -
                    timeToMinutes(b.fromTime)
            );

        }


        else{

            /* Recommended */

            results.sort((a,b) => {

                const scoreA =
                    a.price +
                    (a.durationMinutes * 0.08) +
                    (a.stops * 15);


                const scoreB =
                    b.price +
                    (b.durationMinutes * 0.08) +
                    (b.stops * 15);


                return scoreA - scoreB;

            });

        }


        /* -----------------------------------------
           STORE RESULTS
        ----------------------------------------- */

        currentResults =
            results.map(ticket => ({
                ...ticket,
                selectedDate: date
            }));


        /* -----------------------------------------
           RENDER
        ----------------------------------------- */

        renderResults();


        /* -----------------------------------------
           MESSAGE
        ----------------------------------------- */

        if(showMessage){

            if(currentResults.length > 0){

                showToast(
                    currentResults.length +
                    " " +
                    getTypeName(currentType)
                        .toLowerCase() +
                    " found"
                );

            }

            else{

                showToast(
                    "No tickets found"
                );

            }

        }

    },300);

}

/* =========================================================
   TOTAL
========================================================= */

function updateTotal(){

    if(!selectedTicket) return;


    let passengers =
        Number(
            document.getElementById(
                "passengersInput"
            ).value
        );


    if(!passengers || passengers < 1){

        passengers = 1;

    }


    if(passengers > 9){

        passengers = 9;

    }


    document.getElementById(
        "totalPrice"
    ).textContent =
        "€" +
        (
            selectedTicket.price *
            passengers
        );

}


/* =========================================================
   CLOSE BOOKING
========================================================= */

function closeBooking(){

    document.getElementById(
        "bookingModal"
    ).classList.remove("show");

}


/* =========================================================
   SAVED TICKETS
========================================================= */

function getSavedTickets(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(!saved){

            return [];

        }


        const tickets =
            JSON.parse(saved);


        return Array.isArray(tickets)
            ? tickets
            : [];

    }

    catch(error){

        console.error(
            "HAVKAR storage error:",
            error
        );

        return [];

    }

}


/* =========================================================
   BOOKING CODE
========================================================= */

function generateBookingCode(){

    const random =
        Math.random()
            .toString(36)
            .substring(2,8)
            .toUpperCase();


    return "HAV-" + random;

}


/* =========================================================
   CONFIRM BOOKING
========================================================= */

function confirmBooking(event){

    event.preventDefault();


    if(!selectedTicket){

        showToast(
            "No ticket selected."
        );

        return;

    }


    const passengers =
        Math.max(
            1,
            Math.min(
                9,
                Number(
                    document.getElementById(
                        "passengersInput"
                    ).value
                ) || 1
            )
        );


    const bookingCode =
        generateBookingCode();


    const booking = {

        id:Date.now(),

        bookingCode:

            bookingCode,

        bookedAt:

            new Date()
                .toISOString(),

        type:

            selectedTicket.type,

        typeName:

            getTypeName(
                selectedTicket.type
            ),

        provider:

            selectedTicket.provider,

        code:

            selectedTicket.code,

        from:

            selectedTicket.from,

        to:

            selectedTicket.to,

        fromTime:

            selectedTicket.fromTime,

        toTime:

            selectedTicket.toTime,

        duration:

            selectedTicket.duration,

        price:

            selectedTicket.price,

        passengers:

            passengers,

        total:

            selectedTicket.price *
            passengers,

        firstName:

            document.getElementById(
                "firstName"
            ).value.trim(),

        lastName:

            document.getElementById(
                "lastName"
            ).value.trim(),

        email:

            document.getElementById(
                "email"
            ).value.trim(),

        phone:

            document.getElementById(
                "phone"
            ).value.trim(),

        document:

            document.getElementById(
                "document"
            ).value.trim(),

        travelDate:

            document.getElementById(
                "dateInput"
            ).value

    };


    const tickets =
        getSavedTickets();


    tickets.unshift(
        booking
    );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(tickets)
    );


    closeBooking();


    document.getElementById(
        "successBookingCode"
    ).textContent =
        bookingCode;


    document.getElementById(
        "successModal"
    ).classList.add("show");


    document.getElementById(
        "bookingForm"
    ).reset();


    document.getElementById(
        "passengersInput"
    ).value = passengers;


    selectedTicket = null;

}

/* =========================================================
   DELETE TICKET
========================================================= */

function deleteTicket(id){

    if(!confirm(
        "Delete this ticket?"
    )){

        return;

    }


    const tickets =
        getSavedTickets()
            .filter(
                ticket =>
                    String(ticket.id) !==
                    String(id)
            );


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(tickets)
    );


    showToast(
        "Ticket deleted."
    );


    showMyTickets();

}

    },350);

}

========================================================= */

function goHome(){

/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2500);

}
