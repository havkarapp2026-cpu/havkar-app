/* =========================================================
   SAFE DOM HELPER
========================================================= */

function $(id) {
    return document.getElementById(id);
}


/* =========================================================
   GENERAL HELPERS
========================================================= */

function getTypeName(type) {

    if (type === "flight") {
        return "Flights";
    }

    if (type === "train") {
        return "Trains";
    }

    return "Buses";
}


function normalize(value) {

    return String(value || "")
        .trim()
        .toLowerCase();

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function timeToMinutes(time) {

    const match = String(time || "").match(
        /(\d+):(\d+)\s*(AM|PM)/i
    );

    if (!match) {
        return 0;
    }

    let hour = Number(match[1]);
    const minute = Number(match[2]);
    const period = match[3].toUpperCase();

    if (period === "PM" && hour !== 12) {
        hour += 12;
    }

    if (period === "AM" && hour === 12) {
        hour = 0;
    }

    return (hour * 60) + minute;
}


/* =========================================================
   TODAY
========================================================= */

function setToday() {

    const dateInput = $("dateInput");

    if (!dateInput) {
        return;
    }

    const today = new Date();

    const year = today.getFullYear();

    const month = String(
        today.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        today.getDate()
    ).padStart(2, "0");

    dateInput.value =
        `${year}-${month}-${day}`;
}


/* =========================================================
   CHANGE TRANSPORT TYPE
========================================================= */

function changeType(type) {

    if (
        type !== "flight" &&
        type !== "train" &&
        type !== "bus"
    ) {
        return;
    }

    currentType = type;

    document.querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.type === type
            );

        });

    const name = getTypeName(type);

    const pageTitle = $("pageTitle");

    if (pageTitle) {
        pageTitle.textContent =
            name + " Tickets";
    }

    const resultsTitle = $("resultsTitle");

    if (resultsTitle) {
        resultsTitle.textContent =
            "Available " + name;
    }

    const searchButtonText =
        $("searchButtonText");

    if (searchButtonText) {
        searchButtonText.textContent =
            "Search " + name;
    }

    searchTickets(false);
}


/* =========================================================
   SEARCH TICKETS
========================================================= */

function searchTickets(showMessage = true) {

    clearTimeout(searchTimer);

    const fromInput = $("fromInput");
    const toInput = $("toInput");
    const dateInput = $("dateInput");
    const passengersInput = $("passengersInput");

    const container = $("resultsContainer");
    const resultCount = $("resultCount");

    if (
        !fromInput ||
        !toInput ||
        !container
    ) {
        console.error(
            "HAVKAR: Search elements not found."
        );

        return;
    }

    const from = normalize(
        fromInput.value
    );

    const to = normalize(
        toInput.value
    );

    const date =
        dateInput
            ? dateInput.value
            : "";

    let passengers =
        passengersInput
            ? Number(passengersInput.value)
            : 1;

    if (!passengers || passengers < 1) {
        passengers = 1;
    }

    if (passengers > 9) {
        passengers = 9;
    }

    if (passengersInput) {
        passengersInput.value =
            passengers;
    }


    /* -----------------------------------------
       ROUTE VALIDATION
    ----------------------------------------- */

    if (!from || !to) {

        currentResults = [];

        if (resultCount) {
            resultCount.textContent =
                "0 results";
        }

        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    <i class="fas fa-location-dot"></i>
                </div>

                <h3>Enter your route</h3>

                <p>
                    Please enter both origin and destination.
                </p>

            </div>

        `;

        return;
    }


    /* -----------------------------------------
       LOADING
    ----------------------------------------- */

    container.innerHTML = `

        <div
            class="loading"
            style="
                display:flex;
                justify-content:center;
                align-items:center;
                padding:40px;
                gap:10px;
            "
        >

            <i
                class="fas fa-spinner fa-spin"
                style="
                    color:#7cb342;
                    font-size:22px;
                "
            ></i>

            <span>
                Searching...
            </span>

        </div>

    `;


    /* -----------------------------------------
       SEARCH
    ----------------------------------------- */

    searchTimer = setTimeout(() => {

        const source =
            Array.isArray(
                ticketData[currentType]
            )
                ? ticketData[currentType]
                : [];


        let results =
            source.filter(ticket => {

                const ticketFrom =
                    normalize(ticket.from);

                const ticketTo =
                    normalize(ticket.to);

                return (
                    ticketFrom === from &&
                    ticketTo === to
                );

            });


        /* -------------------------------------
           STOPS FILTER
        ------------------------------------- */

        const stopsSelect =
            $("stopsSelect");

        const stopFilter =
            stopsSelect
                ? stopsSelect.value
                : "all";


        if (stopFilter === "direct") {

            results =
                results.filter(
                    ticket =>
                        ticket.stops === 0
                );

        }


        if (stopFilter === "one") {

            results =
                results.filter(
                    ticket =>
                        ticket.stops <= 1
                );

        }


        /* -------------------------------------
           SORT
        ------------------------------------- */

        const sortSelect =
            $("sortSelect");

        const sort =
            sortSelect
                ? sortSelect.value
                : "recommended";


        if (sort === "price") {

            results.sort(
                (a, b) =>
                    a.price - b.price
            );

        }

        else if (sort === "duration") {

            results.sort(
                (a, b) =>
                    a.durationMinutes -
                    b.durationMinutes
            );

        }

        else if (sort === "departure") {

            results.sort(
                (a, b) =>
                    timeToMinutes(
                        a.fromTime
                    ) -
                    timeToMinutes(
                        b.fromTime
                    )
            );

        }

        else {

            /* Recommended */

            results.sort((a, b) => {

                const scoreA =
                    a.price +
                    (a.durationMinutes * 0.08) +
                    (a.stops * 15);

                const scoreB =
                    b.price +
                    (b.durationMinutes * 0.08) +
                    (b.stops * 15);

                return scoreA - scoreB;

            });

        }


        /* -------------------------------------
           SAVE RESULTS
        ------------------------------------- */

        currentResults =
            results.map(ticket => ({
                ...ticket,
                selectedDate: date
            }));


        /* -------------------------------------
           RENDER
        ------------------------------------- */

        renderResults();


        /* -------------------------------------
           MESSAGE
        ------------------------------------- */

        if (showMessage) {

            if (currentResults.length > 0) {

                showToast(
                    currentResults.length +
                    " " +
                    getTypeName(currentType)
                        .toLowerCase() +
                    " found"
                );

            }

            else {

                showToast(
                    "No tickets found"
                );

            }

        }

    }, 300);

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults() {

    const container =
        $("resultsContainer");

    const resultCount =
        $("resultCount");

    if (!container) {
        return;
    }

    if (resultCount) {

        resultCount.textContent =
            currentResults.length +
            " results";

    }


    if (currentResults.length === 0) {

        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    <i class="fas fa-ticket"></i>
                </div>

                <h3>No results found</h3>

                <p>
                    Try another route, date or filter.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        currentResults
            .map(
                (ticket, index) =>
                    createTicketCard(
                        ticket,
                        index
                    )
            )
            .join("");

}

/* =========================================================

========================================================= */

    selectedTicket =

        return;
    }

        $("summaryProvider");

    if (summaryProvider) {
        summaryProvider.textContent =
            selectedTicket.provider;
    }


    const summaryCode =
        $("summaryCode");

    if (summaryCode) {
        summaryCode.textContent =
            selectedTicket.code;
    }


    const summaryPrice =
        $("summaryPrice");

    if (summaryPrice) {
        summaryPrice.textContent =
            "€" +
            selectedTicket.price;
    }


    const summaryFrom =
        $("summaryFrom");

    if (summaryFrom) {
        summaryFrom.textContent =
            selectedTicket.from;
    }


    const summaryTo =
        $("summaryTo");

    if (summaryTo) {
        summaryTo.textContent =
            selectedTicket.to;
    }


    const summaryFromTime =
        $("summaryFromTime");

    if (summaryFromTime) {
        summaryFromTime.textContent =
            selectedTicket.fromTime;
    }


    const summaryToTime =
        $("summaryToTime");

    if (summaryToTime) {
        summaryToTime.textContent =
            selectedTicket.toTime;
    }


    updateTotal();


    const modal =
        $("bookingModal");

    if (modal) {
        modal.classList.add("show");
    }

}


/* =========================================================
   UPDATE TOTAL
========================================================= */

function updateTotal() {

    if (!selectedTicket) {
        return;
    }

    const passengersInput =
        $("passengersInput");

    let passengers =
        passengersInput
            ? Number(passengersInput.value)
            : 1;


    if (!passengers || passengers < 1) {
        passengers = 1;
    }


    if (passengers > 9) {
        passengers = 9;
    }


    if (passengersInput) {
        passengersInput.value =
            passengers;
    }


    const totalPrice =
        $("totalPrice");

    if (totalPrice) {

        totalPrice.textContent =
            "€" +
            (
                selectedTicket.price *
                passengers
            );

    }

}


/* =========================================================
   CLOSE BOOKING
========================================================= */

function closeBooking() {

    const modal =
        $("bookingModal");

    if (modal) {
        modal.classList.remove("show");
    }

}


/* =========================================================
   GET SAVED TICKETS
========================================================= */

function getSavedTickets() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved) {
            return [];
        }


        const tickets =
            JSON.parse(saved);


        return Array.isArray(tickets)
            ? tickets
            : [];

    }

    catch (error) {

        console.error(
            "HAVKAR storage error:",
            error
        );

        return [];

    }

}


/* =========================================================
   BOOKING CODE
========================================================= */

function generateBookingCode() {

    const random =
        Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();


    return "HAV-" + random;

}


/* =========================================================
   CONFIRM BOOKING
========================================================= */

function confirmBooking(event) {

    if (event) {
        event.preventDefault();
    }


    if (!selectedTicket) {

        showToast(
            "No ticket selected."
        );

        return false;
    }


    const passengersInput =
        $("passengersInput");


    const passengers =
        Math.max(
            1,
            Math.min(
                9,
                Number(
                    passengersInput
                        ? passengersInput.value
                        : 1
                ) || 1
            )
        );


    const bookingCode =
        generateBookingCode();


    const getValue = id => {

        const element = $(id);

        return element
            ? element.value.trim()
            : "";

    };


    const dateInput =
        $("dateInput");


    const booking = {

        id: Date.now(),

        bookingCode:
            bookingCode,

        bookedAt:
            new Date().toISOString(),

        type:
            selectedTicket.type,

        typeName:
            getTypeName(
                selectedTicket.type
            ),

        provider:
            selectedTicket.provider,

        code:
            selectedTicket.code,

        from:
            selectedTicket.from,

        to:
            selectedTicket.to,

        fromTime:
            selectedTicket.fromTime,

        toTime:
            selectedTicket.toTime,

        duration:
            selectedTicket.duration,

        price:
            selectedTicket.price,

        passengers:
            passengers,

        total:
            selectedTicket.price *
            passengers,

        firstName:
            getValue("firstName"),

        lastName:
            getValue("lastName"),

        email:
            getValue("email"),

        phone:
            getValue("phone"),

        document:
            getValue("document"),

        travelDate:
            dateInput
                ? dateInput.value
                : selectedTicket.selectedDate || ""

    };


    const tickets =
        getSavedTickets();


    tickets.unshift(
        booking
    );


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(tickets)
        );

    }

    catch (error) {

        console.error(
            "HAVKAR save error:",
            error
        );

        showToast(
            "Unable to save ticket."
        );

        return false;

    }


    closeBooking();


    const successBookingCode =
        $("successBookingCode");

    if (successBookingCode) {

        successBookingCode.textContent =
            bookingCode;

    }


    const successModal =
        $("successModal");

    if (successModal) {
        successModal.classList.add("show");
    }


    const bookingForm =
        $("bookingForm");

    if (bookingForm) {
        bookingForm.reset();
    }


    if (passengersInput) {
        passengersInput.value =
            passengers;
    }


    selectedTicket = null;

    return false;

}

========================================================= */

        pageTitle.textContent =
            "My Tickets";
    }


    const resultsTitle =
        $("resultsTitle");

    if (resultsTitle) {
        resultsTitle.textContent =
            "My Tickets";
    }


    const resultCount =
        $("resultCount");

    if (resultCount) {

        resultCount.textContent =
            tickets.length +
            " saved";

    }


    document.querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.remove(
                "active"
            );

        });


    const container =
        $("resultsContainer");


    if (!container) {
        return;
    }


    if (tickets.length === 0) {

        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">

                    <i class="fas fa-ticket"></i>

                </div>

                <h3>No tickets yet</h3>

                <p>
                    Your confirmed bookings

            </div>

        `;

        return;
    }


    container.innerHTML =
        tickets
            .map(ticket =>
                createMyTicket(ticket)
            )
            .join("");

}

                </div>


                <div class="price">

                        ticket.total
                    ).toFixed(0)}

                </div>

            </div>


            <div class="my-route">

                <div>

                    <div class="my-city">

                            ticket.from

                    </div>

                    <div class="my-time">

                        ${escapeHtml(

                    </div>

                <div

                    "

}


/* =========================================================
   DELETE TICKET
========================================================= */

function deleteTicket(id) {

    const shouldDelete =
        window.confirm(
            "Delete this ticket?"
        );


    if (!shouldDelete) {
        return;
    }


    const tickets =
        getSavedTickets()
            .filter(
                ticket =>
                    String(ticket.id) !==
                    String(id)
            );


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(tickets)
        );

    }

    catch (error) {

        console.error(
            "HAVKAR delete error:",
            error
        );

        showToast(
            "Unable to delete ticket."
        );

        return;

    }


    showToast(
        "Ticket deleted."
    );


    showMyTickets();

}


/* =========================================================
   SUCCESS MODAL
========================================================= */

function closeSuccess() {

    const modal =
        $("successModal");

    if (modal) {
        modal.classList.remove("show");
    }

}


/* =========================================================
   SWAP LOCATIONS
========================================================= */

function swapLocations() {

    const from =
        $("fromInput");

    const to =
        $("toInput");


    if (!from || !to) {
        return;
    }


    const temporary =
        from.value;


    from.value =
        to.value;


    to.value =
        temporary;


    searchTickets(false);

}


/* =========================================================
   FILTERS
========================================================= */

function toggleFilters() {

    const filters =
        $("extraFilters");


    if (!filters) {
        return;
    }


    filters.classList.toggle(
        "show"
    );

}


/* =========================================================
   FOCUS SEARCH
========================================================= */

function focusSearch() {

    const section =
        $("searchSection");


    if (section) {

        section.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    setTimeout(() => {

        const from =
            $("fromInput");

        if (from) {
            from.focus();
        }

    }, 350);

}


/* =========================================================
   HOME
========================================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        $("toast");


    if (!toast) {
        console.log(
            "HAVKAR:",
            message
        );

        return;
    }


    toast.textContent =
        String(message);


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        }, 2500);

}


/* =========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

function setupModalOutsideClick(
    modalId,
    closeFunction
) {

    const modal =
        $(modalId);


    if (!modal) {
        return;
    }


    modal.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                event.currentTarget
            ) {

                closeFunction();

            }

        }
    );

}


/* =========================================================
   ENTER KEY SEARCH
========================================================= */

function setupEnterSearch(id) {

    const element =
        $(id);


    if (!element) {
        return;
    }


    element.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                event.preventDefault();

                searchTickets(true);

            }

        }
    );

}


/* =========================================================
   SAFE EVENT LISTENER
========================================================= */

function on(id, eventName, handler) {

    const element =
        $(id);


    if (!element) {

        console.warn(
            "HAVKAR: Element not found:",
            id
        );

        return;

    }


    element.addEventListener(
        eventName,
        handler
    );

}


/* =========================================================
   INITIALIZE EVERYTHING
========================================================= */

function initializeHAVKAR() {

    console.log(
        "HAVKAR Tickets initializing..."
    );


    /* -----------------------------------------
       DATE
    ----------------------------------------- */

    setToday();


    /* -----------------------------------------
       SEARCH BUTTON
    ----------------------------------------- */

    on(
        "searchBtn",
        "click",
        () => searchTickets(true)
    );


    /* -----------------------------------------
       TRANSPORT TABS
    ----------------------------------------- */

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.addEventListener(
                "click",
                () => {

                    const type =
                        tab.dataset.type;

                    changeType(type);

                }
            );

        });


    /* -----------------------------------------
       HEADER BUTTONS
    ----------------------------------------- */

    on(
        "backBtn",
        "click",
        goHome
    );


    on(
        "notificationBtn",
        "click",
        () =>
            showToast(
                "Notifications"
            )
    );


    on(
        "profileBtn",
        "click",
        () =>
            showToast(
                "Profile"
            )
    );


    /* -----------------------------------------
       SWAP
    ----------------------------------------- */

    on(
        "swapBtn",
        "click",
        swapLocations
    );


    /* -----------------------------------------
       FILTER
    ----------------------------------------- */

    on(
        "filterToggle",
        "click",
        toggleFilters
    );


    /* -----------------------------------------
       BOTTOM NAVIGATION
    ----------------------------------------- */

    on(
        "homeNav",
        "click",
        goHome
    );


    on(
        "searchNav",
        "click",
        focusSearch
    );


    on(
        "ticketsNav",
        "click",
        showMyTickets
    );


    on(
        "alertsNav",
        "click",
        () =>
            showToast(
                "Alerts"
            )
    );


    on(
        "profileNav",
        "click",
        () =>
            showToast(
                "Profile"
            )
    );


    /* -----------------------------------------
       PASSENGERS
    ----------------------------------------- */

    on(
        "passengersInput",
        "input",
        updateTotal
    );


    /* -----------------------------------------
       FILTER EVENTS
    ----------------------------------------- */

    on(
        "stopsSelect",
        "change",
        () => searchTickets(false)
    );


    on(
        "sortSelect",
        "change",
        () => searchTickets(false)
    );


    /* -----------------------------------------
       DATE CHANGE
    ----------------------------------------- */

    on(
        "dateInput",
        "change",
        () => searchTickets(false)
    );


    /* -----------------------------------------
       ENTER SEARCH
    ----------------------------------------- */

    setupEnterSearch(
        "fromInput"
    );

    setupEnterSearch(
        "toInput"
    );


    /* -----------------------------------------
       BOOKING FORM
    ----------------------------------------- */

    on(
        "bookingForm",
        "submit",
        confirmBooking
    );


    /* -----------------------------------------
       CLOSE BOOKING
    ----------------------------------------- */

    on(
        "closeBooking",
        "click",
        closeBooking
    );


    /* -----------------------------------------
       CLOSE SUCCESS
    ----------------------------------------- */

    on(
        "closeSuccess",
        "click",
        closeSuccess
    );


    /* -----------------------------------------
       VIEW TICKETS
    ----------------------------------------- */

    on(
        "viewTicketsBtn",
        "click",
        () => {

            closeSuccess();

            showMyTickets();

        }
    );


    /* -----------------------------------------
       MODAL OUTSIDE CLICK
    ----------------------------------------- */

    setupModalOutsideClick(
        "bookingModal",
        closeBooking
    );


    setupModalOutsideClick(
        "successModal",
        closeSuccess
    );


    /* -----------------------------------------
       ESC KEY
    ----------------------------------------- */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape"
            ) {

                closeBooking();

                closeSuccess();

            }

        }
    );


    /* -----------------------------------------
       FIRST SEARCH
    ----------------------------------------- */

    searchTickets(false);


    console.log(
        "HAVKAR Tickets initialized successfully."
    );

}


/* =========================================================
   DOM READY
   IMPORTANT:
   ALL DOM EVENTS START HERE
========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initializeHAVKAR,
        {
            once: true
        }
    );

}

else {

    initializeHAVKAR();

}

</script>
