<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7cb342">

<title>HAVKAR - Flight Tickets</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --green:#7cb342;
    --green-dark:#558b2f;
    --green-light:#eef7e8;
    --bg:#f5f6f5;
    --white:#ffffff;
    --text:#2d2d2d;
    --muted:#777777;
    --border:#e1e1e1;
    --danger:#e53935;
    --shadow:0 4px 16px rgba(0,0,0,.07);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:var(--bg);
    color:var(--text);
    padding-bottom:85px;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    min-height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 18px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    box-shadow:
        0 3px 12px rgba(0,0,0,.12);
}

.header-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.header-title{
    font-size:22px;
    font-weight:800;
}

.back-button,
.header-button{
    width:43px;
    height:43px;

    border:0;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    background:rgba(255,255,255,.18);

    cursor:pointer;

    font-size:18px;
}

.header-right{
    display:flex;
    gap:9px;
}

/* =========================================================
   DEMO NOTICE
========================================================= */

.demo-notice{
    margin:14px 16px 0;

    padding:13px 15px;

    border-radius:14px;

    background:#fff8e1;

    border:1px solid #f0d98a;

    color:#765c00;

    display:flex;
    align-items:center;

    gap:10px;

    font-size:13px;
    line-height:1.4;
}

.demo-notice i{
    font-size:18px;
    color:#d49b00;
}

/* =========================================================
   FLIGHT TAB
========================================================= */

.tabs{
    margin:14px 16px 0;

    display:flex;

    background:#fff;

    border-radius:15px;

    padding:5px;

    box-shadow:var(--shadow);
}

.tab{
    width:100%;

    border:0;

    padding:13px;

    border-radius:11px;

    background:transparent;

    color:#555;

    font-size:15px;
    font-weight:750;
}

.tab.active{
    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color:#fff;
}

/* =========================================================
   SEARCH
========================================================= */

.search-section{
    margin:14px 16px 0;

    padding:17px;

    background:#fff;

    border-radius:18px;

    box-shadow:var(--shadow);
}

.search-row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:10px;
}

.input-wrap{
    position:relative;
}

.input-wrap i{
    position:absolute;

    left:14px;
    top:50%;

    transform:translateY(-50%);

    color:var(--green);

    pointer-events:none;
}

.search-input{
    width:100%;
    height:54px;

    border:2px solid var(--border);

    border-radius:13px;

    background:#fff;

    padding:
        0
        12px
        0
        40px;

    outline:none;

    font-size:15px;

    color:#333;
}

.search-input:focus{
    border-color:var(--green);

    box-shadow:
        0 0 0 3px
        rgba(124,179,66,.12);
}

.swap-row{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin:1px 0 9px;
}

.swap-button{
    width:42px;
    height:42px;

    border:1px solid #ddd;

    border-radius:50%;

    background:#fff;

    color:var(--green-dark);

    cursor:pointer;

    font-size:17px;
}

.filter-button{
    border:0;

    background:none;

    color:var(--green-dark);

    font-weight:750;

    cursor:pointer;

    font-size:14px;
}

.extra-filters{
    display:none;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:11px;
}

.extra-filters.show{
    display:grid;
}

.select-wrap label{
    display:block;

    margin:
        0
        0
        5px
        3px;

    font-size:12px;

    color:var(--muted);
}

.select-input{
    width:100%;
    height:46px;

    border:2px solid var(--border);

    border-radius:11px;

    background:#fff;

    padding:0 9px;

    outline:none;

    font-size:13px;
}

.search-button{
    width:100%;
    height:54px;

    margin-top:3px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color:#fff;

    font-size:16px;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 4px 12px
        rgba(124,179,66,.22);
}

/* =========================================================
   CONTENT
========================================================= */

.content{
    padding:
        3px
        16px
        95px;
}

.results-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin:
        20px
        2px
        13px;
}

.results-title{
    font-size:20px;
    font-weight:800;
}

.result-count{
    color:var(--muted);

    font-size:13px;
}

/* =========================================================
   TICKET CARD
========================================================= */

.ticket-card{
    background:#fff;

    border-radius:18px;

    padding:17px;

    margin-bottom:14px;

    box-shadow:var(--shadow);

    border:
        1px solid
        rgba(0,0,0,.025);
}

.ticket-top{
    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    gap:10px;

    margin-bottom:17px;
}

.provider{
    display:flex;

    align-items:center;

    gap:11px;

    min-width:0;
}

.provider-logo{
    width:47px;
    height:47px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:var(--green-light);

    color:var(--green-dark);

    font-size:20px;
}

.provider-name{
    font-size:15px;
    font-weight:800;
}

.provider-code{
    margin-top:3px;

    color:#888;

    font-size:12px;
}

.price-box{
    text-align:right;
}

.price{
    color:var(--green-dark);

    font-size:22px;

    font-weight:850;
}

.price-label{
    color:#888;

    font-size:11px;

    margin-top:2px;
}

/* =========================================================
   ROUTE
========================================================= */

.route{
    display:grid;

    grid-template-columns:
        1fr
        65px
        1fr;

    align-items:center;

    gap:5px;

    margin-bottom:13px;
}

.location{
    min-width:0;
}

.location.right{
    text-align:right;
}

.city{
    font-size:20px;
    font-weight:850;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.time{
    margin-top:3px;

    color:#666;

    font-size:13px;
}

.station{
    margin-top:3px;

    color:#999;

    font-size:11px;
}

.route-center{
    text-align:center;

    color:var(--green);
}

.route-line{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:4px;
}

.route-line::before,
.route-line::after{
    content:"";

    width:18px;
    height:1px;

    background:#ddd;
}

.route-duration{
    margin-top:5px;

    color:#777;

    font-size:11px;
}

/* =========================================================
   TICKET INFO
========================================================= */

.ticket-info{
    display:flex;

    flex-wrap:wrap;

    gap:12px;

    padding:
        11px
        0;

    border-top:
        1px solid
        #eeeeee;

    border-bottom:
        1px solid
        #eeeeee;
}

.info-item{
    display:flex;

    align-items:center;

    gap:5px;

    color:#666;

    font-size:12px;
}

.info-item i{
    color:var(--green);
}

/* =========================================================
   DEMO DISABLED BUTTON
========================================================= */

.demo-disabled{
    width:100%;

    min-height:48px;

    margin-top:12px;

    border:0;

    border-radius:12px;

    background:#eeeeee;

    color:#888;

    font-size:14px;

    font-weight:750;

    cursor:not-allowed;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;
}

.demo-disabled i{
    color:#999;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty-state{
    background:#fff;

    border-radius:18px;

    padding:48px 18px;

    text-align:center;

    box-shadow:var(--shadow);
}

.empty-icon{
    width:68px;
    height:68px;

    margin:
        0
        auto
        14px;

    border-radius:50%;

    background:#f0f0f0;

    color:#aaa;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
}

.empty-state h3{
    margin-bottom:7px;

    color:#666;

    font-size:18px;
}

.empty-state p{
    color:#999;

    font-size:13px;

    line-height:1.5;
}

.loading{
    background:#fff;

    border-radius:18px;

    padding:45px 20px;

    text-align:center;

    box-shadow:var(--shadow);

    color:#777;
}

.loading i{
    color:var(--green);

    font-size:25px;

    margin-bottom:10px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:95px;

    transform:
        translateX(-50%)
        translateY(20px);

    opacity:0;

    pointer-events:none;

    z-index:3000;

    background:#333;

    color:#fff;

    padding:
        11px
        17px;

    border-radius:11px;

    font-size:13px;

    white-space:nowrap;

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:78px;

    display:flex;

    align-items:center;
    justify-content:space-around;

    background:#fff;

    box-shadow:
        0 -3px 13px
        rgba(0,0,0,.09);

    z-index:2000;
}

.nav-item{
    flex:1;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    color:#999;

    font-size:11px;

    cursor:pointer;
}

.nav-item i{
    font-size:20px;
}

.nav-item.active{
    color:var(--green);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    .header{
        padding:
            13px
            15px;
    }

    .header-title{
        font-size:20px;
    }

    .search-section{
        padding:15px;
    }

    .search-row{
        gap:8px;
    }

    .search-input{
        height:52px;

        font-size:14px;
    }

    .city{
        font-size:18px;
    }

    .route{
        grid-template-columns:
            1fr
            54px
            1fr;
    }

}

@media(max-width:380px){

    .provider-name{
        font-size:14px;
    }

    .price{
        font-size:19px;
    }

    .ticket-card{
        padding:14px;
    }

    .ticket-info{
        gap:8px;
    }

    .info-item{
        font-size:11px;
    }

}

</style>
</head>


<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-button"
            type="button"
            aria-label="Back"
        >
            <i class="fas fa-arrow-left"></i>
        </button>

        <h1
            id="pageTitle"
            class="header-title"
        >
            Flight Tickets
        </h1>

    </div>


    <div class="header-right">

        <button
            id="notificationButton"
            class="header-button"
            type="button"
            aria-label="Notifications"
        >
            <i class="fas fa-bell"></i>
        </button>


        <button
            id="profileButton"
            class="header-button"
            type="button"
            aria-label="Profile"
        >
            <i class="fas fa-user"></i>
        </button>

    </div>

</header>


<!-- =========================================================
     DEMO NOTICE
========================================================= -->

<div class="demo-notice">

    <i class="fas fa-flask"></i>

    <div>
        <strong>Demo Flight Tickets</strong><br>
        These flights are for testing the HAVKAR interface only.
        Purchase and payment are currently unavailable.
    </div>

</div>


<!-- =========================================================
     TRANSPORT TAB
========================================================= -->

<div class="tabs">

    <button
        class="tab active"
        type="button"
    >
        <i class="fas fa-plane"></i>
        Flights
    </button>

</div>


<!-- =========================================================
     SEARCH
========================================================= -->

<section
    id="searchSection"
    class="search-section"
>

    <div class="search-row">

        <div class="input-wrap">

            <i class="fas fa-location-dot"></i>

            <input
                id="fromInput"
                class="search-input"
                type="text"
                value="Rome"
                placeholder="From"
                autocomplete="off"
            >

        </div>


        <div class="input-wrap">

            <i class="fas fa-location-dot"></i>

            <input
                id="toInput"
                class="search-input"
                type="text"
                value="Milan"
                placeholder="To"
                autocomplete="off"
            >

        </div>

    </div>


    <div class="swap-row">

        <button
            id="swapButton"
            class="swap-button"
            type="button"
            aria-label="Swap locations"
        >
            <i class="fas fa-right-left"></i>
        </button>


        <button
            id="filterButton"
            class="filter-button"
            type="button"
        >
            <i class="fas fa-sliders"></i>
            Filters
        </button>

    </div>


    <div class="search-row">

        <div class="input-wrap">

            <i class="fas fa-calendar"></i>

            <input
                id="dateInput"
                class="search-input"
                type="date"
            >

        </div>


        <div class="input-wrap">

            <i class="fas fa-user"></i>

            <input
                id="passengersInput"
                class="search-input"
                type="number"
                min="1"
                max="9"
                value="1"
                inputmode="numeric"
                aria-label="Passengers"
            >

        </div>

    </div>


    <!-- FILTERS -->

    <div
        id="extraFilters"
        class="extra-filters"
    >

        <div class="select-wrap">

            <label for="stopsSelect">
                Stops
            </label>

            <select
                id="stopsSelect"
                class="select-input"
            >

                <option value="any">
                    Any
                </option>

                <option value="direct">
                    Direct only
                </option>

                <option value="one">
                    Up to 1 stop
                </option>

            </select>

        </div>


        <div class="select-wrap">

            <label for="sortSelect">
                Sort by
            </label>

            <select
                id="sortSelect"
                class="select-input"
            >

                <option value="recommended">
                    Recommended
                </option>

                <option value="price">
                    Lowest price
                </option>

                <option value="duration">
                    Shortest trip
                </option>

                <option value="departure">
                    Earliest departure
                </option>

            </select>

        </div>

    </div>


    <button
        id="searchButton"
        class="search-button"
        type="button"
    >

        <i class="fas fa-search"></i>

        Search Flights

    </button>

</section>


<!-- =========================================================
     RESULTS
========================================================= -->

<main class="content">

    <div class="results-header">

        <div
            id="resultsTitle"
            class="results-title"
        >
            Available Demo Flights
        </div>


        <div
            id="resultCount"
            class="result-count"
        >
            0 results
        </div>

    </div>


    <div id="resultsContainer"></div>

</main>


<!-- =========================================================
     BOTTOM NAVIGATION
========================================================= -->

<nav class="bottom-nav">

    <div
        id="homeNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >

        <i class="fas fa-home"></i>

        <span>Home</span>

    </div>


    <div
        id="searchNav"
        class="nav-item active"
        role="button"
        tabindex="0"
    >

        <i class="fas fa-search"></i>

        <span>Search</span>

    </div>


    <div
        id="ticketsNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >

        <i class="fas fa-ticket"></i>

        <span>Tickets</span>

    </div>


    <div
        id="alertsNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >

        <i class="fas fa-bell"></i>

        <span>Alerts</span>

    </div>


    <div
        id="profileNav"
        class="nav-item"
        role="button"
        tabindex="0"
    >

        <i class="fas fa-user"></i>

        <span>Profile</span>

    </div>

</nav>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>


<script>

"use strict";

/* =========================================================
   HAVKAR TICKETS
   DEMO FLIGHTS ONLY
   NO REAL PURCHASE
   NO REAL PAYMENT
========================================================= */


/* =========================================================
   STATE
========================================================= */

let currentResults = [];

let toastTimer = null;

let searchTimer = null;


/* =========================================================
   DEMO FLIGHT DATABASE
========================================================= */

const flightData = [

    {
        type:"flight",
        provider:"ITA Airways",
        code:"AZ 123",
        from:"Rome",
        to:"Milan",
        fromTime:"08:30 AM",
        toTime:"09:45 AM",
        duration:"1h 15m",
        durationMinutes:75,
        stops:0,
        stopsText:"Direct",
        baggage:"1 Bag",
        price:75,
        icon:"fa-plane"
    },


    {
        type:"flight",
        provider:"Ryanair",
        code:"FR 1542",
        from:"Rome",
        to:"Milan",
        fromTime:"02:15 PM",
        toTime:"03:30 PM",
        duration:"1h 15m",
        durationMinutes:75,
        stops:0,
        stopsText:"Direct",
        baggage:"No Bag",
        price:45,
        icon:"fa-plane"
    },


    {
        type:"flight",
        provider:"Wizz Air",
        code:"W4 6012",
        from:"Rome",
        to:"Milan",
        fromTime:"06:20 PM",
        toTime:"07:40 PM",
        duration:"1h 20m",
        durationMinutes:80,
        stops:0,
        stopsText:"Direct",
        baggage:"1 Bag",
        price:59,
        icon:"fa-plane"
    },


    {
        type:"flight",
        provider:"Lufthansa",
        code:"LH 1871",
        from:"Rome",
        to:"Milan",
        fromTime:"10:10 AM",
        toTime:"12:05 PM",
        duration:"1h 55m",
        durationMinutes:115,
        stops:1,
        stopsText:"1 Stop",
        baggage:"1 Bag",
        price:69,
        icon:"fa-plane"
    }

];


/* =========================================================
   DOM HELPER
========================================================= */

function $(id){

    return document.getElementById(id);

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    return String(value || "")
        .trim()
        .toLowerCase();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   TIME TO MINUTES
========================================================= */

function timeToMinutes(time){

    const match =
        String(time || "").match(
            /(\d+):(\d+)\s*(AM|PM)/i
        );

    if(!match){
        return 0;
    }

    let hour =
        Number(match[1]);

    const minute =
        Number(match[2]);

    const period =
        match[3].toUpperCase();

    if(
        period === "PM" &&
        hour !== 12
    ){
        hour += 12;
    }

    if(
        period === "AM" &&
        hour === 12
    ){
        hour = 0;
    }

    return (
        hour * 60 +
        minute
    );

}


/* =========================================================
   TODAY
========================================================= */

function setToday(){

    const input =
        $("dateInput");

    if(!input){
        return;
    }

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            today.getDate()
        ).padStart(2,"0");

    input.value =
        `${year}-${month}-${day}`;

}


/* =========================================================
   GET FILTERED RESULTS
========================================================= */

function getFilteredResults(){

    const from =
        normalize(
            $("fromInput")?.value
        );

    const to =
        normalize(
            $("toInput")?.value
        );


    if(!from || !to){

        return [];

    }


    /*
       IMPORTANT:

       This is DEMO DATA.

       It only displays the demo flights
       when the route is Rome -> Milan.

       It does NOT pretend to search
       a real airline database.
    */

    if(
        from !== "rome" ||
        to !== "milan"
    ){

        return [];

    }


    let results =
        flightData.map(
            flight => ({
                ...flight
            })
        );


    /* =====================================================
       STOPS FILTER
    ===================================================== */

    const stopFilter =
        $("stopsSelect")?.value ||
        "any";


    if(
        stopFilter === "direct"
    ){

        results =
            results.filter(
                flight =>
                    flight.stops === 0
            );

    }


    if(
        stopFilter === "one"
    ){

        results =
            results.filter(
                flight =>
                    flight.stops <= 1
            );

    }


    /* =====================================================
       SORT
    ===================================================== */

    const sort =
        $("sortSelect")?.value ||
        "recommended";


    if(sort === "price"){

        results.sort(
            (a,b) =>
                a.price - b.price
        );

    }

    else if(
        sort === "duration"
    ){

        results.sort(
            (a,b) =>
                a.durationMinutes -
                b.durationMinutes
        );

    }

    else if(
        sort === "departure"
    ){

        results.sort(
            (a,b) =>
                timeToMinutes(
                    a.fromTime
                ) -
                timeToMinutes(
                    b.fromTime
                )
        );

    }

    else{

        results.sort(
            (a,b) => {

                const scoreA =
                    a.price +
                    (
                        a.durationMinutes *
                        0.08
                    ) +
                    (
                        a.stops *
                        15
                    );


                const scoreB =
                    b.price +
                    (
                        b.durationMinutes *
                        0.08
                    ) +
                    (
                        b.stops *
                        15
                    );


                return scoreA - scoreB;

            }
        );

    }


    return results;

}


/* =========================================================
   SEARCH
========================================================= */

function searchFlights(){

    clearTimeout(searchTimer);


    const container =
        $("resultsContainer");


    if(!container){
        return;
    }


    container.innerHTML = `

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <div>
                Loading demo flights...
            </div>

        </div>

    `;


    searchTimer =
        setTimeout(() => {

            currentResults =
                getFilteredResults();

            renderResults();

        },180);

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults(){

    const container =
        $("resultsContainer");

    const count =
        $("resultCount");


    if(!container){
        return;
    }


    if(count){

        count.textContent =
            currentResults.length +
            " demo results";

    }


    if(
        currentResults.length === 0
    ){

        const from =
            $("fromInput")?.value ||
            "";

        const to =
            $("toInput")?.value ||
            "";


        if(
            !from ||
            !to
        ){

            container.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        <i class="fas fa-location-dot"></i>
                    </div>

                    <h3>
                        Enter your route
                    </h3>

                    <p>
                        Enter origin and destination
                        to search the demo flight database.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    <i class="fas fa-plane-slash"></i>
                </div>

                <h3>
                    No demo flights found
                </h3>

                <p>
                    The current demo database contains
                    only Rome → Milan flights.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        currentResults
            .map(
                flight =>
                    createFlightCard(flight)
            )
            .join("");

}

/* =========================================================
   SWAP LOCATIONS
========================================================= */

function swapLocations(){

    const from =
        $("fromInput");

    const to =
        $("toInput");


    if(!from || !to){
        return;
    }


    const temporary =
        from.value;

    from.value =
        to.value;

    to.value =
        temporary;


    searchFlights();

}


/* =========================================================
   TOGGLE FILTERS
========================================================= */

function toggleFilters(){

    const filters =
        $("extraFilters");


    if(!filters){
        return;
    }


    filters.classList.toggle(
        "show"
    );

}


/* =========================================================
   FOCUS SEARCH
========================================================= */

function focusSearch(){

    const section =
        $("searchSection");


    if(section){

        section.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }


    setTimeout(() => {

        const input =
            $("fromInput");

        if(input){
            input.focus();
        }

    },300);

}


/* =========================================================
   GO HOME
========================================================= */

function goHome(){

    window.location.href =
        "index.html";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        $("toast");


    if(!toast){
        return;
    }


    toast.textContent =
        String(message);


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2300);

}


/* =========================================================
   SAFE EVENT LISTENER
========================================================= */

function on(
    elementId,
    eventName,
    handler
){

    const element =
        $(elementId);


    if(!element){
        return;
    }


    element.addEventListener(
        eventName,
        handler
    );

}


/* =========================================================
   ENTER KEY
========================================================= */

function setupEnterSearch(
    elementId
){

    const element =
        $(elementId);


    if(!element){
        return;
    }


    element.addEventListener(
        "keydown",
        event => {

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();

                searchFlights();

            }

        }
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

function initializeHAVKAR(){

    console.log(
        "HAVKAR Tickets Demo initializing..."
    );


    /* DATE */

    setToday();


    /* SEARCH */

    on(
        "searchButton",
        "click",
        searchFlights
    );


    /* SWAP */

    on(
        "swapButton",
        "click",
        swapLocations
    );


    /* FILTER */

    on(
        "filterButton",
        "click",
        toggleFilters
    );


    /* FILTER CHANGES */

    on(
        "stopsSelect",
        "change",
        searchFlights
    );


    on(
        "sortSelect",
        "change",
        searchFlights
    );


    /* DATE */

    on(
        "dateInput",
        "change",
        searchFlights
    );


    /* PASSENGERS */

    on(
        "passengersInput",
        "change",
        () => {

            const input =
                $("passengersInput");

            if(!input){
                return;
            }


            let value =
                Number(input.value);


            if(
                !Number.isFinite(value) ||
                value < 1
            ){
                value = 1;
            }


            if(value > 9){
                value = 9;
            }


            input.value =
                value;

        }
    );


    /* ENTER SEARCH */

    setupEnterSearch(
        "fromInput"
    );

    setupEnterSearch(
        "toInput"
    );


    /* HEADER */

    on(
        "backButton",
        "click",
        goHome
    );


    on(
        "notificationButton",
        "click",
        () =>
            showToast(
                "Notifications"
            )
    );


    on(
        "profileButton",
        "click",
        () =>
            showToast(
                "Profile"
            )
    );


    /* BOTTOM NAV */

    on(
        "homeNav",
        "click",
        goHome
    );


    on(
        "searchNav",
        "click",
        focusSearch
    );


    on(
        "ticketsNav",
        "click",
        () =>
            showToast(
                "Ticket history will be connected later."
            )
    );


    on(
        "alertsNav",
        "click",
        () =>
            showToast(
                "Alerts"
            )
    );


    on(
        "profileNav",
        "click",
        () =>
            showToast(
                "Profile"
            )
    );


    /* FIRST RENDER */

    searchFlights();


    console.log(
        "HAVKAR Tickets Demo initialized successfully."
    );

}


/* =========================================================
   DOM READY
========================================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initializeHAVKAR,
        {
            once:true
        }
    );

}
else{

    initializeHAVKAR();

}

</script>
