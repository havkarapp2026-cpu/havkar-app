<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#609b38">
<title>HAVKAR | Accommodation application</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/havkar-accommodation.css">
</head>
<body data-accommodation-page="apply">
<header>
  <div class="header-inner top">
    <button class="back" type="button" id="backButton" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
    <div>
      <h1>List a property</h1>
      <p class="subtitle">The operator record does not verify identity or the property.</p>
    </div>
  </div>
</header>
<main>
  <div class="card">
    <p class="notice">A confirmed email is required. Identity Verified stays off until a contracted identity service is connected. Monthly plans are not priced and are not charged.</p>
    <label for="legalName">Legal name</label>
    <input id="legalName" maxlength="160" autocomplete="name">
    <label for="actingAs">Role</label>
    <select id="actingAs">
      <option value="owner">Owner</option>
      <option value="legal_representative">Legal representative</option>
    </select>
    <button class="primary" id="saveOperator" type="button">Save operator</button>
    <p id="message" class="error" role="status"></p>
  </div>
</main>
<nav class="bottom" aria-label="Accommodation">
  <a href="accommodation.html"><strong>Listings</strong></a>
  <a href="accommodation-property.html"><strong>Property</strong></a>
  <a href="accommodation-status.html"><strong>Status</strong></a>
</nav>
<script src="/havkar-supabase-config.js"></script>
<script src="/havkar-accommodation.js"></script>
<script type="module" src="/havkar-accommodation-ui.js"></script>
<script>
document.getElementById("backButton").addEventListener("click", function () {
  if (window.havkarNavigateBack) window.havkarNavigateBack();
  else window.location.href = "accommodation.html";
});
</script>
<script src="/havkar-i18n.js"></script>
<script src="/havkar-page-back.js"></script>
</body>
</html>
