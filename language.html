<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7cb342">
    <title>HAVKAR - Language</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --green:#7cb342;
            --green-dark:#558b2f;
            --green-soft:#edf7e8;
            --bg:#f5f6f5;
            --white:#fff;
            --text:#292d27;
            --muted:#777d74;
            --border:#e7e9e5;
            --danger:#c62828;
            --shadow:0 6px 22px rgba(0,0,0,.07);
        }
        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            padding-bottom:86px;
        }
        .header{
            position:sticky;
            top:0;
            z-index:20;
            min-height:72px;
            background:linear-gradient(135deg,#5f9632,#7cb342);
            color:#fff;
            padding:14px 20px;
            display:flex;
            align-items:center;
            box-shadow:0 3px 14px rgba(61,96,33,.18);
        }
        .header-left{display:flex;align-items:center;gap:15px}
        .back-btn{
            width:42px;height:42px;border-radius:50%;
            border:1px solid rgba(255,255,255,.18);
            background:rgba(255,255,255,.12);
            color:#fff;font-size:1.25rem;cursor:pointer
        }
        .header h1{font-size:1.3rem;font-weight:800}
        .content{max-width:820px;margin:0 auto;padding:24px 20px}
        .section-title{
            font-size:.86rem;font-weight:800;color:#92978f;
            text-transform:uppercase;letter-spacing:1px;
            margin:12px 0 14px
        }
        .status{
            display:none;
            align-items:center;
            gap:10px;
            padding:12px 14px;
            margin-bottom:14px;
            border-radius:12px;
            font-size:.88rem;
            line-height:1.45
        }
        .status.show{display:flex}
        .status.loading{background:#f2f7ee;color:#4f6d3d}
        .status.error{background:#fff0f0;color:var(--danger)}
        .language-list{
            background:#fff;border-radius:18px;overflow:hidden;
            border:1px solid var(--border);box-shadow:var(--shadow)
        }
        .language-item{
            width:100%;border:0;background:#fff;text-align:left;
            padding:17px 20px;display:flex;align-items:center;gap:15px;
            cursor:pointer;border-bottom:1px solid #f0f1ef;
            transition:background .18s ease,transform .18s ease
        }
        .language-item:last-child{border-bottom:none}
        .language-item:hover{background:#fafbfa}
        .language-item:active{transform:scale(.995)}
        .language-item.active{background:var(--green-soft)}
        .language-item:disabled{cursor:wait;opacity:.72}
        .flag{font-size:2rem;width:50px;text-align:center;flex:0 0 50px}
        .language-info{flex:1;min-width:0}
        .language-name{font-size:1rem;font-weight:750;color:#333;margin-bottom:3px}
        .language-native{font-size:.85rem;color:#6d726a}
        .check-icon{color:var(--green);font-size:1.25rem}
        .info-card{
            background:#fff;border:1px solid var(--border);
            border-radius:16px;padding:18px;margin-top:18px;
            box-shadow:0 4px 16px rgba(0,0,0,.045)
        }
        .info-title{
            font-size:.98rem;font-weight:800;color:#333;margin-bottom:9px;
            display:flex;align-items:center;gap:9px
        }
        .info-text{font-size:.88rem;color:#6d726a;line-height:1.6}
        .bottom-nav{
            position:fixed;bottom:0;left:0;right:0;z-index:30;
            background:rgba(255,255,255,.98);
            display:flex;justify-content:space-around;
            padding:10px 0 calc(10px + env(safe-area-inset-bottom));
            box-shadow:0 -3px 14px rgba(0,0,0,.08)
        }
        .nav-item{
            min-width:70px;display:flex;flex-direction:column;align-items:center;
            gap:5px;color:#999;font-size:.75rem;cursor:pointer
        }
        .nav-item.active{color:var(--green)}
        .nav-item i{font-size:1.3rem}
        @media(max-width:600px){
            .header{min-height:66px;padding:12px 15px}
            .content{padding:20px 14px}
            .language-item{padding:16px 15px}
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" type="button" onclick="window.location.href='index.html'" aria-label="Back">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 id="pageTitle">Language</h1>
        </div>
    </header>

    <main class="content">
        <div class="section-title" id="sectionTitle">Select Your Language</div>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <div class="language-list" id="languageList">
            <button class="language-item" type="button" data-code="en" data-dir="ltr">
                <span class="flag">🇬🇧</span>
                <span class="language-info"><span class="language-name">English</span><span class="language-native">English</span></span>
            </button>
            <button class="language-item" type="button" data-code="fa" data-dir="rtl">
                <span class="flag">🇮🇷</span>
                <span class="language-info"><span class="language-name">Persian</span><span class="language-native">فارسی</span></span>
            </button>
            <button class="language-item" type="button" data-code="ar" data-dir="rtl">
                <span class="flag">🇸🇦</span>
                <span class="language-info"><span class="language-name">Arabic</span><span class="language-native">العربية</span></span>
            </button>
            <button class="language-item" type="button" data-code="ckb" data-dir="rtl">
                <span class="flag">🏴</span>
                <span class="language-info"><span class="language-name">Kurdish</span><span class="language-native">کوردی</span></span>
            </button>
            <button class="language-item" type="button" data-code="it" data-dir="ltr">
                <span class="flag">🇮🇹</span>
                <span class="language-info"><span class="language-name">Italian</span><span class="language-native">Italiano</span></span>
            </button>
            <button class="language-item" type="button" data-code="sv" data-dir="ltr">
                <span class="flag">🇸🇪</span>
                <span class="language-info"><span class="language-name">Swedish</span><span class="language-native">Svenska</span></span>
            </button>
            <button class="language-item" type="button" data-code="de" data-dir="ltr">
                <span class="flag">🇩🇪</span>
                <span class="language-info"><span class="language-name">German</span><span class="language-native">Deutsch</span></span>
            </button>
            <button class="language-item" type="button" data-code="fr" data-dir="ltr">
                <span class="flag">🇫🇷</span>
                <span class="language-info"><span class="language-name">French</span><span class="language-native">Français</span></span>
            </button>
            <button class="language-item" type="button" data-code="es" data-dir="ltr">
                <span class="flag">🇪🇸</span>
                <span class="language-info"><span class="language-name">Spanish</span><span class="language-native">Español</span></span>
            </button>
            <button class="language-item" type="button" data-code="tr" data-dir="ltr">
                <span class="flag">🇹🇷</span>
                <span class="language-info"><span class="language-name">Turkish</span><span class="language-native">Türkçe</span></span>
            </button>
        </div>

        <section class="info-card">
            <div class="info-title">
                <i class="fas fa-circle-info" style="color:#7cb342"></i>
                <span id="infoTitle">Language Settings</span>
            </div>
            <div class="info-text" id="infoText">
                Choose your preferred HAVKAR language. Your preference is saved automatically on this device.
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'">
            <i class="fas fa-home"></i><span id="navHome">Home</span>
        </div>
        <div class="nav-item active">
            <i class="fas fa-language"></i><span id="navLanguage">Language</span>
        </div>
        <div class="nav-item" onclick="window.location.href='settings.html'">
            <i class="fas fa-cog"></i><span id="navSettings">Settings</span>
        </div>
        <div class="nav-item" onclick="window.location.href='profile.html'">
            <i class="fas fa-user"></i><span id="navProfile">Profile</span>
        </div>
    </nav>

<script>
(() => {
    "use strict";

    const STORAGE_KEY = "havkar_language";
    const STORAGE_DIR_KEY = "havkar_language_dir";
    const API_URL = "/api/translate";

    const baseTexts = {
        pageTitle: "Language",
        sectionTitle: "Select Your Language",
        infoTitle: "Language Settings",
        infoText: "Choose your preferred HAVKAR language. Your preference is saved automatically on this device.",
        navHome: "Home",
        navLanguage: "Language",
        navSettings: "Settings",
        navProfile: "Profile"
    };

    const $ = (id) => document.getElementById(id);
    const items = [...document.querySelectorAll(".language-item")];
    let busy = false;

    function getSelectedLanguage() {
        return localStorage.getItem(STORAGE_KEY) || "en";
    }

    function setStatus(message = "", type = "") {
        const el = $("status");
        el.textContent = message;
        el.className = "status" + (message ? " show " + type : "");
    }

    function setBusy(value) {
        busy = value;
        items.forEach(item => item.disabled = value);
    }

    function setDirection(dir) {
        const safeDir = dir === "rtl" ? "rtl" : "ltr";
        document.documentElement.dir = safeDir;
        document.documentElement.setAttribute("dir", safeDir);
    }

    function updateActive(code) {
        items.forEach(item => {
            const active = item.dataset.code === code;
            item.classList.toggle("active", active);

            const oldCheck = item.querySelector(".check-icon");
            if (oldCheck) oldCheck.remove();

            if (active) {
                const check = document.createElement("i");
                check.className = "fas fa-check check-icon";
                check.setAttribute("aria-hidden", "true");
                item.appendChild(check);
            }
        });
    }

    function applyTexts(values) {
        Object.keys(baseTexts).forEach((id, index) => {
            if ($(id) && values[index]) {
                $(id).textContent = values[index];
            }
        });
    }

    function applyEnglish() {
        applyTexts(Object.values(baseTexts));
    }

    async function translateInterface(targetLanguage) {
        if (targetLanguage === "en") {
            applyEnglish();
            return;
        }

        const texts = Object.values(baseTexts);

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                texts,
                sourceLanguage: "en",
                targetLanguage
            })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.ok || !Array.isArray(data.translations)) {
            throw new Error(data.error || "Translation failed.");
        }

        const translated = data.translations.map(item =>
            item && typeof item.translatedText === "string"
                ? item.translatedText
                : ""
        );

        if (translated.length !== texts.length) {
            throw new Error("Incomplete translation response.");
        }

        applyTexts(translated);
    }

    async function selectLanguage(item, showFeedback = true) {
        if (busy) return;

        const code = item.dataset.code;
        const dir = item.dataset.dir || "ltr";

        setBusy(true);
        setStatus(showFeedback ? "Applying language…" : "", "loading");

        try {
            /*
             * Verify the selected language through HAVKAR's real
             * server-side Google Translation endpoint before saving it.
             */
            await translateInterface(code);

            localStorage.setItem(STORAGE_KEY, code);
            localStorage.setItem(STORAGE_DIR_KEY, dir);

            document.documentElement.lang = code;
            setDirection(dir);
            updateActive(code);

            /*
             * Compatibility keys for HAVKAR pages that may already
             * read a generic language preference.
             */
            localStorage.setItem("selectedLanguage", code);
            localStorage.setItem("language", code);

            setStatus("");
        } catch (error) {
            console.error("[HAVKAR Language]", error);
            setStatus(
                error && error.message
                    ? error.message
                    : "Unable to change language.",
                "error"
            );
        } finally {
            setBusy(false);
        }
    }

    async function initialize() {
        const selected = getSelectedLanguage();
        const item =
            items.find(el => el.dataset.code === selected) ||
            items.find(el => el.dataset.code === "en");

        const dir =
            localStorage.getItem(STORAGE_DIR_KEY) ||
            item?.dataset.dir ||
            "ltr";

        document.documentElement.lang = item?.dataset.code || "en";
        setDirection(dir);
        updateActive(item?.dataset.code || "en");

        if (item && item.dataset.code !== "en") {
            try {
                setBusy(true);
                setStatus("Loading language…", "loading");
                await translateInterface(item.dataset.code);
                setStatus("");
            } catch (error) {
                console.error("[HAVKAR Language init]", error);
                setStatus(
                    "Saved language could not be loaded. Please select it again.",
                    "error"
                );
            } finally {
                setBusy(false);
            }
        } else {
            applyEnglish();
        }
    }

    items.forEach(item => {
        item.addEventListener("click", () => selectLanguage(item, true));
    });

    initialize();
})();
</script>
</body>
</html>
