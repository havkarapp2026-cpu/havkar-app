<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#7cb342"
    >

    <title>HAVKAR - Language</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --green:#7cb342;
            --green-dark:#558b2f;
            --green-soft:#edf7e8;
            --bg:#f5f6f5;
            --white:#ffffff;
            --text:#292d27;
            --muted:#777d74;
            --border:#e7e9e5;
            --danger:#c62828;
            --shadow:0 6px 22px rgba(0,0,0,.07);
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:var(--bg);
            color:var(--text);

            min-height:100vh;
            padding-bottom:86px;
        }

        button{
            font-family:inherit;
            -webkit-tap-highlight-color:transparent;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header{
            position:sticky;
            top:0;
            z-index:20;

            min-height:72px;

            background:
                linear-gradient(
                    135deg,
                    #5f9632,
                    #7cb342
                );

            color:#fff;

            padding:14px 20px;

            display:flex;
            align-items:center;

            box-shadow:
                0 3px 14px rgba(61,96,33,.18);
        }

        .header-left{
            width:100%;

            display:flex;
            align-items:center;

            gap:15px;
        }

        .back-btn{
            width:42px;
            height:42px;

            flex:0 0 42px;

            border-radius:50%;

            border:
                1px solid
                rgba(255,255,255,.18);

            background:
                rgba(255,255,255,.12);

            color:#fff;

            font-size:1.25rem;

            cursor:pointer;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        .back-btn:active{
            transform:scale(.96);
        }

        .header h1{
            font-size:1.3rem;
            font-weight:800;

            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }

        /* =====================================================
           CONTENT
        ===================================================== */

        .content{
            max-width:820px;

            margin:0 auto;

            padding:24px 20px;
        }

        .section-title{
            font-size:.86rem;
            font-weight:800;

            color:#92978f;

            text-transform:uppercase;
            letter-spacing:1px;

            margin:12px 0 14px;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .status{
            display:none;

            align-items:center;

            gap:10px;

            padding:12px 14px;

            margin-bottom:14px;

            border-radius:12px;

            font-size:.88rem;
            line-height:1.45;
        }

        .status.show{
            display:flex;
        }

        .status.loading{
            background:#f2f7ee;
            color:#4f6d3d;
        }

        .status.error{
            background:#fff0f0;
            color:var(--danger);
        }

        /* =====================================================
           LANGUAGE LIST
        ===================================================== */

        .language-list{
            background:#fff;

            border-radius:18px;

            overflow:hidden;

            border:1px solid var(--border);

            box-shadow:var(--shadow);
        }

        .language-item{
            width:100%;

            min-height:64px;

            border:0;

            border-bottom:
                1px solid #f0f1ef;

            background:#fff;

            color:var(--text);

            padding:15px 20px;

            display:flex;
            align-items:center;

            gap:14px;

            text-align:start;

            cursor:pointer;

            transition:
                background .18s ease,
                transform .18s ease;
        }

        .language-item:last-child{
            border-bottom:0;
        }

        .language-item:hover{
            background:#fafbfa;
        }

        .language-item:active{
            transform:scale(.995);
        }

        .language-item.active{
            background:var(--green-soft);
        }

        .language-info{
            flex:1;
            min-width:0;
        }

        .language-name{
            display:block;

            font-size:1rem;

            font-weight:750;

            color:#333;

            line-height:1.4;
        }

        .check-icon{
            flex:0 0 auto;

            color:var(--green);

            font-size:1.18rem;
        }

        /* =====================================================
           KURDISH GROUP
        ===================================================== */

        .language-group{
            border-bottom:
                1px solid #f0f1ef;

            background:#fff;
        }

        .language-group:last-child{
            border-bottom:0;
        }

        .language-group-header{
            width:100%;

            min-height:64px;

            border:0;

            background:#fff;

            color:var(--text);

            padding:15px 20px;

            display:flex;
            align-items:center;

            gap:14px;

            text-align:start;

            cursor:pointer;
        }

        .language-group-header:hover{
            background:#fafbfa;
        }

        .language-group-header.active{
            background:var(--green-soft);
        }

        .language-group-title{
            flex:1;

            font-size:1rem;

            font-weight:800;

            color:#333;
        }

        .group-arrow{
            color:#8d938b;

            transition:
                transform .2s ease;
        }

        .language-group.open
        .group-arrow{
            transform:rotate(180deg);
        }

        .language-variants{
            display:none;

            background:#fafcf9;

            border-top:
                1px solid #edf0eb;
        }

        .language-group.open
        .language-variants{
            display:block;
        }

        .language-variant{
            width:100%;

            min-height:60px;

            border:0;

            border-bottom:
                1px solid #edf0eb;

            background:#fafcf9;

            color:var(--text);

            padding:14px 24px 14px 42px;

            display:flex;
            align-items:center;

            gap:12px;

            text-align:start;

            cursor:pointer;
        }

        html[dir="rtl"]
        .language-variant{
            padding:
                14px 42px
                14px 24px;
        }

        .language-variant:last-child{
            border-bottom:0;
        }

        .language-variant:hover{
            background:#f5f9f2;
        }

        .language-variant.active{
            background:#edf7e8;
        }

        .language-variant-name{
            flex:1;

            font-size:.96rem;

            font-weight:700;
        }

        /* =====================================================
           INFO CARD
        ===================================================== */

        .info-card{
            background:#fff;

            border:
                1px solid
                var(--border);

            border-radius:16px;

            padding:18px;

            margin-top:18px;

            box-shadow:
                0 4px 16px
                rgba(0,0,0,.045);
        }

        .info-title{
            font-size:.98rem;

            font-weight:800;

            color:#333;

            margin-bottom:9px;

            display:flex;
            align-items:center;

            gap:9px;
        }

        .info-title i{
            color:var(--green);
        }

        .info-text{
            font-size:.88rem;

            color:#6d726a;

            line-height:1.6;
        }

        /* =====================================================
           BOTTOM NAV
        ===================================================== */

        .bottom-nav{
            position:fixed;

            bottom:0;
            left:0;
            right:0;

            z-index:30;

            background:
                rgba(255,255,255,.98);

            display:flex;

            justify-content:space-around;

            padding:
                10px 0
                calc(
                    10px +
                    env(safe-area-inset-bottom)
                );

            box-shadow:
                0 -3px 14px
                rgba(0,0,0,.08);
        }

        .nav-item{
            min-width:70px;

            display:flex;

            flex-direction:column;

            align-items:center;

            gap:5px;

            color:#999;

            font-size:.75rem;

            cursor:pointer;
        }

        .nav-item.active{
            color:var(--green);
        }

        .nav-item i{
            font-size:1.3rem;
        }

        /* =====================================================
           RTL
        ===================================================== */

        html[dir="rtl"]
        .header-left{
            direction:rtl;
        }

        html[dir="rtl"]
        .language-item,
        html[dir="rtl"]
        .language-group-header,
        html[dir="rtl"]
        .language-variant{
            text-align:right;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width:600px){

            .header{
                min-height:66px;

                padding:12px 15px;
            }

            .content{
                padding:20px 14px;
            }

            .language-item,
            .language-group-header{
                padding:
                    15px 16px;
            }

            .language-variant{
                padding:
                    14px 20px
                    14px 36px;
            }

            html[dir="rtl"]
            .language-variant{
                padding:
                    14px 36px
                    14px 20px;
            }

        }

        /* =====================================================
           ACCESSIBILITY
        ===================================================== */

        button:focus-visible{
            outline:
                3px solid
                rgba(124,179,66,.28);

            outline-offset:2px;
        }

    </style>
</head>

<body>

<header class="header">

    <div class="header-left">

        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
            aria-label="Back"
        >
            <i class="fas fa-arrow-left"></i>
        </button>

        <h1 id="pageTitle">
            Language
        </h1>

    </div>

</header>


<main class="content">

    <div
        class="section-title"
        id="sectionTitle"
    >
        Select Your Language
    </div>


    <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
    ></div>


    <div
        class="language-list notranslate"
        id="languageList"
        translate="no"
        data-i18n-ignore
    >
    </div>


    <section class="info-card">

        <div class="info-title">

            <i class="fas fa-circle-info"></i>

            <span id="infoTitle">
                Language Settings
            </span>

        </div>


        <div
            class="info-text"
            id="infoText"
        >
            Choose your preferred HAVKAR language.
            Your preference is saved automatically
            on this device.
        </div>

    </section>

</main>


<nav class="bottom-nav">

    <div
        class="nav-item"
        onclick="goTo('index.html')"
    >

        <i class="fas fa-home"></i>

        <span id="navHome">
            Home
        </span>

    </div>


    <div class="nav-item active">

        <i class="fas fa-language"></i>

        <span id="navLanguage">
            Language
        </span>

    </div>


    <div
        class="nav-item"
        onclick="goTo('profile.html')"
    >

        <i class="fas fa-user"></i>

        <span id="navProfile">
            Profile
        </span>

    </div>

</nav>


<!-- =========================================================
     HAVKAR CENTRAL LANGUAGE SYSTEM
========================================================= -->

<script src="/havkar-i18n.js"></script>


<script>

(() => {

    "use strict";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const languageList =
        document.getElementById(
            "languageList"
        );


    const status =
        document.getElementById(
            "status"
        );


    let changingLanguage =
        false;


    /* =====================================================
       NAVIGATION
    ===================================================== */

    window.goTo =
    function(page){

        window.location.href =
            page;

    };


    window.goBack =
    function(){

        if(
            document.referrer &&
            document.referrer !==
            window.location.href
        ){

            history.back();

            return;

        }


        window.location.href =
            "profile.html";

    };


    /* =====================================================
       STATUS
    ===================================================== */

    function clearStatus(){

        if(!status){

            return;

        }


        status.textContent =
            "";


        status.className =
            "status";

    }


    function showStatus(
        message,
        type
    ){

        if(!status){

            return;

        }


        status.textContent =
            message;


        status.className =
            "status show " +
            (
                type ||
                "loading"
            );

    }


    /* =====================================================
       CENTRAL I18N
    ===================================================== */

    function getI18n(){

        return (
            window.HAVKAR_I18N ||
            null
        );

    }


    /* =====================================================
       CREATE CHECK ICON
    ===================================================== */

    function createCheckIcon(){

        const check =
            document.createElement(
                "i"
            );


        check.className =
            "fas fa-check check-icon";


        check.setAttribute(
            "aria-hidden",
            "true"
        );


        return check;

    }


    /* =====================================================
       CREATE NORMAL LANGUAGE
    ===================================================== */

    function createLanguageButton(
        language,
        currentLanguage
    ){

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "language-item";


        button.dataset.code =
            language.code;


        button.dataset.dir =
            language.dir ||
            "ltr";


        button.setAttribute(
            "translate",
            "no"
        );


        button.setAttribute(
            "data-i18n-ignore",
            ""
        );


        const info =
            document.createElement(
                "span"
            );


        info.className =
            "language-info";


        const name =
            document.createElement(
                "span"
            );


        name.className =
            "language-name";


        name.textContent =
            language.name;


        name.setAttribute(
            "translate",
            "no"
        );


        info.appendChild(
            name
        );


        button.appendChild(
            info
        );


        if(
            language.code ===
            currentLanguage
        ){

            button.classList.add(
                "active"
            );


            button.appendChild(
                createCheckIcon()
            );

        }


        button.addEventListener(
            "click",
            function(){

                selectLanguage(
                    language.code
                );

            }
        );


        return button;

    }


    /* =====================================================
       CREATE KURDISH VARIANT
    ===================================================== */

    function createVariantButton(
        variant,
        currentLanguage
    ){

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "language-variant";


        button.dataset.code =
            variant.code;


        button.dataset.dir =
            variant.dir ||
            "ltr";


        button.setAttribute(
            "translate",
            "no"
        );


        button.setAttribute(
            "data-i18n-ignore",
            ""
        );


        const name =
            document.createElement(
                "span"
            );


        name.className =
            "language-variant-name";


        name.textContent =
            variant.name;


        name.setAttribute(
            "translate",
            "no"
        );


        button.appendChild(
            name
        );


        if(
            variant.code ===
            currentLanguage
        ){

            button.classList.add(
                "active"
            );


            button.appendChild(
                createCheckIcon()
            );

        }


        button.addEventListener(
            "click",
            function(event){

                event.stopPropagation();


                selectLanguage(
                    variant.code
                );

            }
        );


        return button;

    }


    /* =====================================================
       CREATE LANGUAGE GROUP
    ===================================================== */

    function createLanguageGroup(
        language,
        currentLanguage
    ){

        const group =
            document.createElement(
                "div"
            );


        group.className =
            "language-group";


        const containsCurrent =
            language.variants.some(
                function(variant){

                    return (
                        variant.code ===
                        currentLanguage
                    );

                }
            );


        if(containsCurrent){

            group.classList.add(
                "open"
            );

        }


        const header =
            document.createElement(
                "button"
            );


        header.type =
            "button";


        header.className =
            "language-group-header";


        if(containsCurrent){

            header.classList.add(
                "active"
            );

        }


        header.setAttribute(
            "translate",
            "no"
        );


        header.setAttribute(
            "data-i18n-ignore",
            ""
        );


        const title =
            document.createElement(
                "span"
            );


        title.className =
            "language-group-title";


        title.textContent =
            language.name;


        title.setAttribute(
            "translate",
            "no"
        );


        const arrow =
            document.createElement(
                "i"
            );


        arrow.className =
            "fas fa-chevron-down group-arrow";


        arrow.setAttribute(
            "aria-hidden",
            "true"
        );


        header.appendChild(
            title
        );


        header.appendChild(
            arrow
        );


        const variants =
            document.createElement(
                "div"
            );


        variants.className =
            "language-variants";


        language.variants.forEach(
            function(variant){

                variants.appendChild(
                    createVariantButton(
                        variant,
                        currentLanguage
                    )
                );

            }
        );


        header.addEventListener(
            "click",
            function(){

                group.classList.toggle(
                    "open"
                );

            }
        );


        group.appendChild(
            header
        );


        group.appendChild(
            variants
        );


        return group;

    }


    /* =====================================================
       BUILD LANGUAGE LIST
    ===================================================== */

    function buildLanguageList(){

        const i18n =
            getI18n();


        if(
            !languageList ||
            !i18n ||
            typeof i18n.getLanguages !==
            "function"
        ){

            showStatus(
                "HAVKAR language system is not available.",
                "error"
            );

            return false;

        }


        const languages =
            i18n.getLanguages();


        const currentLanguage =
            typeof i18n.getLanguage ===
            "function"
            ?
            i18n.getLanguage()
            :
            "en";


        languageList.innerHTML =
            "";


        languages.forEach(
            function(language){

                if(
                    Array.isArray(
                        language.variants
                    ) &&
                    language.variants.length
                ){

                    languageList.appendChild(
                        createLanguageGroup(
                            language,
                            currentLanguage
                        )
                    );


                    return;

                }


                if(
                    language.selectable ===
                    false
                ){

                    return;

                }


                languageList.appendChild(
                    createLanguageButton(
                        language,
                        currentLanguage
                    )
                );

            }
        );


        return true;

    }


    /* =====================================================
       SELECT LANGUAGE
    ===================================================== */

    async function selectLanguage(
        languageCode
    ){

        if(changingLanguage){

            return;

        }


        const i18n =
            getI18n();


        if(
            !i18n ||
            typeof i18n.setLanguage !==
            "function" ||
            typeof i18n.isSupportedLanguage !==
            "function"
        ){

            showStatus(
                "HAVKAR language system is not available.",
                "error"
            );

            return;

        }


        if(
            !i18n.isSupportedLanguage(
                languageCode
            )
        ){

            showStatus(
                "This language is not supported.",
                "error"
            );

            return;

        }


        changingLanguage =
            true;


        showStatus(
            "Applying language…",
            "loading"
        );


        try{

            /*
             * The central HAVKAR language engine owns:
             *
             * - language validation
             * - language persistence
             * - RTL/LTR direction
             * - compatibility storage keys
             * - page translation
             * - reload behaviour
             *
             * language.html intentionally does not
             * duplicate that logic.
             */

            await Promise.resolve(
                i18n.setLanguage(
                    languageCode
                )
            );

        }
        catch(error){

            console.error(
                "[HAVKAR Language]",
                error
            );


            changingLanguage =
                false;


            showStatus(
                error &&
                error.message
                ?
                error.message
                :
                "Unable to change language.",
                "error"
            );

        }

    }


    /* =====================================================
       APPLY CURRENT DIRECTION
    ===================================================== */

    function applyCurrentDirection(){

        const i18n =
            getI18n();


        if(!i18n){

            return;

        }


        const language =
            typeof i18n.getLanguage ===
            "function"
            ?
            i18n.getLanguage()
            :
            "en";


        const direction =
            typeof i18n.getDirection ===
            "function"
            ?
            i18n.getDirection(
                language
            )
            :
            "ltr";


        document.documentElement.lang =
            language;


        document.documentElement.dir =
            direction === "rtl"
            ?
            "rtl"
            :
            "ltr";

    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    function initialize(){

        const i18n =
            getI18n();


        if(!i18n){

            return false;

        }


        applyCurrentDirection();


        const built =
            buildLanguageList();


        if(built){

            clearStatus();

        }


        return built;

    }


    /* =====================================================
       I18N READY EVENT
    ===================================================== */

    document.addEventListener(
        "havkar:i18n-ready",
        function(){

            initialize();

        }
    );


    /* =====================================================
       START
    ===================================================== */

    if(
        document.readyState ===
        "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            function(){

                if(!initialize()){

                    window.setTimeout(
                        initialize,
                        150
                    );

                }

            },
            {
                once:true
            }
        );

    }
    else{

        if(!initialize()){

            window.setTimeout(
                initialize,
                150
            );

        }

    }

})();

</script>

</body>
</html>
