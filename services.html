<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAVKAR - Services</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f5f6f4;
    color: #292929;
    min-height: 100vh;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

input,
select,
textarea {
    outline: none;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;

    width: 100%;

    background:
        linear-gradient(
            135deg,
            #689f38 0%,
            #7cb342 55%,
            #8bc34a 100%
        );

    color: white;

    padding:
        calc(13px + env(safe-area-inset-top))
        18px
        13px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    box-shadow:
        0 3px 14px rgba(0,0,0,.14);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
}

.back-btn {
    width: 44px;
    height: 44px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.18);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;

    transition: .2s;
}

.back-btn:active {
    transform: scale(.92);
}

.header-title {
    font-size: 21px;
    font-weight: 800;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 9px;
}

.header-icon {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.18);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 17px;

    position: relative;

    transition: .2s;
}

.header-icon:active {
    transform: scale(.92);
}

.notification-badge {
    position: absolute;

    top: -2px;
    right: -2px;

    min-width: 19px;
    height: 19px;

    padding: 0 5px;

    background: #e53935;
    color: white;

    border-radius: 20px;

    font-size: 10px;
    font-weight: 800;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #7cb342;
}

/* =========================================================
   SEARCH AREA
========================================================= */

.search-area {
    background: white;

    padding: 16px 18px 14px;

    border-bottom: 1px solid #e7e7e7;
}

.search-wrapper {
    position: relative;
}

.search-icon {
    position: absolute;

    left: 17px;
    top: 50%;

    transform: translateY(-50%);

    color: #999;

    font-size: 17px;

    pointer-events: none;
}

.search-input {
    width: 100%;

    height: 52px;

    padding:
        0 48px
        0 46px;

    border: 2px solid #e1e1e1;

    border-radius: 28px;

    background: #fafafa;

    color: #333;

    font-size: 16px;

    transition: .2s;
}

.search-input:focus {
    border-color: #7cb342;
    background: white;

    box-shadow:
        0 0 0 4px rgba(124,179,66,.10);
}

.clear-search {
    position: absolute;

    right: 13px;
    top: 50%;

    transform: translateY(-50%);

    width: 32px;
    height: 32px;

    border: none;
    border-radius: 50%;

    background: #e8e8e8;

    color: #777;

    display: none;
    align-items: center;
    justify-content: center;
}

.clear-search.show {
    display: flex;
}

/* =========================================================
   CATEGORIES
========================================================= */

.categories-wrapper {
    background: white;

    border-bottom: 1px solid #e5e5e5;

    overflow: hidden;
}

.categories {
    display: flex;

    gap: 9px;

    overflow-x: auto;

    padding:
        12px 18px 14px;

    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category-btn {
    flex-shrink: 0;

    min-height: 40px;

    padding:
        8px 17px;

    border:
        1.5px solid #dedede;

    border-radius: 23px;

    background: white;

    color: #666;

    font-size: 14px;
    font-weight: 700;

    transition: .2s;
}

.category-btn:hover {
    border-color: #9ccc65;
}

.category-btn.active {
    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    border-color: #7cb342;

    color: white;

    box-shadow:
        0 4px 10px rgba(104,159,56,.22);
}

.category-btn:active {
    transform: scale(.96);
}

/* =========================================================
   CONTENT HEADER
========================================================= */

.content {
    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

    padding:
        20px
        18px
        110px;
}

.content-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 14px;
}

.content-title {
    font-size: 18px;
    font-weight: 800;
    color: #444;
}

.service-count {
    font-size: 14px;
    font-weight: 700;
    color: #689f38;
}

/* =========================================================
   SERVICE GRID
========================================================= */

.services-grid {
    display: grid;

    grid-template-columns: 1fr;

    gap: 15px;
}

/* =========================================================
   SERVICE CARD
========================================================= */

.service-card {
    position: relative;

    background: white;

    border-radius: 20px;

    padding: 19px;

    border: 1px solid #ededed;

    box-shadow:
        0 4px 18px rgba(0,0,0,.07);

    transition:
        transform .2s ease,
        box-shadow .2s ease;

    overflow: hidden;
}

.service-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.10);
}

.service-top {
    display: flex;

    align-items: flex-start;

    gap: 14px;

    margin-bottom: 14px;
}

.provider-avatar {
    width: 62px;
    height: 62px;

    min-width: 62px;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            #e8f5e9,
            #c5e1a5
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 29px;

    border: 1px solid #d7ebc5;
}

.service-main {
    flex: 1;
    min-width: 0;
}

.service-title {
    font-size: 17px;
    font-weight: 800;

    color: #292929;

    line-height: 1.3;

    padding-right: 34px;

    margin-bottom: 4px;
}

.provider-name {
    font-size: 14px;

    color: #707070;

    margin-bottom: 6px;
}

.rating {
    display: flex;
    align-items: center;

    gap: 5px;

    font-size: 13px;

    color: #689f38;

    font-weight: 700;
}

.rating i {
    font-size: 12px;
}

.save-btn {
    position: absolute;

    top: 18px;
    right: 18px;

    width: 40px;
    height: 40px;

    border:
        1px solid #e3e3e3;

    border-radius: 50%;

    background: white;

    color: #999;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;

    transition: .2s;
}

.save-btn:hover {
    color: #689f38;
    border-color: #b7d997;
}

.save-btn.saved {
    color: #689f38;
    background: #f1f8eb;
    border-color: #b7d997;
}

.service-details {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 12px;
}

.detail-item {
    display: inline-flex;

    align-items: center;

    gap: 6px;

    padding:
        7px 10px;

    border-radius: 10px;

    background: #f7f8f6;

    color: #666;

    font-size: 12px;

    font-weight: 600;
}

.detail-item i {
    color: #7cb342;
}

.service-description {
    color: #666;

    font-size: 14px;

    line-height: 1.55;

    margin-bottom: 17px;
}

.service-bottom {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    padding-top: 15px;

    border-top: 1px solid #eeeeee;
}

.price {
    color: #558b2f;

    font-size: 21px;

    font-weight: 900;

    white-space: nowrap;
}

.price small {
    color: #888;

    font-size: 12px;

    font-weight: 600;
}

.book-btn {
    min-width: 116px;

    min-height: 44px;

    padding:
        10px 18px;

    border: none;

    border-radius: 23px;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color: white;

    font-size: 14px;

    font-weight: 800;

    box-shadow:
        0 4px 12px rgba(104,159,56,.22);

    transition: .2s;
}

.book-btn:hover {
    filter: brightness(1.04);

    box-shadow:
        0 6px 15px rgba(104,159,56,.28);
}

.book-btn:active {
    transform: scale(.96);
}

/* =========================================================
   EMPTY
========================================================= */

.empty-message {
    display: none;

    background: white;

    border-radius: 20px;

    padding: 55px 25px;

    text-align: center;

    border: 1px solid #eee;
}

.empty-message.show {
    display: block;
}

.empty-message i {
    width: 70px;
    height: 70px;

    border-radius: 50%;

    background: #f0f5ec;

    color: #8ab85d;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 18px;

    font-size: 28px;
}

.empty-message h3 {
    font-size: 19px;

    margin-bottom: 7px;
}

.empty-message p {
    color: #888;

    font-size: 14px;

    line-height: 1.5;
}

/* =========================================================
   FAB
========================================================= */

.fab {
    position: fixed;

    right: 20px;

    bottom:
        calc(88px + env(safe-area-inset-bottom));

    width: 58px;
    height: 58px;

    border: none;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color: white;

    font-size: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 7px 22px rgba(104,159,56,.38);

    z-index: 80;

    transition: .2s;
}

.fab:hover {
    transform: translateY(-2px);
}

.fab:active {
    transform: scale(.93);
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height:
        calc(72px + env(safe-area-inset-bottom));

    padding-bottom:
        env(safe-area-inset-bottom);

    background: rgba(255,255,255,.97);

    border-top: 1px solid #e6e6e6;

    box-shadow:
        0 -4px 18px rgba(0,0,0,.08);

    display: flex;

    align-items: stretch;

    justify-content: space-around;

    z-index: 70;

    backdrop-filter: blur(12px);
}

.nav-item {
    flex: 1;

    max-width: 130px;

    border: none;

    background: transparent;

    color: #999;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-size: 11px;

    font-weight: 600;

    transition: .2s;
}

.nav-item i {
    font-size: 19px;
}

.nav-item.active {
    color: #7cb342;
}

.nav-item:active {
    transform: scale(.94);
}

/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.58);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    z-index: 300;

    backdrop-filter: blur(3px);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;

    max-width: 570px;

    max-height: 91vh;

    overflow-y: auto;

    background: white;

    border-radius: 24px;

    padding: 25px 21px 22px;

    position: relative;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    animation:
        modalIn .2s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    padding-right: 48px;

    margin-bottom: 21px;
}

.modal-title {
    font-size: 21px;

    font-weight: 900;

    color: #292929;
}

.modal-subtitle {
    margin-top: 5px;

    font-size: 13px;

    color: #888;

    line-height: 1.4;
}

.close-btn {
    position: absolute;

    top: 15px;
    right: 15px;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background: #f1f1f1;

    color: #555;

    font-size: 17px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.close-btn:hover {
    background: #e8e8e8;
}

/* =========================================================
   FORM
========================================================= */

.form-group {
    margin-bottom: 16px;
}

.form-label {
    display: block;

    margin-bottom: 7px;

    font-size: 14px;

    font-weight: 800;

    color: #444;
}

.form-control {
    width: 100%;

    min-height: 48px;

    padding:
        12px 14px;

    border:
        1.5px solid #dedede;

    border-radius: 12px;

    background: white;

    color: #333;

    font-size: 15px;

    transition: .2s;
}

.form-control:focus {
    border-color: #7cb342;

    box-shadow:
        0 0 0 4px rgba(124,179,66,.10);
}

textarea.form-control {
    min-height: 105px;

    resize: vertical;
}

.readonly {
    background: #f7f7f7;

    color: #666;
}

.submit-btn {
    width: 100%;

    min-height: 50px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color: white;

    font-size: 15px;

    font-weight: 800;

    margin-top: 4px;

    box-shadow:
        0 5px 15px rgba(104,159,56,.24);
}

.submit-btn:active {
    transform: scale(.98);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 50%;

    bottom:
        calc(88px + env(safe-area-inset-bottom));

    transform:
        translateX(-50%)
        translateY(20px);

    max-width: calc(100% - 35px);

    padding:
        12px 19px;

    background: #303030;

    color: white;

    border-radius: 25px;

    font-size: 13px;

    font-weight: 600;

    text-align: center;

    opacity: 0;

    pointer-events: none;

    transition: .25s;

    z-index: 500;
}

.toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 700px) {

    body {
        background: #eeeeee;
    }

    .header {
        padding-left: max(22px, calc((100vw - 1100px) / 2 + 18px));
        padding-right: max(22px, calc((100vw - 1100px) / 2 + 18px));
    }

    .search-area,
    .categories-wrapper {
        padding-left: max(0px, calc((100vw - 1100px) / 2));
        padding-right: max(0px, calc((100vw - 1100px) / 2));
    }

    .search-area {
        padding-top: 18px;
        padding-bottom: 16px;
    }

    .services-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .content {
        padding-top: 24px;
    }

    .bottom-nav {
        height: 70px;

        left: 50%;
        right: auto;

        transform: translateX(-50%);

        width: min(100%, 1100px);

        border-radius:
            18px 18px 0 0;
    }

    .fab {
        right:
            max(25px, calc((100vw - 1100px) / 2 + 20px));
    }
}

@media (min-width: 1000px) {

    .services-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .header {
        padding-left: 13px;
        padding-right: 13px;
    }

    .header-title {
        font-size: 19px;
    }

    .header-right {
        gap: 5px;
    }

    .header-icon {
        width: 38px;
        height: 38px;
    }

    .back-btn {
        width: 40px;
        height: 40px;
    }

    .content {
        padding-left: 13px;
        padding-right: 13px;
    }

    .service-card {
        padding: 15px;
    }

    .service-bottom {
        align-items: stretch;
        flex-direction: column;
    }

    .book-btn {
        width: 100%;
    }

    .price {
        font-size: 20px;
    }
}

</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-left">

        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
            aria-label="Back">

            <i class="fas fa-arrow-left"></i>

        </button>

        <div class="header-title">
            Services
        </div>

    </div>

    <div class="header-right">

        <button
            class="header-icon"
            type="button"
            onclick="goNotifications()"
            aria-label="Notifications">

            <i class="fas fa-bell"></i>

            <span
                class="notification-badge"
                id="notificationBadge">
                4
            </span>

        </button>

        <button
            class="header-icon"
            type="button"
            onclick="goProfile()"
            aria-label="Profile">

            <i class="fas fa-user"></i>

        </button>

    </div>

</header>


<!-- =========================================================
     SEARCH
========================================================= -->

<section class="search-area">

    <div class="search-wrapper">

        <i class="fas fa-search search-icon"></i>

        <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            placeholder="Search services..."
            aria-label="Search services">

        <button
            id="clearSearch"
            class="clear-search"
            type="button"
            onclick="clearSearch()"
            aria-label="Clear search">

            <i class="fas fa-times"></i>

        </button>

    </div>

</section>


<!-- =========================================================
     CATEGORIES
========================================================= -->

<section class="categories-wrapper">

    <div class="categories" id="categories">

        <button
            class="category-btn active"
            type="button"
            data-category="All">

            All

        </button>

        <button
            class="category-btn"
            type="button"
            data-category="Plumbing">

            Plumbing

        </button>

        <button
            class="category-btn"
            type="button"
            data-category="Electrical">

            Electrical

        </button>

        <button
            class="category-btn"
            type="button"
            data-category="Cleaning">

            Cleaning

        </button>

        <button
            class="category-btn"
            type="button"
            data-category="Carpentry">

            Carpentry

        </button>

        <button
            class="category-btn"
            type="button"
            data-category="Painting">

            Painting

        </button>

        <button
            class="category-btn"
            type="button"
            data-category="Moving">

            Moving

        </button>

    </div>

</section>


<!-- =========================================================
     CONTENT
========================================================= -->

<main class="content">

    <div class="content-header">

        <div class="content-title">
            Available Services
        </div>

        <div
            class="service-count"
            id="serviceCount">
            0 services
        </div>

    </div>


    <div
        class="services-grid"
        id="servicesContainer">
    </div>


    <!-- EMPTY SEARCH RESULT -->

    <div
        class="empty-message"
        id="emptyMessage">

        <i class="fas fa-magnifying-glass"></i>

        <h3>
            No services found
        </h3>

        <p>
            Try another search or choose a different category.
        </p>

    </div>

</main>


<!-- =========================================================
     OFFER SERVICE FAB
========================================================= -->

<button
    class="fab"
    type="button"
    onclick="openOfferService()"
    aria-label="Offer a service">

    <i class="fas fa-plus"></i>

</button>


<!-- =========================================================
     BOTTOM NAVIGATION
========================================================= -->

<nav class="bottom-nav">

    <button
        class="nav-item"
        type="button"
        onclick="goHome()">

        <i class="fas fa-home"></i>

        <span>
            Home
        </span>

    </button>

    <button
        class="nav-item active"
        id="navSearch"
        type="button"
        onclick="focusSearch()">

        <i class="fas fa-search"></i>

        <span>
            Search
        </span>

    </button>

    <button
        class="nav-item"
        id="navSaved"
        type="button"
        onclick="showSavedServices()">

        <i class="fas fa-bookmark"></i>

        <span>
            Saved
        </span>

    </button>

    <button
        class="nav-item"
        type="button"
        onclick="goMessages()">

        <i class="fas fa-comment"></i>

        <span>
            Messages
        </span>

    </button>

    <button
        class="nav-item"
        type="button"
        onclick="goProfile()">

        <i class="fas fa-user"></i>

        <span>
            Profile
        </span>

    </button>

</nav>


<!-- =========================================================
     BOOKING MODAL
========================================================= -->

<div
    class="modal"
    id="bookingModal"
    role="dialog"
    aria-modal="true">

    <div class="modal-box">

        <button
            class="close-btn"
            type="button"
            onclick="closeModal('bookingModal')"
            aria-label="Close">

<script>

/* =========================================================

const SUPABASE_URL =

const SUPABASE_ANON_KEY =

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

let selectedCategory = "All";
let currentUser = null;
let services = [];
let savedServiceIds = new Set();
let showingSavedOnly = false;
let selectedBookingService = null;
let toastTimer = null;

const searchInput =

const servicesContainer =

/* =========================================================
   STARTUP
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        createBookingDates();
        bindCategoryButtons();
        bindSearch();
        bindForms();

        const {
            data: { user },
            error: authError
        } = await db.auth.getUser();

        if (!authError) {

            loadSavedBookmarks(),

);


/* =========================================================
   SEARCH
========================================================= */

function bindSearch() {

    searchInput.addEventListener(
        "input",
        function() {

            showingSavedOnly = false;
            updateClearSearchButton();
            renderServices();

        }
    );

}


function updateClearSearchButton() {

    if (searchInput.value.trim()) {

        clearSearchButton.classList.add("show");

    } else {

        clearSearchButton.classList.remove("show");

    }

}


function clearSearch() {

    searchInput.value = "";

    updateClearSearchButton();

}


/* =========================================================
   CATEGORY
========================================================= */

function bindCategoryButtons() {

    document
        .querySelectorAll(".category-btn")
        .forEach(function(button) {

            button.addEventListener(
                "click",

                    selectedCategory =
                        button.dataset.category || "All";

                    showingSavedOnly = false;

                    document
                        .querySelectorAll(".category-btn")
                        .forEach(function(btn) {
                            btn.classList.remove("active");
                        });

                    button.classList.add("active");
                    renderServices();

                }
            );

        });

}


/* =========================================================
   AUTH
========================================================= */

async function requireUser() {

    if (currentUser) {
        return currentUser;
    }

    const {
        data: { user },
        error
    } = await db.auth.getUser();

    if (error || !user) {

        showToast("Please sign in to continue.");
        return null;

    }

    currentUser = user;
    return user;

}


/* =========================================================
   LOAD REAL SERVICES
========================================================= */

async function loadServices() {

    servicesContainer.innerHTML = "";

    const { data, error } = await db
        .from("services")
        .select(
            "id,created_at,updated_at,provider_id,title,category,description,price,currency,price_type,location,image_url,status"
        )
        .eq("status", "active")
        .order("created_at", { ascending: false })
        .limit(100);

    if (error) {

        console.error("Services load error:", error);
        services = [];
        renderServices();
        showToast("Could not load services.");
        return;

    }

    services = Array.isArray(data) ? data : [];
    renderServices();

}


/* =========================================================
   RENDER SERVICES
========================================================= */

function renderServices() {

    updateServicesBottomNav();

    const search =
        searchInput.value
            .toLowerCase()
            .trim();

    const visibleServices =
        services.filter(function(service) {

            const categoryMatch =
                selectedCategory === "All" ||
                service.category === selectedCategory;

            const searchableText = [
                service.title,
                service.category,
                service.description,
                service.location
            ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

            const searchMatch =
                !search || searchableText.includes(search);

            const savedMatch =
                !showingSavedOnly ||
                savedServiceIds.has(String(service.id));

            return (
                categoryMatch &&
                searchMatch &&
                savedMatch
            );

        });

    servicesContainer.innerHTML = "";

    visibleServices.forEach(function(service) {
        servicesContainer.appendChild(
            buildServiceCard(service)
        );
    });

    updateServiceCount(
        visibleServices.length,
        showingSavedOnly
    );

    const empty =
        document.getElementById("emptyMessage");

    if (visibleServices.length === 0) {
        empty.classList.add("show");
    } else {
        empty.classList.remove("show");
    }

}


function buildServiceCard(service) {

    const card =
        document.createElement("article");

    card.className = "service-card";
    card.dataset.serviceId = String(service.id);
    card.dataset.category = service.category || "";

    const saved =
        savedServiceIds.has(String(service.id));

    const providerName =
        service.provider_id === currentUser?.id
            ? getCurrentUserDisplayName()
            : "HAVKAR Provider";

    const priceText =
        formatServicePrice(service);

    const image =
        safeImageUrl(service.image_url);

    const avatarContent = image
        ? `<img src="${escapeAttribute(image)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:17px">`
        : "🛠️";

    card.innerHTML = `
        <button
            class="save-btn ${saved ? "saved" : ""}"
            type="button"
            aria-label="Save service">
            <i class="${saved ? "fas" : "far"} fa-bookmark"></i>
        </button>

        <div class="service-top">
            <div class="provider-avatar">
                ${avatarContent}
            </div>

            <div class="service-main">
                <div class="service-title">
                    ${escapeHtml(service.title || "Service")}
                </div>

                <div class="provider-name">
                    ${escapeHtml(providerName)}
                </div>

                <div class="rating">
                    <i class="fas fa-circle-check"></i>
                    Active Service
                </div>
            </div>
        </div>

        <div class="service-details">
            <div class="detail-item">
                <i class="fas fa-location-dot"></i>
                ${escapeHtml(service.location || "Location not specified")}
            </div>

            <div class="detail-item">
                <i class="fas fa-clock"></i>
                Available
            </div>
        </div>

        <div class="service-description">
            ${escapeHtml(service.description || "")}
        </div>

        <div class="service-bottom">
            <div class="price">
                ${escapeHtml(priceText)}
            </div>

            ${service.provider_id === currentUser?.id ? `
            <button
                class="book-btn owner-delete-btn"
                type="button"
                style="margin-right:10px;background:#fff;color:#d32f2f;border:1px solid #ef9a9a;box-shadow:none">
                Delete
            </button>` : ""}

            <button
                class="book-btn"
                type="button">
                Book Now
            </button>
        </div>
    `;

    card
        .querySelector(".save-btn")
        .addEventListener(
            "click",
            function() {
                toggleSave(service.id, this);
            }
        );

    const deleteButton =
        card.querySelector(".owner-delete-btn");

    if (deleteButton) {
        deleteButton.addEventListener(
            "click",
            function() {
                deleteOwnService(service.id, this);
            }
        );
    }

    card
        .querySelectorAll(".book-btn:not(.owner-delete-btn)")[0]
        .addEventListener(
            "click",
            function() {
                openBooking(service);
            }
        );

    return card;

}


function formatServicePrice(service) {

    const currency =
        service.currency || "EUR";

    const numeric =
        Number(service.price);

    let amount;

    if (Number.isFinite(numeric)) {

        try {
            amount = new Intl.NumberFormat(
                undefined,
                {
                    style: "currency",
                    currency: currency,
                    maximumFractionDigits: 2
                }
            ).format(numeric);
        } catch (_) {
            amount = `${numeric} ${currency}`;
        }

    } else {

        amount = service.price
            ? String(service.price)
            : "Price on request";

    }

    if (service.price_type) {
        return `${amount} / ${service.price_type}`;
    }

    return amount;

}


function updateServiceCount(
    count,
    savedMode = false
) {

    const element =
        document.getElementById("serviceCount");

    if (savedMode) {
        element.textContent =
            count === 1
                ? "1 saved"
                : count + " saved";
        return;
    }

    element.textContent =
        count === 1
            ? "1 service"
            : count + " services";

}


/* =========================================================
   BOOKING
========================================================= */

function openBooking(service) {

    selectedBookingService = service;

    document.getElementById(
        "bookingService"
    ).value = service.title || "";

    document.getElementById(
        "bookingProvider"
    ).value =
        service.provider_id === currentUser?.id
            ? getCurrentUserDisplayName()
            : "HAVKAR Provider";

    document.getElementById(
        "bookingPrice"
    ).value = formatServicePrice(service);

    document.getElementById(
        "bookingDate"
    ).value = "";

    document.getElementById(
        "bookingTime"
    ).value = "";

    document.getElementById(
        "bookingMessage"
    ).value = "";

    document
        .getElementById("bookingModal")
        .classList.add("show");

    document.body.style.overflow = "hidden";

}


function createBookingDates() {

    const select =
        document.getElementById("bookingDate");

    if (!select) {
        return;
    }

    while (select.options.length > 1) {
        select.remove(1);
    }

    const formatter =
        new Intl.DateTimeFormat(
            undefined,
            {
                weekday: "short",
                month: "short",
                day: "numeric"
            }
        );

    for (let i = 0; i < 14; i++) {

        const date = new Date();
        date.setHours(12, 0, 0, 0);
        date.setDate(date.getDate() + i);

        const value = [
            date.getFullYear(),
            String(date.getMonth() + 1).padStart(2, "0"),
            String(date.getDate()).padStart(2, "0")
        ].join("-");

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = formatter.format(date);
        select.appendChild(option);

    }

}


/* =========================================================
   FORMS
========================================================= */

function bindForms() {

    document
        .getElementById("bookingForm")
        .addEventListener(
            "submit",
            submitBooking
        );

    document
        .getElementById("offerForm")
        .addEventListener(

async function submitBooking(event) {

    event.preventDefault();

    const user = await requireUser();

    if (!user || !selectedBookingService) {
        return;
    }

    if (
        selectedBookingService.provider_id ===
        user.id
    ) {
        showToast("You cannot book your own service.");
        return;
    }

    const date =
        document.getElementById(
            "bookingDate"
        ).value;

    const time =
        document.getElementById(
            "bookingTime"
        ).value;

    const message =
        document.getElementById(
            "bookingMessage"
        ).value.trim();

    if (!date || !time) {
        showToast("Please select date and time.");
        return;
    }

    const submitButton =
        event.currentTarget.querySelector(
            '.submit-btn'
        );

    setButtonBusy(
        submitButton,
        true,
        "Booking..."
    );

    const { error } = await db
        .from("service_bookings")
        .insert({
            service_id:
                selectedBookingService.id,
            customer_id:
                user.id,
            provider_id:
                selectedBookingService.provider_id,
            booking_date:
                date,
            booking_time:
                time,
            message:
                message || null,
            status:
                "pending"
        });

    setButtonBusy(
        submitButton,
        false,
        "Confirm Booking"
    );

    if (error) {
        console.error("Booking error:", error);
        showToast("Could not create booking.");
        return;
    }

    closeModal("bookingModal");
    event.currentTarget.reset();
    selectedBookingService = null;

    showToast("Booking request sent successfully.");

}


/* =========================================================
   OFFER SERVICE
========================================================= */

function openOfferService() {

    document
        .getElementById("offerModal")
        .classList.add("show");

    document.body.style.overflow = "hidden";

}


async function submitService(event) {

    event.preventDefault();

    const user = await requireUser();

    if (!user) {
        return;
    }

    const title =
        document.getElementById(
            "newServiceName"
        ).value.trim();

    const category =
        document.getElementById(
            "newServiceCategory"
        ).value;

    const rawPrice =
        document.getElementById(
            "newServicePrice"
        ).value.trim();

    const location =
        document.getElementById(
            "newServiceLocation"
        ).value.trim();

    const description =
        document.getElementById(
            "newServiceDescription"
        ).value.trim();

    if (
        !title ||
        !category ||
        !rawPrice ||
        !location ||
        !description
    ) {
        showToast("Please fill in all fields.");
        return;
    }

    const parsedPrice =
        parsePriceInput(rawPrice);

    if (!parsedPrice) {
        showToast("Enter a valid price, for example 30 or €30 / hour.");
        return;
    }

    const submitButton =
        event.currentTarget.querySelector(
            '.submit-btn'
        );

    setButtonBusy(
        submitButton,
        true,
        "Publishing..."
    );

    const { data, error } = await db
        .from("services")
        .insert({
            provider_id:
                user.id,
            title:
                title,
            category:
                category,
            description:
                description,
            price:
                parsedPrice.amount,
            currency:
                "EUR",
            price_type:
                parsedPrice.priceType,
            location:
                location,
            status:
                "active"
        })
        .select(
            "id,created_at,updated_at,provider_id,title,category,description,price,currency,price_type,location,image_url,status"
        )
        .single();

    setButtonBusy(
        submitButton,
        false,
        "Publish Service"
    );

    if (error) {
        console.error("Publish service error:", error);
        showToast("Could not publish service.");
        return;
    }

    closeModal("offerModal");
    event.currentTarget.reset();
    showingSavedOnly = false;

    /* Reload from Supabase immediately so the newly published
       service appears without a browser refresh. */
    await loadServices();
    await loadSavedBookmarks();
    renderServices();

    showToast("Your service has been published.");

}


function parsePriceInput(value) {

    const normalized =
        String(value)
            .replace(",", ".")
            .trim();

    const match =
        normalized.match(/(\d+(?:\.\d{1,2})?)/);

    if (!match) {
        return null;
    }

    const amount = Number(match[1]);

    if (!Number.isFinite(amount) || amount < 0) {
        return null;
    }

    const lower = normalized.toLowerCase();

    let priceType = "fixed";

    if (lower.includes("hour")) {
        priceType = "hourly";
    } else if (lower.includes("day")) {
        priceType = "daily";
    } else if (lower.includes("job")) {
        priceType = "job";
    } else if (lower.includes("visit")) {
        priceType = "visit";
    }

    return {
        amount,
        priceType
    };

}


/* =========================================================
   REAL SAVED SERVICES
========================================================= */

async function loadSavedBookmarks() {

    savedServiceIds.clear();

    if (!currentUser) {
        renderServices();
        return;
    }

    const { data, error } = await db
        .from("service_saves")
        .select("service_id")
        .eq("user_id", currentUser.id);

    if (error) {
        console.error("Saved services load error:", error);
        return;
    }

    (data || []).forEach(function(row) {
        savedServiceIds.add(
            String(row.service_id)
        );
    });

    renderServices();

}


async function toggleSave(
    serviceId,
    button
) {

    const user = await requireUser();

    if (!user) {
        return;
    }

    const key = String(serviceId);
    const alreadySaved =
        savedServiceIds.has(key);

    button.disabled = true;

    let error = null;

    if (alreadySaved) {

        const result = await db
            .from("service_saves")
            .delete()
            .eq("user_id", user.id)
            .eq("service_id", serviceId);

        error = result.error;

    } else {

        const result = await db
            .from("service_saves")
            .insert({
                user_id: user.id,
                service_id: serviceId
            });

        error = result.error;

    }

    button.disabled = false;

    if (error) {
        console.error("Save service error:", error);
        showToast("Could not update saved service.");
        return;
    }

    if (alreadySaved) {
        savedServiceIds.delete(key);
        showToast("Service removed from saved.");
    } else {
        savedServiceIds.add(key);
        showToast("Service saved.");
    }

    renderServices();

}


function showSavedServices() {

    if (!currentUser) {
        showToast("Please sign in to view saved services.");
        return;
    }

    showingSavedOnly = true;
    updateServicesBottomNav();
    renderServices();

    if (savedServiceIds.size === 0) {
        showToast("You have no saved services.");
    } else {
        showToast("Showing your saved services.");
    }

}


/* =========================================================
   SERVICES NAV STATE + OWNER DELETE
========================================================= */

function updateServicesBottomNav() {

    const searchNav = document.getElementById("navSearch");
    const savedNav = document.getElementById("navSaved");

    if (searchNav) {
        searchNav.classList.toggle("active", !showingSavedOnly);
    }

    if (savedNav) {
        savedNav.classList.toggle("active", showingSavedOnly);
    }

}


async function deleteOwnService(serviceId, button) {

    const user = await requireUser();

    if (!user) {
        return;
    }

    const service = services.find(function(item) {
        return String(item.id) === String(serviceId);
    });

    if (!service || service.provider_id !== user.id) {
        showToast("You can only delete your own service.");
        return;
    }

    const confirmed = window.confirm(
        "Delete this service permanently?"
    );

    if (!confirmed) {
        return;
    }

    button.disabled = true;

    const { error } = await db
        .from("services")
        .delete()
        .eq("id", serviceId)
        .eq("provider_id", user.id);

    button.disabled = false;

    if (error) {
        console.error("Delete service error:", error);
        showToast("Could not delete service.");
        return;
    }

    savedServiceIds.delete(String(serviceId));
    await loadServices();
    await loadSavedBookmarks();
    renderServices();
    showToast("Service deleted.");

}


/* =========================================================
   REAL NOTIFICATION BADGE
========================================================= */

async function updateNotificationBadge() {

    const badge =
        document.getElementById(
            "notificationBadge"
        );

    if (!badge) {
        return;
    }

    if (!currentUser) {
        badge.style.display = "none";
        return;
    }

    const {
        count,
        error
    } = await db
        .from("notifications")
        .select("id", {
            count: "exact",
            head: true
        })
        .eq("user_id", currentUser.id)
        .eq("is_read", false);

    if (error) {
        console.error("Notification count error:", error);
        badge.style.display = "none";
        return;
    }

    const unread = count || 0;

    if (unread > 0) {
        badge.textContent =
            unread > 99 ? "99+" : unread;
        badge.style.display = "flex";
    } else {
        badge.style.display = "none";
    }

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(id) {

    const modal =
        document.getElementById(id);

    if (modal) {
        modal.classList.remove("show");
    }

    document.body.style.overflow = "";

}


document
    .querySelectorAll(".modal")
    .forEach(function(modal) {

        modal.addEventListener(
            "click",
            function(event) {

                if (event.target === modal) {
                    closeModal(modal.id);
                }

            }
        );

    });


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            document
                .querySelectorAll(".modal.show")
                .forEach(function(modal) {
                    closeModal(modal.id);
                });

        }

    }
);


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(
        function() {
            toast.classList.remove("show");
        },
        2500
    );

}


function setButtonBusy(
    button,
    busy,
    label
) {

    if (!button) {
        return;
    }

    if (!button.dataset.originalHtml) {
        button.dataset.originalHtml =
            button.innerHTML;
    }

    button.disabled = busy;

    if (busy) {
        button.textContent = label;
    } else {
        button.innerHTML =
            button.dataset.originalHtml;
    }

}

function getCurrentUserDisplayName() {

    const meta =
        currentUser?.user_metadata || {};

    return (
        meta.full_name ||
        meta.name ||
        meta.username ||
        currentUser?.email ||
        "You"
    );

}


function safeImageUrl(value) {

    if (!value) {
        return "";
    }

    try {
        const url = new URL(
            String(value),
            window.location.origin
        );

        if (
            url.protocol === "https:" ||
            url.protocol === "http:"
        ) {
            return url.href;
        }
    } catch (_) {}

    return "";

}


function escapeAttribute(text) {
    return escapeHtml(text);
}


function escapeHtml(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
