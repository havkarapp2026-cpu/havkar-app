<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAVKAR - Services</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f5f6f4;
    color: #303030;
    min-height: 100vh;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}


/* =========================================================
   HEADER
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;

    height: 70px;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    box-shadow:
        0 3px 14px rgba(0,0,0,.15);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.back-btn {
    width: 42px;
    height: 42px;

    border: none;
    background: rgba(255,255,255,.15);

    color: white;

    border-radius: 50%;

    font-size: 18px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.header-title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -.3px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 9px;
}

.header-icon {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.18);

    color: white;

    font-size: 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

.notification-badge {
    position: absolute;

    top: -2px;
    right: -2px;

    min-width: 18px;
    height: 18px;

    padding: 0 4px;

    border-radius: 20px;

    background: #d32f2f;
    color: white;

    font-size: 10px;
    font-weight: 800;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #689f38;
}


/* =========================================================
   SEARCH
========================================================= */

.search-section {
    background: white;

    padding: 15px 18px 12px;

    border-bottom: 1px solid #e8e8e8;
}

.search-wrapper {
    position: relative;
}

.search-icon {
    position: absolute;

    left: 16px;
    top: 50%;

    transform: translateY(-50%);

    color: #999;

    font-size: 16px;
}

.search-input {
    width: 100%;

    height: 48px;

    border: 2px solid #e1e1e1;
    border-radius: 25px;

    background: #fafafa;

    padding:
        0 45px
        0 45px;

    font-size: 15px;

    outline: none;

    transition: .2s;
}

.search-input:focus {
    border-color: #7cb342;
    background: white;
}

.clear-search {
    position: absolute;

    right: 13px;
    top: 50%;

    transform: translateY(-50%);

    width: 30px;
    height: 30px;

    border: none;
    border-radius: 50%;

    background: #eeeeee;

    color: #777;

    display: none;
}


/* =========================================================
   CATEGORIES
========================================================= */

.categories {
    background: white;

    display: flex;
    gap: 9px;

    overflow-x: auto;

    padding:
        4px 18px
        15px;

    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category-btn {
    flex-shrink: 0;

    border: 1.5px solid #dedede;

    background: white;

    color: #555;

    padding:
        9px 16px;

    border-radius: 22px;

    font-size: 13px;
    font-weight: 700;

    transition: .2s;
}

.category-btn:hover {
    border-color: #7cb342;
}

.category-btn.active {
    background: #7cb342;
    border-color: #7cb342;
    color: white;

    box-shadow:
        0 3px 8px rgba(124,179,66,.25);
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;

    padding:
        17px
        17px
        110px;
}

.results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 13px;
}

.results-title {
    font-size: 14px;
    font-weight: 700;
    color: #555;
}

.results-count {
    color: #7cb342;
    font-weight: 800;
}


/* =========================================================
   SERVICE CARD
========================================================= */

.service-card {
    background: white;

    border-radius: 18px;

    padding: 18px;

    margin-bottom: 14px;

    border: 1px solid #eeeeee;

    box-shadow:
        0 3px 14px rgba(0,0,0,.06);

    transition:
        transform .2s,
        box-shadow .2s;
}

.service-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 7px 22px rgba(0,0,0,.09);
}

.service-top {
    display: flex;
    align-items: flex-start;

    gap: 13px;
}

.provider-avatar {
    width: 58px;
    height: 58px;

    min-width: 58px;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #e8f5e9,
            #c5e1a5
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 26px;
}

.service-info {
    flex: 1;
    min-width: 0;
}

.service-title {
    font-size: 17px;
    font-weight: 800;

    color: #292929;

    line-height: 1.25;

    margin-bottom: 4px;
}

.provider-name {
    font-size: 13px;
    color: #666;

    margin-bottom: 6px;
}

.rating {
    display: inline-flex;
    align-items: center;

    gap: 4px;

    font-size: 12px;
    font-weight: 700;

    color: #689f38;
}

.favorite-btn {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    border: 1px solid #e4e4e4;

    background: white;

    color: #999;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    transition: .2s;
}

.favorite-btn.saved {
    color: #7cb342;
    background: #f1f8ed;
    border-color: #c5e1a5;
}


/* =========================================================
   SERVICE DETAILS
========================================================= */

.service-details {
    display: flex;
    flex-wrap: wrap;

    gap: 8px;

    margin:
        15px 0
        12px;
}

.detail-item {
    display: inline-flex;
    align-items: center;

    gap: 6px;

    background: #f7f7f7;

    border-radius: 9px;

    padding:
        7px 9px;

    font-size: 12px;

    color: #666;
}

.detail-item i {
    color: #7cb342;
}

.service-description {
    font-size: 13.5px;

    line-height: 1.55;

    color: #666;

    margin-bottom: 15px;
}


/* =========================================================
   SERVICE FOOTER
========================================================= */

.service-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    padding-top: 13px;

    border-top: 1px solid #eeeeee;
}

.price {
    color: #558b2f;

    font-size: 18px;

    font-weight: 900;
}

.price small {
    font-size: 11px;
    font-weight: 600;
    color: #888;
}

.book-btn {
    border: none;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color: white;

    padding:
        11px 18px;

    border-radius: 12px;

    font-size: 13px;

    font-weight: 800;

    box-shadow:
        0 4px 10px rgba(104,159,56,.22);
}


/* =========================================================
   EMPTY
========================================================= */

.empty-message {
    background: white;

    border-radius: 18px;

    padding: 65px 20px;

    text-align: center;

    color: #777;

    box-shadow:
        0 3px 14px rgba(0,0,0,.05);
}

.empty-message i {
    font-size: 42px;

    color: #bdbdbd;

    margin-bottom: 17px;
}

.empty-message h3 {
    color: #444;

    font-size: 18px;

    margin-bottom: 7px;
}

.empty-message p {
    font-size: 13px;
}


/* =========================================================
   FAB
========================================================= */

.fab-button {
    position: fixed;

    right: 18px;
    bottom: 88px;

    width: 58px;
    height: 58px;

    border: none;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color: white;

    font-size: 21px;

    box-shadow:
        0 6px 20px rgba(104,159,56,.35);

    z-index: 80;
}

.fab-label {
    position: absolute;

    right: 68px;
    top: 50%;

    transform: translateY(-50%);

    background: #333;

    color: white;

    padding:
        7px 10px;

    border-radius: 8px;

    font-size: 11px;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    transition: .2s;
}

.fab-button:hover .fab-label {
    opacity: 1;
}


/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 72px;

    background: white;

    display: flex;
    align-items: center;
    justify-content: space-around;

    box-shadow:
        0 -3px 15px rgba(0,0,0,.10);

    z-index: 100;
}

.nav-item {
    flex: 1;

    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 4px;

    color: #999;

    font-size: 11px;

    font-weight: 600;

    position: relative;
}

.nav-item i {
    font-size: 20px;
}

.nav-item.active {
    color: #7cb342;
}

.nav-item.active::before {
    content: "";

    position: absolute;

    top: 0;

    width: 35px;
    height: 3px;

    background: #7cb342;

    border-radius:
        0 0 5px 5px;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.62);

    display: none;

    align-items: flex-end;
    justify-content: center;

    padding: 0;

    z-index: 500;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 650px;

    max-height: 92vh;

    overflow-y: auto;

    background: white;

    border-radius:
        24px 24px 0 0;

    padding:
        25px 20px
        30px;

    position: relative;

    animation:
        modalUp .25s ease;
}

@keyframes modalUp {

    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }
}

.modal-title {
    font-size: 20px;

    font-weight: 900;

    margin-bottom: 20px;

    padding-right: 45px;
}

.close-btn {
    position: absolute;

    top: 15px;
    right: 15px;

    width: 40px;
    height: 40px;

    border: none;

    border-radius: 50%;

    background: #f1f1f1;

    color: #555;

    font-size: 16px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;

    font-size: 13px;

    font-weight: 800;

    margin-bottom: 7px;

    color: #444;
}

.form-control {
    width: 100%;

    min-height: 48px;

    border:
        1.5px solid #ddd;

    border-radius: 12px;

    background: white;

    padding:
        11px 13px;

    font-size: 14px;

    outline: none;

    transition: .2s;
}

.form-control:focus {
    border-color: #7cb342;

    box-shadow:
        0 0 0 3px rgba(124,179,66,.10);
}

textarea.form-control {
    min-height: 105px;
    resize: vertical;
}

.submit-btn {
    width: 100%;

    min-height: 50px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color: white;

    font-size: 15px;

    font-weight: 900;

    margin-top: 5px;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 88px;

    transform:
        translateX(-50%)
        translateY(20px);

    background: #303030;

    color: white;

    padding:
        12px 18px;

    border-radius: 25px;

    font-size: 13px;

    opacity: 0;

    pointer-events: none;

    transition: .3s;

    z-index: 1000;

    max-width: 90%;

    text-align: center;
}

.toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   RESPONSIVE DESKTOP
========================================================= */

@media (min-width: 700px) {

    .header {
        padding: 0 25px;
    }

    .content {
        padding:
            22px
            22px
            110px;
    }

    .modal {
        align-items: center;
        padding: 20px;
    }

    .modal-box {
        border-radius: 22px;
    }

    .bottom-nav {
        left: 50%;
        right: auto;

        transform: translateX(-50%);

        width: 100%;
        max-width: 900px;

        border-radius:
            18px 18px 0 0;
    }

    .fab-button {
        right:
            calc(
                50% - 430px
            );
    }
}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div class="header-left">

        <button
            class="back-btn"
            onclick="goBack()"
            aria-label="Back">

            <i class="fas fa-arrow-left"></i>

        </button>

        <div class="header-title">
            Services
        </div>

    </div>


    <div class="header-right">

        <button
            class="header-icon"
            onclick="goNotifications()"
            aria-label="Notifications">

            <i class="fas fa-bell"></i>

            <span
                class="notification-badge"
                id="notificationBadge">
                4
            </span>

        </button>


        <button
            class="header-icon"
            onclick="goProfile()"
            aria-label="Profile">

            <i class="fas fa-user"></i>

        </button>

    </div>

</header>


<!-- =======================================================
     SEARCH
======================================================= -->

<section class="search-section">

    <div class="search-wrapper">

        <i class="fas fa-search search-icon"></i>

        <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            placeholder="Search services..."
        >

        <button
            id="clearSearch"
            class="clear-search"
            onclick="clearSearch()"
            aria-label="Clear search">

            <i class="fas fa-times"></i>

        </button>

    </div>

</section>


<!-- =======================================================
     CATEGORIES
======================================================= -->

<section class="categories">

    <button
        class="category-btn active"
        data-category="All"
        onclick="selectCategory('All', this)">
        All
    </button>

    <button
        class="category-btn"
        data-category="Plumbing"
        onclick="selectCategory('Plumbing', this)">
        Plumbing
    </button>

    <button
        class="category-btn"
        data-category="Electrical"
        onclick="selectCategory('Electrical', this)">
        Electrical
    </button>

    <button
        class="category-btn"
        data-category="Cleaning"
        onclick="selectCategory('Cleaning', this)">
        Cleaning
    </button>

    <button
        class="category-btn"
        data-category="Carpentry"
        onclick="selectCategory('Carpentry', this)">
        Carpentry
    </button>

    <button
        class="category-btn"
        data-category="Painting"
        onclick="selectCategory('Painting', this)">
        Painting
    </button>

    <button
        class="category-btn"
        data-category="Moving"
        onclick="selectCategory('Moving', this)">
        Moving
    </button>

</section>


<!-- =======================================================
     CONTENT
======================================================= -->

<main class="content">

    <div class="results-header">

        <div class="results-title">
            Available Services
        </div>

        <div class="results-title">
            <span
                id="resultsCount"
                class="results-count">
                4
            </span>
            services
        </div>

    </div>


    <div id="servicesContainer">


        <!-- =================================================
             SERVICE 1
        ================================================== -->

        <article
            class="service-card"
            data-id="1"
            data-category="Plumbing"
            data-search="professional plumbing marco rossi plumber milan emergency repair installation">

            <div class="service-top">

                <div class="provider-avatar">
                    🔧
                </div>

                <div class="service-info">

                    <div class="service-title">
                        Professional Plumbing
                    </div>

                    <div class="provider-name">
                        Marco Rossi
                    </div>

                    <div class="rating">
                        ⭐ 4.8
                        <span style="color:#999;">
                            (127 reviews)
                        </span>
                    </div>

                </div>

                <button
                    class="favorite-btn"
                    onclick="toggleFavorite(this, event)"
                    aria-label="Save service">

                    <i class="far fa-bookmark"></i>

                </button>

            </div>


            <div class="service-details">

                <div class="detail-item">
                    <i class="fas fa-map-marker-alt"></i>
                    Milan, Italy
                </div>

                <div class="detail-item">
                    <i class="fas fa-clock"></i>
                    Available Now
                </div>

            </div>


            <div class="service-description">

                Expert plumber with 15+ years of experience.
                Repairs, installations and emergency services available 24/7.

            </div>


            <div class="service-footer">

                <div class="price">
                    €50
                    <small>/
