<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>HAVKAR</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header>
      <button id="back" type="button" hidden>Back</button>
      <h1>HAVKAR</h1>
    </header>
    <p id="notice" role="status"></p>

    <section data-screen="home">
      <p id="home-status">Sign in to use your HAVKAR account.</p>
      <p id="home-email"></p>
      <button id="open-language" type="button">Language</button>
      <button id="open-sign-in" type="button">Sign in</button>
      <button id="open-account" type="button" hidden>Account</button>
      <button id="open-capture" type="button">Camera and files</button>
    </section>

    <section data-screen="language" hidden>
      <h2 id="language-title">Language</h2>
      <div id="language-list"></div>
    </section>

    <section data-screen="sign-in" hidden>
      <form id="email-form">
        <label id="email-label" for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label id="password-label" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="email-sign-in" type="submit">Continue with email</button>
      </form>
      <button id="google-sign-in" type="button">Continue with Google</button>
      <button id="apple-sign-in" type="button">Continue with Apple</button>
    </section>

    <section data-screen="account" hidden>
      <button id="sign-out" type="button">Sign out</button>
      <form id="delete-form">
        <p id="delete-help">Type DELETE to permanently remove this HAVKAR account.</p>
        <input id="delete-confirm" name="confirm" type="text" autocomplete="off" inputmode="latin">
        <button id="delete-account" type="submit">Delete this account</button>
      </form>
    </section>

    <section data-screen="capture" hidden>
      <button id="take-photo" type="button">Take a photo</button>
      <button id="choose-file" type="button">Choose a file</button>
      <p id="preview-note">The selected file stays on this device.</p>
      <img id="preview" alt="" hidden>
      <input id="file-input" type="file" accept="image/*" hidden>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
