<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="description" content="HAVKAR listing details">
<title>HAVKAR — Listing</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
    --green-950:#0b3d16;
    --green-900:#12551b;
    --green-800:#1b5e20;
    --green-700:#2e7d32;
    --green-600:#43a047;
    --green-500:#4caf50;
    --green-100:#e8f5e9;
    --bg:#f4f7f4;
    --surface:#fff;
    --text:#202522;
    --text-2:#4d554f;
    --muted:#7b827d;
    --border:#e0e5e1;
    --red:#d32f2f;
    --red-bg:#ffebee;
    --shadow:0 5px 20px rgba(0,0,0,.08);
    --shadow-lg:0 12px 34px rgba(0,0,0,.13);
    --header:68px;
    --bottom:78px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:linear-gradient(180deg,#f7faf7 0%,var(--bg) 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom) + 25px);
    -webkit-font-smoothing:antialiased;
}

button{
    font:inherit;
    border:0;
    -webkit-tap-highlight-color:transparent;
}

button:focus-visible{
    outline:3px solid rgba(76,175,80,.28);
    outline-offset:2px;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:300;
    min-height:var(--header);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    color:#fff;
    background:linear-gradient(135deg,var(--green-900),var(--green-600));
    box-shadow:0 3px 16px rgba(0,0,0,.16);
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-left{
    min-width:0;
    gap:12px;
}

.header-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:1.18rem;
    font-weight:800;
}

.circle-button{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:#fff;
    background:rgba(255,255,255,.15);
    cursor:pointer;
    transition:.18s ease;
}

.circle-button:hover{
    background:rgba(255,255,255,.24);
}

.circle-button:active{
    transform:scale(.93);
}

.circle-button.saved{
    color:#e53935;
    background:#fff;
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:18px 14px 35px;
}

/* =========================================================
   LOADING
   ========================================================= */

.loading{
    min-height:55vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    gap:14px;
}

.loading i{
    color:var(--green-600);
    font-size:2rem;
}

/* =========================================================
   ERROR
   ========================================================= */

.error-box{
    display:none;
    margin:45px auto;
    max-width:520px;
    padding:30px 22px;
    text-align:center;
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.error-box.visible{
    display:block;
}

.error-icon{
    width:68px;
    height:68px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--red-bg);
    color:var(--red);
    font-size:1.6rem;
}

.error-title{
    margin-bottom:8px;
    font-size:1.15rem;
    font-weight:800;
}

.error-text{
    color:var(--muted);
    line-height:1.55;
    font-size:.9rem;
}

.back-market{
    margin-top:20px;
    padding:12px 20px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--green-700),var(--green-500));
    color:#fff;
    font-weight:750;
    cursor:pointer;
    box-shadow:0 7px 20px rgba(46,125,50,.2);
}

.back-market:active{
    transform:scale(.97);
}

/* =========================================================
   CONTENT
   ========================================================= */

.content{
    display:none;
}

.content.visible{
    display:block;
}

/* =========================================================
   PHOTO GALLERY
   ========================================================= */

.gallery{
    overflow:hidden;
    position:relative;
    background:#e9eeea;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.main-image-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1.15 / 1;
    background:linear-gradient(135deg,#e8ece9,#f8faf8);
}

.main-image{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    cursor:pointer;
}

.image-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a2aaa4;
    font-size:3rem;
}

.image-error{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:8px;
    color:#89918b;
    font-size:.82rem;
    text-align:center;
}

.image-error i{
    font-size:2rem;
}

.gallery-counter{
    position:absolute;
    right:12px;
    bottom:12px;
    padding:7px 11px;
    border-radius:20px;
    color:#fff;
    background:rgba(0,0,0,.62);
    font-size:.75rem;
    font-weight:700;
}

.gallery-save{
    position:absolute;
    top:12px;
    right:12px;
    z-index:10;
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,.96);
    color:#687069;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
    cursor:pointer;
    transition:.18s ease;
}

.gallery-save:hover{
    transform:scale(1.05);
}

.gallery-save:active{
    transform:scale(.94);
}

.gallery-save.saved{
    color:#d32f2f;
}

.thumbnails{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px;
    background:#fff;
    scrollbar-width:none;
}

.thumbnails::-webkit-scrollbar{
    display:none;
}

.thumbnail{
    flex:0 0 66px;
    width:66px;
    height:58px;
    overflow:hidden;
    padding:0;
    border:2px solid transparent;
    border-radius:10px;
    background:#eef1ee;
    cursor:pointer;
}

.thumbnail.active{
    border-color:var(--green-600);
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =========================================================
   DETAIL CARD
   ========================================================= */

.detail-card{
    margin-top:15px;
    padding:20px;
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.category{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border-radius:10px;
    background:var(--green-100);
    color:var(--green-800);
    font-size:.75rem;
    font-weight:750;
}

.title{
    margin-top:13px;
    font-size:1.35rem;
    line-height:1.3;
    font-weight:850;
    word-break:break-word;
}

.price{
    margin-top:10px;
    color:var(--green-800);
    font-size:1.5rem;
    font-weight:900;
}

.meta-list{
    margin-top:17px;
    display:flex;
    flex-direction:column;
    gap:11px;
}

.meta-row{
    display:flex;
    align-items:flex-start;
    gap:11px;
    color:var(--text-2);
    font-size:.88rem;
}

.meta-row i{
    width:21px;
    flex:0 0 21px;
    margin-top:2px;
    color:var(--green-600);
    text-align:center;
}

.description-title{
    margin-top:24px;
    margin-bottom:8px;
    font-size:1rem;
    font-weight:850;
}

.description{
    color:var(--text-2);
    line-height:1.65;
    font-size:.91rem;
    white-space:pre-wrap;
    word-break:break-word;
}

/* =========================================================
   SELLER
   ========================================================= */

.seller-card{
    margin-top:15px;
    padding:20px;
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.section-title{
    margin-bottom:15px;
    font-size:1rem;
    font-weight:850;
}

.seller-row{
    display:flex;
    align-items:center;
    gap:13px;
}

.seller-avatar{
    width:54px;
    height:54px;
    flex:0 0 54px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--green-100);
    color:var(--green-700);
    font-size:1.2rem;
}

.seller-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.seller-name{
    font-weight:800;
    word-break:break-word;
}

.seller-note{
    margin-top:3px;
    color:var(--muted);
    font-size:.78rem;
}

/* =========================================================
   ACTIONS
   ========================================================= */

.actions{
    position:sticky;
    bottom:calc(var(--bottom) + env(safe-area-inset-bottom));
    z-index:100;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
    padding:12px;
    background:rgba(247,250,247,.95);
    backdrop-filter:blur(15px);
    border-radius:18px;
}

.action-button{
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border-radius:14px;
    font-weight:800;
    cursor:pointer;
    transition:.18s ease;
}

.action-button:active{
    transform:scale(.97);
}

.action-button.primary{
    background:linear-gradient(135deg,var(--green-700),var(--green-500));
    color:#fff;
    box-shadow:0 7px 20px rgba(46,125,50,.22);
}

.action-button.secondary{
    background:#fff;
    color:var(--green-700);
    border:1px solid #dce5de;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:calc(var(--bottom) + 18px + env(safe-area-inset-bottom));
    z-index:1000;
    max-width:calc(100vw - 32px);
    padding:13px 18px;
    border-radius:13px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    color:#fff;
    background:#242824;
    font-size:.86rem;
    font-weight:650;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.22);
    transition:.2s ease;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:250;
    height:calc(var(--bottom) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;
    align-items:flex-start;
    justify-content:space-around;
    background:rgba(255,255,255,.98);
    backdrop-filter:blur(16px);
    box-shadow:0 -3px 16px rgba(0,0,0,.1);
}

.nav-item{
    flex:1;
    height:var(--bottom);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#929893;
    font-size:.70rem;
    font-weight:650;
    cursor:pointer;
    user-select:none;
}

.nav-item i{
    font-size:1.27rem;
}

.nav-item.active{
    color:var(--green-600);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(min-width:700px){

    .main{
        padding-left:22px;
        padding-right:22px;
    }

    .gallery{
        max-width:850px;
        margin:0 auto;
    }

    .detail-card,
    .seller-card{
        max-width:850px;
        margin-left:auto;
        margin-right:auto;
    }

    .actions{
        max-width:850px;
        margin-left:auto;
        margin-right:auto;
    }
}

@media(max-width:500px){

    .header{
        padding:10px 13px;
    }

    .header-title{
        font-size:1.12rem;
    }

    .circle-button{
        width:41px;
        height:41px;
    }

    .main{
        padding:13px 12px 30px;
    }

    .detail-card,
    .seller-card{
        padding:17px;
        border-radius:19px;
    }

    .title{
        font-size:1.22rem;
    }

    .price{
        font-size:1.35rem;
    }

    .actions{
        grid-template-columns:1fr 1fr;
        padding:10px;
    }

    .action-button{
        min-height:48px;
        font-size:.84rem;
    }
}

@media(max-width:360px){

    .actions{
        grid-template-columns:1fr;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        scroll-behavior:auto!important;
        transition-duration:.01ms!important;
        animation-duration:.01ms!important;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="circle-button"
            type="button"
            aria-label="Back"
        >
            <i class="fas fa-arrow-left"></i>
        </button>

        <h1 class="header-title">Listing</h1>

    </div>

    <div class="header-right">

        <button
            id="headerSave"
            class="circle-button"
            type="button"
            aria-label="Save listing"
            aria-pressed="false"
        >
            <i class="fas fa-heart"></i>
        </button>

    </div>

</header>

<main class="main">

    <div id="loading" class="loading">

        <i class="fas fa-spinner fa-spin"></i>

        <div>Loading listing...</div>

    </div>

    <section id="errorBox" class="error-box">

        <div class="error-icon">
            <i class="fas fa-circle-exclamation"></i>
        </div>

        <div class="error-title">
            Listing unavailable
        </div>

        <div id="errorText" class="error-text">
            This listing could not be loaded.
        </div>

        <button
            id="backMarketButton"
            class="back-market"
            type="button"
        >
            <i class="fas fa-arrow-left"></i>
            &nbsp; Back to Buy &amp; Sell
        </button>

    </section>

    <section id="content" class="content">

        <!-- =================================================
             GALLERY
             ================================================= -->

        <div class="gallery">

            <div class="main-image-wrap">

                <div
                    id="imagePlaceholder"
                    class="image-placeholder"
                >
                    <i class="fas fa-image"></i>
                </div>

                <div
                    id="imageError"
                    class="image-error"
                >
                    <i class="fas fa-image"></i>
                    <span>Image unavailable</span>
                </div>

                <img
                    id="mainImage"
                    class="main-image"
                    alt="Listing image"
                    style="display:none;"
                >

                <button
                    id="gallerySave"
                    class="gallery-save"
                    type="button"
                    aria-label="Save listing"
                    aria-pressed="false"
                >
                    <i class="fas fa-heart"></i>
                </button>

                <div
                    id="galleryCounter"
                    class="gallery-counter"
                    style="display:none;"
                >
                    1 / 1
                </div>

            </div>

            <div
                id="thumbnails"
                class="thumbnails"
                style="display:none;"
            ></div>

        </div>

        <!-- =================================================
             LISTING DETAILS
             ================================================= -->

        <section class="detail-card">

            <div id="category" class="category">

                <i class="fas fa-box"></i>

                <span>Other</span>

            </div>

            <h2 id="title" class="title">
                Loading...
            </h2>

            <div id="price" class="price">
                Price on request
            </div>

            <div class="meta-list">

                <div class="meta-row">

                    <i class="fas fa-location-dot"></i>

                    <span id="location">
                        Location not specified
                    </span>

                </div>

                <div class="meta-row">

                    <i class="fas fa-calendar"></i>

                    <span id="date">
                        —
                    </span>

                </div>

                <div class="meta-row">

                    <i class="fas fa-tag"></i>

                    <span id="listingId">
                        Listing ID: —
                    </span>

                </div>

            </div>

            <div class="description-title">
                Description
            </div>

            <div id="description" class="description">
                No description provided.
            </div>

        </section>

        <!-- =================================================
             SELLER
             ================================================= -->

        <section class="seller-card">

            <div class="section-title">
                Seller
            </div>

            <div class="seller-row">

                <div class="seller-avatar">

                    <i
                        id="sellerAvatarIcon"
                        class="fas fa-user"
                    ></i>

                    <img
                        id="sellerAvatar"
                        alt="Seller"
                    >

                </div>

                <div>

                    <div
                        id="sellerName"
                        class="seller-name"
                    >
                        HAVKAR Member
                    </div>

                    <div
                        id="sellerNote"
                        class="seller-note"
                    >
                        HAVKAR member
                    </div>

                </div>

            </div>

        </section>

        <!-- =================================================
             ACTIONS
             ================================================= -->

        <div class="actions">

            <button
                id="messageButton"
                class="action-button primary"
                type="button"
            >
                <i class="fas fa-comment"></i>
                <span>Message Seller</span>
            </button>

            <button
                id="saveButton"
                class="action-button secondary"
                type="button"
            >
                <i class="fas fa-heart"></i>
                <span>Save</span>
            </button>

        </div>

    </section>

</main>

<!-- =========================================================
     BOTTOM NAV
     ========================================================= -->

<nav class="bottom-nav">

    <div
        class="nav-item active"
        id="navHome"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-house"></i>
        <span>Home</span>
    </div>

    <div
        class="nav-item"
        id="navSearch"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-magnifying-glass"></i>
        <span>Search</span>
    </div>

    <div
        class="nav-item"
        id="navSaved"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-heart"></i>
        <span>Saved</span>
    </div>

    <div
        class="nav-item"
        id="navMessages"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-comment"></i>
        <span>Messages</span>
    </div>

    <div
        class="nav-item"
        id="navProfile"
        role="button"
        tabindex="0"
    >
        <i class="fas fa-user"></i>
        <span>Profile</span>
    </div>

</nav>

<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>

<script>
"use strict";

/* =========================================================
   HAVKAR — AD DETAILS
   FINAL PRODUCTION-READY FRONTEND
   ========================================================= */

const SUPABASE_URL =
    "https://gispovnciifgikvgpzck.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq";

let supabaseClient = null;

const state = {
    ad: null,
    photos: [],
    photoIndex: 0,
    saved: false,
    currentUserId: null,
    sellerProfile: null,
    initialized: false
};

const $ = id => document.getElementById(id);

/* =========================================================
   SUPABASE
   ========================================================= */

function initializeSupabase(){

    if(supabaseClient){
        return supabaseClient;
    }

    if(
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
    ){
        throw new Error(
            "Supabase library could not be loaded."
        );
    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth:{
                    persistSession:true,
                    autoRefreshToken:true,
                    detectSessionInUrl:true
                }
            }
        );

    return supabaseClient;
}

/* =========================================================
   HELPERS
   ========================================================= */

function showToast(message){

    const toast = $("toast");

    if(!toast){
        return;
    }

    toast.textContent =
        String(message || "");

    toast.classList.add("show");

    window.clearTimeout(
        showToast.timer
    );

    showToast.timer =
        window.setTimeout(
            () => {
                toast.classList.remove("show");
            },
            2600
        );
}

function getListingId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");

    return id
        ? id.trim()
        : null;
}

function normalizePhotos(value){

    if(!value){
        return [];
    }

    if(Array.isArray(value)){

        return value
            .filter(
                item =>
                    typeof item === "string" &&
                    item.trim()
            )
            .map(
                item => item.trim()
            );
    }

    if(typeof value === "string"){

        const trimmed =
            value.trim();

        if(!trimmed){
            return [];
        }

        try{

            const parsed =
                JSON.parse(trimmed);

            if(Array.isArray(parsed)){

                return parsed
                    .filter(
                        item =>
                            typeof item === "string" &&
                            item.trim()
                    )
                    .map(
                        item => item.trim()
                    );
            }

        }catch(_){}

        if(
            trimmed.startsWith("data:image/") ||
            trimmed.startsWith("http://") ||
            trimmed.startsWith("https://")
        ){

            return [trimmed];
        }
    }

    return [];
}

function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return "Price on request";
    }

    const numeric =
        Number(value);

    if(Number.isFinite(numeric)){

        return new Intl.NumberFormat(
            "en-US",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        ).format(numeric) + " €";
    }

    return String(value);
}

function formatDate(value){

    if(!value){
        return "—";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "—";
    }

    return new Intl.DateTimeFormat(
        undefined,
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ).format(date);
}

function getCategoryIcon(category){

    const text =
        String(category || "")
            .toLowerCase();

    if(
        text.includes("phone") ||
        text.includes("tablet")
    ){
        return "fa-mobile-screen";
    }

    if(text.includes("computer")){
        return "fa-laptop";
    }

    if(
        text.includes("vehicle") ||
        text.includes("car") ||
        text.includes("motor")
    ){
        return "fa-car";
    }

    if(text.includes("furniture")){
        return "fa-couch";
    }

    if(text.includes("kitchen")){
        return "fa-kitchen-set";
    }

    if(text.includes("restaurant")){
        return "fa-utensils";
    }

    if(text.includes("clothing")){
        return "fa-shirt";
    }

    if(text.includes("service")){
        return "fa-handshake";
    }

    if(text.includes("tool")){
        return "fa-screwdriver-wrench";
    }

    if(text.includes("food")){
        return "fa-basket-shopping";
    }

    return "fa-box";
}

/* =========================================================
   SAVED LISTINGS
   ========================================================= */

function getSavedStorageKey(){

    const userPart =
        state.currentUserId ||
        "guest";

    return (
        "havkar_saved_ads_v1:" +
        userPart
    );
}

function readSavedIds(){

    try{

        const raw =
            localStorage.getItem(
                getSavedStorageKey()
            );

        if(!raw){
            return new Set();
        }

        const parsed =
            JSON.parse(raw);

        if(!Array.isArray(parsed)){
            return new Set();
        }

        return new Set(
            parsed.map(
                item => String(item)
            )
        );

    }catch(error){

        console.warn(
            "[HAVKAR] Saved state read failed:",
            error
        );

        return new Set();
    }
}

function loadSavedState(){

    if(!state.ad){
        state.saved = false;
        updateSaveUI();
        return;
    }

    const savedIds =
        readSavedIds();

    state.saved =
        savedIds.has(
            String(state.ad.id)
        );

    updateSaveUI();
}

function persistSavedState(){

    if(!state.ad){
        return;
    }

    try{

        const ids =
            readSavedIds();

        const adId =
            String(state.ad.id);

        if(state.saved){
            ids.add(adId);
        }else{
            ids.delete(adId);
        }

        localStorage.setItem(
            getSavedStorageKey(),
            JSON.stringify(
                Array.from(ids)
            )
        );

    }catch(error){

        console.warn(
            "[HAVKAR] Saved state write failed:",
            error
        );

        showToast(
            "Your browser could not save this listing."
        );
    }
}

function updateSaveUI(){

    const topButtons = [
        $("headerSave"),
        $("gallerySave")
    ];

    topButtons.forEach(
        button => {

            if(!button){
                return;
            }

            button.classList.toggle(
                "saved",
                state.saved
            );

            button.setAttribute(
                "aria-pressed",
                state.saved
                    ? "true"
                    : "false"
            );

            button.setAttribute(
                "aria-label",
                state.saved
                    ? "Remove from Saved"
                    : "Save listing"
            );

            const icon =
                button.querySelector("i");

            if(icon){

                icon.className =
                    state.saved
                        ? "fas fa-heart"
                        : "far fa-heart";
            }
        }
    );

    const saveButton =
        $("saveButton");

    if(saveButton){

        const icon =
            saveButton.querySelector("i");

        const text =
            saveButton.querySelector("span");

        if(icon){

            icon.className =
                state.saved
                    ? "fas fa-heart"
                    : "far fa-heart";
        }

        if(text){

            text.textContent =
                state.saved
                    ? "Saved"
                    : "Save";
        }

        saveButton.setAttribute(
            "aria-pressed",
            state.saved
                ? "true"
                : "false"
        );
    }
}

function toggleSaved(){

    if(!state.ad){
        return;
    }

    state.saved =
        !state.saved;

    persistSavedState();

    updateSaveUI();

    showToast(
        state.saved
            ? "Saved listing"
            : "Removed from Saved"
    );
}

/* =========================================================
   AUTH
   ========================================================= */

async function resolveCurrentUser(){

    try{

        initializeSupabase();

        const result =
            await supabaseClient.auth.getUser();

        if(result.error){

            console.warn(
                "[HAVKAR] Auth lookup:",
                result.error
            );

            state.currentUserId = null;
            return;
        }

        state.currentUserId =
            result?.data?.user?.id ||
            null;

    }catch(error){

        console.warn(
            "[HAVKAR] Could not resolve current user:",
            error
        );

        state.currentUserId = null;
    }
}

/* =========================================================
   LISTING
   ========================================================= */

async function fetchListing(id){

    initializeSupabase();

    const result =
        await supabaseClient
            .from("ads")
            .select(
                "id,title,category,price,location,description,user_id,created_at,photos"
            )
            .eq(
                "id",
                id
            )
            .maybeSingle();

    if(result.error){
        throw result.error;
    }

    if(!result.data){

        throw new Error(
            "This listing could not be found."
        );
    }

    return result.data;
}

/* =========================================================
   SELLER PROFILE
   ========================================================= */

async function fetchSellerProfile(userId){

    if(!userId){
        return null;
    }

    initializeSupabase();

    try{

        const result =
            await supabaseClient
                .from("profiles")
                .select(
                    "id,full_name,avatar_url"
                )
                .eq(
                    "id",
                    userId
                )
                .maybeSingle();

        if(result.error){

            console.warn(
                "[HAVKAR] Seller profile unavailable:",
                result.error
            );

            return null;
        }

        return result.data || null;

    }catch(error){

        console.warn(
            "[HAVKAR] Seller profile request failed:",
            error
        );

        return null;
    }
}

/* =========================================================
   IMAGE ERROR HANDLING
   ========================================================= */

function resetMainImage(){

    const image =
        $("mainImage");

    const placeholder =
        $("imagePlaceholder");

    const errorBox =
        $("imageError");

    image.onload = null;
    image.onerror = null;

    image.removeAttribute("src");

    image.style.display =
        "none";

    placeholder.style.display =
        "flex";

    errorBox.style.display =
        "none";
}

function showPhoto(index){

    if(!state.photos.length){

        resetMainImage();

        $("galleryCounter").style.display =
            "none";

        return;
    }

    state.photoIndex =
        Math.max(
            0,
            Math.min(
                Number(index) || 0,
                state.photos.length - 1
            )
        );

    const url =
        state.photos[
            state.photoIndex
        ];

    const image =
        $("mainImage");

    const placeholder =
        $("imagePlaceholder");

    const errorBox =
        $("imageError");

    image.onload = () => {

        image.style.display =
            "block";

        placeholder.style.display =
            "none";

        errorBox.style.display =
            "none";
    };

    image.onerror = () => {

        image.style.display =
            "none";

        placeholder.style.display =
            "none";

        errorBox.style.display =
            "flex";
    };

    image.style.display =
        "none";

    placeholder.style.display =
        "flex";

    errorBox.style.display =
        "none";

    image.src =
        url;

    $("galleryCounter").style.display =
        "block";

    $("galleryCounter").textContent =
        (
            state.photoIndex + 1
        ) +
        " / " +
        state.photos.length;

    $("thumbnails")
        .querySelectorAll(".thumbnail")
        .forEach(
            (button, thumbnailIndex) => {

                button.classList.toggle(
                    "active",
                    thumbnailIndex ===
                    state.photoIndex
                );
            }
        );
}

function renderGallery(){

    const photos =
        normalizePhotos(
            state.ad?.photos
        );

    state.photos =
        photos;

    state.photoIndex =
        0;

    const thumbnails =
        $("thumbnails");

    thumbnails.innerHTML = "";

    if(!photos.length){

        thumbnails.style.display =
            "none";

        showPhoto(0);

        return;
    }

    if(photos.length === 1){

        thumbnails.style.display =
            "none";

    }else{

        thumbnails.style.display =
            "flex";

        photos.forEach(
            (url,index) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "thumbnail" +
                    (
                        index === 0
                            ? " active"
                            : ""
                    );

                button.setAttribute(
                    "aria-label",
                    "View image " +
                    (index + 1)
                );

                const image =
                    document.createElement(
                        "img"
                    );

                image.src =
                    url;

                image.alt =
                    "Listing image " +
                    (index + 1);

                image.loading =
                    "lazy";

                image.onerror = () => {

                    image.style.opacity =
                        "0.35";
                };

                button.appendChild(
                    image
                );

                button.addEventListener(
                    "click",
                    () => {
                        showPhoto(index);
                    }
                );

                thumbnails.appendChild(
                    button
                );
            }
        );
    }

    showPhoto(0);
}

/* =========================================================
   DISPLAY STATES
   ========================================================= */

function showContent(){

    $("loading").style.display =
        "none";

    $("errorBox")
        .classList.remove(
            "visible"
        );

    $("content")
        .classList.add(
            "visible"
        );
}

function showError(message){

    $("loading").style.display =
        "none";

    $("content")
        .classList.remove(
            "visible"
        );

    $("errorText").textContent =
        message ||
        "This listing could not be loaded.";

    $("errorBox")
        .classList.add(
            "visible"
        );
}

function getReadableError(error){

    const raw =
        String(
            error?.message ||
            error?.details ||
            error?.hint ||
            error ||
            ""
        ).trim();

    const status =
        Number(
            error?.status ||
            error?.statusCode ||
            0
        );

    if(
        status === 401 ||
        status === 403
    ){

        return (
            "HAVKAR could not access this listing. " +
            "Please check the Supabase access policy."
        );
    }

    if(status === 404){

        return (
            "The requested listing could not be found."
        );
    }

    if(
        /failed to fetch|network|fetch/i.test(
            raw
        )
    ){

        return (
            "HAVKAR could not connect to the server. " +
            "Please try again."
        );
    }

    if(
        /column .* does not exist/i.test(
            raw
        )
    ){

        return (
            "The listing database structure does not match HAVKAR."
        );
    }

    if(
        /relation .* does not exist|table .* does not exist/i.test(
            raw
        )
    ){

        return (
            "The required Supabase table could not be found."
        );
    }

    if(raw){
        return raw;
    }

    return (
        "HAVKAR could not load this listing."
    );
}

/* =========================================================
   SELLER MESSAGING
   ========================================================= */

async function findExistingConversation(){

    if(
        !state.ad ||
        !state.currentUserId ||
        !state.ad.user_id
    ){
        return null;
    }

    const result =
        await supabaseClient
            .from("conversations")
            .select(
                "id,ad_id,buyer_id,seller_id,created_at,updated_at"
            )
            .eq(
                "ad_id",
                state.ad.id
            )
            .eq(
                "buyer_id",
                state.currentUserId
            )
            .eq(
                "seller_id",
                state.ad.user_id
            )
            .maybeSingle();

    if(result.error){

        throw result.error;
    }

    return result.data?.id || null;
}

async function createConversation(){

    const result =
        await supabaseClient
            .from("conversations")
            .insert({
                ad_id:state.ad.id,
                buyer_id:state.currentUserId,
                seller_id:state.ad.user_id
            })
            .select(
                "id,ad_id,buyer_id,seller_id,created_at,updated_at"
            )
            .single();

    if(result.error){

        throw result.error;
    }

    return result.data?.id || null;
}

async function openSellerMessage(){

    if(!state.ad){
        return;
    }

    if(!state.ad.user_id){

        showToast(
            "Seller contact is not available for this listing."
        );

        return;
    }

    if(!state.currentUserId){

        showToast(
            "Please sign in to message the seller."
        );

        window.setTimeout(
            () => {

                window.location.href =
                    "login.html";

            },
            900
        );

        return;
    }

    if(
        String(state.currentUserId) ===
        String(state.ad.user_id)
    ){

        showToast(
            "This is your own listing."
        );

        return;
    }

    const button =
        $("messageButton");

    const originalHtml =
        button.innerHTML;

    button.disabled =
        true;

    button.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i>' +
        '<span>Opening...</span>';

    try{

        initializeSupabase();

        /*
         * Step 1:
         * Look for an existing conversation.
         */

        let conversationId =
            await findExistingConversation();

        /*
         * Step 2:
         * Create one only when none exists.
         */

        if(!conversationId){

            try{

                conversationId =
                    await createConversation();

            }catch(createError){

                /*
                 * A concurrent request may have created
                 * the conversation. Check one more time
                 * before reporting failure.
                 */

                console.warn(
                    "[HAVKAR] Conversation creation retry:",
                    createError
                );

                conversationId =
                    await findExistingConversation();

                if(!conversationId){

                    throw createError;
                }
            }
        }

        if(!conversationId){

            throw new Error(
                "Conversation ID was not returned."
            );
        }

        /*
         * Step 3:
         * Open the real HAVKAR conversation.
         */

        window.location.href =
            "chat.html?conversation_id=" +
            encodeURIComponent(
                conversationId
            );

    }catch(error){

        console.error(
            "[HAVKAR] Seller messaging failed:",
            error
        );

        const readable =
            getReadableError(
                error
            );

        if(
            /network|connect/i.test(
                readable
            )
        ){

            showToast(
                "HAVKAR could not connect to the server."
            );

        }else if(
            /permission|access|policy|denied|403|401/i.test(
                readable
            )
        ){

            showToast(
                "You do not have permission to start this conversation."
            );

        }else{

            showToast(
                "Could not open seller messaging."
            );
        }

    }finally{

        button.disabled =
            false;

        button.innerHTML =
            originalHtml;
    }
}

/* =========================================================
   KEYBOARD GALLERY CONTROL
   ========================================================= */

function setupGalleryKeyboard(){

    const image =
        $("mainImage");

    image.addEventListener(
        "keydown",
        event => {

            if(
                event.key === "ArrowRight" &&
                state.photos.length > 1
            ){

                event.preventDefault();

                showPhoto(
                    state.photoIndex + 1 >=
                    state.photos.length
                        ? 0
                        : state.photoIndex + 1
                );
            }

            if(
                event.key === "ArrowLeft" &&
                state.photos.length > 1
            ){

                event.preventDefault();

                showPhoto(
                    state.photoIndex - 1 < 0
                        ? state.photos.length - 1
                        : state.photoIndex - 1
                );
            }
        }
    );

    image.setAttribute(
        "tabindex",
        "0"
    );
}

/* =========================================================
   BOOT
   ========================================================= */

async function boot(){

    if(state.initialized){
        return;
    }

    state.initialized =
        true;

    const id =
        getListingId();

    if(!id){

        showError(
            "No listing ID was provided."
        );

        return;
    }

    try{

        initializeSupabase();

        await resolveCurrentUser();

        state.ad =
            await fetchListing(id);

        /*
         * Render the listing immediately.
         * Seller profile is loaded separately so a
         * profile/RLS problem cannot break the listing.
         */

        renderListing();

        renderGallery();

        loadSavedState();

        setupNavigation();

        setupGalleryKeyboard();

        showContent();

        /*
         * Seller profile is supplementary.
         * Failure here does not break the listing.
         */

        if(state.ad.user_id){

            state.sellerProfile =
                await fetchSellerProfile(
                    state.ad.user_id
                );

            renderSellerProfile();
        }

    }catch(error){

        console.error(
            "[HAVKAR] Listing details failed:",
            error
        );

        showError(
            getReadableError(error)
        );
    }
}

/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    boot
);
</script>
