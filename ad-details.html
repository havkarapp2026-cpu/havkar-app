<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="description" content="HAVKAR listing details">
<title>HAVKAR — Listing</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
    --green-950:#0b3d16;
    --green-900:#12551b;
    --green-800:#1b5e20;
    --green-700:#2e7d32;
    --green-600:#43a047;
    --green-500:#4caf50;
    --green-100:#e8f5e9;
    --bg:#f4f7f4;
    --surface:#fff;
    --text:#202522;
    --text-2:#4d554f;
    --muted:#7b827d;
    --border:#e0e5e1;
    --red:#d32f2f;
    --red-bg:#ffebee;
    --shadow:0 5px 20px rgba(0,0,0,.08);
    --shadow-lg:0 12px 34px rgba(0,0,0,.13);
    --header:68px;
    --bottom:78px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:linear-gradient(180deg,#f7faf7 0%,var(--bg) 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom) + 25px);
    -webkit-font-smoothing:antialiased;
}

button{
    font:inherit;
    border:0;
    -webkit-tap-highlight-color:transparent;
}

button:focus-visible{
    outline:3px solid rgba(76,175,80,.28);
    outline-offset:2px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:300;
    min-height:var(--header);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    color:#fff;
    background:linear-gradient(135deg,var(--green-900),var(--green-600));
    box-shadow:0 3px 16px rgba(0,0,0,.16);
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-left{
    min-width:0;
    gap:12px;
}

.header-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:1.18rem;
    font-weight:800;
}

.circle-button{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:#fff;
    background:rgba(255,255,255,.15);
    cursor:pointer;
    transition:.18s ease;
}

.circle-button:active{
    transform:scale(.93);
}

.circle-button.saved{
    color:#e53935;
    background:#fff;
}

/* MAIN */

.main{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:18px 14px 35px;
}

/* LOADING */

.loading{
    min-height:55vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    gap:14px;
}

.loading i{
    color:var(--green-600);
    font-size:2rem;
}

/* ERROR */

.error-box{
    display:none;
    margin:45px auto;
    max-width:520px;
    padding:30px 22px;
    text-align:center;
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.error-box.visible{
    display:block;
}

.error-icon{
    width:68px;
    height:68px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--red-bg);
    color:var(--red);
    font-size:1.6rem;
}

.error-title{
    margin-bottom:8px;
    font-size:1.15rem;
    font-weight:800;
}

.error-text{
    color:var(--muted);
    line-height:1.55;
    font-size:.9rem;
}

.back-market{
    margin-top:20px;
    padding:12px 20px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--green-700),var(--green-500));
    color:#fff;
    font-weight:750;
    cursor:pointer;
}

/* CONTENT */

.content{
    display:none;
}

.content.visible{
    display:block;
}

/* PHOTO GALLERY */

.gallery{
    overflow:hidden;
    position:relative;
    background:#e9eeea;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.main-image-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1.15 / 1;
    background:linear-gradient(135deg,#e8ece9,#f8faf8);
}

.main-image{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.image-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a2aaa4;
    font-size:3rem;
}

.gallery-counter{
    position:absolute;
    right:12px;
    bottom:12px;
    padding:7px 11px;
    border-radius:20px;
    color:#fff;
    background:rgba(0,0,0,.62);
    font-size:.75rem;
    font-weight:700;
}

.gallery-save{
    position:absolute;
    top:12px;
    right:12px;
    z-index:10;
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,.96);
    color:#687069;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
    cursor:pointer;
}

.gallery-save.saved{
    color:#d32f2f;
}

.thumbnails{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px;
    background:#fff;
    scrollbar-width:none;
}

.thumbnails::-webkit-scrollbar{
    display:none;
}

.thumbnail{
    flex:0 0 66px;
    width:66px;
    height:58px;
    overflow:hidden;
    padding:0;
    border:2px solid transparent;
    border-radius:10px;
    background:#eef1ee;
    cursor:pointer;
}

.thumbnail.active{
    border-color:var(--green-600);
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CARD */

.detail-card{
    margin-top:15px;
    padding:20px;
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.category{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border-radius:10px;
    background:var(--green-100);
    color:var(--green-800);
    font-size:.75rem;
    font-weight:750;
}

.title{
    margin-top:13px;
    font-size:1.35rem;
    line-height:1.3;
    font-weight:850;
}

.price{
    margin-top:10px;
    color:var(--green-800);
    font-size:1.5rem;
    font-weight:900;
}

.meta-list{
    margin-top:17px;
    display:flex;
    flex-direction:column;
    gap:11px;
}

.meta-row{
    display:flex;
    align-items:flex-start;
    gap:11px;
    color:var(--text-2);
    font-size:.88rem;
}

.meta-row i{
    width:21px;
    flex:0 0 21px;
    margin-top:2px;
    color:var(--green-600);
    text-align:center;
}

.description-title{
    margin-top:24px;
    margin-bottom:8px;
    font-size:1rem;
    font-weight:850;
}

.description{
    color:var(--text-2);
    line-height:1.65;
    font-size:.91rem;
    white-space:pre-wrap;
    word-break:break-word;
}

/* SELLER */

.seller-card{
    margin-top:15px;
    padding:20px;
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow);
}

.section-title{
    margin-bottom:15px;
    font-size:1rem;
    font-weight:850;
}

.seller-row{
    display:flex;
    align-items:center;
    gap:13px;
}

.seller-avatar{
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--green-100);
    color:var(--green-700);
    font-size:1.2rem;
}

.seller-name{
    font-weight:800;
}

.seller-note{
    margin-top:3px;
    color:var(--muted);
    font-size:.78rem;
}

.seller-id{
    margin-top:13px;
    padding:10px 12px;
    border-radius:11px;
    background:#f5f7f5;
    color:#7a817c;
    font-size:.72rem;
    word-break:break-all;
}

/* ACTIONS */

.actions{
    position:sticky;
    bottom:calc(var(--bottom) + env(safe-area-inset-bottom));
    z-index:100;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
    padding:12px;
    background:rgba(247,250,247,.95);
    backdrop-filter:blur(15px);
    border-radius:18px;
}

.action-button{
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border-radius:14px;
    font-weight:800;
    cursor:pointer;
}

.action-button.primary{
    background:linear-gradient(135deg,var(--green-700),var(--green-500));
    color:#fff;
    box-shadow:0 7px 20px rgba(46,125,50,.22);
}

.action-button.secondary{
    background:#fff;
    color:var(--green-700);
    border:1px solid #dce5de;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:calc(var(--bottom) + 18px + env(safe-area-inset-bottom));
    z-index:1000;
    max-width:calc(100vw - 32px);
    padding:13px 18px;
    border-radius:13px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    color:#fff;
    background:#242824;
    font-size:.86rem;
    font-weight:650;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.22);
    transition:.2s ease;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:250;
    height:calc(var(--bottom) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;
    align-items:flex-start;
    justify-content:space-around;
    background:rgba(255,255,255,.98);
    backdrop-filter:blur(16px);
    box-shadow:0 -3px 16px rgba(0,0,0,.1);
}

.nav-item{
    flex:1;
    height:var(--bottom);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#929893;
    font-size:.70rem;
    font-weight:650;
    cursor:pointer;
    user-select:none;
}

.nav-item i{
    font-size:1.27rem;
}

.nav-item.active{
    color:var(--green-600);
}

@media(min-width:700px){
    .main{
        padding-left:22px;
        padding-right:22px;
    }

    .gallery{
        max-width:850px;
        margin:0 auto;
    }

    .detail-card,
    .seller-card{
        max-width:850px;
        margin-left:auto;
        margin-right:auto;
    }

    .actions{
        max-width:850px;
        margin-left:auto;
        margin-right:auto;
    }
}

@media(max-width:500px){
    .header{
        padding:10px 13px;
    }

    .header-title{
        font-size:1.12rem;
    }

    .circle-button{
        width:41px;
        height:41px;
    }

    .main{
        padding:13px 12px 30px;
    }

    .detail-card,
    .seller-card{
        padding:17px;
        border-radius:19px;
    }

    .title{
        font-size:1.22rem;
    }

    .price{
        font-size:1.35rem;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        scroll-behavior:auto!important;
        transition-duration:.01ms!important;
        animation-duration:.01ms!important;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-left">
        <button id="backButton" class="circle-button" type="button" aria-label="Back">
            <i class="fas fa-arrow-left"></i>
        </button>

        <h1 class="header-title">Listing</h1>
    </div>

    <div class="header-right">
        <button id="headerSave" class="circle-button" type="button" aria-label="Save listing">
            <i class="fas fa-heart"></i>
        </button>

</header>

<main class="main">

    <div id="loading" class="loading">
        <i class="fas fa-spinner fa-spin"></i>

    </div>

    <section id="errorBox" class="error-box">

        <div id="errorText" class="error-text">

        </div>

        <button id="backMarketButton" class="back-market" type="button">
            <i class="fas fa-arrow-left"></i>

        </button>
    </section>

    <section id="content" class="content">

        <div class="gallery">

            <div class="main-image-wrap">

                <img
                    id="mainImage"

                    style="display:none;"
                >

                <button
                    id="gallerySave"
                    class="gallery-save"
                    type="button"
                    aria-label="Save listing"
                    aria-pressed="false"
                >
                    <i class="fas fa-heart"></i>
                </button>

                <div id="galleryCounter" class="gallery-counter" style="display:none;">

                </div>
            </div>

            <div id="thumbnails" class="thumbnails" style="display:none;"></div>

        <section class="detail-card">

            <div id="category" class="category">

            <h2 id="title" class="title">

            </h2>

            <div id="price" class="price">

            </div>

            <div class="meta-list">

                <div class="meta-row">

                    <span id="location">Location not specified</span>
                </div>

                <div class="meta-row">
                    <i class="fas fa-calendar"></i>
                    <span id="date">—</span>
                </div>

                <div class="meta-row">

            <button

</main>

<nav class="bottom-nav">

    <div class="nav-item active" id="navHome" role="button" tabindex="0">
        <i class="fas fa-house"></i>
        <span>Home</span>
    </div>

    <div class="nav-item" id="navSearch" role="button" tabindex="0">
        <i class="fas fa-magnifying-glass"></i>
        <span>Search</span>
    </div>

    <div class="nav-item" id="navSaved" role="button" tabindex="0">
        <i class="fas fa-heart"></i>
        <span>Saved</span>
    </div>

    <div class="nav-item" id="navMessages" role="button" tabindex="0">
        <i class="fas fa-comment"></i>
        <span>Messages</span>
    </div>

    <div class="nav-item" id="navProfile" role="button" tabindex="0">
        <i class="fas fa-user"></i>
        <span>Profile</span>
    </div>

</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================================================
   HAVKAR — AD DETAILS
   Reads the listing ID from:
   ad-details.html?id=LISTING_ID
   ========================================================= */

const SUPABASE_URL =
    "https://gispovnciifgikvgpzck.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq";

let supabaseClient = null;

const state = {
    ad: null,
    photos: [],
    photoIndex: 0,
    saved: false,
    currentUserId: null
};

const $ = id => document.getElementById(id);

function initializeSupabase(){

    if(supabaseClient){
        return supabaseClient;
    }

    if(
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
    ){
        throw new Error("Supabase library could not be loaded.");
    }

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth:{
                    persistSession:true,
                    autoRefreshToken:true,
                    detectSessionInUrl:true
                }
            }
        );

    return supabaseClient;
}

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function showToast(message){

    const toast = $("toast");

    toast.textContent = message;

    toast.classList.add("show");

    window.clearTimeout(showToast.timer);

    showToast.timer =
        window.setTimeout(
            () => toast.classList.remove("show"),
            2600
        );
}

function getListingId(){

    const params =
        new URLSearchParams(window.location.search);

    return params.get("id");
}

function normalizePhotos(value){

    if(!value){
        return [];
    }

    if(Array.isArray(value)){

        return value.filter(
            item =>
                typeof item === "string" &&
                item.trim()
        );
    }

    if(typeof value === "string"){

        try{

            const parsed =
                JSON.parse(value);

            if(Array.isArray(parsed)){

                return parsed.filter(
                    item =>
                        typeof item === "string" &&
                        item.trim()
                );
            }

        }catch(_){}

        if(
            value.startsWith("data:image/") ||
            value.startsWith("http://") ||
            value.startsWith("https://")
        ){

            return [value];
        }
    }

    return [];
}

function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return "Price on request";
    }

    const numeric = Number(value);

    if(Number.isFinite(numeric)){

        return new Intl.NumberFormat(
            "en-US",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        ).format(numeric) + " €";
    }

    return String(value);
}

function formatDate(value){

    if(!value){
        return "—";
    }

    const date = new Date(value);

    if(Number.isNaN(date.getTime())){
        return "—";
    }

    return new Intl.DateTimeFormat(
        undefined,
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ).format(date);
}

function getCategoryIcon(category){

    const text =
        String(category || "")
            .toLowerCase();

    if(
        text.includes("phone") ||
        text.includes("tablet")
    ){
        return "fa-mobile-screen";
    }

    if(text.includes("computer")){
        return "fa-laptop";
    }

    if(
        text.includes("vehicle") ||
        text.includes("car") ||
        text.includes("motor")
    ){
        return "fa-car";
    }

    if(text.includes("furniture")){
        return "fa-couch";
    }

    if(text.includes("kitchen")){
        return "fa-kitchen-set";
    }

    if(text.includes("restaurant")){
        return "fa-utensils";
    }

    if(text.includes("clothing")){
        return "fa-shirt";
    }

    if(text.includes("service")){
        return "fa-handshake";
    }

    if(text.includes("tool")){
        return "fa-screwdriver-wrench";
    }

    if(text.includes("food")){
        return "fa-basket-shopping";
    }

    return "fa-box";
}

function getSavedStorageKey(){

    const userPart =
        state.currentUserId || "guest";

    return "havkar_saved_ads_v1:" + userPart;
}

function loadSavedState(){

    try{

        const raw =
            localStorage.getItem(
                getSavedStorageKey()
            );

        const parsed =
            raw ? JSON.parse(raw) : [];

        const savedIds =
            Array.isArray(parsed)
                ? parsed.map(String)
                : [];

        state.saved =
            savedIds.includes(
                String(state.ad?.id)
            );

    }catch(error){

        console.warn(
            "[HAVKAR] Could not load Saved state:",
            error
        );

        state.saved = false;
    }

    updateSaveUI();
}

function persistSavedState(){

    try{

        const key =
            getSavedStorageKey();

        const raw =
            localStorage.getItem(key);

        const parsed =
            raw ? JSON.parse(raw) : [];

        const ids =
            new Set(
                Array.isArray(parsed)
                    ? parsed.map(String)
                    : []
            );

        const adId =
            String(state.ad.id);

        if(state.saved){
            ids.add(adId);
        }else{
            ids.delete(adId);
        }

        localStorage.setItem(
            key,
            JSON.stringify(Array.from(ids))
        );

    }catch(error){

        console.warn(
            "[HAVKAR] Could not save listing:",
            error
        );

        showToast(
            "Your browser could not save this listing."
        );
    }
}

function updateSaveUI(){

    const buttons = [
        $("gallerySave"),
        $("headerSave")
    ];

    buttons.forEach(button => {

        if(!button){
            return;
        }

        button.classList.toggle(
            "saved",
            state.saved
        );

        button.setAttribute(
            "aria-pressed",
            state.saved ? "true" : "false"
        );

        button.setAttribute(
            "aria-label",
            state.saved
                ? "Remove from Saved"
                : "Save listing"
        );
    });

    const saveButton =
        $("saveButton");

    if(saveButton){

        const icon =
            saveButton.querySelector("i");

        const text =
            saveButton.querySelector("span");

        if(icon){

            icon.className =
                state.saved
                    ? "fas fa-heart"
                    : "far fa-heart";
        }

        if(text){

            text.textContent =
                state.saved
                    ? "Saved"
                    : "Save";
        }
    }
}

function toggleSaved(){

    if(!state.ad){
        return;
    }

    state.saved =
        !state.saved;

    persistSavedState();

    updateSaveUI();

    showToast(
        state.saved
            ? "Saved listing"
            : "Removed from Saved"
    );
}

async function resolveCurrentUser(){

    try{

        initializeSupabase();

        const result =
            await supabaseClient.auth.getUser();

        state.currentUserId =
            result?.data?.user?.id || null;

    }catch(error){

        console.warn(
            "[HAVKAR] Could not resolve current user:",
            error
        );

        state.currentUserId = null;
    }
}

async function fetchListing(id){

    initializeSupabase();

    const result =
        await supabaseClient
            .from("ads")
            .select(
                "id,title,category,price,location,description,user_id,created_at,photos"
            )
            .eq("id",id)
            .maybeSingle();

    if(result.error){

        throw result.error;
    }

    if(!result.data){

        throw new Error(
            "This listing could not be found."
        );
    }

    return result.data;
}

function renderCategory(category){

    const element =
        $("category");

    const icon =
        element.querySelector("i");

    const text =
        element.querySelector("span");

    const value =
        category || "Other";

    icon.className =
        "fas " + getCategoryIcon(value);

    text.textContent =
        value;
}

function renderListing(){

    const ad =
        state.ad;

    $("title").textContent =
        ad.title || "Untitled listing";

    $("price").textContent =
        formatPrice(ad.price);

    $("location").textContent =
        ad.location ||
        "Location not specified";

    $("date").textContent =
        formatDate(ad.created_at);

    $("listingId").textContent =
        "Listing ID: " + String(ad.id);

    $("description").textContent =
        ad.description ||
        "No description provided.";

    renderCategory(ad.category);

    const sellerId =
        $("sellerId");

    if(ad.user_id){

        sellerId.style.display =
            "block";

        sellerId.textContent =
            "Seller account ID: " +
            String(ad.user_id);

    }else{

        sellerId.style.display =
            "none";
    }
}

function showPhoto(index){

    if(!state.photos.length){

        $("mainImage").style.display =
            "none";

        $("imagePlaceholder").style.display =
            "flex";

        $("galleryCounter").style.display =
            "none";

        return;
    }

    state.photoIndex =
        Math.max(
            0,
            Math.min(
                index,
                state.photos.length - 1
            )
        );

    const url =
        state.photos[state.photoIndex];

    const image =
        $("mainImage");

    image.src = url;
    image.style.display = "block";

    $("imagePlaceholder").style.display =
        "none";

    $("galleryCounter").style.display =
        "block";

    $("galleryCounter").textContent =
        `${state.photoIndex + 1} / ${state.photos.length}`;

    $("thumbnails")
        .querySelectorAll(".thumbnail")
        .forEach(
            (button,index) => {

                button.classList.toggle(
                    "active",
                    index === state.photoIndex
                );
            }
        );
}

function renderGallery(){

    const photos =
        normalizePhotos(
            state.ad?.photos
        );

    state.photos =
        photos;

    const thumbnails =
        $("thumbnails");

    thumbnails.innerHTML = "";

    if(!photos.length){

        thumbnails.style.display =
            "none";

        showPhoto(0);

        return;
    }

    if(photos.length === 1){

        thumbnails.style.display =
            "none";

    }else{

        thumbnails.style.display =
            "flex";

        photos.forEach(
            (url,index) => {

                const button =
                    document.createElement("button");

                button.type = "button";

                button.className =
                    "thumbnail" +
                    (index === 0
                        ? " active"
                        : "");

                button.setAttribute(
                    "aria-label",
                    "View image " +
                    (index + 1)
                );

                const image =
                    document.createElement("img");

                image.src = url;

                image.alt =
                    "Listing image " +
                    (index + 1);

                button.appendChild(image);

                button.addEventListener(
                    "click",
                    () => showPhoto(index)
                );

                thumbnails.appendChild(
                    button
                );
            }
        );
    }

    showPhoto(0);
}

function showContent(){

    $("loading").style.display =
        "none";

    $("errorBox")
        .classList.remove("visible");

    $("content")
        .classList.add("visible");
}

function showError(message){

    $("loading").style.display =
        "none";

    $("content")
        .classList.remove("visible");

    $("errorText").textContent =
        message ||
        "This listing could not be loaded.";

    $("errorBox")
        .classList.add("visible");
}

/* =========================================================
   OPEN REAL SELLER CONVERSATION
   ========================================================= */

async function openSellerMessage(){

    if(!state.ad){
        return;
    }

    if(!state.ad.user_id){

        showToast(
            "Seller contact is not available for this listing."
        );

        return;
    }

    if(!state.currentUserId){

        showToast(
            "Please sign in to message the seller."
        );

        window.setTimeout(
            () => {
                window.location.href =
                    "login.html";
            },
            900
        );

        return;
    }

    if(
        String(state.currentUserId) ===
        String(state.ad.user_id)
    ){

        showToast(
            "This is your own listing."
        );

        return;
    }

    try{

        initializeSupabase();

        /*
         * First look for an existing conversation.
         * This prevents duplicate conversations when
         * the buyer presses Message Seller more than once.
         */

        const existing =
            await supabaseClient
                .from("conversations")
                .select(
                    "id,ad_id,buyer_id,seller_id,created_at,updated_at"
                )
                .eq(
                    "ad_id",
                    state.ad.id
                )
                .eq(
                    "buyer_id",
                    state.currentUserId
                )
                .eq(
                    "seller_id",
                    state.ad.user_id
                )
                .maybeSingle();

        if(existing.error){

            console.error(
                "[HAVKAR] Conversation lookup failed:",
                existing.error
            );

            showToast(
                "Could not check the seller conversation."
            );

            return;
        }

        let conversationId =
            existing.data?.id || null;

        /*
         * No existing conversation:
         * create one in Supabase.
         */

        if(!conversationId){

            const created =
                await supabaseClient
                    .from("conversations")
                    .insert({
                        ad_id: state.ad.id,
                        buyer_id: state.currentUserId,
                        seller_id: state.ad.user_id
                    })
                    .select(
                        "id,ad_id,buyer_id,seller_id,created_at,updated_at"
                    )
                    .single();

            if(created.error){

                /*
                 * If another request created the same
                 * conversation at nearly the same time,
                 * retry the lookup instead of creating
                 * another record.
                 */

                console.error(
                    "[HAVKAR] Conversation creation failed:",
                    created.error
                );

                const retry =
                    await supabaseClient
                        .from("conversations")
                        .select(
                            "id,ad_id,buyer_id,seller_id,created_at,updated_at"
                        )
                        .eq(
                            "ad_id",
                            state.ad.id
                        )
                        .eq(
                            "buyer_id",
                            state.currentUserId
                        )
                        .eq(
                            "seller_id",
                            state.ad.user_id
                        )
                        .maybeSingle();

                if(
                    retry.error ||
                    !retry.data?.id
                ){

                    showToast(
                        "Could not start the seller conversation."
                    );

                    return;
                }

                conversationId =
                    retry.data.id;

            }else{

                conversationId =
                    created.data.id;
            }
        }

        if(!conversationId){

            showToast(
                "Could not open the seller conversation."
            );

            return;
        }

        /*
         * Pass the real conversation ID to HAVKAR Chat.
         * The Chat page must use this ID to load the
         * conversation and its messages.
         */

        const chatUrl =
            "chat.html?conversation_id=" +
            encodeURIComponent(
                conversationId
            );

        window.location.href =
            chatUrl;

    }catch(error){

        console.error(
            "[HAVKAR] Seller messaging failed:",
            error
        );

        const message =
            String(
                error?.message || ""
            ).toLowerCase();

        if(
            message.includes("failed to fetch") ||
            message.includes("network")
        ){

            showToast(
                "HAVKAR could not connect to the server."
            );

            return;
        }

        showToast(
            "Could not open seller messaging."
        );
    }
}

function setupNavigation(){

    $("backButton")
        .addEventListener(
            "click",
            goBuySell
        );

    $("backMarketButton")
        .addEventListener(
            "click",
            goBuySell
        );

    $("headerSave")
        .addEventListener(
            "click",
            toggleSaved
        );

    $("gallerySave")
        .addEventListener(
            "click",
            toggleSaved
        );

    $("saveButton")
        .addEventListener(
            "click",
            toggleSaved
        );

    $("messageButton")
        .addEventListener(
            "click",
            openSellerMessage
        );

    $("navHome")
        .addEventListener(
            "click",
            goHome
        );

    $("navSearch")
        .addEventListener(
            "click",
            goBuySell
        );

    $("navSaved")
        .addEventListener(
            "click",
            goSaved
        );

    $("navMessages")
        .addEventListener(
            "click",
            goMessages
        );

    $("navProfile")
        .addEventListener(
            "click",
            goProfile
        );

    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            item.addEventListener(
                "keydown",
                event => {

                    if(
                        event.key === "Enter" ||
                        event.key === " "
                    ){

                        event.preventDefault();

                        item.click();
                    }
                }
            );
        });
}

async function boot(){

    const id =
        getListingId();

    if(!id){

        showError(
            "No listing ID was provided."
        );

        return;
    }

    try{

        initializeSupabase();

        await resolveCurrentUser();

        state.ad =
            await fetchListing(id);

        renderListing();

        renderGallery();

        loadSavedState();

        setupNavigation();

        showContent();

    }catch(error){

        console.error(
            "[HAVKAR] Listing details failed:",
            error
        );

        let message =
            error?.message ||
            "HAVKAR could not load this listing.";

        if(
            /failed to fetch|network/i.test(
                String(message)
            )
        ){

            message =
                "HAVKAR could not connect to the server. Please try again.";
        }

        showError(message);
    }
}

document.addEventListener(
    "DOMContentLoaded",
    boot
);
</script>
