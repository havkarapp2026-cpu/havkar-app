<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#609b38">
<title>HAVKAR | Property tools</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/havkar-accommodation.css">
</head>
<body data-i18n-ignore>
<header>
  <div class="header-inner top">
    <button class="back" type="button" id="backButton" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
    <div>
      <h1>Property tools</h1>
      <p class="subtitle">Private owner tools. Listings stay unpublished and nothing is charged.</p>
    </div>
  </div>
</header>
<main>
  <p class="links">
    <a href="login.html">Log In</a>
    <a href="signup.html">Create New Account</a>
  </p>
  <p id="message" class="error" role="status"></p>
  <form id="tools" hidden>
    <label for="propertyId">Property</label>
    <select id="propertyId" required></select>
    <label for="stayDate">Date</label>
    <input id="stayDate" type="date" required>
    <label for="stayState">Availability</label>
    <select id="stayState">
      <option value="open">Open</option>
      <option value="blocked">Blocked</option>
    </select>
    <button type="button" id="saveDate">Save date</button>
    <label for="nightly">Nightly draft price in cents</label>
    <input id="nightly" inputmode="numeric" placeholder="Not charged">
    <button type="button" id="savePrice">Save draft price</button>
    <label for="photo">Property photo</label>
    <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
    <button type="button" id="savePhoto">Upload private photo</button>
    <p id="days"></p>
  </form>
</main>
<nav class="bottom" aria-label="Accommodation">
  <a href="accommodation.html"><strong>Listings</strong></a>
  <a href="accommodation-property.html"><strong>Application</strong></a>
  <a href="accommodation-manage.html"><strong>Tools</strong></a>
</nav>
<script src="/havkar-supabase-config.js"></script>
<script src="/havkar-accommodation.js"></script>
<script type="module" src="/havkar-accommodation-manage.js"></script>
<script>
document.getElementById("backButton").addEventListener("click", function () {
  if (window.havkarNavigateBack) {
    window.havkarNavigateBack();
    return;
  }
  window.location.href = "accommodation.html";
});
</script>
<script src="/havkar-page-back.js"></script>
</body>
</html>
