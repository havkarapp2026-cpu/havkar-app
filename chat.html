<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="description" content="HAVKAR Messages and Chat">
<title>HAVKAR — Messages</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

html{
    height:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
        Roboto,Arial,sans-serif;
    background:#f5f6f5;
    color:#333;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

button:focus-visible,
input:focus-visible{
    outline:3px solid rgba(124,179,66,.25);
    outline-offset:2px;
}

/* =========================================================
   MESSAGE LIST
========================================================= */

#messageList{
    min-height:100vh;
    min-height:100dvh;
    padding-bottom:82px;
}

.header{
    height:70px;
    min-height:70px;
    background:linear-gradient(135deg,#2e7d32,#66bb6a);
    color:#fff;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 12px rgba(0,0,0,.16);
    position:sticky;
    top:0;
    z-index:100;
}

.header-left{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
}

.back-btn,
.icon-btn{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:50%;
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.back-btn{
    background:rgba(255,255,255,.12);
    font-size:23px;
}

.icon-btn{
    background:rgba(255,255,255,.16);
    font-size:18px;
}

.back-btn:active,
.icon-btn:active{
    transform:scale(.94);
    background:rgba(255,255,255,.25);
}

.header h1{
    font-size:21px;
    font-weight:800;
    white-space:nowrap;
}

/* =========================================================
   HEADER MENU
========================================================= */

.header-menu{
    position:absolute;
    top:61px;
    right:15px;
    width:205px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.20);
    display:none;
    z-index:300;
}

.header-menu.show{
    display:block;
}

.header-menu button{
    width:100%;
    min-height:52px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    background:#fff;
    color:#333;
    cursor:pointer;
}

.header-menu button:active{
    background:#f2f4f2;
}

.header-menu i{
    width:21px;
    color:#689f38;
}

/* =========================================================
   SEARCH
========================================================= */

.search-bar{
    padding:15px 20px;
    background:#fff;
    border-bottom:1px solid #ecefec;
}

.search-box{
    position:relative;
}

.search-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#999;
    pointer-events:none;
}

.search-input{
    width:100%;
    height:50px;
    padding:0 18px 0 45px;
    border:2px solid #e2e5e2;
    border-radius:27px;
    background:#fff;
    color:#333;
    font-size:16px;
    outline:none;
}

.search-input:focus{
    border-color:#7cb342;
    box-shadow:0 0 0 3px rgba(124,179,66,.10);
}

/* =========================================================
   CONVERSATIONS
========================================================= */

.section-header{
    min-height:63px;
    padding:18px 20px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.section-title{
    font-size:20px;
    font-weight:800;
}

.message-count{
    color:#8b918d;
    font-size:13px;
}

.loading{
    padding:75px 20px;
    text-align:center;
    color:#888;
}

.loading i{
    display:block;
    margin-bottom:13px;
    color:#7cb342;
    font-size:31px;
}

.loading p{
    font-size:14px;
}

.loading-action{
    margin-top:18px;
    padding:11px 18px;
    border-radius:12px;
    background:#7cb342;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.chat-item{
    width:100%;
    min-height:94px;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    background:#fff;
    border-bottom:1px solid #ededed;
    cursor:pointer;
    text-align:left;
    transition:background .15s ease;
}

.chat-item:active{
    background:#f1f3f1;
}

.avatar{
    width:56px;
    height:56px;
    min-width:56px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#e8f5e9,#c8e6c9);
    color:#4d963f;
    font-size:24px;
    flex-shrink:0;
}

.chat-info{
    min-width:0;
    flex:1;
}

.chat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:5px;
}

.name{
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:16px;
    font-weight:750;
}

.time{
    color:#999;
    font-size:12px;
    white-space:nowrap;
}

.message-preview{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:#666;
    font-size:14px;
    line-height:1.4;
}

.ad-label{
    margin-top:4px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:#73a95e;
    font-size:11px;
}

.unread{
    width:23px;
    height:23px;
    min-width:23px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#7cb342;
    color:#fff;
    font-size:11px;
    font-weight:800;
}

/* =========================================================
   EMPTY / ERROR
========================================================= */

.empty-state,
.no-results{
    padding:75px 25px;
    text-align:center;
    color:#999;
}

.empty-state i,
.no-results i{
    display:block;
    margin-bottom:17px;
    color:#bfd1ba;
    font-size:48px;
}

.empty-state h3,
.no-results h3{
    margin-bottom:8px;
    color:#555;
    font-size:18px;
}

.empty-state p,
.no-results p{
    font-size:14px;
    line-height:1.5;
}

.no-results{
    display:none;
}

.error-state{
    padding:65px 25px;
    text-align:center;
    color:#999;
}

.error-state i{
    display:block;
    margin-bottom:15px;
    color:#d9534f;
    font-size:44px;
}

.error-state h3{
    color:#555;
    margin-bottom:8px;
}

.error-state p{
    font-size:14px;
    line-height:1.5;
}

.retry-button{
    margin-top:18px;
    padding:12px 22px;
    border-radius:13px;
    background:#2e7d32;
    color:#fff;
    font-weight:750;
    cursor:pointer;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:calc(72px + env(safe-area-inset-bottom));
    padding:5px 0 env(safe-area-inset-bottom);
    display:flex;
    align-items:flex-start;
    justify-content:space-around;
    background:rgba(255,255,255,.98);
    backdrop-filter:blur(16px);
    box-shadow:0 -3px 14px rgba(0,0,0,.10);
    z-index:500;
}

.nav-item{
    width:25%;
    height:67px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    background:transparent;
    color:#999;
    cursor:pointer;
}

.nav-item i{
    font-size:21px;
}

.nav-item span{
    font-size:11px;
    font-weight:650;
}

.nav-item.active{
    color:#69a84d;
}

.nav-item:active{
    transform:scale(.94);
}

/* =========================================================
   CHAT SCREEN
========================================================= */

.chat-screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    height:100dvh;
    display:none;
    flex-direction:column;
    background:#f5f6f5;
    z-index:1000;
    overflow:hidden;
}

.chat-screen-header{
    flex:0 0 auto;
    min-height:70px;
    padding:
        env(safe-area-inset-top)
        12px
        0
        12px;
    background:linear-gradient(135deg,#2e7d32,#7cb342);
    color:#fff;
    display:flex;
    align-items:center;
    gap:11px;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.chat-screen-header > button{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:50%;
    background:transparent;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
}

.chat-screen-header > button:active{
    background:rgba(255,255,255,.15);
}

.chat-screen-header .avatar{
    width:43px;
    height:43px;
    min-width:43px;
    font-size:19px;
    background:rgba(255,255,255,.20);
    color:#fff;
}

.chat-title-area{
    min-width:0;
    flex:1;
}

.chat-person{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:18px;
    font-weight:800;
}

.chat-subtitle{
    margin-top:2px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:11px;
    opacity:.88;
}

.chat-header-action{
    flex-shrink:0;
}

/* =========================================================
   CHAT MESSAGES
========================================================= */

.chat-messages{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    overflow-y:auto;
    overflow-x:hidden;
    padding:18px 13px 24px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    display:flex;
    flex-direction:column;
}

.message-row{
    width:100%;
    display:flex;
    flex:0 0 auto;
    margin-bottom:14px;
}

.message-row.sent{
    justify-content:flex-end;
}

.message-row.received{
    justify-content:flex-start;
}

.message-wrap{
    position:relative;
    max-width:82%;
}

.message{
    position:relative;
    max-width:100%;
    padding:10px 13px 7px;
    border-radius:18px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    font-size:15px;
    line-height:1.45;
    word-break:break-word;
    overflow-wrap:anywhere;
}

.message.sent{
    background:#7cb342;
    color:#fff;
    border-bottom-right-radius:5px;
}

.message.received{
    background:#fff;
    color:#333;
    border-bottom-left-radius:5px;
}

.message-text{
    white-space:pre-wrap;
}

.message-meta{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
    margin-top:4px;
    font-size:10px;
    opacity:.72;
}

.message-checks{
    font-size:11px;
    letter-spacing:-2px;
}

.message-checks.read{
    color:#dff7d5;
}

/* =========================================================
   REACTIONS
========================================================= */

.reaction-bar{
    min-height:25px;
    display:flex;
    align-items:center;
    gap:4px;
    margin-top:5px;
}

.message-row.sent .reaction-bar{
    justify-content:flex-end;
}

.message-row.received .reaction-bar{
    justify-content:flex-start;
}

.reaction-chip{
    min-width:29px;
    height:27px;
    padding:2px 7px;
    border:1px solid #e1e6e1;
    border-radius:15px;
    background:#fff;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    color:#444;
    font-size:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    cursor:pointer;
}

.reaction-chip.mine{
    border-color:#7cb342;
    background:#f0f8ed;
}

.reaction-count{
    font-size:11px;
    font-weight:700;
}

.reaction-trigger{
    position:absolute;
    right:-8px;
    bottom:-8px;
    width:31px;
    height:31px;
    border-radius:50%;
    border:1px solid #e0e4e0;
    background:#fff;
    color:#777;
    box-shadow:0 2px 7px rgba(0,0,0,.14);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:8;
}

.message-row.received .reaction-trigger{
    left:-8px;
    right:auto;
}

.reaction-trigger:active{
    transform:scale(.9);
}

.reaction-picker{
    position:absolute;
    right:0;
    bottom:37px;
    display:none;
    align-items:center;
    gap:4px;
    padding:7px;
    border-radius:19px;
    background:#fff;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
    border:1px solid #e5e9e5;
    z-index:20;
}

.message-row.received .reaction-picker{
    left:0;
    right:auto;
}

.message-wrap.reaction-open .reaction-picker{
    display:flex;
}

.reaction-option{
    width:39px;
    height:39px;
    min-width:39px;
    border-radius:50%;
    background:#f7f8f7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    cursor:pointer;
}

.reaction-option:active{
    transform:scale(.88);
    background:#e8f5e9;
}

/* =========================================================
   CHAT EMPTY
========================================================= */

.chat-empty{
    margin:auto;
    padding:35px;
    flex:0 0 auto;
    text-align:center;
    color:#999;
}

.chat-empty i{
    display:block;
    margin-bottom:12px;
    color:#bfd2ba;
    font-size:42px;
}

/* =========================================================
   INPUT
========================================================= */

.message-input-area{
    flex:0 0 auto;
    width:100%;
    min-height:68px;
    padding:
        9px
        10px
        calc(9px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border-top:1px solid #ddd;
    box-shadow:0 -3px 12px rgba(0,0,0,.08);
    z-index:30;
}

.message-input{
    flex:1 1 auto;
    min-width:0;
    width:100%;
    height:49px;
    padding:0 17px;
    border:1px solid #d7ddd7;
    border-radius:26px;
    outline:none;
    background:#fff;
    color:#333;
    font-size:16px;
}

.message-input:focus{
    border-color:#7cb342;
    box-shadow:0 0 0 3px rgba(124,179,66,.10);
}

.message-input:disabled{
    background:#f1f2f1;
}

.send-btn{
    width:49px;
    height:49px;
    min-width:49px;
    border-radius:50%;
    background:#7cb342;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(76,175,80,.22);
}

.send-btn:active{
    transform:scale(.94);
}

.send-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:90px;
    max-width:calc(100vw - 30px);
    padding:12px 18px;
    border-radius:13px;
    background:#252825;
    color:#fff;
    font-size:13px;
    font-weight:650;
    text-align:center;
    transform:translate(-50%,18px);
    opacity:0;
    pointer-events:none;
    transition:.22s ease;
    z-index:3000;
    box-shadow:0 8px 25px rgba(0,0,0,.22);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.error{
    background:#b3261e;
}

.toast.success{
    background:#689f38;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:480px){

    .header{
        padding:0 14px;
    }

    .search-bar{
        padding:14px 15px;
    }

    .section-header{
        padding-left:15px;
        padding-right:15px;
    }

    .chat-item{
        padding:14px 15px;
    }

    .chat-messages{
        padding-left:10px;
        padding-right:10px;
    }

    .message-wrap{
        max-width:85%;
    }

    .reaction-picker{
        max-width:calc(100vw - 30px);
        overflow-x:auto;
    }

    .reaction-option{
        width:37px;
        height:37px;
        min-width:37px;
    }
}

@media(max-width:480px) and (max-height:700px){

    .chat-screen-header{
        min-height:62px;
    }

    .chat-screen-header > button{
        width:40px;
        height:40px;
        min-width:40px;
    }

    .chat-screen-header .avatar{
        width:39px;
        height:39px;
        min-width:39px;
    }

    .chat-person{
        font-size:17px;
    }

    .message-input-area{
        min-height:63px;
        padding-top:7px;
        padding-bottom:calc(7px + env(safe-area-inset-bottom));
    }

    .message-input,
    .send-btn{
        height:46px;
    }

    .send-btn{
        width:46px;
        min-width:46px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        transition:none!important;
        animation:none!important;
    }
}
</style>
</head>

<body>

<div id="messageList">

    <header class="header">

        <div class="header-left">

            <button
                id="listBackButton"
                class="back-btn"
                type="button"
                aria-label="Back to home">

                <i class="fas fa-arrow-left"></i>

            </button>

            <h1>Messages</h1>

        </div>

        <button
            id="headerMenuButton"
            class="icon-btn"
            type="button"
            aria-label="More options"
            aria-expanded="false">

            <i class="fas fa-ellipsis-v"></i>

        </button>

        <div id="headerMenu" class="header-menu">

            <button id="notificationsButton" type="button">
                <i class="fas fa-bell"></i>
                <span>Notifications</span>
            </button>

            <button id="profileButton" type="button">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </button>

        </div>

    </header>

    <div class="search-bar">

        <div class="search-box">

            <i class="fas fa-search search-icon"></i>

            <input
                id="searchInput"
                class="search-input"
                type="search"
                placeholder="Search messages..."
                autocomplete="off"
                enterkeyhint="search">

        </div>

    </div>

    <div class="section-header">

        <div class="section-title">
            Conversations
        </div>

        <div
            id="messageCount"
            class="message-count">
            0 chats
        </div>

    </div>

    <div id="conversationList" class="content">

        <div class="loading">

            <i class="fas fa-circle-notch fa-spin"></i>

            <p>Loading conversations...</p>

        </div>

    </div>

    <div id="noResults" class="no-results">

        <i class="fas fa-comments"></i>

        <h3>No conversations found</h3>

        <p>Try another name or keyword.</p>

    </div>

    <nav class="bottom-nav">

        <button id="navHome" class="nav-item" type="button">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </button>

        <button id="navMessages" class="nav-item active" type="button">
            <i class="fas fa-comment"></i>
            <span>Messages</span>
        </button>

        <button id="navNotifications" class="nav-item" type="button">
            <i class="fas fa-bell"></i>
            <span>Notifications</span>
        </button>

        <button id="navProfile" class="nav-item" type="button">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </button>

    </nav>

</div>


<div id="chatScreen" class="chat-screen">

    <header class="chat-screen-header">

        <button
            id="chatBackButton"
            type="button"
            aria-label="Back to conversations">

            <i class="fas fa-arrow-left"></i>

        </button>

        <div id="chatAvatar" class="avatar">
            <i class="fas fa-user"></i>
        </div>

        <div class="chat-title-area">

            <div id="chatPerson" class="chat-person">
                Conversation
            </div>

            <div id="chatSubtitle" class="chat-subtitle">
                HAVKAR
            </div>

        </div>

        <button
            id="chatInfoButton"
            class="chat-header-action"
            type="button"
            aria-label="Conversation information">

            <i class="fas fa-circle-info"></i>

        </button>

    </header>

    <main id="chatMessages" class="chat-messages">

        <div class="chat-empty">

            <i class="fas fa-circle-notch fa-spin"></i>

            <p>Loading messages...</p>

        </div>

    </main>

    <div class="message-input-area">

        <input
            id="messageInput"
            class="message-input"
            type="text"
            inputmode="text"
            enterkeyhint="send"

/* =========================================================
   SAFE REQUEST TIMEOUT
========================================================= */

function withTimeout(
    promise,
    milliseconds = REQUEST_TIMEOUT
){

    return new Promise(
        (resolve,reject) => {

            let finished = false;

            const timer =
                window.setTimeout(
                    () => {

                        if(finished){
                            return;
                        }

                        finished = true;

                        reject(
                            new Error(
                                "REQUEST_TIMEOUT"
                            )
                        );

                    },
                    milliseconds
                );

            Promise.resolve(promise)
                .then(
                    value => {

                        if(finished){
                            return;
                        }

                        finished = true;

                        clearTimeout(timer);

                        resolve(value);

                    }
                )
                .catch(
                    error => {

                        if(finished){
                            return;
                        }

                        finished = true;

                        clearTimeout(timer);

                        reject(error);

                    }
                );

        }
    );

}

/* =========================================================
   ENRICH CONVERSATIONS
========================================================= */

async function enrichConversations(){

    if(
        !state.conversations.length ||
        !state.currentUser
    ){

        return;

    }

    const adIds =
        state.conversations
            .map(
                conversation =>
                    conversation.ad_id
            )
            .filter(
                id =>
                    id !== null &&
                    id !== undefined
            );

    const adsMap = {};

    if(adIds.length){

        try{

            const adResult =
                await withTimeout(
                    supabaseClient
                        .from("ads")
                        .select(
                            "id,title,category,price,location"
                        )
                        .in(
                            "id",
                            adIds
                        )
                );

            if(
                !adResult.error &&
                Array.isArray(
                    adResult.data
                )
            ){

                adResult.data.forEach(
                    ad => {

                        adsMap[
                            String(ad.id)
                        ] = ad;

                    }
                );

            }

        }catch(error){

            console.warn(
                "[HAVKAR] Ads enrichment failed:",
                error
            );

        }

    }

    state.conversations.forEach(
        conversation => {

            conversation.ad =
                conversation.ad_id !== null &&
                conversation.ad_id !== undefined
                    ? (
                        adsMap[
                            String(
                                conversation.ad_id
                            )
                        ] || null
                    )
                    : null;

        }
    );

    /*
     * Each conversation is enriched independently.
     * One failed request can never stop the others.
     */

    await Promise.all(
        state.conversations.map(
            async conversation => {

                try{

                    const messageResult =
                        await withTimeout(
                            supabaseClient
                                .from("messages")
                                .select(
                                    "id,sender_id,message_text,created_at,is_read"
                                )
                                .eq(
                                    "conversation_id",
                                    conversation.id
                                )
                                .order(
                                    "created_at",
                                    {
                                        ascending:false
                                    }
                                )
                                .limit(1)
                        );

                    if(
                        !messageResult.error &&
                        Array.isArray(
                            messageResult.data
                        ) &&
                        messageResult.data.length
                    ){

                        conversation.lastMessage =
                            messageResult.data[0];

                    }

                }catch(error){

                    console.warn(
                        "[HAVKAR] Latest message failed:",
                        error
                    );

                }

                try{

                    const unreadResult =
                        await withTimeout(
                            supabaseClient
                                .from("messages")
                                .select(
                                    "id",
                                    {
                                        count:"exact",
                                        head:true
                                    }
                                )
                                .eq(
                                    "conversation_id",
                                    conversation.id
                                )
                                .eq(
                                    "is_read",
                                    false
                                )
                                .neq(
                                    "sender_id",
                                    state.currentUser.id
                                )
                        );

                    if(
                        !unreadResult.error &&
                        Number.isFinite(
                            unreadResult.count
                        )
                    ){

                        conversation.unreadCount =
                            unreadResult.count;

                    }

                }catch(error){

                    console.warn(
                        "[HAVKAR] Unread count failed:",
                        error
                    );

                }

            }
        )
    );

}


/* =========================================================

function renderConversationList(){

    const list =
        $("conversationList");

    const noResults =
        $("noResults");

    if(!list){
        return;
    }

    const filtered =
        state.conversations.filter(
            conversation => {

                if(
                    !state.searchTerm
                ){

                    return true;

                }

                const ad =
                    conversation.ad;

                const last =
                    conversation.lastMessage;

                const text = [

                    getConversationRole(
                        conversation
                    ),

                    ad?.title || "",

                    ad?.category || "",

                    ad?.location || "",

                    last?.message_text || ""

                ]
                .join(" ")
                .toLowerCase();

                return text.includes(
                    state.searchTerm
                );

            }
        );

    if($("messageCount")){

        $("messageCount")
            .textContent =
            filtered.length +
            (
                filtered.length === 1
                    ? " chat"
                    : " chats"
            );

    }

    if(
        !state.conversations.length
    ){

        if(noResults){

            noResults.style.display =
                "none";

        }

        showEmptyState(
            "No conversations yet",
            "Your HAVKAR conversations will appear here."
        );

        return;

    }

    if(!filtered.length){

        list.innerHTML =
            "";

        if(noResults){

            noResults.style.display =
                "block";

        }

        return;

    }

    if(noResults){

        noResults.style.display =
            "none";

    }

    list.innerHTML =
        "";

    filtered.forEach(
        conversation => {

            list.appendChild(
                createConversationElement(
                    conversation
                )
            );

        }
    );

}

/* =========================================================
   URL CONVERSATION
========================================================= */

async function openConversationFromUrl(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const conversationId =
        params.get(
            "conversation_id"
        );

    if(!conversationId){
        return;
    }

    const localConversation =
        state.conversations.find(
            conversation =>
                String(
                    conversation.id
                ) ===
                String(
                    conversationId
                )
        );

    if(localConversation){

        await openConversation(
            localConversation
        );

        return;

    }

    try{

        const result =
            await withTimeout(
                supabaseClient
                    .from("conversations")
                    .select(
                        "id,ad_id,buyer_id,seller_id,created_at,updated_at"
                    )
                    .eq(
                        "id",
                        conversationId
                    )
                    .maybeSingle()
            );

        if(result.error){

            throw result.error;

        }

        if(!result.data){

            showToast(
                "Conversation not found.",
                "error"
            );

            return;

        }

        const belongsToUser =
            String(
                result.data.buyer_id
            ) ===
            String(
                state.currentUser.id
            ) ||
            String(
                result.data.seller_id
            ) ===
            String(
                state.currentUser.id
            );

        if(!belongsToUser){

            showToast(
                "You do not have access to this conversation.",
                "error"
            );

            return;

        }

        result.data.ad =
            null;

        result.data.lastMessage =
            null;

        result.data.unreadCount =
            0;

        state.conversations =
            [
                result.data,
                ...state.conversations
            ];

        await openConversation(
            result.data
        );

        enrichSingleConversation(
            result.data
        )
        .then(
            () => {

                if(
                    state.currentConversationId ===
                    result.data.id
                ){

                    $("chatSubtitle")
                        .textContent =
                        result.data.ad?.title ||
                        "HAVKAR Conversation";

                }

            }
        )
        .catch(
            error => {

                console.warn(
                    "[HAVKAR] Direct conversation enrichment failed:",
                    error
                );

            }
        );

    }catch(error){

        console.error(
            "[HAVKAR] URL conversation error:",
            error
        );

        const message =
            String(
                error?.message || ""
            );

        showToast(
            message === "REQUEST_TIMEOUT"
                ? "Conversation request timed out."
                : "Conversation could not be opened.",
            "error"
        );

    }

}

                    .from("messages")
                    .select(
                        "id,conversation_id,sender_id,message_text,created_at,is_read"
                    )
                    .eq(
                        "conversation_id",
                        conversationId
                    )
                    .order(
                        "created_at",
                        {
                            ascending:true
                        }
                    )
            );

        if(result.error){

            throw result.error;

        }

        renderMessages(
            result.data || []
        );

    }catch(error){

        console.error(
            "[HAVKAR] Message load error:",
            error
        );

        box.innerHTML = `
            <div class="chat-empty">

                <i class="fas fa-triangle-exclamation"></i>

                <p>
                    ${
                        error?.message ===
                        "REQUEST_TIMEOUT"
                            ? "Message loading timed out."
                            : "Unable to load messages."
                    }
                </p>

                <button
                    id="retryMessages"
                    class="retry-button"
                    type="button">

                    Try Again

                </button>

            </div>
        `;

        $("retryMessages")
            ?.addEventListener(
                "click",
                () => {

                    loadMessages(
                        conversationId
                    );

                }
            );

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    messages
){

    const box =
        $("chatMessages");

    if(!box){
        return;
    }

    box.innerHTML =
        "";

    if(!messages.length){

        box.innerHTML = `
            <div class="chat-empty">

                <i class="fas fa-comment-dots"></i>

                <p>
                    Start the conversation.
                </p>

            </div>
        `;

        return;

    }

    messages.forEach(
        message => {

            appendMessage(
                message,
                false
            );

        }
    );

    scrollMessagesToBottom();

}


/* =========================================================
   APPEND MESSAGE
========================================================= */

function appendMessage(
    message,
    scroll = true
){

    if(
        !message ||
        !message.id ||
        !message.conversation_id
    ){

        return;

    }

    const box =
        $("chatMessages");

    if(!box){
        return;
    }

    const messageId =
        String(
            message.id
        );

    const existing =
        box.querySelector(
            '[data-message-id="' +
            cssEscape(
                messageId
            ) +
            '"]'
        );

    if(existing){

        updateRenderedMessage(
            message
        );

        return;

    }

    const empty =
        box.querySelector(
            ".chat-empty"
        );

    if(empty){

        empty.remove();

    }

    const sent =
        String(
            message.sender_id
        ) ===
        String(
            state.currentUser.id
        );

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row " +
        (
            sent
                ? "sent"
                : "received"
        );

    row.dataset.messageId =
        messageId;

    const wrap =
        document.createElement(
            "div"
        );

    wrap.className =
        "message-wrap";

    wrap.dataset.messageWrap =
        messageId;

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message " +
        (
            sent
                ? "sent"
                : "received"
        );

    bubble.dataset.messageId =
        messageId;

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "message-text";

    text.textContent =
        String(
            message.message_text ||
            ""
        );

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "message-meta";

    const time =
        document.createElement(
            "span"
        );

    time.className =
        "message-time";

    time.textContent =
        formatMessageTime(
            message.created_at
        );

    meta.appendChild(
        time
    );

    if(sent){

        const checks =
            document.createElement(
                "span"
            );

        checks.className =
            "message-checks" +
            (
                message.is_read
                    ? " read"
                    : ""
            );

        checks.dataset.messageId =
            messageId;

        checks.textContent =
            message.is_read
                ? "✓✓"
                : "✓";

        checks.title =
            message.is_read
                ? "Read"
                : "Sent";

        meta.appendChild(
            checks
        );

    }

    bubble.appendChild(
        text
    );

    bubble.appendChild(
        meta
    );

    const trigger =
        document.createElement(
            "button"
        );

    trigger.type =
        "button";

    trigger.className =
        "reaction-trigger";

    trigger.setAttribute(
        "aria-label",
        "React to message"
    );

    trigger.innerHTML =
        '<i class="far fa-face-smile"></i>';

    trigger.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            toggleReactionPicker(
                wrap
            );

        }
    );

    const picker =
        createReactionPicker(
            messageId
        );

    wrap.appendChild(
        bubble
    );

    wrap.appendChild(
        trigger
    );

    wrap.appendChild(
        picker
    );

    const reactionBar =
        document.createElement(
            "div"
        );

    reactionBar.className =
        "reaction-bar";

    reactionBar.dataset.reactionBar =
        messageId;

    wrap.appendChild(
        reactionBar
    );

    row.appendChild(
        wrap
    );

    box.appendChild(
        row
    );

    renderMessageReactions(
        messageId
    );

    if(scroll){

        scrollMessagesToBottom();

    }

}


/* =========================================================
   REACTION PICKER
========================================================= */

function createReactionPicker(
    messageId
){

    const picker =
        document.createElement(
            "div"
        );

    picker.className =
        "reaction-picker";

    picker.dataset.pickerFor =
        messageId;

    REACTIONS.forEach(
        emoji => {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "reaction-option";

            button.textContent =
                emoji;

            button.setAttribute(
                "aria-label",
                "React " + emoji
            );

            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    addOrToggleReaction(
                        messageId,
                        emoji
                    );

                }
            );

            picker.appendChild(
                button
            );

        }
    );

    return picker;

}


function toggleReactionPicker(
    wrap
){

    const wasOpen =
        wrap.classList.contains(
            "reaction-open"
        );

    closeAllReactionPickers();

    if(!wasOpen){

        wrap.classList.add(
            "reaction-open"
        );

    }

}


function closeAllReactionPickers(){

    document
        .querySelectorAll(
            ".message-wrap.reaction-open"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "reaction-open"
                );

            }
        );

}


/* =========================================================
   REACTION STORAGE
========================================================= */

function getReactionStorageKey(
    conversationId
){

    return (
        "havkar_message_reactions_v2:" +
        String(
            conversationId
        )
    );

}


function loadReactions(
    conversationId
){

    state.reactions =
        {};

    try{

        const raw =
            localStorage.getItem(
                getReactionStorageKey(
                    conversationId
                )
            );

        if(!raw){
            return;
        }

        const parsed =
            JSON.parse(
                raw
            );

        if(
            parsed &&
            typeof parsed ===
            "object"
        ){

            state.reactions =
                parsed;

        }

    }catch(error){

        console.warn(
            "[HAVKAR] Reaction storage load failed:",
            error
        );

        state.reactions =
            {};

    }

}


function saveReactions(){

    if(
        !state.currentConversationId
    ){

        return;

    }

    try{

        localStorage.setItem(
            getReactionStorageKey(
                state.currentConversationId
            ),
            JSON.stringify(
                state.reactions
            )
        );

    }catch(error){

        console.warn(
            "[HAVKAR] Reaction storage save failed:",
            error
        );

    }

}


/* =========================================================
   REACTION MODEL
========================================================= */

function getMessageReactionData(
    messageId
){

    const key =
        String(
            messageId
        );

    if(
        !state.reactions[key] ||
        typeof state.reactions[key] !==
        "object"
    ){

        state.reactions[key] =
            {};

    }

    return state.reactions[key];

}


function addOrToggleReaction(
    messageId,
    emoji
){

    if(
        !state.currentUser ||
        !state.currentConversationId
    ){

        return;

    }

    if(
        !REACTIONS.includes(
            emoji
        )
    ){

        return;

    }

    const data =
        getMessageReactionData(
            messageId
        );

    const userId =
        String(
            state.currentUser.id
        );

    let currentEmoji =
        null;

    Object.keys(
        data
    ).forEach(
        reactionEmoji => {

            if(
                Array.isArray(
                    data[reactionEmoji]
                ) &&
                data[reactionEmoji].some(
                    id =>
                        String(id) ===
                        userId
                )
            ){

                currentEmoji =
                    reactionEmoji;

            }

        }
    );

    Object.keys(
        data
    ).forEach(
        reactionEmoji => {

            if(
                !Array.isArray(
                    data[reactionEmoji]
                )
            ){

                data[reactionEmoji] =
                    [];

            }

            data[reactionEmoji] =
                data[reactionEmoji].filter(
                    id =>
                        String(id) !==
                        userId
                );

        }
    );

    if(
        currentEmoji !==
        emoji
    ){

        if(
            !Array.isArray(
                data[emoji]
            )
        ){

            data[emoji] =
                [];

        }

        data[emoji].push(
            userId
        );

    }

    cleanupReactionData(
        messageId
    );

    saveReactions();

    renderMessageReactions(
        messageId
    );

    broadcastReaction({
        messageId:
            String(
                messageId
            ),

        reactions:
            cloneReactionData(
                getMessageReactionData(
                    messageId
                )
            )
    });

    closeAllReactionPickers();

}


/* =========================================================
   CLEAN REACTION DATA
========================================================= */

function cleanupReactionData(
    messageId
){

    const data =
        getMessageReactionData(
            messageId
        );

    Object.keys(
        data
    ).forEach(
        emoji => {

            if(
                !Array.isArray(
                    data[emoji]
                ) ||
                !data[emoji].length
            ){

                delete data[emoji];

            }

        }
    );

}


/* =========================================================
   CLONE REACTIONS
========================================================= */

function cloneReactionData(
    data
){

    const output =
        {};

    Object.keys(
        data || {}
    ).forEach(
        emoji => {

            output[emoji] =
                Array.isArray(
                    data[emoji]
                )
                    ? [
                        ...data[emoji]
                    ]
                    : [];

        }
    );

    return output;

}


/* =========================================================
   RENDER REACTIONS
========================================================= */

function renderMessageReactions(
    messageId
){

    const bar =
        document.querySelector(
            `[data-reaction-bar="${cssEscape(
                String(messageId)
            )}"]`
        );

    if(!bar){
        return;
    }

    bar.innerHTML =
        "";

    const data =
        getMessageReactionData(
            messageId
        );

    const userId =
        state.currentUser
            ? String(
                state.currentUser.id
            )
            : null;

    REACTIONS.forEach(
        emoji => {

            const users =
                Array.isArray(
                    data[emoji]
                )
                    ? data[emoji]
                    : [];

            if(!users.length){
                return;
            }

            const chip =
                document.createElement(
                    "button"
                );

            chip.type =
                "button";

            chip.className =
                "reaction-chip";

            if(
                userId &&
                users.some(
                    id =>
                        String(id) ===
                        userId
                )
            ){

                chip.classList.add(
                    "mine"
                );

            }

            const emojiSpan =
                document.createElement(
                    "span"
                );

            emojiSpan.textContent =
                emoji;

            const count =
                document.createElement(
                    "span"
                );

            count.className =
                "reaction-count";

            count.textContent =
                String(
                    users.length
                );

            chip.appendChild(
                emojiSpan
            );

            chip.appendChild(
                count
            );

            chip.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    addOrToggleReaction(
                        messageId,
                        emoji
                    );

                }
            );

            bar.appendChild(
                chip
            );

        }
    );

}


/* =========================================================
   REACTION REALTIME
========================================================= */

function subscribeToReactions(
    conversationId
){

    removeReactionSubscription();

    if(!supabaseClient){
        return;
    }

    try{

        state.reactionChannel =
            supabaseClient
                .channel(
                    "havkar-reactions-" +
                    String(
                        conversationId
                    ) +
                    "-" +
                    Date.now()
                )
                .on(
                    "broadcast",
                    {
                        event:"reaction"
                    },
                    payload => {

                        const data =
                            payload?.payload;

                        if(
                            !data ||
                            String(
                                data.conversationId
                            ) !==
                            String(
                                conversationId
                            )
                        ){

                            return;

                        }

                        if(
                            !data.messageId ||
                            !data.reactions
                        ){

                            return;

                        }

                        state.reactions[
                            String(
                                data.messageId
                            )
                        ] =
                            cloneReactionData(
                                data.reactions
                            );

                        saveReactions();

                        renderMessageReactions(
                            String(
                                data.messageId
                            )
                        );

                    }
                )
                .subscribe(
                    status => {

                        console.log(
                            "[HAVKAR] Reaction realtime:",
                            status
                        );

                    }
                );

    }catch(error){

        console.warn(
            "[HAVKAR] Reaction subscription failed:",
            error
        );

    }

}


function broadcastReaction(
    payload
){

    if(
        !state.reactionChannel ||
        !state.currentConversationId
    ){

        return;

    }

    state.reactionChannel
        .send({
            type:"broadcast",
            event:"reaction",
            payload:{
                conversationId:
                    String(
                        state.currentConversationId
                    ),
                ...payload
            }
        })
        .catch(
            error => {

                console.warn(
                    "[HAVKAR] Reaction broadcast failed:",
                    error
                );

            }
        );

}


function removeReactionSubscription(){

    if(
        state.reactionChannel
    ){

        try{

            supabaseClient.removeChannel(
                state.reactionChannel
            );

        }catch(error){

            console.warn(
                "[HAVKAR] Reaction channel removal failed:",
                error
            );

        }

        state.reactionChannel =
            null;

    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    if(
        !state.currentUser
    ){

        showToast(
            "Please sign in first.",
            "error"
        );

        return;

    }

    if(
        !state.currentConversationId
    ){

        showToast(
            "Open a conversation first.",
            "error"
        );

        return;

    }

    const input =
        $("messageInput");

    const button =
        $("sendButton");

    if(
        !input ||
        !button
    ){

        return;

    }

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    if(
        text.length >
        MAX_MESSAGE_LENGTH
    ){

        showToast(
            "Message is too long.",
            "error"
        );

        return;

    }

    input.disabled =
        true;

    button.disabled =
        true;

    try{

        const result =
            await withTimeout(
                supabaseClient
                    .from("messages")
                    .insert({
                        conversation_id:
                            state.currentConversationId,

                        sender_id:
                            state.currentUser.id,

                        message_text:
                            text,

                        is_read:false

                    })
                    .select(
                        "id,conversation_id,sender_id,message_text,created_at,is_read"
                    )
                    .single()
            );

        if(result.error){

            throw result.error;

        }

        input.value =
            "";

        appendMessage(
            result.data,
            true
        );

        await updateConversationTimestamp();

    }catch(error){

        console.error(
            "[HAVKAR] Send message error:",
            error
        );

        showToast(
            error?.message === "REQUEST_TIMEOUT"
                ? "Sending the message timed out."
                : "Message could not be sent.",
            "error"
        );

    }finally{

        input.disabled =
            false;

        button.disabled =
            false;

        input.focus();

    }

}


/* =========================================================
   UPDATE CONVERSATION TIMESTAMP
========================================================= */

async function updateConversationTimestamp(){

    if(
        !state.currentConversationId
    ){

        return;

    }

    try{

        const result =
            await withTimeout(
                supabaseClient
                    .from("conversations")
                    .update({
                        updated_at:
                            new Date()
                                .toISOString()
                    })
                    .eq(
                        "id",
                        state.currentConversationId
                    )
            );

        if(result.error){

            console.warn(
                "[HAVKAR] Timestamp update:",
                result.error
            );

        }

    }catch(error){

        console.warn(
            "[HAVKAR] Timestamp update failed:",
            error
        );

    }

}


/* =========================================================
   MARK READ
========================================================= */

async function markMessagesRead(
    conversationId
){

    if(
        !state.currentUser ||
        !conversationId
    ){

        return;

    }

    try{

        const result =
            await withTimeout(
                supabaseClient
                    .from("messages")
                    .update({
                        is_read:true
                    })
                    .eq(
                        "conversation_id",
                        conversationId
                    )
                    .neq(
                        "sender_id",
                        state.currentUser.id
                    )
                    .eq(
                        "is_read",
                        false
                    )
            );

        if(result.error){

            console.warn(
                "[HAVKAR] Mark read error:",
                result.error
            );

        }

    }catch(error){

        console.warn(
            "[HAVKAR] Mark read failed:",
            error
        );

    }

    const conversation =
        state.conversations.find(
            item =>
                String(item.id) ===
                String(conversationId)
        );

    if(conversation){

        conversation.unreadCount =
            0;

    }

}


/* =========================================================
   MESSAGE REALTIME
========================================================= */

function subscribeToConversation(
    conversationId
){

    removeRealtimeSubscription();

    if(!supabaseClient){
        return;
    }

    try{

        state.realtimeChannel =
            supabaseClient
                .channel(
                    "havkar-chat-" +
                    String(
                        conversationId
                    ) +
                    "-" +
                    Date.now()
                )
                .on(
                    "postgres_changes",
                    {
                        event:"INSERT",
                        schema:"public",
                        table:"messages",
                        filter:
                            "conversation_id=eq." +
                            conversationId
                    },
                    async payload => {

                        const message =
                            payload?.new;

                        if(
                            !message ||
                            String(
                                message.conversation_id
                            ) !==
                            String(
                                conversationId
                            )
                        ){

                            return;

                        }

                        appendMessage(
                            message,
                            true
                        );

                        if(
                            String(
                                message.sender_id
                            ) !==
                            String(
                                state.currentUser.id
                            )
                        ){

                            await markMessagesRead(
                                conversationId
                            );

                        }

                    }
                )
                .on(
                    "postgres_changes",
                    {
                        event:"UPDATE",
                        schema:"public",
                        table:"messages",
                        filter:
                            "conversation_id=eq." +
                            conversationId
                    },
                    payload => {

                        updateRenderedMessage(
                            payload?.new
                        );

                    }
                )
                .subscribe(
                    status => {

                        console.log(
                            "[HAVKAR] Chat realtime:",
                            status
                        );

                    }
                );

    }catch(error){

        console.warn(
            "[HAVKAR] Chat realtime subscription failed:",
            error
        );

    }

}


function removeRealtimeSubscription(){

    if(
        state.realtimeChannel
    ){

        try{

            supabaseClient.removeChannel(
                state.realtimeChannel
            );

        }catch(error){

            console.warn(
                "[HAVKAR] Chat channel removal failed:",
                error
            );

        }

        state.realtimeChannel =
            null;

    }

}


/* =========================================================
   UPDATE MESSAGE
========================================================= */

function updateRenderedMessage(
    message
){

    if(
        !message ||
        !message.id ||
        !state.currentConversationId
    ){

        return;

    }

    if(
        String(
            message.conversation_id
        ) !==
        String(
            state.currentConversationId
        )
    ){

        return;

    }

    const element =
        document.querySelector(
            `[data-message-id="${cssEscape(
                String(
                    message.id
                )
            )}"] .message-checks`
        );

    if(
        element &&
        state.currentUser &&
        String(
            message.sender_id
        ) ===
        String(
            state.currentUser.id
        )
    ){

        element.textContent =
            message.is_read
                ? "✓✓"
                : "✓";

        element.classList.toggle(
            "read",
            !!message.is_read
        );

        element.title =
            message.is_read
                ? "Read"
                : "Sent";

    }

}


/* =========================================================
   CLOSE CHAT
========================================================= */

function closeChat(){

    removeRealtimeSubscription();

    removeReactionSubscription();

    closeAllReactionPickers();

    state.currentConversation =
        null;

    state.currentConversationId =
        null;

    state.reactions =
        {};

    $("chatScreen")
        .style.display =
        "none";

    $("messageList")
        .style.display =
        "block";

    history.replaceState(
        {},
        "",
        "chat.html"
    );

    loadConversations();

}

){

        )

    ){

/* =========================================================
   TIME
========================================================= */

function formatTime(
    value
){

    if(!value){
        return "";
    }

    const date =
        new Date(
            value
        );

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }

    const now =
        new Date();

    const difference =
        now.getTime() -
        date.getTime();

    if(
        difference < 0
    ){

        return date.toLocaleDateString(
            undefined,
            {
                day:"numeric",
                month:"short"
            }
        );

    }

    const minutes =
        Math.floor(
            difference / 60000
        );

    if(
        minutes < 1
    ){

        return "Now";

    }

    if(
        minutes < 60
    ){

        return (
            minutes +
            "m"
        );

    }

    const hours =
        Math.floor(
            minutes / 60
        );

    if(
        hours < 24
    ){

        return (
            hours +
            "h"
        );

    }

    const days =
        Math.floor(
            hours / 24
        );

    if(
        days < 7
    ){

        return (
            days +
            "d"
        );

    }

    return date.toLocaleDateString(
        undefined,
        {
            day:"numeric",
            month:"short"
        }
    );

}


function formatMessageTime(
    value
){

    if(!value){
        return "";
    }

    const date =
        new Date(
            value
        );

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }

    return date.toLocaleTimeString(
        undefined,
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function cssEscape(
    value
){

    if(
        window.CSS &&
        typeof window.CSS.escape ===
        "function"
    ){

        return window.CSS.escape(
            String(value)
        );

    }

    return String(value)
        .replace(
            /["\\]/g,
            "\\$&"
        );

}

/* =========================================================
   AUTH STATE
========================================================= */

function setupAuthListener(){

    if(!supabaseClient){
        return;
    }

    supabaseClient.auth.onAuthStateChange(
        (
            event,
            session
        ) => {

            if(
                event ===
                "SIGNED_OUT"
            ){

                state.currentUser =
                    null;

                removeRealtimeSubscription();

                removeReactionSubscription();

                redirectToLogin();

                return;

            }

            if(
                (
                    event ===
                    "SIGNED_IN"
                ) &&
                session?.user
            ){

                state.currentUser =
                    session.user;

            }

            if(
                (
                    event ===
                    "TOKEN_REFRESHED"
                ) &&
                session?.user
            ){

                state.currentUser =
                    session.user;

            }

        }
    );

}

/* =========================================================
   PAGE START
========================================================= */

async function startPage(){

    if(state.pageStarted){
        return;
    }

    if(!supabaseClient){
        return;
    }

    state.pageStarted =
        true;

    setupEvents();

    setupAuthListener();

    try{

        state.currentUser =
            await loadCurrentUser();

    }catch(error){

        console.error(
            "[HAVKAR] Initial authentication failed:",
            error
        );

        showFatalError(
            "HAVKAR connection error",
            "The authentication service could not be reached. Please try again."
        );

        return;

    }

    if(
        !state.currentUser
    ){

        redirectToLogin();

        return;

    }

    const params =
        new URLSearchParams(
            window.location.search
        );

    const conversationId =
        params.get(
            "conversation_id"
        );

    if(conversationId){

        /*
         * Direct conversation is opened first.
         * The list is always secondary.
         */

        await openConversationFromUrl();

        /*
         * Never block the chat screen on the list.
         */

        loadConversations();

        return;

    }

    await loadConversations();

}


/* =========================================================
   DOM READY
========================================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            if(supabaseClient){

                startPage();

            }

        },
        {
            once:true
        }
    );

}else{

    if(supabaseClient){

        startPage();

    }

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        removeRealtimeSubscription();

        removeReactionSubscription();

    }
);
