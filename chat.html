<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>HAVKAR - Messages</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

html{
    height:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    Roboto,Arial,sans-serif;
    background:#f5f6f5;
    color:#333;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

/* =========================
   HEADER
========================= */

.header{
    height:70px;
    min-height:70px;
    background:linear-gradient(135deg,#689f38,#7cb342);
    color:#fff;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
    position:relative;
    z-index:20;
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn,
.icon-btn{
    border:none;
    color:#fff;
    cursor:pointer;
}

.back-btn{
    width:42px;
    height:42px;
    background:transparent;
    border-radius:50%;
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.back-btn:active{
    background:rgba(255,255,255,.15);
}

.header h1{
    font-size:21px;
    font-weight:700;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.icon-btn:active{
    background:rgba(255,255,255,.30);
}

/* =========================
   HEADER MENU
========================= */

.header-menu{
    position:absolute;
    top:58px;
    right:15px;
    width:190px;
    background:#fff;
    border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    overflow:hidden;
    display:none;
    z-index:100;
}

.header-menu.show{
    display:block;
}

.header-menu button{
    width:100%;
    border:none;
    background:#fff;
    padding:14px 16px;
    text-align:left;
    font-size:14px;
    color:#333;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
}

.header-menu button:active{
    background:#f5f5f5;
}

.header-menu i{
    width:20px;
    color:#689f38;
}

/* =========================
   SEARCH
========================= */

.search-bar{
    padding:15px 20px;
    background:#fff;
    border-bottom:1px solid #eee;
}

.search-box{
    position:relative;
}

.search-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#999;
    font-size:16px;
    pointer-events:none;
}

.search-input{
    width:100%;
    height:50px;
    padding:0 18px 0 45px;
    border:2px solid #e2e2e2;
    border-radius:26px;
    font-size:16px;
    background:#fff;
    color:#333;
    outline:none;
}

.search-input:focus{
    border-color:#7cb342;
    box-shadow:0 0 0 3px rgba(124,179,66,.10);
}

/* =========================
   CONTENT
========================= */

.content{
    padding-bottom:90px;
}

.section-header{
    padding:20px 20px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.section-title{
    font-size:20px;
    font-weight:700;
    color:#333;
}

.message-count{
    font-size:13px;
    color:#888;
}

/* =========================
   LOADING
========================= */

.loading{
    padding:70px 20px;
    text-align:center;
    color:#888;
}

.loading i{
    font-size:30px;
    margin-bottom:12px;
    color:#7cb342;
}

.loading p{
    font-size:14px;
}

/* =========================
   CHAT ITEMS
========================= */

.chat-item{
    background:#fff;
    min-height:92px;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:15px;
    cursor:pointer;
    border-bottom:1px solid #ededed;
    transition:background .15s;
}

.chat-item:active{
    background:#f0f0f0;
}

.avatar{
    width:55px;
    height:55px;
    min-width:55px;
    border-radius:50%;
    background:linear-gradient(135deg,#e8f5e9,#c5e1a5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    flex-shrink:0;
    color:#689f38;
}

.chat-info{
    flex:1;
    min-width:0;
}

.chat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:5px;
}

.name{
    font-size:16px;
    font-weight:700;
    color:#333;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.time{
    font-size:12px;
    color:#999;
    white-space:nowrap;
}

.message-preview{
    font-size:14px;
    color:#666;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    line-height:1.4;
}

.ad-label{
    font-size:11px;
    color:#7cb342;
    margin-top:4px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.unread{
    background:#7cb342;
    color:#fff;
    border-radius:50%;
    width:22px;
    height:22px;
    min-width:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
}

/* =========================
   EMPTY
========================= */

.empty-state{
    padding:75px 25px;
    text-align:center;
    color:#999;
}

.empty-state i{
    font-size:48px;
    margin-bottom:18px;
    color:#b7cdb0;
}

.empty-state h3{
    font-size:18px;
    color:#555;
    margin-bottom:8px;
}

.empty-state p{
    font-size:14px;
    line-height:1.5;
}

/* =========================
   NO RESULTS
========================= */

.no-results{
    display:none;
    padding:60px 20px;
    text-align:center;
    color:#999;
}

.no-results i{
    font-size:42px;
    margin-bottom:15px;
    color:#bbb;
}

.no-results h3{
    font-size:17px;
    color:#555;
    margin-bottom:6px;
}

.no-results p{
    font-size:14px;
}

/* =========================
   CHAT SCREEN
========================= */

.chat-screen{
    display:none;
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:100vh;
    min-height:100dvh;
    background:#f5f6f5;
    flex-direction:column;
    z-index:200;
    overflow:hidden;
}

.chat-screen-header{
    flex:0 0 70px;
    height:70px;
    min-height:70px;
    background:linear-gradient(135deg,#689f38,#7cb342);
    color:#fff;
    padding:0 15px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
    padding-top:env(safe-area-inset-top,0px);
    box-sizing:content-box;
}

.chat-screen-header button{
    width:42px;
    height:42px;
    min-width:42px;
    min-height:42px;
    border:none;
    border-radius:50%;
    background:transparent;
    color:#fff;
    font-size:23px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.chat-screen-header button:active{
    background:rgba(255,255,255,.15);
}

.chat-screen-header .avatar{
    width:42px;
    height:42px;
    min-width:42px;
    font-size:19px;
}

.chat-title-area{
    flex:1;
    min-width:0;
}

.chat-person{
    font-size:18px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.chat-subtitle{
    font-size:11px;
    opacity:.88;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.chat-header-action{
    flex-shrink:0;
}

/* =========================
   CHAT MESSAGES
========================= */

.chat-messages{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:20px 15px 15px;
    display:flex;
    flex-direction:column;
}

.message-row{
    width:100%;
    display:flex;
    margin-bottom:10px;
    flex:0 0 auto;
}

.message-row.received{
    justify-content:flex-start;
}

.message-row.sent{
    justify-content:flex-end;
}

.message{
    max-width:78%;
    padding:10px 13px 7px;
    border-radius:18px;
    font-size:15px;
    line-height:1.45;
    word-break:break-word;
    overflow-wrap:anywhere;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
}

.message.received{
    background:#fff;
    color:#333;
    border-bottom-left-radius:5px;
}

.message.sent{
    background:#7cb342;
    color:#fff;
    border-bottom-right-radius:5px;
}

.message-text{
    white-space:pre-wrap;
}

.message-meta{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:5px;
    margin-top:4px;
    font-size:10px;
    opacity:.72;
}

.message-checks{
    font-size:11px;
    letter-spacing:-2px;
}

.message-checks.read{
    color:#dff7d5;
}

/* =========================
   CHAT EMPTY
========================= */

.chat-empty{
    margin:auto;
    text-align:center;
    color:#999;
    padding:30px;
    flex:0 0 auto;
}

.chat-empty i{
    font-size:42px;
    color:#c1d2bc;
    margin-bottom:12px;
}

/* =========================
   MESSAGE INPUT
========================= */

.message-input-area{
    flex:0 0 auto;
    position:relative;
    z-index:220;
    width:100%;
    min-height:68px;
    background:#fff;
    padding:10px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
    display:flex;
    align-items:center;
    gap:8px;
    border-top:1px solid #ddd;
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.message-input{
    flex:1 1 auto;
    min-width:0;
    width:100%;
    height:48px;
    min-height:48px;
    border:1px solid #ddd;
    border-radius:25px;
    padding:0 16px;
    font-size:15px;
    outline:none;
    background:#fff;
    color:#333;
    -webkit-appearance:none;
    appearance:none;
}

.message-input:focus{
    border-color:#7cb342;
    box-shadow:0 0 0 2px rgba(124,179,66,.08);
}

.message-input:disabled{
    background:#f4f4f4;
}

.send-btn{
    flex:0 0 48px;
    width:48px;
    height:48px;
    min-width:48px;
    min-height:48px;
    border:none;
    border-radius:50%;
    background:#7cb342;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.send-btn:active{
    transform:scale(.95);
    background:#689f38;
}

.send-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:88px;
    transform:translateX(-50%) translateY(15px);
    background:#333;
    color:#fff;
    padding:12px 18px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.error{
    background:#b3261e;
}

.toast.success{
    background:#689f38;
}

/* =========================
   BOTTOM NAVIGATION
========================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:72px;
    background:#fff;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -2px 12px rgba(0,0,0,.10);
    z-index:50;
}

.nav-item{
    width:25%;
    height:60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#999;
    font-size:12px;
    cursor:pointer;
    border:none;
    background:transparent;
}

.nav-item i{
    font-size:21px;
}

.nav-item span{
    font-size:12px;
}

.nav-item.active{
    color:#7cb342;
}

.nav-item:active{
    transform:scale(.94);
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .header{
        padding:0 15px;
    }

    .search-bar{
        padding:14px 15px;
    }

    .section-header{
        padding-left:15px;
        padding-right:15px;
    }

    .chat-item{
        padding:14px 15px;
    }

    .chat-screen-header{
        padding-left:10px;
        padding-right:10px;
    }

    .chat-messages{
        padding:15px 12px 12px;
    }

    .message{
        max-width:84%;
    }

    .message-input-area{
        padding-left:8px;
        padding-right:8px;
    }

    .message-input{
        font-size:16px;
    }
}

/* =========================
   SMALL HEIGHT DEVICES
========================= */

@media(max-width:480px) and (max-height:700px){

    .chat-screen-header{
        flex-basis:62px;
        height:62px;
        min-height:62px;
    }

    .chat-screen-header .avatar{
        width:38px;
        height:38px;
        min-width:38px;
        font-size:17px;
    }

    .chat-screen-header button{
        width:40px;
        height:40px;
        min-width:40px;
        min-height:40px;
    }

    .chat-person{
        font-size:17px;
    }

    .message-input-area{
        min-height:64px;
        padding-top:8px;
        padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
    }

    .message-input,
    .send-btn{
        height:46px;
        min-height:46px;
    }

    .send-btn{
        width:46px;
        min-width:46px;
        flex-basis:46px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     MESSAGE LIST
========================================================= -->

<div id="messageList">

    <div class="header">

        <div class="header-left">

            <button
                class="back-btn"
                type="button"
                onclick="goHome()"
                aria-label="Back to home">
                <i class="fas fa-arrow-left"></i>
            </button>

            <h1>Messages</h1>

        </div>

        <button
            class="icon-btn"
            type="button"
            onclick="toggleHeaderMenu()"
            aria-label="More options">
            <i class="fas fa-ellipsis-v"></i>
        </button>

        <div id="headerMenu" class="header-menu">

            <button type="button" onclick="goNotifications()">
                <i class="fas fa-bell"></i>
                Notifications
            </button>

            <button type="button" onclick="goProfile()">
                <i class="fas fa-user"></i>
                Profile
            </button>

        </div>

    </div>


    <div class="search-bar">

        <div class="search-box">

            <i class="fas fa-search search-icon"></i>

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search messages..."
                autocomplete="off"
                oninput="searchMessages(this.value)"
            >

        </div>

    </div>


    <div class="section-header">

        <div class="section-title">
            Conversations
        </div>

        <div class="message-count" id="messageCount">
            0 chats
        </div>

    </div>


    <div class="content" id="conversationList">

        <div class="loading" id="conversationLoading">

            <i class="fas fa-circle-notch fa-spin"></i>

            <p>Loading conversations...</p>

        </div>

    </div>


    <div id="noResults" class="no-results">

        <i class="fas fa-comments"></i>

        <h3>No conversations found</h3>

        <p>Try another name or keyword.</p>

    </div>


    <nav class="bottom-nav">

        <button
            class="nav-item"
            type="button"
            onclick="goHome()">

            <i class="fas fa-home"></i>

            <span>Home</span>

        </button>


        <button
            class="nav-item active"
            type="button"
            onclick="goMessages()">

            <i class="fas fa-comment"></i>

            <span>Messages</span>

        </button>


        <button
            class="nav-item"
            type="button"
            onclick="goNotifications()">

            <i class="fas fa-bell"></i>

            <span>Notifications</span>

        </button>


        <button
            class="nav-item"
            type="button"
            onclick="goProfile()">

            <i class="fas fa-user"></i>

            <span>Profile</span>

        </button>

    </nav>

</div>


<!-- =========================================================
     CHAT SCREEN
========================================================= -->

<div id="chatScreen" class="chat-screen">

    <div class="chat-screen-header">

        <button
            type="button"
            onclick="closeChat()"
            aria-label="Back">

            <i class="fas fa-arrow-left"></i>

        </button>


        <div
            class="avatar"
            id="chatAvatar">
            <i class="fas fa-user"></i>
        </div>


        <div class="chat-title-area">

            <div
                class="chat-person"
                id="chatPerson">
                Conversation
            </div>

            <div
                class="chat-subtitle"
                id="chatSubtitle">
                HAVKAR
            </div>

        </div>


        <button
            class="chat-header-action"
            type="button"
            onclick="showChatInfo()"
            aria-label="Conversation information">

            <i class="fas fa-circle-info"></i>

        </button>

    </div>


    <div
        class="chat-messages"
        id="chatMessages">

        <div class="chat-empty" id="chatLoading">

            <i class="fas fa-circle-notch fa-spin"></i>

            <p>Loading messages...</p>

        </div>

    </div>


    <div class="message-input-area">

        <input
            id="messageInput"
            class="message-input"
            type="text"
            inputmode="text"
            enterkeyhint="send"
            placeholder="Write a message..."
            autocomplete="off"
            autocapitalize="sentences"
            maxlength="4000"
            onkeydown="handleEnter(event)"
        >

        <button
            id="sendButton"
            class="send-btn"
            type="button"
            onclick="sendMessage()"
            aria-label="Send message">

            <i class="fas fa-paper-plane"></i>

        </button>

    </div>

</div>


<div id="toast" class="toast"></div>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://gispovnciifgikvgpzck.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:false
            }
        }
    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let conversations = [];

let currentConversation = null;

let currentConversationId = null;

let realtimeChannel = null;

let searchTerm = "";


/* =========================================================
   NAVIGATION
========================================================= */

function goHome(){

    window.location.href = "index.html";

}


function goMessages(){

    window.location.href = "chat.html";

}


function goNotifications(){

    window.location.href = "notifications.html";

}


function goProfile(){

    window.location.href = "profile.html";

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message,type=""){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.className = "toast";

    if(type){
        toast.classList.add(type);
    }

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(function(){

            toast.classList.remove("show");

        },2800);

}


/* =========================================================
   HEADER MENU
========================================================= */

function toggleHeaderMenu(){

    const menu =
        document.getElementById("headerMenu");

    menu.classList.toggle("show");

}


document.addEventListener("click",function(event){

    const menu =
        document.getElementById("headerMenu");

    const button =
        document.querySelector(".icon-btn");

    if(
        menu &&
        button &&
        menu.classList.contains("show") &&
        !menu.contains(event.target) &&
        !button.contains(event.target)
    ){

        menu.classList.remove("show");

    }

});


/* =========================================================
   AUTH
========================================================= */

async function loadCurrentUser(){

    const result =
        await supabaseClient.auth.getSession();

    if(result.error){

        console.error(result.error);

        return null;

    }

    if(
        result.data &&
        result.data.session &&
        result.data.session.user
    ){

        return result.data.session.user;

    }

    return null;

}


/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations(){

    const list =
        document.getElementById("conversationList");

    list.innerHTML = `
        <div class="loading" id="conversationLoading">
            <i class="fas fa-circle-notch fa-spin"></i>
            <p>Loading conversations...</p>
        </div>
    `;

    const result =
        await supabaseClient
            .from("conversations")
            .select(
                "id,ad_id,buyer_id,seller_id,created_at,updated_at"
            )
            .or(
                "buyer_id.eq." +
                currentUser.id +
                ",seller_id.eq." +
                currentUser.id
            )
            .order(
                "updated_at",
                {
                    ascending:false,
                    nullsFirst:false
                }
            );

    if(result.error){

        console.error(
            "Conversation load error:",
            result.error
        );

        list.innerHTML = "";

        showEmptyState(
            "Unable to load conversations.",
            "Please try again."
        );

        showToast(
            "Could not load messages.",
            "error"
        );

        return;

    }

    conversations =
        result.data || [];

    await enrichConversations();

    renderConversationList();

}


/* =========================================================
   ENRICH CONVERSATIONS
========================================================= */

async function enrichConversations(){

    if(!conversations.length){
        return;
    }

    const adIds =
        conversations
            .map(item => item.ad_id)
            .filter(
                id =>
                    id !== null &&
                    id !== undefined
            );

    let adsMap = {};

    if(adIds.length){

        const adResult =
            await supabaseClient
                .from("ads")
                .select(
                    "id,title,category,price,location"
                )
                .in("id",adIds);

        if(!adResult.error){

            (adResult.data || [])
                .forEach(function(ad){

                    adsMap[String(ad.id)] =
                        ad;

                });

        }

    }


    for(const conversation of conversations){

        conversation.ad =
            conversation.ad_id !== null &&
            conversation.ad_id !== undefined
                ? adsMap[String(conversation.ad_id)] || null
                : null;


        conversation.lastMessage =
            null;


        const messageResult =
            await supabaseClient
                .from("messages")
                .select(
                    "id,sender_id,message_text,created_at,is_read"
                )
                .eq(
                    "conversation_id",
                    conversation.id
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                )
                .limit(1);


        if(
            !messageResult.error &&
            messageResult.data &&
            messageResult.data.length
        ){

            conversation.lastMessage =
                messageResult.data[0];

        }


        const unreadResult =
            await supabaseClient
                .from("messages")
                .select(
                    "id",
                    {
                        count:"exact",
                        head:true
                    }
                )
                .eq(
                    "conversation_id",
                    conversation.id
                )
                .eq(
                    "is_read",
                    false
                )
                .neq(
                    "sender_id",
                    currentUser.id
                );


        conversation.unreadCount =
            !unreadResult.error &&
            unreadResult.count
                ? unreadResult.count
                : 0;

    }

}


/* =========================================================
   RENDER CONVERSATIONS
========================================================= */

function renderConversationList(){

    const list =
        document.getElementById("conversationList");

    const noResults =
        document.getElementById("noResults");

    const filtered =
        conversations.filter(function(conversation){

            if(!searchTerm){
                return true;
            }

            const ad =
                conversation.ad;

            const text = [
                getConversationRole(conversation),
                ad ? ad.title : "",
                ad ? ad.category : "",
                ad ? ad.location : "",
                conversation.lastMessage
                    ? conversation.lastMessage.message_text
                    : ""
            ]
            .join(" ")
            .toLowerCase();

            return text.includes(searchTerm);

        });


    document.getElementById("messageCount")
        .textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " chat"
                : " chats"
        );


    list.innerHTML = "";


    if(!conversations.length){

        noResults.style.display = "none";

        showEmptyState(
            "No conversations yet",
            "Your HAVKAR conversations will appear here."
        );

        return;

    }


    if(!filtered.length){

        noResults.style.display = "block";

        return;

    }


    noResults.style.display = "none";


    filtered.forEach(function(conversation){

        list.appendChild(
            createConversationElement(conversation)
        );

    });

}


/* =========================================================
   CONVERSATION ELEMENT
========================================================= */

function createConversationElement(conversation){

    const item =
        document.createElement("div");

    item.className = "chat-item";

    item.dataset.search =
        [
            getConversationRole(conversation),
            conversation.ad
                ? conversation.ad.title
                : "",
            conversation.lastMessage
                ? conversation.lastMessage.message_text
                : ""
        ]
        .join(" ")
        .toLowerCase();


    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.innerHTML =
        '<i class="fas fa-user"></i>';


    const info =
        document.createElement("div");

    info.className = "chat-info";


    const header =
        document.createElement("div");

    header.className = "chat-header";


    const name =
        document.createElement("div");

    name.className = "name";

    name.textContent =
        getConversationRole(conversation);


    const time =
        document.createElement("div");

    time.className = "time";

    if(conversation.lastMessage){

        time.textContent =
            formatTime(
                conversation.lastMessage.created_at
            );

    }else{

        time.textContent =
            formatTime(conversation.updated_at);

    }


    header.appendChild(name);

    header.appendChild(time);


    const preview =
        document.createElement("div");

    preview.className = "message-preview";


    if(conversation.lastMessage){

        const prefix =
            conversation.lastMessage.sender_id ===
            currentUser.id
                ? "You: "
                : "";

        preview.textContent =
            prefix +
            conversation.lastMessage.message_text;

    }else{

        preview.textContent =
            "No messages yet";

    }


    info.appendChild(header);

    info.appendChild(preview);


    if(conversation.ad){

        const adLabel =
            document.createElement("div");

        adLabel.className = "ad-label";

        adLabel.textContent =
            "Listing: " +
            conversation.ad.title;

        info.appendChild(adLabel);

    }


    item.appendChild(avatar);

    item.appendChild(info);


    if(conversation.unreadCount > 0){

        const unread =
            document.createElement("div");

        unread.className = "unread";

        unread.textContent =
            conversation.unreadCount > 99
                ? "99+"
                : conversation.unreadCount;

        item.appendChild(unread);

    }


    item.addEventListener(
        "click",
        function(){

            openConversation(conversation);

        }
    );


    return item;

}


/* =========================================================
   CONVERSATION ROLE
========================================================= */

function getConversationRole(conversation){

    if(
        conversation.seller_id ===
        currentUser.id
    ){

        return "Buyer";

    }

    if(
        conversation.buyer_id ===
        currentUser.id
    ){

        return "Seller";

    }

    return "HAVKAR Member";

}


/* =========================================================
   EMPTY STATE
========================================================= */

function showEmptyState(title,text){

    const list =
        document.getElementById("conversationList");

    list.innerHTML = `
        <div class="empty-state">
            <i class="fas fa-comments"></i>
            <h3>${escapeHtml(title)}</h3>
            <p>${escapeHtml(text)}</p>
        </div>
    `;

}


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(conversation){

    if(!conversation || !conversation.id){
        return;
    }


    currentConversation =
        conversation;

    currentConversationId =
        conversation.id;


    document.getElementById("messageList")
        .style.display = "none";


    document.getElementById("chatScreen")
        .style.display = "flex";


    document.getElementById("chatPerson")
        .textContent =
        getConversationRole(conversation);


    document.getElementById("chatSubtitle")
        .textContent =
        conversation.ad
            ? conversation.ad.title
            : "HAVKAR Conversation";


    document.getElementById("chatMessages")
        .innerHTML = `
            <div class="chat-empty">
                <i class="fas fa-circle-notch fa-spin"></i>
                <p>Loading messages...</p>
            </div>
        `;


    await loadMessages(
        conversation.id
    );


    await markMessagesRead(
        conversation.id
    );


    subscribeToConversation(
        conversation.id
    );


    setTimeout(function(){

        const input =
            document.getElementById("messageInput");

        if(input){

            input.focus();

        }

    },150);

}


/* =========================================================
   URL CONVERSATION
========================================================= */

async function openConversationFromUrl(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const conversationId =
        params.get("conversation_id");


    if(!conversationId){
        return;
    }


    const conversation =
        conversations.find(function(item){

            return String(item.id) ===
                String(conversationId);

        });


    if(conversation){

        await openConversation(
            conversation
        );

        return;

    }


    const result =
        await supabaseClient
            .from("conversations")
            .select(
                "id,ad_id,buyer_id,seller_id,created_at,updated_at"
            )
            .eq(
                "id",
                conversationId
            )
            .maybeSingle();


    if(result.error){

        console.error(result.error);

        showToast(
            "Conversation could not be opened.",
            "error"
        );

        return;

    }


    if(!result.data){

        showToast(
            "Conversation not found.",
            "error"
        );

        return;

    }


    const belongsToUser =
        result.data.buyer_id === currentUser.id ||
        result.data.seller_id === currentUser.id;


    if(!belongsToUser){

        showToast(
            "You do not have access to this conversation.",
            "error"
        );

        return;

    }


    conversations.unshift(
        result.data
    );


    await enrichConversations();


    const openedConversation =
        conversations.find(
            item =>
                String(item.id) ===
                String(conversationId)
        );


    if(openedConversation){

        await openConversation(
            openedConversation
        );

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(conversationId){

    const box =
        document.getElementById("chatMessages");


    const result =
        await supabaseClient
            .from("messages")
            .select(
                "id,conversation_id,sender_id,message_text,created_at,is_read"
            )
            .eq(
                "conversation_id",
                conversationId
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(result.error){

        console.error(
            "Message load error:",
            result.error
        );


        box.innerHTML = `
            <div class="chat-empty">
                <i class="fas fa-triangle-exclamation"></i>
                <p>Unable to load messages.</p>
            </div>
        `;

        return;

    }


    renderMessages(
        result.data || []
    );

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(messages){

    const box =
        document.getElementById("chatMessages");

    box.innerHTML = "";


    if(!messages.length){

        box.innerHTML = `
            <div class="chat-empty">
                <i class="fas fa-comment-dots"></i>
                <p>Start the conversation.</p>
            </div>
        `;

        return;

    }


    messages.forEach(function(message){

        appendMessage(
            message,
            false
        );

    });


    scrollMessagesToBottom();

}


/* =========================================================
   APPEND MESSAGE
========================================================= */

function appendMessage(message,scroll=true){

    if(
        !message ||
        !message.id ||
        !message.conversation_id
    ){

        return;

    }


    const box =
        document.getElementById("chatMessages");


    const existing =
        box.querySelector(
            '[data-message-id="' +
            cssEscape(String(message.id)) +
            '"]'
        );


    if(existing){

        updateRenderedMessage(
            message
        );

        return;

    }


    const empty =
        box.querySelector(".chat-empty");

    if(empty){
        empty.remove();
    }


    const sent =
        message.sender_id ===
        currentUser.id;


    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (sent ? "sent" : "received");

    row.dataset.messageId =
        String(message.id);


    const bubble =
        document.createElement("div");

    bubble.className =
        "message " +
        (sent ? "sent" : "received");

    bubble.dataset.messageId =
        String(message.id);


    const text =
        document.createElement("div");

    text.className =
        "message-text";

    text.textContent =
        message.message_text;


    const meta =
        document.createElement("div");

    meta.className =
        "message-meta";


    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        formatMessageTime(
            message.created_at
        );


    meta.appendChild(time);


    if(sent){

        const checks =
            document.createElement("span");

        checks.className =
            "message-checks" +
            (
                message.is_read
                    ? " read"
                    : ""
            );

        checks.dataset.messageId =
            String(message.id);

        checks.textContent =
            message.is_read
                ? "✓✓"
                : "✓";

        checks.title =
            message.is_read
                ? "Read"
                : "Sent";


        meta.appendChild(checks);

    }


    bubble.appendChild(text);

    bubble.appendChild(meta);

    row.appendChild(bubble);

    box.appendChild(row);


    if(scroll){

        scrollMessagesToBottom();

    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    if(!currentUser){

        showToast(
            "Please sign in first.",
            "error"
        );

        return;

    }


    if(!currentConversationId){

        showToast(
            "Open a conversation first.",
            "error"
        );

        return;

    }


    const input =
        document.getElementById("messageInput");

    const button =
        document.getElementById("sendButton");


    if(!input || !button){
        return;
    }


    const text =
        input.value.trim();


    if(!text){
        return;

    }


    if(text.length > 4000){

        showToast(
            "Message is too long.",
            "error"
        );

        return;

    }


    input.disabled = true;

    button.disabled = true;


    const result =
        await supabaseClient
            .from("messages")
            .insert({
                conversation_id:
                    currentConversationId,

                sender_id:
                    currentUser.id,

                message_text:
                    text,

                is_read:false
            })
            .select(
                "id,conversation_id,sender_id,message_text,created_at,is_read"
            )
            .single();


    if(result.error){

        console.error(
            "Send message error:",
            result.error
        );


        showToast(
            "Message could not be sent.",
            "error"
        );


        input.disabled = false;

        button.disabled = false;

        input.focus();

        return;

    }


    input.value = "";


    /*
       Add the message immediately.

       The DOM now contains data-message-id,
       so if Realtime also delivers the INSERT,
       the message will NOT be duplicated.
    */

    appendMessage(
        result.data,
        true
    );


    input.disabled = false;

    button.disabled = false;

    input.focus();


    await updateConversationTimestamp();

}


/* =========================================================
   UPDATE CONVERSATION TIMESTAMP
========================================================= */

async function updateConversationTimestamp(){

    if(!currentConversationId){
        return;
    }


    const result =
        await supabaseClient
            .from("conversations")
            .update({
                updated_at:
                    new Date().toISOString()
            })
            .eq(
                "id",
                currentConversationId
            );


    if(result.error){

        console.warn(
            "Conversation timestamp update:",
            result.error
        );

    }

}


/* =========================================================
   MARK AS READ
========================================================= */

async function markMessagesRead(conversationId){

    if(!currentUser || !conversationId){
        return;
    }


    const result =
        await supabaseClient
            .from("messages")
            .update({
                is_read:true
            })
            .eq(
                "conversation_id",
                conversationId
            )
            .neq(
                "sender_id",
                currentUser.id
            )
            .eq(
                "is_read",
                false
            );


    if(result.error){

        console.warn(
            "Mark read error:",
            result.error
        );

    }


    const conversation =
        conversations.find(
            item =>
                String(item.id) ===
                String(conversationId)
        );


    if(conversation){

        conversation.unreadCount = 0;

    }

}


/* =========================================================
   REALTIME
========================================================= */

function subscribeToConversation(conversationId){

    removeRealtimeSubscription();


    realtimeChannel =
        supabaseClient
            .channel(
                "havkar-chat-" +
                conversationId +
                "-" +
                Date.now()
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages",
                    filter:
                        "conversation_id=eq." +
                        conversationId
                },
                async function(payload){

                    const message =
                        payload.new;


                    if(
                        !message ||
                        String(message.conversation_id) !==
                        String(conversationId)
                    ){

                        return;

                    }


                    /*
                       appendMessage() checks the
                       permanent data-message-id.
                       Therefore our own message will
                       not be duplicated.
                    */

                    appendMessage(
                        message,
                        true
                    );


                    if(
                        message.sender_id !==
                        currentUser.id
                    ){

                        await markMessagesRead(
                            conversationId
                        );

                    }

                }
            )
            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"messages",
                    filter:
                        "conversation_id=eq." +
                        conversationId
                },
                function(payload){

                    updateRenderedMessage(
                        payload.new
                    );

                }
            )
            .subscribe(
                function(status){

                    console.log(
                        "Chat realtime:",
                        status
                    );

                }
            );

}


/* =========================================================
   REMOVE REALTIME
========================================================= */

function removeRealtimeSubscription(){

    if(!realtimeChannel){
        return;
    }


    supabaseClient.removeChannel(
        realtimeChannel
    );


    realtimeChannel = null;

}


/* =========================================================
   UPDATE RENDERED MESSAGE
========================================================= */

function updateRenderedMessage(message){

    if(
        !message ||
        !message.id ||
        !currentConversationId ||
        String(message.conversation_id) !==
        String(currentConversationId)
    ){

        return;

    }


    const messageElement =
        document.querySelector(
            '[data-message-id="' +
            cssEscape(String(message.id)) +
            '"]'
        );


    if(!messageElement){
        return;
    }


    const checks =
        messageElement.querySelector(
            ".message-checks"
        );


    if(
        checks &&
        message.sender_id ===
        currentUser.id
    ){

        checks.textContent =
            message.is_read
                ? "✓✓"
                : "✓";

        checks.classList.toggle(
            "read",
            !!message.is_read
        );

        checks.title =
            message.is_read
                ? "Read"
                : "Sent";

    }

}


/* =========================================================
   CSS ESCAPE
========================================================= */

function cssEscape(value){

    if(
        window.CSS &&
        typeof window.CSS.escape ===
        "function"
    ){

        return window.CSS.escape(
            String(value)
        );

    }


    return String(value)
        .replace(
            /["\\]/g,
            "\\$&"
        );

}


/* =========================================================
   CLOSE CHAT
========================================================= */

function closeChat(){

    removeRealtimeSubscription();


    currentConversation =
        null;

    currentConversationId =
        null;


    document.getElementById("chatScreen")
        .style.display = "none";


    document.getElementById("messageList")
        .style.display = "block";


    history.replaceState(
        {},
        "",
        "chat.html"
    );


    loadConversations();

}


/* =========================================================
   CHAT INFO
========================================================= */

function showChatInfo(){

    if(!currentConversation){

        return;

    }


    const ad =
        currentConversation.ad;


    if(ad){

        showToast(
            "Listing: " + ad.title
        );

    }else{

        showToast(
            "HAVKAR conversation"
        );

    }

}


/* =========================================================
   SEARCH
========================================================= */

function searchMessages(value){

    searchTerm =
        value.trim().toLowerCase();

    renderConversationList();

}


/* =========================================================
   ENTER TO SEND
========================================================= */

function handleEnter(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   SCROLL
========================================================= */

function scrollMessagesToBottom(){

    const box =
        document.getElementById("chatMessages");

    if(!box){
        return;
    }


    requestAnimationFrame(function(){

        box.scrollTop =
            box.scrollHeight;

    });

}


/* =========================================================
   TIME
========================================================= */

function formatTime(value){

    if(!value){
        return "";
    }


    const date =
        new Date(value);


    if(Number.isNaN(date.getTime())){
        return "";
    }


    const now =
        new Date();


    const diff =
        now.getTime() -
        date.getTime();


    const minutes =
        Math.floor(
            diff / 60000
        );


    if(minutes < 1){
        return "Now";
    }


    if(minutes < 60){
        return minutes + "m";
    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24){
        return hours + "h";
    }


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 7){
        return days + "d";
    }


    return date.toLocaleDateString(
        undefined,
        {
            day:"numeric",
            month:"short"
        }
    );

}


function formatMessageTime(value){

    if(!value){
        return "";
    }


    const date =
        new Date(value);


    if(Number.isNaN(date.getTime())){
        return "";
    }


    return date.toLocaleTimeString(
        undefined,
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            const menu =
                document.getElementById(
                    "headerMenu"
                );

            if(menu){

                menu.classList.remove(
                    "show"
                );

            }

        }

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(
            event === "SIGNED_OUT"
        ){

            currentUser = null;

            removeRealtimeSubscription();

            window.location.href =
                "login.html";

        }

    }
);


/* =========================================================
   PAGE START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        currentUser =
            await loadCurrentUser();


        if(!currentUser){

            window.location.href =
                "login.html";

            return;

        }


        await loadConversations();


        await openConversationFromUrl();

    }
);
