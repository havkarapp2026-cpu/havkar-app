<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://gispovnciifgikvgpzck.supabase.co",
  "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq"
);

window.signup = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please enter your email and password.");
    return;
  }

  try {
    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      alert(error.message);
      return;
    }

    if (data.user) {
      alert("Account created successfully.");
    }
  } catch (error) {
    alert("Connection error: " + error.message);
  }
};

window.login = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please enter your email and password.");
    return;
  }

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      alert(error.message);
      return;
    }

    if (data.user) {
      window.location.href = "index.html";
    }
  } catch (error) {
    alert("Connection error: " + error.message);
  }
};
</script>

<style>
body {
  margin: 0;
  background: #1fa64b;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  background: white;
  padding: 40px;
  border-radius: 20px;
  width: 95%;
  max-width: 420px;
  text-align: center;
  box-sizing: border-box;
}

h1 {
  color: #1fa64b;
  font-size: 42px;
}

input {
  width: 100%;
  padding: 18px;
  margin: 12px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 18px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 18px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  background: #1fa64b;
  color: white;
}
</style>
</head>

<body>

<div class="box">
  <h1>HAVKAR</h1>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Login</button>
</div>

</body>
</html>
