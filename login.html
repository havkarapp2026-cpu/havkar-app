<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  background: #16a34a;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  background: #f3f4f6;
  padding: 40px;
  border-radius: 25px;
  width: 90%;
  max-width: 420px;
  text-align: center;
}

h1 {
  color: #16a34a;
  font-size: 32px;
}

input {
  width: 100%;
  padding: 16px;
  margin: 12px 0;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border-radius: 12px;
  border: none;
  font-size: 18px;
}

.login {
  background: #15803d;
  color: white;
}

.signup {
  background: #16a34a;
  color: white;
}
</style>
</head>

<body>

<div class="box">
  <h1>HAVKAR</h1>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="login" onclick="login()">Login</button>
  <button class="signup" onclick="signup()">Create Account</button>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://gispovncijfgikvgpzck.supabase.co",
  "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq"
);

async function signup() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    alert(error.message);
  } else {
    alert("Account created");
  }
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert(error.message);
  } else {
    alert("Login success");
  }
}
</script>

</body>
</html>
