<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body {
  background: #16a34a;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 250px;
  text-align: center;
}
input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}
button {
  width: 100%;
  padding: 10px;
  background: green;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div class="box">
<h2>HAVKAR</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://iompzwaxuirvatiibrtb.supabase.co",
  "sb_publishable_oEKE1vl6EkWXdETgy9MjHw_DUTJLN40"
);

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert(error.message);
  } else {
    alert("Logged in successfully");
  }
}
</script>

</body>
</html>
