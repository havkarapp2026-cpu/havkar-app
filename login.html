<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HAVKAR - Login</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #b8e6bd, #37b85d);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.97);
    border-radius: 30px;
    padding: 45px 40px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.18);
}

.logo-container {
    width: 110px;
    height: 110px;
    margin: 0 auto 20px;
    border-radius: 25px;
    background: #e8f5e9;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
}

h1 {
    color: #187a35;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    font-size: 18px;
    margin-bottom: 35px;
}

.input-group {
    margin-bottom: 18px;
    text-align: left;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    color: #444;
    font-size: 15px;
    font-weight: 600;
}

.input {
    width: 100%;
    padding: 17px;
    border: 2px solid #ddd;
    border-radius: 13px;
    font-size: 17px;
    outline: none;
}

.input:focus {
    border-color: #35aa55;
}

button {
    width: 100%;
    padding: 17px;
    border-radius: 13px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn {
    margin-top: 8px;
    border: none;
    background: linear-gradient(135deg, #22a447, #35b858);
    color: white;
}

.signup-btn {
    margin-top: 14px;
    border: 2px solid #2e7d32;
    background: white;
    color: #2e7d32;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    min-height: 24px;
    margin-top: 18px;
    font-size: 14px;
    font-weight: 600;
}

.message.error {
    color: #c62828;
}

.message.success {
    color: #2e7d32;
}

.footer {
    margin-top: 30px;
    color: #999;
    font-size: 14px;
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .login-box {
        padding: 35px 22px;
        border-radius: 25px;
    }

    h1 {
        font-size: 40px;
    }

    .subtitle {
        font-size: 16px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo-container">

        <img
            src="icon.png"
            alt="HAVKAR"
            class="logo"
        >

    </div>

    <h1>HAVKAR</h1>

    <div class="subtitle">
        Connect • Trade • Work • Help
    </div>

    <div class="input-group">

        <label for="email">
            Email
        </label>

        <input
            id="email"
            class="input"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            inputmode="email"
        >

    </div>

    <div class="input-group">

        <label for="password">
            Password
        </label>

        <input
            id="password"
            class="input"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

    </div>

    <button
        id="loginBtn"
        class="login-btn"
        type="button">
        Login
    </button>

    <button
        id="signupBtn"
        class="signup-btn"
        type="button">
        Create New Account
    </button>

    <div
        id="message"
        class="message"
        aria-live="polite">
    </div>

    <div class="footer">
        HAVKAR • Safe • Secure 🔒
    </div>

</div>


<script type="module">

import {
    createClient
} from "https://esm.sh/@supabase/supabase-js@2";


/* =========================================================
   HAVKAR SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://iompzwaxuirvatiibrtb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_oEKE1vl6EkWXdETgy9MjHw_DUTJLN4O";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: false
            }
        }
    );


/* =========================================================
   ELEMENTS
========================================================= */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const signupBtn =
    document.getElementById("signupBtn");

const message =
    document.getElementById("message");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        type
            ? `message ${type}`
            : "message";
}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    loginBtn.disabled = true;

    signupBtn.disabled = true;

    loginBtn.textContent =
        "Logging in...";

    showMessage("");


    try {

        const {
            data,
            error
        } =
        await supabase.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            console.error(
                "HAVKAR Login Error:",
                error
            );

            showMessage(
                error.message,
                "error"
            );

            loginBtn.disabled = false;

            signupBtn.disabled = false;

            loginBtn.textContent =
                "Login";

            return;
        }


        if (
            !data ||
            !data.user ||
            !data.session
        ) {

            showMessage(
                "Login failed. No active session was created.",
                "error"
            );

            loginBtn.disabled = false;

            signupBtn.disabled = false;

            loginBtn.textContent =
                "Login";

            return;
        }


        /* Verify session */

        const {
            data: sessionData,
            error: sessionError
        } =
        await supabase.auth.getSession();


        if (
            sessionError ||
            !sessionData ||
            !sessionData.session ||
            !sessionData.session.user
        ) {

            console.error(
                "HAVKAR Session Error:",
                sessionError
            );

            showMessage(
                "Login succeeded, but the session could not be saved.",
                "error"
            );

            loginBtn.disabled = false;

            signupBtn.disabled = false;

            loginBtn.textContent =
                "Login";

            return;
        }


        showMessage(
            "Login successful!",
            "success"
        );


        /*
         * Allow Supabase to persist the session
         * before navigating to the application.
         */

        setTimeout(
            function() {

                window.location.replace(
                    "index.html"
                );

            },
            700
        );


    } catch (error) {

        console.error(
            "HAVKAR Login Exception:",
            error
        );

        showMessage(
            "Connection error: " +
            (
                error?.message ||
                "Please try again."
            ),
            "error"
        );

        loginBtn.disabled = false;

        signupBtn.disabled = false;

        loginBtn.textContent =
            "Login";
    }
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

loginBtn.addEventListener(
    "click",
    login
);


/* =========================================================
   ENTER KEY
========================================================= */

emailInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            login();

        }

    }
);


/* =========================================================
   CREATE ACCOUNT
========================================================= */

signupBtn.addEventListener(
    "click",
    function() {

        window.location.href =
            "signup.html";

    }
);

</script>

</body>
</html>
