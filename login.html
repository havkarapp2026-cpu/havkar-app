<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HAVKAR Login</title>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      background: #16a34a;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #f3f4f6;
      padding: 30px;
      border-radius: 20px;
      width: 300px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
      color: #16a34a;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }

    .login {
      background: #15803d;
      color: white;
    }

    .signup {
      background: #16a34a;
      color: white;
    }

    .forgot {
      margin-top: 10px;
      color: #15803d;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>HAVKAR</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="login" onclick="login()">Login</button>
  <button class="signup" onclick="signup()">Create Account</button>

  <div class="forgot">Forgot password?</div>
</div>

<script>
  const supabase = window.supabase.createClient(
    "https://gispovncijfgikvgpzck.supabase.co",
    "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq"
  );

  async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      alert(error.message);
    } else {
      alert("success");
      window.location.href = "index.html";
    }
  }

  async function signup() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signUp({
      email,
      password
    });

    if (error) {
      alert(error.message);
    } else {
      alert("Account created");
    }
  }
</script>

</body>
  </html>
