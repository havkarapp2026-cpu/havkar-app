<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  background: #1fa64b;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  background: white;
  padding: 40px;
  border-radius: 20px;
  width: 90%;
  max-width: 400px;
  text-align: center;
}

h1 {
  color: #1fa64b;
  font-size: 40px;
}

input {
  width: 100%;
  padding: 18px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 18px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  background: #1fa64b;
  color: white;
}

</style>
</head>

<body>

<div class="box">
  <h1>HAVKAR</h1>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="signup()">Create Account</button>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://gispovncijfgiikvgpzck.supabase.co",
  "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq"
);

async function signup() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    alert(error.message);
  } else {
    alert("Account created");
  }
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert(error.message);
  } else {
    alert("Login success");
  }
}
</script>

</body>
</html>
