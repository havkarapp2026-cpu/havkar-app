<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#2e7d32">

<title>HAVKAR - Login</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #b8e6bd, #37b85d);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.97);
    border-radius: 30px;
    padding: 45px 40px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.18);
}

.logo-container {
    width: 110px;
    height: 110px;
    margin: 0 auto 20px;
    border-radius: 25px;
    background: #e8f5e9;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
}

h1 {
    color: #187a35;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    font-size: 18px;
    margin-bottom: 35px;
}

.input-group {
    margin-bottom: 18px;
    text-align: left;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    color: #444;
    font-size: 15px;
    font-weight: 600;
}

.input {
    width: 100%;
    padding: 17px;
    border: 2px solid #ddd;
    border-radius: 13px;
    font-size: 17px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input:focus {
    border-color: #35aa55;
    box-shadow: 0 0 0 3px rgba(53,170,85,0.10);
}

.login-btn,
.reset-btn {
    width: 100%;
    padding: 17px;
    border-radius: 13px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
}

.login-btn {
    margin-top: 8px;
    border: none;
    background: linear-gradient(135deg, #22a447, #35b858);
    color: white;
}

.reset-btn {
    margin-top: 8px;
    border: none;
    background: linear-gradient(135deg, #22a447, #35b858);
    color: white;
}

.signup-btn {
    width: 100%;
    margin-top: 14px;
    padding: 17px;
    border: 2px solid #2e7d32;
    border-radius: 13px;
    background: white;
    color: #2e7d32;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
}

.forgot-btn {
    display: inline-block;
    margin-top: 16px;
    border: none;
    background: transparent;
    color: #2e7d32;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
}

.forgot-btn:hover {
    text-decoration: underline;
}

.back-login-btn {
    display: inline-block;
    margin-top: 16px;
    border: none;
    background: transparent;
    color: #2e7d32;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
}

button:active {
    transform: scale(0.99);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    min-height: 24px;
    margin-top: 18px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
}

.message.error {
    color: #c62828;
}

.message.success {
    color: #2e7d32;
}

.help-text {
    margin-top: 12px;
    color: #777;
    font-size: 13px;
    line-height: 1.5;
}

.footer {
    margin-top: 30px;
    color: #999;
    font-size: 14px;
}

.hidden {
    display: none !important;
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .login-box {
        padding: 35px 22px;
        border-radius: 25px;
    }

    h1 {
        font-size: 40px;
    }

    .subtitle {
        font-size: 16px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo-container">

        <img
            src="icon.png"
            alt="HAVKAR"
            class="logo"
        >

    </div>

    <h1>HAVKAR</h1>

    <div class="subtitle">
        Connect • Trade • Work • Help
    </div>


    <!-- =====================================================
         LOGIN MODE
    ====================================================== -->

    <div id="loginMode">

        <div class="input-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                class="input"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
                inputmode="email"
            >

        </div>


        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                class="input"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

        </div>


        <button
            id="loginBtn"
            class="login-btn"
            type="button">
            Login
        </button>


        <button
            id="forgotBtn"
            class="forgot-btn"
            type="button">
            Forgot password?
        </button>


        <button
            id="signupBtn"
            class="signup-btn"
            type="button">
            Create New Account
        </button>

    </div>


    <!-- =====================================================
         FORGOT PASSWORD MODE
    ====================================================== -->

    <div id="forgotMode" class="hidden">

        <div class="input-group">

            <label for="forgotEmail">
                Email
            </label>

            <input
                id="forgotEmail"
                class="input"
                type="email"
                placeholder="Enter your HAVKAR email"
                autocomplete="email"
                inputmode="email"
            >

        </div>


        <button
            id="sendResetBtn"
            class="reset-btn"
            type="button">
            Send Reset Link
        </button>


        <button
            id="backLoginBtn"
            class="back-login-btn"
            type="button">
            Back to Login
        </button>


        <div class="help-text">
            We will send a secure password reset link to your email.
        </div>

    </div>


    <!-- =====================================================
         RESET PASSWORD MODE
    ====================================================== -->

    <div id="resetMode" class="hidden">

        <div class="input-group">

            <label for="newPassword">
                New Password
            </label>

            <input
                id="newPassword"
                class="input"
                type="password"
                placeholder="Enter your new password"
                autocomplete="new-password"
            >

        </div>


        <div class="input-group">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                id="confirmPassword"
                class="input"
                type="password"
                placeholder="Confirm your new password"
                autocomplete="new-password"
            >

        </div>


        <button
            id="updatePasswordBtn"
            class="reset-btn"
            type="button">
            Change Password
        </button>


        <div class="help-text">
            Choose a strong password that you do not use elsewhere.
        </div>

    </div>


    <div
        id="message"
        class="message"
        aria-live="polite">
    </div>


    <div class="footer">
        HAVKAR • Safe • Secure 🔒
    </div>

</div>


<script type="module">

import {
    createClient
} from "https://esm.sh/@supabase/supabase-js@2";


/* =========================================================
   HAVKAR SUPABASE CONFIGURATION
   CORRECT PROJECT
========================================================= */

const SUPABASE_URL =
    "https://gispovnciifgikvgpzck.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq";


/* =========================================================
   SUPABASE CLIENT
========================================================= */

const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,

                /*
                 * Must be TRUE for Supabase password
                 * recovery links to be processed correctly.
                 */
                detectSessionInUrl: true
            }
        }
    );


/* =========================================================
   ELEMENTS
========================================================= */

const loginMode =
    document.getElementById("loginMode");

const forgotMode =
    document.getElementById("forgotMode");

const resetMode =
    document.getElementById("resetMode");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const forgotBtn =
    document.getElementById("forgotBtn");

const signupBtn =
    document.getElementById("signupBtn");

const forgotEmail =
    document.getElementById("forgotEmail");

const sendResetBtn =
    document.getElementById("sendResetBtn");

const backLoginBtn =
    document.getElementById("backLoginBtn");

const newPassword =
    document.getElementById("newPassword");

const confirmPassword =
    document.getElementById("confirmPassword");

const updatePasswordBtn =
    document.getElementById("updatePasswordBtn");

const message =
    document.getElementById("message");


/* =========================================================
   MESSAGE HELPER
========================================================= */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        type
            ? `message ${type}`
            : "message";
}


/* =========================================================
   MODE CONTROL
========================================================= */

function showLoginMode() {

    loginMode.classList.remove(
        "hidden"
    );

    forgotMode.classList.add(
        "hidden"
    );

    resetMode.classList.add(
        "hidden"
    );

    showMessage("");

    emailInput.focus();
}


function showForgotMode() {

    loginMode.classList.add(
        "hidden"
    );

    forgotMode.classList.remove(
        "hidden"
    );

    resetMode.classList.add(
        "hidden"
    );

    showMessage("");

    const currentEmail =
        emailInput.value.trim();

    if(currentEmail){

        forgotEmail.value =
            currentEmail;
    }

    forgotEmail.focus();
}


function showResetMode() {

    loginMode.classList.add(
        "hidden"
    );

    forgotMode.classList.add(
        "hidden"
    );

    resetMode.classList.remove(
        "hidden"
    );

    showMessage(
        "Choose a new password.",
        "success"
    );

    newPassword.focus();
}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    loginBtn.disabled =
        true;

    loginBtn.textContent =
        "Logging in...";

    forgotBtn.disabled =
        true;

    signupBtn.disabled =
        true;

    showMessage("");


    try {

        const {
            data,
            error
        } =
        await supabase.auth.signInWithPassword({

            email:
                email,

            password:
                password

        });


        if(error){

            console.error(
                "HAVKAR Login Error:",
                error
            );

            showMessage(
                error.message,
                "error"
            );

            return;
        }


        if(
            !data ||
            !data.user ||
            !data.session
        ){

            showMessage(
                "Login failed. No active session was created.",
                "error"
            );

            return;
        }


        /*
         * Verify that Supabase actually saved
         * the authenticated session.
         */

        const {
            data: sessionData,
            error: sessionError
        } =
        await supabase.auth.getSession();


        if(
            sessionError ||
            !sessionData ||
            !sessionData.session ||
            !sessionData.session.user
        ){

            console.error(
                "HAVKAR Session Verification Error:",
                sessionError
            );

            showMessage(
                "Login succeeded, but the session could not be saved.",
                "error"
            );

            return;
        }


        showMessage(
            "Login successful!",
            "success"
        );


        setTimeout(
            function(){

                window.location.replace(
                    "index.html"
                );

            },
            700
        );


    } catch(error){

        console.error(
            "HAVKAR Login Exception:",
            error
        );

        showMessage(
            "Connection error: " +
            (
                error?.message ||
                "Please try again."
            ),
            "error"
        );

    } finally {

        loginBtn.disabled =
            false;

        loginBtn.textContent =
            "Login";

        forgotBtn.disabled =
            false;

        signupBtn.disabled =
            false;
    }
}


/* =========================================================
   SEND PASSWORD RESET EMAIL
========================================================= */

async function sendPasswordReset() {

    const email =
        forgotEmail.value.trim();


    if(!email){

        showMessage(
            "Please enter your email address.",
            "error"
        );

        forgotEmail.focus();

        return;
    }


    if(
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        )
    ){

        showMessage(
            "Please enter a valid email address.",
            "error"
        );

        forgotEmail.focus();

        return;
    }


    sendResetBtn.disabled =
        true;

    sendResetBtn.textContent =
        "Sending...";

    showMessage("");


    try {

        /*
         * The user will return to THIS SAME login.html
         * after clicking the secure Supabase email link.
         *
         * This avoids needing a second reset-password file.
         */

        const redirectTo =
            window.location.origin +
            window.location.pathname;


        const {
            error
        } =
        await supabase.auth.resetPasswordForEmail(
            email,
            {
                redirectTo:
                    redirectTo
            }
        );


        if(error){

            console.error(
                "HAVKAR Password Reset Error:",
                error
            );

            showMessage(
                error.message,
                "error"
            );

            return;
        }


        /*
         * We intentionally do not reveal whether
         * the email exists in HAVKAR.
         *
         * This is safer and prevents account
         * enumeration.
         */

        showMessage(
            "If this email belongs to a HAVKAR account, a password reset link has been sent. Please check your email.",
            "success"
        );


    } catch(error){

        console.error(
            "HAVKAR Password Reset Exception:",
            error
        );

        showMessage(
            "Connection error. Please try again.",
            "error"
        );

    } finally {

        sendResetBtn.disabled =
            false;

        sendResetBtn.textContent =
            "Send Reset Link";
    }
}


/* =========================================================
   UPDATE PASSWORD
========================================================= */

async function updatePassword() {

    const password =
        newPassword.value;

    const confirmation =
        confirmPassword.value;


    if(!password){

        showMessage(
            "Please enter your new password.",
            "error"
        );

        newPassword.focus();

        return;
    }


    /*
     * Minimum length.
     */

    if(password.length < 8){

        showMessage(
            "Your new password must be at least 8 characters.",
            "error"
        );

        newPassword.focus();

        return;
    }


    if(!confirmation){

        showMessage(
            "Please confirm your new password.",
            "error"
        );

        confirmPassword.focus();

        return;
    }


    if(password !== confirmation){

        showMessage(
            "The passwords do not match.",
            "error"
        );

        confirmPassword.focus();

        return;
    }


    updatePasswordBtn.disabled =
        true;

    updatePasswordBtn.textContent =
        "Changing Password...";

    showMessage("");


    try {

        const {
            data,
            error
        } =
        await supabase.auth.updateUser({

            password:
                password

        });


        if(error){

            console.error(
                "HAVKAR Update Password Error:",
                error
            );

            showMessage(
                error.message,
                "error"
            );

            return;
        }


        if(
            !data ||
            !data.user
        ){

            showMessage(
                "Password could not be changed. Please request a new reset link.",
                "error"
            );

            return;
        }


        showMessage(
            "Password changed successfully. You can now log in with your new password.",
            "success"
        );


        newPassword.value =
            "";

        confirmPassword.value =
            "";


        /*
         * Give the user time to see the success
         * message, then return to normal login.
         */

        setTimeout(
            async function(){

                try {

                    await supabase.auth.signOut();

                } catch(error) {

                    console.warn(
                        "HAVKAR Sign Out After Password Reset:",
                        error
                    );

                }

                showLoginMode();

                showMessage(
                    "Your password has been changed. Please log in.",
                    "success"
                );

            },
            1500
        );


    } catch(error){

        console.error(
            "HAVKAR Update Password Exception:",
            error
        );

        showMessage(
            "Connection error. Please try again.",
            "error"
        );

    } finally {

        updatePasswordBtn.disabled =
            false;

        updatePasswordBtn.textContent =
            "Change Password";
    }
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

loginBtn.addEventListener(
    "click",
    login
);


/* =========================================================
   FORGOT PASSWORD BUTTON
========================================================= */

forgotBtn.addEventListener(
    "click",
    showForgotMode
);


/* =========================================================
   BACK TO LOGIN
========================================================= */

backLoginBtn.addEventListener(
    "click",
    showLoginMode
);


/* =========================================================
   SEND RESET LINK
========================================================= */

sendResetBtn.addEventListener(
    "click",
    sendPasswordReset
);


/* =========================================================
   CHANGE PASSWORD
========================================================= */

updatePasswordBtn.addEventListener(
    "click",
    updatePassword
);


/* =========================================================
   ENTER KEY SUPPORT — LOGIN
========================================================= */

emailInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


/* =========================================================
   ENTER KEY SUPPORT — FORGOT PASSWORD
========================================================= */

forgotEmail.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            sendPasswordReset();

        }

    }
);


/* =========================================================
   ENTER KEY SUPPORT — NEW PASSWORD
========================================================= */

newPassword.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            confirmPassword.focus();

        }

    }
);


confirmPassword.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            updatePassword();

        }

    }
);


/* =========================================================
   CREATE ACCOUNT
========================================================= */

signupBtn.addEventListener(
    "click",
    function(){

        window.location.href =
            "signup.html";

    }
);


/* =========================================================
   AUTH STATE — PASSWORD RECOVERY
========================================================= */

supabase.auth.onAuthStateChange(
    function(event){

        console.log(
            "HAVKAR Auth Event:",
            event
        );


        if(
            event === "PASSWORD_RECOVERY"
        ){

            showResetMode();

        }

    }
);


/* =========================================================
   INITIAL SESSION / RECOVERY CHECK
========================================================= */

(async function initializePage(){

    try {

        /*
         * Check the current URL and session.
         * Supabase may establish the recovery session
         * from the email link.
         */

        const {
            data,
            error
        } =
        await supabase.auth.getSession();


        if(error){

            console.warn(
                "HAVKAR Initial Session Check:",
                error
            );

            return;
        }


        /*
         * Detect Supabase recovery parameters.
         * This is an additional safety check alongside
         * PASSWORD_RECOVERY.
         */

        const hash =
            window.location.hash || "";

        const search =
            window.location.search || "";


        const isRecoveryUrl =
            hash.includes(
                "type=recovery"
            ) ||
            search.includes(
                "type=recovery"
            );


        if(isRecoveryUrl){

            showResetMode();

            return;
        }


        /*
         * If there is already a normal authenticated
         * session, return the user to HAVKAR.
         */

        if(
            data &&
            data.session &&
            data.session.user
        ){

            /*
             * Do not immediately redirect if this is
             * a password-recovery session.
             */

            if(!isRecoveryUrl){

                showMessage(
                    "You are already logged in.",
                    "success"
                );

                setTimeout(
                    function(){

                        window.location.replace(
                            "index.html"
                        );

                    },
                    500
                );

            }

        }

    } catch(error){

        console.warn(
            "HAVKAR Initial Session Exception:",
            error
        );

    }

})();

</script>

</body>
</html>
