<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAVKAR - Post New Ad</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, #2e7d32, #43a047);
  color: white;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.back-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  font-size: 22px;
  cursor: pointer;
}

.header h1 {
  font-size: 1.3rem;
}

.container {
  max-width: 650px;
  margin: 25px auto;
  padding: 0 18px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.card h2 {
  color: #2e7d32;
  margin-bottom: 20px;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: 600;
  color: #333;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
  background: white;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #43a047;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

.category-help {
  margin-top: 7px;
  font-size: 13px;
  color: #777;
}

.custom-category {
  display: none;
  margin-top: 10px;
}

.custom-category.show {
  display: block;
}

.photo-info {
  font-size: 13px;
  color: #777;
  margin-top: 7px;
}

.photo-preview {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.photo-box {
  position: relative;
}

.photo-preview img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 10px;
  border: 2px solid #e0e0e0;
}

.remove-photo {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 25px;
  height: 25px;
  border: none;
  border-radius: 50%;
  background: rgba(220,0,0,0.85);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.publish-btn {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #2e7d32, #43a047);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.publish-btn:active {
  transform: scale(0.98);
}

.publish-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  display: none;
  text-align: center;
  font-size: 14px;
}

.status.success {
  display: block;
  background: #e8f5e9;
  color: #2e7d32;
}

.status.error {
  display: block;
  background: #ffebee;
  color: #c62828;
}

@media (max-width: 500px) {
  .photo-preview {
    grid-template-columns: repeat(3, 1fr);
  }

  .card {
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="header">

  <button
    class="back-btn"
    type="button"
    onclick="window.location.href='buy-sell.html'">
    ←
  </button>

  <h1>Post New Ad</h1>

</div>


<div class="container">

  <div class="card">

    <h2>Create Your Ad</h2>

    <form id="adForm">

      <!-- TITLE -->

      <label for="title">Title</label>

      <input
        type="text"
        id="title"
        placeholder="What are you selling?"
        required
      >


      <!-- CATEGORY -->

      <label for="category">Category</label>

      <select id="category" required>

        <option value="">Select category</option>

        <option value="Electronics">Electronics</option>

        <option value="Furniture">Furniture</option>

        <option value="Vehicles">Vehicles</option>

        <option value="Real Estate">Real Estate</option>

        <option value="Clothing">Clothing</option>

        <option value="Books">Books</option>

        <option value="Services">Services</option>

        <option value="Jobs">Jobs</option>

        <option value="Housing">Housing</option>

        <option value="Food">Food</option>

        <option value="Restaurant Equipment">
          Restaurant Equipment
        </option>

        <option value="Used Items">
          Used Items
        </option>

        <option value="Home Appliances">
          Home Appliances
        </option>

        <option value="Tools & Machinery">
          Tools & Machinery
        </option>

        <option value="Computers">
          Computers
        </option>

        <option value="Mobile Phones">
          Mobile Phones
        </option>

        <option value="Motorcycles">
          Motorcycles
        </option>

        <option value="Cars">
          Cars
        </option>

        <option value="Trucks">
          Trucks
        </option>

        <option value="Baby & Kids">
          Baby & Kids
        </option>

        <option value="Sports">
          Sports
        </option>

        <option value="Beauty & Personal Care">
          Beauty & Personal Care
        </option>

        <option value="Construction & Industrial">
          Construction & Industrial
        </option>

        <option value="Agricultural Equipment">
          Agricultural Equipment
        </option>

        <option value="Other">
          Other / Custom
        </option>

      </select>


      <div class="category-help">
        Choose a category or enter your own category.
      </div>


      <!-- CUSTOM CATEGORY -->

      <div
        id="customCategoryBox"
        class="custom-category">

        <label for="customCategory">
          Your Category
        </label>

        <input
          type="text"
          id="customCategory"
          placeholder="Enter your own category"
        >

      </div>


      <!-- PRICE -->

      <label for="price">Price</label>

      <input
        type="number"
        id="price"
        placeholder="Enter price"
        min="0"
        step="0.01"
        required
      >


      <!-- LOCATION -->

      <label for="location">Location</label>

      <input
        type="text"
        id="location"
        placeholder="City, Country"
        required
      >


      <!-- DESCRIPTION -->

      <label for="description">Description</label>

      <textarea
        id="description"
        placeholder="Describe your item or service..."
        required
      ></textarea>


      <!-- PHOTOS -->

      <label for="photos">
        Photos (up to 20)
      </label>

      <input
        type="file"
        id="photos"
        accept="image/*"
        multiple
      >

      <div class="photo-info">
        You can select up to 20 photos.
      </div>


      <div
        id="photoPreview"
        class="photo-preview">
      </div>


      <!-- PUBLISH -->

      <button
        class="publish-btn"
        id="publishBtn"
        type="submit">

        Publish Ad

      </button>


      <div
        id="status"
        class="status">
      </div>

    </form>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "https://gispovnciifgikvgpzck.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_h6RUZrukEovZn_N3XLDukw_Ui67UsWG";


/* =========================================================
   SUPABASE CLIENT
   ========================================================= */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   ELEMENTS
   ========================================================= */

const adForm =
  document.getElementById("adForm");

const categoryInput =
  document.getElementById("category");

const customCategoryBox =
  document.getElementById("customCategoryBox");

const customCategoryInput =
  document.getElementById("customCategory");

const photoInput =
  document.getElementById("photos");

const photoPreview =
  document.getElementById("photoPreview");

const publishBtn =
  document.getElementById("publishBtn");

const statusBox =
  document.getElementById("status");


/* =========================================================
   SELECTED PHOTOS
   ========================================================= */

let selectedFiles = [];


/* =========================================================
   CATEGORY
   ========================================================= */

categoryInput.addEventListener(
  "change",
  function () {

    if (this.value === "Other") {

      customCategoryBox.classList.add("show");

      customCategoryInput.required = true;

    } else {

      customCategoryBox.classList.remove("show");

      customCategoryInput.required = false;

      customCategoryInput.value = "";

    }

  }
);


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(message, type) {

  statusBox.textContent = message;

  statusBox.className =
    "status " + type;

}


/* =========================================================
   PHOTO INPUT
   ========================================================= */

photoInput.addEventListener(
  "change",
  function () {

    const newFiles =
      Array.from(this.files);

    if (
      selectedFiles.length +
      newFiles.length > 20
    ) {

      showStatus(
        "You can upload a maximum of 20 photos.",
        "error"
      );

      this.value = "";

      return;
    }


    for (const file of newFiles) {

      if (
        file.type &&
        file.type.startsWith("image/")
      ) {

        selectedFiles.push(file);

      }

    }


    renderPhotos();

    this.value = "";

  }
);


/* =========================================================
   RENDER PHOTOS
   ========================================================= */

function renderPhotos() {

  photoPreview.innerHTML = "";


  selectedFiles.forEach(
    function (file, index) {

      const box =
        document.createElement("div");

      box.className =
        "photo-box";


      const img =
        document.createElement("img");


      const removeBtn =
        document.createElement("button");


      removeBtn.type =
        "button";


      removeBtn.className =
        "remove-photo";


      removeBtn.textContent =
        "×";


      removeBtn.onclick =
        function () {

          selectedFiles.splice(
            index,
            1
          );

          renderPhotos();

        };


      const reader =
        new FileReader();


      reader.onload =
        function (event) {

          img.src =
            event.target.result;

        };


      reader.readAsDataURL(file);


      box.appendChild(img);

      box.appendChild(removeBtn);

      photoPreview.appendChild(box);

    }
  );

}


/* =========================================================
   READ FILE
   ========================================================= */

function readFile(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        function() {

          reject(
            reader.error
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   PUBLISH AD
   ========================================================= */

adForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    publishBtn.disabled = true;


    showStatus(
      "Publishing your ad...",
      "success"
    );


    try {

      /* ---------------------------------------------
         CHECK KEY
         --------------------------------------------- */

      if (
        !SUPABASE_PUBLISHABLE_KEY ||
        SUPABASE_PUBLISHABLE_KEY ===
        "YOUR_PUBLISHABLE_KEY"
      ) {

        throw new Error(
          "Supabase Publishable Key has not been added."
        );

      }


      /* ---------------------------------------------
         GET CATEGORY
         --------------------------------------------- */

      let category =
        categoryInput.value;


      if (category === "Other") {

        category =
          customCategoryInput.value.trim();

        if (!category) {

          throw new Error(
            "Please enter your category."
          );

        }

      }


      /* ---------------------------------------------
         READ PHOTOS
         --------------------------------------------- */

      const photos = [];


      for (
        const file of selectedFiles
      ) {

        const photoData =
          await readFile(file);

        photos.push(photoData);

      }


      /* ---------------------------------------------
         CREATE AD
         --------------------------------------------- */

      const ad = {

        title:
          document
            .getElementById("title")
            .value
            .trim(),

        category:
          category,

        price:
          Number(
            document
              .getElementById("price")
              .value
          ),

        location:
          document
            .getElementById("location")
            .value
            .trim(),

        description:
          document
            .getElementById("description")
            .value
            .trim(),

        photos:
          photos

      };


      /* ---------------------------------------------
         SAVE TO SUPABASE
         --------------------------------------------- */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("ads")
          .insert([ad])
          .select();


      if (error) {

        console.error(error);

        throw new Error(
          error.message
        );

      }


      /* ---------------------------------------------
         SUCCESS
         --------------------------------------------- */

      showStatus(
        "Your ad has been published successfully!",
        "success"
      );


      adForm.reset();


      selectedFiles = [];


      renderPhotos();


      customCategoryBox
        .classList
        .remove("show");


      customCategoryInput.required =
        false;


      setTimeout(
        function() {

          window.location.href =
            "buy-sell.html";

        },
        1500
      );


    } catch (error) {

      console.error(
        "Publish error:",
        error
      );


      showStatus(
        "Could not publish the ad: " +
        error.message,
        "error"
      );


    } finally {

      publishBtn.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
