<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HAVKAR - Post New Ad</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    .header h1 {
      font-size: 1.3rem;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #2e7d32;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
      color: #333;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #43a047;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .photo-info {
      font-size: 13px;
      color: #777;
      margin-top: 7px;
    }

    .photo-preview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .photo-preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
    }

    .publish-btn {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .publish-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 500px) {
      .photo-preview {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <button
      class="back-btn"
      onclick="window.location.href='buy-sell.html'"
    >
      ←
    </button>

    <h1>Post New Ad</h1>
  </div>

  <div class="container">

    <div class="card">

      <h2>Create Your Ad</h2>

      <form onsubmit="publishAd(event)">

        <label>Title</label>

        <input
          type="text"
          id="title"
          placeholder="What are you selling?"
          required
        >

        <label>Category</label>

        <select id="category" required>
          <option value="">Select category</option>
          <option>Electronics</option>
          <option>Furniture</option>
          <option>Vehicles</option>
          <option>Real Estate</option>
          <option>Clothing</option>
          <option>Books</option>
          <option>Services</option>
          <option>Other</option>
        </select>

        <label>Price</label>

        <input
          type="number"
          id="price"
          placeholder="Enter price"
          min="0"
          step="0.01"
          required
        >

        <label>Location</label>

        <input
          type="text"
          id="location"
          placeholder="City, Country"
          required
        >

        <label>Description</label>

        <textarea
          id="description"
          placeholder="Describe your item or service..."
          required
        ></textarea>

        <label>Photos (up to 20)</label>

        <input
          type="file"
          id="photos"
          accept="image/*"
          multiple
        >

        <div class="photo-info">
          You can select up to 20 photos.
        </div>

        <div
          id="photoPreview"
          class="photo-preview"
        ></div>

        <button
          class="publish-btn"
          type="submit"
        >
          Publish Ad
        </button>

      </form>

    </div>

  </div>

  <script>

    const photoInput = document.getElementById("photos");
    const photoPreview = document.getElementById("photoPreview");

    photoInput.addEventListener("change", function () {

      photoPreview.innerHTML = "";

      const files = Array.from(this.files);

      if (files.length > 20) {
        alert("You can upload a maximum of 20 photos.");
        this.value = "";
        return;
      }

      files.forEach(function(file) {

        if (!file.type.startsWith("image/")) {
          return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {

          const img = document.createElement("img");

          img.src = e.target.result;

          photoPreview.appendChild(img);
        };

        reader.readAsDataURL(file);
      });

    });


    async function publishAd(event) {

      event.preventDefault();

      const files = Array.from(photoInput.files);

      if (files.length > 20) {
        alert("You can upload a maximum of 20 photos.");
        return;
      }

      const photos = [];

      for (const file of files) {

        const photoData = await readFile(file);

        photos.push(photoData);
      }

      const ad = {

        title: document.getElementById("title").value,

        category: document.getElementById("category").value,

        price: document.getElementById("price").value,

        location: document.getElementById("location").value,

        description: document.getElementById("description").value,

        photos: photos,

        createdAt: new Date().toISOString()

      };

      try {

        localStorage.setItem(
          "havkar_new_ad",
          JSON.stringify(ad)
        );

        alert("Your ad has been published successfully!");

        window.location.href = "buy-sell.html";

      } catch (error) {

        alert(
          "The photos are too large to save in the browser. Please choose smaller photos."
        );

      }

    }


    function readFile(file) {

      return new Promise(function(resolve, reject) {

        const reader = new FileReader();

        reader.onload = function() {
          resolve(reader.result);
        };

        reader.onerror = function() {
          reject(reader.error);
        };

        reader.readAsDataURL(file);

      });

    }

  </script>

</body>
</html>
