<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="HAVKAR Notifications - Real-time account notifications.">
<meta name="theme-color" content="#689f38">
<title>HAVKAR - Notifications</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #689f38;
    --primary-light: #7cb342;
    --primary-dark: #558b2f;
    --primary-soft: #e8f5e9;
    --background: #f5f5f5;
    --white: #ffffff;
    --text: #333333;
    --muted: #777777;
    --border: #eeeeee;
    --danger: #d32f2f;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
}

/* =========================
   HEADER
========================= */

.header {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    padding:
        calc(15px + env(safe-area-inset-top))
        20px
        15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.back-btn,
.header-icon {
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.back-btn {
    background: none;
    font-size: 24px;
    width: 38px;
    height: 38px;
}

.header h1 {
    font-size: 21px;
    font-weight: 700;
}

.header-icon {
    background: rgba(255,255,255,.2);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 18px;
}

.header-icon:active,
.back-btn:active {
    transform: scale(.94);
}

.header-icon:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* =========================
   PAGE
========================= */

.page {
    padding-bottom: 90px;
    min-height: calc(100vh - 70px);
}

/* =========================
   TOP ACTIONS
========================= */

.notification-actions {
    background: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
}

.notification-count {
    font-size: 14px;
    color: var(--muted);
}

.notification-count strong {
    color: var(--primary);
}

.mark-read-btn {
    border: none;
    background: var(--primary-soft);
    color: var(--primary-dark);
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}

.mark-read-btn:active {
    transform: scale(.96);
}

.mark-read-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* =========================
   NOTIFICATION LIST
========================= */

.notifications-list {
    background: white;
}

.notification {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 17px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    position: relative;
    transition: background .2s ease;
}

.notification:hover {
    background: #fafafa;
}

.notification.unread {
    background: #f8fbf6;
}

.notification.unread::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 22px;
    width: 7px;
    height: 7px;
    background: var(--primary-light);
    border-radius: 50%;
}

/* =========================
   ICON
========================= */

.notification-icon {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e8f5e9, #c5e1a5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    font-size: 21px;
    flex-shrink: 0;
}

.notification-icon.message {
    color: #43a047;
}

.notification-icon.job {
    color: #2e7d32;
}

.notification-icon.service {
    color: #689f38;
}

.notification-icon.delivery {
    color: #558b2f;
}

.notification-icon.event {
    color: #7cb342;
}

.notification-icon.payment {
    color: #2e7d32;
}

.notification-icon.account {
    color: #689f38;
}

.notification-icon.system {
    color: #7cb342;
}

/* =========================
   TEXT
========================= */

.notification-content {
    flex: 1;
    min-width: 0;
}

.notification-title {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin-bottom: 5px;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

.notification-text {
    font-size: 14px;
    color: #666;
    line-height: 1.45;
    overflow-wrap: anywhere;
}

.notification-time {
    font-size: 12px;
    color: #999;
    margin-top: 6px;
}

/* =========================
   LOADING
========================= */

.loading-state {
    display: none;
    background: white;
    padding: 70px 25px;
    text-align: center;
    color: #777;
}

.loading-state.show {
    display: block;
}

.loading-spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 16px;
    border: 3px solid #e7e7e7;
    border-top-color: var(--primary-light);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   EMPTY STATE
========================= */

.empty-state {
    display: none;
    background: white;
    padding: 80px 25px;
    text-align: center;
}

.empty-state.show {
    display: block;
}

.empty-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
}

.empty-state h2 {
    font-size: 19px;
    margin-bottom: 8px;
    color: #333;
}

.empty-state p {
    font-size: 14px;
    color: #888;
    line-height: 1.5;
}

/* =========================
   AUTH STATE
========================= */

.auth-state {
    display: none;
    background: white;
    padding: 80px 25px;
    text-align: center;
}

.auth-state.show {
    display: block;
}

.auth-state .empty-icon {
    background: #f3f3f3;
    color: #888;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 95px;
    transform: translateX(-50%) translateY(20px);
    background: #333;
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all .3s ease;
    z-index: 500;
    max-width: calc(100vw - 36px);
    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.toast.success {
    background: var(--primary-dark);
}

.toast.error {
    background: var(--danger);
}

/* =========================
   BOTTOM NAVIGATION
========================= */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    min-height: 75px;
    padding-bottom: env(safe-area-inset-bottom);
    background: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -2px 12px rgba(0,0,0,.10);
    z-index: 200;
}

.nav-item {
    flex: 1;
    min-height: 75px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color: #999;
    font-size: 12px;
    cursor: pointer;
    transition: color .2s ease;
    text-decoration: none;
}

.nav-item i {
    font-size: 21px;
}

.nav-item.active {
    color: var(--primary-light);
    font-weight: 600;
}

.nav-item:active {
    transform: scale(.96);
}

/* =========================
   RESPONSIVE
========================= */

@media (min-width: 700px) {

    body {
        background: #eeeeee;
    }

    .page {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        min-height: calc(100vh - 70px);
    }

    .header {
        max-width: 800px;
        margin: 0 auto;
    }

    .bottom-nav {
        max-width: 800px;
        margin: 0 auto;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: 100%;
    }
}

@media (max-width: 430px) {

    .notification-actions {
        padding-left: 16px;
        padding-right: 16px;
    }

    .notification {
        padding-left: 18px;
        padding-right: 16px;
    }

    .mark-read-btn {
        padding: 8px 11px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-left">

        <button
            class="back-btn"
            type="button"
            onclick="goHome()"
            aria-label="Back">
            <i class="fas fa-arrow-left"></i>
        </button>

        <h1>Notifications</h1>

    </div>

    <button
        id="headerMarkReadBtn"
        class="header-icon"
        type="button"
        onclick="markAllAsRead()"
        aria-label="Mark all as read">

        <i class="fas fa-check-double"></i>

    </button>

</header>


<!-- =========================
     PAGE
========================= -->

<main class="page">

    <div class="notification-actions">

        <div
            class="notification-count"
            id="notificationCountText">

            <strong id="unreadCount">0</strong>
            unread notifications

        </div>

        <button
            id="markReadBtn"
            class="mark-read-btn"
            type="button"
            onclick="markAllAsRead()">

            Mark all as read

        </button>

    </div>


    <!-- LOADING -->

    <section
        class="loading-state show"
        id="loadingState">

        <div class="loading-spinner"></div>

        <p>Loading notifications...</p>

    </section>


    <!-- REAL NOTIFICATIONS -->

    <section
        class="notifications-list"
        id="notificationsList"
        aria-live="polite">
    </section>


    <!-- EMPTY STATE -->

    <section
        class="empty-state"
        id="emptyState">

        <div class="empty-icon">

            <i class="far fa-bell-slash"></i>

        </div>

        <h2>No notifications</h2>

        <p>
            You're all caught up.<br>
            New HAVKAR notifications will appear here.
        </p>

    </section>


    <!-- AUTH STATE -->

    <section
        class="auth-state"
        id="authState">

        <div class="empty-icon">

            <i class="fas fa-user-lock"></i>

        </div>

        <h2>Sign in required</h2>

        <p>
            Sign in to your HAVKAR account to view your notifications.
        </p>

    </section>

</main>


<!-- =========================
     TOAST
========================= -->

<div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite">
</div>


<!-- =========================
     BOTTOM NAVIGATION
========================= -->

<nav class="bottom-nav">

    <a
        class="nav-item"
        href="index.html">

        <i class="fas fa-home"></i>

        <span>Home</span>

    </a>


    <a
        class="nav-item"
        href="chat.html">

        <i class="fas fa-comment"></i>

        <span>Messages</span>

    </a>


    <a
        class="nav-item active"
        href="notifications.html">

        <i class="fas fa-bell"></i>

        <span>Notifications</span>

    </a>


    <a
        class="nav-item"
        href="profile.html">

        <i class="fas fa-user"></i>

        <span>Profile</span>

    </a>

</nav>


<script>
"use strict";

/* =========================================================
   HAVKAR NOTIFICATIONS
   Production browser client
   Source of truth: public.notifications in Supabase
========================================================= */

const SUPABASE_URL =
    "https://gispovnciifgikvgpzck.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


/* =========================
   STATE
========================= */

const state = {
    user: null,
    notifications: [],
    channel: null,
    loading: true,
    markingAll: false
};


/* =========================
   DOM
========================= */

const elements = {
    list:
        document.getElementById(
            "notificationsList"
        ),

    empty:
        document.getElementById(
            "emptyState"
        ),

    auth:
        document.getElementById(
            "authState"
        ),

    loading:
        document.getElementById(
            "loadingState"
        ),

    unreadCount:
        document.getElementById(
            "unreadCount"
        ),

    countText:
        document.getElementById(
            "notificationCountText"
        ),

    markReadBtn:
        document.getElementById(
            "markReadBtn"
        ),

    headerMarkReadBtn:
        document.getElementById(
            "headerMarkReadBtn"
        ),

    toast:
        document.getElementById(
            "toast"
        )
};


/* =========================
   NAVIGATION
========================= */

function goHome() {
    window.location.href =
        "index.html";
}


/* =========================
   SECURITY / TEXT
========================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function safeActionUrl(value) {

    if (!value) {
        return "";
    }

    const raw =
        String(value).trim();

    if (!raw) {
        return "";
    }

    try {

        const url =
            new URL(
                raw,
                window.location.origin
            );

        if (
            url.origin !==
            window.location.origin
        ) {
            return "";
        }

        if (
            url.protocol !== "http:" &&
            url.protocol !== "https:"
        ) {
            return "";
        }

        return (
            url.pathname +
            url.search +
            url.hash
        );

    } catch (error) {

        return "";
    }
}


/* =========================
   NOTIFICATION TYPE UI
========================= */

function getTypeUI(type) {

    const map = {

        message: {
            className: "message",
            icon: "fa-comment"
        },

        job: {
            className: "job",
            icon: "fa-briefcase"
        },

        service: {
            className: "service",
            icon: "fa-tools"
        },

        delivery: {
            className: "delivery",
            icon: "fa-shipping-fast"
        },

        event: {
            className: "event",
            icon: "fa-calendar-check"
        },

        payment: {
            className: "payment",
            icon: "fa-credit-card"
        },

        account: {
            className: "account",
            icon: "fa-user-shield"
        },

        system: {
            className: "system",
            icon: "fa-shield-halved"
        }
    };

    return (
        map[type] ||
        map.system
    );
}


/* =========================
   TIME
========================= */

function formatNotificationTime(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    const now =
        new Date();

    const diffMs =
        Math.max(
            0,
            now.getTime() -
            date.getTime()
        );

    const minute =
        60 * 1000;

    const hour =
        60 * minute;

    const day =
        24 * hour;

    if (diffMs < minute) {
        return "Just now";
    }

    if (diffMs < hour) {

        const minutes =
            Math.floor(
                diffMs / minute
            );

        return (
            minutes +
            (minutes === 1
                ? " minute ago"
                : " minutes ago")
        );
    }

    if (diffMs < day) {

        const hours =
            Math.floor(
                diffMs / hour
            );

        return (
            hours +
            (hours === 1
                ? " hour ago"
                : " hours ago")
        );
    }

    if (diffMs < 2 * day) {
        return "Yesterday";
    }

    if (diffMs < 7 * day) {

        const days =
            Math.floor(
                diffMs / day
            );

        return (
            days +
            " days ago"
        );
    }

    return date.toLocaleDateString(
        undefined,
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );
}


/* =========================
   RENDER
========================= */

function renderNotifications() {

    elements.loading
        .classList.remove("show");

    elements.auth
        .classList.remove("show");

    if (!state.user) {

        elements.list.innerHTML =
            "";

        elements.empty
            .classList.remove("show");

        elements.auth
            .classList.add("show");

        updateUnreadCount();

        return;
    }

    if (
        !Array.isArray(
            state.notifications
        ) ||
        state.notifications.length === 0
    ) {

        elements.list.innerHTML =
            "";

        elements.empty
            .classList.add("show");

        updateUnreadCount();

        return;
    }

    elements.empty
        .classList.remove("show");

    elements.list.innerHTML =
        state.notifications
            .map(
                notification => {

                    const typeUI =
                        getTypeUI(
                            notification.type
                        );

                    const unreadClass =
                        notification.is_read
                            ? ""
                            : " unread";

                    const title =
                        escapeHtml(
                            notification.title
                        );

                    const message =
                        escapeHtml(
                            notification.message
                        );

                    const time =
                        escapeHtml(
                            formatNotificationTime(
                                notification.created_at
                            )
                        );

                    return `
                        <article
                            class="notification${unreadClass}"
                            data-id="${escapeHtml(notification.id)}"
                            role="button"
                            tabindex="0"
                            aria-label="${title}"
                            onclick="openNotificationById('${escapeHtml(notification.id)}')"
                            onkeydown="handleNotificationKey(event, '${escapeHtml(notification.id)}')"
                        >
                            <div class="notification-icon ${typeUI.className}">
                                <i class="fas ${typeUI.icon}"></i>
                            </div>

                            <div class="notification-content">

                                <div class="notification-title">
                                    ${title}
                                </div>

                                <div class="notification-text">
                                    ${message}
                                </div>

                                <div class="notification-time">
                                    ${time}
                                </div>

                            </div>
                        </article>
                    `;
                }
            )
            .join("");

    updateUnreadCount();
}


function updateUnreadCount() {

    const unread =
        state.notifications.filter(
            item =>
                item.is_read !== true
        ).length;

    elements.unreadCount.textContent =
        String(unread);

    elements.countText.innerHTML =
        `<strong>${unread}</strong> ` +
        (
            unread === 1
                ? "unread notification"
                : "unread notifications"
        );

    const disabled =
        !state.user ||
        unread === 0 ||
        state.markingAll;

    elements.markReadBtn.disabled =
        disabled;

    elements.headerMarkReadBtn.disabled =
        disabled;
}


/* =========================
   LOAD FROM SUPABASE
========================= */

async function loadNotifications(
    options = {}
) {

    const silent =
        options.silent === true;

    if (!state.user) {

        state.notifications =
            [];

        renderNotifications();

        return;
    }

    if (!silent) {

        state.loading =
            true;

        elements.loading
            .classList.add("show");

        elements.empty
            .classList.remove("show");

        elements.auth
            .classList.remove("show");
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("notifications")
            .select(
                "id,created_at,user_id,type,title,message,is_read,read_at,action_url,reference_id,metadata"
            )
            .eq(
                "user_id",
                state.user.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(100);

    state.loading =
        false;

    if (error) {

        console.error(
            "HAVKAR notifications load error:",
            error
        );

        elements.loading
            .classList.remove("show");

        if (!silent) {

            showToast(
                "Unable to load notifications.",
                "error"
            );
        }

        return;
    }

    state.notifications =
        Array.isArray(data)
            ? data
            : [];

    renderNotifications();
}


/* =========================
   OPEN / READ
========================= */

function handleNotificationKey(
    event,
    id
) {

    if (
        event.key === "Enter" ||
        event.key === " "
    ) {

        event.preventDefault();

        openNotificationById(id);
    }
}


async function openNotificationById(id) {

    const notification =
        state.notifications.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if (!notification) {
        return;
    }

    if (!notification.is_read) {

        const previousRead =
            notification.is_read;

        const previousReadAt =
            notification.read_at;

        notification.is_read =
            true;

        notification.read_at =
            new Date().toISOString();

        renderNotifications();

        const {
            error
        } =
            await supabaseClient
                .from("notifications")
                .update({
                    is_read: true,
                    read_at:
                        notification.read_at
                })
                .eq(
                    "id",
                    notification.id
                )
                .eq(
                    "user_id",
                    state.user.id
                );

        if (error) {

            console.error(
                "HAVKAR notification read error:",
                error
            );

            notification.is_read =
                previousRead;

            notification.read_at =
                previousReadAt;

            renderNotifications();

            showToast(
                "Unable to update notification.",
                "error"
            );

            return;
        }
    }

    const actionUrl =
        safeActionUrl(
            notification.action_url
        );

    if (actionUrl) {

        window.location.href =
            actionUrl;

        return;
    }
}


/* =========================
   MARK ALL AS READ
========================= */

async function markAllAsRead() {

    if (
        !state.user ||
        state.markingAll
    ) {
        return;
    }

    const unread =
        state.notifications.filter(
            item =>
                item.is_read !== true
        );

    if (!unread.length) {

        showToast(
            "All notifications are already read."
        );

        return;
    }

    state.markingAll =
        true;

    updateUnreadCount();

    const readAt =
        new Date().toISOString();

    const {
        error
    } =
        await supabaseClient
            .from("notifications")
            .update({
                is_read: true,
                read_at: readAt
            })
            .eq(
                "user_id",
                state.user.id
            )
            .eq(
                "is_read",
                false
            );

    state.markingAll =
        false;

    if (error) {

        console.error(
            "HAVKAR mark all read error:",
            error
        );

        updateUnreadCount();

        showToast(
            "Unable to mark notifications as read.",
            "error"
        );

        return;
    }

    state.notifications =
        state.notifications.map(
            item => ({
                ...item,
                is_read: true,
                read_at:
                    item.read_at ||
                    readAt
            })
        );

    renderNotifications();

    showToast(
        "All notifications marked as read.",
        "success"
    );
}


/* =========================
   REALTIME
========================= */

async function subscribeToNotifications() {

    if (state.channel) {

        try {

            await supabaseClient
                .removeChannel(
                    state.channel
                );

        } catch (error) {

            console.warn(
                "HAVKAR notification channel cleanup:",
                error
            );
        }

        state.channel =
            null;
    }

    if (!state.user) {
        return;
    }

    state.channel =
        supabaseClient
            .channel(
                "havkar-notifications-" +
                state.user.id
            )
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "notifications",
                    filter:
                        "user_id=eq." +
                        state.user.id
                },
                async () => {

                    await loadNotifications({
                        silent: true
                    });
                }
            )
            .subscribe(
                status => {

                    if (
                        status ===
                        "CHANNEL_ERROR"
                    ) {

                        console.warn(
                            "HAVKAR notifications realtime channel error"
                        );
                    }
                }
            );
}


/* =========================
   AUTH
========================= */

async function initializeAuth() {

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getUser();

    if (error) {

        console.warn(
            "HAVKAR notification auth:",
            error
        );
    }

    state.user =
        data?.user || null;

    await loadNotifications();

    await subscribeToNotifications();
}


supabaseClient
    .auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            const nextUser =
                session?.user ||
                null;

            const previousId =
                state.user?.id ||
                null;

            const nextId =
                nextUser?.id ||
                null;

            state.user =
                nextUser;

            if (
                previousId !== nextId
            ) {

                state.notifications =
                    [];

                await loadNotifications();

                await subscribeToNotifications();
            }
        }
    );


/* =========================
   TOAST
========================= */

let toastTimer =
    null;


function showToast(
    message,
    type = ""
) {

    clearTimeout(
        toastTimer
    );

    elements.toast.textContent =
        message;

    elements.toast.className =
        "toast show" +
        (
            type
                ? " " + type
                : ""
        );

    toastTimer =
        setTimeout(
            () => {

                elements.toast.className =
                    "toast";

            },
            2500
        );
}


/* =========================
   PAGE VISIBILITY
========================= */

document.addEventListener(
    "visibilitychange",
    async function() {

        if (
            document.visibilityState ===
            "visible" &&
            state.user
        ) {

            await loadNotifications({
                silent: true
            });
        }
    }
);


/* =========================
   INITIALIZATION
========================= */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        await initializeAuth();
    }
);


/* =========================
   CLEANUP
========================= */

window.addEventListener(
    "beforeunload",
    function() {

        if (state.channel) {

            supabaseClient
                .removeChannel(
                    state.channel
                );
        }
    }
);
</script>
