<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/havkar-icon-32-20261022-v3.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/havkar-icon-16-20261022-v3.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/havkar-icon-180-20261022-v3.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#689f38">
<title>HAVKAR | Administration</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7f2;color:#263238;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{background:linear-gradient(135deg,#689f38,#7cb342);color:#fff;padding:calc(16px + env(safe-area-inset-top, 0px)) 16px 16px}
main{padding:16px}
a{color:#2e7d32}
.card{background:#fff;border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.card p{margin:6px 0}
button{background:#689f38;color:#fff;border:0;border-radius:11px;padding:12px 16px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#fff;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -3px 14px rgba(0,0,0,.1)}
nav a{color:#607d8b;text-decoration:none;align-self:center;font-size:13px;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Administration</h1>
  <p>Server-side administrator role only. Commission rows stay uncollected.</p>
</header>
<main>
  <p id="message" role="status">Checking authorization...</p>
  <div id="businessReview"></div>
  <div id="adsModeration"></div>
  <div id="ledger"></div>
  <div id="privacyRequests"></div>
  <div id="availability"></div>
</main>
<nav>
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="accommodation.html">Accommodation</a>
</nav>
<script src="/havkar-supabase-config.js"></script>
<script src="/havkar-services.js"></script>
<script src="/havkar-business-verification.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const message = document.getElementById("message");
const config = window.HAVKAR_SUPABASE_CONFIG;

function money(cents) {
  return Number.isInteger(Number(cents)) ? (Number(cents) / 100).toFixed(2) : "";
}

function line(entry) {
  return [
    entry.currency || "",
    "customer " + money(entry.customer_charge_cents),
    "provider commission " + money(entry.commission_cents),
    "fee " + money(entry.processing_fee_cents),
    "tax " + money(entry.tax_cents),
    entry.settlement_channel || "",
    window.HAVKAR_SERVICES.liabilityText(entry.liability_state)
  ].filter(Boolean).join(" · ");
}

async function start() {
  if (!config || !window.supabase) {
    message.textContent = "Administration is not available.";
    return;
  }

  const db = window.supabase.createClient(config.url, config.publishableKey);
  const session = await db.auth.getSession();
  const user = session.data.session && session.data.session.user;

  if (!user) {
    message.textContent = "Sign in before opening administration.";
    return;
  }

  let admin;
  let owner;

  try {
    admin = await db.rpc("havkar_session_is_admin");
    owner = await db.rpc("havkar_session_is_owner");
  } catch (error) {
    message.textContent = "Administration is not available.";
    return;
  }

  if (admin.error && owner.error) {
    message.textContent = "Administration is not available until the database migration is applied.";
    return;
  }

  if (owner.data === true && admin.data !== true) {
    message.textContent = "Owner access is active. Administrator records stay separate.";
    return;
  }

  if (admin.data !== true) {
    message.textContent = "This account is not an administrator.";
    return;
  }

  message.textContent = "Administrator access is active. No commission is marked collected.";

  const businessRoot = document.getElementById("businessReview");
  const pendingBusiness = await db
    .from("business_applications")
    .select("id,business_name,legal_name,vat_number,address,country,city,status,email,user_id,submitted_at")
    .in("status", ["pending", "under_review", "needs_more_info"])
    .order("submitted_at", { ascending: false })
    .limit(50);

  if (pendingBusiness.error) {
    businessRoot.textContent = "Business verification queue unavailable until the verification migration is applied.";
  } else if (!pendingBusiness.data || !pendingBusiness.data.length) {
    businessRoot.textContent = "No business applications awaiting review.";
  } else {
    const heading = document.createElement("h2");
    heading.textContent = "Business applications";
    businessRoot.appendChild(heading);
    for (const row of pendingBusiness.data) {
      const card = document.createElement("article");
      card.className = "card";
      const missingRpc = await db.rpc("business_application_missing_documents", {
        p_application_id: Number(row.id)
      });
      const missing = missingRpc.error
        ? ["(could not load missing list)"]
        : (missingRpc.data || []);
      const labels = window.HAVKAR_BUSINESS_VERIFICATION
        ? missing.map(window.HAVKAR_BUSINESS_VERIFICATION.labelFor)
        : missing;
      const docs = await db
        .from("business_application_documents")
        .select("doc_type,original_filename,mime_type,created_at")
        .eq("application_id", Number(row.id))
        .order("created_at", { ascending: false });
      const latest = {};
      (docs.data || []).forEach(function(doc) {
        if (!latest[doc.doc_type]) latest[doc.doc_type] = doc;
      });
      const uploaded = Object.keys(latest).map(function(type) {
        const doc = latest[type];
        const label = window.HAVKAR_BUSINESS_VERIFICATION
          ? window.HAVKAR_BUSINESS_VERIFICATION.labelFor(type)
          : type;
        return label + " — " + (doc.original_filename || "stored") +
          (doc.mime_type ? (" [" + doc.mime_type + "]") : "");
      });
      card.innerHTML =
        "<p><strong>#" + row.id + " · " + (row.business_name || "Untitled") + "</strong></p>" +
        "<p>Status: " + (row.status || "") + "</p>" +
        "<p>Legal name: " + (row.legal_name || "(missing)") + "</p>" +
        "<p>VAT: " + (row.vat_number || "(missing)") + "</p>" +
        "<p>Address: " + (row.address || "(missing)") + " · " + (row.city || "") + ", " + (row.country || "") + "</p>" +
        "<p>Uploaded documents: " + (uploaded.length ? uploaded.join("; ") : "none") + "</p>" +
        "<p>Missing required documents: " + (labels.length ? labels.join("; ") : "none") + "</p>";
      if (row.user_id === user.id) {
        const note = document.createElement("p");
        note.textContent = "Self-review is blocked. An independent administrator must decide this application.";
        card.appendChild(note);
      } else {
        ["mark_under_review", "request_more_info", "approve", "reject"].forEach(function(decision) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = decision.replace(/_/g, " ");
          button.style.marginRight = "8px";
          button.addEventListener("click", async function() {
            const notes = window.prompt("Review notes (required for reject / request more info):", "") || "";
            const result = await db.rpc("review_business_application", {
              p_application_id: Number(row.id),
              p_decision: decision,
              p_notes: notes
            });
            message.textContent = result.error
              ? result.error.message
              : ("Business application #" + row.id + " → " + (result.data && result.data.status));
            if (!result.error) card.remove();
          });
          card.appendChild(button);
        });
      }
      businessRoot.appendChild(card);
    }
  }

  const adsRoot = document.getElementById("adsModeration");
  const pendingAds = await db
    .from("ads")
    .select("id,title,status,created_at,listing_surface")
    .eq("listing_surface", "advertising")
    .eq("status", "pending_review")
    .order("created_at", { ascending: false })
    .limit(50);

  if (pendingAds.error) {
    adsRoot.textContent = "Ads moderation queue unavailable until the Ads lifecycle migration is applied.";
  } else if (!pendingAds.data || !pendingAds.data.length) {
    adsRoot.textContent = "No advertisements pending review.";
  } else {
    const heading = document.createElement("h2");
    heading.textContent = "Ads pending review";
    adsRoot.appendChild(heading);
    pendingAds.data.forEach(function(row) {
      const card = document.createElement("article");
      card.className = "card";
      const link = document.createElement("a");
      link.href = "ad-view.html?id=" + encodeURIComponent(String(row.id));
      link.textContent = "Ad #" + row.id + " · " + (row.title || "Untitled");
      card.appendChild(link);
      const approve = document.createElement("button");
      approve.type = "button";
      approve.textContent = "Approve";
      approve.style.marginLeft = "8px";
      approve.addEventListener("click", async function() {
        const result = await db.rpc("moderate_advertisement", {
          p_ad_id: Number(row.id),
          p_decision: "approve",
          p_notes: "Approved from admin queue"
        });
        message.textContent = result.error
          ? result.error.message
          : ("Advertisement #" + row.id + " approved.");
        if (!result.error) {
          card.remove();
        }
      });
      card.appendChild(approve);
      adsRoot.appendChild(card);
    });
  }

  const ledger = await db
    .from("service_commission_entries")
    .select("booking_id,currency,customer_charge_cents,commission_cents,processing_fee_cents,tax_cents,settlement_channel,liability_state,collection_state")
    .order("created_at", { ascending: false })
    .limit(100);

  const ledgerRoot = document.getElementById("ledger");

  if (ledger.error) {
    ledgerRoot.textContent = "The commission ledger could not be read.";
  } else if (!ledger.data || !ledger.data.length) {
    ledgerRoot.textContent = "No commission entries.";
  } else {
    ledger.data.forEach(function(entry) {
      if (entry.collection_state !== "uncollected") {
        return;
      }
      const card = document.createElement("article");
      card.className = "card";
      card.textContent = "Booking " + entry.booking_id + " · " + line(entry);
      ledgerRoot.appendChild(card);
    });
  }

  const privacyRoot = document.getElementById("privacyRequests");
  const privacy = await db
    .from("privacy_requests")
    .select("id,request_type,status,created_at")
    .order("created_at", { ascending: false })
    .limit(50);
  if (privacy.error) {
    privacyRoot.textContent = "Privacy requests are not available to this administrator yet. Nothing was deleted.";
  } else if (!privacy.data || !privacy.data.length) {
    privacyRoot.textContent = "No privacy requests are visible to this session. Nothing was deleted.";
  } else {
    const note = document.createElement("p");
    note.textContent = "These are the requests this session is allowed to read. Marking one in review does not delete the account.";
    privacyRoot.appendChild(note);
    privacy.data.forEach(function(row) {
      const card = document.createElement("article");
      card.className = "card";
      card.textContent = "Privacy request " + row.id + " · " + row.request_type + " · " + row.status + ". This does not delete the account.";
      if (row.status === "requested") {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Mark in review";
        button.addEventListener("click", async function() {
          const updated = await db
            .from("privacy_requests")
            .update({ status: "in_review" })
            .eq("id", row.id)
            .eq("status", "requested");
          button.disabled = true;
          button.textContent = updated.error
            ? "Could not mark in review. Nothing was deleted."
            : "Marked in review. The account was not deleted.";
        });
        card.appendChild(button);
      }
      privacyRoot.appendChild(card);
    });
  }

  const days = await db
    .from("accommodation_availability")
    .select("stay_date,state")
    .order("stay_date", { ascending: true })
    .limit(100);
  const daysRoot = document.getElementById("availability");

  if (days.error) {
    daysRoot.textContent = "Accommodation availability is not available yet.";
    return;
  }

  if (!days.data || !days.data.length) {
    daysRoot.textContent = "No accommodation availability rows.";
    return;
  }

  days.data.forEach(function(day) {
    const card = document.createElement("article");
    card.className = "card";
    card.textContent = day.stay_date + " · " + day.state + ". Stays are not accepted.";
    daysRoot.appendChild(card);
  });
}

start();
</script>
<script src="/havkar-page-back.js"></script>
</body>
</html>
