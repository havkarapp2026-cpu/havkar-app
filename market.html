<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR - Market</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
    padding-bottom:90px;
}

button,input,select{
    font:inherit;
}

button{
    border:0;
    -webkit-tap-highlight-color:transparent;
}

button:focus,
input:focus,
select:focus{
    outline:none;
}


/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 20px;

    color:#fff;

    background:linear-gradient(
        135deg,
        #689f38,
        #7cb342
    );

    box-shadow:
        0 2px 10px rgba(0,0,0,.12);
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn,
.refresh-btn,
.close-btn{
    width:40px;
    height:40px;
    border-radius:50%;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.back-btn{
    background:transparent;
    color:#fff;
    font-size:23px;
}

.refresh-btn,
.close-btn{
    background:rgba(255,255,255,.20);
    color:#fff;
    font-size:17px;
}

.header h1{
    font-size:21px;
    font-weight:750;
}


/* ================= PAGE ================= */

.page{
    padding:20px;
    max-width:900px;
    margin:auto;
}


/* ================= SUMMARY ================= */

.summary-card{
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.summary-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.summary-title{
    font-size:15px;
    color:#777;
}

.status{
    display:flex;
    align-items:center;
    gap:6px;

    font-size:12px;
    color:#689f38;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#7cb342;
}

.status-dot.offline{
    background:#c62828;
}

.summary-value{
    font-size:28px;
    font-weight:800;
    margin-top:7px;
}

.summary-sub{
    color:#999;
    font-size:12px;
    margin-top:5px;
}


/* ================= CONTROLS ================= */

.controls{
    display:grid;
    grid-template-columns:1fr 150px;
    gap:10px;
    margin-bottom:18px;
}

.search-box{
    position:relative;
}

.search-box i{
    position:absolute;
    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#999;
}

.search-box input{
    width:100%;
    height:50px;

    border:1px solid #e0e0e0;

    background:#fff;

    border-radius:14px;

    padding:0 15px 0 45px;

    font-size:15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.04);
}

.search-box input:focus{
    border-color:#7cb342;

    box-shadow:
        0 0 0 3px rgba(124,179,66,.12);
}

.currency-select{
    width:100%;
    height:50px;

    border:1px solid #e0e0e0;

    background:#fff;

    border-radius:14px;

    padding:0 12px;

    font-weight:700;

    color:#555;
}


/* ================= SECTION ================= */

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin:4px 0 12px;
}

.section-head h2{
    font-size:20px;
}

.favorite-count{
    color:#689f38;
    font-size:12px;
    font-weight:700;
}


/* ================= FAVORITES ================= */

.favorite-section{
    margin-bottom:22px;

    padding:17px;

    background:#edf6e7;

    border-radius:18px;

    border:1px solid #dcebd3;
}

.favorite-section.hidden{
    display:none;
}


/* ================= MARKET LIST ================= */

.market-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}


/* ================= COIN CARD ================= */

.coin-card{
    width:100%;

    background:#fff;

    border-radius:17px;

    padding:15px;

    display:flex;
    align-items:center;

    gap:13px;

    box-shadow:
        0 2px 9px rgba(0,0,0,.06);

    cursor:pointer;

    text-align:left;

    color:#333;

    transition:
        transform .15s,
        box-shadow .15s;
}

.coin-card:active{
    transform:scale(.985);
}

.coin-icon{
    width:48px;
    height:48px;

    min-width:48px;

    border-radius:50%;

    background:#f1f7eb;

    color:#689f38;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:20px;

    font-weight:800;
}

.coin-info{
    flex:1;
    min-width:0;
}

.coin-name{
    font-size:16px;
    font-weight:750;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.coin-symbol{
    color:#999;
    font-size:12px;
    margin-top:4px;
}

.coin-right{
    text-align:right;
    min-width:115px;
}

.coin-price{
    font-size:15px;
    font-weight:750;
    white-space:nowrap;
}

.coin-change{
    margin-top:5px;
    font-size:12px;
    font-weight:700;
}

.up{
    color:#2e7d32;
}

.down{
    color:#c62828;
}


/* ================= FAVORITE STAR ================= */

.coin-star{
    width:36px;
    height:36px;

    min-width:36px;

    border-radius:50%;

    background:#f5f8f2;

    color:#aaa;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:16px;
}

.coin-star.active{
    color:#f2b01e;
    background:#fff8df;
}


/* ================= LOADING ================= */

.loading{
    background:#fff;

    border-radius:17px;

    padding:30px;

    text-align:center;

    color:#999;
}

.spinner{
    width:30px;
    height:30px;

    border:3px solid #e5e5e5;

    border-top-color:#7cb342;

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* ================= EMPTY ================= */

.empty{
    background:#fff;

    border-radius:17px;

    padding:30px;

    text-align:center;

    color:#999;
}


/* ================= ERROR ================= */

.error-box{
    display:none;

    background:#ffebee;

    color:#c62828;

    border-radius:14px;

    padding:15px;

    margin-bottom:15px;

    line-height:1.5;
}

.error-box.show{
    display:block;
}


/* ================= DETAIL OVERLAY ================= */

.detail-overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.42);

    display:none;

    align-items:flex-end;

    justify-content:center;

    z-index:500;

    padding:0;
}

.detail-overlay.show{
    display:flex;
}

.detail-panel{
    width:100%;
    max-width:700px;

    max-height:92vh;

    overflow-y:auto;

    background:#f5f5f5;

    border-radius:
        24px 24px 0 0;

    box-shadow:
        0 -10px 35px rgba(0,0,0,.20);

    animation:
        detailUp .22s ease;
}

@keyframes detailUp{

    from{
        transform:translateY(100%);
    }

    to{
        transform:translateY(0);
    }
}


/* ================= DETAIL HEADER ================= */

.detail-header{
    position:sticky;

    top:0;

    z-index:10;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:16px 20px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );
}

.detail-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.detail-title-icon{
    width:42px;
    height:42px;

    border-radius:50%;

    background:
        rgba(255,255,255,.20);

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:800;
}

.detail-title-text{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.detail-title-name{
    font-size:18px;
    font-weight:800;
}

.detail-title-symbol{
    font-size:12px;
    opacity:.85;
}


/* ================= DETAIL CONTENT ================= */

.detail-content{
    padding:20px;
}

.detail-price-card,
.stat-card{
    background:#fff;

    border-radius:18px;

    padding:18px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.detail-price-card{
    margin-bottom:15px;
}

.detail-label,
.stat-name{
    color:#999;
    font-size:12px;
    margin-bottom:7px;
}

.detail-price{
    font-size:32px;
    font-weight:850;
    color:#222;
    word-break:break-word;
}

.detail-change{
    margin-top:8px;
    font-size:14px;
    font-weight:750;
}

.detail-up{
    color:#2e7d32;
}

.detail-down{
    color:#c62828;
}


/* ================= DETAIL STATS ================= */

.stats-grid{
    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:12px;

    margin-bottom:15px;
}

.stat-value{
    color:#333;

    font-size:15px;

    font-weight:750;

    line-height:1.35;

    word-break:break-word;
}


/* ================= DETAIL ACTIONS ================= */

.detail-actions{
    display:grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap:10px;
}

.detail-action{
    border-radius:14px;

    padding:14px;

    background:#7cb342;

    color:#fff;

    font-weight:750;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;
}

.detail-action.secondary{
    background:#fff;

    color:#689f38;

    border:
        1px solid #dfead5;
}

.detail-action.favorite-active{
    background:#f2b01e;
    color:#fff;
}


/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:75px;

    background:#fff;

    display:flex;

    justify-content:space-around;

    align-items:center;

    box-shadow:
        0 -2px 10px rgba(0,0,0,.10);

    z-index:300;
}

.nav-item{
    color:#999;

    text-align:center;

    font-size:12px;

    cursor:pointer;

    min-width:55px;

    user-select:none;
}

.nav-item i{
    display:block;

    font-size:21px;

    margin-bottom:5px;
}

.nav-item.active{
    color:#7cb342;
}


/* ================= TOAST ================= */

.toast{
    position:fixed;

    left:50%;

    bottom:95px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#333;

    color:#fff;

    padding:11px 16px;

    border-radius:12px;

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:800;

    white-space:nowrap;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* ================= MOBILE ================= */

@media(max-width:560px){

    .controls{
        grid-template-columns:
            1fr 105px;
    }

    .page{
        padding:15px;
    }

    .detail-content{
        padding:15px;
    }

    .stats-grid{
        gap:9px;
    }

    .detail-action{
        padding:12px 8px;
        font-size:12px;
    }

}


/* ================= DESKTOP ================= */

@media(min-width:700px){

    .detail-overlay{
        align-items:center;
        padding:20px;
    }

    .detail-panel{
        border-radius:24px;
        max-height:90vh;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-left">

        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
            aria-label="Back">

            <i class="fas fa-arrow-left"></i>

        </button>

        <h1>Market</h1>

    </div>


    <button
        class="refresh-btn"
        type="button"
        onclick="loadMarket()"
        aria-label="Refresh">

        <i class="fas fa-rotate"></i>

    </button>

</header>


<!-- =====================================================
     PAGE
===================================================== -->

<main class="page">


    <div
        id="errorBox"
        class="error-box">
    </div>


    <!-- SUMMARY -->

    <section class="summary-card">

        <div class="summary-top">

            <div class="summary-title">
                Cryptocurrency Market
            </div>

            <div class="status">

                <span
                    id="statusDot"
                    class="status-dot">
                </span>

                <span id="connectionStatus">
                    Updating
                </span>

            </div>

        </div>


        <div
            id="marketCount"
            class="summary-value">

            --

        </div>


        <div
            id="lastUpdated"
            class="summary-sub">

            Loading market data...

        </div>

    </section>


    <!-- SEARCH + CURRENCY -->

    <div class="controls">


        <div class="search-box">

            <i class="fas fa-search"></i>

            <input
                id="searchInput"
                type="search"
                placeholder="Search cryptocurrency..."
                autocomplete="off"
            >

        </div>


        <select
            id="currencySelect"
            class="currency-select"
            aria-label="Display currency">

            <option value="eur">
                EUR €
            </option>

            <option value="usd">
                USD $
            </option>

            <option value="sek">
                SEK kr
            </option>

            <option value="gbp">
                GBP £
            </option>

        </select>

    </div>


    <!-- FAVORITES -->

    <section
        id="favoriteSection"
        class="favorite-section hidden">


        <div class="section-head">

            <h2>
                Favorites
            </h2>

            <span
                id="favoriteCount"
                class="favorite-count">

                0 saved

            </span>

        </div>


        <div
            id="favoriteList"
            class="market-list">
        </div>

    </section>


    <!-- MARKET -->

    <div class="section-head">

        <h2>
            Top Cryptocurrencies
        </h2>

    </div>


    <div
        id="marketList"
        class="market-list">


        <div class="loading">

            <div class="spinner"></div>

            Loading cryptocurrency prices...

        </div>


    </div>


</main>


<!-- =====================================================
     COIN DETAILS
===================================================== -->

<div
    id="detailOverlay"
    class="detail-overlay"
    aria-hidden="true">


    <section
        class="detail-panel"
        role="dialog"
        aria-modal="true">


        <div class="detail-header">


            <div class="detail-title">


                <div
                    id="detailIcon"
                    class="detail-title-icon">

                    --

                </div>


                <div class="detail-title-text">


                    <div
                        id="detailName"
                        class="detail-title-name">

                        --

                    </div>


                    <div
                        id="detailSymbol"
                        class="detail-title-symbol">

                        --

                    </div>


                </div>


            </div>


            <button
                class="close-btn"
                type="button"
                onclick="closeDetails()"
                aria-label="Close">

                <i class="fas fa-xmark"></i>

            </button>


        </div>


        <div
            id="detailContent"
            class="detail-content">


            <div class="loading">

                Loading...

            </div>


        </div>


    </section>


</div>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">


    <div
        class="nav-item"
        onclick="navigateTo('wallet.html')">

        <i class="fas fa-wallet"></i>

        Wallet

    </div>


    <div class="nav-item active">

        <i class="fas fa-chart-line"></i>

        Market

    </div>


    <div
        class="nav-item"
        onclick="showToast('Trade is not connected yet.')">

        <i class="fas fa-exchange-alt"></i>

        Trade

    </div>


    <div
        class="nav-item"
        onclick="showToast('History is not connected yet.')">

        <i class="fas fa-history"></i>

        History

    </div>


    <div
        class="nav-item"
        onclick="navigateTo('profile.html')">

        <i class="fas fa-user"></i>

        Profile

    </div>


</nav>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =====================================================
   HAVKAR MARKET CONFIGURATION
===================================================== */

const COINS = [

    {
        id:"bitcoin",
        name:"Bitcoin",
        symbol:"BTC",
        icon:"₿"
    },

    {
        id:"ethereum",
        name:"Ethereum",
        symbol:"ETH",
        icon:"Ξ"
    },

    {
        id:"tether",
        name:"Tether",
        symbol:"USDT",
        icon:"₮"
    },

    {
        id:"binancecoin",
        name:"BNB",
        symbol:"BNB",
        icon:"BNB"
    },

    {
        id:"solana",
        name:"Solana",
        symbol:"SOL",
        icon:"S"
    },

    {
        id:"ripple",
        name:"XRP",
        symbol:"XRP",
        icon:"X"
    },

    {
        id:"cardano",
        name:"Cardano",
        symbol:"ADA",
        icon:"A"
    },

    {
        id:"dogecoin",
        name:"Dogecoin",
        symbol:"DOGE",
        icon:"Ð"
    },

    {
        id:"tron",
        name:"TRON",
        symbol:"TRX",
        icon:"T"
    },

    {
        id:"polkadot",
        name:"Polkadot",
        symbol:"DOT",
        icon:"●"
    },

    {
        id:"usd-coin",
        name:"USDC",
        symbol:"USDC",
        icon:"$"
    },

    {
        id:"avalanche-2",
        name:"Avalanche",
        symbol:"AVAX",
        icon:"A"
    },

    {
        id:"chainlink",
        name:"Chainlink",
        symbol:"LINK",
        icon:"L"
    },

    {
        id:"stellar",
        name:"Stellar",
        symbol:"XLM",
        icon:"X"
    },

    {
        id:"uniswap",
        name:"Uniswap",
        symbol:"UNI",
        icon:"U"
    }

];


/* =====================================================
   STORAGE
===================================================== */

const FAVORITES_KEY =
    "havkar_market_favorites_v1";

const CURRENCY_KEY =
    "havkar_market_currency_v1";


/* =====================================================
   STATE
===================================================== */

let marketData = {};

let detailCache = {};

let detailRequestId = 0;

let selectedCoinId = null;


/* =====================================================
   DOM
===================================================== */

const marketList =
    document.getElementById(
        "marketList"
    );

const favoriteList =
    document.getElementById(
        "favoriteList"
    );

const favoriteSection =
    document.getElementById(
        "favoriteSection"
    );

const favoriteCount =
    document.getElementById(
        "favoriteCount"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const currencySelect =
    document.getElementById(
        "currencySelect"
    );

const marketCount =
    document.getElementById(
        "marketCount"
    );

const lastUpdated =
    document.getElementById(
        "lastUpdated"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const statusDot =
    document.getElementById(
        "statusDot"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const detailOverlay =
    document.getElementById(
        "detailOverlay"
    );

const detailContent =
    document.getElementById(
        "detailContent"
    );

const detailIcon =
    document.getElementById(
        "detailIcon"
    );

const detailName =
    document.getElementById(
        "detailName"
    );

const detailSymbol =
    document.getElementById(
        "detailSymbol"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =====================================================
   FAVORITES
===================================================== */

function getFavorites(){

    try{

        const value =
            JSON.parse(
                localStorage.getItem(
                    FAVORITES_KEY
                ) || "[]"
            );


        return Array.isArray(value)
            ? value
            : [];

    }
    catch(error){

        return [];

    }

}


function saveFavorites(
    list
){

    localStorage.setItem(
        FAVORITES_KEY,

        JSON.stringify(
            [
                ...new Set(list)
            ]
        )
    );

}


function isFavorite(
    id
){

    return getFavorites()
        .includes(id);

}


function toggleFavorite(
    id,
    event
){

    if(event){

        event.stopPropagation();

    }


    const favorites =
        getFavorites();


    const index =
        favorites.indexOf(id);


    if(index >= 0){

        favorites.splice(
            index,
            1
        );

        showToast(
            "Removed from Favorites"
        );

    }
    else{

        favorites.push(id);

        showToast(
            "Added to Favorites"
        );

    }


    saveFavorites(
        favorites
    );


    renderMarket();

    renderFavorites();


    if(
        selectedCoinId === id &&
        detailOverlay.classList.contains(
            "show"
        )
    ){

        updateDetailFavoriteButton();

    }

}


/* =====================================================
   CURRENCY
===================================================== */

function getCurrency(){

    return (
        currencySelect.value ||
        "eur"
    );

}


function currencySymbol(){

    const symbols = {

        eur:"€",
        usd:"$",
        sek:"kr",
        gbp:"£"

    };


    return (
        symbols[
            getCurrency()
        ] || "€"
    );

}


/* =====================================================
   FORMATTING
===================================================== */

function formatPrice(
    value
){

    const number =
        Number(value);


    if(
        !Number.isFinite(number)
    ){

        return "--";

    }


    let digits = 8;


    if(number >= 1000){

        digits = 2;

    }
    else if(number >= 1){

        digits = 4;

    }


    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:
                number >= 1000
                    ? 2
                    : 2,

            maximumFractionDigits:
                digits
        }
    );

}


function formatLargeNumber(
    value
){

    const number =
        Number(value);


    if(
        !Number.isFinite(number) ||
        number <= 0
    ){

        return "--";

    }


    return number.toLocaleString(
        "en-US",
        {
            maximumFractionDigits:2
        }
    );

}


function formatPercent(
    value
){

    const number =
        Number(value);


    if(
        !Number.isFinite(number)
    ){

        return "--";

    }


    return (
        number >= 0
            ? "+"
            : ""
    ) +
    number.toFixed(2) +
    "%";

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(
    value
){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}

function goBack(){

/* =====================================================
   LOAD MARKET
===================================================== */

async function loadMarket(){

    hideError();


    connectionStatus.textContent =
        "Updating";


    statusDot.classList.remove(
        "offline"
    );


    marketList.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading cryptocurrency prices...

        </div>

    `;


    const ids =
        COINS
            .map(
                coin => coin.id
            )
            .join(",");


    const url =
        "https://api.coingecko.com/api/v3/coins/markets" +

        "?vs_currency=" +
        encodeURIComponent(
            getCurrency()
        ) +

        "&ids=" +
        encodeURIComponent(ids) +

        "&order=market_cap_desc" +

        "&per_page=" +
        COINS.length +

        "&page=1" +

        "&sparkline=false" +

        "&price_change_percentage=24h";


    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !Array.isArray(data) ||
            !data.length
        ){

            throw new Error(
                "No market data returned."
            );

        }


        marketData = {};


        data.forEach(
            coin => {

                marketData[
                    coin.id
                ] = coin;

            }
        );


        detailCache = {};


        renderMarket();

        renderFavorites();


        marketCount.textContent =
            data.length +
            " cryptocurrencies";


        lastUpdated.textContent =
            "Updated: " +
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit",
                        second:"2-digit"
                    }
                );


        connectionStatus.textContent =
            "Live";

    }
    catch(error){

        console.error(
            "HAVKAR Market error:",
            error
        );


        connectionStatus.textContent =
            "Offline";


        statusDot.classList.add(
            "offline"
        );


        marketList.innerHTML = `

            <div class="empty">

                Unable to load cryptocurrency prices.

                <br><br>

                Check your internet connection
                or try again.

                <br><br>

                <button
                    type="button"
                    onclick="loadMarket()"
                    style="
                        border:0;
                        padding:11px 16px;
                        border-radius:10px;
                        background:#7cb342;
                        color:white;
                        font-weight:700;
                        cursor:pointer;
                    "
                >

                    Try Again

                </button>

            </div>

        `;


        showError(
            "Market data could not be loaded."
        );

    }

}


/* =====================================================
   CREATE COIN CARD
===================================================== */

function createCoinCard(
    coin
){

    const market =
        marketData[
            coin.id
        ];


    if(!market){

        return null;

    }


    const price =
        Number(
            market.current_price || 0
        );


    const change =
        Number(
            market.price_change_percentage_24h ||
            0
        );


    const favorite =
        isFavorite(
            coin.id
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "coin-card";


    card.setAttribute(
        "role",
        "button"
    );


    card.setAttribute(
        "tabindex",
        "0"
    );


    card.innerHTML = `

        <div class="coin-icon">

            ${escapeHtml(
                coin.icon
            )}

        </div>


        <div class="coin-info">

            <div class="coin-name">

                ${escapeHtml(
                    coin.name
                )}

            </div>


            <div class="coin-symbol">

                ${escapeHtml(
                    coin.symbol
                )}

            </div>

        </div>


        <div class="coin-right">

            <div class="coin-price">

                ${currencySymbol()}${formatPrice(
                    price
                )}

            </div>


            <div
                class="coin-change ${
                    change >= 0
                        ? "up"
                        : "down"
                }"
            >

                ${
                    change >= 0
                        ? "+"
                        : ""
                }${change.toFixed(2)}%

            </div>

        </div>


        <button
            type="button"
            class="coin-star ${
                favorite
                    ? "active"
                    : ""
            }"
            title="${
                favorite
                    ? "Remove from Favorites"
                    : "Add to Favorites"
            }"
            aria-label="${
                favorite
                    ? "Remove from Favorites"
                    : "Add to Favorites"
            }"
        >

            <i class="fa${
                favorite
                    ? "s"
                    : "r"
            } fa-star"></i>

        </button>

    `;


    card.addEventListener(
        "click",
        function(){

            openCoinDetails(
                coin.id
            );

        }
    );


    card.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                openCoinDetails(
                    coin.id
                );

            }

        }
    );


    const star =
        card.querySelector(
            ".coin-star"
        );


    star.addEventListener(
        "click",
        function(event){

            toggleFavorite(
                coin.id,
                event
            );

        }
    );


    return card;

}


/* =====================================================
   RENDER MARKET
===================================================== */

function renderMarket(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        COINS.filter(
            coin => {

                if(
                    !marketData[
                        coin.id
                    ]
                ){

                    return false;

                }


                if(!query){

                    return true;

                }


                return (

                    coin.name
                        .toLowerCase()
                        .includes(
                            query
                        )

                    ||

                    coin.symbol
                        .toLowerCase()
                        .includes(
                            query
                        )

                );

            }
        );


    marketList.innerHTML = "";


    if(
        !filtered.length
    ){

        marketList.innerHTML = `

            <div class="empty">

                No cryptocurrency found.

            </div>

        `;

        return;

    }


    filtered.forEach(
        coin => {

            const card =
                createCoinCard(
                    coin
                );


            if(card){

                marketList.appendChild(
                    card
                );

            }

        }
    );

}


/* =====================================================
   RENDER FAVORITES
===================================================== */

function renderFavorites(){

    const favorites =
        getFavorites();


    const available =
        favorites

            .map(
                id =>
                    COINS.find(
                        coin =>
                            coin.id === id
                    )
            )

            .filter(Boolean)

            .filter(
                coin =>
                    marketData[
                        coin.id
                    ]
            );


    favoriteList.innerHTML =
        "";


    favoriteCount.textContent =
        available.length +
        " saved";


    if(
        !available.length
    ){

        favoriteSection.classList.add(
            "hidden"
        );

        return;

    }


    favoriteSection.classList.remove(
        "hidden"
    );


    available.forEach(
        coin => {

            const card =
                createCoinCard(
                    coin
                );


            if(card){

                favoriteList.appendChild(
                    card
                );

            }

        }
    );

}


/* =====================================================
   OPEN DETAILS
===================================================== */

async function openCoinDetails(
    coinId
){

    const coin =
        COINS.find(
            item =>
                item.id === coinId
        );


    if(!coin){

        return;

    }


    selectedCoinId =
        coinId;


    detailRequestId++;


    const requestId =
        detailRequestId;


    detailIcon.textContent =
        coin.icon;


    detailName.textContent =
        coin.name;


    detailSymbol.textContent =
        coin.symbol;


    detailContent.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading ${escapeHtml(
                coin.name
            )} details...

        </div>

    `;


    detailOverlay.classList.add(
        "show"
    );


    detailOverlay.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.style.overflow =
        "hidden";


    if(
        detailCache[
            coinId
        ]
    ){

        renderCoinDetails(
            detailCache[
                coinId
            ]
        );


        refreshCoinDetails(
            coinId,
            requestId
        );


        return;

    }


    await refreshCoinDetails(
        coinId,
        requestId
    );

}


/* =====================================================
   REFRESH DETAILS
===================================================== */

async function refreshCoinDetails(
    coinId,
    requestId
){

    const url =
        "https://api.coingecko.com/api/v3/coins/" +
        encodeURIComponent(
            coinId
        ) +

        "?localization=false" +

        "&tickers=false" +

        "&market_data=true" +

        "&community_data=false" +

        "&developer_data=false" +

        "&sparkline=false";


    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            requestId !==
            detailRequestId
        ){

            return;

        }


        detailCache[
            coinId
        ] = data;


        renderCoinDetails(
            data
        );

    }
    catch(error){

        console.error(
            "Coin details error:",
            error
        );


        if(
            requestId !==
            detailRequestId
        ){

            return;

        }


        detailContent.innerHTML = `

            <div class="empty">

                Unable to load cryptocurrency details.

                <br><br>

                <button
                    type="button"
                    class="detail-action"
                    onclick="openCoinDetails('${escapeJs(
                        coinId
                    )}')"
                >

                    <i class="fas fa-rotate"></i>

                    Try Again

                </button>

            </div>

        `;

    }

}

/* =====================================================
   DETAIL FAVORITE BUTTON
===================================================== */

function updateDetailFavoriteButton(){

            "detailFavoriteButton"
        );


    if(
        !button ||
        !selectedCoinId
    ){

        return;

    }


    const active =
        isFavorite(
            selectedCoinId
        );


    button.className =
        "detail-action" +
        (
            active

                : ""
        );


    button.innerHTML =
        '<i class="fas fa-star"></i> ' +
        (
            active
                ? "Favorited"
                : "Favorite"
        );

}

   REFRESH OPEN COIN
===================================================== */

function refreshOpenCoin(){

        !selectedCoinId
    ){

    }


    delete detailCache[
        selectedCoinId
    ];


    openCoinDetails(
        selectedCoinId
    );

}

   CLOSE DETAILS

    detailRequestId++;

    selectedCoinId =

    detailOverlay.classList.remove(
        "show"
    );


    detailOverlay.setAttribute(
        "aria-hidden",
        "true"
    );


    document.body.style.overflow =

){

            function(){

            1800
        );
