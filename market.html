<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HAVKAR - Market</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f5f5f5;
    color:#333;
    padding-bottom:90px;
}

button,
input{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

button:focus,
input:focus{
    outline:none;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color:white;

    padding:15px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:
        0 2px 10px rgba(0,0,0,.12);

    position:sticky;
    top:0;

    z-index:100;
}

.header-left{

    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn{

    border:0;
    background:none;
    color:white;

    font-size:24px;

    cursor:pointer;

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.header h1{
    font-size:21px;
    font-weight:700;
}

.refresh-btn{

    border:0;

    width:40px;
    height:40px;

    border-radius:50%;

    background:
        rgba(255,255,255,.20);

    color:white;

    font-size:17px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.15s;
}

.refresh-btn:active{
    transform:scale(.92);
}


/* =========================================================
   PAGE
========================================================= */

.page{
    padding:20px;
}


/* =========================================================
   SUMMARY
========================================================= */

.summary-card{

    background:white;

    border-radius:20px;

    padding:20px;

    margin-bottom:18px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.summary-top{

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.summary-title{
    font-size:15px;
    color:#777;
}

.status{

    display:flex;
    align-items:center;

    gap:6px;

    font-size:12px;

    color:#689f38;
}

.status-dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#7cb342;
}

.status-dot.offline{
    background:#c62828;
}

.summary-value{

    font-size:28px;

    font-weight:800;

    margin-top:7px;
}

.summary-sub{

    color:#999;

    font-size:12px;

    margin-top:5px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{

    position:relative;

    margin-bottom:18px;
}

.search-box i{

    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:#999;
}

.search-box input{

    width:100%;

    border:1px solid #e0e0e0;

    background:white;

    border-radius:14px;

    padding:14px 15px 14px 45px;

    font-size:15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.04);

    transition:.15s;
}

.search-box input:focus{

    border-color:#7cb342;

    box-shadow:
        0 0 0 3px rgba(124,179,66,.12);
}


/* =========================================================
   MARKET LIST
========================================================= */

.market-title{

    font-size:20px;

    font-weight:750;

    margin-bottom:12px;
}

.market-list{

    display:flex;

    flex-direction:column;

    gap:12px;
}


/* =========================================================
   COIN CARD
========================================================= */

.coin-card{

    width:100%;

    border:0;

    background:white;

    border-radius:17px;

    padding:15px;

    display:flex;

    align-items:center;

    gap:13px;

    box-shadow:
        0 2px 9px rgba(0,0,0,.06);

    cursor:pointer;

    text-align:left;

    color:#333;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.coin-card:hover{

    box-shadow:
        0 5px 16px rgba(0,0,0,.10);
}

.coin-card:active{

    transform:scale(.985);
}

.coin-icon{

    width:48px;
    height:48px;

    min-width:48px;

    border-radius:50%;

    background:#f1f7eb;

    color:#689f38;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:21px;

    font-weight:800;
}

.coin-info{

    flex:1;

    min-width:0;
}

.coin-name{

    font-size:16px;

    font-weight:750;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.coin-symbol{

    color:#999;

    font-size:12px;

    margin-top:4px;
}

.coin-right{

    text-align:right;

    min-width:115px;
}

.coin-price{

    font-size:15px;

    font-weight:750;

    white-space:nowrap;
}

.coin-change{

    margin-top:5px;

    font-size:12px;

    font-weight:700;
}

.up{
    color:#2e7d32;
}

.down{
    color:#c62828;
}

.coin-arrow{

    color:#aaa;

    font-size:13px;

    margin-left:2px;
}


/* =========================================================
   LOADING
========================================================= */

.loading{

    background:white;

    border-radius:17px;

    padding:30px;

    text-align:center;

    color:#999;
}

.spinner{

    width:30px;
    height:30px;

    border:3px solid #e5e5e5;

    border-top-color:#7cb342;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

    margin:0 auto 12px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   ERROR
========================================================= */

.error-box{

    background:#ffebee;

    color:#c62828;

    border-radius:14px;

    padding:15px;

    margin-bottom:15px;

    line-height:1.5;

    display:none;
}

.error-box button{

    margin-top:10px;

    border:0;

    border-radius:9px;

    padding:9px 13px;

    background:#c62828;

    color:white;

    cursor:pointer;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    background:white;

    border-radius:17px;

    padding:30px;

    text-align:center;

    color:#999;
}


/* =========================================================
   DETAIL OVERLAY
========================================================= */

.detail-overlay{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.42);

    display:none;

    align-items:flex-end;

    justify-content:center;

    z-index:500;

    padding:0;
}

.detail-overlay.show{
    display:flex;
}

.detail-panel{

    width:100%;

    max-width:700px;

    max-height:92vh;

    overflow-y:auto;

    background:#f5f5f5;

    border-radius:
        24px 24px 0 0;

    box-shadow:
        0 -10px 35px rgba(0,0,0,.20);

    animation:
        detailUp .22s ease;
}

@keyframes detailUp{

    from{
        transform:translateY(100%);
    }

    to{
        transform:translateY(0);
    }
}


/* =========================================================
   DETAIL HEADER
========================================================= */

.detail-header{

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color:white;

    padding:16px 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:sticky;

    top:0;

    z-index:10;
}

.detail-title{

    display:flex;

    align-items:center;

    gap:12px;
}

.detail-title-icon{

    width:42px;
    height:42px;

    border-radius:50%;

    background:
        rgba(255,255,255,.20);

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:800;

    font-size:18px;
}

.detail-title-text{

    display:flex;

    flex-direction:column;

    gap:2px;
}

.detail-title-name{

    font-size:18px;

    font-weight:800;
}

.detail-title-symbol{

    font-size:12px;

    opacity:.85;
}

.detail-close{

    width:40px;
    height:40px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.18);

    color:white;

    cursor:pointer;

    font-size:18px;
}


/* =========================================================
   DETAIL CONTENT
========================================================= */

.detail-content{

    padding:20px;
}

.detail-price-card{

    background:white;

    border-radius:20px;

    padding:22px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);

    margin-bottom:15px;
}

.detail-label{

    color:#999;

    font-size:13px;

    margin-bottom:7px;
}

.detail-price{

    font-size:32px;

    font-weight:850;

    color:#222;

    word-break:break-word;
}

.detail-change{

    margin-top:8px;

    font-size:14px;

    font-weight:750;
}

.detail-up{
    color:#2e7d32;
}

.detail-down{
    color:#c62828;
}


/* =========================================================
   DETAIL STATS
========================================================= */

.stats-grid{

    display:grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap:12px;

    margin-bottom:15px;
}

.stat-card{

    background:white;

    border-radius:16px;

    padding:16px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.stat-name{

    color:#999;

    font-size:12px;

    margin-bottom:7px;
}

.stat-value{

    color:#333;

    font-size:15px;

    font-weight:750;

    line-height:1.35;

    word-break:break-word;
}


/* =========================================================
   DETAIL ACTIONS
========================================================= */

.detail-actions{

    display:grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap:12px;

    margin-bottom:15px;
}

.detail-action{

    border:0;

    border-radius:14px;

    padding:14px;

    background:#7cb342;

    color:white;

    font-weight:750;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;
}

.detail-action.secondary{

    background:white;

    color:#689f38;

    border:
        1px solid #dfead5;
}


/* =========================================================
   DETAIL LOADING
========================================================= */

.detail-loading{

    background:white;

    border-radius:18px;

    padding:35px;

    text-align:center;

    color:#999;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:75px;

    background:white;

    display:flex;

    justify-content:space-around;

    align-items:center;

    box-shadow:
        0 -2px 10px rgba(0,0,0,.10);

    z-index:300;
}

.nav-item{

    color:#999;

    text-align:center;

    font-size:12px;

    cursor:pointer;

    min-width:55px;

    user-select:none;
}

.nav-item i{

    display:block;

    font-size:21px;

    margin-bottom:5px;
}

.nav-item.active{
    color:#7cb342;
}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;

    bottom:95px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#333;

    color:white;

    padding:11px 16px;

    border-radius:12px;

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:800;

    white-space:nowrap;
}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

    .page{
        padding:15px;
    }

    .coin-right{
        min-width:100px;
    }

    .coin-price{
        font-size:14px;
    }

    .detail-content{
        padding:15px;
    }

    .stats-grid{
        gap:9px;
    }

    .stat-card{
        padding:13px;
    }

}


/* =========================================================
   LARGE SCREEN
========================================================= */

@media(min-width:700px){

    .detail-overlay{
        align-items:center;
        padding:20px;
    }

    .detail-panel{

        border-radius:24px;

        max-height:90vh;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     MAIN HEADER
======================================================= -->

<div class="header">

    <div class="header-left">

        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
            aria-label="Back">

            <i class="fas fa-arrow-left"></i>

        </button>

        <h1>Market</h1>

    </div>


    <button
        class="refresh-btn"
        type="button"
        onclick="loadMarket()"
        aria-label="Refresh market">

        <i class="fas fa-rotate"></i>

    </button>

</div>


<!-- =======================================================
     MAIN PAGE
======================================================= -->

<main class="page">


    <div
        id="errorBox"
        class="error-box">
    </div>


    <!-- SUMMARY -->

    <div class="summary-card">

        <div class="summary-top">

            <div class="summary-title">
                Cryptocurrency Market
            </div>

            <div class="status">

                <span
                    id="statusDot"
                    class="status-dot">
                </span>

                <span id="connectionStatus">
                    Updating
                </span>

            </div>

        </div>


        <div
            class="summary-value"
            id="marketCount">

            --

        </div>


        <div
            class="summary-sub"
            id="lastUpdated">

            Loading market data...

        </div>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <i class="fas fa-search"></i>

        <input
            id="searchInput"
            type="search"
            placeholder="Search cryptocurrency..."
            autocomplete="off"
        >

    </div>


    <!-- MARKET -->

    <div class="market-title">
        Top Cryptocurrencies
    </div>


    <div
        id="marketList"
        class="market-list">

        <div class="loading">

            <div class="spinner"></div>

            Loading cryptocurrency prices...

        </div>

    </div>


</main>


<!-- =======================================================
     COIN DETAIL OVERLAY
======================================================= -->

<div
    id="detailOverlay"
    class="detail-overlay"
    aria-hidden="true"
>


    <section
        class="detail-panel"
        role="dialog"
        aria-modal="true"
        aria-label="Cryptocurrency details"
    >


        <div class="detail-header">


            <div class="detail-title">


                <div
                    id="detailIcon"
                    class="detail-title-icon">

                    --

                </div>


                <div class="detail-title-text">

                    <div
                        id="detailName"
                        class="detail-title-name">

                        Cryptocurrency

                    </div>


                    <div
                        id="detailSymbol"
                        class="detail-title-symbol">

                        --

                    </div>

                </div>

            </div>


            <button
                class="detail-close"
                type="button"
                onclick="closeDetails()"
                aria-label="Close">

                <i class="fas fa-xmark"></i>

            </button>

        </div>


        <div
            id="detailContent"
            class="detail-content">


            <div class="detail-loading">

                <div class="spinner"></div>

                Loading cryptocurrency details...

            </div>


        </div>


    </section>

</div>


<!-- =======================================================
     BOTTOM NAV
======================================================= -->

<div class="bottom-nav">


    <div
        class="nav-item"
        onclick="navigateTo('wallet.html')">

        <i class="fas fa-wallet"></i>

        Wallet

    </div>


    <div
        class="nav-item active">

        <i class="fas fa-chart-line"></i>

        Market

    </div>


    <div
        class="nav-item"
        onclick="showUnavailable('Trade')">

        <i class="fas fa-exchange-alt"></i>

        Trade

    </div>


    <div
        class="nav-item"
        onclick="showUnavailable('History')">

        <i class="fas fa-history"></i>

        History

    </div>


    <div
        class="nav-item"
        onclick="navigateTo('profile.html')">

        <i class="fas fa-user"></i>

        Profile

    </div>


</div>


<!-- =======================================================
     TOAST
======================================================= -->

<div
    id="toast"
    class="toast">
</div>


<script>

/* =========================================================
   MARKET CONFIGURATION
========================================================= */

const COINS = [

    {
        id:"bitcoin",
        name:"Bitcoin",
        symbol:"BTC",
        icon:"₿"
    },

    {
        id:"ethereum",
        name:"Ethereum",
        symbol:"ETH",
        icon:"Ξ"
    },

    {
        id:"tether",
        name:"Tether",
        symbol:"USDT",
        icon:"₮"
    },

    {
        id:"binancecoin",
        name:"BNB",
        symbol:"BNB",
        icon:"BNB"
    },

    {
        id:"solana",
        name:"Solana",
        symbol:"SOL",
        icon:"S"
    },

    {
        id:"ripple",
        name:"XRP",
        symbol:"XRP",
        icon:"X"
    },

    {
        id:"cardano",
        name:"Cardano",
        symbol:"ADA",
        icon:"A"
    },

    {
        id:"dogecoin",
        name:"Dogecoin",
        symbol:"DOGE",
        icon:"Ð"
    },

    {
        id:"tron",
        name:"TRON",
        symbol:"TRX",
        icon:"T"
    },

    {
        id:"polkadot",
        name:"Polkadot",
        symbol:"DOT",
        icon:"●"
    }

];


/* =========================================================
   STATE
========================================================= */

let marketData = {};

let detailCache = {};

let detailRequestId = 0;


/* =========================================================
   DOM
========================================================= */

const marketList =
    document.getElementById("marketList");

const searchInput =
    document.getElementById("searchInput");

const marketCount =
    document.getElementById("marketCount");

const lastUpdated =
    document.getElementById("lastUpdated");

const connectionStatus =
    document.getElementById("connectionStatus");

const statusDot =
    document.getElementById("statusDot");

const errorBox =
    document.getElementById("errorBox");

const detailOverlay =
    document.getElementById("detailOverlay");

const detailContent =
    document.getElementById("detailContent");

const detailIcon =
    document.getElementById("detailIcon");

const detailName =
    document.getElementById("detailName");

const detailSymbol =
    document.getElementById("detailSymbol");

const toast =
    document.getElementById("toast");


/* =========================================================
   BACK
========================================================= */

function goBack(){

    if(
        document.referrer &&
        document.referrer.indexOf(
            window.location.origin
        ) === 0
    ){

        window.history.back();

    }
    else{

        window.location.href =
            "index.html";

    }

}


/* =========================================================
   LOAD MARKET
========================================================= */

async function loadMarket(){

    hideError();

    connectionStatus.textContent =
        "Updating";

    statusDot.classList.remove(
        "offline"
    );


    marketList.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading cryptocurrency prices...

        </div>

    `;


    const ids =
        COINS
            .map(
                coin => coin.id
            )
            .join(",");


    const url =
        "https://api.coingecko.com/api/v3/coins/markets" +

        "?vs_currency=eur" +

        "&ids=" +
        encodeURIComponent(ids) +

        "&order=market_cap_desc" +

        "&per_page=10" +

        "&page=1" +

        "&sparkline=false" +

        "&price_change_percentage=24h";


    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Market service returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !Array.isArray(data) ||
            !data.length
        ){

            throw new Error(
                "No market data was returned."
            );

        }


        marketData = {};


        data.forEach(
            coin => {

                marketData[coin.id] =
                    coin;

            }
        );


        renderMarket();


        marketCount.textContent =
            data.length +
            " cryptocurrencies";


        lastUpdated.textContent =
            "Updated: " +
            new Date().toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            );


        connectionStatus.textContent =
            "Live";


    }
    catch(error){

        console.error(
            "Market error:",
            error
        );


        connectionStatus.textContent =
            "Offline";


        statusDot.classList.add(
            "offline"
        );


        marketList.innerHTML = `

            <div class="empty">

                Unable to load cryptocurrency prices.

                <br><br>

                Please check your internet connection
                and try again.

                <br>

                <button
                    type="button"
                    onclick="loadMarket()"
                    style="
                        margin-top:15px;
                        border:0;
                        padding:11px 16px;
                        border-radius:10px;
                        background:#7cb342;
                        color:white;
                        font-weight:700;
                        cursor:pointer;
                    "
                >

                    Try Again

                </button>

            </div>

        `;


        showError(
            "Market data could not be loaded."
        );

    }

}


/* =========================================================
   RENDER MARKET
========================================================= */

function renderMarket(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        COINS.filter(
            coin => {

                const market =
                    marketData[coin.id];


                if(!market){

                    return false;

                }


                if(!query){

                    return true;

                }


                return (

                    coin.name
                        .toLowerCase()
                        .includes(query)

                    ||

                    coin.symbol
                        .toLowerCase()
                        .includes(query)

                );

            }
        );


    if(!filtered.length){

        marketList.innerHTML = `

            <div class="empty">

                No cryptocurrency found.

            </div>

        `;

        return;

    }


    marketList.innerHTML = "";


    filtered.forEach(
        coin => {

            const market =
                marketData[coin.id];


            const price =
                Number(
                    market.current_price || 0
                );


            const change =
                Number(
                    market.price_change_percentage_24h ||
                    0
                );


            const changeClass =
                change >= 0
                    ? "up"
                    : "down";


            const sign =
                change >= 0
                    ? "+"
                    : "";


            const card =
                document.createElement(
                    "button"
                );


            card.type =
                "button";


            card.className =
                "coin-card";


            card.setAttribute(
                "aria-label",
                "Open " +
                coin.name +
                " details"
            );


            card.innerHTML = `

                <div class="coin-icon">

                    ${escapeHtml(coin.icon)}

                </div>


                <div class="coin-info">

                    <div class="coin-name">

                        ${escapeHtml(
                            coin.name
                        )}

                    </div>


                    <div class="coin-symbol">

                        ${escapeHtml(
                            coin.symbol
                        )}

                    </div>

                </div>


                <div class="coin-right">

                    <div class="coin-price">

                        €${formatPrice(
                            price
                        )}

                    </div>


                    <div
                        class="coin-change ${changeClass}"
                    >

                        ${sign}${change.toFixed(2)}%

                    </div>

                </div>


                <div class="coin-arrow">

                    <i class="fas fa-chevron-right"></i>

                </div>

            `;


            card.addEventListener(
                "click",
                function(){

                    openCoinDetails(
                        coin.id
                    );

                }
            );


            marketList.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   OPEN COIN DETAILS
========================================================= */

async function openCoinDetails(
    coinId
){

    const coin =
        COINS.find(
            item =>
                item.id === coinId
        );


    if(!coin){
        return;
    }


    detailRequestId++;

    const requestId =
        detailRequestId;


    detailIcon.textContent =
        coin.icon;


    detailName.textContent =
        coin.name;


    detailSymbol.textContent =
        coin.symbol;


    detailContent.innerHTML = `

        <div class="detail-loading">

            <div class="spinner"></div>

            Loading ${escapeHtml(
                coin.name
            )} details...

        </div>

    `;


    detailOverlay.classList.add(
        "show"
    );


    detailOverlay.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.style.overflow =
        "hidden";


    if(detailCache[coinId]){

        renderCoinDetails(
            detailCache[coinId]
        );

        refreshCoinDetails(
            coinId,
            requestId
        );

        return;

    }


    await refreshCoinDetails(
        coinId,
        requestId
    );

}


/* =========================================================
   LOAD COIN DETAILS
========================================================= */

async function refreshCoinDetails(
    coinId,
    requestId
){

    const url =
        "https://api.coingecko.com/api/v3/coins/" +
        encodeURIComponent(coinId) +

        "?localization=false" +

        "&tickers=false" +

        "&market_data=true" +

        "&community_data=false" +

        "&developer_data=false" +

        "&sparkline=false";


    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Coin details returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            requestId !== detailRequestId
        ){

            return;

        }


        detailCache[coinId] =
            data;


        renderCoinDetails(
            data
        );


    }
    catch(error){

        console.error(
            "Coin details error:",
            error
        );


        if(
            requestId !== detailRequestId
        ){

            return;

        }


        detailContent.innerHTML = `

            <div class="empty">

                Unable to load cryptocurrency details.

                <br><br>

                <button
                    type="button"
                    class="detail-action"
                    onclick="openCoinDetails('${escapeJs(coinId)}')"
                >

                    <i class="fas fa-rotate"></i>

                    Try Again

                </button>

            </div>

        `;

    }

}


/* =========================================================
   RENDER COIN DETAILS
========================================================= */

function renderCoinDetails(
    coin
){

    const market =
        coin.market_data || {};


    const prices =
        market.current_price || {};


    const changes =
        market || {};


    const eurPrice =
        Number(
            prices.eur || 0
        );


    const change24 =
        Number(
            changes.price_change_percentage_24h ||
            0
        );


    const change7 =
        Number(
            changes.price_change_percentage_7d ||
            0
        );


    const change30 =
        Number(
            changes.price_change_percentage_30d ||
            0
        );


    const marketCap =
        Number(
            (market.market_cap || {}).eur ||
            0
        );


    const volume =
        Number(
            (market.total_volume || {}).eur ||
            0
        );


    const high24 =
        Number(
            (market.high_24h || {}).eur ||
            0
        );


    const low24 =
        Number(
            (market.low_24h || {}).eur ||
            0
        );


    const circulating =
        Number(
            market.circulating_supply ||
            0
        );


    const totalSupply =
        Number(
            market.total_supply ||
            0
        );


    const rank =
        coin.market_cap_rank || "--";


    const change24Class =
        change24 >= 0
            ? "detail-up"
            : "detail-down";


    const change24Sign =
        change24 >= 0
            ? "+"
            : "";


    detailContent.innerHTML = `


        <!-- PRICE -->

        <div class="detail-price-card">

            <div class="detail-label">

                Current Price

            </div>


            <div class="detail-price">

                €${formatPrice(
                    eurPrice
                )}

            </div>


            <div
                class="detail-change ${change24Class}"
            >

                24h:
                ${change24Sign}${change24.toFixed(2)}%

            </div>

        </div>


        <!-- PERIOD CHANGES -->

        <div class="stats-grid">


            <div class="stat-card">

                <div class="stat-name">

                    24h Change

                </div>

                <div class="stat-value">

                    ${formatPercent(
                        change24
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">

                    7d Change

                </div>

                <div class="stat-value">

                    ${formatPercent(
                        change7
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">

                    30d Change

                </div>

                <div class="stat-value">

                    ${formatPercent(
                        change30
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">

                    Market Rank

                </div>

                <div class="stat-value">

                    #${escapeHtml(
                        String(rank)
                    )}

                </div>

            </div>


        </div>


        <!-- MARKET DATA -->

        <div class="stats-grid">


            <div class="stat-card">

                <div class="stat-name">

                    Market Cap

                </div>

                <div class="stat-value">

                    €${formatLargeNumber(
                        marketCap
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">

                    24h Volume

                </div>

                <div class="stat-value">

                    €${formatLargeNumber(
                        volume
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">

                    24h High

                </div>

                <div class="stat-value">

                    €${formatPrice(
                        high24
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">

                    24h Low

                </div>

                <div class="stat-value">

                    €${formatPrice(
                        low24
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">

                    Circulating Supply

                </div>

                <div class="stat-value">

                    ${formatLargeNumber(
                        circulating
                    )}

                    ${escapeHtml(
                        coin.symbol ||
                        ""
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">

                    Total Supply

                </div>

                <div class="stat-value">

                    ${
                        totalSupply > 0
                            ? formatLargeNumber(
                                totalSupply
                              ) +
                              " " +
                              escapeHtml(
                                coin.symbol ||
                                ""
                              )
                            : "--"
                    }

                </div>

            </div>


        </div>


        <!-- ACTIONS -->

        <div class="detail-actions">


            <button
                type="button"
                class="detail-action"
                onclick="showToast('Trade is not connected yet.')"
            >

                <i class="fas fa-arrow-right-arrow-left"></i>

                Trade

            </button>


            <button
                type="button"
                class="detail-action secondary"
                onclick="refreshOpenCoin()"
            >

                <i class="fas fa-rotate"></i>

                Refresh

            </button>


        </div>


    `;

}


/* =========================================================
   REFRESH CURRENT COIN
========================================================= */

function refreshOpenCoin(){

    const currentName =
        detailName.textContent;


    const coin =
        COINS.find(
            item =>
                item.name === currentName
        );


    if(!coin){
        return;
    }


    delete detailCache[
        coin.id
    ];


    openCoinDetails(
        coin.id
    );

}


/* =========================================================
   CLOSE DETAILS
========================================================= */

function closeDetails(){

    detailRequestId++;


    detailOverlay.classList.remove(
        "show"
    );


    detailOverlay.setAttribute(
        "aria-hidden",
        "true"
    );


    document.body.style.overflow =
        "";

}


/* =========================================================
   OVERLAY CLICK
========================================================= */

detailOverlay.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            detailOverlay
        ){

            closeDetails();

        }

    }
);


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            detailOverlay.classList.contains(
                "show"
            )
        ){

            closeDetails();

        }

    }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function(){

        renderMarket();

    }
);


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(
    value
){

    const number =
        Number(value || 0);


    if(!Number.isFinite(number)){
        return "0.00";
    }


    if(number >= 1000){

        return number.toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

    }


    if(number >= 1){

        return number.toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:4
            }
        );

    }


    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:8
        }
    );

}


/* =========================================================
   FORMAT LARGE NUMBER
========================================================= */

function formatLargeNumber(
    value
){

    const number =
        Number(value || 0);


    if(
        !Number.isFinite(number) ||
        number <= 0
    ){

        return "--";

    }


    return number.toLocaleString(
        "en-US",
        {
            maximumFractionDigits:2
        }
    );

}


/* =========================================================
   FORMAT PERCENT
========================================================= */

function formatPercent(
    value
){

    const number =
        Number(value || 0);


    if(!Number.isFinite(number)){
        return "--";
    }


    return (
        number >= 0
            ? "+"
            : ""
    ) +
    number.toFixed(2) +
    "%";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE JAVASCRIPT STRING
========================================================= */

function escapeJs(
    value
){

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
){

    errorBox.innerHTML =
        escapeHtml(message) +
        "<br>" +
        "<button type='button' onclick='hideError()'>" +
        "Close" +
        "</button>";


    errorBox.style.display =
        "block";

}


function hideError(){

    errorBox.style.display =
        "none";

}


/* =========================================================
   NAVIGATION
========================================================= */

function navigateTo(
    file
){

    window.location.href =
        file;

}


/* =========================================================
   UNAVAILABLE NAVIGATION
========================================================= */

function showUnavailable(
    name
){

    showToast(
        name +
        " page is not available yet."
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(
    message
){

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
    function(){

        if(
            !detailOverlay.classList.contains(
                "show"
            )
        ){

            loadMarket();

        }

    },
    120000
);


/* =========================================================
   START
========================================================= */

loadMarket();

</script>
