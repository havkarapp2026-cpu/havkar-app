<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR - Market</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
    padding-bottom:90px;
}

button,input,select{
    font:inherit;
}

button{
    border:0;
    -webkit-tap-highlight-color:transparent;
}

button:focus,
input:focus,
select:focus{
    outline:none;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 20px;
    color:#fff;
    background:linear-gradient(135deg,#689f38,#7cb342);
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn,
.refresh-btn,
.close-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.back-btn{
    background:transparent;
    color:#fff;
    font-size:23px;
}

.refresh-btn,
.close-btn{
    background:rgba(255,255,255,.20);
    color:#fff;
    font-size:17px;
}

.header h1{
    font-size:21px;
    font-weight:750;
}

.page{
    padding:20px;
    max-width:900px;
    margin:auto;
}

.summary-card{
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.summary-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.summary-title{
    font-size:15px;
    color:#777;
}

.status{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:#689f38;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#7cb342;
}

.status-dot.offline{
    background:#c62828;
}

.summary-value{
    font-size:28px;
    font-weight:800;
    margin-top:7px;
}

.summary-sub{
    color:#999;
    font-size:12px;
    margin-top:5px;
}

.controls{
    display:grid;
    grid-template-columns:1fr 150px;
    gap:10px;
    margin-bottom:18px;
}

.search-box{
    position:relative;
}

.search-box i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#999;
}

.search-box input{
    width:100%;
    height:50px;
    border:1px solid #e0e0e0;
    background:#fff;
    border-radius:14px;
    padding:0 15px 0 45px;
    font-size:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.search-box input:focus{
    border-color:#7cb342;
}

.currency-select{
    width:100%;
    height:50px;
    border:1px solid #e0e0e0;
    background:#fff;
    border-radius:14px;
    padding:0 12px;
    font-weight:700;
    color:#555;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:4px 0 12px;
}

.section-head h2{
    font-size:20px;
}

.favorite-count{
    color:#689f38;
    font-size:12px;
    font-weight:700;
}

.market-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.coin-card{
    width:100%;
    background:#fff;
    border-radius:17px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:13px;
    box-shadow:0 2px 9px rgba(0,0,0,.06);
    cursor:pointer;
    text-align:left;
    color:#333;
    transition:transform .15s,box-shadow .15s;
}

.coin-card:active{
    transform:scale(.985);
}

.coin-icon{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:50%;
    background:#f1f7eb;
    color:#689f38;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
    overflow:hidden;
}

.coin-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.coin-icon .coin-fallback{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
}

.coin-info{
    flex:1;
    min-width:0;
}

.coin-name{
    font-size:16px;
    font-weight:750;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.coin-symbol{
    color:#999;
    font-size:12px;
    margin-top:4px;
}

.coin-right{
    text-align:right;
    min-width:115px;
}

.coin-price{
    font-size:15px;
    font-weight:750;
    white-space:nowrap;
}

.coin-change{
    margin-top:5px;
    font-size:12px;
    font-weight:700;
}

.up{
    color:#2e7d32;
}

.down{
    color:#c62828;
}

.coin-star{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:50%;
    background:#f5f8f2;
    color:#aaa;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}

.coin-star.active{
    color:#f2b01e;
    background:#fff8df;
}

.favorite-section{
    margin:0 0 22px;
    padding:17px;
    background:#edf6e7;
    border-radius:18px;
    border:1px solid #dcebd3;
}

.favorite-section.hidden{
    display:none;
}

.loading,
.empty{
    background:#fff;
    border-radius:17px;
    padding:30px;
    text-align:center;
    color:#999;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #e5e5e5;
    border-top-color:#7cb342;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.error-box{
    display:none;
    background:#ffebee;
    color:#c62828;
    border-radius:14px;
    padding:15px;
    margin-bottom:15px;
    line-height:1.5;
}

.error-box.show{
    display:block;
}

.error-box button{
    margin-top:10px;
    border-radius:9px;
    padding:9px 13px;
    background:#c62828;
    color:#fff;
    cursor:pointer;
    font-weight:700;
}

.detail-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.42);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:500;
    padding:0;
}

.detail-overlay.show{
    display:flex;
}

.detail-panel{
    width:100%;
    max-width:700px;
    max-height:92vh;
    overflow-y:auto;
    background:#f5f5f5;
    border-radius:24px 24px 0 0;
    box-shadow:0 -10px 35px rgba(0,0,0,.20);
    animation:detailUp .22s ease;
}

@keyframes detailUp{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.detail-header{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    color:#fff;
    background:linear-gradient(135deg,#689f38,#7cb342);
}

.detail-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.detail-title-icon{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.20);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    overflow:hidden;
}

.detail-title-icon img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.detail-title-text{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.detail-title-name{
    font-size:18px;
    font-weight:800;
}

.detail-title-symbol{
    font-size:12px;
    opacity:.85;
}

.detail-content{
    padding:20px;
}

.detail-price-card,
.stat-card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.detail-price-card{
    margin-bottom:15px;
}

.detail-label,
.stat-name{
    color:#999;
    font-size:12px;
    margin-bottom:7px;
}

.detail-price{
    font-size:32px;
    font-weight:850;
    color:#222;
    word-break:break-word;
}

.detail-change{
    margin-top:8px;
    font-size:14px;
    font-weight:750;
}

.detail-up{
    color:#2e7d32;
}

.detail-down{
    color:#c62828;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    margin-bottom:15px;
}

.stat-value{
    color:#333;
    font-size:15px;
    font-weight:750;
    line-height:1.35;
    word-break:break-word;
}

.detail-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.detail-action{
    border-radius:14px;
    padding:14px;
    background:#7cb342;
    color:#fff;
    font-weight:750;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.detail-action.secondary{
    background:#fff;
    color:#689f38;
    border:1px solid #dfead5;
}

.detail-action.favorite-active{
    background:#f2b01e;
    color:#fff;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:75px;
    background:#fff;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -2px 10px rgba(0,0,0,.10);
    z-index:300;
}

.nav-item{
    color:#999;
    text-align:center;
    font-size:12px;
    cursor:pointer;
    min-width:55px;
    user-select:none;
}

.nav-item i{
    display:block;
    font-size:21px;
    margin-bottom:5px;
}

.nav-item.active{
    color:#7cb342;
}

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%) translateY(20px);
    background:#333;
    color:#fff;
    padding:11px 16px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:800;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:560px){

    .controls{
        grid-template-columns:1fr 105px;
    }

    .page{
        padding:15px;
    }

    .detail-content{
        padding:15px;
    }

    .stats-grid{
        gap:9px;
    }

    .detail-action{
        padding:12px 8px;
        font-size:12px;
    }

    .coin-right{
        min-width:105px;
    }

    .coin-price{
        font-size:14px;
    }
}

@media(min-width:700px){

    .detail-overlay{
        align-items:center;
        padding:20px;
    }

    .detail-panel{
        border-radius:24px;
        max-height:90vh;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-left">

        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
            aria-label="Back">

            <i class="fas fa-arrow-left"></i>

        </button>

        <h1>Market</h1>

    </div>

    <button
        class="refresh-btn"
        type="button"
        onclick="loadMarket()"
        aria-label="Refresh market">

        <i class="fas fa-rotate"></i>

    </button>

</header>

<main class="page">

    <div
        id="errorBox"
        class="error-box">
    </div>

    <section class="summary-card">

        <div class="summary-top">

            <div class="summary-title">
                Cryptocurrency Market
            </div>

            <div class="status">

                <span
                    id="statusDot"
                    class="status-dot">
                </span>

                <span id="connectionStatus">
                    Updating
                </span>

            </div>

        </div>

        <div
            id="marketCount"
            class="summary-value">
            --
        </div>

        <div
            id="lastUpdated"
            class="summary-sub">
            Loading market data...

    </section>

    <div class="controls">

        <div class="search-box">

            <i class="fas fa-search"></i>

            <input
                id="searchInput"
                type="search"
                placeholder="Search cryptocurrency..."
                autocomplete="off">

        </div>

        <select
            id="currencySelect"
            class="currency-select"
            aria-label="Currency">

            <option value="eur">
                EUR €
            </option>

            <option value="usd">
                USD $
            </option>

            <option value="sek">
                SEK kr
            </option>

            <option value="gbp">
                GBP £
            </option>

        </select>

    </div>

    <section
        id="favoriteSection"
        class="favorite-section hidden">

        <div class="section-head">

            <h2>
                Favorites
            </h2>

            <span
                id="favoriteCount"
                class="favorite-count">
                0 saved
            </span>

        </div>

        <div
            id="favoriteList"
            class="market-list">
        </div>

    </section>

    <div class="section-head">

        <h2>
            Top Cryptocurrencies
        </h2>

    </div>

    <div
        id="marketList"
        class="market-list">

        <div class="loading">

            <div class="spinner"></div>

            Loading cryptocurrency prices...

        </div>

    </div>

</main>

<div
    id="detailOverlay"
    class="detail-overlay"
    aria-hidden="true">

    <section
        class="detail-panel"
        role="dialog"
        aria-modal="true"
        aria-label="Cryptocurrency details">

        <div class="detail-header">

            <div class="detail-title">

                <div
                    id="detailIcon"
                    class="detail-title-icon">
                    --
                </div>

                <div class="detail-title-text">

                    <div
                        id="detailName"
                        class="detail-title-name">
                        --
                    </div>

                    <div
                        id="detailSymbol"
                        class="detail-title-symbol">
                        --
                    </div>

                </div>

            </div>

            <button
                class="close-btn"
                type="button"
                onclick="closeDetails()"
                aria-label="Close">

                <i class="fas fa-xmark"></i>

            </button>

        </div>

        <div
            id="detailContent"
            class="detail-content">

            <div class="loading">
                Loading...
            </div>

        </div>

    </section>

</div>

<nav class="bottom-nav">

    <div
        class="nav-item"
        onclick="navigateTo('wallet.html')">

        <i class="fas fa-wallet"></i>
        Wallet

    </div>

    <div class="nav-item active">

        <i class="fas fa-chart-line"></i>
        Market

    </div>

    <div
        class="nav-item"
        onclick="navigateTo('trade.html')">

        <i class="fas fa-exchange-alt"></i>
        Trade

    </div>

    <div
        class="nav-item"
        onclick="navigateTo('history.html')">

        <i class="fas fa-history"></i>
        History

    </div>

    <div
        class="nav-item"
        onclick="navigateTo('profile.html')">

        <i class="fas fa-user"></i>
        Profile

    </div>

</nav>

<div
    id="toast"
    class="toast">
</div>

<script>
"use strict";

/* =========================================================
   HAVKAR MARKET
   Live data: CoinGecko public API

   Features:
   - Real cryptocurrency logos from API image URLs
   - Top market list
   - Global cryptocurrency search
   - Search by name, symbol or CoinGecko ID
   - Full live cryptocurrency details
   - EUR / USD / SEK / GBP
   - Favorites saved in browser localStorage
========================================================= */

const API_BASE =
    "https://api.coingecko.com/api/v3";

const TOP_COIN_LIMIT = 50;

const SEARCH_RESULT_LIMIT = 20;

const SEARCH_DELAY = 450;

const FAVORITES_KEY =
    "havkar_market_favorites_v1";

const CURRENCY_KEY =
    "havkar_market_currency_v1";

let marketData = {};

let coinRegistry = {};

let detailCache = {};

let detailRequestId = 0;

let selectedCoinId = null;

let searchTimer = null;

let searchRequestId = 0;

const marketList =
    document.getElementById("marketList");

const favoriteList =
    document.getElementById("favoriteList");

const favoriteSection =
    document.getElementById("favoriteSection");

const favoriteCount =
    document.getElementById("favoriteCount");

const searchInput =
    document.getElementById("searchInput");

const currencySelect =
    document.getElementById("currencySelect");

const marketCount =
    document.getElementById("marketCount");

const lastUpdated =
    document.getElementById("lastUpdated");

const connectionStatus =
    document.getElementById("connectionStatus");

const statusDot =
    document.getElementById("statusDot");

const errorBox =
    document.getElementById("errorBox");

const detailOverlay =
    document.getElementById("detailOverlay");

const detailContent =
    document.getElementById("detailContent");

const detailIcon =
    document.getElementById("detailIcon");

const detailName =
    document.getElementById("detailName");

const detailSymbol =
    document.getElementById("detailSymbol");

const toast =
    document.getElementById("toast");


function getFavorites(){

    try{

        const value =
            JSON.parse(
                localStorage.getItem(
                    FAVORITES_KEY
                ) || "[]"
            );

        return Array.isArray(value)
            ? value
            : [];

    }catch{

        return [];

    }

}


function saveFavorites(list){

    localStorage.setItem(
        FAVORITES_KEY,
        JSON.stringify(
            [...new Set(
                list.filter(Boolean)
            )]
        )
    );

}


function isFavorite(id){

    return getFavorites().includes(id);

}


function toggleFavorite(id,event){

    if(event){
        event.stopPropagation();
    }

    const favorites =
        getFavorites();

    const index =
        favorites.indexOf(id);

    if(index >= 0){

        favorites.splice(index,1);

        showToast(
            "Removed from Favorites"
        );

    }else{

        favorites.push(id);

        showToast(
            "Added to Favorites"
        );

    }

    saveFavorites(favorites);

    renderMarket();

    renderFavorites();

    if(
        selectedCoinId === id &&
        detailOverlay.classList.contains("show")
    ){

        updateDetailFavoriteButton();

    }

}


function getCurrency(){

    return currencySelect.value || "eur";

}


function currencySymbol(){

    return {

        eur:"€",

        usd:"$",

        sek:"kr",

        gbp:"£"

    }[
        getCurrency()
    ] || "€";

}


function formatPrice(value){

    const n =
        Number(value);

    if(!Number.isFinite(n)){
        return "--";
    }

    const digits =
        n >= 1000
            ? 2
            : n >= 1
                ? 4
                : 8;

    return n.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:digits
        }
    );

}


function formatLargeNumber(value){

    const n =
        Number(value);

    if(
        !Number.isFinite(n) ||
        n <= 0
    ){

        return "--";

    }

    return n.toLocaleString(
        "en-US",
        {
            maximumFractionDigits:2
        }
    );

}


function formatPercent(value){

    const n =
        Number(value);

    if(!Number.isFinite(n)){
        return "--";
    }

    return (
        n >= 0
            ? "+"
            : ""
    ) +
    n.toFixed(2) +
    "%";

}


function formatDate(value){

    if(!value){
        return "--";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "--";

    }

    return date.toLocaleString(
        [],
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    );

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(value){

    return String(value ?? "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


function goBack(){

    if(
        document.referrer &&
        document.referrer.indexOf(
            window.location.origin
        ) === 0
    ){

        window.history.back();

    }else{

        window.location.href =
            "index.html";

    }

}


function navigateTo(file){

    window.location.href =
        file;

}


function showToast(message){

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            () =>
                toast.classList.remove(
                    "show"
                ),
            1800
        );

}


function showError(message){

    errorBox.innerHTML =
        escapeHtml(message) +
        "<br><button type=\"button\" onclick=\"hideError()\">Close</button>";

    errorBox.classList.add(
        "show"
    );

}


function hideError(){

    errorBox.textContent =
        "";

    errorBox.classList.remove(
        "show"
    );

}


async function fetchJson(
    url,
    timeoutMs=15000
){

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () =>
                controller.abort(),
            timeoutMs
        );

    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:{
                        Accept:
                            "application/json"
                    },
                    cache:"no-store",
                    signal:
                        controller.signal
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        return await response.json();

    }finally{

        clearTimeout(timeout);

    }

}


function normalizeCoin(coin){

    if(
        !coin ||
        !coin.id
    ){

        return null;

    }

    const existing =
        coinRegistry[coin.id] ||
        {};

    const normalized = {

        id:
            String(
                coin.id
            ),

        name:
            String(
                coin.name ||
                existing.name ||
                coin.id
            ),

        symbol:
            String(
                coin.symbol ||
                existing.symbol ||
                ""
            ).toUpperCase(),

        image:
            coin.image ||
            coin.large ||
            coin.thumb ||
            existing.image ||
            "",

        icon:
            coin.icon ||
            existing.icon ||
            String(
                coin.symbol ||
                "?"
            )
            .slice(0,1)
            .toUpperCase()

    };

    coinRegistry[
        normalized.id
    ] =
        normalized;

    return normalized;

}


function registerMarketCoin(market){

    if(
        !market ||
        !market.id
    ){

        return null;

    }

    const coin =
        normalizeCoin(
            {
                id:
                    market.id,

                name:
                    market.name,

                symbol:
                    market.symbol,

                image:
                    market.image
            }
        );

    marketData[
        market.id
    ] =
        market;

    return coin;

}


function logoHtml(
    coin,
    market,
    sizeClass=""
){

    const image =
        market?.image ||
        coin?.image ||
        "";

    const fallback =
        escapeHtml(
            (
                coin?.symbol ||
                coin?.name ||
                "?"
            )
            .slice(0,3)
            .toUpperCase()
        );

    if(!image){

        return `
            <span class="coin-fallback">
                ${fallback}
            </span>
        `;

    }

    return `
        <img
            class="${sizeClass}"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(
                coin?.name ||
                "Cryptocurrency"
            )} logo"
            loading="lazy"
            referrerpolicy="no-referrer"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">

        <span
            class="coin-fallback"
            style="display:none">
            ${fallback}
        </span>
    `;

}

function coinMatchesQuery(
    coin,
    query
){

    if(!query){
        return true;
    }

    const name =
        String(
            coin.name || ""
        ).toLowerCase();

    const symbol =
        String(
            coin.symbol || ""
        ).toLowerCase();

    const id =
        String(
            coin.id || ""
        ).toLowerCase();

    return (
        name.includes(query) ||
        symbol.includes(query) ||
        id.includes(query)
    );

}

function renderMarket(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();

    const allCoins =
        Object.values(
            coinRegistry
        )
        .filter(
            coin =>
                marketData[
                    coin.id
                ]
        )
        .filter(
            coin =>
                coinMatchesQuery(
                    coin,
                    query
                )
        );

    marketList.innerHTML =
        "";

    if(!allCoins.length){

        marketList.innerHTML = `

            <div class="empty">

                No cryptocurrency found.

                <br><br>

                Type a cryptocurrency name
                or symbol to search the
                global market.

            </div>

        `;

        return;

    }

    allCoins.forEach(
        coin => {

            const card =
                createCoinCard(
                    coin
                );

            if(card){

                marketList.appendChild(
                    card
                );

            }

        }
    );

}


function renderFavorites(){

    const favorites =
        getFavorites();

    const available =
        favorites
            .map(
                id =>
                    coinRegistry[id]
            )
            .filter(Boolean)
            .filter(
                coin =>
                    marketData[
                        coin.id

            );

            "hidden"

    );

    available.forEach(

                createCoinCard(

                );

            if(card){

                favoriteList.appendChild(
                    card
                );

            }

        }
    );

}


async function searchGlobalCoins(query){

    const requestId =
        ++searchRequestId;

    const cleanQuery =
        query.trim();

    if(
        cleanQuery.length < 2
    ){

        renderMarket();

        return;

    }

    connectionStatus.textContent =
        "Searching";

    statusDot.classList.remove(
        "offline"
    );

    setLoading(
        "Searching global cryptocurrency market..."
    );

    try{

        const searchUrl =
            API_BASE +
            "/search?query=" +
            encodeURIComponent(
                cleanQuery
            );

        const searchData =
            await fetchJson(
                searchUrl
            );

        if(
            requestId !==
            searchRequestId
        ){

            return;

        }

        const searchCoins =
            Array.isArray(
                searchData?.coins
            )
                ? searchData.coins.slice(
                    0,
                    SEARCH_RESULT_LIMIT
                )
                : [];

        if(
            !searchCoins.length
        ){

            marketList.innerHTML = `

                <div class="empty">

                    No cryptocurrency found for

                    <strong>
                        ${escapeHtml(
                            cleanQuery
                        )}
                    </strong>.

                </div>

            `;

            marketCount.textContent =
                "0 cryptocurrencies";

            connectionStatus.textContent =
                "Live";

            return;

        }

        searchCoins.forEach(
            normalizeCoin
        );

        const ids =
            searchCoins
                .map(
                    coin =>
                        coin.id
                )
                .filter(Boolean)
                .join(",");

        const marketUrl =
            API_BASE +
            "/coins/markets" +

            "?vs_currency=" +
            encodeURIComponent(
                getCurrency()
            ) +

            "&ids=" +
            encodeURIComponent(
                ids
            ) +

            "&order=market_cap_desc" +

            "&per_page=" +
            SEARCH_RESULT_LIMIT +

            "&page=1" +

            "&sparkline=false" +

            "&price_change_percentage=24h,7d,30d";

        const data =
            await fetchJson(
                marketUrl
            );

        if(
            requestId !==
            searchRequestId
        ){

            return;

        }

        if(
            !Array.isArray(data) ||
            !data.length
        ){

            throw new Error(
                "No market data returned for search."
            );

        }

        data.forEach(
            registerMarketCoin
        );

        const searchIds =
            new Set(
                data.map(
                    coin =>
                        coin.id
                )
            );

        const results =
            searchCoins
                .map(
                    coin =>
                        coinRegistry[
                            coin.id
                        ]
                )
                .filter(
                    coin =>
                        coin &&
                        searchIds.has(
                            coin.id
                        )
                );

        marketList.innerHTML =
            "";

        results.forEach(
            coin => {

                const card =
                    createCoinCard(
                        coin
                    );

                if(card){

                    marketList.appendChild(
                        card
                    );

                }

            }
        );

        marketCount.textContent =
            results.length +
            " search results";

        lastUpdated.textContent =
            "Live search: " +
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit",
                        second:"2-digit"
                    }
                );

        connectionStatus.textContent =
            "Live";

        statusDot.classList.remove(
            "offline"
        );

    }catch(error){

        if(
            requestId !==
            searchRequestId
        ){

            return;

        }

        console.error(
            "Global cryptocurrency search error:",
            error
        );

        connectionStatus.textContent =
            "Live";

        marketList.innerHTML = `

            <div class="empty">

                Search could not be completed.

                <br><br>

                Please try again in a moment.

            </div>

        `;

    }

}


function scheduleSearch(){

    clearTimeout(
        searchTimer
    );

    const query =
        searchInput.value.trim();

    if(
        query.length < 2
    ){

        searchRequestId++;

        renderMarket();

        marketCount.textContent =
            Object.values(
                marketData
            ).length +
            " top cryptocurrencies";

        return;

    }

    searchTimer =
        setTimeout(
            () =>
                searchGlobalCoins(
                    query
                ),
            SEARCH_DELAY
        );

}

    coinId
){

    const coin =

            coinId

    if(!coin){
        return;
    }

    selectedCoinId =
        coinId;

    detailRequestId++;

    const requestId =
        detailRequestId;

    const market =
        marketData[
            coinId
        ] || {};

    detailIcon.innerHTML =
        logoHtml(
            coin,
            market
        );

    detailName.textContent =
        coin.name;

    detailSymbol.textContent =
        coin.symbol;

    detailContent.innerHTML = `

        <div class="loading">

            Loading
            ${escapeHtml(
                coin.name
            )}
            details...

        </div>

    `;

    detailOverlay.classList.add(
        "show"
    );

    detailOverlay.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.style.overflow =
        "hidden";

    if(
        detailCache[coinId]
    ){

        renderCoinDetails(
            detailCache[
                coinId
            ]
        );

        refreshCoinDetails(

            requestId
        );

        return;

    }

    await refreshCoinDetails(
        coinId,
        requestId
    );

}


async function refreshCoinDetails(
    coinId,
    requestId
){

    const coin =
        coinRegistry[
            coinId
        ];

    const url =
        API_BASE +
        "/coins/" +
        encodeURIComponent(
            coinId
        ) +

        "?localization=false" +

        "&tickers=false" +

        "&market_data=true" +

        "&community_data=false" +

        "&developer_data=false" +

        "&sparkline=false";

    try{

        const data =
            await fetchJson(
                url
            );

        if(
            requestId !==
            detailRequestId
        ){

            return;

        }

        detailCache[
            coinId
        ] =
            data;

        if(
            data.image?.large ||
            data.image?.small
        ){

            coin.image =
                data.image.large ||
                data.image.small;

            coinRegistry[
                coinId
            ] =
                coin;

            detailIcon.innerHTML =
                logoHtml(
                    coin,
                    data
                );

        }

        renderCoinDetails(
            data
        );

    }catch(error){

        console.error(
            "Coin details error:",
            error
        );

        if(
            requestId !==
            detailRequestId
        ){

            return;

        }

        const market =
            marketData[
                coinId
            ];

        if(market){

            renderCoinDetailsFromMarket(
                coin,
                market
            );

            return;

        }

        detailContent.innerHTML = `

            <div class="empty">

                Unable to load
                cryptocurrency details.

                <br><br>

                <button
                    type="button"
                    class="detail-action"
                    onclick="openCoinDetails('${escapeJs(coinId)}')">

                    <i class="fas fa-rotate"></i>

                    Try Again

                </button>

            </div>

        `;

    }

}

        Number(
            (
                market.ath ||
                {}
            )[currency] ||
            0
        );

    const athChange =
        Number(
            (
                market.ath_change_percentage ||
                {}
            )[currency] ||
            0
        );

    const atl =
        Number(
            (
                market.atl ||
                {}
            )[currency] ||
            0
        );

    const atlChange =
        Number(
            (
                market.atl_change_percentage ||
                {}
            )[currency] ||
            0
        );

    const circulating =
        Number(
            market.circulating_supply ||
            0
        );

    const totalSupply =
        Number(
            market.total_supply ||
            0
        );

    const maxSupply =
        Number(
            market.max_supply ||
            0
        );

    const rank =
        coin.market_cap_rank ||
        "--";

    const homepage =
        Array.isArray(
            coin.links?.homepage
        )
            ? coin.links.homepage.find(
                Boolean
            )
            : "";

    const descriptionRaw =
        coin.description?.en ||
        coin.description?.[
            Object.keys(
                coin.description || {}
            )[0]
        ] ||
        "";

    const description =
        descriptionRaw
            .replace(
                /<[^>]*>/g,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();

    const favorite =
        isFavorite(
            coin.id
        );

    detailContent.innerHTML = `

        <div class="detail-price-card">

            <div class="detail-label">
                Current Price
            </div>

            <div class="detail-price">

                ${currencySymbol()}
                ${formatPrice(
                    currentPrice
                )}

            </div>

            <div
                class="detail-change ${
                    change24 >= 0
                        ? "detail-up"
                        : "detail-down"
                }">

                24h:
                ${formatPercent(
                    change24
                )}

            </div>

        </div>

        <div class="stats-grid">

            ${statCard(
                "24h Change",
                formatPercent(change24)
            )}

            ${statCard(
                "7d Change",
                formatPercent(change7)
            )}

            ${statCard(
                "30d Change",
                formatPercent(change30)
            )}

            ${statCard(
                "Market Rank",
                "#" +
                escapeHtml(
                    String(rank)
                )
            )}

        </div>

        <div class="stats-grid">

            ${statCard(
                "Market Cap",
                currencySymbol() +
                formatLargeNumber(
                    marketCap
                )
            )}

            ${statCard(
                "24h Volume",
                currencySymbol() +
                formatLargeNumber(
                    volume
                )
            )}

            ${statCard(
                "24h High",
                currencySymbol() +
                formatPrice(
                    high24
                )
            )}

            ${statCard(
                "24h Low",
                currencySymbol() +
                formatPrice(
                    low24
                )
            )}

            ${statCard(
                "Circulating Supply",
                formatLargeNumber(
                    circulating
                ) +
                " " +
                escapeHtml(
                    coin.symbol ||
                    ""
                )
            )}

            ${statCard(
                "Total Supply",
                totalSupply > 0
                    ? formatLargeNumber(
                        totalSupply
                    ) +
                    " " +
                    escapeHtml(
                        coin.symbol ||
                        ""
                    )
                    : "--"
            )}

            ${statCard(
                "Max Supply",
                maxSupply > 0
                    ? formatLargeNumber(
                        maxSupply
                    ) +
                    " " +
                    escapeHtml(
                        coin.symbol ||
                        ""
                    )
                    : "∞ / Unknown"
            )}

            ${statCard(
                "All-Time High",
                currencySymbol() +
                formatPrice(
                    ath
                )
            )}

            ${statCard(
                "ATH Change",
                formatPercent(
                    athChange
                )
            )}

            ${statCard(
                "All-Time Low",
                currencySymbol() +
                formatPrice(
                    atl
                )
            )}

            ${statCard(
                "ATL Change",
                formatPercent(
                    atlChange
                )
            )}

            ${statCard(
                "ATH Date",
                formatDate(
                    (
                        market.ath_date ||
                        {}
                    )[currency]
                )
            )}

            ${statCard(
                "ATL Date",
                formatDate(
                    (
                        market.atl_date ||
                        {}
                    )[currency]
                )
            )}

            ${statCard(
                "Data Currency",
                escapeHtml(
                    currency.toUpperCase()
                )
            )}

        </div>

        ${
            description
                ? `
                    <div class="detail-price-card">

                        <div class="detail-label">
                            About
                            ${escapeHtml(
                                coin.name
                            )}
                        </div>

                        <div
                            style="
                                font-size:13px;
                                line-height:1.65;
                                color:#555
                            ">

                            ${escapeHtml(
                                description.slice(
                                    0,
                                    1200
                                )
                            )}

                            ${
                                description.length >
                                1200
                                    ? "…"
                                    : ""
                            }

                        </div>

                    </div>
                `
                : ""
        }

        <div class="detail-actions">

            <button
                id="detailFavoriteButton"
                type="button"
                class="detail-action ${
                    favorite
                        ? "favorite-active"
                        : ""
                }"
                onclick="toggleFavorite('${escapeJs(coin.id)}')">

                <i class="fas fa-star"></i>

                ${
                    favorite
                        ? "Favorited"
                        : "Favorite"
                }

            </button>

            <button
                type="button"
                class="detail-action secondary"
                onclick="refreshOpenCoin()">

                <i class="fas fa-rotate"></i>

                Refresh

            </button>

            ${
                homepage
                    ? `
                        <button
                            type="button"
                            class="detail-action secondary"
                            onclick="openOfficialSite('${escapeJs(homepage)}')">

                            <i class="fas fa-globe"></i>

                            Website

                        </button>
                    `
                    : `
                        <button
                            type="button"
                            class="detail-action secondary"
                            onclick="showToast('Official website is not available.')">

                            <i class="fas fa-globe"></i>

                            Website

                        </button>
                    `
            }

        </div>

    `;

}


function openOfficialSite(
    url
){

    try{

        const parsed =
            new URL(url);

        if(
            parsed.protocol ===
                "http:" ||
            parsed.protocol ===
                "https:"
        ){

            window.open(
                parsed.href,
                "_blank",
                "noopener,noreferrer"
            );

        }

    }catch{

        showToast(
            "Invalid website address."
        );

    }

}


function updateDetailFavoriteButton(){

    const button =
        document.getElementById(
            "detailFavoriteButton"
        );

    if(
        !button ||
        !selectedCoinId
    ){

        return;

    }

    const active =
        isFavorite(
            selectedCoinId
        );

    button.className =
        "detail-action" +
        (
            active
                ? " favorite-active"
                : ""
        );

    button.innerHTML =
        '<i class="fas fa-star"></i> ' +
        (
            active
                ? "Favorited"
                : "Favorite"
        );

}


function refreshOpenCoin(){

    if(!selectedCoinId){
        return;
    }

    delete detailCache[
        selectedCoinId
    ];

    openCoinDetails(
        selectedCoinId
    );

}


function closeDetails(){

    detailRequestId++;

    selectedCoinId =
        null;

    detailOverlay.classList.remove(
        "show"
    );

    detailOverlay.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.style.overflow =
        "";

}


detailOverlay.addEventListener(
    "click",
    (event) => {

        if(
            event.target ===
            detailOverlay
        ){

            closeDetails();

        }

    }
);


document.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Escape" &&
            detailOverlay.classList.contains(
                "show"
            )
        ){

            closeDetails();

        }

    }
);


searchInput.addEventListener(
    "input",
    scheduleSearch
);


currencySelect.addEventListener(
    "change",
    () => {

        localStorage.setItem(
            CURRENCY_KEY,
            currencySelect.value
        );

        detailCache = {};

        if(
            searchInput.value
                .trim()
                .length >= 2
        ){

            searchGlobalCoins(
                searchInput.value.trim()
            );

        }else{

            loadMarket();

        }

    }
);


try{

    const savedCurrency =
        localStorage.getItem(
            CURRENCY_KEY
        );

    if(
        [
            "eur",
            "usd",
            "sek",
            "gbp"
        ].includes(
            savedCurrency
        )
    ){

        currencySelect.value =
            savedCurrency;

    }

}catch{}


loadMarket();

</script>

</body>
</html>
