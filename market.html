<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f5f5f5;color:#333;padding-bottom:90px;
}
button,input,select{font:inherit}
button{border:0;-webkit-tap-highlight-color:transparent}
button:focus,input:focus,select:focus{outline:none}

.header{
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:15px 20px;color:#fff;
    background:linear-gradient(135deg,#689f38,#7cb342);
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.header-left{display:flex;align-items:center;gap:15px}
.back-btn,.refresh-btn,.close-btn{
    width:40px;height:40px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
}
.back-btn{background:transparent;color:#fff;font-size:23px}
.refresh-btn,.close-btn{background:rgba(255,255,255,.20);color:#fff;font-size:17px}
.header h1{font-size:21px;font-weight:750}

.page{padding:20px;max-width:900px;margin:auto}

.summary-card{
    background:#fff;border-radius:20px;padding:20px;margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}
.summary-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.summary-title{font-size:15px;color:#777}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:#689f38}
.status-dot{width:8px;height:8px;border-radius:50%;background:#7cb342}
.status-dot.offline{background:#c62828}
.summary-value{font-size:28px;font-weight:800;margin-top:7px}
.summary-sub{color:#999;font-size:12px;margin-top:5px}

.controls{
    display:grid;grid-template-columns:1fr 150px;gap:10px;margin-bottom:18px;
}
.search-box{position:relative}
.search-box i{
    position:absolute;left:15px;top:50%;
    transform:translateY(-50%);color:#999
}
.search-box input{
    width:100%;height:50px;border:1px solid #e0e0e0;background:#fff;
    border-radius:14px;padding:0 15px 0 45px;font-size:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.currency-select{
    width:100%;height:50px;border:1px solid #e0e0e0;background:#fff;
    border-radius:14px;padding:0 12px;font-weight:700;color:#555;
}

.section-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin:4px 0 12px;
}
.section-head h2{font-size:20px}
.favorite-count{
    color:#689f38;font-size:12px;font-weight:700;
}
.market-list{display:flex;flex-direction:column;gap:12px}

.coin-card{
    width:100%;background:#fff;border-radius:17px;padding:15px;
    display:flex;align-items:center;gap:13px;
    box-shadow:0 2px 9px rgba(0,0,0,.06);
    cursor:pointer;text-align:left;color:#333;
    transition:transform .15s,box-shadow .15s;
}
.coin-card:active{transform:scale(.985)}
.coin-icon{
    width:48px;height:48px;min-width:48px;border-radius:50%;
    background:#f1f7eb;color:#689f38;display:flex;
    align-items:center;justify-content:center;font-size:20px;font-weight:800;
}
.coin-info{flex:1;min-width:0}
.coin-name{
    font-size:16px;font-weight:750;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.coin-symbol{color:#999;font-size:12px;margin-top:4px}
.coin-right{text-align:right;min-width:115px}
.coin-price{font-size:15px;font-weight:750;white-space:nowrap}
.coin-change{margin-top:5px;font-size:12px;font-weight:700}
.up{color:#2e7d32}
.down{color:#c62828}
.coin-star{
    width:36px;height:36px;min-width:36px;border-radius:50%;
    background:#f5f8f2;color:#aaa;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:16px;
}
.coin-star.active{color:#f2b01e;background:#fff8df}

.favorite-section{
    margin:0 0 22px;padding:17px;background:#edf6e7;
    border-radius:18px;border:1px solid #dcebd3;
}
.favorite-section.hidden{display:none}

.loading,.empty{
    background:#fff;border-radius:17px;padding:30px;
    text-align:center;color:#999;
}
.spinner{
    width:30px;height:30px;border:3px solid #e5e5e5;
    border-top-color:#7cb342;border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.error-box{
    display:none;background:#ffebee;color:#c62828;
    border-radius:14px;padding:15px;margin-bottom:15px;line-height:1.5;
}
.error-box.show{display:block}
.error-box button{
    margin-top:10px;border-radius:9px;padding:9px 13px;
    background:#c62828;color:#fff;cursor:pointer;font-weight:700;
}

.detail-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.42);
    display:none;align-items:flex-end;justify-content:center;
    z-index:500;padding:0;
}
.detail-overlay.show{display:flex}
.detail-panel{
    width:100%;max-width:700px;max-height:92vh;overflow-y:auto;
    background:#f5f5f5;border-radius:24px 24px 0 0;
    box-shadow:0 -10px 35px rgba(0,0,0,.20);
    animation:detailUp .22s ease;
}
@keyframes detailUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.detail-header{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;color:#fff;
    background:linear-gradient(135deg,#689f38,#7cb342);
}
.detail-title{display:flex;align-items:center;gap:12px}
.detail-title-icon{
    width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,.20);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
}
.detail-title-text{
    display:flex;flex-direction:column;gap:2px
}
.detail-title-name{font-size:18px;font-weight:800}
.detail-title-symbol{font-size:12px;opacity:.85}

.detail-content{padding:20px}
.detail-price-card,.stat-card{
    background:#fff;border-radius:18px;padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}
.detail-price-card{margin-bottom:15px}
.detail-label,.stat-name{
    color:#999;font-size:12px;margin-bottom:7px
}
.detail-price{
    font-size:32px;font-weight:850;color:#222;word-break:break-word
}
.detail-change{margin-top:8px;font-size:14px;font-weight:750}
.detail-up{color:#2e7d32}
.detail-down{color:#c62828}

.stats-grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;margin-bottom:15px;
}
.stat-value{
    color:#333;font-size:15px;font-weight:750;
    line-height:1.35;word-break:break-word
}

.detail-actions{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px
}
.detail-action{
    border-radius:14px;padding:14px;background:#7cb342;color:#fff;
    font-weight:750;cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:8px;
}
.detail-action.secondary{
    background:#fff;color:#689f38;border:1px solid #dfead5
}
.detail-action.favorite-active{background:#f2b01e;color:#fff}

.bottom-nav{
    position:fixed;left:0;right:0;bottom:0;height:75px;background:#fff;
    display:flex;justify-content:space-around;align-items:center;
    box-shadow:0 -2px 10px rgba(0,0,0,.10);z-index:300;
}
.nav-item{
    color:#999;text-align:center;font-size:12px;cursor:pointer;

}
.nav-item i{
    display:block;font-size:21px;margin-bottom:5px
}
.nav-item.active{color:#7cb342}

.toast{
    position:fixed;left:50%;bottom:95px;
    transform:translateX(-50%) translateY(20px);
    background:#333;color:#fff;padding:11px 16px;border-radius:12px;
    font-size:13px;opacity:0;pointer-events:none;
    transition:.2s;z-index:800;
}
.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0)

    .page{padding:15px}
    .detail-content{padding:15px}
    .stats-grid{gap:9px}
    .detail-action{padding:12px 8px;font-size:12px}
}
@media(min-width:700px){
    .detail-overlay{align-items:center;padding:20px}
    .detail-panel{border-radius:24px;max-height:90vh}
}

const FAVORITES_KEY =

function getFavorites(){

    try{

        const value =
            JSON.parse(
                localStorage.getItem(FAVORITES_KEY) || "[]"
            );

        return Array.isArray(value)
            ? value
            : [];

    }catch{

        return [];

    }

}


function saveFavorites(list){

    localStorage.setItem(
        FAVORITES_KEY,
        JSON.stringify([...new Set(list)])
    );

}


function isFavorite(id){

    return getFavorites().includes(id);

}


function toggleFavorite(id,event){

    if(event){
        event.stopPropagation();
    }

    const favorites =
        getFavorites();

    const index =
        favorites.indexOf(id);

    if(index >= 0){

        favorites.splice(index,1);

        showToast(
            "Removed from Favorites"
        );

    }else{

        favorites.push(id);

        showToast(
            "Added to Favorites"
        );

    }

    saveFavorites(favorites);

    renderMarket();

    renderFavorites();

    if(
        selectedCoinId === id &&
        detailOverlay.classList.contains("show")
    ){

        updateDetailFavoriteButton();

    }

}


function getCurrency(){

    return currencySelect.value || "eur";

}


function currencySymbol(){

    return {

        eur:"€",
        usd:"$",
        sek:"kr",
        gbp:"£"

    }[getCurrency()] || "€";

}


function formatPrice(value){

    const n = Number(value);

    if(!Number.isFinite(n)){
        return "--";
    }

    const digits =
        n >= 1000
            ? 2
            : n >= 1
                ? 4
                : 8;

    return n.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:
                n >= 1000 ? 2 : 2,

            maximumFractionDigits:
                digits
        }
    );

}


function formatLargeNumber(value){

    const n = Number(value);

    if(
        !Number.isFinite(n) ||
        n <= 0
    ){

        return "--";

    }

    return n.toLocaleString(
        "en-US",
        {
            maximumFractionDigits:2
        }
    );

}


function formatPercent(value){

    const n = Number(value);

    if(!Number.isFinite(n)){
        return "--";
    }

    return (
        n >= 0 ? "+" : ""
    ) + n.toFixed(2) + "%";

}


function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(value){

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


function goBack(){

    if(
        document.referrer &&
        document.referrer.indexOf(
            window.location.origin
        ) === 0
    ){

        window.history.back();

    }else{

        window.location.href =
            "index.html";

    }

}


function navigateTo(file){

    window.location.href = file;

}


function showToast(message){

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            () =>
                toast.classList.remove("show"),
            1800
        );

}


function showError(message){

    errorBox.textContent =
        message;

    errorBox.classList.add("show");

}


function hideError(){

    errorBox.textContent =
        "";

    errorBox.classList.remove(
        "show"
    );

}


/*
    Generic JSON loader.

    Adds:
    - timeout protection
    - clean HTTP error handling
    - JSON validation
    - no-cache request
*/
async function fetchJson(
    url,
    options = {},
    timeoutMs = 12000
){

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () =>
                controller.abort(),
            timeoutMs
        );

    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    ...options,

                    signal:
                        controller.signal,

                    cache:"no-store",

                    headers:{
                        Accept:
                            "application/json",

                        ...(options.headers || {})
                    }
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        return await response.json();

    }finally{

        clearTimeout(timer);

    }

}


/*
    Fallback market builder.

    If /coins/markets is temporarily
    unavailable, /simple/price can still
    provide live prices and 24h changes.
*/
function buildFallbackMarketData(
    simpleData
){

    const result = {};

    const currency =
        getCurrency();

    COINS.forEach(
        coin => {

            const item =
                simpleData &&
                simpleData[coin.id];

            if(
                !item ||
                typeof item !== "object"
            ){

                return;

            }

            const price =
                Number(
                    item[currency]
                );

            const change =
                Number(
                    item[
                        currency +
                        "_24h_change"
                    ]
                );

            if(!Number.isFinite(price)){
                return;
            }

            result[coin.id] = {

                id:coin.id,

                name:coin.name,

                symbol:
                    coin.symbol.toLowerCase(),

                current_price:
                    price,

                price_change_percentage_24h:
                    Number.isFinite(change)
                        ? change
                        : 0,

                market_cap:0,

                total_volume:0,

                market_cap_rank:"--",

                circulating_supply:0,

                total_supply:null,

                high_24h:0,

                low_24h:0

            };

        }
    );

    return result;

}


async function loadMarket(){

    hideError();

    connectionStatus.textContent =
        "Updating";

    statusDot.classList.remove(
        "offline"
    );

    marketList.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading cryptocurrency prices...

        </div>

    `;

    const ids =
        COINS
            .map(c => c.id)
            .join(",");

    const currency =
        getCurrency();


    /*
        Primary CoinGecko market endpoint.
    */
    const marketsUrl =

        "https://api.coingecko.com/api/v3/coins/markets" +

        "?vs_currency=" +
        encodeURIComponent(currency) +

        "&ids=" +
        encodeURIComponent(ids) +

        "&order=market_cap_desc" +

        "&per_page=" +
        COINS.length +

        "&page=1" +

        "&sparkline=false" +

        "&price_change_percentage=24h";


    /*
        Fallback endpoint.

        This endpoint is lighter and is useful
        when the larger market request is
        temporarily limited.
    */
    const simplePriceUrl =

        "https://api.coingecko.com/api/v3/simple/price" +

        "?ids=" +
        encodeURIComponent(ids) +

        "&vs_currencies=" +
        encodeURIComponent(currency) +

        "&include_24hr_change=true";


    try{

        let data;

        let source =
            "market";


        /*
            First attempt:
            full market data.
        */
        try{

            data =
                await fetchJson(
                    marketsUrl
                );

            if(
                !Array.isArray(data) ||
                !data.length
            ){

                throw new Error(
                    "No market data returned."
                );

            }

        }catch(primaryError){

            console.warn(
                "HAVKAR Market primary endpoint failed:",
                primaryError
            );

            source =
                "simple-price";


            /*
                Second attempt:
                lighter price endpoint.
            */
            const simpleData =
                await fetchJson(
                    simplePriceUrl
                );


            const fallback =
                buildFallbackMarketData(
                    simpleData
                );


            data =
                Object.values(
                    fallback
                );


            if(!data.length){

                throw primaryError;

            }

        }


        marketData = {};


        data.forEach(
            coin => {

                marketData[
                    coin.id
                ] = coin;

            }
        );


        detailCache = {};


        renderMarket();

        renderFavorites();


        marketCount.textContent =
            data.length +
            " cryptocurrencies";


        lastUpdated.textContent =

            "Updated: " +

            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit",
                        second:"2-digit"
                    }
                ) +

            (
                source === "simple-price"
                    ? " • Price feed fallback"
                    : ""
            );


        connectionStatus.textContent =
            "Live";

        statusDot.classList.remove(
            "offline"
        );


    }catch(error){

        console.error(
            "HAVKAR Market error:",
            error
        );


        connectionStatus.textContent =
            "Offline";

        statusDot.classList.add(
            "offline"
        );


        marketList.innerHTML = `

            <div class="empty">

                Unable to load cryptocurrency prices.

                <br><br>

                CoinGecko did not return market data.

                <br>

                <button
                    type="button"
                    onclick="loadMarket()"
                    style="
                        margin-top:15px;
                        border:0;
                        padding:11px 16px;
                        border-radius:10px;
                        background:#7cb342;
                        color:white;
                        font-weight:700;
                        cursor:pointer
                    "
                >
                    Try Again
                </button>

            </div>

        `;


        showError(
            "Market data could not be loaded."
        );

    }

}


function coinMatchesQuery(
    coin,
    query
){

    if(!query){
        return true;
    }

    return (

        coin.name
            .toLowerCase()
            .includes(query)

        ||

        coin.symbol
            .toLowerCase()
            .includes(query)

    );

}


function createCoinCard(coin){

    const market =
        marketData[coin.id];

    if(!market){
        return null;
    }


    const price =
        Number(
            market.current_price || 0
        );


    const change =
        Number(
            market.price_change_percentage_24h ||
            0
        );


    const favorite =
        isFavorite(coin.id);


    const card =
        document.createElement("div");


    card.className =
        "coin-card";


    card.setAttribute(
        "role",
        "button"
    );


    card.setAttribute(
        "tabindex",
        "0"
    );


    card.setAttribute(
        "aria-label",
        "Open " +
        coin.name +
        " details"
    );


    card.innerHTML = `

        <div class="coin-icon">

            ${escapeHtml(coin.icon)}

        </div>


        <div class="coin-info">

            <div class="coin-name">

                ${escapeHtml(coin.name)}

            </div>

            <div class="coin-symbol">

                ${escapeHtml(coin.symbol)}

            </div>

        </div>


        <div class="coin-right">

            <div class="coin-price">

                ${currencySymbol()}
                ${formatPrice(price)}

            </div>

            <div
                class="coin-change ${
                    change >= 0
                        ? "up"
                        : "down"
                }"
            >

                ${
                    change >= 0
                        ? "+"
                        : ""
                }${change.toFixed(2)}%

            </div>

        </div>


        <button
            type="button"
            class="coin-star ${
                favorite
                    ? "active"
                    : ""
            }"
            title="${
                favorite
                    ? "Remove from Favorites"
                    : "Add to Favorites"
            }"
            aria-label="${
                favorite
                    ? "Remove from Favorites"
                    : "Add to Favorites"
            }"
        >

            <i class="fa${
                favorite
                    ? "s"
                    : "r"
            } fa-star"></i>

        </button>

    `;


    card.addEventListener(
        "click",
        () =>
            openCoinDetails(
                coin.id
            )
    );


    card.addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                openCoinDetails(
                    coin.id
                );

            }

        }
    );


    const star =
        card.querySelector(
            ".coin-star"
        );


    star.addEventListener(
        "click",
        event =>
            toggleFavorite(
                coin.id,
                event
            )
    );


    return card;

}


function renderMarket(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        COINS.filter(
            coin =>
                marketData[coin.id] &&
                coinMatchesQuery(
                    coin,
                    query
                )
        );


    marketList.innerHTML =
        "";


    if(!filtered.length){

        marketList.innerHTML =
            `<div class="empty">
                No cryptocurrency found.
            </div>`;

        return;

    }


    filtered.forEach(
        coin => {

            const card =
                createCoinCard(
                    coin
                );

            if(card){

                marketList.appendChild(
                    card
                );

            }

        }
    );

}


function renderFavorites(){

    const favorites =
        getFavorites();


    const available =
        favorites

            .map(
                id =>
                    COINS.find(
                        c =>
                            c.id === id
                    )
            )

            .filter(Boolean)

            .filter(
                c =>
                    marketData[c.id]
            );


    favoriteList.innerHTML =
        "";


    favoriteCount.textContent =
        available.length +
        " saved";


    if(!available.length){

        favoriteSection.classList.add(
            "hidden"
        );

        return;

    }


    favoriteSection.classList.remove(
        "hidden"
    );


    available.forEach(
        coin => {

            const card =
                createCoinCard(
                    coin
                );

            if(card){

                favoriteList.appendChild(
                    card
                );

            }

        }
    );

}


async function openCoinDetails(
    coinId
){

    const coin =
        COINS.find(
            c =>
                c.id === coinId
        );


    if(!coin){
        return;
    }


    selectedCoinId =
        coinId;


    detailRequestId++;


    const requestId =
        detailRequestId;


    detailIcon.textContent =
        coin.icon;


    detailName.textContent =
        coin.name;


    detailSymbol.textContent =
        coin.symbol;


    detailContent.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading ${
                escapeHtml(
                    coin.name
                )
            } details...

        </div>

    `;


    detailOverlay.classList.add(
        "show"
    );


    detailOverlay.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.style.overflow =
        "hidden";


    if(detailCache[coinId]){

        renderCoinDetails(
            detailCache[coinId]
        );

        refreshCoinDetails(
            coinId,
            requestId
        );

        return;

    }


    await refreshCoinDetails(
        coinId,
        requestId
    );

}


async function refreshCoinDetails(
    coinId,
    requestId
){

    const url =

        "https://api.coingecko.com/api/v3/coins/" +

        encodeURIComponent(
            coinId
        ) +

        "?localization=false" +

        "&tickers=false" +

        "&market_data=true" +

        "&community_data=false" +

        "&developer_data=false" +

        "&sparkline=false";


    try{

        const data =
            await fetchJson(
                url
            );


        if(
            requestId !==
            detailRequestId
        ){

            return;

        }


        detailCache[coinId] =
            data;


        renderCoinDetails(
            data
        );


    }catch(error){

        console.warn(
            "Coin details endpoint failed:",
            error
        );


        if(
            requestId !==
            detailRequestId
        ){

            return;

        }


        /*
            If the detailed endpoint fails,
            use the market data already loaded
            on this page.
        */
        const baseCoin =
            COINS.find(
                c =>
                    c.id === coinId
            );


        const market =
            marketData[coinId];


        if(
            baseCoin &&
            market
        ){

            const currency =
                getCurrency();


            const price =
                Number(
                    market.current_price ||
                    0
                );


            const change24 =
                Number(
                    market.price_change_percentage_24h ||
                    0
                );


            const fallbackDetails = {

                id:coinId,

                name:baseCoin.name,

                symbol:
                    baseCoin.symbol
                        .toLowerCase(),

                market_cap_rank:
                    market.market_cap_rank ||
                    "--",

                market_data:{

                    current_price:{
                        [currency]:
                            price
                    },

                    price_change_percentage_24h:
                        change24,

                    price_change_percentage_7d:
                        0,

                    price_change_percentage_30d:
                        0,

                    market_cap:{
                        [currency]:
                            Number(
                                market.market_cap ||
                                0
                            )
                    },

                    total_volume:{
                        [currency]:
                            Number(
                                market.total_volume ||
                                0
                            )
                    },

                    high_24h:{
                        [currency]:
                            Number(
                                market.high_24h ||
                                0
                            )
                    },

                    low_24h:{
                        [currency]:
                            Number(
                                market.low_24h ||
                                0
                            )
                    },

                    circulating_supply:
                        Number(
                            market.circulating_supply ||
                            0
                        ),

                    total_supply:
                        market.total_supply ||
                        null

                }

            };


            detailCache[coinId] =
                fallbackDetails;


            renderCoinDetails(
                fallbackDetails
            );


            return;

        }


        detailContent.innerHTML = `

            <div class="empty">

                Unable to load cryptocurrency details.

                <br><br>

                <button
                    type="button"
                    class="detail-action"
                    onclick="
                        openCoinDetails(
                            '${escapeJs(coinId)}'
                        )
                    "
                >

                    <i class="fas fa-rotate"></i>

                    Try Again

                </button>

            </div>

        `;

    }

}


function renderCoinDetails(
    coin
){

    const market =
        coin.market_data ||
        {};


    const prices =
        market.current_price ||
        {};


    const currency =
        getCurrency();


    const currentPrice =
        Number(
            prices[currency] ||
            0
        );


    const change24 =
        Number(
            market.price_change_percentage_24h ||
            0
        );


    const change7 =
        Number(
            market.price_change_percentage_7d ||
            0
        );


    const change30 =
        Number(
            market.price_change_percentage_30d ||
            0
        );


    const marketCap =
        Number(
            (market.market_cap || {})[
                currency
            ] || 0
        );


    const volume =
        Number(
            (market.total_volume || {})[
                currency
            ] || 0
        );


    const high24 =
        Number(
            (market.high_24h || {})[
                currency
            ] || 0
        );


    const low24 =
        Number(
            (market.low_24h || {})[
                currency
            ] || 0
        );


    const circulating =
        Number(
            market.circulating_supply ||
            0
        );


    const totalSupply =
        Number(
            market.total_supply ||
            0
        );


    const rank =
        coin.market_cap_rank ||
        "--";


    const favorite =
        isFavorite(
            coin.id
        );


    detailContent.innerHTML = `

        <div class="detail-price-card">

            <div class="detail-label">
                Current Price
            </div>

            <div class="detail-price">

                ${currencySymbol()}
                ${formatPrice(currentPrice)}

            </div>

            <div
                class="
                    detail-change
                    ${
                        change24 >= 0
                            ? "detail-up"
                            : "detail-down"
                    }
                "
            >

                24h:
                ${formatPercent(change24)}

            </div>

        </div>


        <div class="stats-grid">

            <div class="stat-card">

                <div class="stat-name">
                    24h Change
                </div>

                <div class="stat-value">
                    ${formatPercent(change24)}
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">
                    7d Change
                </div>

                <div class="stat-value">
                    ${formatPercent(change7)}
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">
                    30d Change
                </div>

                <div class="stat-value">
                    ${formatPercent(change30)}
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">
                    Market Rank
                </div>

                <div class="stat-value">
                    #${escapeHtml(
                        String(rank)
                    )}
                </div>

            </div>

        </div>


        <div class="stats-grid">

            <div class="stat-card">

                <div class="stat-name">
                    Market Cap
                </div>

                <div class="stat-value">

                    ${currencySymbol()}
                    ${formatLargeNumber(
                        marketCap
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">
                    24h Volume
                </div>

                <div class="stat-value">

                    ${currencySymbol()}
                    ${formatLargeNumber(
                        volume
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">
                    24h High
                </div>

                <div class="stat-value">

                    ${currencySymbol()}
                    ${formatPrice(
                        high24
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">
                    24h Low
                </div>

                <div class="stat-value">

                    ${currencySymbol()}
                    ${formatPrice(
                        low24
                    )}

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">
                    Circulating Supply
                </div>

                <div class="stat-value">

                    ${formatLargeNumber(
                        circulating
                    )}

                    ${
                        escapeHtml(
                            coin.symbol ||
                            ""
                        )
                    }

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-name">
                    Total Supply
                </div>

                <div class="stat-value">

                    ${
                        totalSupply > 0

                            ? formatLargeNumber(
                                totalSupply
                            ) +
                            " " +
                            escapeHtml(
                                coin.symbol ||
                                ""
                            )

                            : "--"
                    }

                </div>

            </div>

        </div>


        <div class="detail-actions">

            <button
                id="detailFavoriteButton"
                type="button"
                class="
                    detail-action
                    ${
                        favorite
                            ? "favorite-active"
                            : ""
                    }
                "
                onclick="
                    toggleFavorite(
                        '${escapeJs(coin.id)}'
                    )
                "
            >

                <i class="fas fa-star"></i>

                ${
                    favorite
                        ? "Favorited"
                        : "Favorite"
                }

            </button>


            <button
                type="button"
                class="detail-action secondary"
                onclick="refreshOpenCoin()"
            >

                <i class="fas fa-rotate"></i>

                Refresh

            </button>


            <button
                type="button"
                class="detail-action secondary"
                onclick="
                    showToast(
                        'Trade connection will be added later.'
                    )
                "
            >

                <i class="fas fa-arrow-right-arrow-left"></i>

                Trade

            </button>

        </div>

    `;

}


function updateDetailFavoriteButton(){

    const button =
        document.getElementById(
            "detailFavoriteButton"
        );


    if(
        !button ||
        !selectedCoinId
    ){

        return;

    }


    const active =
        isFavorite(
            selectedCoinId
        );


    button.className =
        "detail-action" +
        (
            active
                ? " favorite-active"
                : ""
        );


    button.innerHTML =
        '<i class="fas fa-star"></i> ' +
        (
            active
                ? "Favorited"
                : "Favorite"
        );

}


function refreshOpenCoin(){

    if(!selectedCoinId){
        return;
    }


    delete detailCache[
        selectedCoinId
    ];


    openCoinDetails(
        selectedCoinId
    );

}


function closeDetails(){

    detailRequestId++;

    selectedCoinId =
        null;


    detailOverlay.classList.remove(
        "show"
    );


    detailOverlay.setAttribute(
        "aria-hidden",
        "true"
    );


    document.body.style.overflow =
        "";

}


detailOverlay.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            detailOverlay
        ){

            closeDetails();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            detailOverlay.classList.contains(
                "show"
            )
        ){

            closeDetails();

        }

    }
);


searchInput.addEventListener(
    "input",
    renderMarket
);


currencySelect.addEventListener(
    "change",
    () => {

        localStorage.setItem(
            CURRENCY_KEY,
            currencySelect.value
        );

        loadMarket();

    }
);


try{

    const savedCurrency =
        localStorage.getItem(
            CURRENCY_KEY
        );


    if(
        [
            "eur",
            "usd",
            "sek",
            "gbp"
        ].includes(
            savedCurrency
        )
    ){

        currencySelect.value =
            savedCurrency;

    }

}catch{}


loadMarket();

</script>
