<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>HAVKAR - Market</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f5f5f5;
    color:#333;

    padding-bottom:90px;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}


/* ================= HEADER ================= */

.header{

    position:sticky;
    top:0;
    z-index:100;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    box-shadow:
        0 2px 10px rgba(0,0,0,.12);
}

.header-left{

    display:flex;
    align-items:center;

    gap:14px;
}

.header h1{

    font-size:21px;
    font-weight:800;
}

.back-btn,
.refresh-btn{

    width:40px;
    height:40px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;
}

.back-btn{

    color:white;
    background:transparent;

    font-size:23px;
}

.refresh-btn{

    color:white;
    background:rgba(255,255,255,.20);

    font-size:17px;
}


/* ================= PAGE ================= */

.page{

    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:20px;
}


/* ================= ERROR ================= */

.error-box{

    display:none;

    padding:14px;

    margin-bottom:15px;

    border-radius:13px;

    background:#ffebee;
    color:#c62828;

    line-height:1.5;
}

.error-box.show{
    display:block;
}


/* ================= SUMMARY ================= */

.summary-card{

    background:white;

    border-radius:20px;

    padding:20px;

    margin-bottom:18px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.summary-top{

    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:10px;
}

.summary-title{

    color:#777;

    font-size:15px;
}

.connection{

    display:flex;
    align-items:center;

    gap:6px;

    color:#689f38;

    font-size:12px;
}

.connection-dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#7cb342;
}

.connection-dot.offline{
    background:#c62828;
}

.summary-number{

    margin-top:8px;

    font-size:28px;

    font-weight:800;
}

.summary-time{

    margin-top:5px;

    color:#999;

    font-size:12px;
}


/* ================= CONTROLS ================= */

.controls{

    display:grid;

    grid-template-columns:
        1fr 145px;

    gap:10px;

    margin-bottom:20px;
}

.search{

    position:relative;
}

.search i{

    position:absolute;

    left:15px;
    top:50%;

    transform:
        translateY(-50%);

    color:#999;
}

.search input{

    width:100%;
    height:50px;

    border:1px solid #ddd;

    border-radius:14px;

    background:white;

    padding:
        0 15px 0 44px;

    font-size:15px;
}

.search input:focus{

    border-color:#7cb342;

    box-shadow:
        0 0 0 3px
        rgba(124,179,66,.12);
}

.currency{

    width:100%;
    height:50px;

    border:1px solid #ddd;

    border-radius:14px;

    background:white;

    padding:0 12px;

    color:#444;

    font-weight:700;
}


/* ================= SECTION ================= */

.section-header{

    display:flex;

    justify-content:space-between;
    align-items:center;

    margin:
        5px 0 12px;
}

.section-header h2{

    font-size:20px;

    font-weight:800;
}

.favorite-count{

    color:#689f38;

    font-size:12px;

    font-weight:700;
}


/* ================= FAVORITES ================= */

.favorite-section{

    display:none;

    margin-bottom:23px;

    padding:17px;

    border-radius:18px;

    background:#edf6e7;

    border:
        1px solid #d9e9ce;
}

.favorite-section.show{
    display:block;
}


/* ================= LIST ================= */

.market-list{

    display:flex;

    flex-direction:column;

    gap:12px;
}


/* ================= COIN CARD ================= */

.coin-card{

    width:100%;

    min-height:78px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:14px;

    border-radius:17px;

    background:white;

    box-shadow:
        0 2px 9px rgba(0,0,0,.06);

    text-align:left;

    transition:
        transform .12s;
}

.coin-card:active{
    transform:scale(.985);
}


/* ================= REAL COIN IMAGE ================= */

.coin-image{

    width:48px;
    height:48px;

    min-width:48px;

    border-radius:50%;

    object-fit:cover;

    background:#f1f7eb;

    padding:2px;
}

.coin-fallback{

    width:48px;
    height:48px;

    min-width:48px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#f1f7eb;

    color:#689f38;

    font-size:18px;

    font-weight:800;
}


/* ================= COIN INFO ================= */

.coin-info{

    flex:1;

    min-width:0;
}

.coin-name{

    font-size:16px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.coin-symbol{

    margin-top:4px;

    color:#999;

    font-size:12px;
}


/* ================= PRICE ================= */

.coin-price-box{

    min-width:115px;

    text-align:right;
}

.coin-price{

    font-size:15px;

    font-weight:800;

    white-space:nowrap;
}

.coin-change{

    margin-top:5px;

    font-size:12px;

    font-weight:700;
}

.up{
    color:#2e7d32;
}

.down{
    color:#c62828;
}


/* ================= FAVORITE ================= */

.star-btn{

    width:37px;
    height:37px;

    min-width:37px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#f5f7f3;

    color:#aaa;

    font-size:17px;
}

.star-btn.active{

    background:#fff7d8;

    color:#f0ad00;
}


/* ================= LOADING ================= */

.loading{

    background:white;

    border-radius:17px;

    padding:30px;

    text-align:center;

    color:#999;
}

.spinner{

    width:30px;
    height:30px;

    margin:
        0 auto 12px;

    border:
        3px solid #e5e5e5;

    border-top-color:#7cb342;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* ================= EMPTY ================= */

.empty{

    background:white;

    border-radius:17px;

    padding:30px;

    text-align:center;

    color:#999;
}


/* ================= DETAILS ================= */

.overlay{

    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    align-items:flex-end;
    justify-content:center;

    background:
        rgba(0,0,0,.45);
}

.overlay.show{
    display:flex;
}

.panel{

    width:100%;

    max-width:700px;

    max-height:92vh;

    overflow-y:auto;

    background:#f5f5f5;

    border-radius:
        24px 24px 0 0;

    animation:
        slideUp .22s ease;
}

@keyframes slideUp{

    from{
        transform:
            translateY(100%);
    }

    to{
        transform:
            translateY(0);
    }
}


/* ================= DETAIL HEADER ================= */

.detail-header{

    position:sticky;

    top:0;

    z-index:10;

    min-height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        12px 18px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );
}

.detail-left{

    display:flex;

    align-items:center;

    gap:12px;
}

.detail-image{

    width:44px;
    height:44px;

    border-radius:50%;

    object-fit:cover;

    background:white;

    padding:2px;
}

.detail-name{

    font-size:18px;

    font-weight:800;
}

.detail-symbol{

    margin-top:2px;

    font-size:12px;

    opacity:.85;
}

.close-btn{

    width:40px;
    height:40px;

    border-radius:50%;

    background:
        rgba(255,255,255,.20);

    color:white;

    font-size:18px;
}


/* ================= DETAIL CONTENT ================= */

.detail-content{

    padding:18px;
}

.price-card{

    padding:20px;

    margin-bottom:14px;

    border-radius:18px;

    background:white;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.price-label{

    color:#999;

    font-size:12px;

    margin-bottom:7px;
}

.big-price{

    font-size:32px;

    font-weight:850;
}

.big-change{

    margin-top:8px;

    font-size:14px;

    font-weight:800;
}


/* ================= STATS ================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:11px;

    margin-bottom:15px;
}

.stat{

    padding:17px;

    border-radius:17px;

    background:white;

    box-shadow:
        0 2px 9px rgba(0,0,0,.06);
}

.stat-label{

    color:#999;

    font-size:12px;

    margin-bottom:7px;
}

.stat-value{

    font-size:14px;

    font-weight:800;

    line-height:1.4;

    word-break:break-word;
}


/* ================= DETAIL ACTIONS ================= */

.detail-actions{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}

.detail-btn{

    min-height:48px;

    border-radius:13px;

    background:#7cb342;

    color:white;

    font-weight:800;
}

.detail-btn.secondary{

    background:white;

    color:#689f38;

    border:
        1px solid #dcebd3;
}

.detail-btn.favorite-active{

    background:#f0ad00;

    color:white;
}


/* ================= NAV ================= */

.bottom-nav{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:300;

    height:75px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    background:white;

    box-shadow:
        0 -2px 10px
        rgba(0,0,0,.10);
}

.nav-item{

    min-width:55px;

    color:#999;

    text-align:center;

    font-size:12px;
}

.nav-item i{

    display:block;

    margin-bottom:5px;

    font-size:21px;
}

.nav-item.active{
    color:#7cb342;
}


/* ================= TOAST ================= */

.toast{

    position:fixed;

    left:50%;

    bottom:95px;

    z-index:900;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:
        11px 16px;

    border-radius:12px;

    background:#333;

    color:white;

    font-size:13px;

    transition:.2s;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* ================= MOBILE ================= */

@media(max-width:560px){

    .page{
        padding:15px;
    }

    .controls{
        grid-template-columns:
            1fr 105px;
    }

    .coin-price-box{
        min-width:95px;
    }

    .coin-price{
        font-size:13px;
    }

    .coin-name{
        font-size:15px;
    }

    .stats{
        gap:8px;
    }

    .stat{
        padding:14px;
    }

}


/* ================= DESKTOP ================= */

@media(min-width:700px){

    .overlay{

        align-items:center;

        padding:20px;
    }

    .panel{

        border-radius:24px;

        max-height:90vh;
    }

}

</style>
</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

<main class="page">

<div

            </div>

        <div

                Loading...

            </div>

    </section>

</div>


<!-- ================= BOTTOM NAV ================= -->

    <div
        class="nav-item"

        <i class="fas fa-wallet"></i>

        Wallet

    </div>


    <div class="nav-item active">

        <i class="fas fa-chart-line"></i>

        Market

    </div>


    <div
        class="nav-item"

        <i class="fas fa-exchange-alt"></i>

        Trade

    </div>


    <div
        class="nav-item"
        onclick="navigateTo('history.html')">

        <i class="fas fa-history"></i>

        History

    </div>


    <div
        class="nav-item"
        onclick="navigateTo('profile.html')">

        <i class="fas fa-user"></i>

        Profile

    </div>

</nav>


<div
    id="toast"
    class="toast">
</div>


<script>

"use strict";


/* =====================================================
   HAVKAR MARKET CONFIG
===================================================== */

const COINS = [

    {
        id:"bitcoin",
        name:"Bitcoin",
        symbol:"BTC"
    },

    {
        id:"ethereum",
        name:"Ethereum",
        symbol:"ETH"
    },

    {
        id:"tether",
        name:"Tether",
        symbol:"USDT"
    },

    {
        id:"binancecoin",
        name:"BNB",
        symbol:"BNB"
    },

    {
        id:"solana",
        name:"Solana",
        symbol:"SOL"
    },

    {
        id:"ripple",
        name:"XRP",
        symbol:"XRP"
    },

    {
        id:"cardano",
        name:"Cardano",
        symbol:"ADA"
    },

    {
        id:"dogecoin",
        name:"Dogecoin",
        symbol:"DOGE"
    },

    {
        id:"tron",
        name:"TRON",
        symbol:"TRX"
    },

    {
        id:"polkadot",
        name:"Polkadot",
        symbol:"DOT"
    },

    {
        id:"usd-coin",
        name:"USDC",
        symbol:"USDC"
    },

    {
        id:"avalanche-2",
        name:"Avalanche",
        symbol:"AVAX"
    },

    {
        id:"chainlink",
        name:"Chainlink",
        symbol:"LINK"
    },

    {
        id:"stellar",
        name:"Stellar",
        symbol:"XLM"
    },

    {
        id:"uniswap",
        name:"Uniswap",
        symbol:"UNI"
    }

];


/* =====================================================
   STORAGE
===================================================== */

const FAVORITES_KEY =
    "havkar_market_favorites_v2";

const CURRENCY_KEY =
    "havkar_market_currency_v2";


/* =====================================================
   STATE
===================================================== */

let marketData = {};

let detailCache = {};

let selectedCoinId = null;


/* =====================================================
   DOM
===================================================== */

const marketList =
    document.getElementById(
        "marketList"
    );

const favoriteList =
    document.getElementById(
        "favoriteList"
    );

const favoriteSection =
    document.getElementById(
        "favoriteSection"
    );

const favoriteCount =
    document.getElementById(
        "favoriteCount"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const currencySelect =
    document.getElementById(
        "currencySelect"
    );

const marketNumber =
    document.getElementById(
        "marketNumber"
    );

const updatedText =
    document.getElementById(
        "updatedText"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const detailOverlay =
    document.getElementById(
        "detailOverlay"
    );

const detailContent =
    document.getElementById(
        "detailContent"
    );

const detailImage =
    document.getElementById(
        "detailImage"
    );

const detailName =
    document.getElementById(
        "detailName"
    );

const detailSymbol =
    document.getElementById(
        "detailSymbol"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =====================================================
   FAVORITES
===================================================== */

function getFavorites(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    FAVORITES_KEY
                ) || "[]"
            );


        if(
            !Array.isArray(saved)
        ){

            return [];

        }


        return saved;

    }
    catch(error){

        console.error(
            "Favorites error:",
            error
        );

        return [];

    }

}


function saveFavorites(
    favorites
){

    try{

        localStorage.setItem(
            FAVORITES_KEY,

            JSON.stringify(
                [
                    ...new Set(
                        favorites
                    )
                ]
            )
        );

    }
    catch(error){

        console.error(
            "Save favorites error:",
            error
        );

    }

}


function isFavorite(
    coinId
){

    return getFavorites()
        .includes(
            coinId
        );

}


function toggleFavorite(
    coinId,
    event
){

    if(event){

        event.stopPropagation();

    }


    let favorites =
        getFavorites();


    if(
        favorites.includes(
            coinId
        )
    ){

        favorites =
            favorites.filter(
                id =>
                    id !== coinId
            );

        showToast(
            "Removed from Favorites"
        );

    }
    else{

        favorites.push(
            coinId
        );

        showToast(
            "Added to Favorites"
        );

    }


    saveFavorites(
        favorites
    );


    renderMarket();

    renderFavorites();


    if(
        selectedCoinId === coinId
    ){

        updateDetailFavorite();

    }

}


/* =====================================================
   CURRENCY
===================================================== */

function getCurrency(){

    return (
        currencySelect.value ||
        "eur"
    );

}


function currencySymbol(){

    const symbols = {

        eur:"€",

        usd:"$",

        chf:"Fr",

        gbp:"£"

    };


    return (
        symbols[
            getCurrency()
        ] || "€"
    );

}


/* =====================================================
   FORMAT
===================================================== */

function formatPrice(
    value
){

    const number =
        Number(value);


    if(
        !Number.isFinite(
            number
        )
    ){

        return "--";

    }


    let digits = 8;


    if(
        number >= 1000
    ){

        digits = 2;

    }
    else if(
        number >= 1
    ){

        digits = 4;

    }


    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:digits
        }
    );

}


function formatNumber(
    value
){

    const number =
        Number(value);


    if(
        !Number.isFinite(
            number
        ) ||
        number <= 0
    ){

        return "--";

    }


    return number.toLocaleString(
        "en-US",
        {
            maximumFractionDigits:2
        }
    );

}


function formatPercent(
    value
){

    const number =
        Number(value);


    if(
        !Number.isFinite(
            number
        )
    ){

        return "--";

    }


    return (
        number >= 0
            ? "+"
            : ""
    ) +
    number.toFixed(2) +
    "%";

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
    value
){

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   NAVIGATION
===================================================== */

function navigateTo(
    file
){

    window.location.href =
        file;

}


function goBack(){

    if(
        document.referrer &&
        document.referrer.indexOf(
            window.location.origin
        ) === 0
    ){

        history.back();

    }
    else{

        window.location.href =
            "index.html";

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
    message
){

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
){

    errorBox.textContent =
        message;


    errorBox.classList.add(
        "show"
    );

}


function hideError(){

    errorBox.textContent =
        "";


    errorBox.classList.remove(
        "show"
    );

}


/* =====================================================
   COIN IMAGE
===================================================== */

function createCoinImage(
    coin,
    market
){

    const imageUrl =
        market &&
        market.image
            ? market.image
            : "";


    if(
        imageUrl
    ){

        return `

            <img
                class="coin-image"
                src="${escapeHtml(
                    imageUrl
                )}"
                alt="${escapeHtml(
                    coin.name
                )}"
                loading="lazy"
                onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                "
            >

            <div
                class="coin-fallback"
                style="display:none">

                ${escapeHtml(
                    coin.symbol
                )}

            </div>

        `;

    }


    return `

        <div class="coin-fallback">

            ${escapeHtml(
                coin.symbol
            )}

        </div>

    `;

}


/* =====================================================
   LOAD MARKET
===================================================== */

async function loadMarket(){

    hideError();


    connectionText.textContent =
        "Updating";


    connectionDot.classList.remove(
        "offline"
    );


    marketList.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading cryptocurrency prices...

        </div>

    `;


    const ids =
        COINS
            .map(
                coin =>
                    coin.id
            )
            .join(",");


    const currency =
        getCurrency();


    const url =
        "https://api.coingecko.com/api/v3/coins/markets" +

        "?vs_currency=" +
        encodeURIComponent(
            currency
        ) +

        "&ids=" +
        encodeURIComponent(
            ids
        ) +

        "&order=market_cap_desc" +

        "&per_page=" +
        COINS.length +

        "&page=1" +

        "&sparkline=false" +

        "&price_change_percentage=24h";


    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !Array.isArray(
                data
            ) ||
            !data.length
        ){

            throw new Error(
                "No market data returned."
            );

        }


        marketData = {};


        data.forEach(
            item => {

                marketData[
                    item.id
                ] = item;

            }
        );


        detailCache = {};


        renderMarket();

        renderFavorites();


        marketNumber.textContent =
            data.length +
            " cryptocurrencies";


        updatedText.textContent =
            "Updated: " +
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit",
                        second:"2-digit"
                    }
                );


        connectionText.textContent =
            "Live";

    }
    catch(error){

        console.error(
            "HAVKAR market error:",
            error
        );


        connectionText.textContent =
            "Offline";


        connectionDot.classList.add(
            "offline"
        );


        marketList.innerHTML = `

            <div class="empty">

                Unable to load cryptocurrency prices.

                <br><br>

                Please check your internet connection.

                <br><br>

                <button
                    type="button"
                    onclick="loadMarket()"
                    style="
                        background:#7cb342;
                        color:white;
                        padding:11px 18px;
                        border-radius:10px;
                        font-weight:700;
                    "
                >

                    Try Again

                </button>

            </div>

        `;


        showError(
            "Market data could not be loaded."
        );

    }

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCoinCard(
    coin
){

    const market =
        marketData[
            coin.id
        ];


    if(
        !market
    ){

        return null;

    }


    const price =
        Number(
            market.current_price || 0
        );


    const change =
        Number(
            market.price_change_percentage_24h || 0
        );


    const favorite =
        isFavorite(
            coin.id
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "coin-card";


    card.innerHTML = `

        ${createCoinImage(
            coin,
            market
        )}


        <div class="coin-info">

            <div class="coin-name">

                ${escapeHtml(
                    coin.name
                )}

            </div>


            <div class="coin-symbol">

                ${escapeHtml(
                    coin.symbol
                )}

            </div>

        </div>


        <div class="coin-price-box">

            <div class="coin-price">

                ${currencySymbol()}${formatPrice(
                    price
                )}

            </div>


            <div
                class="coin-change ${
                    change >= 0
                        ? "up"
                        : "down"
                }"
            >

                ${
                    change >= 0
                        ? "+"
                        : ""
                }${change.toFixed(2)}%

            </div>

        </div>


        <button
            type="button"
            class="star-btn ${
                favorite
                    ? "active"
                    : ""
            }"
            aria-label="${
                favorite
                    ? "Remove from Favorites"
                    : "Add to Favorites"
            }">

            <i class="fa${
                favorite
                    ? "s"
                    : "r"
            } fa-star"></i>

        </button>

    `;


    card.addEventListener(
        "click",
        () => {

            openDetails(
                coin.id
            );

        }
    );


    const star =
        card.querySelector(
            ".star-btn"
        );


    star.addEventListener(
        "click",
        event => {

            toggleFavorite(
                coin.id,
                event
            );

        }
    );


    return card;

}


/* =====================================================
   RENDER MARKET
===================================================== */

function renderMarket(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        COINS.filter(
            coin => {

                if(
                    !marketData[
                        coin.id
                    ]
                ){

                    return false;

                }


                if(
                    !query
                ){

                    return true;

                }


                return (

                    coin.name
                        .toLowerCase()
                        .includes(
                            query
                        )

                    ||

                    coin.symbol
                        .toLowerCase()
                        .includes(
                            query
                        )

                );

            }
        );


    marketList.innerHTML =
        "";


    if(
        !filtered.length
    ){

        marketList.innerHTML = `

            <div class="empty">

                No cryptocurrency found.

            </div>

        `;

        return;

    }


    filtered.forEach(
        coin => {

            const card =
                createCoinCard(
                    coin
                );


            if(
                card
            ){

                marketList.appendChild(
                    card
                );

            }

        }
    );

}


/* =====================================================
   RENDER FAVORITES
===================================================== */

function renderFavorites(){

    const favorites =
        getFavorites();


    const coins =
        favorites

            .map(
                id =>
                    COINS.find(
                        coin =>
                            coin.id === id
                    )
            )

            .filter(Boolean)

            .filter(
                coin =>
                    marketData[
                        coin.id
                    ]
            );


    favoriteList.innerHTML =
        "";


    favoriteCount.textContent =
        coins.length +
        " saved";


    if(
        !coins.length
    ){

        favoriteSection.classList.remove(
            "show"
        );

        return;

    }


    favoriteSection.classList.add(
        "show"
    );


    coins.forEach(
        coin => {

            const card =
                createCoinCard(
                    coin
                );


            if(
                card
            ){

                favoriteList.appendChild(
                    card
                );

            }

        }
    );

}


/* =====================================================
   OPEN DETAILS
===================================================== */

async function openDetails(
    coinId
){

    const coin =
        COINS.find(
            item =>
                item.id === coinId
        );


    if(
        !coin
    ){

        return;

    }


    selectedCoinId =
        coinId;


    const market =
        marketData[
            coinId
        ];


    detailName.textContent =
        coin.name;


    detailSymbol.textContent =
        coin.symbol;


    if(
        market &&
        market.image
    ){

        detailImage.src =
            market.image;

        detailImage.style.display =
            "block";

    }
    else{

        detailImage.style.display =
            "none";

    }


    detailContent.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading details...

        </div>

    `;


    detailOverlay.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";


    if(
        detailCache[
            coinId
        ]
    ){

        renderDetails(
            detailCache[
                coinId
            ]
        );

        return;

    }


    await fetchDetails(
        coinId
    );

}


/* =====================================================
   FETCH DETAILS
===================================================== */

async function fetchDetails(
    coinId
){

    const url =
        "https://api.coingecko.com/api/v3/coins/" +
        encodeURIComponent(
            coinId
        ) +

        "?localization=false" +

        "&tickers=false" +

        "&market_data=true" +

        "&community_data=false" +

        "&developer_data=false";


    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        detailCache[
            coinId
        ] = data;


        if(
            selectedCoinId === coinId
        ){

            renderDetails(
                data
            );

        }

    }
    catch(error){

        console.error(
            "Details error:",
            error
        );


        detailContent.innerHTML = `

            <div class="empty">

                Unable to load details.

                <br><br>

                <button
                    type="button"
                    onclick="fetchDetails('${coinId}')"
                    style="
                        background:#7cb342;
                        color:white;
                        padding:11px 18px;
                        border-radius:10px;
                        font-weight:700;
                    "
                >

                    Try Again

                </button>

            </div>

        `;

    }

}


/* =====================================================
   RENDER DETAILS
===================================================== */

function renderDetails(
    coin
){

    const market =
        coin.market_data || {};


    const currency =
        getCurrency();


    const currentPrice =
        Number(
            (
                market.current_price ||
                {}
            )[
                currency
            ] || 0
        );


    const change24 =
        Number(
            market.price_change_percentage_24h ||
            0
        );


    const change7 =
        Number(
            market.price_change_percentage_7d ||
            0
        );


    const change30 =
        Number(
            market.price_change_percentage_30d ||
            0
        );


    const marketCap =
        Number(
            (
                market.market_cap ||
                {}
            )[
                currency
            ] || 0
        );


    const volume =
        Number(
            (
                market.total_volume ||
                {}
            )[
                currency
            ] || 0
        );


    const high24 =
        Number(
            (
                market.high_24h ||
                {}
            )[
                currency
            ] || 0
        );


    const low24 =
        Number(
            (
                market.low_24h ||
                {}
            )[
                currency
            ] || 0
        );


    const rank =
        coin.market_cap_rank ||
        "--";


    const circulating =
        Number(
            market.circulating_supply ||
            0
        );


    const totalSupply =
        Number(
            market.total_supply ||
            0
        );


    const favorite =
        isFavorite(
            coin.id
        );


    detailContent.innerHTML = `

        <div class="price-card">

            <div class="price-label">

                Current Price

            </div>


            <div class="big-price">

                ${currencySymbol()}${formatPrice(
                    currentPrice
                )}

            </div>


            <div
                class="big-change ${
                    change24 >= 0
                        ? "up"
                        : "down"
                }"
            >

                24h:
                ${formatPercent(
                    change24
                )}

            </div>

        </div>


        <div class="stats">


            <div class="stat">

                <div class="stat-label">
                    24h Change
                </div>

                <div class="stat-value">
                    ${formatPercent(
                        change24
                    )}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    7d Change
                </div>

                <div class="stat-value">
                    ${formatPercent(
                        change7
                    )}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    30d Change
                </div>

                <div class="stat-value">
                    ${formatPercent(
                        change30
                    )}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Market Rank
                </div>

                <div class="stat-value">
                    #${escapeHtml(
                        String(rank)
                    )}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Market Cap
                </div>

                <div class="stat-value">
                    ${currencySymbol()}${formatNumber(
                        marketCap
                    )}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    24h Volume
                </div>

                <div class="stat-value">
                    ${currencySymbol()}${formatNumber(
                        volume
                    )}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    24h High
                </div>

                <div class="stat-value">
                    ${currencySymbol()}${formatPrice(
                        high24
                    )}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    24h Low
                </div>

                <div class="stat-value">
                    ${currencySymbol()}${formatPrice(
                        low24
                    )}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Circulating Supply
                </div>

                <div class="stat-value">
                    ${formatNumber(
                        circulating
                    )}
                    ${escapeHtml(
                        coin.symbol
                    )}
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Total Supply
                </div>

                <div class="stat-value">

                    ${
                        totalSupply > 0
                            ? formatNumber(
                                totalSupply
                              ) +
                              " " +
                              escapeHtml(
                                  coin.symbol
                              )
                            : "--"
                    }

                </div>

            </div>

        </div>


        <div class="detail-actions">


            <button
                id="detailFavorite"
                type="button"
                class="detail-btn ${
                    favorite
                        ? "favorite-active"
                        : ""
                }"
                onclick="toggleFavorite('${coin.id}')">

                <i class="fas fa-star"></i>

                ${
                    favorite
                        ? " Favorited"
                        : " Favorite"
                }

            </button>


            <button
                type="button"
                class="detail-btn secondary"
                onclick="refreshDetails()">

                <i class="fas fa-rotate"></i>

                Refresh

            </button>


        </div>

    `;

}


/* =====================================================
   UPDATE DETAIL FAVORITE
===================================================== */

function updateDetailFavorite(){

    const button =
        document.getElementById(
            "detailFavorite"
        );


    if(
        !button ||
        !selectedCoinId
    ){

        return;

    }


    const active =
        isFavorite(
            selectedCoinId
        );


    button.className =
        "detail-btn" +
        (
            active
                ? " favorite-active"
                : ""
        );


    button.innerHTML =
        '<i class="fas fa-star"></i> ' +
        (
            active
                ? "Favorited"
                : "Favorite"
        );

}


/* =====================================================
   REFRESH DETAILS
===================================================== */

async function refreshDetails(){

    if(
        !selectedCoinId
    ){

        return;

    }


    delete detailCache[
        selectedCoinId
    ];


    detailContent.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Updating...

        </div>

    `;


    await fetchDetails(
        selectedCoinId
    );

}


/* =====================================================
   CLOSE DETAILS
===================================================== */

function closeDetails(){

    selectedCoinId =
        null;


    detailOverlay.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";

}


detailOverlay.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            detailOverlay
        ){

            closeDetails();

        }

    }
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        renderMarket();

    }
);


/* =====================================================
   CURRENCY CHANGE
===================================================== */

currencySelect.addEventListener(
    "change",
    function(){

        try{

            localStorage.setItem(
                CURRENCY_KEY,
                currencySelect.value
            );

        }
        catch(error){

            console.error(
                "Currency storage error:",
                error
            );

        }


        loadMarket();

    }
);


/* =====================================================
   LOAD SAVED CURRENCY
===================================================== */

try{

    const saved =
        localStorage.getItem(
            CURRENCY_KEY
        );


    /*
       Only these four are allowed.
       Old SEK value is intentionally ignored.
    */

    if(
        [
            "eur",
            "usd",
            "chf",
            "gbp"
        ].includes(
            saved
        )
    ){

        currencySelect.value =
            saved;

    }
    else{

        currencySelect.value =
            "eur";

    }

}
catch(error){

    currencySelect.value =
        "eur";

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            if(
                detailOverlay.classList.contains(
                    "show"
                )
            ){

                closeDetails();

            }

        }

    }
);


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    function(){

        if(
            !document.hidden &&
            !detailOverlay.classList.contains(
                "show"
            )
        ){

            loadMarket();

        }

    },
    120000
);


/* =====================================================
   START
===================================================== */

loadMarket();

</script>
