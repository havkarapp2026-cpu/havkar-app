<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR - Transaction History</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
    padding-bottom:90px;
}

.header{
    height:72px;
    background:#69b52f;
    color:white;
    display:flex;
    align-items:center;
    padding:0 22px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    position:sticky;
    top:0;
    z-index:20;
}

.back{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.header h1{
    font-size:25px;
    margin-left:14px;
    font-weight:700;
}

.refresh{
    margin-left:auto;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.container{
    max-width:950px;
    margin:0 auto;
    padding:22px 16px;
}

.hero{
    background:white;
    border-radius:22px;
    padding:25px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
    margin-bottom:18px;
}

.hero-title{
    font-size:16px;
    color:#777;
    margin-bottom:7px;
}

.hero h2{
    font-size:30px;
    margin-bottom:5px;
}

.hero p{
    color:#888;
    font-size:14px;
}

.filters{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.filter{
    background:white;
    border:1px solid #ddd;
    border-radius:14px;
    padding:13px 16px;
    font-size:15px;
    flex:1;
    min-width:150px;
    outline:none;
}

.transaction{
    background:white;
    border-radius:18px;
    margin-bottom:12px;
    padding:17px;
    display:flex;
    align-items:center;
    gap:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.icon{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#eef8e8;
    color:#69b52f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.info{
    flex:1;
    min-width:0;
}

.info strong{
    display:block;
    font-size:16px;
    margin-bottom:5px;
}

.info span{
    display:block;
    color:#888;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.amount{
    text-align:right;
    font-weight:700;
    font-size:16px;
}

.amount small{
    display:block;
    font-size:12px;
    color:#888;
    margin-top:5px;
    font-weight:400;
}

.sent{
    color:#c04444;
}

.received{
    color:#4d9b2c;
}

.empty{
    background:white;
    border-radius:20px;
    padding:55px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.empty i{
    font-size:48px;
    color:#b8d9a5;
    margin-bottom:15px;
}

.empty h3{
    font-size:20px;
    margin-bottom:8px;
}

.empty p{
    color:#888;
    font-size:14px;
    line-height:1.6;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:82px;
    background:white;
    border-top:1px solid #e5e5e5;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:30;
    box-shadow:0 -3px 12px rgba(0,0,0,.06);
}

.nav-item{
    text-decoration:none;
    color:#999;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-size:12px;
    min-width:60px;
}

.nav-item i{
    font-size:23px;
}

.nav-item.active{
    color:#69b52f;
}

@media(max-width:600px){
    .header{
        height:68px;
    }

    .header h1{
        font-size:23px;
    }

    .container{
        padding:18px 12px;
    }

    .transaction{
        padding:14px;
    }

    .icon{
        width:45px;
        height:45px;
    }

    .amount{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header class="header">
    <button class="back" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <h1>Transaction History</h1>

    <button class="refresh" onclick="loadHistory()">
        <i class="fa-solid fa-rotate"></i>
    </button>
</header>

<main class="container">

    <section class="hero">
        <div class="hero-title">HAVKAR Wallet</div>
        <h2>Transaction History</h2>
        <p id="transactionCount">All your transactions in one place</p>
    </section>

    <div class="filters">
        <select class="filter" id="typeFilter">
            <option value="all">All transactions</option>
            <option value="sent">Sent transfers</option>
            <option value="received">Received transfers</option>
            <option value="all-transfer">Transfers</option>
            <option value="deposit">Deposits</option>
            <option value="withdrawal">Withdrawals</option>
            <option value="payment">Payments</option>
            <option value="refund">Refunds</option>
            <option value="fee">Fees</option>
            <option value="sale">Sales</option>
        </select>

        <select class="filter" id="currencyFilter">
            <option value="all">All currencies</option>
            <option value="EUR">EUR €</option>
            <option value="USD">USD $</option>
        </select>

        <input class="filter" id="historySearch" type="search" placeholder="Search reference or details" autocomplete="off">
    </div>

    <div class="filters">
        <button class="filter" id="historyPrev" type="button">Previous</button>
        <button class="filter" id="historyNext" type="button">Next</button>
    </div>

    <section id="historyList"></section>

</main>

<nav class="bottom-nav">

    <a class="nav-item" href="wallet.html">
        <i class="fa-solid fa-wallet"></i>
        <span>Wallet</span>
    </a>

    <a class="nav-item" href="market.html">
        <i class="fa-solid fa-chart-line"></i>
        <span>Market</span>
    </a>

    <a class="nav-item" href="trade.html">
        <i class="fa-solid fa-right-left"></i>
        <span>Trade</span>
    </a>

    <a class="nav-item active" href="history.html">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>History</span>
    </a>

    <a class="nav-item" href="profile.html">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/havkar-supabase-config.js"></script>
<script src="/havkar-wallet.js"></script>
<script>

const SUPABASE_URL=window.HAVKAR_SUPABASE_CONFIG.url;
const SUPABASE_ANON_KEY=window.HAVKAR_SUPABASE_CONFIG.publishableKey;
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentUser=null;
let historyCache=[];
let historyPage=0;

function goBack(){
    if(document.referrer){
        history.back();
    }else{
        window.location.href="index.html";
    }
}

function missingLedgerTable(error){
    const code=String(error&&error.code||"");
    const message=String(error&&error.message||"");
    return code==="PGRST205"||code==="42P01"||message.indexOf("wallet_operation_requests")!==-1;
}

async function getTransactions(){
    if(!currentUser)return [];
    const api=window.HAVKAR_WALLET;

    const transfers=await db
        .from("wallet_transfers")
        .select("*")
        .or("sender_id.eq."+currentUser.id+",receiver_id.eq."+currentUser.id)
        .order("created_at",{ascending:false})
        .limit(100);
    if(transfers.error)throw transfers.error;

    const transactions=await db
        .from("wallet_transactions")
        .select("*")
        .eq("user_id",currentUser.id)
        .order("created_at",{ascending:false})
        .limit(100);
    if(transactions.error)throw transactions.error;

    const entries=[]
        .concat((transfers.data||[]).map(function(row){return api.fromTransfer(row,currentUser.id);}))
        .concat((transactions.data||[]).map(function(row){return api.fromTransaction(row);}));

    const requests=await db
        .from("wallet_operation_requests")
        .select("*")
        .eq("user_id",currentUser.id)
        .order("created_at",{ascending:false})
        .limit(100);

    if(!requests.error){
        (requests.data||[]).forEach(function(row){
            entries.push(api.fromOperation(row));
        });
    }else if(!missingLedgerTable(requests.error)){
        throw requests.error;
    }

    return api.sortLedger(entries.filter(Boolean));
}

function escapeHtml(value){
    const div=document.createElement("div");
    div.textContent=String(value??"");
    return div.innerHTML;
}

function createTransaction(transaction){
    const api=window.HAVKAR_WALLET;
    const amount=api.moneyText(transaction.amount)||"";
    const date=transaction.createdAt
        ? new Date(transaction.createdAt).toLocaleString()
        : "Date unavailable";
    const icon=transaction.direction==="out"?"fa-arrow-up":"fa-arrow-down";
    const sign=transaction.direction==="in"?"+":transaction.direction==="out"?"-":"";
    const counterparty=transaction.counterparty
        ? "Counterparty "+transaction.counterparty
        : "No counterparty recorded";

    const item=document.createElement("div");
    item.className="transaction";
    item.innerHTML=`
        <div class="icon">
            <i class="fa-solid ${icon}"></i>
        </div>
        <div class="info">
            <strong>${escapeHtml(transaction.type)} ${escapeHtml(transaction.currency)}</strong>
            <span>${escapeHtml(transaction.status)} · Fee ${escapeHtml(transaction.fee)}</span>
            <span>${escapeHtml(counterparty)}</span>
            <span>${escapeHtml(date)} · ${escapeHtml(transaction.reference)}</span>
            <span>${escapeHtml(transaction.details)}</span>
        </div>
        <div class="amount ${transaction.direction==="out"?"sent":"received"}">
            ${sign}${escapeHtml(amount)} ${escapeHtml(transaction.currency)}
            <small>${escapeHtml(transaction.status)}</small>
        </div>
    `;
    return item;
}

function renderHistory(){
    const api=window.HAVKAR_WALLET;
    const list=document.getElementById("historyList");
    const filtered=api.filterLedger(historyCache,{
        type:document.getElementById("typeFilter").value,
        currency:document.getElementById("currencyFilter").value,
        search:document.getElementById("historySearch").value
    });
    const paged=api.pageLedger(filtered,historyPage);
    historyPage=Math.min(historyPage,paged.pageCount-1);
    const visible=api.pageLedger(filtered,historyPage);

    document.getElementById("transactionCount").textContent=
        visible.total+(visible.total===1?" recorded row":" recorded rows")+
        " · page "+(visible.page+1)+" of "+visible.pageCount;

    list.innerHTML="";

    if(!visible.items.length){
        list.innerHTML=`
            <div class="empty">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <h3>No recorded transactions</h3>
                <p>Only rows stored for your account are shown. Nothing is added as a sample.</p>
            </div>`;
        return;
    }

    visible.items.forEach(function(transaction){
        list.appendChild(createTransaction(transaction));
    });
}

async function loadHistory(){
    const list=document.getElementById("historyList");

    list.innerHTML=`
        <div class="empty">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <h3>Loading transactions...</h3>
        </div>`;

    try{
        const sessionResult=await db.auth.getSession();
        const session=sessionResult&&sessionResult.data&&sessionResult.data.session;

        if(!sessionResult||sessionResult.error||!session){
            window.location.replace("login.html");
            return;
        }

        const {data,error}=await db.auth.getUser();
        currentUser=data&&data.user||null;

        if(error||!currentUser){
            window.location.replace("login.html");
            return;
        }

        historyCache=await getTransactions();
        historyPage=0;
        renderHistory();

    }catch(error){
        console.error("History load error:",error);
        historyCache=[];
        document.getElementById("transactionCount").textContent=
            "Unable to load transaction history";
        list.innerHTML=`
            <div class="empty">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <h3>Could not load history</h3>
                <p>Your transactions could not be loaded. Please try again.</p>
            </div>`;
    }
}

document.getElementById("typeFilter").addEventListener("change",function(){historyPage=0;renderHistory();});
document.getElementById("currencyFilter").addEventListener("change",function(){historyPage=0;renderHistory();});
document.getElementById("historySearch").addEventListener("input",function(){historyPage=0;renderHistory();});
document.getElementById("historyPrev").addEventListener("click",function(){historyPage=Math.max(0,historyPage-1);renderHistory();});
document.getElementById("historyNext").addEventListener("click",function(){historyPage+=1;renderHistory();});
document.addEventListener("DOMContentLoaded",loadHistory);

</script>

<script src="/havkar-i18n.js"></script>

</body>
</html>
