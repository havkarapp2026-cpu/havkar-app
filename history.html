<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR - Transaction History</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
    padding-bottom:90px;
}

.header{
    height:72px;
    background:#69b52f;
    color:white;
    display:flex;
    align-items:center;
    padding:0 22px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    position:sticky;
    top:0;
    z-index:20;
}

.back{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.header h1{
    font-size:25px;
    margin-left:14px;
    font-weight:700;
}

.refresh{
    margin-left:auto;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.container{
    max-width:950px;
    margin:0 auto;
    padding:22px 16px;
}

.hero{
    background:white;
    border-radius:22px;
    padding:25px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
    margin-bottom:18px;
}

.hero-title{
    font-size:16px;
    color:#777;
    margin-bottom:7px;
}

.hero h2{
    font-size:30px;
    margin-bottom:5px;
}

.hero p{
    color:#888;
    font-size:14px;
}

.filters{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.filter{
    background:white;
    border:1px solid #ddd;
    border-radius:14px;
    padding:13px 16px;
    font-size:15px;
    flex:1;
    min-width:150px;
    outline:none;
}

.transaction{
    background:white;
    border-radius:18px;
    margin-bottom:12px;
    padding:17px;
    display:flex;
    align-items:center;
    gap:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.icon{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#eef8e8;
    color:#69b52f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.info{
    flex:1;
    min-width:0;
}

.info strong{
    display:block;
    font-size:16px;
    margin-bottom:5px;
}

.info span{
    display:block;
    color:#888;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.amount{
    text-align:right;
    font-weight:700;
    font-size:16px;
}

.amount small{
    display:block;
    font-size:12px;
    color:#888;
    margin-top:5px;
    font-weight:400;
}

.sent{
    color:#c04444;
}

.received{
    color:#4d9b2c;
}

.empty{
    background:white;
    border-radius:20px;
    padding:55px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.empty i{
    font-size:48px;
    color:#b8d9a5;
    margin-bottom:15px;
}

.empty h3{
    font-size:20px;
    margin-bottom:8px;
}

.empty p{
    color:#888;
    font-size:14px;
    line-height:1.6;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:82px;
    background:white;
    border-top:1px solid #e5e5e5;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:30;
    box-shadow:0 -3px 12px rgba(0,0,0,.06);
}

.nav-item{
    text-decoration:none;
    color:#999;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-size:12px;
    min-width:60px;
}

.nav-item i{
    font-size:23px;
}

.nav-item.active{
    color:#69b52f;
}

@media(max-width:600px){
    .header{
        height:68px;
    }

    .header h1{
        font-size:23px;
    }

    .container{
        padding:18px 12px;
    }

    .transaction{
        padding:14px;
    }

    .icon{
        width:45px;
        height:45px;
    }

    .amount{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header class="header">
    <button class="back" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <h1>Transaction History</h1>

    <button class="refresh" onclick="loadHistory()">
        <i class="fa-solid fa-rotate"></i>
    </button>
</header>

<main class="container">

    <section class="hero">
        <div class="hero-title">HAVKAR Wallet</div>
        <h2>Transaction History</h2>
        <p id="transactionCount">All your transactions in one place</p>
    </section>

    <div class="filters">
        <select class="filter" id="typeFilter" onchange="loadHistory()">
            <option value="all">All transactions</option>
            <option value="sent">Sent</option>
            <option value="received">Received</option>
            <option value="all-transfer">Transfers</option>
        </select>

        <select class="filter" id="currencyFilter" onchange="loadHistory()">
            <option value="all">All currencies</option>
            <option value="EUR">EUR €</option>

        </select>
    </div>

    <section id="historyList"></section>

</main>

<nav class="bottom-nav">

    <a class="nav-item" href="wallet.html">
        <i class="fa-solid fa-wallet"></i>
        <span>Wallet</span>
    </a>

    <a class="nav-item" href="market.html">
        <i class="fa-solid fa-chart-line"></i>
        <span>Market</span>
    </a>

    <a class="nav-item" href="trade.html">
        <i class="fa-solid fa-right-left"></i>
        <span>Trade</span>
    </a>

    <a class="nav-item active" href="history.html">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>History</span>
    </a>

    <a class="nav-item" href="profile.html">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://gispovnciifgikvgpzck.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentUser=null;
let historyCache=[];

function goBack(){
    if(document.referrer){
        history.back();
    }else{
        window.location.href="index.html";
    }
}

async function getTransactions(){
    if(!currentUser)return [];

    const {data,error}=await db
        .from("wallet_transfers")
        .select("*")
        .or("sender_id.eq."+currentUser.id+",receiver_id.eq."+currentUser.id)
        .order("created_at",{ascending:false})
        .limit(200);

    if(error)throw error;
    return data||[];
}

function getType(transaction){
    return transaction.sender_id===currentUser.id ? "sent" : "received";
}

function getCurrency(transaction){
    return String(transaction.currency||"EUR").toUpperCase();
}

function getAmount(transaction){
    const number=Number(transaction.amount||0);
    if(!Number.isFinite(number))return "0.00";
    return number.toLocaleString(undefined,{
        minimumFractionDigits:2,
        maximumFractionDigits:8
    });
}

function getDate(transaction){
    if(!transaction.created_at)return "Date unavailable";
    const date=new Date(transaction.created_at);
    if(Number.isNaN(date.getTime()))return "Date unavailable";
    return date.toLocaleString();
}

function shortId(value){
    const id=String(value||"");
    if(id.length<=14)return id;
    return id.slice(0,8)+"…"+id.slice(-4);
}

function getDescription(transaction){
    if(transaction.note)return transaction.note;
    if(getType(transaction)==="sent"){
        return transaction.receiver_id
            ? "To "+shortId(transaction.receiver_id)
            : "Money transfer";
    }
    return transaction.sender_id
        ? "From "+shortId(transaction.sender_id)
        : "Money transfer";
}

function escapeHtml(value){
    const div=document.createElement("div");
    div.textContent=String(value??"");
    return div.innerHTML;
}

function createTransaction(transaction){
    const type=getType(transaction);
    const currency=getCurrency(transaction);
    const amount=getAmount(transaction);
    const date=getDate(transaction);
    const description=getDescription(transaction);
    const icon=type==="sent"?"fa-arrow-up":"fa-arrow-down";
    const sign=type==="received"?"+":"-";

    const item=document.createElement("div");
    item.className="transaction";

    item.innerHTML=`
        <div class="icon">
            <i class="fa-solid ${icon}"></i>
        </div>
        <div class="info">
            <strong>${type==="sent"?"Sent":"Received"} ${escapeHtml(currency)}</strong>
            <span>${escapeHtml(description)}</span>
            <span>${escapeHtml(date)}</span>
        </div>
        <div class="amount ${type}">
            ${sign}${escapeHtml(amount)} ${escapeHtml(currency)}
            <small>${type.toUpperCase()}</small>
        </div>
    `;
    return item;
}

function renderHistory(){
    const list=document.getElementById("historyList");
    const typeFilter=document.getElementById("typeFilter").value;
    const currencyFilter=document.getElementById("currencyFilter").value;

    let transactions=[...historyCache].filter(transaction=>{
        const type=getType(transaction);
        const currency=getCurrency(transaction);
        const typeOK=typeFilter==="all"||typeFilter==="all-transfer"||type===typeFilter;
        const currencyOK=currencyFilter==="all"||currency===currencyFilter;
        return typeOK&&currencyOK;
    });

    document.getElementById("transactionCount").textContent=
        transactions.length+(transactions.length===1?" transaction":" transactions");

    list.innerHTML="";

    if(!transactions.length){
        list.innerHTML=`
            <div class="empty">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <h3>No transactions yet</h3>
                <p>Your completed HAVKAR wallet transfers will appear here.</p>
            </div>`;
        return;
    }

    transactions.forEach(transaction=>{
        list.appendChild(createTransaction(transaction));
    });
}

async function loadHistory(){
    const list=document.getElementById("historyList");

    list.innerHTML=`
        <div class="empty">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <h3>Loading transactions...</h3>
        </div>`;

    try{
        const {data,error}=await db.auth.getUser();
        if(error)throw error;

        currentUser=data.user||null;

        if(!currentUser){
            historyCache=[];
            document.getElementById("transactionCount").textContent=
                "Sign in to view your transaction history";
            list.innerHTML=`
                <div class="empty">
                    <i class="fa-solid fa-user-lock"></i>
                    <h3>Please sign in</h3>
                    <p>Sign in to view your HAVKAR wallet transactions.</p>
                </div>`;
            return;
        }

        historyCache=await getTransactions();
        renderHistory();

    }catch(error){
        console.error("History load error:",error);
        historyCache=[];
        document.getElementById("transactionCount").textContent=
            "Unable to load transaction history";
        list.innerHTML=`
            <div class="empty">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <h3>Could not load history</h3>
                <p>${escapeHtml(error.message||"Please try again.")}</p>
            </div>`;
    }
}

document.getElementById("typeFilter").addEventListener("change",renderHistory);
document.getElementById("currencyFilter").addEventListener("change",renderHistory);
document.addEventListener("DOMContentLoaded",loadHistory);

</script>

<script src="/havkar-i18n.js"></script>

</body>
</html>
