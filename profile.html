<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HAVKAR - Profile</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
    padding-bottom:90px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#689f38,#7cb342);
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn{
    border:0;
    background:none;
    color:white;
    font-size:24px;
    cursor:pointer;
}

.header h1{
    font-size:21px;
}

.refresh-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:17px;
    cursor:pointer;
}

/* PROFILE */

.profile-card{
    margin:20px;
    padding:25px;
    background:white;
    border-radius:20px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.avatar{
    width:90px;
    height:90px;
    margin:0 auto 15px;
    border-radius:50%;
    background:linear-gradient(135deg,#689f38,#7cb342);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:700;
}

.profile-name{
    font-size:23px;
    font-weight:800;
    margin-bottom:6px;
}

.profile-email{
    color:#888;
    font-size:14px;
    word-break:break-word;
}

/* SECTIONS */

.section-title{
    padding:20px 20px 10px;
    font-size:19px;
    font-weight:700;
}

.info-card{
    margin:0 20px 12px;
    background:white;
    border-radius:15px;
    padding:17px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.info-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.info-row:last-child{
    border-bottom:0;
}

.info-icon{
    width:42px;
    height:42px;
    min-width:42px;
    border-radius:50%;
    background:#e8f5e9;
    color:#558b2f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.info-content{
    flex:1;
    min-width:0;
}

.info-label{
    color:#999;
    font-size:12px;
    margin-bottom:4px;
}

.info-value{
    font-size:15px;
    font-weight:600;
    word-break:break-word;
}

.copy-btn{
    border:0;
    background:#689f38;
    color:white;
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
}

/* ACTIONS */

.action-card{
    margin:0 20px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.action{
    width:100%;
    border:0;
    background:white;
    padding:17px;
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    font-size:15px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.action:last-child{
    border-bottom:0;
}

.action i{
    width:25px;
    color:#689f38;
    font-size:18px;
}

.action.logout{
    color:#d32f2f;
}

.action.logout i{
    color:#d32f2f;
}

/* STATUS */

.loading{
    margin:20px;
    padding:25px;
    background:white;
    border-radius:15px;
    text-align:center;
    color:#999;
}

.error{
    margin:15px 20px;
    padding:14px;
    border-radius:12px;
    background:#ffebee;
    color:#c62828;
    word-break:break-word;
}

.success{
    margin:15px 20px;
    padding:14px;
    border-radius:12px;
    background:#e8f5e9;
    color:#2e7d32;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:75px;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -2px 10px rgba(0,0,0,.1);
    z-index:50;
}

.nav-item{
    color:#999;
    text-align:center;
    font-size:12px;
    cursor:pointer;
}

.nav-item i{
    display:block;
    font-size:21px;
    margin-bottom:5px;
}

.nav-item.active{
    color:#7cb342;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="header-left">

        <button class="back-btn"
                onclick="window.location.href='index.html'">

            <i class="fas fa-arrow-left"></i>

        </button>

        <h1>Profile</h1>

    </div>

    <button class="refresh-btn"
            onclick="loadProfile()">

        <i class="fas fa-rotate"></i>

    </button>

</div>


<div id="pageMessage"></div>


<!-- PROFILE -->

<div id="profileContent">

    <div class="loading">
        Loading profile...
    </div>

</div>


<!-- ACCOUNT INFORMATION -->

<div id="accountSection"
     style="display:none;">

    <div class="section-title">
        Account Information
    </div>

    <div class="info-card">

        <div class="info-row">

            <div class="info-icon">
                <i class="fas fa-user"></i>
            </div>

            <div class="info-content">

                <div class="info-label">
                    User ID
                </div>

                <div class="info-value"
                     id="userId">
                    -
                </div>

            </div>

            <button class="copy-btn"
                    onclick="copyUserId()">

                <i class="fas fa-copy"></i>

            </button>

        </div>


        <div class="info-row">

            <div class="info-icon">
                <i class="fas fa-envelope"></i>
            </div>

            <div class="info-content">

                <div class="info-label">
                    Email
                </div>

                <div class="info-value"
                     id="userEmail">
                    -
                </div>

            </div>

        </div>


        <div class="info-row">

            <div class="info-icon">
                <i class="fas fa-calendar"></i>
            </div>

            <div class="info-content">

                <div class="info-label">
                    Account Created
                </div>

                <div class="info-value"
                     id="createdAt">
                    -
                </div>

            </div>

        </div>

    </div>


    <!-- ACTIONS -->

    <div class="section-title">
        Account
    </div>

    <div class="action-card">

        <button class="action"
                onclick="window.location.href='wallet.html'">

            <i class="fas fa-wallet"></i>

            <span>
                My Wallet
            </span>

        </button>


        <button class="action"
                onclick="window.location.href='history.html'">

            <i class="fas fa-history"></i>

            <span>
                Transaction History
            </span>

        </button>


        <button class="action"
                onclick="window.location.href='market.html'">

            <i class="fas fa-chart-line"></i>

            <span>
                Cryptocurrency Market
            </span>

        </button>


        <button class="action"
                onclick="window.location.href='support.html'">

            <i class="fas fa-headset"></i>

            <span>
                Support
            </span>

        </button>


        <button class="action logout"
                onclick="logout()">

            <i class="fas fa-right-from-bracket"></i>

            <span>
                Log Out
            </span>

        </button>

    </div>

</div>


<!-- NOT LOGGED IN -->

<div id="loginSection"
     style="display:none;">

    <div class="info-card"
         style="text-align:center;">

        <div class="info-icon"
             style="margin:0 auto 15px;">

            <i class="fas fa-user-lock"></i>

        </div>

        <h3 style="margin-bottom:8px;">
            Not Logged In
        </h3>

        <p style="color:#999;margin-bottom:18px;">
            Please log in to view your profile.
        </p>

        <button class="copy-btn"
                style="padding:12px 20px;"
                onclick="window.location.href='login.html'">

            Go to Login

        </button>

    </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <div class="nav-item"
         onclick="window.location.href='wallet.html'">

        <i class="fas fa-wallet"></i>
        Wallet

    </div>


    <div class="nav-item"
         onclick="window.location.href='market.html'">

        <i class="fas fa-chart-line"></i>
        Market

    </div>


    <div class="nav-item"
         onclick="window.location.href='trade.html'">

        <i class="fas fa-exchange-alt"></i>
        Trade

    </div>


    <div class="nav-item"
         onclick="window.location.href='history.html'">

        <i class="fas fa-history"></i>
        History

    </div>


    <div class="nav-item active">

        <i class="fas fa-user"></i>
        Profile

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE
========================================== */

const supabase =
    window.supabase.createClient(

        "https://iompzwaxuirvatiibrtb.supabase.com",

        "sb_publishable_oEKE1vl6EkWXdETgy9MjHw_DUTJLN4O"

    );


let currentUser = null;


/* ==========================================
   GET USER
========================================== */

async function getCurrentUser(){

    try{

        const result =
            await supabase.auth.getUser();

        if(result.error){

            console.error(
                "Auth error:",
                result.error
            );

            return null;

        }

        return result.data.user || null;

    }
    catch(error){

        console.error(
            "Get user error:",
            error
        );

        return null;

    }

}


/* ==========================================
   LOAD PROFILE
========================================== */

async function loadProfile(){

    const content =
        document.getElementById(
            "profileContent"
        );

    const accountSection =
        document.getElementById(
            "accountSection"
        );

    const loginSection =
        document.getElementById(
            "loginSection"
        );

    const message =
        document.getElementById(
            "pageMessage"
        );


    message.innerHTML = "";

    content.innerHTML =
        '<div class="loading">Loading profile...</div>';

    accountSection.style.display =
        "none";

    loginSection.style.display =
        "none";


    const user =
        await getCurrentUser();


    if(!user){

        currentUser = null;

        content.innerHTML = "";

        loginSection.style.display =
            "block";

        return;

    }


    currentUser = user;


    const metadata =
        user.user_metadata || {};


    const name =
        metadata.full_name ||
        metadata.name ||
        metadata.username ||
        "HAVKAR User";


    const email =
        user.email ||
        "No email";


    const avatarLetter =
        String(name)
            .trim()
            .charAt(0)
            .toUpperCase() || "H";


    content.innerHTML = `

        <div class="profile-card">

            <div class="avatar">

                ${escapeHtml(avatarLetter)}

            </div>

            <div class="profile-name">

                ${escapeHtml(name)}

            </div>

            <div class="profile-email">

                ${escapeHtml(email)}

            </div>

        </div>

    `;


    document.getElementById("userId")
        .textContent =
        user.id;


    document.getElementById("userEmail")
        .textContent =
        email;


    document.getElementById("createdAt")
        .textContent =
        user.created_at
        ? new Date(
            user.created_at
          ).toLocaleString()
        : "-";


    accountSection.style.display =
        "block";

}


/* ==========================================
   COPY USER ID
========================================== */

async function copyUserId(){

    if(!currentUser){

        return;

    }


    try{

        await navigator.clipboard.writeText(
            currentUser.id
        );


        showMessage(
            "User ID copied successfully.",
            "success"
        );

    }
    catch(error){

        showMessage(
            "Could not copy User ID.",
            "error"
        );

    }

}


/* ==========================================
   LOGOUT
========================================== */

async function logout(){

    try{

        const {
            error
        } =
        await supabase.auth.signOut();


        if(error){

            console.error(
                "Logout error:",
                error
            );

            showMessage(
                error.message,
                "error"
            );

            return;

        }


        window.location.href =
            "login.html";

    }
    catch(error){

        console.error(
            "Logout exception:",
            error
        );

        showMessage(
            "Could not log out.",
            "error"
        );

    }

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    type
){

    const element =
        document.getElementById(
            "pageMessage"
        );


    element.innerHTML = `

        <div class="${type}">

            ${escapeHtml(text)}

        </div>

    `;

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   AUTH STATE
========================================== */

supabase.auth.onAuthStateChange(
    function(event,session){

        if(
            session &&
            session.user
        ){

            currentUser =
                session.user;

        }
        else{

            currentUser = null;

        }

    }
);


/* ==========================================
   START
========================================== */

loadProfile();

</script>

</body>
</html>
