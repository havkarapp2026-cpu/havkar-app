<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HAVKAR - Profile</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f5f5f5;
    color:#333;

    padding-bottom:90px;
}

/* =========================
   HEADER
========================= */

.header{
    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color:white;

    padding:15px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:
        0 2px 10px rgba(0,0,0,.12);
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn{
    border:0;
    background:none;
    color:white;

    font-size:25px;

    cursor:pointer;
}

.header h1{
    font-size:21px;
}

.refresh-btn{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:
        rgba(255,255,255,.20);

    color:white;

    cursor:pointer;

    font-size:17px;
}

.refresh-btn:disabled{
    opacity:.55;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:none;

    margin:15px 20px;

    padding:14px;

    border-radius:12px;

    font-size:14px;

    word-break:break-word;
}

.message.error{
    display:block;

    background:#ffebee;

    color:#c62828;
}

.message.success{
    display:block;

    background:#e8f5e9;

    color:#2e7d32;
}

/* =========================
   LOADING
========================= */

.loading{
    margin:20px;

    padding:25px;

    background:white;

    border-radius:15px;

    text-align:center;

    color:#999;

    box-shadow:
        0 2px 8px rgba(0,0,0,.05);
}

/* =========================
   PROFILE CARD
========================= */

.profile-card{
    margin:20px;

    padding:28px 20px;

    background:white;

    border-radius:20px;

    text-align:center;

    box-shadow:
        0 3px 15px rgba(0,0,0,.08);
}

/* =========================
   PROFILE AVATAR
========================= */

.avatar-wrapper{
    position:relative;

    width:110px;
    height:110px;

    margin:0 auto 15px;
}

.avatar{
    width:110px;
    height:110px;

    border-radius:50%;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #689f38,
            #7cb342
        );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;
    font-weight:800;

    border:4px solid white;

    box-shadow:
        0 3px 12px rgba(0,0,0,.15);
}

.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

/* =========================
   AVATAR EDIT BUTTON
========================= */

.avatar-edit{
    position:absolute;

    right:-2px;
    bottom:-2px;

    width:38px;
    height:38px;

    border:3px solid white;

    border-radius:50%;

    background:#689f38;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 2px 8px rgba(0,0,0,.18);

    font-size:15px;
}

.avatar-edit:active{
    transform:scale(.96);
}

#avatarInput{
    display:none;
}

/* =========================
   PROFILE NAME
========================= */

.profile-name{
    font-size:23px;

    font-weight:800;

    margin-bottom:6px;
}

.profile-email{
    color:#888;

    font-size:14px;

    word-break:break-word;
}

/* =========================
   PROFILE PHOTO ACTIONS
========================= */

.photo-actions{
    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:18px;

    flex-wrap:wrap;
}

.photo-btn{
    border:0;

    padding:10px 14px;

    border-radius:10px;

    cursor:pointer;

    font-weight:700;

    font-size:13px;

    display:flex;

    align-items:center;

    gap:7px;
}

.photo-btn.primary{
    background:#689f38;
    color:white;
}

.photo-btn.secondary{
    background:#eeeeee;
    color:#444;
}

.photo-btn.danger{
    background:#ffebee;
    color:#c62828;
}

.photo-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================
   SECTION
========================= */

.section-title{
    padding:20px 20px 10px;

    font-size:19px;

    font-weight:700;
}

/* =========================
   INFORMATION CARD
========================= */

.info-card{
    margin:0 20px 12px;

    background:white;

    border-radius:15px;

    padding:5px 17px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.info-row{
    min-height:70px;

    display:flex;

    align-items:center;

    gap:14px;

    border-bottom:1px solid #eee;
}

.info-row:last-child{
    border-bottom:0;
}

.info-icon{
    width:42px;
    height:42px;

    min-width:42px;

    border-radius:50%;

    background:#e8f5e9;

    color:#558b2f;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;
}

.info-content{
    flex:1;

    min-width:0;
}

.info-label{
    color:#999;

    font-size:12px;

    margin-bottom:4px;
}

.info-value{
    font-size:14px;

    font-weight:600;

    word-break:break-word;
}

.copy-btn{
    border:0;

    background:#689f38;

    color:white;

    padding:9px 11px;

    border-radius:8px;

    cursor:pointer;
}

/* =========================
   ACTIONS
========================= */

.action-card{
    margin:0 20px;

    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.action{
    width:100%;

    border:0;

    background:white;

    padding:17px;

    display:flex;

    align-items:center;

    gap:14px;

    text-align:left;

    font-size:15px;

    cursor:pointer;

    border-bottom:1px solid #eee;
}

.action:last-child{
    border-bottom:0;
}

.action i{
    width:25px;

    color:#689f38;

    font-size:18px;
}

.action.logout{
    color:#d32f2f;
}

.action.logout i{
    color:#d32f2f;
}

/* =========================
   LOGIN
========================= */

.login-card{
    margin:20px;

    padding:28px 20px;

    background:white;

    border-radius:15px;

    text-align:center;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.login-icon{
    width:65px;
    height:65px;

    margin:0 auto 15px;

    border-radius:50%;

    background:#e8f5e9;

    color:#689f38;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;
}

.login-card h3{
    margin-bottom:8px;
}

.login-card p{
    color:#999;

    margin-bottom:18px;
}

.login-btn{
    border:0;

    background:#689f38;

    color:white;

    padding:13px 22px;

    border-radius:10px;

    font-weight:700;

    cursor:pointer;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:75px;

    background:white;

    display:flex;

    justify-content:space-around;

    align-items:center;

    box-shadow:
        0 -2px 10px rgba(0,0,0,.10);

    z-index:100;
}

.nav-item{
    color:#999;

    text-align:center;

    font-size:12px;

    cursor:pointer;
}

.nav-item i{
    display:block;

    font-size:21px;

    margin-bottom:5px;
}

.nav-item.active{
    color:#7cb342;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .profile-card{
        margin:16px;
        padding:25px 15px;
    }

    .photo-actions{
        gap:8px;
    }

    .photo-btn{
        padding:9px 11px;
    }

}

</style>

</head>

<!-- =========================
     SUPABASE

<script type="module">

import {
    createClient
}
from "https://esm.sh/@supabase/supabase-js@2";


/* =========================================
   SAME SUPABASE AS LOGIN + SIGNUP
========================================= */

const SUPABASE_URL =
    "https://gispovnciifgikvgpzck.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_KD8yd063Xik2oMyjevwWYg_tJK2jEKq";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;

let isLoading = false;


/* =========================================
   NAVIGATION
========================================= */

window.goTo =
function(page){

    window.location.href =
        page;

};


window.goBack =
function(){

    window.location.href =
        "index.html";

};


/* =========================================
   MESSAGE
========================================= */

function clearMessage(){

    const message =
        document.getElementById(
            "message"
        );

    message.className =
        "message";

    message.textContent =
        "";

}


function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );

    message.className =
        "message " + type;

    message.textContent =
        text;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    value
){

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   AVATAR URL
========================================= */

function getAvatarUrl(user){

    if(!user){

        return "";

    }


    const metadata =
        user.user_metadata || {};


    return (
        metadata.avatar_url ||
        ""
    );

}


/* =========================================
   RENDER AVATAR
========================================= */

function renderAvatar(
    name,
    avatarUrl
){

    const firstLetter =
        String(name)
            .trim()
            .charAt(0)
            .toUpperCase() ||
        "H";


    if(avatarUrl){

        return `

            <img
                src="${escapeHtml(avatarUrl)}"
                alt="Profile photo"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

            <span style="display:none;">
                ${escapeHtml(firstLetter)}
            </span>

        `;

    }


    return `
        <span>
            ${escapeHtml(firstLetter)}
        </span>
    `;

}


/* =========================================
   LOAD PROFILE
========================================= */

window.loadProfile =
async function(
    manualRefresh = false
){

    if(isLoading){

        return;

    }


    isLoading = true;


    const area =
        document.getElementById(
            "profileArea"
        );


    const accountArea =
        document.getElementById(
            "accountArea"
        );


    const loginArea =
        document.getElementById(
            "loginArea"
        );


    const refreshBtn =
        document.getElementById(
            "refreshBtn"
        );


    clearMessage();


    accountArea.style.display =
        "none";


    loginArea.style.display =
        "none";


    area.innerHTML =
        '<div class="loading">Loading profile...</div>';


    refreshBtn.disabled =
        true;


    try{

        const {
            data,
            error
        } =
        await supabase.auth.getSession();


        if(error){

            throw error;

        }


        const session =
            data
            ? data.session
            : null;


        if(
            !session ||
            !session.user
        ){

            currentUser =
                null;


            area.innerHTML =
                "";


            loginArea.style.display =
                "block";


            return;

        }


        currentUser =
            session.user;


        const user =
            currentUser;


        const metadata =
            user.user_metadata || {};


        const name =
            metadata.full_name ||
            metadata.name ||
            metadata.username ||
            user.email ||
            "HAVKAR User";


        const email =
            user.email ||
            "No email";


        const avatarUrl =
            getAvatarUrl(user);


        /*
         * PROFILE CARD
         */

        area.innerHTML = `

            <div class="profile-card">

                <div class="avatar-wrapper">

                    <div
                        class="avatar"
                        id="avatarDisplay">

                        ${renderAvatar(
                            name,
                            avatarUrl
                        )}

                    </div>


                    <button
                        class="avatar-edit"
                        type="button"
                        title="Change profile photo"
                        onclick="openAvatarPicker()">

                        <i class="fas fa-camera"></i>

                    </button>

                </div>


                <input
                    type="file"
                    id="avatarInput"
                    accept="image/jpeg,image/png,image/webp"
                    onchange="handleAvatarSelected(event)">


                <div class="profile-name">

                    ${escapeHtml(name)}

                </div>


                <div class="profile-email">

                    ${escapeHtml(email)}

                </div>


                <div class="photo-actions">

                    <button
                        class="photo-btn primary"
                        id="changePhotoBtn"
                        type="button"
                        onclick="openAvatarPicker()">

                        <i class="fas fa-camera"></i>

                        Change Photo

                    </button>


                    ${
                        avatarUrl
                        ?
                        `
                        <button
                            class="photo-btn danger"
                            id="removePhotoBtn"
                            type="button"
                            onclick="removeAvatar()">

                            <i class="fas fa-trash"></i>

                            Remove Photo

                        </button>
                        `
                        :
                        ""
                    }

                </div>

            </div>

        `;


        /*
         * ACCOUNT INFORMATION
         */

        document.getElementById(
            "userId"
        ).textContent =
            user.id || "-";


        document.getElementById(
            "userEmail"
        ).textContent =
            email;


        document.getElementById(
            "createdAt"
        ).textContent =
            user.created_at
            ? new Date(
                user.created_at
              ).toLocaleString()
            : "-";


        accountArea.style.display =
            "block";

    }
    catch(error){

        console.error(
            "Profile error:",
            error
        );


        currentUser =
            null;


        area.innerHTML =
            `
            <div class="loading">
                Unable to load profile.
            </div>
            `;


        showMessage(
            "Profile error: " +
            (
                error.message ||
                "Unknown error"
            ),
            "error"
        );

    }
    finally{

        isLoading =
            false;


        refreshBtn.disabled =
            false;

    }

};


/* =========================================
   OPEN AVATAR PICKER
========================================= */

window.openAvatarPicker =
function(){

    if(!currentUser){

        showMessage(
            "Please log in first.",
            "error"
        );

        return;

    }


    const input =
        document.getElementById(
            "avatarInput"
        );


    if(input){

        input.click();

    }

};


/* =========================================
   HANDLE AVATAR SELECTED
========================================= */

window.handleAvatarSelected =
async function(event){

    const input =
        event.target;


    if(
        !input ||
        !input.files ||
        !input.files.length
    ){

        return;

    }


    const file =
        input.files[0];


    /*
     * Allowed image types.
     */

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];


    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        showMessage(
            "Please select a JPG, PNG or WEBP image.",
            "error"
        );

        input.value =
            "";

        return;

    }


    /*
     * Maximum size: 5 MB
     */

    const maxSize =
        5 * 1024 * 1024;


    if(file.size > maxSize){

        showMessage(
            "Profile photo must be smaller than 5 MB.",
            "error"
        );

        input.value =
            "";

        return;

    }


    if(!currentUser){

        showMessage(
            "Please log in first.",
            "error"
        );

        return;

    }


    const changeButton =
        document.getElementById(
            "changePhotoBtn"
        );


    if(changeButton){

        changeButton.disabled =
            true;

        changeButton.innerHTML =
            `
            <i class="fas fa-spinner fa-spin"></i>
            Uploading...
            `;

    }


    clearMessage();


    try{

        /*
         * Unique storage path.
         */

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const filePath =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            crypto.randomUUID() +
            "." +
            extension;


        /*
         * Upload image to Supabase Storage.
         */

        const {
            error: uploadError
        } =
        await supabase.storage
            .from("avatars")
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:file.type
                }
            );


        if(uploadError){

            throw uploadError;

        }


        /*
         * Get public URL.
         */

        const {
            data:publicData
        } =
        supabase.storage
            .from("avatars")
            .getPublicUrl(
                filePath
            );


        const publicUrl =
            publicData &&
            publicData.publicUrl
            ? publicData.publicUrl
            : "";


        if(!publicUrl){

            throw new Error(
                "Could not create image URL."
            );

        }


        /*
         * Save URL inside Supabase Auth metadata.
         */

        const {
            data:updateData,
            error:updateError
        } =
        await supabase.auth.updateUser({

            data:{
                avatar_url:
                    publicUrl
            }

        });


        if(updateError){

            throw updateError;

        }


        /*
         * Update local user immediately.
         */

        if(
            updateData &&
            updateData.user
        ){

            currentUser =
                updateData.user;

        }


        showMessage(
            "Profile photo updated successfully.",
            "success"
        );


        /*
         * Reload profile.
         */

        await loadProfile(true);

    }
    catch(error){

        console.error(
            "Avatar upload error:",
            error
        );


        showMessage(
            "Could not upload profile photo: " +
            (
                error.message ||
                "Unknown error"
            ),
            "error"
        );

    }
    finally{

        input.value =
            "";


        if(changeButton){

            changeButton.disabled =
                false;

            changeButton.innerHTML =
                `
                <i class="fas fa-camera"></i>
                Change Photo
                `;

        }

    }

};


/* =========================================
   REMOVE AVATAR
========================================= */

window.removeAvatar =
async function(){

    if(!currentUser){

        showMessage(
            "Please log in first.",
            "error"
        );

        return;

    }


    const metadata =
        currentUser.user_metadata || {};


    const avatarUrl =
        metadata.avatar_url || "";


    if(!avatarUrl){

        showMessage(
            "No profile photo to remove.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Remove your profile photo?"
        );


    if(!confirmed){

        return;

    }


    const removeButton =
        document.getElementById(
            "removePhotoBtn"
        );


    if(removeButton){

        removeButton.disabled =
            true;

        removeButton.innerHTML =
            `
            <i class="fas fa-spinner fa-spin"></i>
            Removing...
            `;

    }


    try{

        /*
         * Remove the URL from user metadata.
         */

        const {
            data:updateData,
            error:updateError
        } =
        await supabase.auth.updateUser({

            data:{
                avatar_url:null
            }

        });


        if(updateError){

            throw updateError;

        }


        if(
            updateData &&
            updateData.user
        ){

            currentUser =
                updateData.user;

        }


        /*
         * The profile will immediately
         * return to the user's first letter.
         */

        showMessage(
            "Profile photo removed.",
            "success"
        );


        await loadProfile(true);

    }
    catch(error){

        console.error(
            "Remove avatar error:",
            error
        );


        showMessage(
            "Could not remove profile photo: " +
            (
                error.message ||
                "Unknown error"
            ),
            "error"
        );

    }
    finally{

        if(removeButton){

            removeButton.disabled =
                false;

        }

    }

};


/* =========================================
   COPY USER ID
========================================= */

window.copyUserId =
async function(){

    if(!currentUser){

        showMessage(
            "User ID is not available.",
            "error"
        );

        return;

    }


    const userId =
        currentUser.id;


    try{

        await navigator.clipboard.writeText(
            userId
        );


        showMessage(
            "User ID copied.",
            "success"
        );

    }
    catch(error){

        try{

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                userId;


            textarea.style.position =
                "fixed";


            textarea.style.opacity =
                "0";


            document.body.appendChild(
                textarea
            );


            textarea.focus();


            textarea.select();


            document.execCommand(
                "copy"
            );


            textarea.remove();


            showMessage(
                "User ID copied.",
                "success"
            );

        }
        catch(copyError){

            console.error(
                "Copy error:",
                copyError
            );


            showMessage(
                "Could not copy User ID.",
                "error"
            );

        }

    }

};


/* =========================================
   LOGOUT
========================================= */

window.logout =
async function(){

    try{

        const {
            error
        } =
        await supabase.auth.signOut();


        if(error){

            throw error;

        }


        currentUser =
            null;


        window.location.replace(
            "login.html"
        );

    }
    catch(error){

        console.error(
            "Logout error:",
            error
        );


        showMessage(
            "Logout error: " +
            (
                error.message ||
                "Unknown error"
            ),
            "error"
        );

    }

};


/* =========================================
   AUTH STATE
========================================= */

supabase.auth.onAuthStateChange(
    function(
        event,
        session
    ){

        if(
            session &&
            session.user
        ){

            currentUser =
                session.user;

        }
        else{

            currentUser =
                null;

        }

    }
);

   START
========================================= */

loadProfile();
