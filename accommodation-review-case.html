<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#609b38">
<title>HAVKAR | Accommodation review case</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/havkar-accommodation.css">
</head>
<body data-accommodation-page="review-case">
<header>
  <div class="header-inner top">
    <button class="back" type="button" id="backButton" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
    <div>
      <h1>Review case</h1>
      <p class="subtitle">A property decision does not verify identity and does not publish the listing.</p>
    </div>
  </div>
</header>
<main>
  <div class="card">
    <p id="case">Loading the case.</p>
    <label for="decision">Property decision</label>
    <select id="decision">
      <option value="needs_more_info">Needs more information</option>
      <option value="rejected">Reject</option>
      <option value="approved">Approve property</option>
      <option value="suspended">Suspend</option>
      <option value="revoked">Revoke</option>
    </select>
    <label for="notes">Notes</label>
    <textarea id="notes" maxlength="2000"></textarea>
    <button class="primary" id="recordDecision" type="button">Record decision</button>
    <p id="message" class="error" role="status"></p>
  </div>
</main>
<nav class="bottom" aria-label="Accommodation">
  <a href="accommodation-review.html"><strong>Queue</strong></a>
  <a href="accommodation.html"><strong>Listings</strong></a>
</nav>
<script src="/havkar-supabase-config.js"></script>
<script src="/havkar-accommodation.js"></script>
<script type="module" src="/havkar-accommodation-ui.js"></script>
<script>
document.getElementById("backButton").addEventListener("click", function () {
  if (window.havkarNavigateBack) window.havkarNavigateBack();
  else window.location.href = "accommodation-review.html";
});
</script>
<script src="/havkar-i18n.js"></script>
<script src="/havkar-page-back.js"></script>
</body>
</html>
