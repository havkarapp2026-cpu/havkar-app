<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/havkar-icon-32-20261022-v3.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<title>HAVKAR | Health provider</title>
<style>
:root{--g:#1b5e20}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Iowan Old Style",serif;background:linear-gradient(180deg,#f4faf5,#e6f0e8);color:#123}
header{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
.wrap{max-width:820px;margin:0 auto;padding:14px 16px}
.card{background:#fff;border:1px solid #d7e6db;border-radius:14px;padding:14px;margin-top:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
.ok{background:#e8f5e9;color:#1b5e20}.warn{background:#fff8e1;color:#8a4b08}
.notice{margin-top:12px;background:#f7fcf7;border:1px solid #cfe0d3;border-radius:12px;padding:12px;line-height:1.45;color:#456}
a{color:var(--g);font-weight:700}
label{display:block;margin-top:10px;font-size:13px}
input,button,textarea,select{font:inherit;width:100%;min-height:42px;border-radius:10px;padding:8px 10px}
input,textarea,select{border:1px solid #cfd}
button{border:0;background:var(--g);color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-top:0;padding-bottom:0">
    <h1 id="title" style="margin:0;font-size:1.25rem">Provider</h1>
    <p id="subtitle" style="margin:6px 0 0;opacity:.95"></p>
  </div>
</header>
<main class="wrap">
  <div class="card" id="profile">Loading…</div>
  <div class="card">
    <h2 style="margin:0 0 8px;font-size:1.05rem;color:var(--g)">Open appointment slots</h2>
    <div id="slots">Loading slots…</div>
    <p id="bookStatus" role="status"></p>
  </div>
  <div class="card">
    <h2 style="margin:0 0 8px;font-size:1.05rem;color:var(--g)">Secure text messaging</h2>
    <p class="notice" style="margin-top:0">Voice/video are BLOCKED. Text only. Minimize health details. Explicit consent required. Patients: free.</p>
    <label><input id="consent" type="checkbox"> I consent to platform messaging and will minimize sensitive health data.</label>
    <label for="msg">Message</label>
    <textarea id="msg" maxlength="2000"></textarea>
    <button type="button" id="msgBtn">Send message</button>
    <div id="thread"></div>
    <p id="msgStatus" role="status"></p>
  </div>
  <div class="card">
    <h2 style="margin:0 0 8px;font-size:1.05rem;color:var(--g)">Patient reviews</h2>
    <div id="reviews">Loading…</div>
    <label for="rating">Your rating (1–5)</label>
    <select id="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
    <label for="reviewText">Review text</label>
    <textarea id="reviewText" maxlength="2000"></textarea>
    <button type="button" id="reviewBtn">Submit review</button>
    <p id="reviewStatus" role="status"></p>
  </div>
  <p><a href="health.html">Directory</a> · <a href="reviews.html?mine=1">My Reviews</a> · <a href="health-rankings.html">Rankings</a></p>
</main>
<script src="/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id") || "";
  var token = "";

  async function api(action, body) {
    var res = await fetch("/api/health", {
      method: "POST",
      headers: Object.assign(
        { "Content-Type": "application/json" },
        token ? { Authorization: "Bearer " + token } : {}
      ),
      body: JSON.stringify(Object.assign({ action: action }, body || {}))
    });
    return { status: res.status, json: await res.json() };
  }

  async function ensureAuth() {
    if (token) return true;
    var client = window.supabase && window.SUPABASE_URL
      ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
      : null;
    if (!client) return false;
    var session = (await client.auth.getSession()).data.session;
    if (!session) {
      location.href = "login.html?next=" + encodeURIComponent(location.pathname + location.search);
      return false;
    }
    token = session.access_token;
    return true;
  }

  async function load() {
    if (!id) {
      document.getElementById("profile").textContent = "Missing provider id.";
      return;
    }
    var res = await api("health_provider_get", { id: id });
    if (!res.json.ok) {
      document.getElementById("profile").textContent = res.json.error || "Provider not found";
      return;
    }
    var p = res.json.provider;
    document.getElementById("title").textContent = p.display_name;
    document.getElementById("subtitle").textContent =
      [p.category_id, p.city, p.country_code].filter(Boolean).join(" · ");
    var verified = p.license_status === "verified";
    var profile = document.getElementById("profile");
    profile.innerHTML =
      "<span class=\"badge " + (verified ? "ok" : "warn") + "\"></span>" +
      "<p></p><p></p><p></p><p class=\"notice\"></p>";
    profile.querySelector(".badge").textContent = verified
      ? "Verified license"
      : "Unverified — not labeled as a verified doctor/pharmacy";
    var ps = profile.querySelectorAll("p");
    ps[0].textContent = "Specialties: " + ((p.specialties || []).join(", ") || "—");
    ps[1].textContent = "Languages: " + ((p.languages || []).join(", ") || "—");
    ps[2].textContent = p.bio || "No public bio yet.";
    ps[3].textContent = res.json.self_reported_label;
    if (p.latitude != null && p.longitude != null) {
      var a = document.createElement("a");
      a.href =
        "https://www.openstreetmap.org/directions?from=&to=" +
        encodeURIComponent(p.latitude + "," + p.longitude);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Directions";
      profile.appendChild(a);
    }
    loadSlots();
    loadReviews();
  }

  async function loadSlots() {
    var box = document.getElementById("slots");
    var res = await api("health_availability_list", { provider_id: id });
    var slots = (res.json && res.json.slots) || [];
    if (!slots.length) {
      box.textContent = "No open slots published.";
      return;
    }
    box.innerHTML = "";
    slots.forEach(function (s) {
      var row = document.createElement("div");
      row.style.margin = "8px 0";
      row.innerHTML = "<div></div><button type='button'>Request this slot</button>";
      row.querySelector("div").textContent = s.modality + " · " + s.starts_at + " → " + s.ends_at;
      row.querySelector("button").onclick = async function () {
        if (!(await ensureAuth())) return;
        document.getElementById("bookStatus").textContent = "Requesting…";
        var book = await api("health_appointment_request", {
          provider_id: id,
          starts_at: s.starts_at,
          ends_at: s.ends_at,
          modality: s.modality
        });
        document.getElementById("bookStatus").textContent = book.json.ok
          ? "Requested · patient fee: free · status " + book.json.appointment.status
          : (book.json.error || "Failed") + (book.json.note ? " — " + book.json.note : "");
      };
      box.appendChild(row);
    });
  }

  async function loadReviews() {
    var box = document.getElementById("reviews");
    var res = await api("health_reviews_list", { provider_id: id });
    var rows = (res.json && res.json.reviews) || [];
    if (!rows.length) {
      box.textContent = "No published health reviews yet.";
      return;
    }
    box.innerHTML = "";
    rows.forEach(function (r) {
      var card = document.createElement("div");
      card.style.margin = "8px 0";
      card.innerHTML = "<strong></strong><p></p><p></p>";
      card.querySelector("strong").textContent =
        r.rating + " ★" + (r.verified_visit ? " · verified visit" : "");
      card.querySelectorAll("p")[0].textContent = r.review_text || "";
      card.querySelectorAll("p")[1].textContent = r.provider_reply
        ? "Provider reply: " + r.provider_reply
        : "";
      box.appendChild(card);
    });
  }

  document.getElementById("msgBtn").onclick = async function () {
    if (!(await ensureAuth())) return;
    document.getElementById("msgStatus").textContent = "Sending…";
    var res = await api("health_message_send", {
      provider_id: id,
      body: document.getElementById("msg").value,
      consent_acknowledged: document.getElementById("consent").checked
    });
    document.getElementById("msgStatus").textContent = res.json.ok
      ? "Message sent (text only). Voice/video BLOCKED."
      : (res.json.error || "Failed") + (res.json.note ? " — " + res.json.note : "");
    if (res.json.ok) {
      var list = await api("health_message_list", { provider_id: id });
      var thread = document.getElementById("thread");
      thread.innerHTML = "";
      (list.json.messages || []).forEach(function (m) {
        var p = document.createElement("p");
        p.textContent = m.body;
        thread.appendChild(p);
      });
    }
  };

  document.getElementById("reviewBtn").onclick = async function () {
    if (!(await ensureAuth())) return;
    var res = await api("health_review_create", {
      provider_id: id,
      rating: Number(document.getElementById("rating").value),
      review_text: document.getElementById("reviewText").value
    });
    document.getElementById("reviewStatus").textContent = res.json.ok
      ? "Review saved. Legacy Reviews data unchanged."
      : (res.json.error || "Failed");
    loadReviews();
  };

  load();
})();
</script>
</body>
</html>
