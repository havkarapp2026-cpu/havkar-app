<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/havkar-icon-32-20261022-v3.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<title>HAVKAR | Health provider</title>
<style>
:root{--g:#1b5e20}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Iowan Old Style",serif;background:linear-gradient(180deg,#f4faf5,#e6f0e8);color:#123}
header{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
.wrap{max-width:820px;margin:0 auto;padding:14px 16px}
.card{background:#fff;border:1px solid #d7e6db;border-radius:14px;padding:14px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
.ok{background:#e8f5e9;color:#1b5e20}.warn{background:#fff8e1;color:#8a4b08}
.notice{margin-top:12px;background:#f7fcf7;border:1px solid #cfe0d3;border-radius:12px;padding:12px;line-height:1.45;color:#456}
a{color:var(--g);font-weight:700}
label{display:block;margin-top:10px;font-size:13px}
input,button,textarea{font:inherit;width:100%;min-height:42px;border-radius:10px;padding:8px 10px}
input,textarea{border:1px solid #cfd}
button{border:0;background:var(--g);color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-top:0;padding-bottom:0">
    <h1 id="title" style="margin:0;font-size:1.25rem">Provider</h1>
    <p id="subtitle" style="margin:6px 0 0;opacity:.95"></p>
  </div>
</header>
<main class="wrap">
  <div class="card" id="profile">Loading…</div>
  <div class="card" style="margin-top:12px">
    <h2 style="margin:0 0 8px;font-size:1.05rem;color:var(--g)">Request appointment (patient free)</h2>
    <p class="notice" style="margin-top:0">Voice/video consultations are BLOCKED until telehealth infrastructure and legal requirements are satisfied. In-person and message requests are available when the provider is published.</p>
    <label for="starts">Starts at (ISO)</label>
    <input id="starts" type="datetime-local">
    <label for="ends">Ends at (ISO)</label>
    <input id="ends" type="datetime-local">
    <label for="notes">Notes (minimize health details)</label>
    <textarea id="notes" maxlength="1000"></textarea>
    <button type="button" id="bookBtn">Request in-person appointment</button>
    <p id="bookStatus" role="status"></p>
  </div>
  <p><a href="health.html">Directory</a> · <a href="reviews.html?mine=1">My Reviews</a></p>
</main>
<script src="/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id") || "";
  var profile = document.getElementById("profile");
  var bookStatus = document.getElementById("bookStatus");

  async function load() {
    if (!id) {
      profile.textContent = "Missing provider id.";
      return;
    }
    var res = await fetch("/api/health", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "health_provider_get", id: id })
    });
    var body = await res.json();
    if (!body.ok) {
      profile.textContent = body.error || "Provider not found";
      return;
    }
    var p = body.provider;
    document.getElementById("title").textContent = p.display_name;
    document.getElementById("subtitle").textContent =
      [p.category_id, p.city, p.country_code].filter(Boolean).join(" · ");
    var verified = p.license_status === "verified";
    profile.innerHTML =
      "<span class=\"badge " + (verified ? "ok" : "warn") + "\"></span>" +
      "<p></p><p></p><p></p><p class=\"notice\"></p>";
    profile.querySelector(".badge").textContent = verified
      ? "Verified license"
      : "Unverified — not labeled as a verified doctor/pharmacy";
    var ps = profile.querySelectorAll("p");
    ps[0].textContent = "Specialties: " + ((p.specialties || []).join(", ") || "—");
    ps[1].textContent = "Languages: " + ((p.languages || []).join(", ") || "—");
    ps[2].textContent = p.bio || "No public bio yet.";
    ps[3].textContent = body.self_reported_label;
    if (p.latitude != null && p.longitude != null) {
      var a = document.createElement("a");
      a.href =
        "https://www.openstreetmap.org/directions?from=&to=" +
        encodeURIComponent(p.latitude + "," + p.longitude);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Directions";
      profile.appendChild(a);
    }
  }

  document.getElementById("bookBtn").onclick = async function () {
    bookStatus.textContent = "Submitting…";
    try {
      var client = window.supabase && window.SUPABASE_URL
        ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
        : null;
      if (!client) {
        bookStatus.textContent = "Sign in required.";
        return;
      }
      var session = (await client.auth.getSession()).data.session;
      if (!session) {
        bookStatus.textContent = "Sign in required.";
        location.href = "login.html?next=" + encodeURIComponent(location.pathname + location.search);
        return;
      }
      var starts = document.getElementById("starts").value;
      var ends = document.getElementById("ends").value;
      var res = await fetch("/api/health", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + session.access_token
        },
        body: JSON.stringify({
          action: "health_appointment_request",
          provider_id: id,
          starts_at: starts ? new Date(starts).toISOString() : "",
          ends_at: ends ? new Date(ends).toISOString() : "",
          modality: "in_person",
          notes: document.getElementById("notes").value
        })
      });
      var body = await res.json();
      if (!body.ok) {
        bookStatus.textContent =
          (body.error || "Request failed") +
          (body.reason ? " — " + body.reason : "") +
          (body.note ? " — " + body.note : "");
        return;
      }
      bookStatus.textContent =
        "Appointment " + body.appointment.status + " · patient platform fee: free";
    } catch (e) {
      bookStatus.textContent = "Request failed";
    }
  };

  load();
})();
</script>
</body>
</html>
