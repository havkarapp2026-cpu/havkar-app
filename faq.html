
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#609b38">
<title>HAVKAR | Help & FAQ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --green:#70a942;
  --dark:#47782d;
  --pale:#eff7ea;
  --bg:#f6f8f5;
  --text:#243126;
  --muted:#718074;
  --border:#e1e9df;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  padding-bottom:95px;
}
button,input,select{font:inherit}
button{cursor:pointer}
header{
  background:linear-gradient(130deg,#477d2e,#83b74d);
  color:white;
  padding:22px 16px 42px;
}
.header-inner,main{max-width:900px;margin:auto}
.top{display:flex;align-items:center;gap:13px}
.back{
  width:42px;height:42px;flex-shrink:0;
  border:1px solid #ffffff55;
  border-radius:13px;background:#ffffff25;
  color:white;font-size:18px;
}
.heading{flex:1;min-width:0}
h1{margin:0 0 5px;font-size:25px}
.subtitle{font-size:12px;opacity:.9}
.language{
  max-width:155px;min-width:105px;
  border:1px solid #ffffff70;
  border-radius:12px;
  background:#ffffff26;
  color:white;padding:10px 5px;
  font-size:12px;
}
.language option,.language optgroup{
  color:#243126;background:white;
}
main{position:relative;margin-top:-19px;padding:0 15px}
.search-card{
  display:flex;align-items:center;gap:12px;
  background:white;border:1px solid var(--border);
  border-radius:17px;padding:0 16px;
  box-shadow:0 6px 22px #24471a13;
}
.search-card i{color:var(--green)}
.search-card input{
  flex:1;width:100%;padding:19px 0;
  border:0;outline:0;background:transparent;
  color:var(--text);font-size:14px;
}
.categories{
  display:flex;gap:9px;overflow-x:auto;
  padding:20px 0 17px;
  scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}
.category{
  flex-shrink:0;
  border:1px solid var(--border);
  background:white;color:#637066;
  border-radius:30px;padding:10px 16px;
  font-size:13px;font-weight:600;
}
.category.active{
  background:var(--green);
  border-color:var(--green);color:white;
}
.section-head{
  display:flex;align-items:center;
  justify-content:space-between;
  gap:10px;margin:4px 3px 16px;
}
.section-head h2{margin:0;font-size:19px}
#count{font-size:12px;color:var(--muted)}
.faq-list{display:grid;gap:11px}
.faq{
  background:white;border:1px solid var(--border);
  border-radius:16px;overflow:hidden;
  box-shadow:0 2px 10px #1d341008;
}
.question{
  display:flex;align-items:center;gap:13px;
  width:100%;padding:17px;
  background:transparent;border:0;
  color:var(--text);text-align:start;
  font-size:14px;font-weight:650;line-height:1.6;
}
.question span{flex:1}
.question i{
  flex-shrink:0;color:var(--green);
  transition:transform .2s;
}
.faq.open .question i{transform:rotate(180deg)}
.answer{
  display:none;padding:0 17px 19px;
  color:#59685b;line-height:1.9;
  font-size:14px;white-space:pre-line;
}
.faq.open .answer{display:block}
.tag{
  display:inline-block;
  background:var(--pale);color:var(--dark);
  padding:4px 10px;border-radius:20px;
  font-size:11px;margin-bottom:9px;
}
.empty{
  display:none;text-align:center;
  background:white;border:1px solid var(--border);
  border-radius:17px;padding:35px 18px;
  color:var(--muted);
}
.empty i{font-size:35px;color:var(--green)}
.support{
  margin:25px 0 15px;padding:24px 18px;
  background:linear-gradient(135deg,#edf7e7,white);
  border:1px solid #dcead4;
  border-radius:20px;text-align:center;
}
.support-icon{
  width:55px;height:55px;margin:0 auto 12px;
  display:grid;place-items:center;
  background:#dceecf;color:var(--dark);
  border-radius:17px;font-size:23px;
}
.support h2{font-size:19px;margin:8px 0}
.support p{
  font-size:13px;color:var(--muted);
  line-height:1.8;
}
.support a{
  display:inline-block;
  margin-top:9px;padding:12px 23px;
  background:var(--green);color:white;
  text-decoration:none;border-radius:12px;
  font-size:14px;font-weight:650;
}
footer{
  position:fixed;bottom:0;left:0;right:0;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:white;border-top:1px solid var(--border);
  padding:12px 4px max(12px,env(safe-area-inset-bottom));
  z-index:10;
}
footer a{
  display:flex;align-items:center;
  flex-direction:column;gap:5px;
  color:#7a877c;text-decoration:none;
  font-size:11px;
}
footer i{font-size:20px}
footer a.active{color:var(--green)}
[dir="rtl"] .question{text-align:right}
[dir="rtl"] .categories{direction:rtl}
@media(min-width:700px){
  header{padding-top:35px;padding-bottom:52px}
  h1{font-size:31px}
  main{margin-top:-22px}
  footer{
    max-width:900px;margin:auto;
    border-radius:18px 18px 0 0;
  }
}
</style>
</head>

function normalizeLanguage(value){
 if(!value||typeof value!=="string")return null;
 const raw=value.trim().toLowerCase().replace(/_/g,"-");
 if(translations[raw])return raw;
 if(raw.startsWith("zh"))return "zh";
 if(raw.startsWith("ja"))return "ja";
 if(raw.startsWith("ko"))return "ko";
 if(raw.startsWith("ckb"))return "ckb";
 if(raw.startsWith("kmr")||raw==="ku"||raw.startsWith("ku-latn"))
   return "kmr";
 const base=raw.split("-")[0];
 return translations[base]?base:null;
}

 const params=new URLSearchParams(location.search);
 const fromURL=normalizeLanguage(params.get("lang"));
 if(fromURL)return fromURL;

 const keys=[
  "havkar_language",
  "havkarLanguage",
  "selectedLanguage",
  "selected_language",
  "app_language",
  "language"
 ];

 for(const key of keys){
  try{
   const value=localStorage.getItem(key);
   const lang=normalizeLanguage(value);
   if(lang)return lang;
  }catch(error){}
 }

 return normalizeLanguage(navigator.language)||"en";
}

function saveLanguage(lang){
 try{
  localStorage.setItem("havkar_language",lang);
 }catch(error){}
}

function setLanguage(lang){
 if(!translations[lang])lang="en";
 currentLanguage=lang;
 currentCategory=0;
 searchTerm="";

 const t=translations[lang];
 document.documentElement.lang=lang;
 document.documentElement.dir=
   rtlLanguages.has(lang)?"rtl":"ltr";

 $("language").value=lang;
 $("title").textContent=t.ui[0];
 $("search").placeholder=t.ui[1];
 $("search").value="";
 $("sectionTitle").textContent=t.ui[2];
 $("emptyText").textContent=t.ui[3];
 $("supportTitle").textContent=t.ui[4];
 $("supportText").textContent=t.ui[5];
 $("supportButton").textContent=t.ui[6];
 $("navHome").textContent=t.ui[7];
 $("navMessages").textContent=t.ui[8];
 $("navAlerts").textContent=t.ui[9];
 $("navProfile").textContent=t.ui[10];

 document.title="HAVKAR | "+t.ui[0];
 saveLanguage(lang);
 renderCategories();
 renderQuestions();
}

function renderCategories(){
 const t=translations[currentLanguage];
 const container=$("categories");
 container.replaceChildren();

 t.cats.forEach((label,index)=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="category"+
    (index===currentCategory?" active":"");
  button.textContent=label;
  button.setAttribute(
    "aria-pressed",
    index===currentCategory?"true":"false"
  );

  button.addEventListener("click",()=>{
   currentCategory=index;
   renderCategories();
   renderQuestions();
  });

  container.appendChild(button);
 });
}

function createQuestion(question,answer,categoryLabel){
 const article=document.createElement("article");
 article.className="faq";

 const button=document.createElement("button");
 button.type="button";
 button.className="question";
 button.setAttribute("aria-expanded","false");

 const questionText=document.createElement("span");
 questionText.textContent=question;

 const chevron=document.createElement("i");
 chevron.className="fa-solid fa-chevron-down";
 chevron.setAttribute("aria-hidden","true");

 button.append(questionText,chevron);

 const answerBox=document.createElement("div");
 answerBox.className="answer";

 const tag=document.createElement("span");
 tag.className="tag";
 tag.textContent=categoryLabel;

 const text=document.createElement("div");
 text.textContent=answer;

 answerBox.append(tag,text);
 article.append(button,answerBox);

 button.addEventListener("click",()=>{
  const open=article.classList.toggle("open");
  button.setAttribute("aria-expanded",String(open));
 });

 return article;
}

function renderQuestions(){
 const t=translations[currentLanguage];
 const list=$("faqList");
 list.replaceChildren();

 const query=searchTerm.toLocaleLowerCase();
 let count=0;

 t.qa.forEach((item,index)=>{
  const category=index+1;

  if(currentCategory!==0&&currentCategory!==category)
   return;

  const searchable=(item[0]+" "+item[1])
    .toLocaleLowerCase();

  if(query&&!searchable.includes(query))
   return;

  list.appendChild(
   createQuestion(item[0],item[1],t.cats[category])
  );
  count++;
 });

 $("count").textContent=String(count);
 $("empty").style.display=count?"none":"block";
}

$("language").addEventListener("change",event=>{
 setLanguage(event.target.value);
});

$("search").addEventListener("input",event=>{
 searchTerm=event.target.value.trim();
 renderQuestions();
});

$("back").addEventListener("click",()=>{
 location.href="index.html";
});

setLanguage(readStoredLanguage());

</script>
</body>
</html>
