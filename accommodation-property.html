<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#609b38">
<title>HAVKAR | Accommodation property</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/havkar-accommodation.css">
</head>
<body data-accommodation-page="property" data-i18n-ignore>
<header>
  <div class="header-inner top">
    <button class="back" type="button" id="backButton" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
    <div>
      <h1>Property draft</h1>
      <p class="subtitle">Italy only. Saving a draft does not publish it.</p>
    </div>
  </div>
</header>
<main>
  <p class="links" id="authLinks">
    <a href="login.html">Log In</a>
    <a href="signup.html">Create New Account</a>
  </p>
  <div class="card">
    <label for="displayName">Property name</label>
    <input id="displayName" maxlength="160">
    <label for="marketingType">Marketing type</label>
    <select id="marketingType">
      <option value="hotel">Hotel</option>
      <option value="bnb">B&amp;B</option>
      <option value="apartment">Apartment</option>
      <option value="holiday_home">Holiday home</option>
      <option value="villa">Villa</option>
      <option value="guesthouse">Guesthouse</option>
    </select>
    <label for="legalCategory">Italian legal category</label>
    <select id="legalCategory">
      <option value="hotel_structure">Hotel structure</option>
      <option value="non_hotel_structure">Non-hotel structure</option>
      <option value="short_let">Short let</option>
      <option value="tourist_lease">Tourist lease</option>
    </select>
    <label for="cin">CIN</label>
    <input id="cin" maxlength="15" autocapitalize="characters" spellcheck="false">
    <label for="city">City</label>
    <input id="city" maxlength="120">
    <label for="region">Region</label>
    <input id="region" maxlength="120">
    <label for="street">Street</label>
    <input id="street" maxlength="160" autocomplete="address-line1">
    <label for="streetNumber">Building number</label>
    <input id="streetNumber" maxlength="20" autocomplete="address-line2">
    <label for="postalCode">Postal code</label>
    <input id="postalCode" maxlength="12">
    <label for="cadastralSheet">Cadastral sheet</label>
    <input id="cadastralSheet" maxlength="40">
    <label for="cadastralParcel">Cadastral parcel</label>
    <input id="cadastralParcel" maxlength="40">
    <label for="cadastralSubaltern">Cadastral subaltern</label>
    <input id="cadastralSubaltern" maxlength="40">
    <button class="primary" id="saveProperty" type="button">Save draft</button>
    <button class="secondary" id="submitProperty" type="button">Submit for review</button>
    <p id="message" class="error" role="status"></p>
  </div>
</main>
<nav class="bottom" aria-label="Accommodation">
  <a href="accommodation-apply.html"><strong>Operator</strong></a>
  <a href="accommodation-documents.html"><strong>Documents</strong></a>
  <a href="accommodation-status.html"><strong>Status</strong></a>
</nav>
<script src="/havkar-supabase-config.js"></script>
<script src="/havkar-accommodation.js"></script>
<script type="module" src="/havkar-accommodation-ui.js"></script>
<script>
document.getElementById("backButton").addEventListener("click", function () {
  if (window.havkarNavigateBack) window.havkarNavigateBack();
  else window.location.href = "accommodation-apply.html";
});
</script>
<script src="/havkar-i18n.js"></script>
<script src="/havkar-page-back.js"></script>
<script src="/havkar-accommodation-i18n.js"></script>
</body>
</html>
