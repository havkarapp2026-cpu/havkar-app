<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR - Pi Testnet</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8f2;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.box{
  width:90%;
  max-width:430px;
  background:#fff;
  padding:30px 22px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 5px 25px rgba(0,0,0,.10);
}
h1{color:#2e7d32;}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#2e7d32;
  color:white;
  font-size:17px;
  font-weight:bold;
}
#status{margin-top:20px;}
#result{
  margin-top:20px;
  padding:15px;
  background:#eef7e8;
  border-radius:12px;
  text-align:left;
  word-break:break-word;
  display:none;
}
.error{color:#c62828;}
</style>
</head>

<body>

<div class="box">

<h1>HAVKAR</h1>

<button id="login">
Authenticate with Pi
</button>

<div id="status"></div>
<div id="result"></div>

</div>

<script>

Pi.init({
  version: "2.0"
});

const button = document.getElementById("login");
const status = document.getElementById("status");
const result = document.getElementById("result");

function onIncompletePaymentFound(payment){
  console.log("Incomplete Pi payment:", payment);
}

button.addEventListener("click", async () => {

  button.disabled = true;
  status.textContent = "Authenticating...";

  try {

    const auth = await Pi.authenticate(
      ["username", "wallet_address"],
      onIncompletePaymentFound
    );

    status.textContent = "Pi authentication successful ✅";

    result.style.display = "block";

    result.innerHTML =
      "<strong>Username:</strong><br>" +
      (auth.user.username || "—") +
      "<br><br>" +
      "<strong>Pi UID:</strong><br>" +
      auth.user.uid;

  } catch(error) {

    status.innerHTML =
      '<span class="error">Authentication failed ❌</span>';

    result.style.display = "block";
    result.textContent =
      error?.message || String(error);

  } finally {
    button.disabled = false;
  }

});

</script>

</body>
</html>
