<!DOCTYPE html>  <html lang="en">    <head>    
  <meta charset="UTF-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    
  <title>HAVKAR - Pi Sign-In</title>    <style>    
    body {    
      margin: 0;    
      font-family: Arial, sans-serif;    
      background: #f4f8f2;    
      color: #222;    
      display: flex;    
      justify-content: center;    
      align-items: center;    
      min-height: 100vh;    
    }    .box {    
  width: 90%;    
  max-width: 430px;    
  background: white;    
  padding: 30px 22px;    
  border-radius: 20px;    
  box-shadow: 0 5px 25px rgba(0,0,0,.10);    
  text-align: center;    
}    

h1 {    
  color: #2e7d32;    
  margin-top: 0;    
}    

#status {    
  margin-top: 20px;    
  line-height: 1.6;    
}    

.result {    
  margin-top: 20px;    
  padding: 15px;    
  background: #eef7e8;    
  border-radius: 12px;    
  word-break: break-word;    
  text-align: left;    
}    

.error {    
  color: #c62828;    
}

</style>  </head>  <body>  <div class="box">    <h1>HAVKAR</h1>    <div id="status">
Verifying Pi account...

  </div>    <div id="result"></div>  </div>  <script>    
(async function () {    const status = document.getElementById("status");
const result = document.getElementById("result");

try {

const params = new URLSearchParams(    
  window.location.hash.substring(1)    
);    

const error = params.get("error");    

if (error) {    
  throw new Error("Pi Sign-In error: " + error);    
}    

const accessToken = params.get("access_token");    
const returnedState = params.get("state");    

if (!accessToken) {    
  throw new Error("No Pi access token received.");    
}    

const expectedState =    
  sessionStorage.getItem("pi_oauth_state");    

if (expectedState && returnedState !== expectedState) {    
  throw new Error("Security verification failed.");    
}    

sessionStorage.removeItem("pi_oauth_state");    

const response = await fetch(    
  "https://api.minepi.com/v2/me",    
  {    
    method: "GET",    
    headers: {    
      "Authorization": "Bearer " + accessToken    
    }    
  }    
);    

if (!response.ok) {    
  throw new Error(    
    "Pi account verification failed."    
  );    
}    

const user = await response.json();    

history.replaceState(    
  null,    
  "",    
  window.location.pathname    
);    

status.innerHTML =    
  "Pi account verified successfully ✅";    

result.className = "result";    

result.innerHTML =    
  "<strong>Pi Username:</strong> " +    
  (user.username || "—") +    
  "<br><br>" +    
  "<strong>Pi UID:</strong><br>" +    
  (user.uid || "—");

} catch (err) {

status.innerHTML =    
  "<span class='error'>Verification failed ❌</span>";    

result.className = "result";    

result.textContent =    
  err.message || "Unknown error";

}

})();
</script>  </body>

</html>
