<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVKAR - Trade</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --green:#78b83f;
    --green-dark:#5f9d2d;
    --bg:#f4f5f3;
    --card:#ffffff;
    --text:#202020;
    --muted:#888;
    --red:#c93636;
    --border:#e7e7e7;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:90px;
}

.header{
    height:76px;
    background:var(--green);
    color:#fff;
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.back{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:27px;
    cursor:pointer;
}

.header h1{
    font-size:25px;
    font-weight:700;
}

.container{
    width:min(920px,94%);
    margin:22px auto;
}

.card{
    background:var(--card);
    border-radius:22px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.section-title{
    font-size:19px;
    font-weight:700;
    margin-bottom:17px;
}

.market-select{
    width:100%;
    border:1px solid var(--border);
    background:#fff;
    border-radius:15px;
    padding:15px;
    font-size:16px;
    outline:none;
}

.asset{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.asset-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.coin-icon{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#f0f7ea;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
}

.coin-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.coin-symbol{
    font-size:14px;
    color:#999;
    margin-top:3px;
}

.price{
    text-align:right;
}

.price-value{
    font-size:25px;
    font-weight:750;
}

.change{
    margin-top:4px;
    font-size:14px;
    font-weight:650;
}

.up{
    color:var(--green-dark);
}

.down{
    color:var(--red);
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    padding:14px;
    border:1px solid var(--border);
    background:#f8f8f8;
    border-radius:13px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.tab.active{
    background:var(--green);
    color:#fff;
    border-color:var(--green);
}

label{
    display:block;
    margin:14px 0 7px;
    font-size:14px;
    font-weight:650;
}

input,select{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:13px;
    font-size:16px;
    outline:none;
    background:#fff;
}

input:focus,select:focus{
    border-color:var(--green);
}

.amount-row{
    display:grid;
    grid-template-columns:1fr 120px;
    gap:10px;
}

.summary{
    background:#f5f8f2;
    border-radius:15px;
    padding:16px;
    margin-top:17px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    color:#666;
}

.summary-row strong{
    color:#222;
}

.action{
    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    margin-top:17px;
    background:var(--green);
    color:#fff;
    font-size:17px;
    font-weight:750;
    cursor:pointer;
}

.action.sell{
    background:#444;
}

.action:active{
    transform:scale(.99);
}

.notice{
    font-size:13px;
    color:#777;
    line-height:1.5;
    margin-top:12px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#999;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:78px;
    background:#fff;
    border-top:1px solid #e5e5e5;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    z-index:100;
}

.nav-item{
    border:0;
    background:#fff;
    color:#999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:12px;
    cursor:pointer;
}

.nav-item i{
    font-size:21px;
}

.nav-item.active{
    color:var(--green-dark);
}

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:#fff;
    padding:13px 20px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:300;
    font-size:14px;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:600px){
    .container{
        width:94%;
    }

    .card{
        padding:18px;
        border-radius:19px;
    }

    .price-value{
        font-size:21px;
    }

    .coin-icon{
        width:50px;
        height:50px;
    }

    .amount-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="header">
    <button class="back" onclick="goBack()" aria-label="Back">
        <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1>Trade</h1>
</header>

<main class="container">

    <section class="card">
        <div class="section-title">Select Cryptocurrency</div>

        <select id="coinSelect" onchange="changeCoin()">
            <option value="BTC">Bitcoin (BTC)</option>
            <option value="ETH">Ethereum (ETH)</option>
            <option value="USDT">Tether (USDT)</option>
            <option value="BNB">BNB</option>
            <option value="SOL">Solana (SOL)</option>
            <option value="XRP">XRP</option>
            <option value="ADA">Cardano (ADA)</option>
            <option value="DOGE">Dogecoin (DOGE)</option>
            <option value="TRX">TRON (TRX)</option>
            <option value="TON">Toncoin (TON)</option>
            <option value="DOT">Polkadot (DOT)</option>
            <option value="LTC">Litecoin (LTC)</option>
            <option value="AVAX">Avalanche (AVAX)</option>
            <option value="LINK">Chainlink (LINK)</option>
            <option value="MATIC">Polygon (MATIC)</option>
        </select>
    </section>

    <section class="card">
        <div class="asset">

            <div class="asset-left">
                <div class="coin-icon">
                    <img id="coinImage"
                    src="https://assets.coingecko.com/coins/images/1/large/bitcoin.png"
                    alt="Bitcoin">
                </div>

                <div>
                    <h2 id="coinName">Bitcoin</h2>
                    <div class="coin-symbol" id="coinSymbol">BTC</div>
                </div>
            </div>

            <div class="price">
                <div class="price-value" id="currentPrice">€0.00</div>
                <div class="change" id="priceChange">--</div>
            </div>

        </div>
    </section>

    <section class="card">

        <div class="tabs">
            <button class="tab active" id="buyTab" onclick="setSide('buy')">
                Buy
            </button>

            <button class="tab" id="sellTab" onclick="setSide('sell')">
                Sell
            </button>
        </div>

        <label for="amount">Amount</label>

        <div class="amount-row">
            <input
                id="amount"
                type="number"
                min="0"
                step="any"
                placeholder="0.00"
                oninput="calculateTotal()">

            <select id="amountUnit" onchange="calculateTotal()">
                <option value="coin">Crypto</option>
                <option value="eur">EUR</option>
            </select>
        </div>

        <div class="summary">

            <div class="summary-row">
                <span>Asset</span>
                <strong id="summaryAsset">BTC</strong>
            </div>

            <div class="summary-row">
                <span>Price</span>
                <strong id="summaryPrice">€0.00</strong>
            </div>

            <div class="summary-row">
                <span>Estimated total</span>
                <strong id="estimatedTotal">€0.00</strong>
            </div>

        </div>

        <button class="action" id="tradeButton" onclick="executeTrade()">
            Buy Bitcoin
        </button>

        <div class="notice">
            Trading shown here is currently a HAVKAR demo interface.
            No real cryptocurrency purchase or sale is executed by this page.
        </div>

    </section>

    <section class="card">

        <div class="section-title">Your Trade Activity</div>

        <div id="tradeActivity" class="empty">
            No trades yet.
        </div>

    </section>

</main>

<nav class="bottom-nav">

    <button class="nav-item" onclick="openPage('wallet.html')">
        <i class="fa-solid fa-wallet"></i>
        <span>Wallet</span>
    </button>

    <button class="nav-item" onclick="openPage('market.html')">
        <i class="fa-solid fa-chart-line"></i>
        <span>Market</span>
    </button>

    <button class="nav-item active">
        <i class="fa-solid fa-right-left"></i>
        <span>Trade</span>
    </button>

    <button class="nav-item" onclick="openPage('history.html')">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>History</span>
    </button>

    <button class="nav-item" onclick="openPage('profile.html')">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </button>

</nav>

<div class="toast" id="toast"></div>

<script>

const coins = {

    BTC:{
        name:"Bitcoin",
        symbol:"BTC",
        price:68500,
        change:-1.20,
        image:"https://assets.coingecko.com/coins/images/1/large/bitcoin.png"
    },

    ETH:{
        name:"Ethereum",
        symbol:"ETH",
        price:2160,
        change:-0.20,
        image:"https://assets.coingecko.com/coins/images/279/large/ethereum.png"
    },

    USDT:{
        name:"Tether",
        symbol:"USDT",
        price:.86,
        change:.40,
        image:"https://assets.coingecko.com/coins/images/325/large/Tether.png"
    },

    BNB:{
        name:"BNB",
        symbol:"BNB",
        price:605,
        change:-1.00,
        image:"https://assets.coingecko.com/coins/images/825/large/bnb-icon2_2x.png"
    },

    SOL:{
        name:"Solana",
        symbol:"SOL",
        price:92,
        change:.35,
        image:"https://assets.coingecko.com/coins/images/4128/large/solana.png"
    },

    XRP:{
        name:"XRP",
        symbol:"XRP",
        price:1.23,
        change:-2.00,
        image:"https://assets.coingecko.com/coins/images/44/large/xrp-symbol-white-128.png"
    },

    ADA:{
        name:"Cardano",
        symbol:"ADA",
        price:.18,
        change:-1.85,
        image:"https://assets.coingecko.com/coins/images/975/large/cardano.png"
    },

    DOGE:{
        name:"Dogecoin",
        symbol:"DOGE",
        price:.08,
        change:-1.47,
        image:"https://assets.coingecko.com/coins/images/5/large/dogecoin.png"
    },

    TRX:{
        name:"TRON",
        symbol:"TRX",
        price:.35,
        change:.72,
        image:"https://assets.coingecko.com/coins/images/1094/large/tron-logo.png"
    },

    TON:{
        name:"Toncoin",
        symbol:"TON",
        price:3.20,
        change:.50,
        image:"https://assets.coingecko.com/coins/images/17980/large/ton_symbol.png"
    },

    DOT:{
        name:"Polkadot",
        symbol:"DOT",
        price:3.50,
        change:-.80,
        image:"https://assets.coingecko.com/coins/images/12171/large/polkadot.png"
    },

    LTC:{
        name:"Litecoin",
        symbol:"LTC",
        price:95,
        change:-.35,
        image:"https://assets.coingecko.com/coins/images/2/large/litecoin.png"
    },

    AVAX:{
        name:"Avalanche",
        symbol:"AVAX",
        price:24,
        change:-1.10,
        image:"https://assets.coingecko.com/coins/images/12559/large/Avalanche_Circle_RedWhite_Trans.png"
    },

    LINK:{
        name:"Chainlink",
        symbol:"LINK",
        price:13,
        change:.30,
        image:"https://assets.coingecko.com/coins/images/877/large/chainlink-new-logo.png"
    },

    MATIC:{
        name:"Polygon",
        symbol:"MATIC",
        price:.25,
        change:-.60,
        image:"https://assets.coingecko.com/coins/images/4713/large/polygon.png"
    }
};

let selectedCoin="BTC";
let side="buy";

function changeCoin(){

    selectedCoin=document.getElementById("coinSelect").value;

    const coin=coins[selectedCoin];

    document.getElementById("coinName").textContent=coin.name;
    document.getElementById("coinSymbol").textContent=coin.symbol;

    document.getElementById("coinImage").src=coin.image;
    document.getElementById("coinImage").alt=coin.name;

    document.getElementById("currentPrice").textContent=
        formatEUR(coin.price);

    const change=document.getElementById("priceChange");

    change.textContent=
        (coin.change>=0?"+":"")+coin.change.toFixed(2)+"%";

    change.className="change "+(coin.change>=0?"up":"down");

    document.getElementById("summaryAsset").textContent=coin.symbol;
    document.getElementById("summaryPrice").textContent=
        formatEUR(coin.price);

    calculateTotal();
}

function formatEUR(value){

    if(!Number.isFinite(value)) return "€0.00";

    return "€"+Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:8
        }
    );
}

function setSide(newSide){

    side=newSide;

    document.getElementById("buyTab")
        .classList.toggle("active",side==="buy");

    document.getElementById("sellTab")
        .classList.toggle("active",side==="sell");

    const button=document.getElementById("tradeButton");

    button.classList.toggle("sell",side==="sell");

    button.textContent=
        (side==="buy"?"Buy ":"Sell ")+coins[selectedCoin].name;

    calculateTotal();
}

function calculateTotal(){

    const amount=parseFloat(
        document.getElementById("amount").value
    )||0;

    const unit=document.getElementById("amountUnit").value;

    const price=coins[selectedCoin].price;

    let total=0;

    if(unit==="coin"){
        total=amount*price;
    }else{
        total=amount;
    }

    document.getElementById("estimatedTotal").textContent=
        formatEUR(total);
}

function executeTrade(){

    const amount=parseFloat(
        document.getElementById("amount").value
    );

    if(!amount || amount<=0){

        showToast("Please enter a valid amount.");

        return;
    }

    const unit=document.getElementById("amountUnit").value;

    const price=coins[selectedCoin].price;

    let cryptoAmount;
    let eurAmount;

    if(unit==="coin"){

        cryptoAmount=amount;
        eurAmount=amount*price;

    }else{

        eurAmount=amount;
        cryptoAmount=amount/price;

    }

    const trade={

        id:Date.now(),

        type:side,

        coin:selectedCoin,

        coinName:coins[selectedCoin].name,

        cryptoAmount:cryptoAmount,

        eurAmount:eurAmount,

        price:price,

        time:new Date().toISOString()

    };

    const trades=
        JSON.parse(localStorage.getItem("havkarTrades")||"[]");

    trades.unshift(trade);

    localStorage.setItem(
        "havkarTrades",
        JSON.stringify(trades.slice(0,100))
    );

    showToast(
        side==="buy"
        ?"Demo buy order recorded."
        :"Demo sell order recorded."
    );

    document.getElementById("amount").value="";

    calculateTotal();

    loadActivity();
}

function loadActivity(){

    const box=document.getElementById("tradeActivity");

    const trades=
        JSON.parse(localStorage.getItem("havkarTrades")||"[]");

    if(!trades.length){

        box.className="empty";
        box.innerHTML="No trades yet.";

        return;
    }

    box.className="";

    box.innerHTML=trades.slice(0,5).map(t=>{

        const date=new Date(t.time);

        return `
            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:12px;
                padding:13px 0;
                border-bottom:1px solid #eee;
            ">

                <div>
                    <strong>
                        ${t.type==="buy"?"Buy":"Sell"} ${t.coin}
                    </strong>

                    <div style="
                        color:#999;
                        font-size:12px;
                        margin-top:4px;
                    ">
                        ${date.toLocaleString()}
                    </div>
                </div>

                <div style="
                    text-align:right;
                    font-weight:700;
                ">
                    ${formatEUR(t.eurAmount)}

                    <div style="
                        color:#999;
                        font-size:12px;
                        margin-top:3px;
                    ">
                        ${t.cryptoAmount.toFixed(8)} ${t.coin}
                    </div>
                </div>

            </div>
        `;

    }).join("");
}

function showToast(message){

    const toast=document.getElementById("toast");

    toast.textContent=message;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2500);
}

function openPage(page){

    window.location.href=page;

}

function goBack(){

    if(document.referrer){
        history.back();
    }else{
        window.location.href="wallet.html";
    }

}

changeCoin();
loadActivity();

</script>

</body>
</html>
