<html lang="en">
<head>

<title>HAVKAR - Trade</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --green:#78b83f;
    --green-dark:#5f9d2d;
    --bg:#f4f5f3;
    --card:#ffffff;
    --text:#202020;
    --muted:#888;
    --red:#c93636;
    --border:#e7e7e7;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:var(--bg);
    color:var(--text);

    min-height:100vh;

    padding-bottom:90px;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* HEADER */

.header{
    height:76px;

    background:var(--green);
    color:#fff;

    display:flex;
    align-items:center;

    padding:0 20px;
    gap:18px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.12);
}

.back{
    width:42px;
    height:42px;

    border:0;
    background:transparent;
    color:#fff;

    font-size:27px;

    cursor:pointer;
}

.header h1{
    font-size:25px;
    font-weight:700;
}

/* CONTAINER */

.container{
    width:min(920px,94%);
    margin:22px auto;
}

/* CARD */

.card{
    background:var(--card);

    border-radius:22px;

    padding:22px;

    margin-bottom:18px;

    box-shadow:
        0 3px 14px rgba(0,0,0,.07);
}

/* TITLES */

.section-title{
    font-size:19px;
    font-weight:700;

    margin-bottom:17px;
}

/* SELECT */

select,
input{
    width:100%;

    padding:15px;

    border:1px solid #ddd;
    border-radius:13px;

    font-size:16px;

    outline:none;
    background:#fff;
}

select:focus,
input:focus{
    border-color:var(--green);
}

/* ASSET */

.asset{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.asset-left{
    display:flex;

    align-items:center;

    gap:14px;
}

.coin-icon{
    width:58px;
    height:58px;

    border-radius:50%;

    background:#f0f7ea;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    flex-shrink:0;
}

.coin-icon img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.coin-symbol{
    font-size:14px;
    color:#999;

    margin-top:3px;
}

.price{
    text-align:right;
}

.price-value{
    font-size:25px;
    font-weight:750;
}

.change{
    margin-top:4px;

    font-size:14px;
    font-weight:650;
}

.up{
    color:var(--green-dark);
}

.down{
    color:var(--red);
}

/* BUY / SELL */

.tabs{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:20px;
}

.tab{
    padding:14px;

    border:1px solid var(--border);

    background:#f8f8f8;

    border-radius:13px;

    font-size:16px;
    font-weight:700;

    cursor:pointer;
}

.tab.active{
    background:var(--green);

    color:#fff;

    border-color:var(--green);
}

/* FORM */

label{
    display:block;

    margin:14px 0 7px;

    font-size:14px;
    font-weight:650;
}

.amount-row{
    display:grid;

    grid-template-columns:1fr 120px;

    gap:10px;
}

/* SUMMARY */

.summary{
    background:#f5f8f2;

    border-radius:15px;

    padding:16px;

    margin-top:17px;
}

.summary-row{
    display:flex;

    justify-content:space-between;

    padding:7px 0;

    color:#666;
}

.summary-row strong{
    color:#222;
}

/* ACTION */

.action{
    width:100%;

    border:0;
    border-radius:14px;

    padding:16px;

    margin-top:17px;

    background:var(--green);

    color:#fff;

    font-size:17px;
    font-weight:750;

    cursor:pointer;

    transition:.15s;
}

.action.sell{
    background:#444;
}

.action:active{
    transform:scale(.99);
}

/* ACTIVITY */

.empty{
    text-align:center;

    padding:25px;

    color:#999;
}

.trade-item{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:12px;

    padding:13px 0;

    border-bottom:1px solid #eee;
}

.trade-item:last-child{
    border-bottom:0;
}

.trade-date{
    color:#999;

    font-size:12px;

    margin-top:4px;
}

.trade-value{
    text-align:right;

    font-weight:700;
}

.trade-crypto{
    color:#999;

    font-size:12px;

    margin-top:3px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:78px;

    background:#fff;

    border-top:1px solid #e5e5e5;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    z-index:100;
}

.nav-item{
    border:0;

    background:#fff;

    color:#999;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:6px;

    font-size:12px;

    cursor:pointer;
}

.nav-item i{
    font-size:21px;
}

.nav-item.active{
    color:var(--green-dark);
}

/* TOAST */

.toast{
    position:fixed;

    left:50%;
    bottom:95px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#222;
    color:#fff;

    padding:13px 20px;

    border-radius:12px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:300;

    font-size:14px;

    max-width:90%;

    text-align:center;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* MOBILE */

@media(max-width:600px){

    .container{
        width:94%;
    }

    .card{
        padding:18px;

        border-radius:19px;
    }

    .price-value{
        font-size:21px;
    }

    .coin-icon{
        width:50px;
        height:50px;
    }

    .amount-row{
        grid-template-columns:1fr;
    }

}

</style>

/* =========================================================

    }

/* =========================================================
   STATE
   ========================================================= */

let selectedCoin = "BTC";

let side = "buy";


/* =========================================================
   TIMEOUT
   ========================================================= */

function withTimeout(
    promise,
    milliseconds,
    message
){

    return Promise.race([

        promise,

        new Promise(
            function(_,reject){

                setTimeout(
                    function(){

                        reject(
                            new Error(message)
                        );

                    },
                    milliseconds
                );

            }
        )

    ]);

}


/* =========================================================
   COIN
   ========================================================= */

function changeCoin(){

    selectedCoin =
        document.getElementById(
            "coinSelect"
        ).value;


    const coin =
        coins[selectedCoin];


    document.getElementById(
        "coinName"
    ).textContent =
        coin.name;


    document.getElementById(
        "coinSymbol"
    ).textContent =
        coin.symbol;


    document.getElementById(
        "coinImage"
    ).src =
        coin.image;


    document.getElementById(
        "coinImage"
    ).alt =
        coin.name;


    document.getElementById(
        "currentPrice"
    ).textContent =
        formatEUR(
            coin.price
        );


    const change =
        document.getElementById(
            "priceChange"
        );


    change.textContent =
        (
            coin.change >= 0
            ? "+"
            : ""
        ) +
        coin.change.toFixed(2) +
        "%";


    change.className =
        "change " +
        (
            coin.change >= 0
            ? "up"
            : "down"
        );


    document.getElementById(
        "summaryAsset"
    ).textContent =
        coin.symbol;


    document.getElementById(
        "summaryPrice"
    ).textContent =
        formatEUR(
            coin.price
        );


    calculateTotal();

}


/* =========================================================
   FORMAT EUR
   ========================================================= */

function formatEUR(value){

    const number =
        Number(value);


    if(
        !Number.isFinite(number)
    ){

        return "€0.00";

    }


    return "€" +
        number.toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:8
            }
        );

}


/* =========================================================
   BUY / SELL
   ========================================================= */

function setSide(newSide){

    side =
        newSide;


    document.getElementById(
        "buyTab"
    ).classList.toggle(
        "active",
        side === "buy"
    );


    document.getElementById(
        "sellTab"
    ).classList.toggle(
        "active",
        side === "sell"
    );


    const button =
        document.getElementById(
            "tradeButton"
        );


    button.classList.toggle(
        "sell",
        side === "sell"
    );


    button.textContent =
        (
            side === "buy"
            ? "Buy "
            : "Sell "
        ) +
        coins[selectedCoin].name;


    calculateTotal();

}


/* =========================================================
   CALCULATE
   ========================================================= */

function calculateTotal(){

    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        ) || 0;


    const unit =
        document.getElementById(
            "amountUnit"
        ).value;


    const price =
        Number(
            coins[selectedCoin].price
        );


    let total = 0;


    if(unit === "coin"){

        total =
            amount * price;

    }else{

        total =
            amount;

    }


    document.getElementById(
        "estimatedTotal"
    ).textContent =
        formatEUR(total);

}


/* =========================================================
   REAL CRYPTO TRADE
   ========================================================= */

async function executeTrade(){

    const button =
        document.getElementById(
            "tradeButton"
        );


    const amountInput =
        document.getElementById(
            "amount"
        );


    const amountUnit =
        document.getElementById(
            "amountUnit"
        );


    const amount =
        Number(
            amountInput.value
        );


    /*
     * Validate amount
     */

    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showToast(
            "Please enter a valid amount."
        );

        return;

    }


    /*
     * Get selected price
     */

    const price =
        Number(
            coins[selectedCoin]?.price
        );


    if(
        !Number.isFinite(price) ||
        price <= 0
    ){

        showToast(
            "Cryptocurrency price is unavailable."
        );

        return;

    }


    /*
     * Convert entered amount
     * to cryptocurrency amount.
     *
     * RPC requires:
     *
     * p_amount = crypto amount
     */

    let cryptoAmount;

    let eurAmount;


    if(
        amountUnit.value === "coin"
    ){

        cryptoAmount =
            amount;

        eurAmount =
            amount * price;

    }else{

        eurAmount =
            amount;

        cryptoAmount =
            amount / price;

    }


    /*
     * Validate calculated values
     */

    if(
        !Number.isFinite(cryptoAmount) ||
        cryptoAmount <= 0
    ){

        showToast(
            "Invalid cryptocurrency amount."
        );

        return;

    }


    if(
        !Number.isFinite(eurAmount) ||
        eurAmount <= 0
    ){

        showToast(
            "Invalid EUR amount."
        );

        return;

    }


    /*
     * Prevent double submission
     */

    button.disabled =
        true;


    button.textContent =
        side === "buy"
        ? "BUYING..."
        : "SELLING...";


    try{

        /*
         * Verify authenticated session.
         */

        const sessionResult =
            await withTimeout(

                supabaseClient
                    .auth
                    .getSession(),

                8000,

                "Authentication timed out."

            );


        if(
            sessionResult.error
        ){

            throw sessionResult.error;

        }


        const session =
            sessionResult
                .data
                ?.session;


        if(!session){

            throw new Error(
                "Please log in first."
            );

        }


        /*
         * REAL SUPABASE RPC
         *
         * public.trade_crypto(
         *     p_side text,
         *     p_symbol text,
         *     p_amount numeric,
         *     p_price_eur numeric
         * )
         */

        const result =
            await withTimeout(

                supabaseClient.rpc(

                    "trade_crypto",

                    {

                        p_side:
                            side,

                        p_symbol:
                            selectedCoin,

                        p_amount:
                            cryptoAmount,

                        p_price_eur:
                            price

                    }

                ),

                15000,

                "Trade request timed out."

            );


        /*
         * Supabase error
         */

        if(
            result.error
        ){

            throw result.error;

        }


        /*
         * RPC should return:
         *
         * {
         *   success:true,
         *   side,
         *   symbol,
         *   crypto_amount,
         *   eur_amount,
         *   price_eur
         * }
         */

        if(
            result.data &&
            result.data.success === false
        ){

            throw new Error(
                "Trade was rejected."
            );

        }


        /*
         * SUCCESS
         */

        showToast(

            side === "buy"

            ? "BUY completed successfully."

            : "SELL completed successfully."

        );


        /*
         * Save only the successful
         * transaction for local activity.
         */

        saveLocalActivity({

            type:
                side,

            coin:
                selectedCoin,

            coinName:
                coins[selectedCoin].name,

            cryptoAmount:
                cryptoAmount,

            eurAmount:
                eurAmount,

            price:
                price,

            time:
                new Date().toISOString()

        });


        /*
         * Clear input.
         */

        amountInput.value =
            "";


        calculateTotal();


        /*
         * Refresh local activity.
         */

        loadActivity();


    }
    catch(error){

        console.error(
            "Crypto trade error:",
            error
        );


        showToast(

            "Trade failed: " +
            (
                error?.message ||
                "Unknown error."
            )

        );

    }
    finally{

        /*
         * Restore button.
         */

        button.disabled =
            false;


        button.textContent =
            (
                side === "buy"
                ? "Buy "
                : "Sell "
            ) +
            coins[selectedCoin].name;

    }

}


/* =========================================================
   LOCAL ACTIVITY
   ========================================================= */

function saveLocalActivity(trade){

    const existing =
        JSON.parse(
            localStorage.getItem(
                "havkarTrades"
            ) || "[]"
        );


    existing.unshift({

        id:
            Date.now(),

        ...trade

    });


    localStorage.setItem(

        "havkarTrades",

        JSON.stringify(
            existing.slice(
                0,
                100
            )
        )

    );

}


/* =========================================================
   LOAD ACTIVITY
   ========================================================= */

function loadActivity(){

    const box =
        document.getElementById(
            "tradeActivity"
        );


    const trades =
        JSON.parse(
            localStorage.getItem(
                "havkarTrades"
            ) || "[]"
        );


    if(
        !Array.isArray(trades) ||
        !trades.length
    ){

        box.className =
            "empty";

        box.innerHTML =
            "No trades yet.";

        return;

    }


    box.className =
        "";


    box.innerHTML =
        trades
        .slice(0,5)
        .map(
            function(trade){

                const date =
                    new Date(
                        trade.time
                    );


                const cryptoAmount =
                    Number(
                        trade.cryptoAmount
                    );


                return `

                    <div class="trade-item">

                        <div>

                            <strong>
                                ${
                                    trade.type === "buy"
                                    ? "Buy"
                                    : "Sell"
                                }
                                ${trade.coin}
                            </strong>

                            <div class="trade-date">
                                ${date.toLocaleString()}
                            </div>

                        </div>


                        <div class="trade-value">

                            ${formatEUR(
                                trade.eurAmount
                            )}

                            <div class="trade-crypto">

                                ${
                                    Number.isFinite(
                                        cryptoAmount
                                    )
                                    ? cryptoAmount.toFixed(8)
                                    : "0.00000000"
                                }

                                ${trade.coin}

                            </div>

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function(){

            toast.classList.remove(
                "show"
            );

        },
        3000
    );

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function openPage(page){

    window.location.href =
        page;

}


function goBack(){

    if(
        document.referrer
    ){

        history.back();

    }else{

        window.location.href =
            "wallet.html";

    }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

changeCoin();

loadActivity();

</script>

</body>
</html>
