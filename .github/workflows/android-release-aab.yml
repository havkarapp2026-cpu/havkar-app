# Builds a Play upload AAB on GitHub-hosted runners.
# Does not publish to Google Play. Does not enable live payments.
# Signed mode requires repository secrets; never echo secret values.

name: Android release AAB

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "signed = Play upload key; unsigned_smoke = SDK/Gradle check only"
        required: true
        type: choice
        options:
          - signed
          - unsigned_smoke
        default: signed
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-aab.yml"
      - "store/ANDROID_CLOUD_BUILD.md"

permissions:
  contents: read

concurrency:
  group: android-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: Build AAB (${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'unsigned_smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'unsigned_smoke' }}
      HAVKAR_UPLOAD_STORE_PASSWORD: ${{ secrets.HAVKAR_UPLOAD_STORE_PASSWORD }}
      HAVKAR_UPLOAD_KEY_ALIAS: ${{ secrets.HAVKAR_UPLOAD_KEY_ALIAS }}
      HAVKAR_UPLOAD_KEY_PASSWORD: ${{ secrets.HAVKAR_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Check out HAVKAR
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already includes an Android SDK. Avoid android-actions/setup-android
      # which currently fails installing the retired `tools` package.
      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK root missing: $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/current/bin/sdkmanager"
            do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME/cmdline-tools" || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.log || true

      - name: Install Android platform and build-tools
        run: |
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Require upload-key secrets for signed builds
        if: env.BUILD_MODE == 'signed'
        env:
          KEYSTORE_B64: ${{ secrets.HAVKAR_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          missing=0
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "Missing repository secret: HAVKAR_UPLOAD_KEYSTORE_BASE64"
            missing=1
          fi
          if [ -z "${HAVKAR_UPLOAD_STORE_PASSWORD}" ]; then
            echo "Missing repository secret: HAVKAR_UPLOAD_STORE_PASSWORD"
            missing=1
          fi
          if [ -z "${HAVKAR_UPLOAD_KEY_ALIAS}" ]; then
            echo "Missing repository secret: HAVKAR_UPLOAD_KEY_ALIAS"
            missing=1
          fi
          if [ -z "${HAVKAR_UPLOAD_KEY_PASSWORD}" ]; then
            echo "Missing repository secret: HAVKAR_UPLOAD_KEY_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the four secrets, then re-run this workflow in signed mode."
            echo "See store/ANDROID_CLOUD_BUILD.md"
            exit 1
          fi
          echo "All required signing secret names are present (values not printed)."

      - name: Materialize upload keystore in a private temp file
        if: env.BUILD_MODE == 'signed'
        env:
          KEYSTORE_B64: ${{ secrets.HAVKAR_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/havkar-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Decoded keystore is empty. Check HAVKAR_UPLOAD_KEYSTORE_BASE64."
            exit 1
          fi
          echo "HAVKAR_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Upload keystore file prepared with mode 600."

      - name: Build release AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:bundleRelease

      - name: Confirm AAB output
        id: aab
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "AAB missing at $AAB"
            exit 1
          fi
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          echo "size=$(wc -c < "$AAB" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "AAB present ($(wc -c < "$AAB" | tr -d ' ') bytes)."

      - name: Verify release signing when secrets were used
        if: env.BUILD_MODE == 'signed'
        run: |
          # Plain `jarsigner -verify -strict` fails on legitimate self-signed Play
          # upload certs (PKIX / self-signed). The script passes the upload
          # keystore into -strict and also checks SHA-256 fingerprint match.
          chmod +x ./scripts/verify-android-aab-signing.sh
          ./scripts/verify-android-aab-signing.sh "${{ steps.aab.outputs.path }}"

      - name: Record unsigned smoke result
        if: env.BUILD_MODE == 'unsigned_smoke'
        run: |
          echo "unsigned_smoke produced an AAB without Play upload signing."
          echo "Do not upload this artifact to Google Play."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: havkar-app-release-${{ env.BUILD_MODE }}-${{ github.run_id }}
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove keystore from the runner
        if: always() && env.BUILD_MODE == 'signed'
        run: |
          rm -f "${RUNNER_TEMP}/havkar-upload.jks"
          echo "Temporary keystore removed."
