# Builds a Play upload AAB on GitHub-hosted runners.
# Does not publish to Google Play. Does not enable live payments.
# Signed mode requires repository secrets; never echo secret values.

name: Android release AAB

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "signed = Play upload key; unsigned_smoke = SDK/Gradle check only"
        required: true
        type: choice
        options:
          - signed
          - unsigned_smoke
        default: signed

permissions:
  contents: read

concurrency:
  group: android-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: Build AAB (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAVKAR_UPLOAD_STORE_PASSWORD: ${{ secrets.HAVKAR_UPLOAD_STORE_PASSWORD }}
      HAVKAR_UPLOAD_KEY_ALIAS: ${{ secrets.HAVKAR_UPLOAD_KEY_ALIAS }}
      HAVKAR_UPLOAD_KEY_PASSWORD: ${{ secrets.HAVKAR_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Check out HAVKAR
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/tmp/sdk-licenses.log || true

      - name: Install Android platform and build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Require upload-key secrets for signed builds
        if: inputs.mode == 'signed'
        env:
          KEYSTORE_B64: ${{ secrets.HAVKAR_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          missing=0
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "Missing repository secret: HAVKAR_UPLOAD_KEYSTORE_BASE64"
            missing=1
          fi
          if [ -z "${HAVKAR_UPLOAD_STORE_PASSWORD}" ]; then
            echo "Missing repository secret: HAVKAR_UPLOAD_STORE_PASSWORD"
            missing=1
          fi
          if [ -z "${HAVKAR_UPLOAD_KEY_ALIAS}" ]; then
            echo "Missing repository secret: HAVKAR_UPLOAD_KEY_ALIAS"
            missing=1
          fi
          if [ -z "${HAVKAR_UPLOAD_KEY_PASSWORD}" ]; then
            echo "Missing repository secret: HAVKAR_UPLOAD_KEY_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the four secrets, then re-run this workflow in signed mode."
            echo "See store/ANDROID_CLOUD_BUILD.md"
            exit 1
          fi
          echo "All required signing secret names are present (values not printed)."

      - name: Materialize upload keystore in a private temp file
        if: inputs.mode == 'signed'
        env:
          KEYSTORE_B64: ${{ secrets.HAVKAR_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/havkar-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Decoded keystore is empty. Check HAVKAR_UPLOAD_KEYSTORE_BASE64."
            exit 1
          fi
          echo "HAVKAR_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Upload keystore file prepared with mode 600."

      - name: Build release AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:bundleRelease

      - name: Confirm AAB output
        id: aab
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "AAB missing at $AAB"
            exit 1
          fi
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          echo "size=$(wc -c < "$AAB" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "AAB present ($(wc -c < "$AAB" | tr -d ' ') bytes)."

      - name: Verify release signing when secrets were used
        if: inputs.mode == 'signed'
        run: |
          AAB="${{ steps.aab.outputs.path }}"
          # bundletool is not required; jarsigner works on the AAB zip.
          if ! jarsigner -verify -strict "$AAB" >/tmp/aab-verify.txt 2>&1; then
            echo "Signed AAB verification failed."
            # Do not dump certificate details that could leak key identity beyond necessity.
            exit 1
          fi
          if grep -qi "jar is unsigned\|no manifest\|not signed" /tmp/aab-verify.txt; then
            echo "AAB is not signed with the upload key."
            exit 1
          fi
          echo "jarsigner verification passed for the release AAB."

      - name: Record unsigned smoke result
        if: inputs.mode == 'unsigned_smoke'
        run: |
          echo "unsigned_smoke produced an AAB without Play upload signing."
          echo "Do not upload this artifact to Google Play."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: havkar-app-release-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove keystore from the runner
        if: always() && inputs.mode == 'signed'
        run: |
          rm -f "${RUNNER_TEMP}/havkar-upload.jks"
          echo "Temporary keystore removed."
