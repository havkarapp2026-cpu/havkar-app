# Optional one-time generator for a NEW Play upload keystore.
# Does NOT run until the owner types the exact confirmation phrase.
# Does NOT overwrite existing HAVKAR_UPLOAD_* secrets.
# Does NOT print passwords, private keys, or plaintext keystore bytes.
# Does NOT publish to Play or enable payments.
# Output is an age-encrypted backup artifact only.

name: Android upload keystore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly CREATE_NEW_UPLOAD_KEY (otherwise the job refuses)"
        required: true
        type: string
      alias:
        description: "Key alias inside the new keystore"
        required: true
        type: string
        default: havkar-upload

permissions:
  contents: read

concurrency:
  group: android-upload-keystore
  cancel-in-progress: false

jobs:
  generate:
    name: Generate encrypted upload-key backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXISTING_KEYSTORE_B64: ${{ secrets.HAVKAR_UPLOAD_KEYSTORE_BASE64 }}
      EXISTING_STORE_PASSWORD: ${{ secrets.HAVKAR_UPLOAD_STORE_PASSWORD }}
      EXISTING_KEY_ALIAS: ${{ secrets.HAVKAR_UPLOAD_KEY_ALIAS }}
      EXISTING_KEY_PASSWORD: ${{ secrets.HAVKAR_UPLOAD_KEY_PASSWORD }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.HAVKAR_UPLOAD_BACKUP_AGE_RECIPIENT }}

    steps:
      - name: Refuse without explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "CREATE_NEW_UPLOAD_KEY" ]; then
            echo "Refusing: confirmation phrase was not CREATE_NEW_UPLOAD_KEY."
            echo "No keystore was generated."
            exit 1
          fi
          echo "Confirmation phrase accepted."

      - name: Refuse if an upload key already exists
        run: |
          blocked=0
          if [ -n "${EXISTING_KEYSTORE_B64}" ]; then
            echo "HAVKAR_UPLOAD_KEYSTORE_BASE64 is already set."
            blocked=1
          fi
          if [ -n "${EXISTING_STORE_PASSWORD}" ]; then
            echo "HAVKAR_UPLOAD_STORE_PASSWORD is already set."
            blocked=1
          fi
          if [ -n "${EXISTING_KEY_ALIAS}" ]; then
            echo "HAVKAR_UPLOAD_KEY_ALIAS is already set."
            blocked=1
          fi
          if [ -n "${EXISTING_KEY_PASSWORD}" ]; then
            echo "HAVKAR_UPLOAD_KEY_PASSWORD is already set."
            blocked=1
          fi
          if [ "$blocked" -ne 0 ]; then
            echo "Refusing to overwrite an existing upload key. No keystore was generated."
            exit 1
          fi
          echo "No existing upload-key secrets detected."

      - name: Require age recipient public key secret
        run: |
          if [ -z "${BACKUP_AGE_RECIPIENT}" ]; then
            echo "Missing repository secret: HAVKAR_UPLOAD_BACKUP_AGE_RECIPIENT"
            echo "Create an age identity on the tablet first (see store/ANDROID_KEYSTORE_SECURITY.md)."
            echo "Put only the public recipient line (age1...) into that secret."
            exit 1
          fi
          case "${BACKUP_AGE_RECIPIENT}" in
            age1*) echo "Age recipient secret is present (value not printed)." ;;
            *)
              echo "HAVKAR_UPLOAD_BACKUP_AGE_RECIPIENT must start with age1"
              exit 1
              ;;
          esac

      - name: Set up JDK 17 for keytool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Generate upload keystore and encrypt backup
        env:
          KEY_ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/havkar-upload-key"
          mkdir -p "$WORK"
          chmod 700 "$WORK"
          KEYSTORE="$WORK/havkar-upload.p12"
          CREDS="$WORK/credentials.txt"
          BUNDLE="$WORK/havkar-upload-backup.tar"
          ENC="$WORK/havkar-upload-backup.tar.age"

          # Random passwords; never printed.
          STORE_PASS="$(openssl rand -base64 32)"
          KEY_PASS="$(openssl rand -base64 32)"

          # PKCS12 upload key (not debug, not proprietary JKS).
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=HAVKAR Upload, OU=HAVKAR, O=HAVKAR, L=Unknown, ST=Unknown, C=IT"

          # credentials.txt is only for the owner after age decrypt. Not logged.
          umask 077
          {
            echo "HAVKAR_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "HAVKAR_UPLOAD_STORE_PASSWORD=$STORE_PASS"
            echo "HAVKAR_UPLOAD_KEY_PASSWORD=$KEY_PASS"
            echo "HAVKAR_UPLOAD_KEYSTORE_FILE=havkar-upload.p12"
            echo "NOTE=After decrypt, base64 the p12 into HAVKAR_UPLOAD_KEYSTORE_BASE64 and set the three other secrets. Keep this backup offline."
          } > "$CREDS"

          tar -C "$WORK" -cf "$BUNDLE" havkar-upload.p12 credentials.txt
          age -r "$BACKUP_AGE_RECIPIENT" -o "$ENC" "$BUNDLE"

          # Drop plaintext as soon as ciphertext exists.
          shred -u "$KEYSTORE" "$CREDS" "$BUNDLE" 2>/dev/null || rm -f "$KEYSTORE" "$CREDS" "$BUNDLE"
          unset STORE_PASS KEY_PASS

          if [ ! -s "$ENC" ]; then
            echo "Encrypted backup missing."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$ENC" "$GITHUB_WORKSPACE/out/havkar-upload-backup.tar.age"
          chmod 600 "$GITHUB_WORKSPACE/out/havkar-upload-backup.tar.age"
          echo "Encrypted backup ready ($(wc -c < "$GITHUB_WORKSPACE/out/havkar-upload-backup.tar.age") bytes). Plaintext removed from the runner."

      - name: Upload encrypted backup artifact only
        uses: actions/upload-artifact@v4
        with:
          name: havkar-upload-backup-age-${{ github.run_id }}
          path: out/havkar-upload-backup.tar.age
          if-no-files-found: error
          retention-days: 7

      - name: Owner next steps (no secrets)
        run: |
          echo "Download the age artifact on the tablet."
          echo "Decrypt with the private age identity that never left the tablet."
          echo "Then set the four HAVKAR_UPLOAD_* repository secrets."
          echo "See store/ANDROID_KEYSTORE_SECURITY.md"
          echo "Do not publish to Play from this workflow."
