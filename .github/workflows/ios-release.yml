# Signed iOS IPA + optional TestFlight upload via GitHub-hosted macOS.
# Manual release modes only — does not run on push.
# Does not enable production payments. Does not submit App Store review.
#
# IMPORTANT: GitHub Actions UI lists workflow_dispatch workflows from the
# default branch (main). Until this file is merged to main, the Actions tab
# will only show "iOS Simulator build".
name: iOS Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight = checks only; signed_ipa = archive+export artifact; testflight = IPA + TestFlight upload"
        required: true
        type: choice
        options:
          - preflight
          - signed_ipa
          - testflight
        default: preflight
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-release.yml"
      - "scripts/ios-release-preflight.sh"
      - "scripts/ios-encode-signing-secrets.sh"
      - "store/IOS_RELEASE.md"

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (repo + secret presence)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      secrets_ready: ${{ steps.secret_presence.outputs.secrets_ready }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Check out HAVKAR
        uses: actions/checkout@v4

      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            # pull_request: never sign or upload
            echo "mode=preflight" >> "$GITHUB_OUTPUT"
          fi

      - name: Run repo preflight script
        run: |
          chmod +x scripts/ios-release-preflight.sh
          mkdir -p artifacts
          scripts/ios-release-preflight.sh artifacts/ios-preflight.env
          cat artifacts/ios-preflight.env

      - name: Report Apple secret presence (names only, never values)
        id: secret_presence
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          {
            echo "# Secret presence (true/false only)"
            for name in \
              APPLE_TEAM_ID \
              APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
              APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
              APP_STORE_CONNECT_API_KEY_ID \
              APP_STORE_CONNECT_ISSUER_ID \
              APP_STORE_CONNECT_API_KEY
            do
              eval "val=\${$name}"
              if [ -n "$val" ]; then
                echo "$name=true"
              else
                echo "$name=false"
                missing=1
              fi
            done
            if [ -n "${APPLE_PROVISIONING_PROFILE_BASE64}" ]; then
              echo "APPLE_PROVISIONING_PROFILE_BASE64=true (optional)"
            else
              echo "APPLE_PROVISIONING_PROFILE_BASE64=false (optional; automatic signing does not require it)"
            fi
          } | tee artifacts/ios-secret-presence.env

          if [ "$missing" -eq 0 ]; then
            echo "secrets_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "secrets_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail signed modes when secrets are missing
        if: steps.mode.outputs.mode != 'preflight' && steps.secret_presence.outputs.secrets_ready != 'true'
        run: |
          echo "Mode '${{ steps.mode.outputs.mode }}' requires all Apple signing secrets."
          echo "See store/IOS_RELEASE.md for exact secret names and owner steps."
          exit 1

      - name: Upload preflight artifacts
        uses: actions/upload-artifact@v4
        with:
          name: havkar-ios-preflight
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  signed-ipa:
    name: Signed IPA
    needs: preflight
    if: needs.preflight.outputs.mode == 'signed_ipa' || needs.preflight.outputs.mode == 'testflight'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PRODUCT_BUNDLE_IDENTIFIER: online.havkar.app
      SCHEME: HAVKAR
      PROJECT: ios/HAVKAR.xcodeproj
      DERIVED: ${{ github.workspace }}/build
      ARCHIVE_PATH: ${{ github.workspace }}/build/HAVKAR.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      IPA_PATH: ${{ github.workspace }}/build/export/HAVKAR.ipa
      ASC_KEY_PATH: ${{ github.workspace }}/build/AuthKey.p8
    steps:
      - name: Check out HAVKAR
        uses: actions/checkout@v4

      - name: Verify App Icon has no alpha
        run: |
          python3 - <<'PY'
          path = "ios/HAVKAR/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          data = open(path, "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          color = data[25]
          if color in (4, 6):
              raise SystemExit("AppIcon-1024.png still has alpha (color_type=%s)" % color)
          print("AppIcon OK color_type=%s" % color)
          PY

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesigning-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install optional provisioning profile
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Secrets cannot be used in if: conditionals; skip when unset.
          if [ -z "${PROFILE_B64}" ]; then
            echo "No APPLE_PROVISIONING_PROFILE_BASE64 set; using automatic provisioning."
            exit 0
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/havkar.mobileprovision"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          # Presence only — never print profile contents.
          echo "Installed provisioning profile bytes=$(wc -c < "$PROFILE_PATH")"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$DERIVED" \
            "$HOME/.appstoreconnect/private_keys" \
            "$HOME/private_keys" \
            "$HOME/.app-store/private_keys"
          KEY_FILE="AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          if printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$ASC_KEY_PATH"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$ASC_KEY_PATH"
          fi
          chmod 600 "$ASC_KEY_PATH"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/$KEY_FILE"
          cp "$ASC_KEY_PATH" "$HOME/private_keys/$KEY_FILE"
          cp "$ASC_KEY_PATH" "$HOME/.app-store/private_keys/$KEY_FILE"
          echo "ASC API key installed (path redacted from logs)"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Archive Release (automatic signing overrides)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$DERIVED"
          # project.pbxproj keeps CODE_SIGNING_ALLOWED=NO for Simulator CI.
          # This job overrides signing for App Store distribution only.
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER="$PRODUCT_BUNDLE_IDENTIFIER" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            archive

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          team = os.environ["APPLE_TEAM_ID"]
          derived = Path(os.environ["DERIVED"])
          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
              '<plist version="1.0">',
              '<dict>',
              '\t<key>method</key>',
              '\t<string>app-store-connect</string>',
              '\t<key>destination</key>',
              '\t<string>export</string>',
              '\t<key>signingStyle</key>',
              '\t<string>automatic</string>',
              '\t<key>teamID</key>',
              f'\t<string>{team}</string>',
              '\t<key>uploadSymbols</key>',
              '\t<true/>',
              '\t<key>manageAppVersionAndBuildNumber</key>',
              '\t<false/>',
              '</dict>',
              '</plist>',
              '',
          ]
          out = derived / "ExportOptions.plist"
          out.write_text("\n".join(lines))
          print(f"Wrote {out}")
          PY
          plutil -lint "$DERIVED/ExportOptions.plist"

      - name: Export IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$DERIVED/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -allowProvisioningUpdates
          test -f "$IPA_PATH"
          ls -lh "$EXPORT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: havkar-ios-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
          retention-days: 7

  testflight:
    name: Upload TestFlight
    needs: [preflight, signed-ipa]
    if: needs.preflight.outputs.mode == 'testflight'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: havkar-ios-ipa
          path: ipa

      - name: Locate IPA
        id: ipa
        run: |
          set -euo pipefail
          IPA="$(find ipa -name '*.ipa' | head -n 1)"
          test -n "$IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - name: Upload to TestFlight (no App Store submission)
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
