<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="impact-site-verification"
      value="3cf3cbf3-e849-452a-bb8f-d0b1cd29ad81">

<title>HAVKAR – Global Platform for Jobs, Services, Trade & Travel</title>

<meta name="description"
      content="HAVKAR is a global platform connecting people with jobs, services, buying and selling, travel, tickets, delivery, chat, events and support.">

<meta name="keywords"
      content="HAVKAR, jobs, services, buy and sell, marketplace, travel, tickets, delivery, chat, events, support">

<meta name="robots" content="index, follow">
<meta name="author" content="HAVKAR">
<meta name="theme-color" content="#2e7d32">

<link rel="canonical"
      href="https://havkar-app.vercel.app/">

<meta property="og:type" content="website">
<meta property="og:title" content="HAVKAR – Global Platform">
<meta property="og:description" content="Connect • Trade • Work • Help">
<meta property="og:url" content="https://havkar-app.vercel.app/">
<meta property="og:image"
      content="https://havkar-app.vercel.app/icon.png">
<meta property="og:site_name" content="HAVKAR">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="HAVKAR – Global Platform">
<meta name="twitter:description"
      content="Connect • Trade • Work • Help">
<meta name="twitter:image"
      content="https://havkar-app.vercel.app/icon.png">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #c8e6c9 0%,
            #a5d6a7 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
}

.container {
    position: relative;

    width: 100%;
    max-width: 430px;

    padding: 24px 15px 28px;

    background:
        rgba(255,255,255,.985);

    border:
        2px solid
        rgba(190,225,198,.72);

    border-radius: 38px;

    box-shadow:
        0 24px 70px rgba(39,104,52,.13),
        inset 0 0 0 1px rgba(255,255,255,.9);

    overflow: hidden;
}

.container::before {
    content: "";

    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(140,180,140,.28) 2px,
            transparent 2px
        );

    background-size: 40px 40px;

    opacity: .7;

    pointer-events: none;
}

.container > * {
    position: relative;
    z-index: 1;
}

/* =========================
   LOGO
   ========================= */

.logo-section {
    text-align: center;
    margin-bottom: 20px;
}

.globe-image {
    display: block;

    width: 210px;
    height: 128px;

    margin: -2px auto 2px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 12px 20px
            rgba(46,125,50,.18)
        );
}

h1 {
    margin-bottom: 8px;

    color: #17652a;

    font-size: 2.25rem;
    font-weight: 900;

    letter-spacing: 2.5px;
    line-height: 1.1;

    text-shadow:
        0 2px 0 rgba(255,255,255,.9),
        0 5px 12px rgba(46,125,50,.14);
}

.tagline {
    color: #25352a;

    font-size: .82rem;
    font-weight: 700;

    letter-spacing: 1px;
}

/* =========================
   12 MAIN OPTIONS
   ========================= */

.menu-grid {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 9px;

    margin-bottom: 16px;
}

.menu-item {
    min-height: 104px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 13px 7px 12px;

    text-align: center;
    text-decoration: none;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #f8fcf8 100%
        );

    border:
        1px solid
        rgba(71,132,79,.08);

    border-radius: 19px;

    box-shadow:
        0 8px 22px
        rgba(46,100,55,.075),

        inset 0 1px 0
        rgba(255,255,255,.95);

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.menu-item:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 28px
        rgba(46,100,55,.12),

        inset 0 1px 0
        rgba(255,255,255,.95);
}

.menu-item:active {
    transform: scale(.98);
}

.menu-item:focus-visible {
    outline:
        3px solid
        rgba(46,125,50,.3);

    outline-offset: 3px;
}

.menu-icon {
    width: 52px;
    height: 52px;

    display: flex;

    justify-content: center;
    align-items: center;

    margin-bottom: 8px;

    border-radius: 16px;

    font-size: 1.72rem;

    color: #43a85b;

    background:
        linear-gradient(
            145deg,
            #f0faf2,
            #e3f4e7
        );

    box-shadow:
        0 7px 14px
        rgba(44,116,57,.10),

        inset 0 1px 0
        rgba(255,255,255,.95);

    text-shadow:
        0 2px 1px
        rgba(20,80,32,.22),

        0 5px 10px
        rgba(46,125,50,.15);
}

.menu-item span {
    display: block;

    color: #18251c;

    font-size: .72rem;
    font-weight: 800;

    line-height: 1.2;
}

.icon-buy,
.icon-jobs,
.icon-services,
.icon-wallet,
.icon-tickets,
.icon-ads,
.icon-chat,
.icon-language,
.icon-delivery,
.icon-reviews,
.icon-events,
.icon-support {
    color: #43a85b;
}

/* =========================
   ABOUT HAVKAR
   ========================= */

.about-link {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 12px;

    margin-bottom: 16px;
    padding: 13px 15px;

    color: #1f7037;
    text-decoration: none;

    background:
        linear-gradient(
            145deg,
            #f7fcf8 0%,
            #edf8ef 100%
        );

    border:
        1px solid
        rgba(46,125,50,.13);

    border-radius: 18px;

    box-shadow:
        0 7px 18px
        rgba(46,100,55,.07);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.about-link:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 24px
        rgba(46,100,55,.11);
}

.about-link:active {
    transform: scale(.985);
}

.about-link:focus-visible {
    outline:
        3px solid
        rgba(46,125,50,.3);

    outline-offset: 3px;
}

.about-icon {
    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    color: #43a85b;

    background:
        linear-gradient(
            145deg,
            #edf8ef,
            #dff1e3
        );

    font-size: 1.15rem;
}

.about-text {
    flex: 1;
    min-width: 0;
}

.about-title {
    display: block;

    color: #1d542b;

    font-size: .88rem;
    font-weight: 850;

    line-height: 1.2;
}

.about-description {
    display: block;

    margin-top: 3px;

    color: #68806e;

    font-size: .68rem;
    font-weight: 600;

    line-height: 1.25;
}

.about-arrow {
    flex: 0 0 auto;

    color: #6ca778;

    font-size: .8rem;
}

/* =========================
   CREATE ACCOUNT
   ========================= */

.enter-button {
    width: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 12px;

    border: none;

    border-radius: 50px;

    padding: 16px 20px;

    background:
        linear-gradient(
            135deg,
            #16833c 0%,
            #35ad5a 100%
        );

    color: #ffffff;

    font-size: 1.02rem;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 10px 24px
        rgba(32,130,59,.25),

        inset 0 1px 0
        rgba(255,255,255,.25);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.enter-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 13px 30px
        rgba(32,130,59,.32);
}

.enter-button:active {
    transform: scale(.985);
}

.enter-icon {
    font-size: 1.25rem;
}

.enter-arrow {
    font-size: 1.35rem;
    margin-left: auto;
}

/* =========================
   LOGIN
   ========================= */

.login {
    margin-top: 13px;
    margin-bottom: 17px;

    text-align: center;

    color: #54705b;

    font-size: .84rem;
    font-weight: 600;
}

.login a {
    color: #21863f;

    font-weight: 800;

    text-decoration: none;
}

.login a:hover {
    text-decoration: underline;
}

/* =========================
   SECURITY
   ========================= */

.security-badge {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    color: #54705b;

    font-size: .78rem;
    font-weight: 600;

    text-align: center;
}

.security-icon {
    width: 26px;
    height: 26px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background: #31a653;

    color: white;

    font-size: .82rem;

    box-shadow:
        0 5px 12px
        rgba(46,125,50,.18);
}

.security-lock {
    font-size: .8rem;
}

/* =========================
   SMALL PHONES
   ========================= */

@media (max-width: 360px) {

    body {
        padding: 8px;
    }

    .container {
        padding:
            20px 12px 24px;

        border-radius: 32px;
    }

    .globe-image {
        width: 195px;
        height: 118px;
    }

    h1 {
        font-size: 2rem;
    }

    .tagline {
        font-size: .74rem;
    }

    .menu-grid {
        gap: 7px;
    }

    .menu-item {
        min-height: 94px;
        border-radius: 17px;
    }

    .menu-icon {
        width: 48px;
        height: 48px;

        font-size: 1.55rem;
    }

    .menu-item span {
        font-size: .67rem;
    }

    .about-link {
        padding: 11px 12px;
        gap: 10px;
    }

    .about-icon {
        width: 39px;
        height: 39px;
        flex-basis: 39px;
    }

    .about-title {
        font-size: .82rem;
    }

    .about-description {
        font-size: .63rem;
    }

    .enter-button {
        font-size: .94rem;
        padding: 14px;
    }
}

/* =========================
   REDUCED MOTION
   ========================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}

</style>

<!-- =========================
     PI NETWORK SDK - TESTNET
     ========================= -->

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
Pi.init({
    version: "2.0",
    sandbox: true
});
</script>

</head>

<body>

<main class="container">

    <!-- =========================
         HAVKAR LOGO
         ========================= -->

    <section
        class="logo-section"
        aria-label="HAVKAR"
    >

        <img
            src="icon.png"
            alt="HAVKAR Globe"
            class="globe-image"
            width="210"
            height="128"
            loading="eager"
        >

        <h1>HAVKAR</h1>

        <div class="tagline">
            Connect • Trade • Work • Help
        </div>

    </section>


    <!-- =========================
         12 OPTIONS
         ========================= -->

    <nav
        class="menu-grid"
        aria-label="HAVKAR services"
    >

        <!-- 1 -->
        <a
            class="menu-item"
            href="buy-sell.html"
            aria-label="Buy and Sell"
        >
            <i class="fas fa-shopping-cart menu-icon icon-buy"
               aria-hidden="true"></i>

            <span>Buy &amp; Sell</span>
        </a>


        <!-- 2 -->
        <a
            class="menu-item"
            href="jobs.html"
            aria-label="Jobs"
        >
            <i class="fas fa-briefcase menu-icon icon-jobs"
               aria-hidden="true"></i>

            <span>Jobs</span>
        </a>


        <!-- 3 -->
        <a
            class="menu-item"
            href="services.html"
            aria-label="Services"
        >
            <i class="fas fa-tools menu-icon icon-services"
               aria-hidden="true"></i>

            <span>Services</span>
        </a>


        <!-- 4 -->
        <a
            class="menu-item"
            href="wallet.html"
            aria-label="Wallet"
        >
            <i class="fas fa-wallet menu-icon icon-wallet"
               aria-hidden="true"></i>

            <span>Wallet</span>
        </a>


        <!-- 5 -->
        <a
            class="menu-item"
            href="tickets.html"
            aria-label="Tickets"
        >
            <i class="fas fa-ticket-alt menu-icon icon-tickets"
               aria-hidden="true"></i>

            <span>Tickets</span>
        </a>


        <!-- 6 -->
        <a
            class="menu-item"
            href="ads.html"
            aria-label="Advertisements"
        >
            <i class="fas fa-bullhorn menu-icon icon-ads"
               aria-hidden="true"></i>

            <span>Ads</span>
        </a>


        <!-- 7 -->
        <a
            class="menu-item"
            href="delivery.html"
            aria-label="Delivery"
        >
            <i class="fas fa-shipping-fast menu-icon icon-delivery"
               aria-hidden="true"></i>

            <span>Delivery</span>
        </a>


        <!-- 8 -->
        <a
            class="menu-item"
            href="events.html"
            aria-label="Events"
        >
            <i class="fas fa-calendar-alt menu-icon icon-events"
               aria-hidden="true"></i>

            <span>Events</span>
        </a>


        <!-- 9 -->
        <a
            class="menu-item"
            href="chat.html"
            aria-label="Chat"
        >
            <i class="fas fa-comments menu-icon icon-chat"
               aria-hidden="true"></i>

            <span>Chat</span>
        </a>


        <!-- 10 -->
        <a
            class="menu-item"
            href="language.html"
            aria-label="Language"
        >
            <i class="fas fa-language menu-icon icon-language"
               aria-hidden="true"></i>

            <span>Language</span>
        </a>


        <!-- 11 -->
        <a
            class="menu-item"
            href="reviews.html"
            aria-label="Reviews"
        >
            <i class="fas fa-star menu-icon icon-reviews"
               aria-hidden="true"></i>

            <span>Reviews</span>
        </a>


        <!-- 12 -->
        <a
            class="menu-item"
            href="support.html"
            aria-label="Support"
        >
            <i class="fas fa-headset menu-icon icon-support"
               aria-hidden="true"></i>

            <span>Support</span>
        </a>

    </nav>


    <!-- =========================
         ABOUT HAVKAR
         ========================= -->

    <a
        class="about-link"
        href="about.html"
        aria-label="About HAVKAR"
    >

        <span
            class="about-icon"
            aria-hidden="true"
        >
            <i class="fas fa-circle-info"></i>
        </span>

        <span class="about-text">

            <span class="about-title">
                About HAVKAR
            </span>

            <span class="about-description">
                Learn about our platform, mission and services
            </span>

        </span>

        <i
            class="fas fa-chevron-right about-arrow"
            aria-hidden="true"
        ></i>

    </a>


    <!-- =========================
         CREATE NEW ACCOUNT
         ========================= -->

    <button
        class="enter-button"
        type="button"
        onclick="window.location.href='login.html'"
        aria-label="Create New Account"
    >

        <i
            class="fas fa-user-plus enter-icon"
            aria-hidden="true"
        ></i>

        <span>Create New Account</span>

        <span
            class="enter-arrow"
            aria-hidden="true"
        >›</span>

    </button>


    <!-- =========================
         LOGIN
         ========================= -->

    <div class="login">

        Already have an account?

        <a href="login.html">
            Log In
        </a>

    </div>


    <!-- =========================
         SECURITY
         ========================= -->

    <div
        class="security-badge"
        aria-label="Safe Secure Trusted"
    >

        <span class="security-icon">
            ✓
        </span>

        <span>
            Safe • Secure • Trusted
        </span>

        <span
            class="security-lock"
            aria-hidden="true"
        >
            🔒
        </span>

    </div>

</main>

</body>
</html>
