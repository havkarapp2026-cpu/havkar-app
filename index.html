<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <!-- Impact / Omio website verification -->
    <meta
        name="impact-site-verification"
        value="2b0abd42-3ee1-485b-a3bc-9c5d6a569a16"
    >

    <!-- SEO -->
    <title>HAVKAR – Global Platform for Jobs, Services, Trade & Travel</title>

    <meta
        name="description"
        content="HAVKAR is a global platform connecting people with jobs, services, buying and selling, travel, delivery, chat, events and support."
    >

    <meta
        name="keywords"
        content="HAVKAR, jobs, services, buy and sell, travel, tickets, taxi, transfer, delivery, marketplace, chat, events"
    >

    <meta name="robots" content="index, follow">
    <meta name="author" content="HAVKAR">
    <meta name="theme-color" content="#2e7d32">

    <!-- Canonical -->
    <link
        rel="canonical"
        href="https://havkar-app.vercel.app/"
    >

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="HAVKAR – Global Platform">
    <meta
        property="og:description"
        content="Connect • Trade • Work • Help"
    >
    <meta
        property="og:url"
        content="https://havkar-app.vercel.app/"
    >
    <meta
        property="og:image"
        content="https://havkar-app.vercel.app/icon.png"
    >
    <meta property="og:site_name" content="HAVKAR">

    <!-- Twitter / Social sharing -->
    <meta name="twitter:card" content="summary">
    <meta
        name="twitter:title"
        content="HAVKAR – Global Platform"
    >
    <meta
        name="twitter:description"
        content="Connect • Trade • Work • Help"
    >
    <meta
        name="twitter:image"
        content="https://havkar-app.vercel.app/icon.png"
    >

    <!-- Icons -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        /* =========================================
           HAVKAR GLOBAL PLATFORM
           Main Landing Page
           ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #c8e6c9 0%,
                    #a5d6a7 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
        }

        /* =========================================
           MAIN APP CARD
           ========================================= */

        .container {
            position: relative;

            width: 100%;
            max-width: 420px;
            max-height: 95vh;

            padding: 35px 25px 30px;

            background: rgba(255, 255, 255, 0.98);

            border: 3px solid rgba(200, 230, 200, 0.65);
            border-radius: 45px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.12);

            overflow-y: auto;
            overflow-x: hidden;

            scrollbar-width: thin;
        }

        .container::before {
            content: "";

            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            background-image:
                radial-gradient(
                    circle,
                    rgba(140, 180, 140, 0.3) 2px,
                    transparent 2px
                );

            background-size: 40px 40px;

            opacity: 0.7;

            pointer-events: none;
        }

        .container > * {
            position: relative;
            z-index: 1;
        }

        /* =========================================
           LOGO / BRAND
           ========================================= */

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .globe-image {
            width: 75px;
            height: 75px;

            margin: 0 auto 18px;

            display: block;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 8px 20px
                    rgba(46, 125, 50, 0.3)
                );
        }

        h1 {
            margin-bottom: 8px;

            color: #1b5e20;

            font-size: 2.5rem;
            font-weight: 900;

            letter-spacing: 3px;
            line-height: 1.1;
        }

        .tagline {
            color: #5a5a5a;

            font-size: 0.85rem;
            font-weight: 600;

            letter-spacing: 1.3px;
        }

        /* =========================================
           MENU GRID
           ========================================= */

        .menu-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 10px;

            margin-bottom: 25px;
        }

        .menu-item {
            min-height: 108px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 18px 10px;

            background: #ffffff;

            border: 1px solid rgba(0, 0, 0, 0.025);
            border-radius: 16px;

            text-align: center;

            cursor: pointer;

            text-decoration: none;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.06);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .menu-item:hover {
            transform: translateY(-4px);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);

            background: #fcfffc;
        }

        .menu-item:active {
            transform: translateY(-1px) scale(0.98);
        }

        .menu-item:focus-visible {
            outline: 3px solid rgba(46, 125, 50, 0.35);
            outline-offset: 3px;
        }

        .menu-icon {
            margin-bottom: 8px;

            font-size: 1.8rem;

            line-height: 1;
        }

        .menu-item span {
            display: block;

            color: #2a2a2a;

            font-size: 0.75rem;
            font-weight: 700;

            line-height: 1.2;
        }

        /* =========================================
           ICON COLORS
           ========================================= */

        .icon-buy {
            color: #66bb6a;
        }

        .icon-jobs {
            color: #42a5f5;
        }

        .icon-services {
            color: #ffa726;
        }

        .icon-wallet {
            color: #26a69a;
        }

        .icon-tickets {
            color: #5c6bc0;
        }

        .icon-ads {
            color: #ec407a;
        }

        .icon-chat {
            color: #26c6da;
        }

        .icon-language {
            color: #78909c;
        }

        .icon-delivery {
            color: #ff7043;
        }

        .icon-reviews {
            color: #ffca28;
        }

        .icon-events {
            color: #ef5350;
        }

        .icon-support {
            color: #ab47bc;
        }

        /* =========================================
           ACCOUNT BUTTON
           ========================================= */

        .enter-button {
            width: 100%;

            border: none;
            border-radius: 50px;

            padding: 16px;

            background:
                linear-gradient(
                    135deg,
                    #2e7d32 0%,
                    #43a047 100%
                );

            color: #ffffff;

            font-size: 1.1rem;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(46, 125, 50, 0.35);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .enter-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px
                rgba(46, 125, 50, 0.45);
        }

        .enter-button:active {
            transform: translateY(-1px);
        }

        .enter-button:focus-visible {
            outline: 3px solid rgba(46, 125, 50, 0.3);
            outline-offset: 4px;
        }

        .enter-button::after {
            content: " →";

            font-size: 1.3rem;
        }

        /* =========================================
           CREATE ACCOUNT
           ========================================= */

        .create-account {
            margin-bottom: 15px;

            text-align: center;

            color: #5a5a5a;

            font-size: 0.9rem;
            font-weight: 600;

            cursor: pointer;

            transition: color 0.2s ease;
        }

        .create-account:hover {
            color: #2e7d32;
        }

        .create-account:focus-visible {
            outline: 2px solid rgba(46, 125, 50, 0.3);
            outline-offset: 4px;
            border-radius: 5px;
        }

        /* =========================================
           SECURITY BADGE
           ========================================= */

        .security-badge {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 6px;

            color: #6a6a6a;

            font-size: 0.8rem;
            font-weight: 500;

            text-align: center;
        }

        .security-badge::before {
            content: "✓";

            color: #2e7d32;

            font-size: 0.95rem;
            font-weight: 900;
        }

        .security-badge::after {
            content: "🔒";

            font-size: 0.85rem;
        }

        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .container {
                max-width: 420px;

                padding:
                    28px 18px 24px;

                border-radius: 35px;
            }

            .globe-image {
                width: 68px;
                height: 68px;

                margin-bottom: 15px;
            }

            h1 {
                font-size: 2.2rem;
                letter-spacing: 2.5px;
            }

            .tagline {
                font-size: 0.78rem;
                letter-spacing: 1px;
            }

            .menu-grid {
                gap: 8px;
            }

            .menu-item {
                min-height: 100px;

                padding:
                    15px 7px;
            }

            .menu-icon {
                font-size: 1.65rem;
            }

            .menu-item span {
                font-size: 0.72rem;
            }
        }

        /* =========================================
           VERY SMALL SCREENS
           ========================================= */

        @media (max-width: 360px) {

            .container {
                padding:
                    24px 14px 20px;
            }

            h1 {
                font-size: 1.95rem;
            }

            .menu-grid {
                gap: 7px;
            }

            .menu-item {
                min-height: 94px;
            }

            .menu-icon {
                font-size: 1.5rem;
            }

            .menu-item span {
                font-size: 0.68rem;
            }
        }

        /* =========================================
           REDUCED MOTION
           ========================================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- BRAND -->
        <section
            class="logo-section"
            aria-label="HAVKAR"
        >
            <img
                src="icon.png"
                alt="HAVKAR"
                class="globe-image"
                width="75"
                height="75"
                loading="eager"
            >

            <h1>HAVKAR</h1>

            <div class="tagline">
                Connect • Trade • Work • Help
            </div>
        </section>


        <!-- MAIN SERVICES -->
        <nav
            class="menu-grid"
            aria-label="HAVKAR services"
        >

            <!-- 1. BUY & SELL -->
            <a
                class="menu-item"
                href="buy-sell.html"
                aria-label="Buy and Sell"
            >
                <i
                    class="fas fa-shopping-bag menu-icon icon-buy"
                    aria-hidden="true"
                ></i>
                <span>Buy &amp; Sell</span>
            </a>


            <!-- 2. JOBS -->
            <a
                class="menu-item"
                href="jobs.html"
                aria-label="Jobs"
            >
                <i
                    class="fas fa-briefcase menu-icon icon-jobs"
                    aria-hidden="true"
                ></i>
                <span>Jobs</span>
            </a>


            <!-- 3. SERVICES -->
            <a
                class="menu-item"
                href="services.html"
                aria-label="Services"
            >
                <i
                    class="fas fa-tools menu-icon icon-services"
                    aria-hidden="true"
                ></i>
                <span>Services</span>
            </a>


            <!-- 4. WALLET -->
            <a
                class="menu-item"
                href="wallet.html"
                aria-label="Wallet"
            >
                <i
                    class="fas fa-wallet menu-icon icon-wallet"
                    aria-hidden="true"
                ></i>
                <span>Wallet</span>
            </a>


            <!-- 5. TICKETS -->
            <a
                class="menu-item"
                href="tickets.html"
                aria-label="Tickets"
            >
                <i
                    class="fas fa-ticket-alt menu-icon icon-tickets"
                    aria-hidden="true"
                ></i>
                <span>Tickets</span>
            </a>


            <!-- 6. ADS -->
            <a
                class="menu-item"
                href="ads.html"
                aria-label="Advertisements"
            >
                <i
                    class="fas fa-bullhorn menu-icon icon-ads"
                    aria-hidden="true"
                ></i>
                <span>Ads</span>
            </a>


            <!-- 7. CHAT -->
            <a
                class="menu-item"
                href="chat.html"
                aria-label="Chat"
            >
                <i
                    class="fas fa-comments menu-icon icon-chat"
                    aria-hidden="true"
                ></i>
                <span>Chat</span>
            </a>


            <!-- 8. LANGUAGE -->
            <a
                class="menu-item"
                href="language.html"
                aria-label="Language"
            >
                <i
                    class="fas fa-language menu-icon icon-language"
                    aria-hidden="true"
                ></i>
                <span>Language</span>
            </a>


            <!-- 9. DELIVERY -->
            <a
                class="menu-item"
                href="delivery.html"
                aria-label="Delivery"
            >
                <i
                    class="fas fa-shipping-fast menu-icon icon-delivery"
                    aria-hidden="true"
                ></i>
                <span>Delivery</span>
            </a>


            <!-- 10. REVIEWS -->
            <a
                class="menu-item"
                href="reviews.html"
                aria-label="Reviews"
            >
                <i
                    class="fas fa-star menu-icon icon-reviews"
                    aria-hidden="true"
                ></i>
                <span>Reviews</span>
            </a>


            <!-- 11. EVENTS -->
            <a
                class="menu-item"
                href="events.html"
                aria-label="Events"
            >
                <i
                    class="fas fa-calendar-alt menu-icon icon-events"
                    aria-hidden="true"
                ></i>
                <span>Events</span>
            </a>


            <!-- 12. SUPPORT -->
            <a
                class="menu-item"
                href="support.html"
                aria-label="Support"
            >
                <i
                    class="fas fa-headset menu-icon icon-support"
                    aria-hidden="true"
                ></i>
                <span>Support</span>
            </a>

        </nav>


        <!-- ACCOUNT -->
        <div
            class="create-account"
            onclick="window.location.href='login.html'"
            role="button"
            tabindex="0"
            aria-label="Create New Account"
            onkeydown="
                if(event.key === 'Enter' || event.key === ' ') {
                    window.location.href='login.html';
                }
            "
        >
            Create New Account
        </div>


        <!-- SECURITY -->
        <div
            class="security-badge"
            aria-label="Safe and Secure"
        >
            Safe • Secure
        </div>

    </main>

</body>
</html>
