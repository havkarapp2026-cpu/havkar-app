    min-height:100vh;

/* =====================================================
   HAVKAR HOME
   The approved visual is loaded as home.png
   ===================================================== */

.havkar-home{

    position:relative;

    width:100%;
    max-width:430px;

    aspect-ratio:1024 / 1536;

    margin:0 auto;

    background-image:url("home.png");

    background-repeat:no-repeat;

    background-position:center;

    background-size:100% 100%;

    overflow:hidden;

    -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   CLICKABLE AREAS
   ===================================================== */

.hotspot{

    position:absolute;

    display:block;

    background:transparent;

    border:0;

    border-radius:20px;

    text-decoration:none;

    cursor:pointer;

    -webkit-tap-highlight-color:
        rgba(46,125,50,.08);
}

.hotspot:focus-visible{

    outline:
        3px solid
        rgba(46,125,50,.55);

    outline-offset:2px;
}
