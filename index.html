<script src="/havkar-supabase-config.js"></script>
<script src="/havkar-sw-register.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient(
  window.HAVKAR_SUPABASE_CONFIG.url,
  window.HAVKAR_SUPABASE_CONFIG.publishableKey,
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
);
const signedInPanel = document.getElementById("signedInPanel");
const signedInLabel = document.getElementById("signedInLabel");
function updateAccount(user) {
  // Home no longer exposes guest signup/login chrome; Profile & Settings remains the entry.
  if (signedInPanel) signedInPanel.hidden = !user;
  // Public Home must never render personal emails (Gmail or otherwise).
  if (signedInLabel) {
    // Phrase-key catalog (English source). Fix Swedish/home showing raw English.
    let i18nText = "Signed in";
    if (window.HAVKAR_I18N && typeof window.HAVKAR_I18N.t === "function") {
      i18nText = window.HAVKAR_I18N.t("Signed in") || i18nText;
    }
    signedInLabel.textContent = user ? i18nText : "";
  }
}
if (signedInPanel) signedInPanel.hidden = true;
try {
  const { data, error } = await supabase.auth.getSession();
  if (error) throw error;
  updateAccount(data.session?.user || null);
} catch (error) {
  console.error("HAVKAR session check failed", error);
  if (signedInPanel) signedInPanel.hidden = true;
}
supabase.auth.onAuthStateChange((_event, session) => updateAccount(session?.user || null));

document.addEventListener("havkar:i18n-ready", () => {
  try {
    if (!window.HAVKAR_I18N || typeof window.HAVKAR_I18N.t !== "function") return;
    if (typeof window.HAVKAR_I18N.applyDataI18nAttributes === "function") {
      window.HAVKAR_I18N.applyDataI18nAttributes(document.body);
    }
    const bar = document.querySelector(".home-settings-bar");
    if (!bar) return;
    const title = bar.querySelector("strong[data-i18n]");
    const sub = bar.querySelector(".home-settings-bar-copy > span[data-i18n]");
    if (title) title.textContent = window.HAVKAR_I18N.t("Profile & Settings") || title.textContent;
    if (sub) {
      sub.textContent =
        window.HAVKAR_I18N.t("Language, support, about, account, and privacy") ||
        sub.textContent;
    }
    bar.setAttribute(
      "aria-label",
      window.HAVKAR_I18N.t("Profile & Settings") || "Profile and Settings"
    );
  } catch (_e) {}
});
</script>
</body>
</html>
