h1 {

/* =========================

.menu-grid {

.menu-item {

}

.menu-item img {

}

.visually-hidden {

    width: 1px;
    height: 1px;

    margin: -1px;

    white-space: nowrap;

}

.menu-item:hover {

}

.menu-item:focus-visible {

<script src="/havkar-supabase-config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient(
  window.HAVKAR_SUPABASE_CONFIG.url,
  window.HAVKAR_SUPABASE_CONFIG.publishableKey,
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
);
const guestSignup = document.getElementById("guestSignup");
const guestLogin = document.getElementById("guestLogin");
function updateAccount(user) {
  guestSignup.hidden = !!user;
  guestLogin.hidden = !!user;
}
// Avoid briefly displaying guest actions until the stored session is checked.
guestSignup.hidden = true;
guestLogin.hidden = true;
try {
  const { data, error } = await supabase.auth.getSession();
  if (error) throw error;
  updateAccount(data.session?.user || null);
} catch (error) {
  console.error("HAVKAR session check failed", error);
  guestSignup.hidden = false;
  guestLogin.hidden = false;
}
supabase.auth.onAuthStateChange((_event, session) => updateAccount(session?.user || null));
</script>
