<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="impact-site-verification"
      content="3cf3cbf3-e849-452a-bb8f-d0b1cd29ad81">

<title>HAVKAR – Global Platform</title>

<meta name="description"
      content="HAVKAR – Connect • Trade • Work • Help">

<meta name="robots" content="index, follow">
<meta name="author" content="HAVKAR">
<meta name="theme-color" content="#2e7d32">

<link rel="canonical" href="https://havkar-app.vercel.app/">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    min-height:100%;
    scroll-behavior:smooth;
}

body{
    width:100%;
    min-height:100vh;
    overflow-x:hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #c8e6c9 0%,
            #a5d6a7 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:
        max(16px,env(safe-area-inset-top))
        max(16px,env(safe-area-inset-right))
        max(16px,env(safe-area-inset-bottom))
        max(16px,env(safe-area-inset-left));
}

/* MAIN CARD */
.container{
    position:relative;

    width:100%;
    max-width:420px;
    min-height:680px;

    padding:28px 18px 24px;

    background:rgba(255,255,255,.98);

    border:2px solid rgba(200,230,200,.75);

    border-radius:38px;

    box-shadow:
        0 24px 70px rgba(39,104,52,.14),
        inset 0 0 0 1px rgba(255,255,255,.9);

    overflow:hidden;
}

/* SOFT DOT BACKGROUND */
.container::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            circle,
            rgba(140,180,140,.28) 2px,
            transparent 2px
        );

    background-size:40px 40px;

    opacity:.65;

    pointer-events:none;
}

.container>*{
    position:relative;
    z-index:2;
}

/* HEADER */
.logo-section{
    text-align:center;
    margin-bottom:20px;
}

/* PROFESSIONAL CSS GLOBE */
.globe{
    width:128px;
    height:128px;

    margin:0 auto 10px;

    border-radius:50%;

    position:relative;

    background:
        radial-gradient(
            circle at 35% 30%,
            #5ec8e8 0%,
            #087aa1 38%,
            #034e70 72%,
            #023b55 100%
        );

    box-shadow:
        0 12px 28px rgba(0,70,90,.25),
        inset -12px -14px 22px rgba(0,0,0,.20),
        inset 10px 8px 18px rgba(255,255,255,.18);

    overflow:visible;
}

/* GREEN LAND */
.globe::before{
    content:"";
    position:absolute;
    width:72px;
    height:48px;

    left:28px;
    top:34px;

    background:
        #54a85a;

    border-radius:
        48% 42% 55% 35% /
        50% 45% 55% 40%;

    transform:rotate(-12deg);

    box-shadow:
        28px 25px 0 -10px #4b9b51,
        -18px 25px 0 -15px #63b766;
}

/* GLOBE ORBIT */
.globe::after{
    content:"";
    position:absolute;

    left:-23px;
    top:46px;

    width:174px;
    height:48px;

    border:
        3px solid rgba(75,190,88,.75);

    border-radius:50%;

    transform:rotate(-10deg);

    box-shadow:
        0 0 8px rgba(70,190,90,.28);
}

h1{
    color:#17652a;

    font-size:2.55rem;
    font-weight:900;

    letter-spacing:3px;
    line-height:1.1;

    text-shadow:
        0 2px 0 rgba(255,255,255,.9),
        0 5px 12px rgba(46,125,50,.14);

    margin-bottom:7px;
}

.tagline{
    color:#25352a;

    font-size:.88rem;
    font-weight:700;

    letter-spacing:1.1px;
}

/* 12 OPTIONS */
.menu-grid{
    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:9px;

    margin-bottom:22px;
}

.menu-item{
    min-height:104px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:12px 7px;

    text-decoration:none;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #f8fcf8 100%
        );

    border:
        1px solid rgba(71,132,79,.08);

    border-radius:19px;

    box-shadow:
        0 8px 22px rgba(46,100,55,.075),
        inset 0 1px 0 rgba(255,255,255,.95);

    cursor:pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.menu-item:hover{
    transform:translateY(-3px);

    box-shadow:
        0 12px 28px rgba(46,100,55,.12),
        inset 0 1px 0 rgba(255,255,255,.95);
}

.menu-item:active{
    transform:scale(.97);
}

.menu-icon{
    width:52px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:7px;

    border-radius:16px;

    font-size:1.72rem;

    color:#43a85b;

    background:
        linear-gradient(
            145deg,
            #f0faf2,
            #e3f4e7
        );

    box-shadow:
        0 7px 14px rgba(44,116,57,.10),
        inset 0 1px 0 rgba(255,255,255,.95);

    text-shadow:
        0 2px 1px rgba(20,80,32,.20),
        0 5px 10px rgba(46,125,50,.12);
}

.menu-item span{
    color:#18251c;

    font-size:.72rem;
    font-weight:800;

    line-height:1.2;

    text-align:center;
}

/* ALL ICONS SAME PROFESSIONAL GREEN */
.icon-buy,
.icon-jobs,
.icon-services,
.icon-wallet,
.icon-tickets,
.icon-ads,
.icon-delivery,
.icon-events,
.icon-chat,
.icon-language,
.icon-reviews,
.icon-support{
    color:#43a85b;
}

/* CREATE ACCOUNT */
.create-account{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    min-height:56px;

    margin-top:3px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #16833c 0%,
            #35ad5a 100%
        );

    color:white;

    font-size:1rem;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 10px 24px rgba(32,130,59,.25),
        inset 0 1px 0 rgba(255,255,255,.25);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.create-account:hover{
    transform:translateY(-2px);

    box-shadow:
        0 13px 28px rgba(32,130,59,.30);
}

.create-account i{
    font-size:1.2rem;
}

.create-account .arrow{
    font-size:1.35rem;
    margin-left:2px;
}

/* LOGIN */
.login{
    text-align:center;

    margin-top:14px;

    color:#55705b;

    font-size:.88rem;
    font-weight:600;
}

.login a{
    color:#16833c;

    font-weight:800;

    text-decoration:none;
}

.login a:hover{
    text-decoration:underline;
}

/* SECURITY */
.security{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    margin-top:18px;

    color:#54705b;

    font-size:.78rem;
    font-weight:600;
}

.security i{
    display:flex;

    align-items:center;
    justify-content:center;

    width:30px;
    height:30px;

    border-radius:50%;

    color:white;

    background:
        linear-gradient(
            135deg,
            #16833c,
            #35ad5a
        );

    box-shadow:
        0 5px 12px rgba(32,130,59,.20);
}

/* MOBILE */
@media(max-width:380px){

    .container{
        padding:
            23px 13px 20px;
    }

    .globe{
        width:112px;
        height:112px;
    }

    .globe::after{
        width:154px;
        left:-21px;
    }

    h1{
        font-size:2.2rem;
        letter-spacing:2.5px;
    }

    .menu-grid{
        gap:7px;
    }

    .menu-item{
        min-height:98px;
    }

    .menu-icon{
        width:48px;
        height:48px;
        font-size:1.55rem;
    }

    .menu-item span{
        font-size:.68rem;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        transition:none !important;
    }
}
</style>
</head>

<body>

<main class="container">

    <!-- HAVKAR HEADER -->
    <section class="logo-section">

        <div class="globe" aria-label="HAVKAR Globe"></div>

        <h1>HAVKAR</h1>

        <div class="tagline">
            Connect • Trade • Work • Help
        </div>

    </section>


    <!-- 12 HAVKAR OPTIONS -->
    <nav class="menu-grid" aria-label="HAVKAR services">

        <!-- 1 -->
        <a class="menu-item"
           href="buy-sell.html"
           aria-label="Buy and Sell">

            <i class="fas fa-shopping-cart menu-icon icon-buy"></i>

            <span>Buy &amp; Sell</span>

        </a>


        <!-- 2 -->
        <a class="menu-item"
           href="jobs.html"
           aria-label="Jobs">

            <i class="fas fa-briefcase menu-icon icon-jobs"></i>

            <span>Jobs</span>

        </a>


        <!-- 3 -->
        <a class="menu-item"
           href="services.html"
           aria-label="Services">

            <i class="fas fa-tools menu-icon icon-services"></i>

            <span>Services</span>

        </a>


        <!-- 4 -->
        <a class="menu-item"
           href="wallet.html"
           aria-label="Wallet">

            <i class="fas fa-wallet menu-icon icon-wallet"></i>

            <span>Wallet</span>

        </a>


        <!-- 5 -->
        <a class="menu-item"
           href="tickets.html"
           aria-label="Tickets">

            <i class="fas fa-ticket-alt menu-icon icon-tickets"></i>

            <span>Tickets</span>

        </a>


        <!-- 6 -->
        <a class="menu-item"
           href="ads.html"
           aria-label="Advertisements">

            <i class="fas fa-bullhorn menu-icon icon-ads"></i>

            <span>Ads</span>

        </a>


        <!-- 7 -->
        <a class="menu-item"
           href="delivery.html"
           aria-label="Delivery">

            <i class="fas fa-truck menu-icon icon-delivery"></i>

            <span>Delivery</span>

        </a>


        <!-- 8 -->
        <a class="menu-item"
           href="events.html"
           aria-label="Events">

            <i class="fas fa-calendar-alt menu-icon icon-events"></i>

            <span>Events</span>

        </a>


        <!-- 9 -->
        <a class="menu-item"
           href="chat.html"
           aria-label="Chat">

            <i class="fas fa-comments menu-icon icon-chat"></i>

            <span>Chat</span>

        </a>


        <!-- 10 -->
        <a class="menu-item"
           href="language.html"
           aria-label="Language">

            <i class="fas fa-language menu-icon icon-language"></i>

            <span>Language</span>

        </a>


        <!-- 11 -->
        <a class="menu-item"
           href="reviews.html"
           aria-label="Reviews">

            <i class="fas fa-star menu-icon icon-reviews"></i>

            <span>Reviews</span>

        </a>


        <!-- 12 -->
        <a class="menu-item"
           href="support.html"
           aria-label="Support">

            <i class="fas fa-headset menu-icon icon-support"></i>

            <span>Support</span>

        </a>

    </nav>


    <!-- CREATE ACCOUNT -->
    <div
        class="create-account"
        role="button"
        tabindex="0"
        onclick="window.location.href='login.html'"
        onkeydown="
            if(event.key==='Enter' || event.key===' '){
                event.preventDefault();
                window.location.href='login.html';
            }
        "
        aria-label="Create New Account">

        <i class="fas fa-user-plus"></i>

        <span>Create New Account</span>

        <span class="arrow">›</span>

    </div>


    <!-- LOGIN -->
    <div class="login">

        Already have an account?

        <a href="login.html">Log In</a>

    </div>


    <!-- SECURITY -->
    <div class="security">

        <i class="fas fa-check"></i>

        <span>Safe • Secure • Trusted</span>

    </div>

</main>

</body>
</html>
