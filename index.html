<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>HAVKAR – Connect • Trade • Work • Help</title>

<meta name="description"
      content="HAVKAR – Connect • Trade • Work • Help">

<meta name="theme-color" content="#16833c">

<!-- HAVKAR external icon -->
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<meta property="og:type" content="website">
<meta property="og:title" content="HAVKAR">
<meta property="og:description"
      content="Connect • Trade • Work • Help">
<meta property="og:image"
      content="https://havkar-app.vercel.app/icon.png">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    min-height:100%;
}

body{
    width:100%;
    min-height:100vh;
    overflow-x:hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 0%,
            #e9faed 0%,
            #cdeed3 42%,
            #a8dcb2 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:10px;
}

/* MAIN PANEL */

.container{
    position:relative;

    width:100%;
    max-width:430px;

    max-height:97vh;

    overflow-y:auto;
    overflow-x:hidden;

    padding:
        18px
        15px
        22px;

    border-radius:42px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.98),
            rgba(247,253,249,.96)
        );

    border:
        2px solid
        rgba(183,225,193,.75);

    box-shadow:
        0 25px 70px
        rgba(31,101,48,.16),

        inset
        0 1px 0
        rgba(255,255,255,.98);
}

/* SOFT DOT PATTERN */

.container::before{
    content:"";

    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            circle,
            rgba(93,157,103,.20) 2px,
            transparent 2px
        );

    background-size:40px 40px;

    opacity:.55;

    pointer-events:none;
}

.container>*{
    position:relative;
    z-index:1;
}

/* =========================================
   BRAND
   ========================================= */

.logo-section{
    text-align:center;
    margin-bottom:17px;
}

/*
   EXACT IMAGE FILE USED INSIDE THE APP:
   globe.png
*/

.globe-image{
    display:block;

    width:220px;
    height:145px;

    margin:
        -8px
        auto
        -2px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 8px 18px
            rgba(44,139,68,.18)
        );
}

h1{
    margin:0 0 5px;

    color:#12632d;

    font-size:2.45rem;
    line-height:1;

    font-weight:900;

    letter-spacing:3px;

    text-shadow:
        0 2px 0 rgba(255,255,255,.95),
        0 5px 12px rgba(34,112,51,.14);
}

.tagline{
    color:#24372a;

    font-size:.88rem;
    font-weight:700;

    letter-spacing:1.1px;
}

/* =========================================
   12 OPTIONS
   ========================================= */

.menu-grid{
    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:9px;

    margin-bottom:20px;
}

.menu-item{
    min-height:104px;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:10px 6px;

    text-decoration:none;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f4fbf6
        );

    border:
        1px solid
        rgba(56,126,67,.08);

    border-radius:20px;

    box-shadow:
        0 8px 22px
        rgba(42,105,53,.08),

        inset
        0 1px 0
        rgba(255,255,255,.98);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.menu-item:hover{
    transform:translateY(-3px);

    box-shadow:
        0 13px 28px
        rgba(42,105,53,.14);
}

.menu-item:active{
    transform:scale(.98);
}

/* =========================================
   3D-STYLE ICONS
   ========================================= */

.menu-icon{
    width:54px;
    height:54px;

    display:flex;

    justify-content:center;
    align-items:center;

    margin-bottom:8px;

    border-radius:16px;

    color:#43a95d;

    font-size:1.72rem;

    background:
        linear-gradient(
            145deg,
            #f1faf3,
            #e0f3e5
        );

    box-shadow:
        0 7px 15px
        rgba(37,119,55,.11),

        inset
        0 1px 0
        rgba(255,255,255,.98);

    text-shadow:
        0 2px 2px
        rgba(24,94,40,.25),

        0 5px 10px
        rgba(48,137,67,.15);
}

.menu-item span{
    color:#17231b;

    font-size:.72rem;

    font-weight:800;

    line-height:1.2;

    text-align:center;
}

/* SAME HAVKAR GREEN IDENTITY */

.icon-buy,
.icon-jobs,
.icon-services,
.icon-wallet,
.icon-tickets,
.icon-ads,
.icon-delivery,
.icon-events,
.icon-chat,
.icon-language,
.icon-reviews,
.icon-support{
    color:#43a95d;
}

/* =========================================
   CREATE ACCOUNT
   ========================================= */

.create-account{
    width:100%;

    min-height:54px;

    display:flex;

    justify-content:center;
    align-items:center;

    margin-bottom:12px;

    padding:13px 18px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #12803b,
            #38b55d
        );

    color:white;

    font-size:1rem;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 10px 25px
        rgba(28,133,59,.25),

        inset
        0 1px 0
        rgba(255,255,255,.25);
}

.create-account::after{
    content:"›";

    font-size:2rem;

    line-height:0;

    margin-left:15px;
}

/* =========================================
   LOGIN
   ========================================= */

.login-line{
    text-align:center;

    margin-bottom:16px;

    color:#587060;

    font-size:.86rem;

    font-weight:600;
}

.login-link{
    color:#16753a;

    font-weight:800;

    text-decoration:none;
}

.login-link:hover{
    text-decoration:underline;
}

/* =========================================
   SECURITY
   ========================================= */

.security-badge{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:7px;

    color:#55705c;

    font-size:.78rem;

    font-weight:600;
}

.security-badge::before{
    content:"✓";

    width:27px;
    height:27px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:50%;

    color:white;

    font-weight:900;

    background:
        linear-gradient(
            145deg,
            #43b85f,
            #15813b
        );

    box-shadow:
        0 5px 12px
        rgba(26,130,58,.22);
}

/* =========================================
   MOBILE
   ========================================= */

@media(max-width:480px){

    body{
        padding:7px;
    }

    .container{
        max-width:430px;

        padding:
            17px
            13px
            19px;

        border-radius:38px;
    }

    .globe-image{
        width:210px;
        height:137px;
    }

    h1{
        font-size:2.25rem;
        letter-spacing:2.6px;
    }

    .tagline{
        font-size:.78rem;
        letter-spacing:.85px;
    }

    .menu-grid{
        gap:8px;
    }

    .menu-item{
        min-height:100px;
        border-radius:18px;
    }

    .menu-icon{
        width:50px;
        height:50px;

        border-radius:15px;

        font-size:1.62rem;
    }

    .menu-item span{
        font-size:.69rem;
    }
}

@media(max-width:360px){

    .container{
        padding:
            15px
            10px
            17px;
    }

    .globe-image{
        width:190px;
        height:125px;
    }

    h1{
        font-size:2rem;
    }

    .menu-item{
        min-height:94px;
    }

    .menu-icon{
        width:46px;
        height:46px;

        font-size:1.48rem;
    }

    .menu-item span{
        font-size:.65rem;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        transition:none!important;
        animation:none!important;
    }
}

</style>
</head>

<body>

<main class="container">

    <!-- =====================================
         HAVKAR BRAND
         ===================================== -->

    <section
        class="logo-section"
        aria-label="HAVKAR"
    >

        <img
            src="globe.png"
            alt="HAVKAR Globe"
            class="globe-image"
            width="220"
            height="145"
        >

        <h1>HAVKAR</h1>

        <div class="tagline">
            Connect • Trade • Work • Help
        </div>

    </section>


    <!-- =====================================
         12 HAVKAR OPTIONS
         ===================================== -->

    <nav
        class="menu-grid"
        aria-label="HAVKAR services"
    >

        <!-- 1 -->

        <a
            class="menu-item"
            href="buy-sell.html"
            aria-label="Buy and Sell"
        >
            <i
                class="fas fa-cart-shopping menu-icon icon-buy"
                aria-hidden="true"
            ></i>

            <span>Buy &amp; Sell</span>
        </a>


        <!-- 2 -->

        <a
            class="menu-item"
            href="jobs.html"
            aria-label="Jobs"
        >
            <i
                class="fas fa-briefcase menu-icon icon-jobs"
                aria-hidden="true"
            ></i>

            <span>Jobs</span>
        </a>


        <!-- 3 -->

        <a
            class="menu-item"
            href="services.html"
            aria-label="Services"
        >
            <i
                class="fas fa-screwdriver-wrench menu-icon icon-services"
                aria-hidden="true"
            ></i>

            <span>Services</span>
        </a>


        <!-- 4 -->

        <a
            class="menu-item"
            href="wallet.html"
            aria-label="Wallet"
        >
            <i
                class="fas fa-wallet menu-icon icon-wallet"
                aria-hidden="true"
            ></i>

            <span>Wallet</span>
        </a>


        <!-- 5 -->

        <a
            class="menu-item"
            href="tickets.html"
            aria-label="Tickets"
        >
            <i
                class="fas fa-ticket menu-icon icon-tickets"
                aria-hidden="true"
            ></i>

            <span>Tickets</span>
        </a>


        <!-- 6 -->

        <a
            class="menu-item"
            href="ads.html"
            aria-label="Advertisements"
        >
            <i
                class="fas fa-bullhorn menu-icon icon-ads"
                aria-hidden="true"
            ></i>

            <span>Ads</span>
        </a>


        <!-- 7 -->

        <a
            class="menu-item"
            href="delivery.html"
            aria-label="Delivery"
        >
            <i
                class="fas fa-truck-fast menu-icon icon-delivery"
                aria-hidden="true"
            ></i>

            <span>Delivery</span>
        </a>


        <!-- 8 -->

        <a
            class="menu-item"
            href="events.html"
            aria-label="Events"
        >
            <i
                class="fas fa-calendar-days menu-icon icon-events"
                aria-hidden="true"
            ></i>

            <span>Events</span>
        </a>


        <!-- 9 -->

        <a
            class="menu-item"
            href="chat.html"
            aria-label="Chat"
        >
            <i
                class="fas fa-comments menu-icon icon-chat"
                aria-hidden="true"
            ></i>

            <span>Chat</span>
        </a>


        <!-- 10 -->

        <a
            class="menu-item"
            href="language.html"
            aria-label="Language"
        >
            <i
                class="fas fa-language menu-icon icon-language"
                aria-hidden="true"
            ></i>

            <span>Language</span>
        </a>


        <!-- 11 -->

        <a
            class="menu-item"
            href="reviews.html"
            aria-label="Reviews"
        >
            <i
                class="fas fa-star menu-icon icon-reviews"
                aria-hidden="true"
            ></i>

            <span>Reviews</span>
        </a>


        <!-- 12 -->

        <a
            class="menu-item"
            href="support.html"
            aria-label="Support"
        >
            <i
                class="fas fa-headset menu-icon icon-support"
                aria-hidden="true"
            ></i>

            <span>Support</span>
        </a>

    </nav>


    <!-- =====================================
         CREATE ACCOUNT
         ===================================== -->

    <div
        class="create-account"
        onclick="window.location.href='login.html'"
        role="button"
        tabindex="0"
        aria-label="Create New Account"
        onkeydown="
            if(event.key==='Enter'||event.key===' '){
                event.preventDefault();
                window.location.href='login.html';
            }
        "
    >
        Create New Account
    </div>


    <!-- =====================================
         LOGIN
         ===================================== -->

    <div class="login-line">

        Already have an account?

        <a
            class="login-link"
            href="login.html"
        >
            Log In
        </a>

    </div>


    <!-- =====================================
         SECURITY
         ===================================== -->

    <div
        class="security-badge"
        aria-label="Safe Secure Trusted"
    >
        Safe&nbsp; • &nbsp;Secure&nbsp; • &nbsp;Trusted
    </div>

</main>

</body>
</html>
