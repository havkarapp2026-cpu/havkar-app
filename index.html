<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>HAVKAR – Global Platform for Jobs, Services, Trade & Travel</title>

    <meta
        name="description"
        content="HAVKAR is a global platform connecting people with jobs, services, buying and selling, travel, tickets, delivery, chat, events and support."
    >

    <meta
        name="keywords"
        content="HAVKAR, jobs, services, buy and sell, marketplace, travel, tickets, flights, trains, buses, delivery, chat, events, support"
    >

    <meta name="robots" content="index, follow">
    <meta name="author" content="HAVKAR">
    <meta name="theme-color" content="#2e7d32">

    <link
        rel="canonical"
        href="https://havkar-app.vercel.app/"
    >

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta
        property="og:title"
        content="HAVKAR – Global Platform"
    >
    <meta
        property="og:description"
        content="Connect • Trade • Work • Help"
    >
    <meta
        property="og:url"
        content="https://havkar-app.vercel.app/"
    >
    <meta
        property="og:image"
        content="https://havkar-app.vercel.app/icon.png"
    >
    <meta property="og:site_name" content="HAVKAR">

    <!-- App Icon -->
    <link
        rel="icon"
        type="image/png"
        href="icon.png"
    >

    <link
        rel="apple-touch-icon"
        href="icon.png"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #d8f2dc 0%,
                    #b9e4bf 45%,
                    #a6d8ae 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));
        }

        /* =========================================
           MAIN HAVKAR PANEL
           ========================================= */

        .container {
            position: relative;

            width: 100%;
            max-width: 430px;
            max-height: 96vh;

            padding: 25px 15px 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.985),
                    rgba(248,253,249,.98)
                );

            border:
                2px solid
                rgba(190,225,198,.75);

            border-radius: 40px;

            box-shadow:
                0 25px 70px rgba(39,104,52,.16),
                inset 0 1px 0 rgba(255,255,255,.95);

            overflow-y: auto;
            overflow-x: hidden;

            scrollbar-width: thin;
        }

        /* Soft dotted background */

        .container::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(
                    circle,
                    rgba(92,150,100,.20) 2px,
                    transparent 2px
                );

            background-size: 38px 38px;

            opacity: .65;

            pointer-events: none;
        }

        .container > * {
            position: relative;
            z-index: 1;
        }

        /* =========================================
           LOGO / GLOBE
           ========================================= */

        .logo-section {
            text-align: center;
            margin-bottom: 18px;
        }

        .globe-image {
            display: block;

            width: 215px;
            height: 130px;

            margin:
                -2px
                auto
                0;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 10px 20px
                    rgba(46,125,50,.18)
                );
        }

        h1 {
            margin-top: -2px;
            margin-bottom: 6px;

            color: #17652a;

            font-size: 2.45rem;
            font-weight: 900;

            letter-spacing: 3px;
            line-height: 1.05;

            text-shadow:
                0 2px 0 rgba(255,255,255,.95),
                0 5px 12px rgba(46,125,50,.14);
        }

        .tagline {
            color: #26372b;

            font-size: .88rem;
            font-weight: 700;

            letter-spacing: 1.05px;
        }

        /* =========================================
           12 MAIN OPTIONS
           ========================================= */

        .menu-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 9px;

            margin-bottom: 22px;
        }

        .menu-item {
            min-height: 105px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 12px 7px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #f7fcf8 100%
                );

            border:
                1px solid
                rgba(71,132,79,.09);

            border-radius: 20px;

            text-align: center;

            cursor: pointer;

            text-decoration: none;

            box-shadow:
                0 8px 20px
                rgba(46,100,55,.075),

                inset 0 1px 0
                rgba(255,255,255,.95);

            transition:
                transform .22s ease,
                box-shadow .22s ease,
                background .22s ease;
        }

        .menu-item:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 28px
                rgba(46,100,55,.13),

                inset 0 1px 0
                rgba(255,255,255,.95);

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f2faf4
                );
        }

        .menu-item:active {
            transform:
                translateY(-1px)
                scale(.98);
        }

        .menu-item:focus-visible {
            outline:
                3px solid
                rgba(46,125,50,.30);

            outline-offset: 3px;
        }

        /* =========================================
           PROFESSIONAL SEMI-3D ICON STYLE
           ========================================= */

        .menu-icon {
            width: 53px;
            height: 53px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 8px;

            border-radius: 16px;

            font-size: 1.72rem;

            color: #43a85b;

            background:
                linear-gradient(
                    145deg,
                    #f0faf2,
                    #e2f4e6
                );

            box-shadow:
                0 7px 14px
                rgba(44,116,57,.10),

                inset 0 1px 0
                rgba(255,255,255,.95);

            text-shadow:
                0 2px 1px
                rgba(20,80,32,.20),

                0 5px 10px
                rgba(46,125,50,.14);
        }

        .menu-item span {
            display: block;

            color: #18251c;

            font-size: .72rem;
            font-weight: 800;

            line-height: 1.2;
        }

        /* All HAVKAR icons use the same professional green identity */

        .icon-buy,
        .icon-jobs,
        .icon-services,
        .icon-wallet,
        .icon-tickets,
        .icon-ads,
        .icon-chat,
        .icon-language,
        .icon-delivery,
        .icon-reviews,
        .icon-events,
        .icon-support {
            color: #43a85b;
        }

        /* =========================================
           CREATE ACCOUNT
           ========================================= */

        .create-account {
            width: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 54px;

            padding: 14px 18px;

            margin-bottom: 13px;

            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    #16833c 0%,
                    #35ad5a 100%
                );

            color: #ffffff;

            font-size: 1rem;
            font-weight: 800;

            text-align: center;

            cursor: pointer;

            box-shadow:
                0 10px 24px
                rgba(32,130,59,.25),

                inset 0 1px 0
                rgba(255,255,255,.25);

            transition:
                transform .22s ease,
                box-shadow .22s ease;
        }

        .create-account::after {
            content: "›";

            font-size: 2rem;

            line-height: 0;

            margin-left: 15px;

            margin-top: -2px;
        }

        .create-account:hover {
            transform: translateY(-2px);

            box-shadow:
                0 13px 28px
                rgba(32,130,59,.32);
        }

        .create-account:active {
            transform: translateY(0);
        }

        .create-account:focus-visible {
            outline:
                3px solid
                rgba(46,125,50,.30);

            outline-offset: 4px;
        }

        /* =========================================
           LOGIN
           ========================================= */

        .login-line {
            margin-bottom: 17px;

            text-align: center;

            color: #52705a;

            font-size: .86rem;
            font-weight: 600;
        }

        .login-link {
            color: #19733a;

            font-weight: 800;

            cursor: pointer;

            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        /* =========================================
           SECURITY
           ========================================= */

        .security-badge {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 7px;

            color: #54705b;

            font-size: .78rem;
            font-weight: 600;

            text-align: center;
        }

        .security-badge::before {
            content: "✓";

            width: 25px;
            height: 25px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #42b95d,
                    #18833b
                );

            color: white;

            font-size: .85rem;
            font-weight: 900;

            box-shadow:
                0 4px 9px
                rgba(31,130,59,.20);
        }

        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 480px) {

            body {
                padding: 9px;
            }

            .container {
                max-width: 430px;

                padding:
                    22px
                    14px
                    20px;

                border-radius: 37px;
            }

            .globe-image {
                width: 205px;
                height: 124px;
            }

            h1 {
                font-size: 2.25rem;
                letter-spacing: 2.7px;
            }

            .tagline {
                font-size: .78rem;
                letter-spacing: .9px;
            }

            .menu-grid {
                gap: 8px;
            }

            .menu-item {
                min-height: 101px;
                border-radius: 18px;
            }

            .menu-icon {
                width: 50px;
                height: 50px;

                border-radius: 15px;

                font-size: 1.65rem;
            }

            .menu-item span {
                font-size: .70rem;
            }

            .create-account {
                min-height: 52px;
                font-size: .95rem;
            }
        }

        @media (max-width: 360px) {

            .container {
                padding:
                    20px
                    11px
                    18px;
            }

            .globe-image {
                width: 185px;
                height: 112px;
            }

            h1 {
                font-size: 2rem;
            }

            .menu-grid {
                gap: 7px;
            }

            .menu-item {
                min-height: 94px;
                border-radius: 17px;
            }

            .menu-icon {
                width: 46px;
                height: 46px;

                border-radius: 14px;

                font-size: 1.5rem;
            }

            .menu-item span {
                font-size: .66rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;
            }
        }

    </style>
</head>

<body>

    <main class="container">

        <!-- =========================================
             HAVKAR BRAND
             ========================================= -->

        <section
            class="logo-section"
            aria-label="HAVKAR"
        >

            <!--
                IMPORTANT:
                globe.png = 3D globe inside Home
                icon.png  = external app/site icon
            -->

            <img
                src="globe.png"
                alt="HAVKAR Globe"
                class="globe-image"
                width="205"
                height="124"
                loading="eager"
            >

            <h1>HAVKAR</h1>

            <div class="tagline">
                Connect • Trade • Work • Help
            </div>

        </section>


        <!-- =========================================
             12 HAVKAR OPTIONS
             ========================================= -->

        <nav
            class="menu-grid"
            aria-label="HAVKAR services"
        >

            <!-- 1. BUY & SELL -->

            <a
                class="menu-item"
                href="buy-sell.html"
                aria-label="Buy and Sell"
            >
                <i
                    class="fas fa-shopping-cart menu-icon icon-buy"
                    aria-hidden="true"
                ></i>

                <span>Buy &amp; Sell</span>
            </a>


            <!-- 2. JOBS -->

            <a
                class="menu-item"
                href="jobs.html"
                aria-label="Jobs"
            >
                <i
                    class="fas fa-briefcase menu-icon icon-jobs"
                    aria-hidden="true"
                ></i>

                <span>Jobs</span>
            </a>


            <!-- 3. SERVICES -->

            <a
                class="menu-item"
                href="services.html"
                aria-label="Services"
            >
                <i
                    class="fas fa-screwdriver-wrench menu-icon icon-services"
                    aria-hidden="true"
                ></i>

                <span>Services</span>
            </a>


            <!-- 4. WALLET -->

            <a
                class="menu-item"
                href="wallet.html"
                aria-label="Wallet"
            >
                <i
                    class="fas fa-wallet menu-icon icon-wallet"
                    aria-hidden="true"
                ></i>

                <span>Wallet</span>
            </a>


            <!-- 5. TICKETS -->

            <a
                class="menu-item"
                href="tickets.html"
                aria-label="Tickets"
            >
                <i
                    class="fas fa-ticket menu-icon icon-tickets"
                    aria-hidden="true"
                ></i>

                <span>Tickets</span>
            </a>


            <!-- 6. ADS -->

            <a
                class="menu-item"
                href="ads.html"
                aria-label="Advertisements"
            >
                <i
                    class="fas fa-bullhorn menu-icon icon-ads"
                    aria-hidden="true"
                ></i>

                <span>Ads</span>
            </a>


            <!-- 7. DELIVERY -->

            <a
                class="menu-item"
                href="delivery.html"
                aria-label="Delivery"
            >
                <i
                    class="fas fa-truck-fast menu-icon icon-delivery"
                    aria-hidden="true"
                ></i>

                <span>Delivery</span>
            </a>


            <!-- 8. EVENTS -->

            <a
                class="menu-item"
                href="events.html"
                aria-label="Events"
            >
                <i
                    class="fas fa-calendar-days menu-icon icon-events"
                    aria-hidden="true"
                ></i>

                <span>Events</span>
            </a>


            <!-- 9. CHAT -->

            <a
                class="menu-item"
                href="chat.html"
                aria-label="Chat"
            >
                <i
                    class="fas fa-comments menu-icon icon-chat"
                    aria-hidden="true"
                ></i>

                <span>Chat</span>
            </a>


            <!-- 10. LANGUAGE -->

            <a
                class="menu-item"
                href="language.html"
                aria-label="Language"
            >
                <i
                    class="fas fa-language menu-icon icon-language"
                    aria-hidden="true"
                ></i>

                <span>Language</span>
            </a>


            <!-- 11. REVIEWS -->

            <a
                class="menu-item"
                href="reviews.html"
                aria-label="Reviews"
            >
                <i
                    class="fas fa-star menu-icon icon-reviews"
                    aria-hidden="true"
                ></i>

                <span>Reviews</span>
            </a>


            <!-- 12. SUPPORT -->

            <a
                class="menu-item"
                href="support.html"
                aria-label="Support"
            >
                <i
                    class="fas fa-headset menu-icon icon-support"
                    aria-hidden="true"
                ></i>

                <span>Support</span>
            </a>

        </nav>


        <!-- =========================================
             CREATE ACCOUNT
             ========================================= -->

        <div
            class="create-account"
            onclick="window.location.href='login.html'"
            role="button"
            tabindex="0"
            aria-label="Create New Account"
            onkeydown="
                if (event.key === 'Enter' || event.key === ' ') {
                    window.location.href='login.html';
                }
            "
        >
            Create New Account
        </div>


        <!-- =========================================
             LOGIN
             ========================================= -->

        <div class="login-line">
            Already have an account?

            <a
                class="login-link"
                href="login.html"
            >
                Log In
            </a>
        </div>


        <!-- =========================================
             SECURITY
             ========================================= -->

        <div
            class="security-badge"
            aria-label="Safe Secure Trusted"
        >
            Safe&nbsp; • &nbsp;Secure&nbsp; • &nbsp;Trusted
        </div>

    </main>

</body>
</html>
