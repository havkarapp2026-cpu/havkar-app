    min-height:100vh;

   ===================================================== */

.havkar-home{

    position:relative;

    width:100%;

    max-width:1024px;

    margin:0 auto;

    line-height:0;

    overflow:hidden;
}


.havkar-home img{

    display:block;

    width:100%;

    height:auto;

    user-select:none;

    -webkit-user-drag:none;
}

   ===================================================== */

.hotspot{

    text-decoration:none;
