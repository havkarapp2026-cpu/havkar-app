<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#689f38"
    >

    <meta
        name="description"
        content="HAVKAR Business Ads - Discover businesses, restaurants, shops and services."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>HAVKAR - Business Ads</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>

        /* =========================================================
           RESET
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f5f7f4;
            color: #263238;

            padding-bottom: 82px;
        }

        body.loading {
            overflow: hidden;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #689f38 0%,
                    #7cb342 100%
                );

            color: #ffffff;

            padding:
                max(14px, env(safe-area-inset-top))
                18px
                14px;

            box-shadow:
                0 3px 16px rgba(0, 0, 0, 0.14);

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .back-btn,
        .header-icon-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.18);

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1.15rem;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .back-btn:hover,
        .header-icon-btn:hover {
            background:
                rgba(255, 255, 255, 0.28);

            transform: translateY(-1px);
        }

        .header-title {
            min-width: 0;
        }

        .header-title h1 {
            font-size: 1.25rem;
            line-height: 1.15;
            font-weight: 800;
        }

        .header-title p {
            margin-top: 3px;

            font-size: 0.72rem;
            opacity: 0.88;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* =========================================================
           SEARCH AREA
           ========================================================= */

        .search-area {
            background: #ffffff;

            padding:
                14px
                16px
                12px;

            border-bottom:
                1px solid #e7ebe5;
        }

        .search-box {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 10px;

            background: #f4f6f3;

            border:
                1px solid #e1e6df;

            border-radius: 14px;

            padding:
                0 14px;
        }

        .search-box i {
            color: #7cb342;
            font-size: 1rem;
        }

        .search-box input {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            padding: 13px 0;

            color: #263238;
            font-size: 0.95rem;
        }

        .search-box input::placeholder {
            color: #9aa19a;
        }

        /* =========================================================
           CATEGORY TABS
           ========================================================= */

        .tabs {
            background: #ffffff;

            display: flex;

            gap: 9px;

            padding:
                10px 16px 14px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex:
                0 0 auto;

            border: none;

            background: #f1f3f0;

            color: #37423a;

            padding:
                9px 16px;

            border-radius: 22px;

            font-size: 0.82rem;
            font-weight: 700;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .tab:hover {
            transform: translateY(-1px);
        }

        .tab.active {
            background: #7cb342;
            color: #ffffff;
        }

        /* =========================================================
           CONTENT
           ========================================================= */

        .content {
            width: 100%;
            max-width: 760px;

            margin:
                0 auto;

            padding:
                16px 14px 110px;
        }

        .results-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 12px;
        }

        .results-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #37423a;
        }

        .results-count {
            font-size: 0.78rem;
            color: #7a837b;
        }

        /* =========================================================
           STATUS
           ========================================================= */

        .page-status {
            display: none;

            margin-bottom: 14px;

            padding: 12px 14px;

            border-radius: 12px;

            background: #ffffff;

            border:
                1px solid #e4e9e1;

            color: #69736a;

            font-size: 0.82rem;
            line-height: 1.45;
        }

        .page-status.show {
            display: block;
        }

        .page-status.error {
            border-color: #efc7c7;
            background: #fff8f8;
            color: #b3261e;
        }

        .page-status.success {
            border-color: #cfe4c5;
            background: #f7fbf4;
            color: #558b2f;
        }

        /* =========================================================
           LOADING
           ========================================================= */

        .loading-state {
            background: #ffffff;

            border-radius: 18px;

            padding: 45px 25px;

            text-align: center;

            box-shadow:
                0 3px 16px
                rgba(31, 48, 33, 0.06);
        }

        .loading-state i {
            font-size: 2rem;
            color: #7cb342;
            animation: spin 1s linear infinite;
        }

        .loading-state p {
            margin-top: 12px;

            color: #778077;

            font-size: 0.84rem;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           AD CARD
           ========================================================= */

        .ad-card {
            background: #ffffff;

            border-radius: 18px;

            overflow: hidden;

            margin-bottom: 16px;

            box-shadow:
                0 3px 16px
                rgba(31, 48, 33, 0.08);

            border:
                1px solid #edf0eb;

            animation:
                cardIn 0.25s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ad-banner {
            position: relative;

            width: 100%;
            height: 190px;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #c5e1a5
                );

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .ad-banner img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .ad-banner-placeholder {
            font-size: 4.3rem;
            line-height: 1;
        }

        .featured-badge {
            position: absolute;

            top: 12px;
            left: 12px;

            padding:
                6px 10px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.94);

            color: #558b2f;

            font-size: 0.72rem;
            font-weight: 800;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);
        }

        .save-ad-btn {
            position: absolute;

            top: 12px;
            right: 12px;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.94);

            color: #7b847b;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1rem;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);
        }

        .save-ad-btn.saved {
            color: #689f38;
        }

        .save-ad-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .ad-content {
            padding: 16px;
        }

        .company-info {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 13px;
        }

        .company-logo {
            flex:
                0 0 auto;

            width: 52px;
            height: 52px;

            border-radius: 14px;

            background: #f3f5f2;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 1.55rem;
        }

        .company-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .company-text {
            min-width: 0;
        }

        .company-name {
            color: #263238;

            font-size: 1.08rem;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .verified {
            margin-top: 3px;

            color: #7cb342;

            font-size: 0.78rem;
            font-weight: 700;
        }

        .pending {
            color: #a57b18;
        }

        .ad-title {
            color: #263238;

            font-size: 1.02rem;
            font-weight: 800;

            line-height: 1.35;

            margin-bottom: 7px;
        }

        .ad-description {
            color: #667067;

            font-size: 0.88rem;

            line-height: 1.55;

            margin-bottom: 13px;

            white-space: pre-line;
        }

        .ad-meta {
            display: flex;

            flex-wrap: wrap;

            gap:
                8px 14px;

            margin-bottom: 14px;
        }

        .meta-item {
            display: flex;
            align-items: center;

            gap: 5px;

            color: #69736a;

            font-size: 0.78rem;
        }

        .meta-item i {
            color: #7cb342;
        }

        .ad-price {
            display: inline-flex;

            align-items: center;

            margin-bottom: 13px;

            padding:
                6px 10px;

            border-radius: 8px;

            background: #f1f8ec;

            color: #558b2f;

            font-size: 0.82rem;
            font-weight: 800;
        }

        .ad-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;
        }

        .action-btn {
            min-height: 43px;

            border-radius: 11px;

            border:
                2px solid #7cb342;

            background: #ffffff;

            color: #558b2f;

            font-weight: 800;

            font-size: 0.84rem;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .action-btn.primary {
            background: #7cb342;
            color: #ffffff;
        }

        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .empty-state {
            background: #ffffff;

            border-radius: 18px;

            padding:
                50px 25px;

            text-align: center;

            box-shadow:
                0 3px 16px
                rgba(31, 48, 33, 0.06);
        }

        .empty-state i {
            font-size: 3rem;

            color: #b0b8af;

            margin-bottom: 14px;
        }

        .empty-state h3 {
            color: #3f4840;

            font-size: 1.05rem;

            margin-bottom: 7px;
        }

        .empty-state p {
            color: #858d86;

            font-size: 0.84rem;

            line-height: 1.5;
        }

        /* =========================================================
           FLOATING ADD BUTTON
           ========================================================= */

        .fab-button {
            position: fixed;

            right: 20px;

            bottom:
                calc(
                    78px +
                    env(safe-area-inset-bottom)
                );

            z-index: 900;

            width: 62px;
            height: 62px;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #689f38,
                    #7cb342
                );

            color: #ffffff;

            font-size: 1.55rem;

            box-shadow:
                0 8px 25px
                rgba(76, 120, 40, 0.35);

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.2s ease;
        }

        .fab-button:hover {
            transform:
                translateY(-3px)
                scale(1.03);
        }

        /* =========================================================
           BOTTOM NAV
           ========================================================= */

        .bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 950;

            background: #ffffff;

            border-top:
                1px solid #e5e9e3;

            box-shadow:
                0 -3px 15px
                rgba(0, 0, 0, 0.08);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            padding:
                8px
                0
                max(8px, env(safe-area-inset-bottom));
        }

        .nav-item {
            border: none;
            background: transparent;

            color: #929992;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 4px;

            font-size: 0.7rem;
            font-weight: 600;
        }

        .nav-item i {
            font-size: 1.18rem;
        }

        .nav-item.active {
            color: #7cb342;
        }

        /* =========================================================
           MODAL
           ========================================================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 2000;

            background:
                rgba(17, 24, 18, 0.58);

            display: none;

            align-items: flex-end;
            justify-content: center;

            padding: 0;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 650px;

            max-height: 94vh;

            background: #ffffff;

            border-radius:
                24px 24px 0 0;

            overflow-y: auto;

            box-shadow:
                0 -10px 45px
                rgba(0, 0, 0, 0.22);

            animation:
                modalUp 0.25s ease;
        }

        @keyframes modalUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            position: sticky;

            top: 0;

            z-index: 5;

            background: #ffffff;

            display: flex;

            justify-content: space-between;
            align-items: center;

            padding:
                18px 18px 14px;

            border-bottom:
                1px solid #edf0eb;
        }

        .modal-header h2 {
            font-size: 1.12rem;
            color: #263238;
        }

        .modal-close {
            width: 38px;
            height: 38px;

            border: none;
            border-radius: 50%;

            background: #f1f3f0;

            color: #566056;

            font-size: 1rem;
        }

        .modal-body {
            padding: 18px;
        }

        /* =========================================================
           FORM
           ========================================================= */

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;

            margin-bottom: 7px;

            color: #3f4840;

            font-size: 0.82rem;
            font-weight: 800;
        }

        .form-label span {
            color: #d32f2f;
        }

        .form-control {
            width: 100%;

            border:
                1px solid #dce2da;

            border-radius: 11px;

            background: #fafbf9;

            color: #263238;

            padding:
                12px 13px;

            outline: none;

            font-size: 0.9rem;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: #7cb342;

            box-shadow:
                0 0 0 3px
                rgba(124, 179, 66, 0.13);

            background: #ffffff;
        }

        textarea.form-control {
            min-height: 105px;

            resize: vertical;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }

        .image-upload {
            width: 100%;

            min-height: 150px;

            border:
                2px dashed #cdd6c9;

            border-radius: 14px;

            background: #f8faf7;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 8px;

            text-align: center;

            color: #778077;

            cursor: pointer;

            overflow: hidden;
        }

        .image-upload i {
            font-size: 2rem;
            color: #8ca783;
        }

        .image-upload span {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .image-preview {
            display: none;

            width: 100%;
            max-height: 220px;

            object-fit: cover;

            border-radius: 12px;
        }

        .image-preview.show {
            display: block;
        }

        .upload-placeholder.hidden {
            display: none;
        }

        .form-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 20px;
        }

        .form-btn {
            min-height: 46px;

            border-radius: 12px;

            font-weight: 800;

            border: 2px solid #7cb342;
        }

        .form-btn.cancel {
            background: #ffffff;
            color: #558b2f;
        }

        .form-btn.submit {
            background: #7cb342;
            color: #ffffff;
        }

        .form-btn.submit:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        /* =========================================================
           TOAST
           ========================================================= */

        .toast {
            position: fixed;

            left: 50%;

            bottom:
                calc(
                    92px +
                    env(safe-area-inset-bottom)
                );

            z-index: 3000;

            transform:
                translate(-50%, 20px);

            min-width: 240px;
            max-width: calc(100% - 35px);

            padding:
                12px 16px;

            border-radius: 12px;

            background: #263238;

            color: #ffffff;

            text-align: center;

            font-size: 0.82rem;
            font-weight: 700;

            opacity: 0;
            pointer-events: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (min-width: 700px) {

            body {
                padding-bottom: 20px;
            }

            .content {
                padding-bottom: 40px;
            }

            .bottom-nav {
                max-width: 760px;

                left: 50%;

                right: auto;

                width: 760px;

                transform:
                    translateX(-50%);

                border-radius:
                    18px 18px 0 0;
            }

            .fab-button {
                right:
                    calc(
                        50% - 350px
                    );
            }

            .modal-overlay {
                align-items: center;

                padding: 20px;
            }

            .modal {
                border-radius: 22px;

                max-height: 90vh;
            }
        }

        @media (max-width: 430px) {

            .header-title h1 {
                font-size: 1.13rem;
            }

            .header-title p {
                display: none;
            }

            .ad-banner {
                height: 170px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .content {
                padding-left: 12px;
                padding-right: 12px;
            }

            .fab-button {
                right: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }

    </style>
</head>

<body>

    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header class="header">

        <div class="header-left">

            <button
                class="back-btn"
                type="button"
                onclick="goHome()"
                aria-label="Back to Home"
            >
                <i class="fas fa-arrow-left"></i>
            </button>

            <div class="header-title">

                <h1>
                    Business Ads
                </h1>

                <p>
                    Discover businesses near you
                </p>

            </div>

        </div>

        <div class="header-right">

            <button
                class="header-icon-btn"
                type="button"
                onclick="focusSearch()"
                aria-label="Search"
            >
                <i class="fas fa-search"></i>
            </button>

        </div>

    </header>


    <!-- =========================================================
         SEARCH
         ========================================================= -->

    <section class="search-area">

        <div class="search-box">

            <i class="fas fa-search"></i>

            <input
                id="searchInput"
                type="search"
                placeholder="Search ads, categories or cities..."
                autocomplete="off"
                oninput="renderAds()"
            >

        </div>

    </section>


    <!-- =========================================================
         CATEGORY TABS
         ========================================================= -->

    <nav
        class="tabs"
        aria-label="Advertisement categories"
    >

        <button
            class="tab active"
            data-category="all"
            onclick="setCategory('all', this)"
        >
            All
        </button>

        <button
            class="tab"
            data-category="restaurant"
            onclick="setCategory('restaurant', this)"
        >
            Restaurants
        </button>

        <button
            class="tab"
            data-category="shop"
            onclick="setCategory('shop', this)"
        >
            Shops
        </button>

        <button
            class="tab"
            data-category="service"
            onclick="setCategory('service', this)"
        >
            Services
        </button>

        <button
            class="tab"
            data-category="other"
            onclick="setCategory('other', this)"
        >
            Other
        </button>

    </nav>


    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <main class="content">

        <div class="results-header">

            <div
                class="results-title"
                id="resultsTitle"
            >
                Available Ads
            </div>

            <div
                class="results-count"
                id="resultsCount"
            >
                0 ads
            </div>

        </div>


        <div
            class="page-status"
            id="pageStatus"
        ></div>


        <div id="adsContainer">

            <div class="loading-state">

                <i class="fas fa-circle-notch"></i>

                <p>
                    Loading advertisements...
                </p>

            </div>

        </div>

    </main>


    <!-- =========================================================
         FLOATING ADD BUTTON
         ========================================================= -->

    <button
        class="fab-button"

        /* =========================================================
           AUTH
           ========================================================= */

        async function resolveCurrentUser() {

            try {

                const {
                    data: sessionData
                } =
                    await supabaseClient.auth.getSession();

                const session =
                    sessionData
                        ? sessionData.session
                        : null;

                if (session && session.user) {

                    currentUser =
                        session.user;

                    currentUserId =
                        session.user.id;

                    return currentUser;

                }


                const {
                    data: userData
                } =
                    await supabaseClient.auth.getUser();

                if (
                    userData &&
                    userData.user
                ) {

                    currentUser =
                        userData.user;

                    currentUserId =
                        userData.user.id;

                    return currentUser;

                }

            } catch (error) {

                console.error(
                    "HAVKAR auth error:",
                    error
                );

            }

            currentUser =
                null;

            currentUserId =
                null;

            return null;

        }


        function setupAuthListener() {

            supabaseClient.auth.onAuthStateChange(
                async function(
                    event,
                    session
                ) {

                    currentUser =
                        session
                            ? session.user
                            : null;

                    currentUserId =
                        currentUser
                            ? currentUser.id
                            : null;


                    await loadSavedIds();


                    renderAds();

                }
            );

        }


        /* =========================================================
           LOAD ADS FROM SUPABASE
           ========================================================= */

        async function loadAdsFromSupabase() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from(ADS_TABLE)
                    .select(
                        "id,created_at,title,category,price,location,description,user_id,photos,status"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    "HAVKAR ads load error:",
                    error
                );

                throw error;

            }


            adsData =
                Array.isArray(data)
                    ? data
                    : [];


            return adsData;

        }


        /* =========================================================
           SAVED ADS
           ========================================================= */

        async function loadSavedIds() {

            savedAdIds =
                new Set();


            if (!currentUserId) {

                return savedAdIds;

            }


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from(SAVES_TABLE)
                        .select(
                            "ad_id"
                        )
                        .eq(
                            "user_id",
                            currentUserId
                        );


                if (error) {

                    console.error(
                        "HAVKAR saved ads load error:",
                        error
                    );

                    return savedAdIds;

                }


                if (Array.isArray(data)) {

                    data.forEach(
                        row => {

                            if (
                                row &&
                                row.ad_id !== null &&
                                row.ad_id !== undefined
                            ) {

                                savedAdIds.add(
                                    String(
                                        row.ad_id
                                    )
                                );

                            }

                        }
                    );

                }

            } catch (error) {

                console.error(
                    "HAVKAR saved ads exception:",
                    error
                );

            }


            return savedAdIds;

        }


        async function isAdSaved(
            adId
        ) {

            if (!currentUserId) {

                return false;

            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from(SAVES_TABLE)
                    .select(
                        "id"
                    )
                    .eq(
                        "ad_id",
                        Number(adId)
                    )
                    .eq(
                        "user_id",
                        currentUserId
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "HAVKAR save check error:",
                    error
                );

                return false;

            }


            return !!data;

        }


        async function toggleSaved(
            id
        ) {

            if (!currentUserId) {

                showToast(
                    "Please log in to save advertisements."
                );

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    700
                );

                return;

            }


            const numericId =
                Number(id);


            if (
                !Number.isFinite(
                    numericId
                )
            ) {

                showToast(
                    "This advertisement cannot be saved."
                );

                return;

            }


            const button =
                document.querySelector(
                    `.save-ad-btn[data-ad-id="${numericId}"]`
                );


            if (button) {
                button.disabled = true;
            }


            try {

                const currentlySaved =
                    await isAdSaved(
                        numericId
                    );


                if (currentlySaved) {

                    const {
                        error
                    } =
                        await supabaseClient
                            .from(SAVES_TABLE)
                            .delete()
                            .eq(
                                "ad_id",
                                numericId
                            )
                            .eq(
                                "user_id",
                                currentUserId
                            );


                    if (error) {

                        throw error;

                    }


                    savedAdIds.delete(
                        String(numericId)
                    );


                    showToast(
                        "Advertisement removed from saved."
                    );

                } else {

                    const {
                        error
                    } =
                        await supabaseClient
                            .from(SAVES_TABLE)
                            .insert({
                                ad_id:
                                    numericId,

                                user_id:
                                    currentUserId
                            });


                    if (error) {

                        throw error;

                    }


                    savedAdIds.add(
                        String(numericId)
                    );


                    showToast(
                        "Advertisement saved."
                    );

                }


                renderAds();

            } catch (error) {

                console.error(
                    "HAVKAR save toggle error:",
                    error
                );


                showToast(
                    "Could not update saved advertisement."
                );

            } finally {

                if (button) {
                    button.disabled = false;
                }

            }

        }


        /* =========================================================
           CATEGORY
           ========================================================= */

        function setCategory(
            category,
            button
        ) {

            activeCategory =
                category;

            showingSavedOnly =
                false;


            document
                .querySelectorAll(".tab")
                .forEach(
                    tab => {

                        tab.classList.remove(
                            "active"
                        );

                    }
                );


            if (button) {

                button.classList.add(
                    "active"
                );

            }


            updateResultsTitle();

            renderAds();

        }


        /* =========================================================
           FILTERING
           ========================================================= */

        function getFilteredAds() {

            const searchInput =
                document.getElementById(
                    "searchInput"
                );


            const query =
                searchInput
                    ? searchInput.value
                        .trim()
                        .toLowerCase()
                    : "";


            return adsData.filter(
                ad => {

                    if (
                        showingSavedOnly
                    ) {

                        if (
                            !savedAdIds.has(
                                String(ad.id)
                            )
                        ) {

                            return false;

                        }

                    }


                    if (
                        activeCategory !==
                        "all"
                    ) {

                        if (
                            String(
                                ad.category || ""
                            ).toLowerCase() !==
                            activeCategory
                        ) {

                            return false;

                        }

                    }


                    if (query) {

                        const searchable = [

                            ad.title,

                            ad.category,

                            ad.location,

                            ad.description,

                            ad.status

                        ]
                            .map(
                                value =>
                                    value === null ||
                                    value === undefined
                                        ? ""
                                        : String(value)
                            )
                            .join(" ")
                            .toLowerCase();


                        if (
                            !searchable.includes(
                                query
                            )
                        ) {

                            return false;

                        }

                    }


                    return true;

                }
            );

        }


        /* =========================================================
           RENDER
           ========================================================= */

        function renderAds() {

            const container =
                document.getElementById(
                    "adsContainer"
                );


            if (!container) {
                return;
            }


            const ads =
                getFilteredAds();


            const count =
                document.getElementById(
                    "resultsCount"
                );


            if (count) {

                count.textContent =
                    `${ads.length} ${
                        ads.length === 1
                            ? "ad"
                            : "ads"
                    }`;

            }


            if (!ads.length) {

                container.innerHTML = `

                    <div class="empty-state">

                        <i class="fas fa-bullhorn"></i>

                        <h3>
                            ${
                                showingSavedOnly
                                    ? "No saved advertisements"
                                    : "No advertisements found"
                            }
                        </h3>

                        <p>
                            ${
                                showingSavedOnly
                                    ? "Advertisements you save will appear here."
                                    : "Try another search or category, or create a new advertisement."
                            }
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML =
                ads
                    .map(
                        ad =>
                            createAdCard(
                                ad
                            )
                    )
                    .join("");

        }


        /* =========================================================
           IMAGE PARSING
           ========================================================= */

        function getAdImages(
            photos
        ) {

            if (
                photos === null ||
                photos === undefined
            ) {

                return [];

            }


            if (
                Array.isArray(
                    photos
                )
            ) {

                return photos
                    .filter(
                        item =>
                            typeof item ===
                            "string" &&
                            item.trim()
                    );

            }


            const text =
                String(
                    photos
                ).trim();


            if (!text) {

                return [];

            }


            try {

                const parsed =
                    JSON.parse(
                        text
                    );


                if (
                    Array.isArray(
                        parsed
                    )
                ) {

                    return parsed
                        .filter(
                            item =>
                                typeof item ===
                                "string" &&
                                item.trim()
                        );

                }


                if (
                    typeof parsed ===
                    "string" &&
                    parsed.trim()
                ) {

                    return [
                        parsed
                    ];

                }

            } catch (error) {

                /* Not JSON; use the text itself. */

            }


            if (
                text.startsWith(
                    "http://"
                ) ||
                text.startsWith(
                    "https://"
                ) ||
                text.startsWith(
                    "data:image/"
                )
            ) {

                return [
                    text
                ];

            }


            return [];

        }


        /* =========================================================
           CATEGORY EMOJI
           ========================================================= */

        function getCategoryEmoji(
            category
        ) {

            switch (
                String(
                    category || ""
                ).toLowerCase()
            ) {

                case "restaurant":
                    return "🍕";

                case "shop":
                    return "🛍️";

                case "service":
                    return "🛠️";

                default:
                    return "📢";

            }

        }


        /* =========================================================
           CREATE CARD
           ========================================================= */

        function createAdCard(
            ad
        ) {

            const adId =
                String(
                    ad.id
                );


            const isSaved =
                savedAdIds.has(
                    adId
                );


            const images =
                getAdImages(
                    ad.photos
                );


            const firstImage =
                images.length
                    ? images[0]
                    : "";


            const imageHTML =
                firstImage
                    ? `

                        <img
                            src="${escapeAttribute(
                                firstImage
                            )}"
                            alt="${escapeHTML(
                                ad.title ||
                                "Advertisement"
                            )}"
                            loading="lazy"
                            onerror="this.style.display='none'"
                        >

                    `
                    : `

                        <div
                            class="ad-banner-placeholder"
                            aria-hidden="true"
                        >
                            ${escapeHTML(
                                getCategoryEmoji(
                                    ad.category
                                )
                            )}
                        </div>

            const category =
                String(
                    ad.category ||
                    "other"
                );


            const status =
                String(
                    ad.status ||
                    ""
                );


            const statusText =
                status &&
                status.toLowerCase() !==
                    "active"
                    ? status
                    : "Active";


            const statusClass =
                status &&
                status.toLowerCase() !==
                    "active"
                    ? "pending"
                    : "";


            const priceHTML =
                ad.price !== null &&
                ad.price !== undefined &&
                String(ad.price).trim() !== ""
                    ? `

                        <div class="ad-price">

                            <i
                                class="fas fa-tag"
                                style="margin-right:6px"
                            ></i>

                            ${escapeHTML(
                                formatPrice(
                                    ad.price
                                )
                            )}

                        </div>

                    `
                    : "";


            const ownerHTML =
                currentUserId &&
                ad.user_id &&
                String(
                    ad.user_id
                ) ===
                    String(
                        currentUserId
                    )
                    ? `

                        <div class="verified">

                            <i
                                class="fas fa-user-check"
                            ></i>

                            Your Advertisement

                        </div>

                    `
                    : `

                        <div
                            class="verified ${statusClass}"
                        >

                            <i
                                class="${
                                    statusClass
                                        ? "fas fa-clock"
                                        : "fas fa-check-circle"
                                }"
                            ></i>

                            ${escapeHTML(
                                statusText
                            )}

                        </div>

                    `;


            return `

                <article
                    class="ad-card"
                    data-ad-id="${escapeAttribute(
                        adId
                    )}"
                >

                    <div class="ad-banner">

                        ${imageHTML}


                        <button
