                                save-ad-btn
                                ${isSaved ? "saved" : ""}
                            "
                            data-ad-id="${escapeAttribute(
                                adId
                            )}"
                            type="button"
                            onclick="
                                toggleSaved(
                                    '${escapeJS(
                                        adId
                                    )}'
                                )
                            "
                            aria-label="${
                                isSaved
                                    ? "Remove from saved"
                                    : "Save advertisement"
                            }"
                        >

                            <i class="
                                ${
                                    isSaved
                                        ? "fas"
                                        : "far"
                                }
                                fa-bookmark
                            "></i>

                        </button>

                    </div>


                    <div class="ad-content">

                        <div class="company-info">

                            <div class="company-logo">

                                ${
                                    firstImage
                                        ? `

                                            <img
                                                src="${escapeAttribute(
                                                    firstImage
                                                )}"
                                                alt=""
                                                loading="lazy"
                                                onerror="this.style.display='none'"
                                            >

                                        `
                                        : `

                                            ${escapeHTML(
                                                getCategoryEmoji(
                                                    category
                                                )
                                            )}

                                        `
                                }

                            </div>


                            <div class="company-text">

                                <div class="company-name">

                                    ${escapeHTML(
                                        formatCategoryName(
                                            category
                                        )
                                    )}

                                </div>


                                ${ownerHTML}

                            </div>

                        </div>


                        <div class="ad-title">

                            ${escapeHTML(
                                ad.title ||
                                "Untitled Advertisement"
                            )}

                        </div>


                        <div class="ad-description">

                            ${escapeHTML(
                                ad.description ||
                                ""
                            )}

                        </div>


                        ${priceHTML}


                        <div class="ad-meta">

                            <div class="meta-item">

                                <i
                                    class="fas fa-map-marker-alt"
                                ></i>

                                ${escapeHTML(
                                    ad.location ||
                                    "Location not specified"
                                )}

                            </div>


                            <div class="meta-item">

                                <i
                                    class="fas fa-layer-group"
                                ></i>

                                ${escapeHTML(
                                    formatCategoryName(
                                        category
                                    )
                                )}

                            </div>


                            ${
                                ad.created_at
                                    ? `

                                        <div class="meta-item">

                                            <i
                                                class="fas fa-calendar-alt"
                                            ></i>

                                            ${escapeHTML(
                                                formatDate(
                                                    ad.created_at
                                                )
                                            )}

                                        </div>

                                    `
                                    : ""
                            }

                        </div>


                        <div class="ad-actions">

                            <button
                                class="action-btn primary"
                                type="button"
                                onclick="
                                    openAdInfo(
                                        '${escapeJS(
                                            adId
                                        )}'
                                    )
                                "
                            >

                                <i
                                    class="fas fa-eye"
                                ></i>

                                View

                            </button>


                            <button
                                class="action-btn"
                                type="button"
                                onclick="
                                    saveFromCard(
                                        '${escapeJS(
                                            adId
                                        )}'
                                    )
                                "
                            >

                                <i
                                    class="${
                                        isSaved
                                            ? "fas"
                                            : "far"
                                    } fa-bookmark"
                                ></i>

                                ${
                                    isSaved
                                        ? "Saved"
                                        : "Save"
                                }

                            </button>

                        </div>

                    </div>

                </article>

            `;

        }


        /* =========================================================
           CARD ACTION
           ========================================================= */

        function saveFromCard(
            id
        ) {

            toggleSaved(
                id
            );

        }


        function openAdInfo(
            id
        ) {

            const ad =
                adsData.find(
                    item =>
                        String(
                            item.id
                        ) ===
                        String(
                            id
                        )
                );


            if (!ad) {

                showToast(
                    "Advertisement could not be found."
                );

                return;

            }


            const textParts = [

                ad.title
                    ? String(
                        ad.title
                    )
                    : "",

                ad.location
                    ? `Location: ${ad.location}`
                    : "",

                ad.description
                    ? String(
                        ad.description
                    )
                    : "",

                ad.price !== null &&
                ad.price !== undefined &&
                String(
                    ad.price
                ).trim() !== ""
                    ? `Price / Offer: ${formatPrice(ad.price)}`
                    : ""

            ]
                .filter(
                    Boolean
                );


            showToast(
                textParts.join(
                    " • "
                )
            );

        }


        /* =========================================================
           FORMAT HELPERS
           ========================================================= */

        function formatCategoryName(
            category
        ) {

            const value =
                String(
                    category ||
                    "other"
                )
                    .trim()
                    .toLowerCase();


            const map = {

                restaurant:
                    "Restaurant",

                shop:
                    "Shop",

                service:
                    "Service",

                other:
                    "Other"

            };


            if (
                map[value]
            ) {

                return map[value];

            }


            return value
                .replace(
                    /[-_]+/g,
                    " "
                )
                .replace(
                    /\b\w/g,
                    char =>
                        char.toUpperCase()
                );

        }


        function formatPrice(
            value
        ) {

            const number =
                Number(
                    value
                );


            if (
                Number.isFinite(
                    number
                )
            ) {

                return new Intl.NumberFormat(
                    "en-IE",
                    {
                        minimumFractionDigits:
                            0,

                        maximumFractionDigits:
                            2
                    }
                ).format(
                    number
                ) + " €";

            }


            return String(
                value
            );

        }


        function formatDate(
            value
        ) {

            try {

                const date =
                    new Date(
                        value
                    );


                if (
                    Number.isNaN(
                        date.getTime()
                    )
                ) {

                    return "";

                }


                return new Intl.DateTimeFormat(
                    "en-GB",
                    {
                        day:
                            "2-digit",

                        month:
                            "short",

                        year:
                            "numeric"
                    }
                ).format(
                    date
                );

            } catch (error) {

                return "";

            }

        }


        /* =========================================================
           ESCAPE HTML
           ========================================================= */

        function escapeHTML(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(
                value
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeAttribute(
            value
        ) {

            return escapeHTML(
                value
            );

        }


        function escapeJS(
            value
        ) {

            return String(
                value === null ||
                value === undefined
                    ? ""
                    : value
            )
                .replace(
                    /\\/g,
                    "\\\\"
                )
                .replace(
                    /'/g,
                    "\\'"
                )
                .replace(
                    /"/g,
                    '\\"'
                )
                .replace(
                    /\n/g,
                    "\\n"
                )
                .replace(
                    /\r/g,
                    "\\r"
                );

        }


        /* =========================================================
           SHOW SAVED
           ========================================================= */

        async function showSavedAds() {

            if (!currentUserId) {

                showToast(
                    "Please log in to view your saved advertisements."
                );

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    700
                );

                return;

            }


            showingSavedOnly =
                true;

            activeCategory =
                "all";


            document
                .querySelectorAll(".tab")
                .forEach(
                    tab => {

                        tab.classList.remove(
                            "active"
                        );

                    }
                );


            const allTab =
                document.querySelector(
                    '.tab[data-category="all"]'
                );


            if (allTab) {

                allTab.classList.add(
                    "active"
                );

            }


            const search =
                document.getElementById(
                    "searchInput"
                );


            if (search) {

                search.value =
                    "";

            }


            await loadSavedIds();


            updateResultsTitle();

            renderAds();


            window.scrollTo({
                top:
                    0,

                behavior:
                    "smooth"
            });


            showToast(
                "Showing your saved advertisements."
            );

        }


        /* =========================================================
           TITLE
           ========================================================= */

        function updateResultsTitle() {

            const title =
                document.getElementById(
                    "resultsTitle"
                );


            if (!title) {
                return;
            }


            if (
                showingSavedOnly
            ) {

                title.textContent =
                    "Saved Advertisements";

                return;

            }


            if (
                activeCategory ===
                "all"
            ) {

                title.textContent =
                    "Available Ads";

                return;

            }


            title.textContent =
                formatCategoryName(
                    activeCategory
                ) +
                " Ads";

        }


        /* =========================================================
           CREATE AD
           ========================================================= */

        async function submitAd(
            event
        ) {

            event.preventDefault();


            if (!currentUserId) {

                showToast(
                    "Please log in before publishing an advertisement."
                );

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    700
                );

                return;

            }


            const title =
                document
                    .getElementById(
                        "adTitle"
                    )
                    .value
                    .trim();


            const category =
                document
                    .getElementById(
                        "businessCategory"
                    )
                    .value;


            const priceInput =
                document
                    .getElementById(
                        "adPrice"
                    )
                    .value
                    .trim();


            const location =
                document
                    .getElementById(
                        "adLocation"
                    )
                    .value
                    .trim();


            const description =
                document
                    .getElementById(
                        "adDescription"
                    )
                    .value
                    .trim();


            if (
                !title ||
                !category ||
                !location ||
                !description
            ) {

                showToast(
                    "Please complete all required fields."
                );

                return;

            }


            let price =
                null;


            if (
                priceInput !== ""
            ) {

                const parsedPrice =
                    Number(
                        priceInput
                    );


                if (
                    !Number.isFinite(
                        parsedPrice
                    ) ||
                    parsedPrice < 0
                ) {

                    showToast(
                        "Please enter a valid price."
                    );

                    return;

                }


                price =
                    parsedPrice;

            }


            const publishButton =
                document.getElementById(
                    "publishButton"
                );


            if (publishButton) {

                publishButton.disabled =
                    true;

                publishButton.innerHTML = `

                    <i class="fas fa-circle-notch fa-spin"></i>

                    Publishing...

                `;

            }


            try {

                const {
                    data: freshSessionData
                } =
                    await supabaseClient.auth.getSession();


                const freshSession =
                    freshSessionData
                        ? freshSessionData.session
                        : null;


                if (
                    !freshSession ||
                    !freshSession.user
                ) {

                    throw new Error(
                        "AUTH_REQUIRED"
                    );

                }


                currentUser =
                    freshSession.user;

                currentUserId =
                    freshSession.user.id;


                const photos =
                    selectedImageData
                        ? JSON.stringify(
                            [
                                selectedImageData
                            ]
                        )
                        : "";


                const newAd = {

                    title:
                        title,

                    category:
                        category,

                    price:
                        price,

                    location:
                        location,

                    description:
                        description,

                    user_id:
                        currentUserId,

                    photos:
                        photos,

                    status:
                        "active"

                };


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from(ADS_TABLE)
                        .insert(
                            newAd
                        )
                        .select(
                            "id,created_at,title,category,price,location,description,user_id,photos,status"
                        )
                        .single();


                if (error) {

                    console.error(
                        "HAVKAR create ad error:",
                        error
                    );

                    throw error;

                }


                if (data) {

                    adsData.unshift(
                        data
                    );

                }


                closeCreateAd();

                resetAdForm();


                activeCategory =
                    "all";

                showingSavedOnly =
                    false;


                document
                    .querySelectorAll(".tab")
                    .forEach(
                        tab => {

                            tab.classList.remove(
                                "active"
                            );

                        }
                    );


                const allTab =
                    document.querySelector(
                        '.tab[data-category="all"]'
                    );


                if (allTab) {

                    allTab.classList.add(
                        "active"
                    );

                }


                const search =
                    document.getElementById(
                        "searchInput"
                    );


                if (search) {

                    search.value =
                        "";

                }


                updateResultsTitle();

                renderAds();


                window.scrollTo({
                    top:
                        0,

                    behavior:
                        "smooth"
                });


                showToast(
                    "Your advertisement was published successfully."
                );

            } catch (error) {

                console.error(
                    "HAVKAR publish exception:",
                    error
                );


                if (
                    error &&
                    error.message ===
                        "AUTH_REQUIRED"
                ) {

                    showToast(
                        "Your login session has expired. Please log in again."
                    );

                } else {

                    showToast(
                        getSupabaseErrorMessage(
                            error
                        )
                    );

                }

            } finally {

                if (publishButton) {

                    publishButton.disabled =
                        false;

                    publishButton.innerHTML = `

                        <i class="fas fa-paper-plane"></i>

                        Publish Ad

                    `;

                }

            }

        }


        /* =========================================================
           SUPABASE ERROR MESSAGE
           ========================================================= */

        function getSupabaseErrorMessage(
            error
        ) {

            if (!error) {

                return "Could not complete the request.";

            }


            const message =
                String(
                    error.message ||
                    error.error_description ||
                    ""
                );


            if (
                message
                    .toLowerCase()
                    .includes(
                        "row-level security"
                    )
            ) {

                return "Supabase security policy blocked this operation.";

            }


            if (
                message
                    .toLowerCase()
                    .includes(
                        "permission"
                    )
            ) {

                return "You do not have permission to perform this action.";

            }


            if (
                message
                    .toLowerCase()
                    .includes(
                        "duplicate"
                    )
            ) {

                return "This advertisement already exists.";

            }


            if (message) {

                return message;

            }


            return "Could not complete the request.";

        }


        /* =========================================================
           IMAGE PREVIEW
           ========================================================= */

        function previewImage(
            event
        ) {

            const file =
                event.target.files &&
                event.target.files[0];


            if (!file) {
                return;
            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                showToast(
                    "Please select an image file."
                );

                event.target.value =
                    "";

                return;

            }


            const MAX_SIZE =
                4 *
                1024 *
                1024;


            if (
                file.size >
                MAX_SIZE
            ) {

                showToast(
                    "Please choose an image smaller than 4 MB."
                );

                event.target.value =
                    "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(
                    e
                ) {

                    selectedImageData =
                        e.target.result;


                    const preview =
                        document.getElementById(
                            "imagePreview"
                        );


                    const placeholder =
                        document.getElementById(
                            "uploadPlaceholder"
                        );


                    if (preview) {

                        preview.src =
                            selectedImageData;

                        preview.classList.add(
                            "show"
                        );

                    }


                    if (placeholder) {

                        placeholder.classList.add(
                            "hidden"
                        );

                    }

                };


            reader.onerror =
                function() {

                    showToast(
                        "Could not read the selected image."
                    );

                };


            reader.readAsDataURL(
                file
            );

        }


        /* =========================================================
           RESET FORM
           ========================================================= */

        function resetAdForm() {

            const form =
                document.getElementById(
                    "adForm"
                );


            if (form) {

                form.reset();

            }


            selectedImageData =
                "";


            const preview =
                document.getElementById(
                    "imagePreview"
                );


            if (preview) {

                preview.src =
                    "";

                preview.classList.remove(
                    "show"
                );

            }


            const placeholder =
                document.getElementById(
                    "uploadPlaceholder"
                );


            if (placeholder) {

                placeholder.classList.remove(
                    "hidden"
                );

            }

        }


        /* =========================================================
           MODAL
           ========================================================= */

        function openCreateAd() {

            const modal =
                document.getElementById(
                    "createAdModal"
                );


            if (!modal) {
                return;
            }


            if (!currentUserId) {

                showToast(
                    "Please log in to create an advertisement."
                );

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    700
                );

                return;

            }


            modal.classList.add(
                "show"
            );


            document.body.style.overflow =
                "hidden";


            setTimeout(
                function() {

                    const first =
                        document.getElementById(
                            "adTitle"
                        );


                    if (first) {

                        first.focus();

                    }

                },
                100
            );

        }


        function closeCreateAd() {

            const modal =
                document.getElementById(
                    "createAdModal"
                );


            if (modal) {

                modal.classList.remove(
                    "show"
                );

            }


            document.body.style.overflow =
                "";

        }


        function closeModalFromOverlay(
            event
        ) {

            if (
                event.target &&
                event.target.id ===
                    "createAdModal"
            ) {

                closeCreateAd();

            }

        }


        /* =========================================================
           SEARCH
           ========================================================= */

        function focusSearch() {

            const search =
                document.getElementById(
                    "searchInput"
                );


            if (!search) {
                return;
            }


            search.focus();


            search.scrollIntoView({
                behavior:
                    "smooth",

                block:
                    "center"
            });

        }


        /* =========================================================
           NAVIGATION
           ========================================================= */

        function goHome() {

            window.location.href =
                "index.html";

        }


        function goProfile() {

            window.location.href =
                "profile.html";

        }


        /* =========================================================
           TOAST
           ========================================================= */

        function showToast(
            message
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );


            if (!toast) {
                return;
            }


            toast.textContent =
                message;


            toast.classList.add(
                "show"
            );


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(
                    function() {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    3000
                );

        }


        /* =========================================================
           PAGE STATUS
           ========================================================= */

        function showPageStatus(
            message,
            type
        ) {

            const status =
                document.getElementById(
                    "pageStatus"
                );


            if (!status) {
                return;
            }


            status.textContent =
                message;


            status.className =
                "page-status show";


            if (type) {

                status.classList.add(
                    type
                );

            }

        }


        function hidePageStatus() {

            const status =
                document.getElementById(
                    "pageStatus"
                );


            if (!status) {
                return;
            }


            status.textContent =
                "";

            status.className =
                "page-status";

        }


        /* =========================================================
           FALLBACK
           ========================================================= */

        function showDemoFallback() {

            adsData =
                defaultAds.slice();


            showPageStatus(
                "The live advertisement database could not be reached. Showing the built-in demonstration advertisements.",
                "error"
            );


            renderAds();

        }


        /* =========================================================
           INITIAL LOAD
           ========================================================= */

        async function initializeAdsPage() {

            try {

                await resolveCurrentUser();


                await loadSavedIds();


                try {

                    await loadAdsFromSupabase();

                    hidePageStatus();

                } catch (error) {

                    showDemoFallback();

                    return;

                }


                updateResultsTitle();

                renderAds();


            } catch (error) {

                console.error(
                    "HAVKAR Ads initialization error:",
                    error
                );


                showDemoFallback();

            }

        }


        /* =========================================================
           KEYBOARD
           ========================================================= */

        document.addEventListener(
            "keydown",
            function(
                event
            ) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeCreateAd();

                }

            }
        );


        /* =========================================================
           START
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            async function() {

                setupAuthListener();

                await initializeAdsPage();

            }
        );

    </script>
