<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#689f38"
    >

    <meta
        name="description"
        content="HAVKAR Business Ads - Discover businesses, restaurants, shops and services."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>HAVKAR - Business Ads</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        /* =========================================================
           RESET
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f5f7f4;
            color: #263238;

            padding-bottom: 82px;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #689f38 0%,
                    #7cb342 100%
                );

            color: #ffffff;

            padding:
                max(14px, env(safe-area-inset-top))
                18px
                14px;

            box-shadow:
                0 3px 16px rgba(0, 0, 0, 0.14);

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .back-btn,
        .header-icon-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.18);

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1.15rem;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .back-btn:hover,
        .header-icon-btn:hover {
            background:
                rgba(255, 255, 255, 0.28);

            transform: translateY(-1px);
        }

        .header-title {
            min-width: 0;
        }

        .header-title h1 {
            font-size: 1.25rem;
            line-height: 1.15;
            font-weight: 800;
        }

        .header-title p {
            margin-top: 3px;

            font-size: 0.72rem;
            opacity: 0.88;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* =========================================================
           SEARCH AREA
           ========================================================= */

        .search-area {
            background: #ffffff;

            padding:
                14px
                16px
                12px;

            border-bottom:
                1px solid #e7ebe5;
        }

        .search-box {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 10px;

            background: #f4f6f3;

            border:
                1px solid #e1e6df;

            border-radius: 14px;

            padding:
                0 14px;
        }

        .search-box i {
            color: #7cb342;
            font-size: 1rem;
        }

        .search-box input {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            padding: 13px 0;

            color: #263238;
            font-size: 0.95rem;
        }

        .search-box input::placeholder {
            color: #9aa19a;
        }

        /* =========================================================
           CATEGORY TABS
           ========================================================= */

        .tabs {
            background: #ffffff;

            display: flex;

            gap: 9px;

            padding:
                10px 16px 14px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex:
                0 0 auto;

            border: none;

            background: #f1f3f0;

            color: #37423a;

            padding:
                9px 16px;

            border-radius: 22px;

            font-size: 0.82rem;
            font-weight: 700;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .tab:hover {
            transform: translateY(-1px);
        }

        .tab.active {
            background: #7cb342;
            color: #ffffff;
        }

        /* =========================================================
           CONTENT
           ========================================================= */

        .content {
            width: 100%;
            max-width: 760px;

            margin:
                0 auto;

            padding:
                16px 14px 110px;
        }

        .results-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 12px;
        }

        .results-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #37423a;
        }

        .results-count {
            font-size: 0.78rem;
            color: #7a837b;
        }

        /* =========================================================
           AD CARD
           ========================================================= */

        .ad-card {
            background: #ffffff;

            border-radius: 18px;

            overflow: hidden;

            margin-bottom: 16px;

            box-shadow:
                0 3px 16px
                rgba(31, 48, 33, 0.08);

            border:
                1px solid #edf0eb;

            animation:
                cardIn 0.25s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ad-banner {
            position: relative;

            width: 100%;
            height: 190px;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #c5e1a5
                );

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .ad-banner img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .ad-banner-placeholder {
            font-size: 4.3rem;
            line-height: 1;
        }

        .featured-badge {
            position: absolute;

            top: 12px;
            left: 12px;

            padding:
                6px 10px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.94);

            color: #558b2f;

            font-size: 0.72rem;
            font-weight: 800;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);
        }

        .save-ad-btn {
            position: absolute;

            top: 12px;
            right: 12px;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.94);

            color: #7b847b;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1rem;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);
        }

        .save-ad-btn.saved {
            color: #689f38;
        }

        .ad-content {
            padding: 16px;
        }

        .company-info {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 13px;
        }

        .company-logo {
            flex:
                0 0 auto;

            width: 52px;
            height: 52px;

            border-radius: 14px;

            background: #f3f5f2;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 1.55rem;
        }

        .company-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .company-text {
            min-width: 0;
        }

        .company-name {
            color: #263238;

            font-size: 1.08rem;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .verified {
            margin-top: 3px;

            color: #7cb342;

            font-size: 0.78rem;
            font-weight: 700;
        }

        .ad-title {
            color: #263238;

            font-size: 1.02rem;
            font-weight: 800;

            line-height: 1.35;

            margin-bottom: 7px;
        }

        .ad-description {
            color: #667067;

            font-size: 0.88rem;

            line-height: 1.55;

            margin-bottom: 13px;
        }

        .ad-meta {
            display: flex;

            flex-wrap: wrap;

            gap:
                8px 14px;

            margin-bottom: 14px;
        }

        .meta-item {
            display: flex;
            align-items: center;

            gap: 5px;

            color: #69736a;

            font-size: 0.78rem;
        }

        .meta-item i {
            color: #7cb342;
        }

        .ad-price {
            display: inline-flex;

            align-items: center;

            margin-bottom: 13px;

            padding:
                6px 10px;

            border-radius: 8px;

            background: #f1f8ec;

            color: #558b2f;

            font-size: 0.82rem;
            font-weight: 800;
        }

        .ad-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;
        }

        .action-btn {
            min-height: 43px;

            border-radius: 11px;

            border:
                2px solid #7cb342;

            background: #ffffff;

            color: #558b2f;

            font-weight: 800;

            font-size: 0.84rem;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .action-btn.primary {
            background: #7cb342;
            color: #ffffff;
        }

        .action-btn.danger {
            border-color: #e57373;
            color: #c62828;
        }

        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .empty-state {
            background: #ffffff;

            border-radius: 18px;

            padding:
                50px 25px;

            text-align: center;

            box-shadow:
                0 3px 16px
                rgba(31, 48, 33, 0.06);
        }

        .empty-state i {
            font-size: 3rem;

            color: #b0b8af;

            margin-bottom: 14px;
        }

        .empty-state h3 {
            color: #3f4840;

            font-size: 1.05rem;

            margin-bottom: 7px;
        }

        .empty-state p {
            color: #858d86;

            font-size: 0.84rem;

            line-height: 1.5;
        }

        /* =========================================================
           FLOATING ADD BUTTON
           ========================================================= */

        .fab-button {
            position: fixed;

            right: 20px;

            bottom:
                calc(
                    78px +
                    env(safe-area-inset-bottom)
                );

            z-index: 900;

            width: 62px;
            height: 62px;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #689f38,
                    #7cb342
                );

            color: #ffffff;

            font-size: 1.55rem;

            box-shadow:
                0 8px 25px
                rgba(76, 120, 40, 0.35);

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.2s ease;
        }

        .fab-button:hover {
            transform:
                translateY(-3px)
                scale(1.03);
        }

        /* =========================================================
           BOTTOM NAV
           ========================================================= */

        .bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 950;

            background: #ffffff;

            border-top:
                1px solid #e5e9e3;

            box-shadow:
                0 -3px 15px
                rgba(0, 0, 0, 0.08);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            padding:
                8px
                0
                max(8px, env(safe-area-inset-bottom));
        }

        .nav-item {
            border: none;
            background: transparent;

            color: #929992;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 4px;

            font-size: 0.7rem;
            font-weight: 600;
        }

        .nav-item i {
            font-size: 1.18rem;
        }

        .nav-item.active {
            color: #7cb342;
        }

        /* =========================================================
           MODAL
           ========================================================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 2000;

            background:
                rgba(17, 24, 18, 0.58);

            display: none;

            align-items: flex-end;
            justify-content: center;

            padding: 0;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 650px;

            max-height: 94vh;

            background: #ffffff;

            border-radius:
                24px 24px 0 0;

            overflow-y: auto;

            box-shadow:
                0 -10px 45px
                rgba(0, 0, 0, 0.22);

            animation:
                modalUp 0.25s ease;
        }

        @keyframes modalUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            position: sticky;

            top: 0;

            z-index: 5;

            background: #ffffff;

            display: flex;

            justify-content: space-between;
            align-items: center;

            padding:
                18px 18px 14px;

            border-bottom:
                1px solid #edf0eb;
        }

        .modal-header h2 {
            font-size: 1.12rem;
            color: #263238;
        }

        .modal-close {
            width: 38px;
            height: 38px;

            border: none;
            border-radius: 50%;

            background: #f1f3f0;

            color: #566056;

            font-size: 1rem;
        }

        .modal-body {
            padding: 18px;
        }

        /* =========================================================
           FORM
           ========================================================= */

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;

            margin-bottom: 7px;

            color: #3f4840;

            font-size: 0.82rem;
            font-weight: 800;
        }

        .form-label span {
            color: #d32f2f;
        }

        .form-control {
            width: 100%;

            border:
                1px solid #dce2da;

            border-radius: 11px;

            background: #fafbf9;

            color: #263238;

            padding:
                12px 13px;

            outline: none;

            font-size: 0.9rem;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: #7cb342;

            box-shadow:
                0 0 0 3px
                rgba(124, 179, 66, 0.13);

            background: #ffffff;
        }

        textarea.form-control {
            min-height: 105px;

            resize: vertical;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }

        .image-upload {
            width: 100%;

            min-height: 150px;

            border:
                2px dashed #cdd6c9;

            border-radius: 14px;

            background: #f8faf7;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 8px;

            text-align: center;

            color: #778077;

            cursor: pointer;

            overflow: hidden;
        }

        .image-upload i {
            font-size: 2rem;
            color: #8ca783;
        }

        .image-upload span {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .image-preview {
            display: none;

            width: 100%;
            max-height: 220px;

            object-fit: cover;

            border-radius: 12px;
        }

        .image-preview.show {
            display: block;
        }

        .upload-placeholder.hidden {
            display: none;
        }

        .form-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 20px;
        }

        .form-btn {
            min-height: 46px;

            border-radius: 12px;

            font-weight: 800;

            border: 2px solid #7cb342;
        }

        .form-btn.cancel {
            background: #ffffff;
            color: #558b2f;
        }

        .form-btn.submit {
            background: #7cb342;
            color: #ffffff;
        }

        /* =========================================================
           TOAST
           ========================================================= */

        .toast {
            position: fixed;

            left: 50%;

            bottom:
                calc(
                    92px +
                    env(safe-area-inset-bottom)
                );

            z-index: 3000;

            transform:
                translate(-50%, 20px);

            min-width: 240px;
            max-width: calc(100% - 35px);

            padding:
                12px 16px;

            border-radius: 12px;

            background: #263238;

            color: #ffffff;

            text-align: center;

            font-size: 0.82rem;
            font-weight: 700;

            opacity: 0;
            pointer-events: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (min-width: 700px) {

            body {
                padding-bottom: 20px;
            }

            .content {
                padding-bottom: 40px;
            }

            .bottom-nav {
                max-width: 760px;

                left: 50%;

                right: auto;

                width: 760px;

                transform:
                    translateX(-50%);

                border-radius:
                    18px 18px 0 0;
            }

            .fab-button {
                right:
                    calc(
                        50% - 350px
                    );
            }

            .modal-overlay {
                align-items: center;

                padding: 20px;
            }

            .modal {
                border-radius: 22px;

                max-height: 90vh;
            }
        }

        @media (max-width: 430px) {

            .header-title h1 {
                font-size: 1.13rem;
            }

            .header-title p {
                display: none;
            }

            .ad-banner {
                height: 170px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .content {
                padding-left: 12px;
                padding-right: 12px;
            }

            .fab-button {
                right: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }

    </style>
</head>

<body>

    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header class="header">

        <div class="header-left">

            <button
                class="back-btn"
                type="button"
                onclick="goHome()"
                aria-label="Back to Home"
            >
                <i class="fas fa-arrow-left"></i>
            </button>

            <div class="header-title">

                <h1>
                    Business Ads
                </h1>

                <p>
                    Discover businesses near you
                </p>

            </div>

        </div>

        <div class="header-right">

            <button
                class="header-icon-btn"
                type="button"
                onclick="focusSearch()"
                aria-label="Search"
            >
                <i class="fas fa-search"></i>
            </button>

        </div>

    </header>


    <!-- =========================================================
         SEARCH
         ========================================================= -->

    <section class="search-area">

        <div class="search-box">

            <i class="fas fa-search"></i>

            <input
                id="searchInput"
                type="search"
                placeholder="Search businesses, ads or cities..."
                autocomplete="off"
                oninput="renderAds()"
            >

        </div>

    </section>


    <!-- =========================================================
         CATEGORY TABS
         ========================================================= -->

    <nav
        class="tabs"
        aria-label="Advertisement categories"
    >

        <button
            class="tab active"
            data-category="all"
            onclick="setCategory('all', this)"
        >
            All
        </button>

        <button
            class="tab"
            data-category="featured"
            onclick="setCategory('featured', this)"
        >
            Featured
        </button>

        <button
            class="tab"
            data-category="restaurant"
            onclick="setCategory('restaurant', this)"
        >
            Restaurants
        </button>

        <button
            class="tab"
            data-category="shop"
            onclick="setCategory('shop', this)"
        >
            Shops
        </button>

        <button
            class="tab"
            data-category="service"
            onclick="setCategory('service', this)"
        >
            Services
        </button>

    </nav>


    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <main class="content">

        <div class="results-header">

            <div class="results-title">
                Available Ads
            </div>

            <div
                class="results-count"
                id="resultsCount"
            >
                0 ads
            </div>

        </div>

        <div id="adsContainer"></div>

    </main>


    <!-- =========================================================
         FLOATING ADD BUTTON
         ========================================================= -->

    <button
        class="fab-button"
        type="button"
        onclick="openCreateAd()"
        aria-label="Create Advertisement"
        title="Create Advertisement"
    >
        <i class="fas fa-plus"></i>
    </button>


    <!-- =========================================================
         BOTTOM NAVIGATION
         ========================================================= -->

    <nav class="bottom-nav">

        <button
            class="nav-item"
            type="button"
            onclick="goHome()"
        >
            <i class="fas fa-home"></i>
            <span>Home</span>
        </button>

        <button
            class="nav-item active"
            type="button"
        >
            <i class="fas fa-bullhorn"></i>
            <span>Ads</span>
        </button>

        <button
            class="nav-item"
            type="button"
            onclick="showSavedAds()"
        >
            <i class="fas fa-bookmark"></i>
            <span>Saved</span>
        </button>

        <button
            class="nav-item"
            type="button"
            onclick="goProfile()"
        >
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </button>

    </nav>


    <!-- =========================================================
         CREATE AD MODAL
         ========================================================= -->

    <div
        class="modal-overlay"
        id="createAdModal"
        onclick="closeModalFromOverlay(event)"
    >

        <section
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="createAdTitle"
        >

            <div class="modal-header">

                <h2 id="createAdTitle">
                    Create New Advertisement
                </h2>

                <button
                    class="modal-close"
                    type="button"
                    onclick="closeCreateAd()"
                    aria-label="Close"
                >
                    <i class="fas fa-times"></i>
                </button>

            </div>


            <div class="modal-body">

                <form
                    id="adForm"
                    onsubmit="submitAd(event)"
                >

                    <!-- BUSINESS NAME -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="businessName"
                        >
                            Business Name
                            <span>*</span>
                        </label>

                        <input
                            class="form-control"

                            <label

                                Website

                            <input

                                type="url"

                                placeholder="https://example.com"

                    <!-- IMAGE -->

                    <div class="form-group">

                        <label class="form-label">
                            Advertisement Image
                        </label>

                        <label

                        >

                            <div
                                class="upload-placeholder"
                                id="uploadPlaceholder"

                                <i class="fas fa-camera"></i>

                                <span>
                                    Tap to select an image

                            <img

                                alt="Advertisement preview"

                        <input

                    <!-- FORM BUTTONS -->

                    <div class="form-actions">

                        <button

                        <button

                            <i class="fas fa-paper-plane"></i>
                            Publish Ad

            </div>

        </section>

    </div>


    <!-- =========================================================
         TOAST
         ========================================================= -->

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>


    <script>

        /* =========================================================
           HAVKAR ADS ENGINE
           ========================================================= */

        const STORAGE_KEY = "havkar_ads_v2";

        const SAVED_KEY = "havkar_saved_ads_v2";

        let activeCategory = "all";

        let showingSavedOnly = false;

        let selectedImageData = "";


        /* =========================================================
           DEMO ADS
           ========================================================= */

        const defaultAds = [

            {
                id: "demo-pizza-milano",

                businessName: "Pizza Milano",

                category: "restaurant",

                title: "Authentic Italian Pizza - 20% OFF",

                description:

                city: "Milan, Italy",

                offer: "20% OFF",

                phone: "",

                website: "",

                emoji: "🍕",

                featured: true,

                userCreated: false,

                views: 520

            },


            {
                id: "demo-fashion-boutique",

                businessName: "Fashion Boutique",

                category: "shop",

                title: "Summer Collection - Up to 50% OFF",

                description:
                    "Discover the latest fashion trends. Premium quality clothing at unbeatable prices. Visit us today!",

                city: "Rome, Italy",

                hours: "10 AM - 8 PM",

                rating: "4.6",

                reviews: "340",

                offer: "Up to 50% OFF",

                phone: "",

                website: "",

                emoji: "👗",

                verified: true,

                featured: false,

                userCreated: false,

                views: 340

            },


            {
                id: "demo-cafe",

                businessName: "Café Italiano",

                category: "restaurant",

                title: "Premium Coffee & Pastries",

                description:
                    "Start your day with the best coffee in town. Freshly baked pastries every morning. Free WiFi available.",

                city: "Florence, Italy",

                hours: "7 AM - 9 PM",

                rating: "4.9",

                reviews: "680",

                offer: "",

                phone: "",

                website: "",

                emoji: "☕",

                verified: true,

                featured: true,

                userCreated: false,

                views: 680

            },


            {
                id: "demo-salon",

                businessName: "Salon Eleganza",

                category: "service",

                title: "Hair & Beauty Services",

                description:
                    "Professional hairstyling and beauty treatments. Book your appointment online and get 15% off.",

                city: "Turin, Italy",

                hours: "9 AM - 7 PM",

                rating: "4.7",

                reviews: "290",

                offer: "15% OFF",

                phone: "",

                website: "",

                emoji: "💇",

                verified: true,

                featured: false,

                userCreated: false,

                views: 290

            }

        ];


        /* =========================================================
           STORAGE
           ========================================================= */

        function loadAds() {

            try {

                const stored =
                    localStorage.getItem(STORAGE_KEY);

                if (!stored) {

                    return defaultAds;

                }

                const parsed =
                    JSON.parse(stored);

                if (!Array.isArray(parsed)) {

                    return defaultAds;

                }

                return parsed;

            } catch (error) {

                console.error(
                    "HAVKAR Ads storage error:",
                    error
                );

                return defaultAds;

            }

        }


        function saveAds(ads) {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(ads)
                );

            } catch (error) {

                console.error(
                    "HAVKAR Ads save error:",
                    error
                );

                showToast(
                    "Could not save the advertisement."
                );

            }

        }


        function loadSavedIds() {

            try {

                const stored =
                    localStorage.getItem(SAVED_KEY);

                if (!stored) {
                    return [];
                }

                const parsed =
                    JSON.parse(stored);

                return Array.isArray(parsed)
                    ? parsed
                    : [];

            } catch (error) {

                return [];

            }

        }


        function saveSavedIds(ids) {

            localStorage.setItem(
                SAVED_KEY,
                JSON.stringify(ids)
            );

        }


        /* =========================================================
           CATEGORY
           ========================================================= */

        function setCategory(category, button) {

            activeCategory = category;

            showingSavedOnly = false;

            document
                .querySelectorAll(".tab")
                .forEach(tab => {
                    tab.classList.remove("active");
                });

            if (button) {
                button.classList.add("active");
            }

            renderAds();

        }


        /* =========================================================
           FILTERING
           ========================================================= */

        function getFilteredAds() {

            const ads = loadAds();

            const searchInput =
                document
                    .getElementById("searchInput");

            const query =
                searchInput
                    ? searchInput.value
                        .trim()
                        .toLowerCase()
                    : "";

            const savedIds =
                loadSavedIds();

            return ads.filter(ad => {

                if (showingSavedOnly) {

                    if (!savedIds.includes(ad.id)) {
                        return false;
                    }

                }

                if (activeCategory === "featured") {

                    if (!ad.featured) {
                        return false;
                    }

                }

                else if (
                    activeCategory !== "all"
                ) {

                    if (
                        ad.category !==
                        activeCategory
                    ) {

                        return false;

                    }

                }

                if (query) {

                    const searchable = [

                        ad.businessName,

                        ad.title,

                        ad.description,

                        ad.city,

                        ad.category

                    ]
                        .join(" ")
                        .toLowerCase();

                    if (
                        !searchable.includes(query)
                    ) {

                        return false;

                    }

                }

                return true;

            });

        }


        /* =========================================================
           RENDER ADS
           ========================================================= */

        function renderAds() {

            const container =
                document.getElementById(
                    "adsContainer"
                );

            if (!container) {
                return;
            }

            const ads =
                getFilteredAds();

            const count =
                document.getElementById(
                    "resultsCount"
                );

            if (count) {

                count.textContent =
                    `${ads.length} ${
                        ads.length === 1
                            ? "ad"
                            : "ads"
                    }`;

            }

            if (!ads.length) {

                container.innerHTML = `

                    <div class="empty-state">

                        <i class="fas fa-bullhorn"></i>

                        <h3>
                            No advertisements found
                        </h3>

                        <p>
                            Try another search or category,
                            or create a new advertisement.
                        </p>

                    </div>

                `;

                return;

            }

            container.innerHTML =
                ads
                    .map(ad => createAdCard(ad))
                    .join("");

        }


        /* =========================================================
           ESCAPE HTML
           ========================================================= */

        function escapeHTML(value) {

            if (value === null ||
                value === undefined) {

                return "";

            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================================
           SAFE URL
           ========================================================= */

        function safeWebsiteUrl(url) {

            if (!url) {
                return "";
            }

            let clean =
                String(url).trim();

            if (
                !clean.startsWith("http://") &&
                !clean.startsWith("https://")
            ) {

                clean =
                    "https://" + clean;

            }

            try {

                const parsed =
                    new URL(clean);

                if (
                    parsed.protocol !== "http:" &&
                    parsed.protocol !== "https:"
                ) {

                    return "";

                }

                return parsed.href;

            } catch (error) {

                return "";

            }

        }


        /* =========================================================
           CREATE AD CARD
           ========================================================= */

        function createAdCard(ad) {

            const savedIds =
                loadSavedIds();

            const isSaved =
                savedIds.includes(ad.id);

            const imageHTML =
                ad.image
                    ? `
                        <img
                            src="${ad.image}"
                            alt="${escapeHTML(
                                ad.businessName
                            )}"
                        >
                    `
                    : `
                        <div
                            class="ad-banner-placeholder"
                            aria-hidden="true"
                        >
                            ${escapeHTML(
                                ad.emoji || "📢"
                            )}
                        </div>
                    `;

            const featuredHTML =
                ad.featured
                    ? `
                        <div class="featured-badge">
                            <i class="fas fa-star"></i>
                            Featured
                        </div>
                    `
                    : "";

            const phone =
                ad.phone
                    ? String(ad.phone)
                    : "";

            const website =
                safeWebsiteUrl(
                    ad.website
                );

            let primaryAction = "";

            if (website) {

                primaryAction = `

                    <a
                        class="action-btn primary"
                        href="${website}"
                        target="_blank"
                        rel="noopener noreferrer"
                        onclick="registerView('${escapeJS(
                            ad.id
                        )}')"
                    >
                        <i class="fas fa-external-link-alt"></i>
                        Visit
                    </a>

                `;

            } else {

                primaryAction = `

                    <button
                        class="action-btn primary"
                        type="button"
                        onclick="visitAd('${escapeJS(
                            ad.id
                        )}')"
                    >
                        <i class="fas fa-eye"></i>
                        View
                    </button>

                `;

            }


            let callAction = "";

            if (phone) {

                callAction = `

                    <a
                        class="action-btn"
                        href="tel:${escapeHTML(
                            phone
                        )}"
                    >
                        <i class="fas fa-phone"></i>
                        Call Now
                    </a>

                `;

            } else {

                callAction = `

                    <button
                        class="action-btn"
                        type="button"
                        onclick="showToast(
                            'Phone number is not available.'
                        )"
                    >
                        <i class="fas fa-phone"></i>
                        Call Now
                    </button>

                `;

            }


            const offerHTML =
                ad.offer
                    ? `
                        <div class="ad-price">

                            <i
                                class="fas fa-tag"
                                style="margin-right:6px"
                            ></i>

                            ${escapeHTML(
                                ad.offer
                            )}

                        </div>
                    `
                    : "";


            const deleteHTML =
                ad.userCreated
                    ? `

                        <button
                            class="action-btn danger"
                            type="button"
                            onclick="deleteAd(
                                '${escapeJS(ad.id)}'
                            )"
                        >
                            <i class="fas fa-trash"></i>
                            Delete
                        </button>

                    `
                    : "";


            return `

                <article
                    class="ad-card"
                    data-ad-id="${escapeHTML(ad.id)}"
                >

                    <div class="ad-banner">

                        ${imageHTML}

                        ${featuredHTML}

                        <button
                            class="
                                save-ad-btn
                                ${isSaved ? "saved" : ""}
                            "
                            type="button"
                            onclick="
                                toggleSaved(
                                    '${escapeJS(ad.id)}'
                                )
                            "
                            aria-label="${
                                isSaved
                                    ? "Remove from saved"
                                    : "Save advertisement"
                            }"
                        >

                            <i class="
                                ${
                                    isSaved
                                        ? "fas"
                                        : "far"
                                }
                                fa-bookmark
                            "></i>

                        </button>

                    </div>


                    <div class="ad-content">

                        <div class="company-info">

                            <div class="company-logo">

                                ${
                                    ad.image
                                        ? `
                                            <img
                                                src="${ad.image}"
                                                alt=""
                                            >
                                        `
                                        : `
                                            ${escapeHTML(
                                                ad.emoji || "📢"
                                            )}
                                        `
                                }

                            </div>


                            <div class="company-text">

                                <div class="company-name">

                                    ${escapeHTML(
                                        ad.businessName
                                    )}

                                </div>


                                ${
                                    ad.verified
                                        ? `
                                            <div class="verified">

                                                <i
                                                    class="fas fa-check-circle"
                                                ></i>

                                                Verified Business

                                            </div>
                                        `
                                        : `
                                            <div class="verified">

                                                <i
                                                    class="fas fa-clock"
                                                ></i>

                                                Pending Verification

                                            </div>
                                        `
                                }

                            </div>

                        </div>


                        <div class="ad-title">

                            ${escapeHTML(
                                ad.title
                            )}

                        </div>


                        <div class="ad-description">

                            ${escapeHTML(
                                ad.description
                            )}

                        </div>


                        ${offerHTML}


                        <div class="ad-meta">

                            <div class="meta-item">

                                <i
                                    class="fas fa-map-marker-alt"
                                ></i>

                                ${escapeHTML(
                                    ad.city
                                )}

                            </div>


                            ${
                                ad.hours
                                    ? `
                                        <div class="meta-item">

                                            <i
                                                class="fas fa-clock"
                                            ></i>

                                            ${escapeHTML(
                                                ad.hours
                                            )}

                                        </div>
                                    `
                                    : ""
                            }


                            ${
                                ad.rating
                                    ? `
                                        <div class="meta-item">

                                            <i
                                                class="fas fa-star"
                                            ></i>

                                            ${escapeHTML(
                                                ad.rating
                                            )}
                                            ${
                                                ad.reviews
                                                    ? `(${escapeHTML(
                                                        ad.reviews
                                                    )})`
                                                    : ""
                                            }

                                        </div>
                                    `
                                    : ""
                            }

                        </div>


                        <div class="ad-actions">

                            ${callAction}

                            ${primaryAction}

                            ${
                                deleteHTML
                                    ? deleteHTML
                                    : ""
                            }

                        </div>

                    </div>

                </article>

            `;

        }


        /* =========================================================
           ESCAPE JAVASCRIPT
           ========================================================= */

        function escapeJS(value) {

            return String(value || "")
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\n/g, "\\n")
                .replace(/\r/g, "\\r");

        }


        /* =========================================================
           SAVE / UNSAVE
           ========================================================= */

        function toggleSaved(id) {

            const ids =
                loadSavedIds();

            const index =
                ids.indexOf(id);

            if (index === -1) {

                ids.push(id);

                saveSavedIds(ids);

                showToast(
                    "Advertisement saved."
                );

            } else {

                ids.splice(index, 1);

                saveSavedIds(ids);

                showToast(
                    "Advertisement removed from saved."
                );

            }

            renderAds();

        }


        /* =========================================================
           SHOW SAVED ADS
           ========================================================= */

        function showSavedAds() {

            showingSavedOnly = true;

            activeCategory = "all";

            document
                .querySelectorAll(".tab")
                .forEach(tab => {

                    tab.classList.remove(
                        "active"
                    );

                });

            const allTab =
                document.querySelector(
                    '.tab[data-category="all"]'
                );

            if (allTab) {

                allTab.classList.add(
                    "active"
                );

            }

            const search =
                document.getElementById(
                    "searchInput"
                );

            if (search) {
                search.value = "";
            }

            renderAds();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            showToast(
                "Showing your saved advertisements."
            );

        }


        /* =========================================================
           VIEW
           ========================================================= */

        function registerView(id) {

            const ads =
                loadAds();

            const ad =
                ads.find(
                    item => item.id === id
                );

            if (!ad) {
                return;
            }

            ad.views =
                Number(ad.views || 0) + 1;

            saveAds(ads);

        }


        function visitAd(id) {

            registerView(id);

            showToast(
                "Advertisement opened."
            );

        }


        /* =========================================================
           DELETE USER AD
           ========================================================= */

        function deleteAd(id) {

            const ads =
                loadAds();

            const ad =
                ads.find(
                    item => item.id === id
                );

            if (!ad || !ad.userCreated) {

                showToast(
                    "This advertisement cannot be deleted here."
                );

                return;

            }

            const confirmed =
                window.confirm(
                    "Delete this advertisement?"
                );

            if (!confirmed) {
                return;
            }

            const updated =
                ads.filter(
                    item => item.id !== id
                );

            saveAds(updated);


            const savedIds =
                loadSavedIds()
                    .filter(
                        savedId =>
                            savedId !== id
                    );

            saveSavedIds(savedIds);

            renderAds();

            showToast(
                "Advertisement deleted."
            );

        }


        /* =========================================================
           OPEN CREATE AD
           ========================================================= */

        function openCreateAd() {

            const modal =
                document.getElementById(
                    "createAdModal"
                );

            if (!modal) {
                return;
            }

            modal.classList.add("show");

            document.body.style.overflow =
                "hidden";

            setTimeout(() => {

                const first =
                    document.getElementById(
                        "businessName"
                    );

                if (first) {
                    first.focus();
                }

            }, 100);

        }


        /* =========================================================
           CLOSE CREATE AD
           ========================================================= */

        function closeCreateAd() {

            const modal =
                document.getElementById(
                    "createAdModal"
                );

            if (modal) {

                modal.classList.remove(
                    "show"
                );

            }

            document.body.style.overflow =
                "";

        }


        function closeModalFromOverlay(event) {

            if (
                event.target &&
                event.target.id ===
                    "createAdModal"
            ) {

                closeCreateAd();

            }

        }


        /* =========================================================
           IMAGE PREVIEW
           ========================================================= */

        function previewImage(event) {

            const file =
                event.target.files &&
                event.target.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {

                showToast(
                    "Please select an image file."
                );

                event.target.value = "";

                return;

            }

            const reader =
                new FileReader();

            reader.onload = function(e) {

                selectedImageData =
                    e.target.result;

                const preview =
                    document.getElementById(
                        "imagePreview"
                    );

                const placeholder =
                    document.getElementById(
                        "uploadPlaceholder"
                    );

                if (preview) {

                    preview.src =
                        selectedImageData;

                    preview.classList.add(
                        "show"
                    );

                }

                if (placeholder) {

                    placeholder.classList.add(
                        "hidden"
                    );

                }

            };

            reader.readAsDataURL(file);

        }


        /* =========================================================
           CREATE AD
           ========================================================= */

        function submitAd(event) {

            event.preventDefault();

            const businessName =
                document
                    .getElementById(
                        "businessName"
                    )
                    .value
                    .trim();

            const category =
                document
                    .getElementById(
                        "businessCategory"
                    )
                    .value;

            const title =
                document
                    .getElementById(
                        "adTitle"
                    )
                    .value
                    .trim();

            const description =
                document
                    .getElementById(
                        "adDescription"
                    )
                    .value
                    .trim();

            const city =
                document
                    .getElementById(
                        "adCity"
                    )
                    .value
                    .trim();

            const offer =
                document
                    .getElementById(
                        "adOffer"
                    )
                    .value
                    .trim();

            const phone =
                document
                    .getElementById(
                        "adPhone"
                    )
                    .value
                    .trim();

            const website =
                document
                    .getElementById(
                        "adWebsite"
                    )
                    .value
                    .trim();


            if (
                !businessName ||
                !category ||
                !title ||
                !description ||
                !city
            ) {

                showToast(
                    "Please complete all required fields."
                );

                return;

            }


            const newAd = {

                id:
                    "user-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2, 9),

                businessName:
                    businessName,

                category:
                    category,

                title:
                    title,

                description:
                    description,

                city:
                    city,

                hours:
                    "Contact Business",

                rating:
                    "",

                reviews:
                    "",

                offer:
                    offer,

                phone:
                    phone,

                website:
                    website,

                image:
                    selectedImageData || "",

                emoji:
                    getCategoryEmoji(
                        category
                    ),

                verified:
                    false,

                featured:
                    false,

                userCreated:
                    true,

                views:
                    0,

                createdAt:
                    new Date().toISOString()

            };


            const ads =
                loadAds();

            ads.unshift(
                newAd
            );

            saveAds(ads);


            closeCreateAd();


            resetAdForm();


            activeCategory =
                "all";

            showingSavedOnly =
                false;


            document
                .querySelectorAll(".tab")
                .forEach(tab => {

                    tab.classList.remove(
                        "active"
                    );

                });


            const allTab =
                document.querySelector(
                    '.tab[data-category="all"]'
                );

            if (allTab) {

                allTab.classList.add(
                    "active"
                );

            }


            const search =
                document.getElementById(
                    "searchInput"
                );

            if (search) {
                search.value = "";
            }


            renderAds();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


            showToast(
                "Your advertisement was published successfully."
            );

        }


        /* =========================================================
           CATEGORY EMOJI
           ========================================================= */

        function getCategoryEmoji(
            category
        ) {

            switch (category) {

                case "restaurant":
                    return "🍕";

                case "shop":
                    return "🛍️";

                case "service":
                    return "🛠️";

                default:
                    return "📢";

            }

        }


        /* =========================================================
           RESET FORM
           ========================================================= */

        function resetAdForm() {

            const form =
                document.getElementById(
                    "adForm"
                );

            if (form) {
                form.reset();
            }


            selectedImageData =
                "";


            const preview =
                document.getElementById(
                    "imagePreview"
                );

            if (preview) {

                preview.src =
                    "";

                preview.classList.remove(
                    "show"
                );

            }


            const placeholder =
                document.getElementById(
                    "uploadPlaceholder"
                );

            if (placeholder) {

                placeholder.classList.remove(
                    "hidden"
                );

            }

        }


        /* =========================================================
           SEARCH
           ========================================================= */

        function focusSearch() {

            const search =
                document.getElementById(
                    "searchInput"
                );

            if (!search) {
                return;
            }

            search.focus();

            search.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }


        /* =========================================================
           HOME
           ========================================================= */

        function goHome() {

            window.location.href =
                "index.html";

        }


        /* =========================================================
           PROFILE
           ========================================================= */

        function goProfile() {

            window.location.href =
                "profile.html";

        }


        /* =========================================================
           TOAST
           ========================================================= */

        let toastTimer = null;


        function showToast(message) {

            const toast =
                document.getElementById(
                    "toast"
                );

            if (!toast) {
                return;
            }

            toast.textContent =
                message;

            toast.classList.add(
                "show"
            );


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(
                    () => {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    2600
                );

        }


        /* =========================================================
           KEYBOARD
           ========================================================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeCreateAd();

                }

            }
        );


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                renderAds();

            }
        );

    </script>

</body>
                    </html>
