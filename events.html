<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="HAVKAR Events - Discover, create and join local events."
    >

    <meta name="theme-color" content="#689f38">

    <title>HAVKAR - Events</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        :root {
            --primary: #689f38;
            --primary-light: #7cb342;
            --primary-dark: #558b2f;
            --primary-soft: #e8f5e9;

            --text: #252525;
            --text-secondary: #666;
            --text-muted: #999;

            --background: #f5f6f4;
            --surface: #ffffff;
            --border: #e5e5e5;

            --danger: #d32f2f;
            --warning: #f9a825;

            --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
            --shadow-md: 0 6px 22px rgba(0,0,0,.10);

            --radius-sm: 10px;
            --radius-md: 15px;
            --radius-lg: 20px;

            --nav-height: 72px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: calc(var(--nav-height) + 20px);
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================== */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-dark),
                    var(--primary-light)
                );

            color: white;

            padding:
                calc(12px + env(safe-area-inset-top))
                16px
                12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 2px 12px rgba(0,0,0,.15);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .back-btn,
        .icon-btn {
            border: 0;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            background: transparent;
            border-radius: 50%;
            font-size: 1.35rem;
        }

        .back-btn:active,
        .icon-btn:active {
            transform: scale(.94);
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 750;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,.17);
            font-size: 1rem;
        }

        /* =========================
           SEARCH
        ========================== */

        .search-section {
            background: var(--surface);
            padding: 14px 16px 12px;
            border-bottom: 1px solid #eee;
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            height: 48px;
            padding: 0 44px 0 44px;

            border: 1.5px solid #ddd;
            border-radius: 25px;

            background: #fafafa;
            color: var(--text);

            outline: none;
            transition: .2s;
        }

        .search-input:focus {
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 0 0 3px rgba(124,179,66,.12);
        }

        .clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);

            width: 32px;
            height: 32px;

            border: 0;
            border-radius: 50%;

            background: #eee;
            color: #666;

            display: none;
            align-items: center;
            justify-content: center;
        }

        .clear-search.show {
            display: flex;
        }

        /* =========================
           CATEGORY TABS
        ========================== */

        .tabs {
            background: var(--surface);
            display: flex;
            gap: 9px;

            padding: 8px 16px 15px;

            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 0 0 auto;

            border: 0;
            border-radius: 22px;

            padding: 9px 16px;

            background: #f3f3f3;
            color: #444;

            font-size: .82rem;
            font-weight: 650;

            white-space: nowrap;
            transition: .2s;
        }

        .tab.active {
            background: var(--primary-light);
            color: white;
            box-shadow: 0 3px 10px rgba(124,179,66,.25);
        }

        .tab:active {
            transform: scale(.97);
        }

        /* =========================
           TOOLBAR
        ========================== */

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px 16px 4px;
        }

        .result-count {
            font-size: .88rem;
            color: var(--text-secondary);
        }

        .sort-btn {
            border: 0;
            background: white;
            color: #555;

            padding: 8px 11px;
            border-radius: 10px;

            display: flex;
            align-items: center;
            gap: 7px;

            box-shadow: var(--shadow-sm);
            font-size: .8rem;
            font-weight: 600;
        }

        /* =========================
           CONTENT
        ========================== */

        .content {
            padding: 10px 16px 100px;
        }

        .event-card {
            position: relative;

            background: var(--surface);
            border-radius: var(--radius-md);

            overflow: hidden;
            margin-bottom: 16px;

            box-shadow: var(--shadow-sm);

            transition:
                transform .2s,
                box-shadow .2s;
        }

        .event-card:active {
            transform: scale(.995);
        }

        .event-image {
            position: relative;

            height: 175px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #c5e1a5
                );

            font-size: 4.5rem;
        }

        .event-image.music {
            background:
                linear-gradient(135deg,#d9eafd,#b5d1f5);
        }

        .event-image.cultural {
            background:
                linear-gradient(135deg,#f4e1ff,#dfbdf0);
        }

        .event-image.sports {
            background:
                linear-gradient(135deg,#d9f1dc,#b8dfbc);
        }

        .event-image.food {
            background:
                linear-gradient(135deg,#fff0d5,#ffd59a);
        }

        .event-image.community {
            background:
                linear-gradient(135deg,#e4e1ff,#c6c0f0);
        }

        .event-category {
            position: absolute;
            left: 12px;
            top: 12px;

            padding: 6px 10px;

            border-radius: 20px;

            background: rgba(255,255,255,.92);
            color: var(--primary-dark);

            font-size: .7rem;
            font-weight: 750;

            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .favorite-btn {
            position: absolute;
            right: 12px;
            top: 12px;

            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 50%;

            background: rgba(255,255,255,.94);
            color: #777;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .favorite-btn.active {
            color: #e53935;
        }

        .event-content {
            padding: 15px;
        }

        .event-date-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 6px 10px;

            background: var(--primary-light);
            color: white;

            border-radius: 8px;

            font-size: .72rem;
            font-weight: 750;

            margin-bottom: 10px;
        }

        .event-title {
            font-size: 1.1rem;
            font-weight: 750;
            color: #252525;

            line-height: 1.3;

            margin-bottom: 6px;
        }

        .event-organizer {
            font-size: .82rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .event-details {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 13px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: .82rem;
            color: #666;
        }

        .detail-item i {
            width: 18px;
            text-align: center;
            color: var(--primary-light);
        }

        .event-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding-top: 12px;

            border-top: 1px solid #f0f0f0;
        }

        .attendees {
            font-size: .78rem;
            color: #777;
        }

        .event-price {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .event-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .event-action-btn {
            flex: 1;

            border: 1px solid #ddd;
            background: white;

            border-radius: 10px;

            padding: 9px;

            font-size: .78rem;
            font-weight: 650;

            color: #555;
        }

        .event-action-btn.primary {
            background: var(--primary-light);
            border-color: var(--primary-light);
            color: white;
        }

        .event-action-btn.interested.active {
            background: var(--primary-soft);
            border-color: #c5e1a5;
            color: var(--primary-dark);
        }

        /* =========================
           EMPTY STATE
        ========================== */

        .empty-state {
            display: none;
            text-align: center;
            padding: 55px 20px;
        }

        .empty-state.show {
            display: block;
        }

        .empty-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;

            margin: 0 auto 16px;

            background: var(--primary-soft);
            color: var(--primary);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1.8rem;
        }

        .empty-state h3 {
            font-size: 1.05rem;
            margin-bottom: 7px;
        }

        .empty-state p {
            color: #888;
            font-size: .85rem;
            line-height: 1.5;
        }

        /* =========================
           FAB
        ========================== */

        .fab-button {
            position: fixed;
            right: 18px;
            bottom: calc(var(--nav-height) + 18px);

            width: 62px;
            height: 62px;

            border: 0;
            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-dark),
                    var(--primary-light)
                );

            color: white;

            font-size: 1.5rem;

            box-shadow:
                0 7px 25px rgba(104,159,56,.38);

            z-index: 90;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab-button:active {
            transform: scale(.93);
        }

        /* =========================
           BOTTOM NAV
        ========================== */

        .bottom-nav {
            position: fixed;
            z-index: 100;

            bottom: 0;
            left: 0;
            right: 0;

            height: var(--nav-height);

            background: rgba(255,255,255,.97);

            display: flex;
            justify-content: space-around;
            align-items: center;

            padding-bottom: env(safe-area-inset-bottom);

            box-shadow: 0 -2px 14px rgba(0,0,0,.09);
        }

        .nav-item {
            flex: 1;

            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 5px;

            color: #999;

            font-size: .7rem;
            font-weight: 600;

            border: 0;
            background: transparent;
        }

        .nav-item i {
            font-size: 1.25rem;
        }

        .nav-item.active {
            color: var(--primary-light);
        }

        /* =========================
           MODAL
        ========================== */

        .modal-backdrop {
            position: fixed;
            z-index: 500;

            inset: 0;

            background: rgba(0,0,0,.48);

            display: none;
            align-items: flex-end;
            justify-content: center;

            padding: 0;
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 620px;

            max-height: 92vh;
            overflow-y: auto;

            background: white;

            border-radius: 22px 22px 0 0;

            animation: slideUp .25s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 2;

            background: white;

            padding: 16px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #eee;
        }

        .modal-title {
            font-size: 1.05rem;
            font-weight: 750;
        }

        .modal-close {
            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 50%;

            background: #f2f2f2;
            color: #555;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 18px;
        }

        /* =========================
           FORM
        ========================== */

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;

            margin-bottom: 7px;

            font-size: .82rem;
            font-weight: 700;
            color: #555;
        }

        .required {
            color: #d32f2f;
        }

        .form-control {
            width: 100%;

            min-height: 46px;

            padding: 11px 13px;

            border: 1.5px solid #ddd;
            border-radius: 11px;

            background: #fff;
            color: #333;

            outline: none;

            transition: .2s;
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .form-control:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(124,179,66,.12);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            min-height: 46px;

            border: 0;
            border-radius: 11px;

            padding: 0 16px;

            font-weight: 700;
            font-size: .88rem;
        }

        .btn-secondary {
            flex: 1;
            background: #f1f1f1;
            color: #555;
        }

        .btn-primary {
            flex: 1.5;
            background:
                linear-gradient(
                    135deg,
                    var(--primary-dark),
                    var(--primary-light)
                );
            color: white;
        }

        /* =========================
           EVENT DETAIL
        ========================== */

        .detail-hero {
            height: 190px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 5rem;

            margin-bottom: 16px;
        }

        .detail-title {
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .detail-organizer {
            color: #777;
            font-size: .86rem;
            margin-bottom: 18px;
        }

        .detail-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;

            padding: 12px 0;

            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: 0;
        }

        .detail-row i {
            width: 22px;
            color: var(--primary-light);
            margin-top: 2px;
        }

        .detail-row-content strong {
            display: block;
            font-size: .8rem;
            color: #999;
            margin-bottom: 3px;
        }

        .detail-row-content span {
            font-size: .88rem;
            color: #333;
        }

        .detail-description {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #eee;
        }

        .detail-description h3 {
            font-size: .95rem;
            margin-bottom: 8px;
        }

        .detail-description p {
            color: #666;
            font-size: .87rem;
            line-height: 1.65;
        }

        .detail-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .detail-buttons .btn {
            flex: 1;
        }

        /* =========================
           FILTER MODAL
        ========================== */

        .filter-option {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 14px 0;

            border-bottom: 1px solid #eee;
        }

        .filter-option:last-child {
            border-bottom: 0;
        }

        .filter-option label {
            font-size: .9rem;
            font-weight: 600;
        }

        .filter-option input,
        .filter-option select {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 9px;
            background: white;
        }

        /* =========================
           TOAST
        ========================== */

        .toast {
            position: fixed;
            z-index: 1000;

            left: 16px;
            right: 16px;

            bottom: calc(var(--nav-height) + 18px);

            max-width: 500px;
            margin: auto;

            padding: 13px 15px;

            border-radius: 12px;

            background: #252525;
            color: white;

            display: flex;
            align-items: center;
            gap: 10px;

            font-size: .82rem;
            font-weight: 600;

            box-shadow: 0 8px 25px rgba(0,0,0,.2);

            opacity: 0;
            transform: translateY(20px);

            pointer-events: none;

            transition: .25s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success i {
            color: #9ccc65;
        }

        .toast.error i {
            color: #ef5350;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (min-width: 700px) {

            .content {
                max-width: 700px;
                margin: 0 auto;
            }

            .search-section,
            .tabs,
            .toolbar {
                padding-left: calc((100% - 700px) / 2);
                padding-right: calc((100% - 700px) / 2);
            }

            .event-image {
                height: 220px;
            }

            .modal {
                margin-bottom: 0;
                border-radius: 20px;
            }

            .modal-backdrop {
                align-items: center;
                padding: 20px;
            }
        }

        @media (max-width: 420px) {

            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .event-image {
                height: 155px;
            }

            .event-details {
                gap: 6px;
            }

            .event-footer {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="header-left">

            <button
                class="back-btn"
                type="button"
                onclick="goHome()"
                aria-label="Back"
            >
                <i class="fas fa-arrow-left"></i>
            </button>

            <h1>Events</h1>

        </div>

        <div class="header-right">

            <button
                class="icon-btn"
                type="button"
                onclick="openDateFilter()"
                aria-label="Calendar"
            >
                <i class="fas fa-calendar"></i>
            </button>

            <button
                class="icon-btn"
                type="button"
                onclick="openFilterModal()"
                aria-label="Filter"
            >
                <i class="fas fa-sliders"></i>
            </button>

        </div>

    </header>


    <!-- =========================
         SEARCH
    ========================== -->

    <section class="search-section">

        <div class="search-wrapper">

            <i class="fas fa-search search-icon"></i>

            <input
                id="searchInput"
                class="search-input"
                type="search"
                placeholder="Search events..."
                autocomplete="off"
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button"
                onclick="clearSearch()"
                aria-label="Clear search"
            >
                <i class="fas fa-times"></i>
            </button>

        </div>

    </section>


    <!-- =========================
         CATEGORY TABS
    ========================== -->

    <div class="tabs" id="categoryTabs">

        <button
            class="tab active"
            data-category="all"
            type="button"
        >
            All Events
        </button>

        <button
            class="tab"
            data-category="music"
            type="button"
        >
            Music
        </button>

        <button
            class="tab"
            data-category="cultural"
            type="button"
        >
            Cultural
        </button>

        <button
            class="tab"
            data-category="sports"
            type="button"
        >
            Sports
        </button>

        <button
            class="tab"
            data-category="food"
            type="button"
        >
            Food
        </button>

        <button
            class="tab"
            data-category="community"
            type="button"
        >
            Community
        </button>

    </div>


    <!-- =========================
         TOOLBAR
    ========================== -->

    <div class="toolbar">

        <div
            class="result-count"
            id="resultCount"
        >
            6 events
        </div>

        <button
            class="sort-btn"
            type="button"
            onclick="toggleSort()"
        >
            <i class="fas fa-arrow-down-wide-short"></i>
            <span id="sortLabel">Soonest</span>
        </button>

    </div>


    <!-- =========================
         EVENTS
    ========================== -->

    <main class="content">

        <div id="eventsContainer"></div>

        <div
            id="emptyState"
            class="empty-state"
        >

            <div class="empty-icon">
                <i class="fas fa-calendar-xmark"></i>
            </div>

            <h3>No events found</h3>

            <p>
                Try another search, category or date.
            </p>

        </div>

    </main>


    <!-- =========================
         CREATE EVENT FAB
    ========================== -->

    <button
        class="fab-button"
        type="button"
        onclick="openCreateEventModal()"
        aria-label="Create event"
    >
        <i class="fas fa-plus"></i>
    </button>


    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <nav class="bottom-nav">

        <button
            class="nav-item"
            type="button"
            onclick="goHome()"
        >
            <i class="fas fa-home"></i>
            <span>Home</span>
        </button>

        <button
            class="nav-item active"
            type="button"
        >

    <script>

        /* =====================================================
           HAVKAR EVENTS ENGINE
        ====================================================== */

        const STORAGE_KEY = "havkar_created_events_v1";
        const FAVORITES_KEY = "havkar_event_favorites_v1";
        const INTERESTED_KEY = "havkar_event_interested_v1";


        let currentCategory = "all";
        let currentSort = "soonest";
        let searchTerm = "";


        /* =====================================================
           BASE EVENTS
        ====================================================== */

        const baseEvents = [

            {
                id: "event-music-001",
                title: "Italian Music Festival",
                category: "music",
                icon: "🎵",
                date: "2026-09-19",
                time: "20:00",

                interested: 245,

            },

            {

                icon: "🍕",
                date: "2026-09-20",
                time: "12:00",
                location: "Parco Sempione, Milan",
                organizer: "Taste of Italy",
                attendees: 1000,
                interested: 680,
                price: "Free",
                description:
                    "Discover traditional Italian food, local producers, street food and family activities."
            },

            {
                id: "event-cultural-001",
                title: "Art Exhibition Opening",
                category: "cultural",
                icon: "🎨",
                date: "2026-09-25",
                time: "18:00",
                location: "Brera District, Milan",
                organizer: "Galleria d'Arte",
                attendees: 150,
                interested: 89,
                price: "€15",
                description:
                    "An opening night featuring contemporary artists and an evening reception."
            },

            {
                id: "event-sports-001",
                title: "Community Football Match",
                category: "sports",
                icon: "⚽",
                date: "2026-09-26",
                time: "15:00",
                location: "San Siro, Milan",
                organizer: "Milano Sports Club",
                attendees: 300,
                interested: 210,
                price: "€10",
                description:
                    "A community football event welcoming players and supporters from across Milan."
            },

            {
                id: "event-cultural-002",
                title: "Theater Performance",
                category: "cultural",
                icon: "🎭",
                date: "2026-09-27",
                time: "19:00",
                location: "Teatro alla Scala, Milan",
                organizer: "Teatro alla Scala",
                attendees: 200,
                interested: 156,
                price: "€40",
                description:
                    "An evening theatrical performance in one of Milan's most famous cultural venues."
            },

            {
                id: "event-community-001",
                title: "Iranian Community Gathering",
                category: "community",
                icon: "🎉",
                date: "2026-10-02",
                time: "21:00",
                location: "Community Center, Milan",
                organizer: "Persian Cultural Center",
                attendees: 120,
                interested: 95,
                price: "Free",
                description:
                    "A friendly community gathering with food, conversation, music and cultural activities."
            }

        ];


        /* =====================================================
           LOCAL STORAGE
        ====================================================== */

        function getCreatedEvents() {

            try {

                const data =
                    localStorage.getItem(STORAGE_KEY);

                return data
                    ? JSON.parse(data)
                    : [];

            } catch (error) {

                console.error(error);

                return [];
            }
        }


        function saveCreatedEvents(events) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(events)
            );
        }


        function getFavorites() {

            try {

                return JSON.parse(
                    localStorage.getItem(FAVORITES_KEY)
                ) || [];

            } catch {

                return [];
            }
        }


        function saveFavorites(items) {

            localStorage.setItem(
                FAVORITES_KEY,
                JSON.stringify(items)
            );
        }


        function getInterested() {

            try {

                return JSON.parse(
                    localStorage.getItem(INTERESTED_KEY)
                ) || [];

            } catch {

                return [];
            }
        }


        function saveInterested(items) {

            localStorage.setItem(
                INTERESTED_KEY,
                JSON.stringify(items)
            );
        }


        function getAllEvents() {

            return [
                ...getCreatedEvents(),
                ...baseEvents
            ];
        }


        /* =====================================================
           DATE HELPERS
        ====================================================== */

        function formatDate(dateString, timeString) {

            const date = new Date(
                `${dateString}T${timeString || "00:00"}`
            );

            if (Number.isNaN(date.getTime())) {
                return dateString;
            }

            return new Intl.DateTimeFormat(
                "en-US",
                {
                    weekday: "short",
                    month: "short",
                    day: "numeric"
                }
            ).format(date);

        }


        function formatDateTime(dateString, timeString) {

            const date = new Date(
                `${dateString}T${timeString || "00:00"}`
            );

            if (Number.isNaN(date.getTime())) {
                return `${dateString} ${timeString || ""}`;
            }

            return new Intl.DateTimeFormat(
                "en-US",
                {
                    weekday: "long",
                    month: "long",
                    day: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                }
            ).format(date);

        }


        function getTimestamp(event) {

            const value =
                new Date(
                    `${event.date}T${event.time || "00:00"}`
                ).getTime();

            return Number.isNaN(value)
                ? Number.MAX_SAFE_INTEGER
                : value;
        }


        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =====================================================
           CATEGORY
        ====================================================== */

        function categoryName(category) {

            const names = {
                music: "Music",
                cultural: "Cultural",
                sports: "Sports",
                food: "Food",
                community: "Community"
            };

            return names[category] || "Event";
        }


        /* =====================================================
           RENDER
        ====================================================== */

        function renderEvents() {

            const container =
                document.getElementById("eventsContainer");

            const empty =
                document.getElementById("emptyState");

            let events = getAllEvents();

            const filterDate =
                document.getElementById("filterDate")?.value || "";

            const filterPrice =
                document.getElementById("filterPrice")?.value || "all";

            const filterCategory =
                document.getElementById("filterCategory")?.value || "all";


            /* Search */

            if (searchTerm) {

                const query =
                    searchTerm.toLowerCase();

                events = events.filter(event =>

                    [
                        event.title,
                        event.location,
                        event.organizer,
                        event.description,
                        categoryName(event.category)
                    ]
                    .join(" ")
                    .toLowerCase()
                    .includes(query)

                );

            }


            /* Category */

            const selectedCategory =
                currentCategory !== "all"
                    ? currentCategory
                    : filterCategory !== "all"
                        ? filterCategory
                        : "all";


            if (selectedCategory !== "all") {

                events =
                    events.filter(
                        event =>
                            event.category === selectedCategory
                    );

            }


            /* Date */

            if (filterDate) {

                events =
                    events.filter(
                        event =>
                            event.date === filterDate
                    );

            }


            /* Price */

            if (filterPrice === "free") {

                events =
                    events.filter(
                        event =>
                            String(event.price)
                                .toLowerCase() === "free"
                    );

            }

            if (filterPrice === "paid") {

                events =
                    events.filter(
                        event =>
                            String(event.price)
                                .toLowerCase() !== "free"
                    );

            }


            /* Sort */

            if (currentSort === "soonest") {

                events.sort(
                    (a,b) =>
                        getTimestamp(a) -
                        getTimestamp(b)
                );

            } else if (currentSort === "latest") {

                events.sort(
                    (a,b) =>
                        getTimestamp(b) -
                        getTimestamp(a)
                );

            } else if (currentSort === "popular") {

                events.sort(
                    (a,b) =>
                        Number(b.interested || 0) -
                        Number(a.interested || 0)
                );

            }


            container.innerHTML =
                events
                    .map(renderEventCard)
                    .join("");


            document.getElementById("resultCount").textContent =
                `${events.length} ${events.length === 1 ? "event" : "events"}`;


            if (events.length === 0) {

                empty.classList.add("show");

            } else {

                empty.classList.remove("show");

            }

        }


        function renderEventCard(event) {

            const favorites = getFavorites();
            const interested = getInterested();

            const isFavorite =
                favorites.includes(event.id);

            const isInterested =
                interested.includes(event.id);


            return `

                <article class="event-card">

                    <div
                        class="event-image ${escapeHtml(event.category)}"
                        onclick="openEventDetails('${escapeHtml(event.id)}')"
                    >

                        <div class="event-category">
                            ${escapeHtml(categoryName(event.category))}
                        </div>

                        <button
                            class="favorite-btn ${isFavorite ? "active" : ""}"
                            type="button"
                            onclick="event.stopPropagation(); toggleFavorite('${escapeHtml(event.id)}')"
                            aria-label="Favorite"
                        >
                            <i class="${isFavorite ? "fas" : "far"} fa-heart"></i>
                        </button>

                        ${escapeHtml(event.icon || "📅")}

                    </div>


                    <div class="event-content">

                        <div class="event-date-badge">

                            <i class="far fa-calendar"></i>

                            ${escapeHtml(
                                formatDate(event.date,event.time)
                            )}

                            •
                            ${escapeHtml(event.time || "")}

                        </div>


                        <div
                            class="event-title"
                            onclick="openEventDetails('${escapeHtml(event.id)}')"
                        >
                            ${escapeHtml(event.title)}
                        </div>


                        <div class="event-organizer">

                            <i class="far fa-user"></i>

                            Organized by
                            ${escapeHtml(event.organizer || "HAVKAR Community")}

                        </div>


                        <div class="event-details">

                            <div class="detail-item">

                                <i class="fas fa-location-dot"></i>

                                <span>
                                    ${escapeHtml(event.location)}
                                </span>

                            </div>


                            <div class="detail-item">

                                <i class="fas fa-users"></i>

                                <span>
                                    ${Number(event.attendees || 0).toLocaleString()}
                                    expected
                                </span>

                            </div>

                        </div>


                        <div class="event-footer">

                            <div class="attendees">

                                <i class="fas fa-heart"></i>

                                ${Number(event.interested || 0).toLocaleString()}
                                interested

                            </div>


                            <div class="event-price">

                                ${escapeHtml(event.price || "Free")}

                            </div>

                        </div>


                        <div class="event-actions">

                            <button
                                class="event-action-btn interested ${isInterested ? "active" : ""}"
                                type="button"
                                onclick="toggleInterested('${escapeHtml(event.id)}')"
                            >
                                <i class="${isInterested ? "fas" : "far"} fa-star"></i>

                                ${isInterested ? "Interested" : "I'm Interested"}

                            </button>


                            <button
                                class="event-action-btn primary"
                                type="button"
                                onclick="openEventDetails('${escapeHtml(event.id)}')"
                            >
                                View Details
                            </button>

                        </div>

                    </div>

                </article>

            `;

        }


        /* =====================================================
           SEARCH
        ====================================================== */

        document
            .getElementById("searchInput")
            .addEventListener("input", function() {

                searchTerm =
                    this.value.trim();

                document
                    .getElementById("clearSearch")
                    .classList.toggle(
                        "show",
                        searchTerm.length > 0
                    );

                renderEvents();

            });


        function clearSearch() {

            const input =
                document.getElementById("searchInput");

            input.value = "";

            searchTerm = "";

            document
                .getElementById("clearSearch")
                .classList.remove("show");

            renderEvents();

            input.focus();
        }


        /* =====================================================
           CATEGORY TABS
        ====================================================== */

        document
            .querySelectorAll(".tab")
            .forEach(tab => {

                tab.addEventListener(
                    "click",
                    function() {

                        document
                            .querySelectorAll(".tab")
                            .forEach(item =>
                                item.classList.remove("active")
                            );

                        this.classList.add("active");

                        currentCategory =
                            this.dataset.category;

                        renderEvents();

                    }
                );

            });


        /* =====================================================
           SORT
        ====================================================== */

        function toggleSort() {

            if (currentSort === "soonest") {

                currentSort = "popular";

                document.getElementById("sortLabel")
                    .textContent = "Popular";

            } else if (currentSort === "popular") {

                currentSort = "latest";

                document.getElementById("sortLabel")
                    .textContent = "Latest";

            } else {

                currentSort = "soonest";

                document.getElementById("sortLabel")
                    .textContent = "Soonest";

            }

            renderEvents();

        }


        /* =====================================================
           FAVORITES
        ====================================================== */

        function toggleFavorite(id) {

            let favorites =
                getFavorites();

            if (favorites.includes(id)) {

                favorites =
                    favorites.filter(
                        item => item !== id
                    );

                saveFavorites(favorites);

                showToast(
                    "Removed from favorites.",
                    "success"
                );

            } else {

                favorites.push(id);

                saveFavorites(favorites);

                showToast(
                    "Event saved to favorites.",
                    "success"
                );

            }

            renderEvents();

        }


        /* =====================================================
           INTERESTED
        ====================================================== */

        function toggleInterested(id) {

            let interested =
                getInterested();

            const events =
                getAllEvents();

            const event =
                events.find(item => item.id === id);


            if (!event) return;


            if (interested.includes(id)) {

                interested =
                    interested.filter(
                        item => item !== id
                    );

                event.interested =
                    Math.max(
                        0,
                        Number(event.interested || 0) - 1
                    );

                updateEventCounters(
                    event.id,
                    event.interested
                );

                showToast(
                    "Removed from your interested list.",
                    "success"
                );

            } else {

                interested.push(id);

                event.interested =
                    Number(event.interested || 0) + 1;

                updateEventCounters(
                    event.id,
                    event.interested
                );

                showToast(
                    "Added to your interested events.",
                    "success"
                );

            }

            saveInterested(interested);

            renderEvents();

        }


        function updateEventCounters(id, interested) {

            const created =
                getCreatedEvents();

            const index =
                created.findIndex(
                    event => event.id === id
                );

            if (index !== -1) {

                created[index].interested =
                    interested;

                saveCreatedEvents(created);

            }

        }


        /* =====================================================
           EVENT DETAILS
        ====================================================== */

        function openEventDetails(id) {

            const event =
                getAllEvents()
                    .find(item => item.id === id);

            if (!event) {

                showToast(
                    "Event could not be found.",
                    "error"
                );

                return;
            }


            const isCreated =
                getCreatedEvents()
                    .some(item => item.id === id);


            document.getElementById("detailContent")
                .innerHTML = `

                    <div
                        class="detail-hero ${escapeHtml(event.category)}"
                    >
                        ${escapeHtml(event.icon || "📅")}
                    </div>


                    <div class="event-category" style="display:inline-block;margin-bottom:10px;">
                        ${escapeHtml(categoryName(event.category))}
                    </div>


                    <div class="detail-title">
                        ${escapeHtml(event.title)}
                    </div>


                    <div class="detail-organizer">
                        Organized by
                        <strong>
                            ${escapeHtml(event.organizer || "HAVKAR Community")}
                        </strong>
                    </div>


                    <div class="detail-row">

                        <i class="far fa-calendar"></i>

                        <div class="detail-row-content">

                            <strong>DATE & TIME</strong>

                            <span>
                                ${escapeHtml(
                                    formatDateTime(
                                        event.date,
                                        event.time
                                    )
                                )}
                            </span>

                        </div>

                    </div>


                    <div class="detail-row">

                        <i class="fas fa-location-dot"></i>

                        <div class="detail-row-content">

                            <strong>LOCATION</strong>

                            <span>
                                ${escapeHtml(event.location)}
                            </span>

                        </div>

                    </div>


                    <div class="detail-row">

                        <i class="fas fa-users"></i>

                        <div class="detail-row-content">

                            <strong>ATTENDANCE</strong>

                            <span>
                                ${Number(event.attendees || 0).toLocaleString()}
                                expected attendees
                            </span>

                        </div>

                    </div>


                    <div class="detail-row">

                        <i class="fas fa-ticket"></i>

                        <div class="detail-row-content">

                            <strong>PRICE</strong>

                            <span>
                                ${escapeHtml(event.price || "Free")}
                            </span>

                        </div>

                    </div>


                    <div class="detail-description">

                        <h3>
                            About this event
                        </h3>

                        <p>
                            ${escapeHtml(event.description || "No description available.")}
                        </p>

                    </div>


                    <div class="detail-buttons">

                        <button
                            class="btn btn-secondary"
                            type="button"
                            onclick="shareEvent('${escapeHtml(event.id)}')"
                        >
                            <i class="fas fa-share-nodes"></i>
                            Share
                        </button>


                        <button
                            class="btn btn-primary"
                            type="button"
                            onclick="getTicket('${escapeHtml(event.id)}')"
                        >
                            <i class="fas fa-ticket"></i>
                            ${String(event.price).toLowerCase() === "free"
                                ? "Join Event"
                                : "Get Ticket"}
                        </button>

                    </div>


                    ${
                        isCreated
                        ? `
                            <button
                                class="btn"
                                style="
                                    width:100%;
                                    margin-top:10px;
                                    background:#ffebee;
                                    color:#c62828;
                                "
                                type="button"
                                onclick="deleteCreatedEvent('${escapeHtml(event.id)}')"
                            >
                                <i class="fas fa-trash"></i>
                                Delete My Event
                            </button>
                        `
                        : ""
                    }

                `;


            openModal("detailModal");

        }


        /* =====================================================
           CREATE EVENT
        ====================================================== */

        document
            .getElementById("createEventForm")
            .addEventListener("submit", function(e) {

                e.preventDefault();


                const title =
                    document.getElementById("eventTitle")
                        .value.trim();

                const category =
                    document.getElementById("eventCategory")
                        .value;

                const price =
                    document.getElementById("eventPrice")
                        .value.trim() || "Free";

                const date =
                    document.getElementById("eventDate")
                        .value;

                const time =
                    document.getElementById("eventTime")
                        .value;

                const location =
                    document.getElementById("eventLocation")
                        .value.trim();

                const organizer =
                    document.getElementById("eventOrganizer")
                        .value.trim() || "HAVKAR Community";

                const description =
                    document.getElementById("eventDescription")
                        .value.trim();

                const attendees =
                    Number(
                        document.getElementById("eventAttendees")
                            .value
                    ) || 0;


                if (
                    !title ||
                    !category ||
                    !date ||
                    !time ||
                    !location ||
                    !description
                ) {

                    showToast(
                        "Please complete all required fields.",
                        "error"
                    );

                    return;
                }


                const icons = {
                    music: "🎵",
                    cultural: "🎨",
                    sports: "⚽",
                    food: "🍕",
                    community: "🎉"
                };


                const newEvent = {

                    id:
                        "user-" +
                        Date.now() +
                        "-" +
                        Math.random()
                            .toString(36)
                            .slice(2,8),

                    title,
                    category,
                    icon: icons[category] || "📅",

                    date,
                    time,

                    location,
                    organizer,

                    attendees,

                    interested: 0,

                    price,

                    description

                };


                const created =
                    getCreatedEvents();

                created.unshift(newEvent);

                saveCreatedEvents(created);


                this.reset();

                closeModal("createModal");

                currentCategory = "all";

                document
                    .querySelectorAll(".tab")
                    .forEach(item =>
                        item.classList.remove("active")
                    );

                document
                    .querySelector('[data-category="all"]')
                    .classList.add("active");


                renderEvents();


                showToast(
                    "Your event was created successfully.",
                    "success"
                );

            });


        /* =====================================================
           DELETE USER EVENT
        ====================================================== */

        function deleteCreatedEvent(id) {

            const created =
                getCreatedEvents();

            const exists =
                created.some(
                    event => event.id === id
                );

            if (!exists) return;


            const updated =
                created.filter(
                    event => event.id !== id
                );

            saveCreatedEvents(updated);

            closeModal("detailModal");

            renderEvents();

            showToast(
                "Your event was deleted.",
                "success"
            );

        }


        /* =====================================================
           TICKETS
        ====================================================== */

        function getTicket(id) {

            const event =
                getAllEvents()
                    .find(item => item.id === id);

            if (!event) return;


            if (
                String(event.price)
                    .toLowerCase() === "free"
            ) {

                toggleInterested(id);

                showToast(
                    "You are marked as interested in this event.",
                    "success"
                );

                return;
            }


            showToast(
                "Ticket checkout will be connected to the HAVKAR payment system.",
                "success"
            );

        }


        function openTickets() {

            showToast(
                "My Tickets is ready for ticket integration.",
                "success"
            );

        }


        /* =====================================================
           SHARE
        ====================================================== */

        async function shareEvent(id) {

            const event =
                getAllEvents()
                    .find(item => item.id === id);

            if (!event) return;


            const text =
                `${event.title} - ${formatDateTime(event.date,event.time)} - ${event.location}`;


            if (
                navigator.share
            ) {

                try {

                    await navigator.share({

                        title: event.title,
                        text,
                        url: window.location.href

                    });

                    return;

                } catch (error) {

                    if (error.name === "AbortError") {
                        return;
                    }

                }

            }


            try {

                await navigator.clipboard.writeText(text);

                showToast(
                    "Event information copied.",
                    "success"
                );

            } catch {

                showToast(
                    "Sharing is not available on this device.",
                    "error"
                );

            }

        }


        /* =====================================================
           FILTER
        ====================================================== */

        function openFilterModal() {

            openModal("filterModal");

        }


        function openDateFilter() {

            openModal("filterModal");

            setTimeout(() => {

                document
                    .getElementById("filterDate")
                    .focus();

            }, 200);

        }


        function applyFilters() {

            renderEvents();

        }


        function resetFilters() {

            document
                .getElementById("filterDate")
                .value = "";

            document
                .getElementById("filterPrice")
                .value = "all";

            document
                .getElementById("filterCategory")
                .value = "all";


            currentCategory = "all";


            document
                .querySelectorAll(".tab")
                .forEach(tab =>
                    tab.classList.remove("active")
                );


            document
                .querySelector('[data-category="all"]')
                .classList.add("active");


            renderEvents();

        }


        /* =====================================================
           MODALS
        ====================================================== */

        function openCreateEventModal() {

            openModal("createModal");

        }


        function openModal(id) {

            const modal =
                document.getElementById(id);

            if (!modal) return;

            modal.classList.add("show");

            document.body.style.overflow = "hidden";

        }


        function closeModal(id) {

            const modal =
                document.getElementById(id);

            if (!modal) return;

            modal.classList.remove("show");

            document.body.style.overflow = "";

        }


        function backdropClose(event, id) {

            if (
                event.target ===
                document.getElementById(id)
            ) {

                closeModal(id);

            }

        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    document
                        .querySelectorAll(".modal-backdrop.show")
                        .forEach(modal =>
                            modal.classList.remove("show")
                        );

                    document.body.style.overflow = "";

                }

            }
        );


        /* =====================================================
           TOAST
        ====================================================== */

        let toastTimer;


        function showToast(message, type = "success") {

            const toast =
                document.getElementById("toast");

            const text =
                document.getElementById("toastMessage");


            text.textContent = message;

            toast.className =
                `toast ${type}`;


            const icon =
                toast.querySelector("i");

            icon.className =
                type === "error"
                    ? "fas fa-circle-exclamation"
                    : "fas fa-check-circle";


            requestAnimationFrame(() => {

                toast.classList.add("show");

            });


            clearTimeout(toastTimer);

            toastTimer =
                setTimeout(() => {

                    toast.classList.remove("show");

                }, 3000);

        }


        /* =====================================================
           NAVIGATION
        ====================================================== */

        function goHome() {

            window.location.href =
                "index.html";

        }


        function openProfile() {

            window.location.href =
                "profile.html";

        }


        /* =====================================================
           INITIALIZATION
        ====================================================== */

        function initializeEventsPage() {

            renderEvents();

        }


        initializeEventsPage();

    </script>

</body>
    </html>
